name: Cloudflare Oteryn Endpoints

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-oteryn-endpoints.yml
      - scripts/operations/cloudflare-oteryn-endpoints.sh
      - tests/operations/cloudflare-oteryn-endpoints/**
      - docs/contracts/PUBLIC_ENDPOINTS_CONTRACT.md
      - deploy/synology/PUBLIC_ENDPOINTS.md
      - docs/architecture/adr/0020-use-single-level-gateway-public-hostname.md
      - docs/operations/CLOUDFLARE_ENDPOINT_MANAGEMENT.md
      - docs/agents/tasks/active/OTERYN-20260801-cloudflare-edge-audit.md
  pull_request_target:
    branches:
      - main
    paths:
      - ops/triggers/cloudflare-oteryn-endpoints.md
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      mode:
        description: Audit current state or apply the fixed Oteryn endpoint contract
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      confirmation:
        description: For apply only, enter APPLY-OTERYN-CLOUDFLARE exactly
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-oteryn-endpoints-${{ github.event_name }}-${{ github.ref }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  AUDIT_COMMAND: /oteryn-cloudflare-endpoints audit
  APPLY_COMMAND: /oteryn-cloudflare-endpoints apply APPLY-OTERYN-CLOUDFLARE

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate fixed-scope Cloudflare automation
        run: bash tests/operations/cloudflare-oteryn-endpoints/run.sh

      - name: Reject legacy Gateway hostname reuse
        run: bash tests/operations/cloudflare-oteryn-endpoints/check-legacy-hostname.sh

      - name: Validate trusted trigger and result boundary
        run: python3 tests/operations/cloudflare-oteryn-endpoints/check-marker-workflow.py

  manage:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      CLOUDFLARE_APPLY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce production dispatch boundary
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "This workflow may manage Cloudflare only from main." >&2
            exit 1
          }
          [[ "$REQUESTED_MODE" == "audit" || "$REQUESTED_MODE" == "apply" ]] || {
            echo "Unsupported mode: $REQUESTED_MODE" >&2
            exit 1
          }
          if [[ "$REQUESTED_MODE" == "apply" ]]; then
            [[ "$CLOUDFLARE_APPLY_CONFIRMATION" == "APPLY-OTERYN-CLOUDFLARE" ]] || {
              echo "Apply confirmation is invalid." >&2
              exit 1
            }
          fi

      - name: Audit or reconcile canonical endpoints
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: bash scripts/operations/cloudflare-oteryn-endpoints.sh "$REQUESTED_MODE"

  marker-manage:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}

    steps:
      - name: Checkout trusted main implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Enforce exact marker boundary and run trusted operation
        id: operation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          [[ "$changed_files" == "ops/triggers/cloudflare-oteryn-endpoints.md" ]] || {
            echo "Marker PR must modify only ops/triggers/cloudflare-oteryn-endpoints.md." >&2
            exit 1
          }

          marker="$(git show "$HEAD_SHA:ops/triggers/cloudflare-oteryn-endpoints.md")"
          audit_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: audit\nconfirmation:'
          apply_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: apply\nconfirmation: APPLY-OTERYN-CLOUDFLARE'

          if [[ "$marker" == "$audit_marker" ]]; then
            requested_mode='audit'
            export CLOUDFLARE_APPLY_CONFIRMATION=''
          elif [[ "$marker" == "$apply_marker" ]]; then
            requested_mode='apply'
            export CLOUDFLARE_APPLY_CONFIRMATION='APPLY-OTERYN-CLOUDFLARE'
          else
            echo "Marker content is not an allowed exact audit/apply request." >&2
            exit 1
          fi

          raw_output="$(mktemp)"
          set +e
          bash scripts/operations/cloudflare-oteryn-endpoints.sh "$requested_mode" >"$raw_output" 2>&1
          exit_code=$?
          set -e

          {
            if [[ "$exit_code" == "0" ]]; then
              echo 'operation_status=success'
            else
              echo 'operation_status=failed'
            fi
            grep -E '^(mode|tunnel_status|tunnel_contract|www_dns|gateway_dns|legacy_gateway_dns|mutation)=' "$raw_output" || true
          } >endpoint-result.txt
          echo "exit_code=$exit_code" >>"$GITHUB_OUTPUT"

      - name: Publish sanitized endpoint result
        if: always() && steps.operation.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result="$(cat endpoint-result.txt 2>/dev/null || printf 'operation_status=failed')"
          body="$(printf '## Cloudflare endpoint operation\n\n```text\nrun_id=%s\n%s\n```\n\nTrusted base SHA: `%s`. Only bounded status fields are published.' "$GITHUB_RUN_ID" "$result" '${{ github.event.pull_request.base.sha }}')"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

      - name: Propagate operation failure
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1

  comment-manage:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.actor == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == '/oteryn-cloudflare-endpoints audit' ||
       github.event.comment.body == '/oteryn-cloudflare-endpoints apply APPLY-OTERYN-CLOUDFLARE')
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REQUEST_COMMENT: ${{ github.event.comment.body }}

    steps:
      - name: Checkout trusted default-branch implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate owner command, marker PR and run trusted operation
        id: operation
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          [[ "$base_ref" == 'main' && "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
            echo 'Command is restricted to same-repository PRs targeting main.' >&2
            exit 1
          }

          git fetch --no-tags origin "$head_sha"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          [[ "$changed_files" == 'ops/triggers/cloudflare-oteryn-endpoints.md' ]] || {
            echo 'Command PR must modify only the endpoint trigger marker.' >&2
            exit 1
          }

          marker="$(git show "$head_sha:ops/triggers/cloudflare-oteryn-endpoints.md")"
          audit_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: audit\nconfirmation:'
          apply_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: apply\nconfirmation: APPLY-OTERYN-CLOUDFLARE'

          if [[ "$REQUEST_COMMENT" == "$AUDIT_COMMAND" && "$marker" == "$audit_marker" ]]; then
            requested_mode='audit'
            export CLOUDFLARE_APPLY_CONFIRMATION=''
          elif [[ "$REQUEST_COMMENT" == "$APPLY_COMMAND" && "$marker" == "$apply_marker" ]]; then
            requested_mode='apply'
            export CLOUDFLARE_APPLY_CONFIRMATION='APPLY-OTERYN-CLOUDFLARE'
          else
            echo 'Comment and exact marker content do not authorize the same operation.' >&2
            exit 1
          fi

          raw_output="$(mktemp)"
          set +e
          bash scripts/operations/cloudflare-oteryn-endpoints.sh "$requested_mode" >"$raw_output" 2>&1
          exit_code=$?
          set -e

          {
            if [[ "$exit_code" == "0" ]]; then
              echo 'operation_status=success'
            else
              echo 'operation_status=failed'
            fi
            grep -E '^(mode|tunnel_status|tunnel_contract|www_dns|gateway_dns|legacy_gateway_dns|mutation)=' "$raw_output" || true
          } >endpoint-result.txt
          echo "exit_code=$exit_code" >>"$GITHUB_OUTPUT"
          echo "trusted_sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

      - name: Publish sanitized endpoint result
        if: always() && steps.operation.outcome != 'skipped'
        run: |
          set -euo pipefail
          result="$(cat endpoint-result.txt 2>/dev/null || printf 'operation_status=failed')"
          body="$(printf '## Cloudflare endpoint operation\n\n```text\nrun_id=%s\n%s\n```\n\nTrusted default-branch SHA: `%s`. Only bounded status fields are published.' "$GITHUB_RUN_ID" "$result" '${{ github.sha }}')"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

      - name: Propagate operation failure
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1
