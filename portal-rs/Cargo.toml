[workspace]
resolver = "3"
members = ["bin/oteryn-portal", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
publish = false
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[workspace.dependencies]
oteryn-ui = { path = "crates/ui" }
oteryn-core = { path = "crates/core" }
oteryn-db = { path = "crates/db" }
oteryn-web = { path = "crates/web" }
oteryn-identity = { path = "crates/identity" }
oteryn-gameauth = { path = "crates/gameauth" }
oteryn-characters = { path = "crates/characters" }
oteryn-content = { path = "crates/content" }
oteryn-wiki = { path = "crates/wiki" }
oteryn-community = { path = "crates/community" }
oteryn-wallet = { path = "crates/wallet" }
oteryn-store = { path = "crates/store" }
oteryn-payments = { path = "crates/payments" }
oteryn-support = { path = "crates/support" }
oteryn-atlas = { path = "crates/atlas" }
oteryn-world = { path = "crates/world" }
oteryn-admin = { path = "crates/admin" }
oteryn-downloads = { path = "crates/downloads" }
oteryn-notify = { path = "crates/notify" }
oteryn-internal-api = { path = "crates/internal-api" }
oteryn-player-api = { path = "crates/player-api" }
oteryn-gateway = { path = "crates/gateway" }
oteryn-bazaar = { path = "crates/bazaar" }
oteryn-hirelings = { path = "crates/hirelings" }
oteryn-playerdata = { path = "crates/playerdata" }
oteryn-minigames = { path = "crates/minigames" }

ed25519-dalek = { version = "2.2", features = ["rand_core"] }
serde_json_canonicalizer = "0.4.1"

# Debug builds (local runs and every CI test shard) optimize the league snapshot validation
# path. Without this, `oteryn-minigames` SeasonRow validation (per-character NFC and general
# category checks) took about 93 ms per 1000-standing season in a debug build, so reading 14
# full seasons came close to the 3 s league read bound and returned `Unavailable` on a loaded
# runner (l5_league_fourteen_full_seasons_are_complete). Each override alone had no effect
# (decode 92-93 ms per season); the three together bring it to about 17 ms.
[profile.dev.package.oteryn-minigames]
opt-level = 1

[profile.dev.package.unicode-normalization]
opt-level = 3

[profile.dev.package.unicode-general-category]
opt-level = 3
