[package]
name = "oteryn-community"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-ui.workspace = true
axum = "0.8.9"
oteryn-internal-api = { path = "../internal-api" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
regex = "1"
unicode-normalization = "0.1"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["macros"] }

[dev-dependencies]
oteryn-db = { path = "../db" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dependencies.askama]
version = "0.16.1"
[dependencies.oteryn-web]
path = "../web"
[dependencies.sha2]
version = "0.10"
[dependencies.serde]
version = "1"
features = ["derive"]
[dependencies.serde_urlencoded]
version = "0.7"
[dependencies.uuid]
version = "1"
[dependencies.time]
version = "0.3"
features = ["formatting", "macros"]
[dependencies.percent-encoding]
version = "2"
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
features = ["macros"]
[dependencies.oteryn-wallet]
path = "../wallet"
[dependencies.oteryn-notify]
path = "../notify"
[dependencies.oteryn-admin]
path = "../admin"
[dependencies.oteryn-db]
path = "../db"
[dependencies.oteryn-content]
path = "../content"

[dependencies.oteryn-characters]
workspace = true
[dev-dependencies.oteryn-core]
workspace = true
