[package]
name = "oteryn-forum"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-admin.workspace = true
oteryn-notify.workspace = true
oteryn-support.workspace = true
oteryn-ui.workspace = true
oteryn-web.workspace = true
askama = "0.16.1"
axum = "0.8.9"
fluent-bundle = "0.16"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid", "derive", "time"] }
thiserror = "2"
time = { version = "0.3.47", features = ["formatting"] }
url = "2.5"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
oteryn-db = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["macros"] }
