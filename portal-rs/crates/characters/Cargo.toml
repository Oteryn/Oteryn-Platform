[package]
name = "oteryn-characters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-internal-api = { workspace = true }
axum = "0.8.9"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
uuid = { version = "1.29.0", features = ["v7"] }
thiserror = "2.0.21"
tokio = { version = "1.52.3", features = ["sync", "macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
subtle = "2.6.1"

oteryn-core = { version = "0.1.0", path = "../core" }
unicode-normalization = "0.1.25"
unicode-properties = "0.1.5"
sha2 = "0.10.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
[dependencies.askama]
version = "0.16.1"
[dependencies.fluent-bundle]
version = "0.16.0"
[dependencies.oteryn-wallet]
workspace = true

[dependencies.oteryn-identity]
workspace = true
[dependencies.serde]
version = "1"
features = ["derive"]
[dependencies.unic-langid]
version = "0.9"
features = ["macros"]
[dependencies.serde_urlencoded]
version = "0.7.1"
