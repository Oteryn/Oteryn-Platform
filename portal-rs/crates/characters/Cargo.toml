[package]
name = "oteryn-characters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
oteryn-internal-api = { version = "0.1.0", path = "../internal-api" }
oteryn-core = { version = "0.1.0", path = "../core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
uuid = "1.23.4"
unicode-normalization = "0.1.25"
unicode-properties = "0.1.5"
sha2 = "0.10.9"
subtle = "2.6.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }
