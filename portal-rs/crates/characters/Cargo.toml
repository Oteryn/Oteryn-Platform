[package]
name = "oteryn-characters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-internal-api = { workspace = true }
axum = "0.8.9"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
uuid = { version = "1.29.0", features = ["v7"] }
thiserror = "2.0.21"
tokio = { version = "1.52.3", features = ["sync", "macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
subtle = "2.6.1"
