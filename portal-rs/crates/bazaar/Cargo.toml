[package]
name = "oteryn-bazaar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-core.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros"] }
thiserror = "2.0.21"
time = "0.3.53"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
oteryn-db.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"

[dependencies.axum]
version = "0.8.9"
[dependencies.askama]
version = "0.16.1"
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
features = ["macros"]
[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]
[dependencies.serde_urlencoded]
version = "0.7"
[dependencies.oteryn-web]
workspace = true
