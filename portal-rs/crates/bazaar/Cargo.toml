[package]
name = "oteryn-bazaar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
oteryn-core.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros"] }
thiserror = "2.0.21"
time = "0.3.53"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }

[dependencies.oteryn-internal-api]
path = "../internal-api"

[dependencies.sha2]
version = "0.10.9"

[dependencies.ed25519-dalek]
version = "2.2.0"

[dependencies.base64]
version = "0.22.1"

[dependencies.axum]
version = "0.8.9"
[dependencies.askama]
version = "0.16.1"
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
features = ["macros"]
[dependencies.tower]
version = "0.5.3"
features = ["util"]
[dependencies.serde_urlencoded]
version = "0.7"
[dependencies.oteryn-web]
workspace = true
[dev-dependencies.sha2]
version = "0.10"

[dependencies.prost]
version = "0.14.4"

[dependencies.oteryn-characters]
workspace = true
[dependencies.tokio]
version = "1.54.1"
features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"]
[dependencies.hyper]
version = "1.12.0"
features = ["server", "http1"]
[dependencies.hyper-util]
version = "0.1.21"
features = ["tokio"]
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std"]
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring"]

[dependencies.oteryn-db]
workspace = true
