[package]
name = "oteryn-bazaar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-core.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros"] }
thiserror = "2.0.21"
time = "0.3.53"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
oteryn-db.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"

[dependencies.oteryn-internal-api]
path = "../internal-api"

[dependencies.sha2]
version = "0.10.9"

[dependencies.ed25519-dalek]
version = "2.2.0"

[dependencies.base64]
version = "0.22.1"
