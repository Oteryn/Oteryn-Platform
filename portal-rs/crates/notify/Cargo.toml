[package]
name = "oteryn-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-db.workspace = true
askama = "0.16.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["sync", "macros", "rt-multi-thread"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
