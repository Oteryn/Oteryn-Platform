[package]
name = "oteryn-wiki"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-ui.workspace = true
axum = "0.8.9"
askama = "0.16.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pulldown-cmark = "0.13"
ammonia = "4"
regex = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
oteryn-admin.workspace = true
oteryn-web.workspace = true
oteryn-world.workspace = true

[dev-dependencies]
oteryn-db.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[dependencies.url]
version = "2"

