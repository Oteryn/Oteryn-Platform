[package]
name = "oteryn-gameauth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
oteryn-internal-api = { path = "../internal-api" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
subtle = "2.6.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }
tokio = { version = "1.54.1", features = ["net", "rt", "time", "sync", "rt-multi-thread", "macros"] }

tower = { version = "0.5.3", features = ["util"] }
base64 = "0.22.1"
getrandom = "0.4.3"

[dev-dependencies]
oteryn-db = { path = "../db" }
oteryn-gateway = { path = "../gateway" }
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dependencies.ed25519-dalek]
version = "2.2.0"
features = ["zeroize"]

[dependencies.aes-gcm]
version = "0.10.3"
features = ["zeroize"]

[dependencies.zeroize]
version = "1.8.2"
features = ["derive"]

[target.'cfg(unix)'.dependencies.rustix]
version = "1.1.4"
features = ["process"]
[dependencies.askama]
version = "0.16.1"
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
[dependencies.url]
version = "2"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std"]
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring"]
[dependencies.hyper]
version = "1.12.0"
features = ["server", "http1"]
[dependencies.hyper-util]
version = "0.1.21"
features = ["tokio", "service"]
[dev-dependencies.rcgen]
version = "0.13"
default-features = false
features = ["ring", "pem"]
