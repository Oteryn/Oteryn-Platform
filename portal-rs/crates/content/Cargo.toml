[package]
name = "oteryn-content"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-ui.workspace = true
axum = "0.8.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
askama = "0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oteryn-admin.workspace = true
oteryn-web.workspace = true
fluent-bundle = "0.16"
unic-langid = "0.9"
pulldown-cmark = "0.13"
ammonia = "4"
thiserror = "2"
[dev-dependencies]
oteryn-db.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

tower = { version = "0.5.3", features = ["util"] }
[dependencies.time]
version = "0.3"
features = ["formatting", "parsing", "serde"]

[dependencies.image]
version = "0.25.9"
default-features = false
features = ["jpeg", "png", "webp"]

[dependencies.axum-extra]
version = "0.12.5"
features = ["multipart"]

[dependencies.sha2]
version = "0.10"

[dependencies.tokio]
version = "1.54.1"
features = ["rt", "sync"]
