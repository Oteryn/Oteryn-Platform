[package]
name = "oteryn-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-internal-api.workspace = true
axum = "0.8.8"
http = "1.4.0"
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }
time = { version = "0.3.47", features = ["formatting", "parsing"] }
uuid = { version = "1.20.0", features = ["v7"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
serde = { version = "1.0.229", features = ["derive"] }
oteryn-wallet.workspace = true
getrandom = "0.4.1"
subtle = "2.6.1"
tracing = "0.1.44"
oteryn-db.workspace = true
