[package]
name = "oteryn-hirelings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-ui.workspace = true
oteryn-db.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.oteryn-notify]
workspace = true

[dependencies.fluent-bundle]
version = "0.16"

[dependencies.oteryn-web]
workspace = true

[dependencies.axum]
version = "0.8.9"

[dependencies.askama]
version = "0.16.1"

[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]

[dependencies.sha2]
version = "0.10"
