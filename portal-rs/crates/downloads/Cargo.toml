[package]
name = "oteryn-downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
thiserror = "2"
tough = { version = "0.22.0", default-features = false }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
time = "0.3"

[dev-dependencies]
ed25519-dalek = "2"
canonical_json = "0.5"
oteryn-db = { path = "../db" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
getrandom = "0.4"
