[package]
name = "oteryn-world"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
globset = "0.4.18"
jsonschema = { version = "0.60.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "sync"] }
url = "2.5"
uuid = { version = "1.29", features = ["v7", "serde"] }

[dev-dependencies]
oteryn-db = { path = "../db" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }
