[package]
name = "oteryn-world"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
globset = "0.4.18"
image = { version = "0.25.9", default-features = false, features = ["webp"] }
jsonschema = { version = "0.60.2", default-features = false }
lzma-rs = "0.3.0"
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
tempfile = "3.27"
thiserror = "2.0.18"
tokio = { version = "1.54", features = ["rt", "sync", "net", "time", "io-util"] }
url = "2.5"
uuid = { version = "1.29", features = ["v7", "serde"] }

[dev-dependencies]
oteryn-db = { path = "../db" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }

[dependencies.oteryn-admin]
path = "../admin"
[dependencies.oteryn-web]
path = "../web"
[dependencies.axum]
version = "0.8.9"
[dependencies.askama]
version = "0.16.1"
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]

[dependencies.hyper]
version = "1.12.0"
features = ["client", "http1"]
[dependencies.hyper-util]
version = "0.1.21"
features = ["tokio"]
[dependencies.http-body-util]
version = "0.1"
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
[dependencies.webpki-roots]
version = "1"
