<!doctype html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Oteryn</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head>
<body class="op-theme"><main class="op-stack">
<h1>{{ title }}</h1>
<p>{{ note }}</p>
<dl><dt>{{ order_label }}</dt><dd><small>{{ order_id }}</small></dd><dt>{{ coins_label }}</dt><dd>{{ coins }}</dd><dt>{{ price_label }}</dt><dd>{{ price }}</dd><dt>{{ status_label }}</dt><dd>{{ state }}</dd></dl>
{% if awaiting %}<div class="op-row">
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="action" value="pay"><button class="op-button" type="submit">{{ pay_label }}</button></form>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="action" value="fail"><button class="op-button op-button--secondary" type="submit">{{ fail_label }}</button></form>
</div>{% else %}<p>{{ done }}</p>{% endif %}
</main></body></html>
