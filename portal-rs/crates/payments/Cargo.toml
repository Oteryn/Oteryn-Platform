[package]
name = "oteryn-payments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-ui.workspace = true
oteryn-core.workspace = true
oteryn-db.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dependencies.axum]
version = "0.8.9"
[dependencies.oteryn-web]
path = "../web"
[dependencies.oteryn-store]
path = "../store"
[dependencies.askama]
version = "0.16.1"
[dependencies.time]
version = "0.3.47"
features = ["formatting"]
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]
