[package]
name = "oteryn-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
oteryn-ui.workspace = true
oteryn-db.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid", "time", "derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
argon2 = "0.5"
getrandom = "0.4.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
email_address = "0.2"

sha1 = "0.10"
axum = "0.8.9"
serde_urlencoded = "0.7"

fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
chacha20poly1305 = "0.10"
subtle = "2.6"

[dev-dependencies]
oteryn-web.workspace = true
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
serde_urlencoded = "0.7"

[dependencies.webauthn-rs]
version = "0.6.2"
features = ["danger-allow-state-serialisation", "conditional-ui"]

[dev-dependencies.webauthn-authenticator-rs]
version = "0.6.2"
features = ["softpasskey"]

[dev-dependencies.base64]
version = "0.22"
[dependencies.oteryn-notify]
workspace = true

[dependencies.oteryn-wallet]
workspace = true
[dependencies.aes-gcm]
version = "0.11"
[dependencies.totp-rs]
version = "5.7"

[dependencies.askama]
version = "0.16.1"

[dependencies.ed25519-dalek]
version = "2.2.0"
features = ["zeroize"]

[dependencies.prost]
version = "0.14.3"

[dependencies.oteryn-internal-api]
path = "../internal-api"

# Breached-password range client (HIBP), rustls only, same features as crates/world.
[dependencies.hyper]
version = "1.12.0"
features = ["client", "http1"]
[dependencies.hyper-util]
version = "0.1.21"
features = ["tokio"]
[dependencies.http-body-util]
version = "0.1"
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
[dependencies.webpki-roots]
version = "1"
[dependencies.url]
version = "2.5"
