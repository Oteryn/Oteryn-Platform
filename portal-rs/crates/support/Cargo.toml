[package]
name = "oteryn-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
uuid = { version = "1.23.4", features = ["v7"] }
thiserror = "2.0.18"
serde_json = "1.0.150"
oteryn-admin = { path = "../admin" }
oteryn-gameauth = { path = "../gameauth" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["time", "macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
sha2 = "0.10.9"
