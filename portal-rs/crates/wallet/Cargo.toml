[package]
name = "oteryn-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }
time = "0.3.55"

[dev-dependencies]
oteryn-db = { path = "../db" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
