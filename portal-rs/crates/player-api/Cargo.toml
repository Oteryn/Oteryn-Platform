[package]
name = "oteryn-player-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
oteryn-gameauth = { path = "../gameauth" }
oteryn-characters = { path = "../characters" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

oteryn-db.workspace = true
oteryn-identity.workspace = true
oteryn-notify.workspace = true
oteryn-wallet.workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
oteryn-db = { path = "../db" }
oteryn-core = { path = "../core" }
uuid = { version = "1.23.4", features = ["v7"] }
