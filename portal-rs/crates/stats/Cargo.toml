[package]
name = "oteryn-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-db = { path = "../db" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "time", "uuid"] }
time = "0.3.47"
uuid = "1.22.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dependencies.axum]
version = "0.8.9"
[dependencies.askama]
version = "0.16.1"
[dependencies.serde]
version = "1"
features = ["derive"]
[dependencies.serde_urlencoded]
version = "0.7"
[dependencies.fluent-bundle]
version = "0.16"
[dependencies.unic-langid]
version = "0.9"
features = ["macros"]
[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]
[dependencies.sha2]
version = "0.10"
