[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-world.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0.18"
uuid = { version = "1.29", features = ["v7", "serde"] }

[dev-dependencies]
oteryn-db.workspace = true
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
