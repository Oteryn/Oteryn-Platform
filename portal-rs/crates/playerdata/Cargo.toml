[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
askama = "0.16.1"
fluent-bundle = "0.16"
unic-langid = "0.9"
oteryn-web.workspace = true
oteryn-identity.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid", "derive", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
oteryn-db.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }

[dependencies.oteryn-db]
workspace = true
