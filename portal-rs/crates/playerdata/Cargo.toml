[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid"] }
uuid = { version = "1.22.0", features = ["serde", "v7"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dependencies.askama]
version = "0.16.1"

[dependencies.fluent-bundle]
version = "0.16"

[dependencies.unic-langid]
version = "0.9"
features = ["macros"]

[dependencies.time]
version = "0.3.47"
features = ["formatting"]
