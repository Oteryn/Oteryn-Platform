[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid"] }
uuid = { version = "1.22.0", features = ["serde"] }
fluent-bundle = "0.16"
unic-langid = "0.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dependencies.axum]
version = "0.8.9"

[dev-dependencies.tower]
version = "0.5.3"
features = ["util"]

[dev-dependencies.uuid]
version = "1.22.0"
features = ["v7"]

[dependencies.time]
version = "0.3.47"
features = ["formatting"]
