[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-internal-api.workspace = true
axum = "0.8.9"
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.54.1", features = ["sync", "macros", "rt-multi-thread"] }

[dev-dependencies]
uuid = { version = "1.29.0", features = ["v7"] }
tower = { version = "0.5.3", features = ["util"] }
