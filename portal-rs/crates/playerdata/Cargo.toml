[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
askama = "0.16"
fluent-bundle = "0.16"
oteryn-web.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0"
uuid = { version = "1.29", features = ["v7", "serde"] }

time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
