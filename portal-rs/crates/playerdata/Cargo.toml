[package]
name = "oteryn-playerdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-notify.workspace = true
subtle = "2.6"
oteryn-world.workspace = true
oteryn-identity.workspace = true
oteryn-db.workspace = true
oteryn-internal-api.workspace = true
async-trait = "0.1"
sha2 = "0.10.9"
time = { version = "0.3", features = ["formatting"] }
axum = "0.8.9"
askama = "0.16.1"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "derive", "time"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "macros", "rt-multi-thread"] }

[dependencies.oteryn-web]
workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["util"] }
