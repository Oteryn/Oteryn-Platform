[package]
name = "oteryn-minigames"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-db.workspace = true
oteryn-web.workspace = true
oteryn-world.workspace = true
oteryn-identity.workspace = true
oteryn-atlas.workspace = true
axum = "0.8.8"
askama = "0.16.1"
fluent-bundle = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "derive"] }
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
image = { version = "0.25.10", default-features = false, features = ["webp"] }
sha2 = "0.10.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[dependencies.tower-http]
version = "0.7"
features = ["limit"]

[dependencies.oteryn-wallet]
workspace = true
[dependencies.oteryn-playerdata]
path = "../playerdata"

[dependencies.getrandom]
version = "0.4.3"
