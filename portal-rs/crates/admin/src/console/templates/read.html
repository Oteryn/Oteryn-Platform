<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head>
<body class="op-theme op-stack"><header><nav class="op-panel" aria-label="{{ title }}"><ul class="op-tabs"><li><a href="/admin/console/players?lang={{ lang }}">{{ players }}</a></li><li><a href="/admin/console/audit?lang={{ lang }}">{{ audit }}</a></li><li><a href="/admin/console/access?lang={{ lang }}">{{ access }}</a></li><li><a href="/admin/console/approvals?lang={{ lang }}">{{ approvals }}</a></li></ul></nav></header>
<main class="op-panel op-stack" id="main"><h1>{{ title }}</h1><p>{{ source }}</p>
{% if search %}<form class="op-stack" method="get"><input type="hidden" name="lang" value="{{ lang }}"><label for="q">{{ query_label }}</label><input class="op-input" id="q" name="q" minlength="2" maxlength="64" required><button class="op-button" type="submit">{{ submit }}</button></form><form class="op-stack" method="get"><input type="hidden" name="lang" value="{{ lang }}"><label for="character">{{ character_label }}</label><input class="op-input" id="character" name="character" maxlength="80" required><button class="op-button" type="submit">{{ submit }}</button></form>{% endif %}
{% if filters %}<form class="op-stack" method="get"><input type="hidden" name="lang" value="{{ lang }}"><label for="request_id">{{ request_label }}</label><input class="op-input" id="request_id" name="request_id" maxlength="36"><label for="admin">{{ admin_label }}</label><input class="op-input" id="admin" name="admin" maxlength="36"><label for="operation">{{ operation_label }}</label><input class="op-input" id="operation" name="operation" maxlength="128"><label for="target">{{ target_label }}</label><input class="op-input" id="target" name="target" maxlength="128"><button class="op-button" type="submit">{{ submit }}</button></form>{% endif %}
{% for section in sections %}<section class="op-stack"><h2>{{ section.title }}</h2><ul>{% for line in section.lines %}<li><p>{{ line }}</p></li>{% endfor %}</ul></section>{% endfor %}</main></body></html>
