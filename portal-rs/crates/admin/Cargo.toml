[package]
name = "oteryn-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
oteryn-db = { version = "0.1.0", path = "../db" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
