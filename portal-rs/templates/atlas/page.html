<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="canonical" href="/{{ lang }}/atlas"><link rel="alternate" hreflang="pl" href="/pl/atlas"><link rel="alternate" hreflang="en" href="/en/atlas"><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/atlas/viewer.css"><script nonce="{{ nonce }}" src="/static/atlas/viewer.js" defer></script></head>
<body><main><h1>{{ title }}</h1><p id="help">{{ help }}</p><nav aria-label="{{ title }}"><button id="out" type="button">{{ zoom_out }}</button><button id="in" type="button">{{ zoom_in }}</button><button id="north" type="button">{{ north }}</button><button id="south" type="button">{{ south }}</button><button id="west" type="button">{{ west }}</button><button id="east" type="button">{{ east }}</button><label>{{ floor }} <select id="floor"></select></label><label><input id="tiles" type="checkbox" checked>{{ map }}</label><label><input id="markers" type="checkbox" checked>{{ markers }}</label></nav><div id="atlas" tabindex="0" role="region" aria-label="{{ title }}" aria-describedby="help" data-map="{{ data }}"><canvas aria-hidden="true"></canvas></div><p id="status" role="status" data-missing="{{ missing }}"></p><ul id="entities" aria-label="{{ markers }}"></ul><noscript>{{ help }}</noscript></main></body></html>
