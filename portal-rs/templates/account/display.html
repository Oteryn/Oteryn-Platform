<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ self.t("display-settings") }}</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="op-theme">
<main class="op-stack op-panel">
<h1>{{ self.t("display-settings") }}</h1>
<p>{{ self.t("display-policy") }}</p>
{% if saved %}<p role="status">{{ self.t("display-saved") }}</p>{% endif %}
{% if invalid %}<p role="alert">{{ self.t("display-invalid") }}</p>{% endif %}
<form method="post" action="/{{ lang }}/account/display" class="op-stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="op-field">
    <label for="display-name">{{ self.t("display-name") }}</label>
    <input class="op-input" id="display-name" name="display_name" value="{{ name }}" maxlength="160">
  </div>
  <div class="op-field">
    <label for="display-locale">{{ self.t("display-locale") }}</label>
    <select class="op-input" id="display-locale" name="locale">
      <option value="pl"{% if locale == "pl" %} selected{% endif %}>Polski</option>
      <option value="en"{% if locale == "en" %} selected{% endif %}>English</option>
    </select>
  </div>
  <div><button class="op-button" type="submit">{{ self.t("display-save") }}</button></div>
</form>
{% if back_to_overview %}<a href="/account">{{ self.t("display-back") }}</a>{% endif %}
</main>
</body>
</html>
