{% macro table(id, caption, headings, rows, scroll_hint) %}
<p class="op-hint" id="{{ id }}-hint">{{ scroll_hint }}</p>
<div class="op-table-wrap" role="region" aria-labelledby="{{ id }}-caption" aria-describedby="{{ id }}-hint" tabindex="0">
  <table class="op-table"><caption id="{{ id }}-caption">{{ caption }}</caption><thead><tr>{% for heading in headings %}<th scope="col">{{ heading }}</th>{% endfor %}</tr></thead>
  <tbody>{% for row in rows %}<tr>{% for cell in row %}{% if loop.first %}<th scope="row">{{ cell }}</th>{% else %}<td>{{ cell }}</td>{% endif %}{% endfor %}</tr>{% endfor %}</tbody></table>
</div>
{% endmacro %}
