<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Oteryn Wiki</title><link rel="canonical" href="/{{ lang }}{{ route }}"><link rel="alternate" hreflang="pl" href="/pl{{ route }}"><link rel="alternate" hreflang="en" href="/en{{ route }}"><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head>
<body class="op-theme"><a class="op-button op-button--secondary" href="#main">{{ self.t("skip") }}</a><header class="op-card"><a class="op-button op-button--secondary" href="/{{ lang }}/wiki">Oteryn Wiki</a> <a class="op-button op-button--secondary" href="/pl{{ route }}" lang="pl" hreflang="pl">Polski</a> <a class="op-button op-button--secondary" href="/en{{ route }}" lang="en" hreflang="en">English</a></header><main id="main" tabindex="-1" class="op-card op-stack">{% block content %}{% endblock %}</main></body></html>
