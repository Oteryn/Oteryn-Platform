<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head><body class="op-theme"><main class="op-panel op-stack"><h1>{{ title }}</h1>{% if help_links %}<ul><li><a href="/{{ lang }}/support/tickets/create">{{ tickets_label }}</a></li><li><a href="/{{ lang }}/forgot-password">{{ password_label }}</a></li></ul>{% endif %}{% if !version.is_empty() %}<p>{{ version }}</p>{% endif %}{% if !draft_notice.is_empty() %}<aside role="note" class="op-panel"><strong>{{ draft_notice }}</strong></aside>{% endif %}{% if !faq_label.is_empty() %}<p><a href="/{{ lang }}/faq">{{ faq_label }}</a></p>{% endif %}<article class="op-stack op-table-wrap">{{ body|safe }}</article></main></body></html>
