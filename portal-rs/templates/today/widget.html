<aside class="op-theme op-card op-stack" aria-label="{{ self.text("title") }}">
  <strong>{{ self.text("title") }}</strong>
  {% if let Some(boost) = boost %}
  <dl><dt>{{ self.text("creature") }}</dt><dd>{{ boost.creature }}</dd><dt>{{ self.text("boss") }}</dt><dd>{{ boost.boss }}</dd></dl>
  {% else %}<p role="status">{{ self.text("unavailable") }}</p>{% endif %}
</aside>
