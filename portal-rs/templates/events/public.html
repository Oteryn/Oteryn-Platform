<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head><body class="op-theme"><main class="op-stack op-panel"><h1>{{ title }}</h1>{% if events.is_empty() %}<p>{{ empty }}</p>{% endif %}{% for event in events %}<article class="op-stack op-card"><h2><a href="/{{ lang }}/events/{{ event.slug }}">{{ event.title }}</a></h2><p><time>{{ event.starts_at }}</time> – <time>{{ event.ends_at }}</time></p><p>{{ event.summary }}</p>{% if detail %}<p>{{ event.body }}</p>{% endif %}</article>{% endfor %}</main></body></html>
