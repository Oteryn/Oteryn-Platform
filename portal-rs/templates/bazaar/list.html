{% extends "bazaar/layout.html" %}{% block title %}{{ self.t("title") }}{% endblock %}{% block content %}<h1>{{ self.t("title") }}</h1><a class="op-button" href="/{{ lang }}/bazaar/items/new">{{ self.t("new") }}</a>{% for item in items %}<article class="op-stack"><h2><a href="/{{ lang }}/bazaar/items/{{ item.id }}">{{ item.name }}</a></h2><p>{{ self.t("quantity") }}: {{ item.quantity }}</p></article>{% else %}<p>{{ self.t("empty") }}</p>{% endfor %}{% endblock %}
