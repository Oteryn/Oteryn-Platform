<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="op-theme">
<main class="op-stack op-main" id="main" tabindex="-1">
  <h1>{{ title }}</h1>
  <p><a href="/admin?lang={{ lang }}">{{ back }}</a></p>
  <p>{{ game_unavailable }}</p>
  <dl class="op-stack">
    {% for (label, value) in states %}
      <div><dt>{{ label }}</dt><dd>{{ value }}</dd></div>
    {% endfor %}
  </dl>
</main>
</body>
</html>
