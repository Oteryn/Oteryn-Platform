<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="op-theme">
  <main class="op-panel op-stack">
    <nav class="op-tabs" aria-label="{{ panel }}"><a href="/admin">{{ panel }}</a></nav>
    <h1>{{ title }}</h1>
    <p class="op-prose">{{ description }}</p>
    <form method="post" action="/admin/audit-evidence" class="op-stack">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <div class="op-field">
        <label for="evidence-day">{{ day }}</label>
        <input class="op-input" type="date" id="evidence-day" name="day" min="{{ first_day }}" max="{{ last_day }}" value="{{ last_day }}" required>
      </div>
      <div><button class="op-button" type="submit">{{ download }}</button></div>
    </form>
  </main>
</body>
</html>
