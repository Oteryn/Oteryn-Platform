<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head><body class="op-theme"><main class="op-panel op-stack"><h1>{{ title }}</h1><form method="get" class="op-stack"><label for="slug">{{ slug_label }}</label><input class="op-input" name="slug" id="slug" required maxlength="160" pattern="[a-z0-9]+(-[a-z0-9]+)*"><label for="locale">{{ locale_label }}</label><select class="op-input" name="locale" id="locale"><option value="pl">Polski</option><option value="en">English</option></select><button class="op-button">{{ create_label }}</button></form><ul>{% for (slug,locale) in rows %}<li><a href="/admin/pages/{{ slug }}/{{ locale }}">{{ slug }} / {{ locale }}</a></li>{% endfor %}</ul></main></body></html>
