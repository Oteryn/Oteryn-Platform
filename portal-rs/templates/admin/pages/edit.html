<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="op-theme">
<main class="op-panel op-stack">
  <h1>{{ title }}</h1>
  <a href="/admin/pages">{{ self.t("publication-page-list") }}</a>
  <p>{{ slug }} / {{ locale }}</p>
  <form method="post" class="op-stack">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <input type="hidden" name="expected_revision" value="{{ form.expected_revision }}">
    <input type="hidden" name="reviewed_source_revision" value="{{ form.reviewed_source_revision }}">
    <label for="title">{{ labels[0] }}</label>
    <input class="op-input" id="title" name="title" maxlength="200" required value="{{ form.title }}">
    <label for="body">{{ labels[1] }}</label>
    <textarea class="op-input" id="body" name="body" maxlength="100000" required rows="12">{{ form.body }}</textarea>
    <label for="published">{{ labels[2] }}</label>
    <input class="op-input" id="published" name="published_at" value="{{ form.published_at }}">
    <label for="version">{{ labels[3] }}</label>
    <input class="op-input" id="version" name="legal_version" maxlength="80" value="{{ form.legal_version }}">
    <label for="effective">{{ labels[4] }}</label>
    <input class="op-input" type="date" id="effective" name="legal_effective_date" value="{{ form.legal_effective_date }}">
    {% if legal %}<label><input type="checkbox" name="final_approved" value="yes"> {{ labels[7] }}</label>{% endif %}
    <button class="op-button" name="action" value="save">{{ labels[5] }}</button>
    <button class="op-button op-button--secondary" name="action" value="delete">{{ labels[6] }}</button>
  </form>
  {% if can_schedule %}
  <form method="post" class="op-stack">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <input type="hidden" name="schedule_revision" value="{{ form.expected_revision }}">
    <input type="hidden" name="translation_revision" value="{{ translation_revision }}">
    <fieldset class="op-stack">
      <legend>{{ self.t("publication-queue") }}</legend>
      <p><a href="/admin/pages/{{ slug }}/pl">{{ self.t("publication-translation") }}</a></p>
      <p id="window-format">{{ self.t("publication-format") }}</p>
      <label for="schedule_at">{{ self.t("publication-start") }}</label>
      <input class="op-input" id="schedule_at" name="schedule_at" required maxlength="35" value="{{ schedule_at }}" aria-describedby="window-format">
      <label for="schedule_until">{{ self.t("publication-end") }}</label>
      <input class="op-input" id="schedule_until" name="schedule_until" maxlength="35" value="{{ schedule_until }}" aria-describedby="window-format">
      <button class="op-button" name="action" value="schedule">{{ self.t("publication-schedule") }}</button>
    </fieldset>
  </form>
  {% endif %}
</main>
</body>
</html>
