<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head><body class="op-theme"><main class="op-panel op-stack"><h1>{{ title }}</h1><p>{{ slug }} / {{ locale }}</p><form method="post" class="op-stack"><input type="hidden" name="_csrf" value="{{ csrf }}"><label for="title">{{ labels[0] }}</label><input class="op-input" id="title" name="title" maxlength="200" required value="{{ form.title }}"><label for="body">{{ labels[1] }}</label><textarea class="op-input" id="body" name="body" maxlength="100000" required rows="12">{{ form.body }}</textarea><label for="published">{{ labels[2] }}</label><input class="op-input" id="published" name="published_at" value="{{ form.published_at }}"><label for="version">{{ labels[3] }}</label><input class="op-input" id="version" name="legal_version" maxlength="80" value="{{ form.legal_version }}"><label for="effective">{{ labels[4] }}</label><input class="op-input" type="date" id="effective" name="legal_effective_date" value="{{ form.legal_effective_date }}"><button class="op-button" name="action" value="save">{{ labels[5] }}</button><button class="op-button op-button--secondary" name="action" value="delete">{{ labels[6] }}</button></form></main></body></html>
