{% extends "wiki/layout.html" %}
{% block content %}<h1>{{ self.t("wiki") }}</h1><a class="op-button" href="/admin/wiki/articles/create">{{ self.t("new") }}</a>
{% for row in rows %}<article class="op-card"><h2><a href="/admin/wiki/articles/{{ row.id }}/edit">{{ self.t("edit") }} {{ row.id }}</a></h2><p>{{ self.t("status") }}: {{ self.t(row.status.as_str()) }} · {{ self.t("version") }}: {{ row.version }}</p></article>{% endfor %}{% endblock %}
