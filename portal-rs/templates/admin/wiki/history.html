{% extends "wiki/layout.html" %}
{% block content %}<h1>{{ self.t("history") }}</h1>{% for row in rows %}<article class="op-card op-stack"><h2>{{ row.title }} ({{ row.locale }}) · {{ row.version }}</h2><p>{{ row.change_note }}</p><pre class="op-table-wrap"><code>{{ row.markdown }}</code></pre><form method="post" action="/admin/wiki/articles/{{ id }}/revisions/{{ row.version }}/restore"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="lock_version" value="{{ version }}"><button class="op-button" type="submit">{{ self.t("restore") }}</button></form></article>{% endfor %}{% endblock %}
