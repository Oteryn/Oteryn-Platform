<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"></head><body class="op-theme"><main class="op-stack op-panel"><h1>{{ title }}</h1><p>{{ status }}</p><form class="op-stack" method="post" action="{{ action }}"><input type="hidden" name="_csrf" value="{{ csrf }}">{% if let Some(version) = form.lock_version %}<input type="hidden" name="lock_version" value="{{ version }}">{% endif %}
<p><label>{{ labels[0] }} <input class="op-input" type="datetime-local" name="starts_at" value="{{ form.starts_at }}" required></label></p><p><label>{{ labels[1] }} <input class="op-input" type="datetime-local" name="ends_at" value="{{ form.ends_at }}" required></label></p><p><label><input type="checkbox" name="featured" value="true" {% if form.featured.is_some() %}checked{% endif %}>{{ labels[2] }}</label></p>
<fieldset class="op-stack op-panel"><legend>English</legend><p><label>{{ labels[3] }} <input class="op-input" name="en_title" value="{{ form.en_title }}" maxlength="200" required></label></p><p><label>{{ labels[4] }} <input class="op-input" name="en_slug" value="{{ form.en_slug }}" maxlength="160" required></label></p><p><label>{{ labels[5] }} <textarea class="op-input" name="en_summary" cols="20" maxlength="500" required>{{ form.en_summary }}</textarea></label></p><p><label>{{ labels[6] }} <textarea class="op-input" name="en_body" cols="20" maxlength="100000" required>{{ form.en_body }}</textarea></label></p></fieldset>
<fieldset class="op-stack op-panel"><legend>Polski</legend><p><label>{{ labels[3] }} <input class="op-input" name="pl_title" value="{{ form.pl_title }}" maxlength="200"></label></p><p><label>{{ labels[4] }} <input class="op-input" name="pl_slug" value="{{ form.pl_slug }}" maxlength="160"></label></p><p><label>{{ labels[5] }} <textarea class="op-input" name="pl_summary" cols="20" maxlength="500">{{ form.pl_summary }}</textarea></label></p><p><label>{{ labels[6] }} <textarea class="op-input" name="pl_body" cols="20" maxlength="100000">{{ form.pl_body }}</textarea></label></p></fieldset><button class="op-button" type="submit">{{ labels[7] }}</button></form>
{% if can_publish && !id.is_empty() %}<form class="op-stack" method="post" action="/admin/events/{{ id }}/status"><input type="hidden" name="_csrf" value="{{ csrf }}">{% if let Some(version) = form.lock_version %}<input type="hidden" name="lock_version" value="{{ version }}">{% endif %}<p><label>{{ labels[8] }} <select class="op-input" name="status"><option value="draft">{{ labels[9] }}</option><option value="scheduled">{{ labels[10] }}</option><option value="published">{{ labels[11] }}</option><option value="archived">{{ labels[12] }}</option></select></label></p><button class="op-button" type="submit">{{ labels[13] }}</button></form>{% endif %}</main></body></html>
