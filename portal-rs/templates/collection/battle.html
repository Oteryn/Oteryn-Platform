<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/app.css"></head>
<body class="op-theme"><main class="op-stack"><h1>{{ title }}</h1><p>{{ round }}: {{ turn }}</p><p role="status">{{ outcome }}</p><section class="op-panel"><h2>{{ player_label }}</h2><ol>{% for hp in player %}<li>{{ hp }} / 30</li>{% endfor %}</ol></section><section class="op-panel"><h2>{{ enemy_label }}</h2><ol>{% for hp in enemy %}<li>{{ hp }} / 30</li>{% endfor %}</ol></section>
{% if active %}<form method="post" action="/{{ lang }}/collection/battles/{{ id }}" class="op-stack"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="expected" value="{{ turn }}"><button class="op-button" type="submit" name="action" value="strike">{{ strike }}</button><button class="op-button" type="submit" name="action" value="guard">{{ guard }}</button></form>{% endif %}<a href="/{{ lang }}/collection/{{ character }}">{{ back }}</a></main></body></html>
