<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ brand }}</title>
  <link rel="stylesheet" href="/static/css/surface.css">
</head>
<body>
  <a class="skip-link" href="#main">{{ skip }}</a>
  <header>
    <a href="/{{ lang }}/">{{ brand }}</a>
    <nav aria-label="{{ navigation }}">
      <a href="/{{ lang }}/">{{ home }}</a>
      <a href="{{ switch }}" lang="{{ switch_lang }}" hreflang="{{ switch_lang }}">{{ language }}</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer>{{ footer }}</footer>
</body>
</html>
