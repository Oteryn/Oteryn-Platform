<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body>
  <main class="op-stack op-panel">
    <h1>{{ title }}</h1>
    {% for paragraph in body.lines() %}{% if !paragraph.trim().is_empty() %}<p>{{ paragraph }}</p>{% endif %}{% endfor %}
    {% if let Some(url) = action_url %}{% if let Some(label) = action_label %}
      <p><a href="{{ url }}">{{ label }}</a></p>
    {% endif %}{% endif %}
  </main>
</body>
</html>
