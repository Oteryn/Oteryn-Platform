<!doctype html>
<html lang="{{ chrome.lang }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ chrome.text("home-link") }}{% endblock %} · Oteryn</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/thais/shell.css">
  <link rel="stylesheet" href="/static/thais/interior.css">
  <script src="/static/thais/home.js" defer></script>
</head>
<body class="op-theme op-shell thais-inner">
  {% block body %}
  {% include "components/shell-header.html" %}
  <main id="main" class="{% block main_class %}op-stack op-main{% endblock %}" tabindex="-1">{% block content %}{% endblock %}</main>
  {% include "components/shell-footer.html" %}
  {% endblock %}
</body>
</html>
