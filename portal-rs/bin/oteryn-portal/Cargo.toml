[package]
name = "oteryn-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
oteryn-core = { version = "0.1.0", path = "../../crates/core" }
oteryn-db = { version = "0.1.0", path = "../../crates/db" }
oteryn-web = { version = "0.1.0", path = "../../crates/web" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

oteryn-gateway = { path = "../../crates/gateway" }
oteryn-gameauth = { path = "../../crates/gameauth" }
oteryn-community = { path = "../../crates/community" }
oteryn-internal-api = { path = "../../crates/internal-api" }
oteryn-stats = { path = "../../crates/stats" }
oteryn-notify.workspace = true
oteryn-downloads = { path = "../../crates/downloads" }

oteryn-admin = { path = "../../crates/admin" }
oteryn-payments = { path = "../../crates/payments" }
oteryn-identity.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid"] }
askama = "0.16.1"
fluent-bundle = "0.16"
unic-langid = "0.9"
tower-http = { version = "0.7.1", features = ["limit"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
