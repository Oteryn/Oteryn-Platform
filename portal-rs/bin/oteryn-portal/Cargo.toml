[package]
name = "oteryn-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oteryn-characters.workspace = true
oteryn-ui = { path = "../../crates/ui" }
sha2 = "0.10"
axum = "0.8.9"
oteryn-core = { version = "0.1.0", path = "../../crates/core" }
oteryn-db = { version = "0.1.0", path = "../../crates/db" }
oteryn-web = { version = "0.1.0", path = "../../crates/web" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

oteryn-gateway = { path = "../../crates/gateway" }
oteryn-gameauth = { path = "../../crates/gameauth" }
oteryn-community = { path = "../../crates/community" }
oteryn-internal-api = { path = "../../crates/internal-api" }
oteryn-stats = { path = "../../crates/stats" }
oteryn-notify.workspace = true
oteryn-downloads = { path = "../../crates/downloads" }

oteryn-admin = { path = "../../crates/admin" }
oteryn-payments = { path = "../../crates/payments" }
oteryn-wallet.workspace = true
oteryn-store = { path = "../../crates/store" }
getrandom = "0.4.3"
serde_urlencoded = "0.7"
oteryn-hirelings.workspace = true
oteryn-minigames.workspace = true
oteryn-support.workspace = true
oteryn-player-api = { path = "../../crates/player-api" }
oteryn-atlas = { path = "../../crates/atlas" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }
askama = "0.16.1"
fluent-bundle = "0.16"
unic-langid = "0.9"
tower-http = { version = "0.7.1", features = ["limit"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1", features = ["v7"] }

oteryn-content.workspace = true

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


oteryn-identity.workspace = true

[dependencies.oteryn-wiki]
workspace = true

[dependencies.oteryn-world]
path = "../../crates/world"

[dependencies.oteryn-bazaar]
path = "../../crates/bazaar"

[dependencies.oteryn-playerdata]
workspace = true
[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
[dependencies.totp-rs]
version = "5.7"


[dependencies.sqlx-mysql]
version = "0.9.0"
default-features = false
features = ["offline"]
[dependencies.aes-gcm]
version = "0.10"
[dependencies.aes]
version = "0.8"
[dependencies.cbc]
version = "0.1"
features = ["alloc"]
[dependencies.hmac]
version = "0.12"
[dependencies.base64]
version = "0.22"
[dependencies.time]
version = "0.3"
features = ["formatting"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std"]
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring"]
[dependencies.hyper]
version = "1.12.0"
features = ["server", "http1"]
[dependencies.x509-parser]
version = "0.18"
[dependencies.hyper-util]
version = "0.1.21"
features = ["tokio", "service"]
