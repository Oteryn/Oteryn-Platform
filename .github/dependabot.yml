version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/scripts/acceptance"
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: "/deploy/synology/docker"
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/deploy/synology/runner"
    schedule:
      interval: weekly
      day: monday
      time: "06:25"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
