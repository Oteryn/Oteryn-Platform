name: Character Bazaar Staging Status Snapshot

# Read-only observer: this workflow never dispatches or mutates staging control.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/character-bazaar-staging-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: character-bazaar-staging-status-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish sanitized latest control status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$response_file" "$body_file"' EXIT

          query_result='success'
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            >"$response_file" 2>/dev/null; then
            query_result='failed'
            printf '{"workflow_runs":[]}' >"$response_file"
          fi

          latest="$(
            jq -c '
              [
                .workflow_runs[]
                | select(.name == "Character Bazaar Staging Control")
                | select(.event == "push" or .event == "workflow_dispatch")
                | {id, status, conclusion, head_sha, event, run_attempt, created_at, updated_at, html_url}
              ]
              | first // {}
            ' "$response_file"
          )"

          run_id="$(jq -r '.id // empty' <<<"$latest")"
          status="$(jq -r '.status // "not_found"' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<<"$latest")"
          head_sha="$(jq -r '.head_sha // "none"' <<<"$latest")"
          event="$(jq -r '.event // "none"' <<<"$latest")"
          run_attempt="$(jq -r '.run_attempt // "none"' <<<"$latest")"
          created_at="$(jq -r '.created_at // "none"' <<<"$latest")"
          updated_at="$(jq -r '.updated_at // "none"' <<<"$latest")"
          run_url="$(jq -r '.html_url // ""' <<<"$latest")"

          if [[ "$query_result" == 'failed' ]]; then
            classification='STATUS_QUERY_FAILED'
          elif [[ -z "$run_id" ]]; then
            classification='CONTROL_RUN_NOT_FOUND'
          else
            case "${status}:${conclusion}" in
              completed:success) classification='CONTROL_SUCCESS_REPORTED';;
              completed:*) classification='STAGING_NOT_PROVEN';;
              queued:*|in_progress:*|pending:*) classification='WAITING';;
              *) classification='UNKNOWN';;
            esac
          fi

          if [[ -n "$run_id" && -n "$run_url" ]]; then
            run_display="[${run_id}](${run_url})"
          else
            run_display='none'
          fi

          cat >"$body_file" <<EOF
          ## Character Bazaar staging control status

          - classification: \`${classification}\`
          - status-query: \`${query_result}\`
          - run: ${run_display}
          - exact source SHA: \`${head_sha}\`
          - trigger: \`${event}\`
          - status: \`${status}\`
          - conclusion: \`${conclusion}\`
          - attempt: \`${run_attempt}\`
          - created_at: \`${created_at}\`
          - updated_at: \`${updated_at}\`
          - production_environment_proven: \`false\`

          This is a read-only status snapshot. \`STAGING_PROVEN\` still requires the completed reporter and sanitized evidence artifact.
          EOF

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/368/comments" \
            -F "body=@${body_file}"
