name: Native protocol contract

on:
  pull_request:
    paths:
      - docs/contracts/**
      - docs/architecture/**
      - docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md
      - scripts/validate_native_protocol_contract.py
      - .github/workflows/native-protocol-contract.yml
  push:
    branches: [main]
    paths:
      - docs/contracts/**
      - docs/architecture/**
      - docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md
      - scripts/validate_native_protocol_contract.py
      - .github/workflows/native-protocol-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/validate_native_protocol_contract.py
