name: One-shot Localization Composer Diagnostic

on:
  push:
    branches:
      - feat/OTERYN-20260725-public-web-localization
    paths:
      - .github/workflows/one-shot-localization-composer-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[localization-composer-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260725-public-web-localization
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pcntl
          tools: composer:v2
      - name: Capture isolated Composer and Laravel discovery diagnostics
        shell: bash
        run: |
          set +e
          composer install --no-interaction --prefer-dist --no-progress --no-scripts -vvv > /tmp/composer-no-scripts.log 2>&1
          composer_status=$?
          if [[ $composer_status -eq 0 ]]; then
            php artisan package:discover --ansi -vvv > /tmp/package-discover.log 2>&1
            discover_status=$?
          else
            discover_status=99
            printf 'package:discover not run because dependency installation failed\n' > /tmp/package-discover.log
          fi
          printf 'composer_no_scripts=%s\npackage_discover=%s\n' "$composer_status" "$discover_status" > /tmp/status.txt
          exit 0
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: localization-composer-diagnostic-${{ github.run_id }}
          path: |
            /tmp/status.txt
            /tmp/composer-no-scripts.log
            /tmp/package-discover.log
          if-no-files-found: error
          retention-days: 2
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-localization-composer-diagnostic.yml
          git commit -m 'ci: remove localization composer diagnostic'
          git push origin HEAD:feat/OTERYN-20260725-public-web-localization
