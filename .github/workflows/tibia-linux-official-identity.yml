name: Tibia Linux Official Identity Tooling

on:
  pull_request:
    paths:
      - tools/tibia-linux-reference/official_identity_probe.py
      - tools/tibia-linux-reference/official_host_preflight.py
      - tools/tibia-linux-reference/official_host_prepare.sh
      - tools/tibia-linux-reference/official_evidence_luks_setup.sh
      - tools/tibia-linux-reference/tests/test_official_offline.py
      - .github/workflows/tibia-linux-official-identity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install non-execution identity tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils file

      - name: Run focused offline-tool tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools/tibia-linux-reference/tests/test_official_offline.py -v
          python -m py_compile \
            tools/tibia-linux-reference/official_identity_probe.py \
            tools/tibia-linux-reference/official_host_preflight.py
          bash -n tools/tibia-linux-reference/official_host_prepare.sh
          bash -n tools/tibia-linux-reference/official_evidence_luks_setup.sh

      - name: Prove official host preflight rejects CI
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(PYTHONPATH=tools/tibia-linux-reference \
            python tools/tibia-linux-reference/official_host_preflight.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --evidence-dir "$RUNNER_TEMP/tibia-official-evidence" 2>/dev/null)"
          status=$?
          set -e
          test "$status" -eq 2
          python - "$output" <<'PY'
          import json
          import sys
          document = json.loads(sys.argv[1])
          assert document == {"error_class": "HarnessError", "result": "FAIL"}
          print('{"ci_execution_gate":"PASS","official_binary_executed":false}')
          PY

      - name: Record GitHub-hosted acquisition boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          print(json.dumps({
              "result": "PASS",
              "official_source": "https://static.tibia.com/download/tibia.x64.tar.gz",
              "github_runner_acquisition": "BLOCKED_HTTP_403_PROVEN_RUN_31476777859",
              "official_binary_executed": False,
              "proprietary_artifact_downloaded": False,
          }, sort_keys=True))
          PY

      - name: Verify no proprietary package or runtime evidence entered the checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tibia.x64.tar.gz
          test -z "$(git status --short --untracked-files=all)"

  acquire-on-trusted-project-egress:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'blakinio' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: oteryn-staging
    timeout-minutes: 8
    steps:
      - name: Acquire and inspect exact official package without checkout or execution
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          work="${RUNNER_TEMP}/tibia-official-acquisition-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="$work/tibia.x64.tar.gz"
          install -d -m 700 "$work"
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT

          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 240 \
            'https://static.tibia.com/download/tibia.x64.tar.gz' \
            --output "$archive"

          ARCHIVE="$archive" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import struct
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE"])
          ELF_MAGIC = b"\x7fELF"
          PT_NOTE = 4
          NT_GNU_BUILD_ID = 3
          VERSION_RE = re.compile(rb"(?<![0-9A-Za-z])(?:1[0-9]|2[0-9])\.[0-9]{1,2}(?:\.[0-9A-Za-z]{1,16}){1,3}(?![0-9A-Za-z])")

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def safe_name(name):
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or not path.parts:
                  raise SystemExit("unsafe archive member path")
              return path.as_posix()

          def align4(value):
              return (value + 3) & ~3

          def build_id(data):
              if len(data) < 52 or data[:4] != ELF_MAGIC:
                  return None
              elf_class = data[4]
              endian_tag = data[5]
              if endian_tag == 1:
                  endian = "<"
              elif endian_tag == 2:
                  endian = ">"
              else:
                  return None
              try:
                  if elf_class == 2:
                      header = struct.unpack_from(endian + "16sHHIQQQIHHHHHH", data, 0)
                      phoff, phentsize, phnum = header[5], header[9], header[10]
                      phfmt = endian + "IIQQQQQQ"
                      offset_index, filesz_index = 2, 5
                  elif elf_class == 1:
                      header = struct.unpack_from(endian + "16sHHIIIIIHHHHHH", data, 0)
                      phoff, phentsize, phnum = header[5], header[9], header[10]
                      phfmt = endian + "IIIIIIII"
                      offset_index, filesz_index = 1, 4
                  else:
                      return None
                  expected_size = struct.calcsize(phfmt)
                  if phentsize < expected_size or phnum > 4096:
                      return None
                  for index in range(phnum):
                      start = phoff + index * phentsize
                      if start < 0 or start + expected_size > len(data):
                          return None
                      program = struct.unpack_from(phfmt, data, start)
                      if program[0] != PT_NOTE:
                          continue
                      note_start = program[offset_index]
                      note_end = note_start + program[filesz_index]
                      if note_start < 0 or note_end > len(data):
                          return None
                      cursor = note_start
                      while cursor + 12 <= note_end:
                          namesz, descsz, note_type = struct.unpack_from(endian + "III", data, cursor)
                          cursor += 12
                          name_end = cursor + namesz
                          if name_end > note_end:
                              break
                          name = data[cursor:name_end]
                          cursor += align4(namesz)
                          desc_end = cursor + descsz
                          if desc_end > note_end:
                              break
                          desc = data[cursor:desc_end]
                          cursor += align4(descsz)
                          if note_type == NT_GNU_BUILD_ID and name.rstrip(b"\x00") == b"GNU":
                              return desc.hex()
              except (struct.error, OverflowError):
                  return None
              return None

          package_sha = sha256_file(archive)
          package_size = archive.stat().st_size
          candidates = []
          elfs = []
          metadata = []
          member_count = 0
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  name = safe_name(member.name)
                  member_count += 1
                  lower = name.lower()
                  if "launcher" in lower or lower == "tibia" or lower.endswith("/tibia") or lower.endswith("/client"):
                      candidates.append(name)
                  if not member.isfile():
                      continue
                  handle = bundle.extractfile(member)
                  if handle is None:
                      raise SystemExit("regular archive member could not be read")
                  data = handle.read()
                  if len(data) != member.size:
                      raise SystemExit("archive member size mismatch")
                  if data.startswith(ELF_MAGIC):
                      if len(data) > 1024 * 1024 * 1024:
                          raise SystemExit("ELF member exceeds inspection bound")
                      elfs.append({
                          "path": name,
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "size_bytes": len(data),
                          "elf_build_id": build_id(data),
                          "version_tokens": sorted({m.decode("ascii", "ignore") for m in VERSION_RE.findall(data)})[:24],
                      })
                  base = PurePosixPath(name).name.lower()
                  if base in {"package.json", "package.json.version"} and len(data) <= 256 * 1024:
                      record = {"path": name, "sha256": hashlib.sha256(data).hexdigest()}
                      text = data.decode("utf-8", "replace").strip()
                      if base == "package.json.version":
                          record["value"] = text[:256]
                      else:
                          try:
                              parsed = json.loads(text)
                          except json.JSONDecodeError:
                              parsed = None
                          if isinstance(parsed, dict):
                              record["version_fields"] = {
                                  str(k): v for k, v in parsed.items()
                                  if "version" in str(k).lower() and isinstance(v, (str, int, float, bool))
                              }
                      metadata.append(record)

          result = {
              "result": "PASS",
              "source_url": "https://static.tibia.com/download/tibia.x64.tar.gz",
              "package_filename": archive.name,
              "package_sha256": package_sha,
              "package_size_bytes": package_size,
              "archive_member_count": member_count,
              "launcher_or_client_paths": sorted(set(candidates)),
              "package_metadata": metadata,
              "elf_files": elfs,
              "binary_execution_performed": False,
              "credentials_used": False,
              "proprietary_artifact_retained": False,
          }
          if not elfs:
              raise SystemExit("official archive contains no ELF files")
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Verify acquisition cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/tibia-official-acquisition-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
