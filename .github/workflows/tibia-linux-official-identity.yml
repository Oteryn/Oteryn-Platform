name: Tibia Linux Official Identity

on:
  pull_request:
    paths:
      - tools/tibia-linux-reference/official_identity_probe.py
      - tools/tibia-linux-reference/official_host_preflight.py
      - tools/tibia-linux-reference/tests/test_official_offline.py
      - .github/workflows/tibia-linux-official-identity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquire-and-identify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install non-execution identity tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils file curl

      - name: Run focused offline-tool tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools/tibia-linux-reference/tests/test_official_offline.py -v
          python -m py_compile \
            tools/tibia-linux-reference/official_identity_probe.py \
            tools/tibia-linux-reference/official_host_preflight.py

      - name: Prove official host preflight rejects CI
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(PYTHONPATH=tools/tibia-linux-reference \
            python tools/tibia-linux-reference/official_host_preflight.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --evidence-dir "$RUNNER_TEMP/tibia-official-evidence" 2>/dev/null)"
          status=$?
          set -e
          test "$status" -eq 2
          python - "$output" <<'PY'
          import json
          import sys
          document = json.loads(sys.argv[1])
          assert document == {"error_class": "HarnessError", "result": "FAIL"}
          print('{"ci_execution_gate":"PASS","official_binary_executed":false}')
          PY

      - name: Acquire exact current official Linux package and identify without execution
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          work="$RUNNER_TEMP/tibia-official-identity-$GITHUB_RUN_ID"
          archive="$work/tibia.x64.tar.gz"
          identity="$work/identity.json"
          install -d -m 700 "$work"
          trap 'rm -rf "$work"' EXIT

          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            'https://static.tibia.com/download/tibia.x64.tar.gz' \
            --output "$archive"

          python tools/tibia-linux-reference/official_identity_probe.py \
            --archive "$archive" \
            --source-url 'https://static.tibia.com/download/tibia.x64.tar.gz' \
            --output "$identity"

          python - "$identity" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          summary = {
              'result': 'PASS',
              'source_url': document['source_url'],
              'package_filename': document['package_filename'],
              'package_sha256': document['package_sha256'],
              'package_size_bytes': document['package_size_bytes'],
              'archive_member_count': document['archive_member_count'],
              'launcher_or_client_paths': document['launcher_or_client_paths'],
              'elf_files': document['elf_files'],
              'binary_execution_performed': document['binary_execution_performed'],
              'credentials_used': document['credentials_used'],
          }
          print(json.dumps(summary, sort_keys=True))
          assert document['binary_execution_performed'] is False
          assert document['credentials_used'] is False
          assert document['elf_files'], 'official archive must contain at least one ELF file'
          PY

      - name: Verify no proprietary package or runtime evidence entered the checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tibia.x64.tar.gz
          test -z "$(git status --short --untracked-files=all)"
