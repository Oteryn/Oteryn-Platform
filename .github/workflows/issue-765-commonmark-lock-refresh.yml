name: Issue 765 CommonMark lock refresh

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: issue-765-commonmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-765-commonmark-2.9.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Refresh only CommonMark lock graph
        run: >-
          composer update league/commonmark
          --with-dependencies
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Validate repaired dependency state
        run: |
          composer validate --strict
          composer audit --no-interaction
          php -r '$lock=json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if (($package["name"] ?? null) === "league/commonmark") { if (($package["version"] ?? null) !== "2.9.0") { fwrite(STDERR, "Expected league/commonmark 2.9.0\n"); exit(1); } exit(0); } } fwrite(STDERR, "league/commonmark missing from lockfile\n"); exit(1);'

      - name: Remove one-shot helper and persist lockfile
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/issue-765-commonmark-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock .github/workflows/issue-765-commonmark-lock-refresh.yml
          git diff --cached --check
          git diff --cached --exit-code && { echo "No lockfile change produced" >&2; exit 1; } || true
          git commit -m "fix(deps): upgrade league/commonmark to 2.9.0"
          git push origin "HEAD:${HEAD_REF}"
