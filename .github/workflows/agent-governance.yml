name: Agent Governance

on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/agents/PLATFORM_AGENT_BOOTSTRAP.md
      - docs/agents/**
      - tools/agents/**
      - tools/validation/prompt_eval.py
      - tools/validation/test_prompt_eval.py
      - .github/workflows/agent-governance.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - docs/agents/PLATFORM_AGENT_BOOTSTRAP.md
      - docs/agents/**
      - tools/agents/**
      - tools/validation/prompt_eval.py
      - tools/validation/test_prompt_eval.py
      - .github/workflows/agent-governance.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run checkpoint validator tests
        run: python tools/agents/test_checkpoint.py

      - name: Run source branch closeout validator tests
        run: python tools/agents/test_source_branch_closeout.py

      - name: Run live task liveness tests
        run: python tools/agents/test_task_liveness.py

      - name: Run governing Issue liveness tests
        run: python tools/agents/test_task_issue_liveness.py

      - name: Run Documentation/Agent IA tests
        run: python tools/agents/test_documentation_ia.py

      - name: Run Control Room tests
        run: python tools/agents/test_control_room.py

      - name: Run policy consistency tests
        run: python tools/agents/test_policy_consistency.py

      - name: Validate cross-document policy consistency
        run: python tools/agents/policy_consistency.py

      - name: Run prompt contract evaluator tests
        run: python tools/validation/test_prompt_eval.py

      - name: Validate prompt contract suite
        run: python tools/validation/prompt_eval.py

      - name: Validate Documentation/Agent IA catalog
        run: python tools/agents/documentation_ia.py

      - name: Validate active task checkpoints
        shell: bash
        run: |
          if find docs/agents/tasks/active -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            python tools/agents/checkpoint.py --tasks docs/agents/tasks/active --require-checkpoint
          else
            echo "Validated 0 active task checkpoints."
          fi

      - name: Validate terminal source branch closeout
        shell: bash
        env:
          SOURCE_BRANCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          args=(--active docs/agents/tasks/active)
          if [[ -n "$SOURCE_BRANCH_BASE_SHA" && ! "$SOURCE_BRANCH_BASE_SHA" =~ ^0+$ ]]; then
            args+=(--archive docs/agents/tasks/archive --archive-changed-from "$SOURCE_BRANCH_BASE_SHA")
          fi
          python tools/agents/source_branch_closeout.py "${args[@]}"

      - name: Validate live governing-Issue ownership
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/agents/task_issue_liveness.py \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --active docs/agents/tasks/active

      - name: Validate live active-task ownership
        if: always()
        id: task_liveness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/agents/task_liveness.py \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --active docs/agents/tasks/active \
            --archive docs/agents/tasks/archive \
            --report-json "$RUNNER_TEMP/task-liveness.json"

      - name: Render live-aware Control Room
        if: always()
        run: |
          python tools/agents/control_room.py \
            --format json \
            --liveness-report "$RUNNER_TEMP/task-liveness.json" \
            --fail-on-live-invalid \
            > "$RUNNER_TEMP/control-room.json"

      - name: Enforce live task liveness
        if: always() && steps.task_liveness.outcome != 'success'
        run: |
          echo "Live active-task ownership validation failed."
          exit 1
