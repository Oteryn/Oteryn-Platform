name: Context Handoff

on:
  push:
    branches:
      - feat/OTERYN-20260728-game-catalog-slice-1
    paths:
      - '.github/workflows/context-handoff.yml'
      - 'docs/agents/tasks/active/OTERYN-20260728-game-catalog-slice-1.md'

permissions:
  contents: read

jobs:
  compact-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate checkpoint
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/active/OTERYN-20260728-game-catalog-slice-1.md
          --require-checkpoint

      - name: Generate compact handover
        run: >-
          python tools/agents/resume.py
          --task docs/agents/tasks/active/OTERYN-20260728-game-catalog-slice-1.md
          | tee resume.txt

      - name: Upload compact handover
        uses: actions/upload-artifact@v7
        with:
          name: context-handoff-${{ github.run_id }}
          path: resume.txt
          if-no-files-found: error
          retention-days: 1
