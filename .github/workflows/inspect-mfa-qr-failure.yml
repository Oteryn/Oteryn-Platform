name: Inspect MFA QR Failure

on:
  pull_request:
    paths:
      - .github/workflows/inspect-mfa-qr-failure.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print focused MFA web-flow failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_JOB_ID: 89844130696
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${CI_JOB_ID}/logs" > ci.log
          sed -n '1150,1195p' ci.log
