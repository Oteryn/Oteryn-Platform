name: Patch MFA QR Web Flow Test

on:
  pull_request:
    paths:
      - .github/workflows/inspect-mfa-qr-failure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260726-mfa-qr-enrollment
      - name: Replace manual-only enrollment assertion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/Feature/Identity/Mfa/MfaWebFlowTest.php')
          text = path.read_text()
          pattern = re.compile(
              r"(?m)^(?P<indent>\s*)->assertHeaderContains\('Cache-Control', 'no-store'\)\n"
              r"(?P=indent)->assertSee\(\$identity->two_factor_secret\)\n"
              r"(?P=indent)->assertSee\('otpauth://totp', false\);"
          )

          def replacement(match: re.Match[str]) -> str:
              indent = match.group('indent')
              return "\n".join([
                  f"{indent}->assertHeaderContains('Cache-Control', 'no-store')",
                  f"{indent}->assertSee('Scan with your authenticator app')",
                  f"{indent}->assertSee('data:image/svg+xml;base64,', false)",
                  f"{indent}->assertSee($identity->two_factor_secret)",
                  f"{indent}->assertDontSee('otpauth://totp', false);",
              ])

          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one MFA assertion chain, matched {count}.')
          path.write_text(updated)
          PY
      - name: Commit focused regression update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/Feature/Identity/Mfa/MfaWebFlowTest.php
          git commit -m 'test(identity): assert QR-first MFA enrollment'
          git push origin HEAD:feat/OTERYN-20260726-mfa-qr-enrollment
