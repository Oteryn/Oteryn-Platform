name: Public Domain Corroboration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-domain-corroboration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Collect independent sanitized observations
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          import socket
          import ssl
          import subprocess
          from pathlib import Path
          from typing import Any

          import os

          hosts = ['oteryn.molehill.cloud', 'login.oteryn.molehill.cloud']
          urls = [
              'http://oteryn.molehill.cloud/',
              'https://oteryn.molehill.cloud/',
              'https://oteryn.molehill.cloud/login?locale=en',
              'http://login.oteryn.molehill.cloud/health',
              'https://login.oteryn.molehill.cloud/health',
              'https://login.oteryn.molehill.cloud/version',
          ]
          user_agents = {
              'validator': 'Oteryn-Public-Domain-Validator/2.0 (read-only; PR-387)',
              'browser': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
          }

          def command(args: list[str]) -> dict[str, Any]:
              completed = subprocess.run(args, capture_output=True, text=True, timeout=30, check=False)
              return {
                  'returncode': completed.returncode,
                  'stdout': completed.stdout[-8000:],
                  'stderr': completed.stderr[-8000:],
              }

          def tls(host: str, version: ssl.TLSVersion) -> dict[str, Any]:
              context = ssl.create_default_context()
              context.minimum_version = version
              context.maximum_version = version
              try:
                  with socket.create_connection((host, 443), timeout=12) as raw:
                      with context.wrap_socket(raw, server_hostname=host) as wrapped:
                          der = wrapped.getpeercert(binary_form=True)
                          cert = wrapped.getpeercert()
                          return {
                              'success': True,
                              'negotiated': wrapped.version(),
                              'cipher': wrapped.cipher(),
                              'fingerprint_sha256': hashlib.sha256(der).hexdigest(),
                              'sans': [value for kind, value in cert.get('subjectAltName', ()) if kind == 'DNS'],
                          }
              except Exception as exc:
                  return {'success': False, 'error': f'{type(exc).__name__}: {exc}'}

          def curl(url: str, ua_name: str, ua: str) -> dict[str, Any]:
              headers = Path('/tmp/headers.txt')
              body = Path('/tmp/body.txt')
              result = command([
                  'curl', '--silent', '--show-error', '--location', '--max-redirs', '5',
                  '--connect-timeout', '10', '--max-time', '25',
                  '--user-agent', ua, '--header', 'Accept: text/html,application/json;q=0.9,*/*;q=0.1',
                  '--dump-header', str(headers), '--output', str(body),
                  '--write-out', '%{http_code}\n%{url_effective}\n%{remote_ip}\n%{ssl_verify_result}\n',
                  url,
              ])
              lines = result['stdout'].splitlines()
              raw_headers = headers.read_text(errors='replace') if headers.exists() else ''
              raw_body = body.read_text(errors='replace') if body.exists() else ''
              title_match = re.search(r'<title[^>]*>(.*?)</title>', raw_body, flags=re.I | re.S)
              cf_error = re.search(r'(?:Error\s+)?(10\d{2}|5\d{2})', raw_body, flags=re.I)
              selected = {}
              for name in ['server', 'cf-ray', 'cf-cache-status', 'location', 'strict-transport-security', 'cache-control', 'content-type']:
                  values = re.findall(rf'^{re.escape(name)}:\s*(.+)$', raw_headers, flags=re.I | re.M)
                  if values:
                      selected[name] = values
              return {
                  'url': url,
                  'user_agent': ua_name,
                  'curl_returncode': result['returncode'],
                  'curl_error': result['stderr'].strip() or None,
                  'http_code': lines[0] if len(lines) > 0 else None,
                  'effective_url': lines[1] if len(lines) > 1 else None,
                  'remote_ip': lines[2] if len(lines) > 2 else None,
                  'ssl_verify_result': lines[3] if len(lines) > 3 else None,
                  'headers': selected,
                  'title': title_match.group(1).strip() if title_match else None,
                  'cloudflare_error_code_candidate': cf_error.group(1) if cf_error else None,
                  'body_sha256': hashlib.sha256(raw_body.encode()).hexdigest(),
                  'body_length': len(raw_body.encode()),
              }

          evidence = {
              'classification': 'PUBLIC_EDGE_CORROBORATED',
              'production_environment_proven': False,
              'validation_sha': os.environ['VALIDATION_SHA'],
              'observed_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'tls': {
                  host: {
                      'TLSv1.2': tls(host, ssl.TLSVersion.TLSv1_2),
                      'TLSv1.3': tls(host, ssl.TLSVersion.TLSv1_3),
                  }
                  for host in hosts
              },
              'http': [curl(url, name, ua) for url in urls for name, ua in user_agents.items()],
              'safety': {'secrets_used': False, 'credentials_used': False, 'requests_are_read_only': True},
          }
          Path('/tmp/public-domain-corroboration.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'tls': evidence['tls'],
              'http': [{k: item.get(k) for k in ('url', 'user_agent', 'curl_returncode', 'http_code', 'title', 'cloudflare_error_code_candidate', 'curl_error')} for item in evidence['http']],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload corroboration evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-domain-corroboration-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/public-domain-corroboration.json
          retention-days: 14
          if-no-files-found: error
