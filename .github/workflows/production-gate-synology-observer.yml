name: Production Gate Synology Read-only Observer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-gate-synology-observer.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: production-gate-synology-readonly
  cancel-in-progress: false

jobs:
  dispatch-trusted-readonly-inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/production-go-live-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Dispatch branch-defined trusted inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/synology-production-target-preflight.yml/dispatches"             -f ref=agent/production-go-live-gate             -f 'inputs[run_restore_drill]=false'
          echo "INVENTORY_DISPATCHED_AT=$dispatched_at" >> "$GITHUB_ENV"

      - name: Locate dispatched inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              gh api                 "repos/${GITHUB_REPOSITORY}/actions/workflows/synology-production-target-preflight.yml/runs?event=workflow_dispatch&branch=agent%2Fproduction-go-live-gate&per_page=20"                 --jq ".workflow_runs | map(select(.created_at >= \"${INVENTORY_DISPATCHED_AT}\")) | sort_by(.created_at) | last | .id // empty"
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "Trusted read-only inventory was dispatched but no run appeared." >&2
            exit 1
          fi
          echo "INVENTORY_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "INVENTORY_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run_id" >> "$GITHUB_ENV"

      - name: Wait for trusted inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run watch "$INVENTORY_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --exit-status             --interval 10

      - name: Validate sanitized evidence artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence_dir="$(mktemp -d)"
          trap 'rm -rf "$evidence_dir"' EXIT
          artifact_name="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INVENTORY_RUN_ID}/artifacts"               --jq '.artifacts | map(select(.name | startswith("production-gate-synology-readonly-"))) | first | .name // empty'
          )"
          artifact_digest="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INVENTORY_RUN_ID}/artifacts"               --jq '.artifacts | map(select(.name | startswith("production-gate-synology-readonly-"))) | first | .digest // empty'
          )"
          test -n "$artifact_name"
          test -n "$artifact_digest"
          gh run download "$INVENTORY_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$artifact_name"             --dir "$evidence_dir"
          evidence_file="$(find "$evidence_dir" -type f -name '*.json' -print -quit)"
          test -n "$evidence_file"
          python3 - "$evidence_file" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              evidence = json.load(handle)

          release = evidence.get("deployed_release_sha", "")
          gateway = evidence.get("gateway_release_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", release):
              raise SystemExit("Platform release is not an exact commit SHA")
          if release != gateway or not evidence.get("platform_gateway_release_match"):
              raise SystemExit("Platform and Gateway release identities differ")
          if evidence.get("database_restore_drill") != "NOT_RUN":
              raise SystemExit("unexpected restore activity")
          if evidence.get("production_mutation") != "NONE":
              raise SystemExit("unexpected production mutation marker")
          if not all(evidence.get("health_probes", {}).values()):
              raise SystemExit("bounded health probe failed")
          PY

          release_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["deployed_release_sha"])' "$evidence_file")"
          runtime="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["runtime_classification"])' "$evidence_file")"
          mariadb_restart="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["services"]["mariadb"]["restart_policy"])' "$evidence_file")"
          {
            echo "### Production Gate trusted Synology observation"
            echo "- dispatched run: `$INVENTORY_RUN_ID`"
            echo "- deployed Platform/Gateway source SHA: `$release_sha`"
            echo "- runtime classification: `$runtime`"
            echo "- MariaDB restart policy: `$mariadb_restart`"
            echo "- restore drill: `NOT_RUN`"
            echo "- production mutation: `NONE`"
            echo "- sanitized artifact: `$artifact_name`"
            echo "- artifact digest: `$artifact_digest`"
          } >> "$GITHUB_STEP_SUMMARY"
