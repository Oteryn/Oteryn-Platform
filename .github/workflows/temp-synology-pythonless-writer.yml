name: Temporary Synology Pythonless Fix Writer

on:
  push:
    branches:
      - fix/20260907-synology-runner-pythonless
    paths:
      - .github/workflows/temp-synology-pythonless-writer.yml

permissions:
  contents: write

jobs:
  write-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-runner-pythonless
          fetch-depth: 0

      - name: Apply and validate bounded repair
        run: |
          set -euo pipefail
          python3 .github/scripts/temp_synology_fix_writer.py
          bash -n deploy/synology/scripts/validate-ipv4.sh deploy/synology/scripts/deploy.sh
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Commit repair and remove temporary writer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(staging): remove Python dependency from Synology deploy"
          git push origin HEAD:fix/20260907-synology-runner-pythonless
