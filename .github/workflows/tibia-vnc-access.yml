name: Tibia VNC Access

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-vnc-access.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  RELAY_NAME: oteryn-tibia-vnc-relay

jobs:
  vnc:
    name: Expose live Tibia Xvfb over LAN VNC
    runs-on: oteryn-staging
    timeout-minutes: 8
    steps:
      - name: Verify owned live runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null
          docker exec "$CONTAINER_NAME" pgrep -f '^Xvfb :99' >/dev/null

      - name: Attach x11vnc to existing display without restarting client
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99
          command -v x11vnc >/dev/null
          pgrep -x client >/dev/null
          pgrep -f '^Xvfb :99' >/dev/null
          pkill -x x11vnc 2>/dev/null || true
          rm -f /data/runtime/x11vnc.log
          x11vnc -display :99 -forever -shared -noxdamage -rfbport 5900 -nopw -o /data/runtime/x11vnc.log -bg
          for _ in $(seq 1 20); do ss -lnt | grep -q ':5900 ' && break; sleep 1; done
          ss -lnt | grep -q ':5900 '
          pgrep -x x11vnc >/dev/null
          pgrep -x client >/dev/null
          echo X11VNC_READY=true
          INNER

      - name: Publish VNC explicitly on Synology LAN addresses
        shell: bash
        run: |
          set -Eeuo pipefail
          target_ip=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_NAME")
          [[ -n "$target_ip" ]]
          docker rm -f "$RELAY_NAME" >/dev/null 2>&1 || true
          docker run -d --name "$RELAY_NAME" --restart unless-stopped --network host alpine/socat \
            TCP-LISTEN:5900,bind=0.0.0.0,fork,reuseaddr TCP:"$target_ip":5900 >/dev/null
          sleep 2
          docker logs "$RELAY_NAME" || true
          docker inspect -f '{{.State.Running}}' "$RELAY_NAME" | grep -qx true
          echo VNC_RELAY_READY=true

      - name: Verify RFB on physical Synology LAN interfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          addr_dump=$(docker run --rm --network host alpine sh -lc 'ip -4 -o addr show scope global')
          printf '%s\n' "$addr_dump"
          candidates=$(printf '%s\n' "$addr_dump" | awk '$2 ~ /^ovs_eth/ {print $4}' | cut -d/ -f1 | awk '!seen[$0]++')
          [[ -n "$candidates" ]]
          for ip in $candidates; do
            echo TESTING_VNC_ADDRESS="$ip:5900"
            banner=$(docker run --rm --network host alpine sh -lc "timeout 2 nc $ip 5900 | head -c 12" || true)
            echo RFB_BANNER="$banner"
            if [[ "$banner" == RFB* ]]; then
              echo VNC_ADDRESS="$ip:5900"
              echo VNC_BANNER_VERIFIED=true
              exit 0
            fi
          done
          echo HOST_LISTENERS_BEGIN
          docker run --rm --network host alpine sh -lc 'ss -lntp 2>/dev/null | grep 5900 || netstat -lntp 2>/dev/null | grep 5900 || true'
          echo HOST_LISTENERS_END
          exit 1
