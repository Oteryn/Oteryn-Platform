name: Native Producer Schema Identity Once

on:
  push:
    branches:
      - feat/OTERYN-20260804-native-protocol-producer

permissions:
  contents: write

concurrency:
  group: native-producer-schema-identity-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260804-native-protocol-producer
          fetch-depth: 0

      - name: Apply exact native identity to fixtures and Platform policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          digest = "c7665223f09001e3294e9a03ab4784defed66b0ac04450e8679d4778421207f8"

          path = Path("services/game-gateway/internal/gateway/service_test.go")
          text = path.read_text()
          text = text.replace(
              'SchemaRevision: 1, SchemaSHA256: strings.Repeat("a", 64), Capabilities: sorted,',
              'SchemaRevision: 1, SchemaSHA256: schemaHashForCandidate(family, profile), Capabilities: sorted,',
              1,
          )
          text = text.replace(
              'SchemaRevision: 1, SchemaSHA256: strings.Repeat("a", 64),\n\t\tRequiredCapabilities:',
              'SchemaRevision: 1, SchemaSHA256: schemaHashForCandidate(family, profile),\n\t\tRequiredCapabilities:',
              1,
          )
          marker = '\nfunc policyCandidate('
          helper = f'''\nfunc schemaHashForCandidate(family, profile string) string {{
          \tif family == "oteryn" && profile == "oteryn.native.v1" {{
          \t\treturn canonicalNativeSchemaSHA256
          \t}}
          \treturn strings.Repeat("a", 64)
          }}
          '''
          if marker not in text:
              raise SystemExit("service_test helper insertion marker missing")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          path = Path("services/game-gateway/internal/httpapi/server_test.go")
          text = path.read_text()
          old_policy = 'SchemaRevision: 1, SchemaSHA256: strings.Repeat("a", 64), RequiredCapabilities: capabilities,'
          old_offer = 'SchemaRevision: 1, SchemaSHA256: strings.Repeat("a", 64), Capabilities: capabilities,'
          if old_policy not in text or old_offer not in text:
              raise SystemExit("server_test native fixture markers missing")
          text = text.replace(old_policy, f'SchemaRevision: 1, SchemaSHA256: "{digest}", RequiredCapabilities: capabilities,', 1)
          text = text.replace(old_offer, f'SchemaRevision: 1, SchemaSHA256: "{digest}", Capabilities: capabilities,', 1)
          path.write_text(text)

          path = Path("services/game-gateway/internal/e2e/native_producer_test.go")
          text = path.read_text()
          old = 'const schemaHash = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
          if old not in text:
              raise SystemExit("E2E schema marker missing")
          path.write_text(text.replace(old, f'const schemaHash = "{digest}"', 1))

          path = Path("app/GameAuth/Worlds/DatabaseWorldRegistry.php")
          text = path.read_text()
          marker = "    private const IDENTIFIER_PATTERN = '/\\A[a-z0-9][a-z0-9._-]{0,63}\\z/D';\n"
          constants = marker + f'''\n    private const NATIVE_SCHEMA_SHA256 = '{digest}';

    private const NATIVE_BASE_CAPABILITIES = [
        'actions.command-result.v1',
        'chat.semantic.v1',
        'combat.server-authoritative.v1',
        'inventory.server-authoritative.v1',
        'ordering.server-sequence.v1',
        'reconciliation.movement.v1',
        'session.single-admission.v1',
        'state.revision.v1',
        'state.snapshot-delta.v1',
    ];
'''
          if marker not in text:
              raise SystemExit("registry constant marker missing")
          text = text.replace(marker, constants, 1)
          validation_marker = "        if ($required === null || $optional === null || array_intersect($required, $optional) !== []) {\n            return null;\n        }\n"
          validation = validation_marker + '''
        if ($candidate->family === 'oteryn'
            && $candidate->profile === 'oteryn.native.v1'
            && ($candidate->transport !== 'tcp.tls13.protobuf.be32.v1'
                || $candidate->schema_revision !== 1
                || $candidate->schema_sha256 !== self::NATIVE_SCHEMA_SHA256
                || array_diff(self::NATIVE_BASE_CAPABILITIES, $required) !== [])
        ) {
            return null;
        }
'''
          if validation_marker not in text:
              raise SystemExit("registry validation marker missing")
          path.write_text(text.replace(validation_marker, validation, 1))

          path = Path("tests/Feature/GameAuth/WorldRegistryTest.php")
          text = path.read_text()
          class_marker = "    private const NATIVE_CAPABILITIES = [\n"
          if class_marker not in text:
              raise SystemExit("WorldRegistryTest constant marker missing")
          text = text.replace(class_marker, f"    private const NATIVE_SCHEMA_SHA256 = '{digest}';\n\n" + class_marker, 1)
          old = "            'schema_sha256' => str_repeat('a', 64),"
          new = "            'schema_sha256' => $family === 'oteryn' && $profile === 'oteryn.native.v1'\n                ? self::NATIVE_SCHEMA_SHA256\n                : str_repeat('a', 64),"
          if old not in text:
              raise SystemExit("WorldRegistryTest schema fixture missing")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/Feature/GameAuth/GameLoginContextApiTest.php")
          text = path.read_text()
          if class_marker not in text:
              raise SystemExit("GameLoginContextApiTest constant marker missing")
          text = text.replace(class_marker, f"    private const NATIVE_SCHEMA_SHA256 = '{digest}';\n\n" + class_marker, 1)
          old = "            'schema_sha256' => str_repeat('a', 64),"
          if old not in text:
              raise SystemExit("GameLoginContextApiTest schema fixture missing")
          path.write_text(text.replace(old, "            'schema_sha256' => self::NATIVE_SCHEMA_SHA256,", 1))
          PY

          gofmt -w \
            services/game-gateway/internal/gateway/service_test.go \
            services/game-gateway/internal/httpapi/server_test.go \
            services/game-gateway/internal/e2e/native_producer_test.go

      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/native-producer-schema-identity-once.yml
          git add app/GameAuth/Worlds/DatabaseWorldRegistry.php
          git add tests/Feature/GameAuth/WorldRegistryTest.php
          git add tests/Feature/GameAuth/GameLoginContextApiTest.php
          git add services/game-gateway/internal/gateway/service_test.go
          git add services/game-gateway/internal/httpapi/server_test.go
          git add services/game-gateway/internal/e2e/native_producer_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(protocol): enforce canonical native schema identity"
          git push origin HEAD:feat/OTERYN-20260804-native-protocol-producer
