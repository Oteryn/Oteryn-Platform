name: Synology Docker Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/synology-docker-cleanup.yml'
  workflow_dispatch:

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ops/synology-docker-cleanup'
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Inspect Docker containers only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== docker ps -a ==='
          docker ps -a --no-trunc --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.CreatedAt}}\t{{.Labels}}'
