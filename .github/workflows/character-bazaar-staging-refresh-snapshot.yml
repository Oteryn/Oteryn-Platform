name: Character Bazaar Staging Refresh Snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/character-bazaar-staging-refresh-snapshot.yml'

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 717977f252b09b9b2e979f8110b7f48b88682223
    steps:
      - name: Report exact staging refresh state
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&per_page=100")"
          run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.name == "Character Bazaar Staging Control" and .head_sha == $sha)] | first // {}' <<<"$runs")"
          run_id="$(jq -r '.id // empty' <<<"$run")"
          if [[ -z "$run_id" ]]; then
            echo "STAGING_REFRESH_SNAPSHOT target_sha=${TARGET_SHA} run_id=none status=not_found conclusion=none"
            exit 0
          fi
          status="$(jq -r '.status // "unknown"' <<<"$run")"
          conclusion="$(jq -r '.conclusion // "pending"' <<<"$run")"
          created_at="$(jq -r '.created_at // "unknown"' <<<"$run")"
          updated_at="$(jq -r '.updated_at // "unknown"' <<<"$run")"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          job="$(jq -c '[.jobs[] | select(.name == "control")] | first // {}' <<<"$jobs")"
          job_id="$(jq -r '.id // "none"' <<<"$job")"
          job_status="$(jq -r '.status // "unknown"' <<<"$job")"
          job_conclusion="$(jq -r '.conclusion // "pending"' <<<"$job")"
          current_step="$(jq -r '[.steps[] | select(.status == "in_progress")] | first | .name // "none"' <<<"$job")"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_count="$(jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("character-bazaar-staging-"))] | length' <<<"$artifacts")"
          echo "STAGING_REFRESH_SNAPSHOT target_sha=${TARGET_SHA} run_id=${run_id} status=${status} conclusion=${conclusion} created_at=${created_at} updated_at=${updated_at} job_id=${job_id} job_status=${job_status} job_conclusion=${job_conclusion} current_step=${current_step@Q} artifact_count=${artifact_count}"
