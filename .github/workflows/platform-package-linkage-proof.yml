name: Platform Package Linkage Proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-package-linkage-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-linkage-proof:
    if: github.head_ref == 'migration/issue-1155-package-linkage-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify package objects and repository linkage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: Oteryn/Oteryn-Platform
          EXPECTED_REPOSITORY_ID: '1305155726'
        run: |
          set -euo pipefail
          packages=(oteryn-platform oteryn-game-gateway oteryn-deploy-runner)
          for package in "${packages[@]}"; do
            package_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/orgs/Oteryn/packages/container/${package}")"

            repository="$(jq -r '.repository.full_name // empty' <<<"${package_json}")"
            repository_id="$(jq -r '.repository.id // empty' <<<"${package_json}")"
            visibility="$(jq -r '.visibility // empty' <<<"${package_json}")"
            package_id="$(jq -r '.id // empty' <<<"${package_json}")"

            test -n "${package_id}"
            test "${repository}" = "${EXPECTED_REPOSITORY}"
            test "${repository_id}" = "${EXPECTED_REPOSITORY_ID}"
            test -n "${visibility}"

            versions_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/orgs/Oteryn/packages/container/${package}/versions?per_page=1")"
            version_id="$(jq -r '.[0].id // empty' <<<"${versions_json}")"
            test -n "${version_id}"

            echo "PACKAGE_LINKAGE_PASS package=${package} package_id=${package_id} visibility=${visibility} repository=${repository} repository_id=${repository_id} readable_version_id=${version_id}"
          done
