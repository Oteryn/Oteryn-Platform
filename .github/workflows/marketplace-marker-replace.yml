name: Marketplace Marker Replace

on:
  pull_request:
    paths:
      - '.github/workflows/marketplace-marker-replace.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Replace stale Marketplace acceptance marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/acceptance/coverage/portal-coverage-manifest.json')
          text = path.read_text()
          old = '@portal-marketplace-account authenticated watch bid wallet reservation dashboard and authorization journey'
          new = '@portal-marketplace-account authenticated watch bid wallet reservation complete state matrix and authorization journey'
          if old not in text:
              raise SystemExit('Stale Marketplace acceptance marker was not found.')
          path.write_text(text.replace(old, new))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/acceptance/coverage/portal-coverage-manifest.json
          git commit -m 'test(marketplace): update acceptance evidence marker'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
