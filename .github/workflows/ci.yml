name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.classify.outputs.ci }}
      phase7: ${{ steps.classify.outputs.phase7 }}
      edge: ${{ steps.classify.outputs.edge }}
      db_outage: ${{ steps.classify.outputs.db_outage }}
      game_auth_concurrency: ${{ steps.classify.outputs.game_auth_concurrency }}
      classes: ${{ steps.classify.outputs.classes }}
      paths_json: ${{ steps.classify.outputs.paths_json }}
      reuse_heavy: ${{ steps.reuse.outputs.reuse_heavy }}
      reused_head_sha: ${{ steps.reuse.outputs.reused_head_sha }}
      reused_run_id: ${{ steps.reuse.outputs.reused_run_id }}
      material_tree_digest: ${{ steps.reuse.outputs.material_tree_digest }}
    steps:
      - name: Checkout exact classification range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate CI routing contracts
        run: |
          python tests/ci/test_classify_changes.py
          python tests/ci/test_push_change_routing.py
          python tests/ci/test_required_test_gate.py
          python tests/ci/test_heavy_evidence_reuse.py
          python tests/ci/test_workflow_trigger_economy.py
          python tests/ci/test_dependency_update_contract.py

      - name: Validate Oracle deployment authority and recovery
        run: |
          python deploy/oracle/test_actions_deploy.py
          python deploy/oracle/test_game_supervisor.py
          python deploy/oracle/test_runner_boundary.py

      - name: Validate architecture decision registries
        run: |
          python tools/validation/test_adr_registry.py
          python tools/validation/adr_registry.py
          python tools/validation/test_architecture_decision_backlog.py
          python tools/validation/architecture_decision_backlog.py

      - name: Validate deterministic prompt contracts
        run: |
          python tools/validation/test_prompt_eval.py
          python tools/validation/prompt_eval.py

      - name: Validate workflow inventory and lifecycle
        run: |
          python tools/validation/test_workflow_inventory.py
          python tools/validation/workflow_inventory.py

      - name: Validate immutable GitHub Actions references
        run: |
          python tools/validation/test_github_actions_pinning.py
          python tools/validation/github_actions_pinning.py --inventory-json

      - name: Validate legacy token ratchet
        run: |
          python tools/validation/test_legacy_token_ratchet.py
          python tools/validation/legacy_token_ratchet.py

      - name: Validate active task checkpoint contract
        shell: bash
        run: |
          if find docs/agents/tasks/active -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            python tools/agents/checkpoint.py --tasks docs/agents/tasks/active --require-checkpoint
          else
            echo "Validated 0 active task checkpoints."
          fi

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            python scripts/ci/classify_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/ci/classify_push_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve reusable prior runtime evidence
        id: reuse
        if: ${{ github.event_name == 'pull_request' && steps.classify.outputs.ci == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python scripts/ci/heavy_evidence_reuse.py
          --repository "$GITHUB_REPOSITORY"
          --pr-number "$PR_NUMBER"
          --workflow "ci.yml"
          --job-name "runtime-tests"
          --head "$HEAD_SHA"
          --token-env GH_TOKEN
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  runtime_tests:
    name: runtime-tests
    # The Laravel suite this job ran was removed from the repository (owner decision
    # 2026-11-11). The job keeps its required check name; the Rust portal is
    # validated by Portal RS CI (`check`).
    needs: classify_changes
    if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.ci == 'true' && needs.classify_changes.outputs.reuse_heavy != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record retired Laravel runtime validation
        run: |
          summary="runtime-tests: Laravel validation retired; the Laravel app was removed (owner decision 2026-11-11)."
          echo "$summary"
          echo "### $summary" >> "$GITHUB_STEP_SUMMARY"

  platform_postgres:
    name: platform-postgres (${{ matrix.postgres }})
    # The Laravel PostgreSQL suite this job ran was removed from the repository (owner
    # decision 2026-11-11). The job keeps the required "platform-postgres (17)" and
    # "platform-postgres (16)" check names; portal-rs runs its PostgreSQL 18.6 tests in
    # Portal RS CI. Its matrix must match `platform_postgres_not_required` exactly
    # (tests/ci/test_workflow_trigger_economy.py).
    needs: classify_changes
    if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.ci == 'true' }}
    strategy:
      matrix:
        postgres: ['17', '16']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record retired Laravel PostgreSQL validation
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: |
          summary="PostgreSQL ${POSTGRES_MAJOR}: Laravel validation retired; the Laravel app was removed (owner decision 2026-11-11)."
          echo "$summary"
          echo "### $summary" >> "$GITHUB_STEP_SUMMARY"

  platform_postgres_not_required:
    name: platform-postgres (${{ matrix.postgres }})
    # Reports the required "platform-postgres (17)" and "platform-postgres (16)" checks when
    # classify-changes proves the change needs no CI (ci == 'false', e.g. a docs-only PR).
    # A skipped matrix job reports only its unrendered name, so without this job those
    # required checks never report and the PR stays blocked. It runs only on an explicit
    # 'false': a failed classification or ci == 'true' leaves it skipped, and then
    # `platform_postgres` above is the only job that reports these names. Its matrix must
    # match `platform_postgres` exactly (tests/ci/test_workflow_trigger_economy.py).
    needs: classify_changes
    if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.ci == 'false' }}
    strategy:
      matrix:
        postgres: ['17', '16']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record that PostgreSQL validation is not required
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
          CI_REQUIRED: ${{ needs.classify_changes.outputs.ci }}
          CHANGE_CLASSES: ${{ needs.classify_changes.outputs.classes }}
        run: |
          set -euo pipefail
          test "$CI_REQUIRED" = false
          summary="PostgreSQL ${POSTGRES_MAJOR}: not required; classify-changes reported ci=false (classes: ${CHANGE_CLASSES:-none})."
          echo "$summary"
          echo "### $summary" >> "$GITHUB_STEP_SUMMARY"

  php_coverage:
    name: php-coverage-report
    # The Laravel coverage this job measured was removed from the repository (owner
    # decision 2026-11-11). The job keeps its check name and its trigger condition.
    needs: classify_changes
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'merge_group') &&
        needs.classify_changes.result == 'success' &&
        needs.classify_changes.outputs.ci == 'true' &&
        (
          contains(needs.classify_changes.outputs.classes, 'backend') ||
          contains(needs.classify_changes.outputs.classes, 'auth_security') ||
          contains(needs.classify_changes.outputs.classes, 'payment') ||
          contains(needs.classify_changes.outputs.classes, 'database') ||
          contains(needs.classify_changes.outputs.classes, 'dependency') ||
          contains(needs.classify_changes.outputs.classes, 'shared') ||
          contains(needs.classify_changes.outputs.paths_json, '.github/workflows/ci.yml')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record retired Laravel coverage measurement
        run: |
          summary="php-coverage-report: Laravel validation retired; the Laravel app was removed (owner decision 2026-11-11)."
          echo "$summary"
          echo "### $summary" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs:
      - classify_changes
      - runtime_tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact required-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Evaluate required test gate
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify_changes.result }}
          CI_REQUIRED: ${{ needs.classify_changes.outputs.ci }}
          RUNTIME_TESTS_RESULT: ${{ needs.runtime_tests.result }}
          REUSE_HEAVY: ${{ needs.classify_changes.outputs.reuse_heavy }}
          REUSED_HEAD_SHA: ${{ needs.classify_changes.outputs.reused_head_sha }}
          REUSED_RUN_ID: ${{ needs.classify_changes.outputs.reused_run_id }}
        run: >-
          python scripts/ci/required_test_gate.py
          --classification-result "$CLASSIFICATION_RESULT"
          --ci-required "$CI_REQUIRED"
          --runtime-tests-result "$RUNTIME_TESTS_RESULT"
          --reuse-heavy "$REUSE_HEAVY"
          --reused-head-sha "$REUSED_HEAD_SHA"
          --reused-run-id "$REUSED_RUN_ID"
          --summary "$GITHUB_STEP_SUMMARY"

  platform_gate:
    name: platform-gate
    if: ${{ always() }}
    needs:
      - classify_changes
      - test
      - platform_postgres
      - php_coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require existing Platform aggregate gates
        shell: bash
        env:
          CLASSIFY_CHANGES_RESULT: ${{ needs.classify_changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_POSTGRES_RESULT: ${{ needs.platform_postgres.result }}
          PHP_COVERAGE_RESULT: ${{ needs.php_coverage.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_CHANGES_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PLATFORM_POSTGRES_RESULT" = success -o "$PLATFORM_POSTGRES_RESULT" = skipped
          test "$PHP_COVERAGE_RESULT" = success -o "$PHP_COVERAGE_RESULT" = skipped
