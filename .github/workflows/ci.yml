name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.classify.outputs.ci }}
      phase7: ${{ steps.classify.outputs.phase7 }}
      edge: ${{ steps.classify.outputs.edge }}
      db_outage: ${{ steps.classify.outputs.db_outage }}
      game_auth_concurrency: ${{ steps.classify.outputs.game_auth_concurrency }}
      classes: ${{ steps.classify.outputs.classes }}
      paths_json: ${{ steps.classify.outputs.paths_json }}
      reuse_heavy: ${{ steps.reuse.outputs.reuse_heavy }}
      reused_head_sha: ${{ steps.reuse.outputs.reused_head_sha }}
      reused_run_id: ${{ steps.reuse.outputs.reused_run_id }}
      material_tree_digest: ${{ steps.reuse.outputs.material_tree_digest }}
    steps:
      - name: Checkout exact classification range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate CI routing contracts
        run: |
          python tests/ci/test_classify_changes.py
          python tests/ci/test_push_change_routing.py
          python tests/ci/test_required_test_gate.py
          python tests/ci/test_heavy_evidence_reuse.py
          python tests/ci/test_workflow_trigger_economy.py
          python tests/ci/test_acceptance_lockfile_contract.py
          python tests/ci/test_dependency_update_contract.py
          python tests/ci/test_synology_deploy_release_identity.py

      - name: Validate Integration execution registry
        run: |
          python tools/validation/test_verify_integration_test_registration.py
          python tools/validation/verify_integration_test_registration.py

      - name: Validate deterministic prompt contracts
        run: |
          python tools/validation/test_prompt_eval.py
          python tools/validation/prompt_eval.py

      - name: Validate workflow inventory and lifecycle
        run: |
          python tools/validation/test_workflow_inventory.py
          python tools/validation/workflow_inventory.py
          python tools/audit/test_portal_exhaustive_audit.py

      - name: Validate PHP coverage policy
        run: |
          python tools/validation/test_php_coverage_policy.py
          python tools/validation/php_coverage_policy.py --validate-policy

      - name: Validate immutable GitHub Actions references
        run: |
          python tools/validation/test_github_actions_pinning.py
          python tools/validation/github_actions_pinning.py --inventory-json

      - name: Validate legacy token ratchet
        run: |
          python tools/validation/test_legacy_token_ratchet.py
          python tools/validation/legacy_token_ratchet.py

      - name: Validate active task checkpoint contract
        shell: bash
        run: |
          if find docs/agents/tasks/active -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            python tools/agents/checkpoint.py --tasks docs/agents/tasks/active --require-checkpoint
          else
            echo "Validated 0 active task checkpoints."
          fi

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            python scripts/ci/classify_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/ci/classify_push_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve reusable prior runtime evidence
        id: reuse
        if: ${{ github.event_name == 'pull_request' && steps.classify.outputs.ci == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python scripts/ci/heavy_evidence_reuse.py
          --repository "$GITHUB_REPOSITORY"
          --pr-number "$PR_NUMBER"
          --workflow "ci.yml"
          --job-name "runtime-tests"
          --head "$HEAD_SHA"
          --token-env GH_TOKEN
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  runtime_tests:
    name: runtime-tests
    needs: classify_changes
    if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.ci == 'true' && needs.classify_changes.outputs.reuse_heavy != 'true' }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: oteryn-ci-root-password
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MARIADB_INTEGRATION_HOST: 127.0.0.1
      MARIADB_INTEGRATION_PORT: 3306
      MARIADB_INTEGRATION_ROOT_PASSWORD: oteryn-ci-root-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pcntl, gd
          tools: composer:v2

      - name: Verify editorial image codecs
        run: >-
          php -r 'exit(extension_loaded("gd") && (imagetypes() & IMG_JPG) && (imagetypes() & IMG_PNG) && (imagetypes() & IMG_WEBP) ? 0 : 1);'

      - name: Validate Composer metadata and lockfile
        run: composer validate --strict

      - name: Install dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Start formatting and static analysis alongside tests
        run: |
          mkdir -p artifacts/ci
          rm -f artifacts/ci/pint.status artifacts/ci/analyse.status
          (set +e; vendor/bin/pint --test -v >artifacts/ci/pint.log 2>&1; echo "$?" >artifacts/ci/pint.status) &
          (set +e; composer analyse >artifacts/ci/analyse.log 2>&1; echo "$?" >artifacts/ci/analyse.status) &

      - name: Run tests
        run: |
          mkdir -p artifacts/ci
          php artisan config:clear --ansi
          php artisan test --log-junit=artifacts/ci/phpunit-junit.xml

      - name: Require formatting and static analysis results
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for check in pint analyse; do
            for _ in $(seq 1 300); do
              [ -s "artifacts/ci/${check}.status" ] && break
              sleep 1
            done
            echo "::group::${check} output"
            cat "artifacts/ci/${check}.log" || true
            echo "::endgroup::"
            if [ "$(cat "artifacts/ci/${check}.status" 2>/dev/null || echo missing)" != "0" ]; then
              echo "::error::${check} did not pass"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload PHPUnit failure diagnostics
        if: failure() && hashFiles('artifacts/ci/phpunit-junit.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-phpunit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/phpunit-junit.xml
          if-no-files-found: error
          retention-days: 7

  platform_postgres:
    name: platform-postgres (${{ matrix.postgres }})
    # Stage B of the Platform PostgreSQL migration probe: blocking. The full suite and the
    # PostgreSQL concurrency tests (tests/Feature/*/Concurrency/*PgsqlTest) must pass on
    # PostgreSQL 17 (the target engine) and 16 (the previous major). The job is part of the
    # `platform-gate` needs below. Adding "platform-postgres (17)" and "platform-postgres (16)"
    # to the branch ruleset's required checks is an owner step.
    # It does not honour runtime-tests reuse: the reuse lookup only proves a prior successful
    # `runtime-tests` job, which is no PostgreSQL evidence, so a skipped job would otherwise
    # let `platform-gate` pass without any PostgreSQL run on the head.
    needs: classify_changes
    if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: oteryn-ci-postgres-password
          POSTGRES_DB: oteryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oteryn_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: oteryn_test
      DB_USERNAME: postgres
      DB_PASSWORD: oteryn-ci-postgres-password
      PGSQL_INTEGRATION_HOST: 127.0.0.1
      PGSQL_INTEGRATION_PORT: 5432
      PGSQL_INTEGRATION_USER: postgres
      PGSQL_INTEGRATION_PASSWORD: oteryn-ci-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql, pdo_mysql, pcntl, gd
          tools: composer:v2

      - name: Install dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run the full suite on PostgreSQL ${{ matrix.postgres }}
        run: |
          mkdir -p artifacts/ci
          php artisan config:clear --ansi
          vendor/bin/phpunit --configuration phpunit.pgsql.xml --log-junit artifacts/ci/phpunit-pgsql-junit.xml

      - name: Summarise PostgreSQL failures
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          path = "artifacts/ci/phpunit-pgsql-junit.xml"
          if not os.path.isfile(path):
              print("::error::No PHPUnit JUnit report was produced on PostgreSQL.")
              sys.exit(1)
          failed = []
          total = skipped = 0
          concurrency_ok = 0
          concurrency_bad = []
          for case in ET.parse(path).getroot().iter("testcase"):
              total += 1
              owner = case.get('class') or case.get('classname') or case.get('file')
              name = f"{owner}::{case.get('name')}"
              is_bad = case.find("skipped") is not None or case.find("failure") is not None or case.find("error") is not None
              if "\\Concurrency\\" in (owner or "") and (owner or "").endswith("PgsqlTest"):
                  if is_bad:
                      concurrency_bad.append(name)
                  else:
                      concurrency_ok += 1
              if case.find("skipped") is not None:
                  skipped += 1
              elif case.find("failure") is not None or case.find("error") is not None:
                  failed.append(name)
          failed = sorted(set(failed))
          with open("artifacts/ci/pgsql-failing-tests.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(failed) + ("\n" if failed else ""))
          summary = f"PostgreSQL ${{ matrix.postgres }}: {total} tests, {skipped} skipped, {len(failed)} failing."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(f"### {summary}\n\n")
              handle.write("Blocking: any failing test fails this job.\n\n")
              for name in failed[:200]:
                  handle.write(f"- `{name}`\n")
          for name in concurrency_bad:
              print(f"::error::PostgreSQL concurrency test did not pass: {name}")
          if failed:
              print(f"::error::{len(failed)} tests failed on PostgreSQL.")
              sys.exit(1)
          if concurrency_bad or concurrency_ok == 0:
              print(f"::error::PostgreSQL concurrency tests: {concurrency_ok} passed, {len(concurrency_bad)} not passed.")
              sys.exit(1)
          print(f"PostgreSQL concurrency tests: {concurrency_ok} passed.")
          PY

      - name: Upload PostgreSQL test output
        if: ${{ !cancelled() && hashFiles('artifacts/ci/phpunit-pgsql-junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-pgsql-${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/phpunit-pgsql-junit.xml
            artifacts/ci/pgsql-failing-tests.txt
          if-no-files-found: error
          retention-days: 14

  platform_postgres_not_required:
    name: platform-postgres (${{ matrix.postgres }})
    # Reports the required "platform-postgres (17)" and "platform-postgres (16)" checks when
    # classify-changes proves the change needs no CI (ci == 'false', e.g. a docs-only PR).
    # A skipped matrix job reports only its unrendered name, so without this job those
    # required checks never report and the PR stays blocked. It runs only on an explicit
    # 'false': a failed classification or ci == 'true' leaves it skipped, and then
    # `platform_postgres` above is the only job that reports these names. Its matrix must
    # match `platform_postgres` exactly (tests/ci/test_workflow_trigger_economy.py).
    needs: classify_changes
    if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.ci == 'false' }}
    strategy:
      matrix:
        postgres: ['17', '16']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record that PostgreSQL validation is not required
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
          CI_REQUIRED: ${{ needs.classify_changes.outputs.ci }}
          CHANGE_CLASSES: ${{ needs.classify_changes.outputs.classes }}
        run: |
          set -euo pipefail
          test "$CI_REQUIRED" = false
          summary="PostgreSQL ${POSTGRES_MAJOR}: not required; classify-changes reported ci=false (classes: ${CHANGE_CLASSES:-none})."
          echo "$summary"
          echo "### $summary" >> "$GITHUB_STEP_SUMMARY"

  php_coverage:
    name: php-coverage-report
    needs: classify_changes
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'merge_group') &&
        needs.classify_changes.result == 'success' &&
        needs.classify_changes.outputs.ci == 'true' &&
        (
          contains(needs.classify_changes.outputs.classes, 'backend') ||
          contains(needs.classify_changes.outputs.classes, 'auth_security') ||
          contains(needs.classify_changes.outputs.classes, 'payment') ||
          contains(needs.classify_changes.outputs.classes, 'database') ||
          contains(needs.classify_changes.outputs.classes, 'dependency') ||
          contains(needs.classify_changes.outputs.classes, 'shared') ||
          contains(needs.classify_changes.outputs.paths_json, '.github/workflows/ci.yml')
        )
      }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: oteryn-coverage-root-password
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MARIADB_INTEGRATION_HOST: 127.0.0.1
      MARIADB_INTEGRATION_PORT: 3306
      MARIADB_INTEGRATION_ROOT_PASSWORD: oteryn-coverage-root-password
    steps:
      - name: Checkout exact coverage candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.sha }}

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: pdo_mysql, pcntl, gd
          tools: composer:v2

      - name: Install dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Measure PHP application coverage
        run: |
          mkdir -p artifacts/coverage
          php artisan config:clear --ansi
          vendor/bin/phpunit \
            --coverage-clover=artifacts/coverage/clover.xml \
            --log-junit=artifacts/coverage/phpunit-junit.xml

      - name: Evaluate coverage policy
        run: >-
          python tools/validation/php_coverage_policy.py
          --clover artifacts/coverage/clover.xml
          --policy docs/agents/CI_COVERAGE_POLICY.json
          --json-output artifacts/coverage/summary.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded coverage evidence
        if: always() && hashFiles('artifacts/coverage/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 14

  test:
    needs:
      - classify_changes
      - runtime_tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact required-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Evaluate required test gate
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify_changes.result }}
          CI_REQUIRED: ${{ needs.classify_changes.outputs.ci }}
          RUNTIME_TESTS_RESULT: ${{ needs.runtime_tests.result }}
          REUSE_HEAVY: ${{ needs.classify_changes.outputs.reuse_heavy }}
          REUSED_HEAD_SHA: ${{ needs.classify_changes.outputs.reused_head_sha }}
          REUSED_RUN_ID: ${{ needs.classify_changes.outputs.reused_run_id }}
        run: >-
          python scripts/ci/required_test_gate.py
          --classification-result "$CLASSIFICATION_RESULT"
          --ci-required "$CI_REQUIRED"
          --runtime-tests-result "$RUNTIME_TESTS_RESULT"
          --reuse-heavy "$REUSE_HEAVY"
          --reused-head-sha "$REUSED_HEAD_SHA"
          --reused-run-id "$REUSED_RUN_ID"
          --summary "$GITHUB_STEP_SUMMARY"

  platform_gate:
    name: platform-gate
    if: ${{ always() }}
    needs:
      - classify_changes
      - test
      - platform_postgres
      - php_coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require existing Platform aggregate gates
        shell: bash
        env:
          CLASSIFY_CHANGES_RESULT: ${{ needs.classify_changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_POSTGRES_RESULT: ${{ needs.platform_postgres.result }}
          PHP_COVERAGE_RESULT: ${{ needs.php_coverage.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_CHANGES_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PLATFORM_POSTGRES_RESULT" = success -o "$PLATFORM_POSTGRES_RESULT" = skipped
          test "$PHP_COVERAGE_RESULT" = success -o "$PHP_COVERAGE_RESULT" = skipped
