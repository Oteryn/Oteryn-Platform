name: Public Domain Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-domain-evidence.yml
      - docs/agents/tasks/active/OTERYN-20260801-public-domain-validation.md
      - docs/agents/reports/OTERYN-20260801-public-domain-validation.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-domain-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Collect sanitized DNS TLS and HTTP evidence
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import datetime as dt
          import hashlib
          import json
          import re
          import socket
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from email.message import Message
          from pathlib import Path
          from typing import Any

          VALIDATION_SHA = __import__('os').environ['VALIDATION_SHA']
          USER_AGENT = 'Oteryn-Public-Domain-Validator/1.0 (read-only; PR-387)'
          HOSTS = ['oteryn.molehill.cloud', 'login.oteryn.molehill.cloud']
          PROBES = [
              ('www_http_root', 'GET', 'http://oteryn.molehill.cloud/', None),
              ('www_https_root', 'GET', 'https://oteryn.molehill.cloud/', None),
              ('www_login', 'GET', 'https://oteryn.molehill.cloud/login?locale=en', None),
              ('www_register', 'GET', 'https://oteryn.molehill.cloud/register', None),
              ('www_forgot_password', 'GET', 'https://oteryn.molehill.cloud/forgot-password', None),
              ('www_health', 'GET', 'https://oteryn.molehill.cloud/health', None),
              ('www_news', 'GET', 'https://oteryn.molehill.cloud/news', None),
              ('www_highscores', 'GET', 'https://oteryn.molehill.cloud/highscores', None),
              ('www_gateway_cross_route', 'GET', 'https://oteryn.molehill.cloud/version', None),
              ('gateway_http_health', 'GET', 'http://login.oteryn.molehill.cloud/health', None),
              ('gateway_https_root', 'GET', 'https://login.oteryn.molehill.cloud/', None),
              ('gateway_health', 'GET', 'https://login.oteryn.molehill.cloud/health', None),
              ('gateway_ready', 'GET', 'https://login.oteryn.molehill.cloud/ready', None),
              ('gateway_version', 'GET', 'https://login.oteryn.molehill.cloud/version', None),
              ('gateway_platform_cross_route', 'GET', 'https://login.oteryn.molehill.cloud/login', None),
              ('gateway_invalid_login', 'POST', 'https://login.oteryn.molehill.cloud/v1/login', b'{"protocol_version":1,"game_login_ticket":""}'),
          ]

          class RecordingRedirectHandler(urllib.request.HTTPRedirectHandler):
              def __init__(self) -> None:
                  super().__init__()
                  self.chain: list[dict[str, Any]] = []

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.chain.append({
                      'status': code,
                      'from': req.full_url,
                      'to': urllib.parse.urljoin(req.full_url, newurl),
                  })
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          def run_text(command: list[str]) -> dict[str, Any]:
              try:
                  completed = subprocess.run(command, text=True, capture_output=True, timeout=20, check=False)
              except Exception as exc:
                  return {'error': f'{type(exc).__name__}: {exc}'}
              return {
                  'returncode': completed.returncode,
                  'stdout': completed.stdout.strip().splitlines(),
                  'stderr': completed.stderr.strip().splitlines(),
              }

          def dns_evidence(host: str) -> dict[str, Any]:
              result: dict[str, Any] = {}
              for record_type in ('A', 'AAAA', 'CNAME'):
                  result[record_type] = run_text(['dig', '+time=4', '+tries=1', '+short', host, record_type])
              try:
                  result['getaddrinfo'] = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              except Exception as exc:
                  result['getaddrinfo_error'] = f'{type(exc).__name__}: {exc}'
              return result

          def flatten_name(value: Any) -> list[str]:
              output: list[str] = []
              for rdn in value or ():
                  for key, item in rdn:
                      output.append(f'{key}={item}')
              return output

          def tls_evidence(host: str) -> dict[str, Any]:
              context = ssl.create_default_context()
              try:
                  with socket.create_connection((host, 443), timeout=12) as raw:
                      with context.wrap_socket(raw, server_hostname=host) as wrapped:
                          cert = wrapped.getpeercert()
                          der = wrapped.getpeercert(binary_form=True)
                          return {
                              'verified': True,
                              'tls_version': wrapped.version(),
                              'cipher': wrapped.cipher(),
                              'subject': flatten_name(cert.get('subject')),
                              'issuer': flatten_name(cert.get('issuer')),
                              'not_before': cert.get('notBefore'),
                              'not_after': cert.get('notAfter'),
                              'subject_alt_names': [value for kind, value in cert.get('subjectAltName', ()) if kind == 'DNS'],
                              'sha256_fingerprint': hashlib.sha256(der).hexdigest(),
                          }
              except Exception as exc:
                  return {'verified': False, 'error': f'{type(exc).__name__}: {exc}'}

          def selected_headers(headers: Message) -> dict[str, list[str]]:
              names = [
                  'content-type', 'location', 'cache-control', 'pragma', 'expires',
                  'strict-transport-security', 'content-security-policy',
                  'x-frame-options', 'x-content-type-options', 'referrer-policy',
                  'permissions-policy', 'cf-cache-status', 'cf-ray', 'server',
                  'x-request-id', 'vary', 'content-language',
              ]
              return {name: headers.get_all(name, []) for name in names if headers.get_all(name)}

          def cookie_metadata(headers: Message) -> list[dict[str, Any]]:
              output: list[dict[str, Any]] = []
              for raw in headers.get_all('set-cookie', []):
                  parts = [part.strip() for part in raw.split(';') if part.strip()]
                  if not parts or '=' not in parts[0]:
                      continue
                  name, value = parts[0].split('=', 1)
                  metadata: dict[str, Any] = {
                      'name': name,
                      'value_sha256': hashlib.sha256(value.encode()).hexdigest(),
                      'attributes': {},
                  }
                  for attribute in parts[1:]:
                      if '=' in attribute:
                          key, attr_value = attribute.split('=', 1)
                          key_lower = key.strip().lower()
                          if key_lower in {'domain', 'path', 'samesite', 'max-age'}:
                              metadata['attributes'][key_lower] = attr_value.strip()
                          elif key_lower == 'expires':
                              metadata['attributes']['expires_present'] = True
                      else:
                          metadata['attributes'][attribute.lower()] = True
                  output.append(metadata)
              return output

          def form_actions(text: str, base_url: str) -> list[str]:
              actions = re.findall(r'<form\b[^>]*\baction=["\']([^"\']+)["\']', text, flags=re.I)
              return [urllib.parse.urljoin(base_url, action) for action in actions[:20]]

          def absolute_urls(text: str) -> list[str]:
              found = re.findall(r'https?://[^\s"\'<>]+', text, flags=re.I)
              return sorted(set(found))[:50]

          def request_evidence(label: str, method: str, url: str, body: bytes | None) -> dict[str, Any]:
              redirect_handler = RecordingRedirectHandler()
              opener = urllib.request.build_opener(redirect_handler)
              headers = {
                  'User-Agent': USER_AGENT,
                  'Accept': 'text/html,application/json;q=0.9,*/*;q=0.1',
                  'Cache-Control': 'no-cache',
              }
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(url, data=body, headers=headers, method=method)
              response = None
              error: str | None = None
              try:
                  response = opener.open(request, timeout=20)
              except urllib.error.HTTPError as exc:
                  response = exc
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'

              result: dict[str, Any] = {
                  'label': label,
                  'method': method,
                  'requested_url': url,
                  'redirect_chain': redirect_handler.chain,
              }
              if error is not None or response is None:
                  result['error'] = error or 'response unavailable'
                  return result

              payload = response.read(1024 * 1024)
              text = payload.decode('utf-8', errors='replace')
              final_url = response.geturl()
              result.update({
                  'status': response.status,
                  'reason': response.reason,
                  'final_url': final_url,
                  'headers': selected_headers(response.headers),
                  'cookies': cookie_metadata(response.headers),
                  'body_length_captured': len(payload),
                  'body_sha256': hashlib.sha256(payload).hexdigest(),
                  'form_actions': form_actions(text, final_url),
                  'absolute_urls': absolute_urls(text),
                  'title': (re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I | re.S).group(1).strip()
                            if re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I | re.S) else None),
                  'json': None,
              })
              content_type = response.headers.get('content-type', '')
              if 'json' in content_type.lower():
                  try:
                      parsed = json.loads(text)
                      result['json'] = parsed
                  except Exception:
                      result['json_parse_error'] = True
              return result

          evidence = {
              'classification': 'PUBLIC_EDGE_OBSERVED',
              'production_environment_proven': False,
              'validation_sha': VALIDATION_SHA,
              'observed_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'runner': 'github-hosted-ubuntu-latest',
              'safety': {
                  'secrets_used': False,
                  'credentials_used': False,
                  'state_changing_requests': False,
                  'requests': 'bounded anonymous DNS/TLS/GET plus one syntactically invalid Gateway POST rejected before ticket processing',
              },
              'dns': {host: dns_evidence(host) for host in HOSTS},
              'tls': {host: tls_evidence(host) for host in HOSTS},
              'http': [request_evidence(*probe) for probe in PROBES],
          }

          output = Path('/tmp/public-domain-evidence.json')
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'observed_at_utc': evidence['observed_at_utc'],
              'dns': {host: evidence['dns'][host].get('getaddrinfo', evidence['dns'][host].get('getaddrinfo_error')) for host in HOSTS},
              'tls': {host: evidence['tls'][host].get('verified') for host in HOSTS},
              'http': {item['label']: item.get('status', item.get('error')) for item in evidence['http']},
          }, indent=2, sort_keys=True))
          PY

      - name: Summarize bounded observations
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          evidence = json.loads(Path('/tmp/public-domain-evidence.json').read_text())
          print('### Public domain evidence')
          print(f"- validation SHA: `{evidence['validation_sha']}`")
          print(f"- observed at: `{evidence['observed_at_utc']}`")
          for host, tls in evidence['tls'].items():
              print(f"- TLS `{host}`: `{'PASS' if tls.get('verified') else 'FAIL'}`")
          for item in evidence['http']:
              outcome = item.get('status', item.get('error', 'UNKNOWN'))
              print(f"- `{item['label']}`: `{outcome}`")
          print('- classification: `PUBLIC_EDGE_OBSERVED`; this does not establish the exact Platform/Canary image or full production readiness')
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-domain-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/public-domain-evidence.json
          retention-days: 14
          if-no-files-found: error
