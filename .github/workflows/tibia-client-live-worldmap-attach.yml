name: Tibia Outbound Protocol Metaobject

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Locate outbound protocol metaobject
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Find relocations into the large outbound string table
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/outbound-rela
          python3 - <<'PY'
import re
lines=open('/tmp/outbound-rela',errors='replace').read().splitlines()
rows=[]
for line in lines:
    parts=line.split()
    if len(parts)<4 or 'R_X86_64_RELATIVE' not in line:
        continue
    try:
        loc=int(parts[0],16); add=int(parts[-1],16)
    except ValueError:
        continue
    rows.append((loc,add,line))
hits=[r for r in rows if 0x1cd0800 <= r[1] <= 0x1cd2200]
print('RELOCS_TO_OUTBOUND_STRINGS_BEGIN')
for _,_,line in hits[:300]: print(line)
print('RELOCS_TO_OUTBOUND_STRINGS_END')
print('CANDIDATE_METAOBJECT_NEIGHBORS_BEGIN')
seen=set()
for loc,add,line in hits:
    if loc in seen: continue
    seen.add(loc)
    print(f'CANDIDATE_RELOC_LOCATION=0x{loc:x} ADDEND=0x{add:x}')
    for l,a,txt in rows:
        if loc-0x28 <= l <= loc+0x48:
            print(txt)
print('CANDIDATE_METAOBJECT_NEIGHBORS_END')
PY
          rm -f /tmp/outbound-rela
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
