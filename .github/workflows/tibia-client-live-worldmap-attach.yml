name: Tibia Player Protocol Method Map

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Map player protocol meta-methods to code
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Dump method names and metacall disassembly
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          echo SEND_NAMES_BEGIN
          strings -a -t x "$bin" | awk '$1>="1cd0bfa" && $1<="1cd2200" {print}' | head -n 500
          echo SEND_NAMES_END
          echo METACALL_DC23A0_BEGIN
          objdump -d --start-address=0xdc23a0 --stop-address=0xdc2c80 "$bin" 2>/dev/null || true
          echo METACALL_DC23A0_END
          echo METACALL_D13200_BEGIN
          objdump -d --start-address=0xd13200 --stop-address=0xd13b80 "$bin" 2>/dev/null || true
          echo METACALL_D13200_END
          echo MOVEMENT_FUNCS_BEGIN
          for a in ee2cd0 ee2d50 ee2dd0 ee2e50 ee30d0 ee3150 ee2ed0 ee2f50 ee2fd0 ee3050 ee31d0 ee3250 ee32d0 ee3350; do
            echo "FUNC_$a"
            objdump -d --start-address="0x$a" --stop-address="$((0x$a+0x80))" "$bin" 2>/dev/null || true
          done
          echo MOVEMENT_FUNCS_END
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
