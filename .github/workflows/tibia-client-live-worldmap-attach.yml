name: Tibia Live Worldmap Attach

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Passive decoded Worldmap and session activity logger
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Capture passive decoded map records from already logged-in client
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pid=$(pgrep -x client | tail -n1)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 && direct_count == 0 ))

          maps=/proc/$pid/maps
          base=$(awk '$NF ~ /\/packages\/Tibia\/bin\/client$/ && $3=="00000000" {split($1,a,"-"); print "0x" a[1]; exit}' "$maps")
          [[ -n "$base" ]]
          bp=$(python3 -c 'import sys; print(hex(int(sys.argv[1],16)+0x19a8ea3))' "$base")
          echo CLIENT_PID=$pid
          echo PIE_BASE=$base
          echo DECODED_BP=$bp

          cat >/tmp/live-map.gdb <<GDB
          set pagination off
          set confirm off
          set print thread-events off
          set logging file /data/runtime/worldmap-live-attach-gdb.log
          set logging overwrite on
          set logging enabled on
          break *$bp
          commands
          silent
          set \$x = *(unsigned int*)(\$rsp+0x88)
          set \$y = *(unsigned int*)(\$rsp+0x8c)
          set \$z = *(unsigned int*)(\$rsp+0x90)
          set \$ord = ((unsigned int)\$rbp)
          set \$r28 = *(unsigned int*)(\$rbx+0x28)
          set \$r30 = *(unsigned int*)(\$rbx+0x30)
          printf "REC x=%u y=%u z=%u order=%u raw28=%u raw30=%u\\n", \$x, \$y, \$z, \$ord, \$r28, \$r30
          continue
          end
          continue
          GDB

          rm -f /data/runtime/worldmap-live-attach-gdb.log /data/runtime/passive-session-activity.log
          gdb -q -nx -p "$pid" -x /tmp/live-map.gdb >/data/runtime/worldmap-live-attach-outer.log 2>&1 &
          gdbpid=$!
          cleanup() {
            if kill -0 "$gdbpid" 2>/dev/null; then
              kill -INT "$gdbpid" 2>/dev/null || true
              sleep 1
              kill -TERM "$gdbpid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          sleep 3
          kill -0 "$gdbpid"
          echo PASSIVE_OBSERVATION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          for n in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then echo CLIENT_DIED_DURING_OBSERVATION=true; exit 1; fi
            rx=$(awk '/Tcp:/ {print $2}' /proc/$pid/net/snmp 2>/dev/null | tail -n1 || true)
            tcp=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
            local_now=$(printf '%s\n' "$tcp" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
            printf '%s second=%d local_socks=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$n" "$local_now" >>/data/runtime/passive-session-activity.log
            sleep 1
          done

          echo PASSIVE_OBSERVATION_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          kill -INT "$gdbpid" 2>/dev/null || true
          sleep 2
          cleanup
          trap - EXIT

          kill -0 "$pid"
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_after=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_after=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_after=$((total_after-local_after))
          echo ACTIVE_LOCAL_SOCKS_COUNT_AFTER_ATTACH=$local_after
          echo ACTIVE_DIRECT_TCP_COUNT_AFTER_ATTACH=$direct_after
          (( local_after > 0 && direct_after == 0 ))

          records=$(grep -c '^REC ' /data/runtime/worldmap-live-attach-gdb.log 2>/dev/null || true)
          echo DECODED_CAPTURE_RECORD_COUNT=$records
          echo CAPTURE_BEGIN
          grep '^REC ' /data/runtime/worldmap-live-attach-gdb.log | head -n 200 || true
          echo CAPTURE_END
          echo SESSION_ACTIVITY_BEGIN
          cat /data/runtime/passive-session-activity.log
          echo SESSION_ACTIVITY_END
          echo PASSIVE_NEARBY_ACTION_LOGGING_COMPLETED=true
          echo LIVE_SESSION_RETAINED=true
          INNER
