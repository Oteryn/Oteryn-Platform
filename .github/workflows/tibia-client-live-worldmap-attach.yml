name: Tibia Outbound Protocol Metaobject

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Locate outbound protocol metaobject
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Find relocations into outbound protocol metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          echo RELOCS_BEGIN
          readelf -rW "$bin" | grep -Ei 'R_X86_64_RELATIVE.*(1cd0[89a-f][0-9a-f]{2}|1cd1[0-9a-f]{3}|1cd20[0-9a-f]{2}|1cd21[0-9a-f]{2})' | head -n 400 || true
          echo RELOCS_END
          echo CLASS_STRINGS_BEGIN
          strings -a -t x "$bin" | grep -E 'T(PlayerProtocolMessageHandler|ProtocolClientMessageProcessor|ProtobufClientMessageTranslator|ProtocolWriter)|prepareAndEnqueueGameclientMessage|clientMessageReadyToProcess' | head -n 100 || true
          echo CLASS_STRINGS_END
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
