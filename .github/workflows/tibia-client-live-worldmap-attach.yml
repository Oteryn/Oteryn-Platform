name: Tibia Outbound RTTI Vtables

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Resolve outbound handler RTTI and vtables
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Find relocations to outbound class names and nearby vtable entries
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/rtti-rela
          echo PLAYER_HANDLER_RELOCS_BEGIN
          grep -Ei 'R_X86_64_RELATIVE.*(1cad8c0|1cddb40)' /tmp/rtti-rela | head -n 80 || true
          echo PLAYER_HANDLER_RELOCS_END
          echo PROCESSOR_RELOCS_BEGIN
          grep -Ei 'R_X86_64_RELATIVE.*(1cac3e0|1cac3a0|1cac340)' /tmp/rtti-rela | head -n 120 || true
          echo PROCESSOR_RELOCS_END
          echo RTTI_NAMES_BEGIN
          strings -a -t x "$bin" | grep -E 'N5tibia(4game29TPlayerProtocolMessageHandler|8protocol31TProtocolClientMessageProcessor|8protocol32TProtobufClientMessageTranslator|8protocol15TProtocolWriter)E' || true
          echo RTTI_NAMES_END
          rm -f /tmp/rtti-rela
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
