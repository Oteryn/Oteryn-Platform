name: Tibia Outbound Protocol Metaobject

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Locate outbound protocol metaobject
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Find relocations into the large outbound string table
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/outbound-rela
          echo RELOCS_TO_OUTBOUND_STRINGS_BEGIN
          awk '
            $1 ~ /^[0-9a-fA-F]+$/ && $0 ~ /R_X86_64_RELATIVE/ {
              add=$NF; if (add ~ /^[0-9a-fA-F]+$/) {
                x=strtonum("0x" add);
                if (x>=strtonum("0x1cd0800") && x<=strtonum("0x1cd2200")) print $0;
              }
            }
          ' /tmp/outbound-rela | head -n 300
          echo RELOCS_TO_OUTBOUND_STRINGS_END
          echo CANDIDATE_METAOBJECT_NEIGHBORS_BEGIN
          awk '
            $1 ~ /^[0-9a-fA-F]+$/ && $0 ~ /R_X86_64_RELATIVE/ {
              add=$NF; if (add ~ /^[0-9a-fA-F]+$/) {
                x=strtonum("0x" add);
                if (x>=strtonum("0x1cd0800") && x<=strtonum("0x1cd2200")) print $1;
              }
            }
          ' /tmp/outbound-rela | while read loc; do
            dec=$((16#$loc)); lo=$((dec-24)); hi=$((dec+56));
            printf 'CANDIDATE_RELOC_LOCATION=0x%s\n' "$loc"
            awk -v lo="$lo" -v hi="$hi" '$1 ~ /^[0-9a-fA-F]+$/ {x=strtonum("0x"$1); if (x>=lo && x<=hi) print}' /tmp/outbound-rela
          done | head -n 800
          echo CANDIDATE_METAOBJECT_NEIGHBORS_END
          rm -f /tmp/outbound-rela
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
