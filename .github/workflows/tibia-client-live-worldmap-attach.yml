name: Tibia Player Protocol Resolve

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Resolve player protocol static metacall
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Resolve exact QMetaObject relocations
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/player-rela
          echo PLAYER_PROTOCOL_RELOCS_BEGIN
          grep -Ei '[ +]0*1cb4f40([[:space:]]|$)|[ +]0*1cb5620([[:space:]]|$)' /tmp/player-rela || true
          echo PLAYER_PROTOCOL_RELOCS_END
          # Also show relocation rows around likely staticMetaObject locations that reference either stringdata or metadata.
          locs=$(grep -Ei '[ +]0*1cb4f40([[:space:]]|$)|[ +]0*1cb5620([[:space:]]|$)' /tmp/player-rela | awk '{print $1}' | sort -u)
          for loc in $locs; do
            dec=$((16#$loc)); start=$((dec-32)); stop=$((dec+64));
            echo "AROUND_RELOC_LOCATION=0x$loc"
            awk -v a=$(printf '%x' "$start") -v b=$(printf '%x' "$stop") 'BEGIN{IGNORECASE=1} $1 ~ /^[0-9a-f]+$/ {x=strtonum("0x"$1); if(x>=strtonum("0x"a)&&x<=strtonum("0x"b)) print}' /tmp/player-rela 2>/dev/null || true
          done
          rm -f /tmp/player-rela
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
