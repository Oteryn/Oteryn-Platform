name: Tibia Player Protocol Vtable Entries

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Dump player protocol handler vtable entries
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Dump vtable relocations and bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/player-vtable-entries
          echo PLAYER_VTABLE_RELOCS_BEGIN
          grep -Ei '^000000000308a[0-3][0-9a-f]{2}' /tmp/player-vtable-entries | head -n 260 || true
          echo PLAYER_VTABLE_RELOCS_END
          echo PLAYER_VTABLE_BYTES_BEGIN
          objdump -s --start-address=0x3089ff0 --stop-address=0x308a400 "$bin" 2>/dev/null || true
          echo PLAYER_VTABLE_BYTES_END
          echo METAOBJECT_REF_NEIGHBOR_BEGIN
          grep -Ei '^0000000003081[12][0-9a-f]{2}' /tmp/player-vtable-entries | head -n 260 || true
          echo METAOBJECT_REF_NEIGHBOR_END
          rm -f /tmp/player-vtable-entries
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
