name: Tibia Outbound RTTI Neighborhoods

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Inspect outbound RTTI relocation neighborhoods
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Dump relocation neighborhoods and section bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/rtti-rela
          python3 - <<'PY'
import re
rows=[]
for line in open('/tmp/rtti-rela', errors='replace'):
    p=line.split()
    if len(p) < 4 or not re.fullmatch(r'[0-9a-fA-F]+', p[0]):
        continue
    try: loc=int(p[0],16)
    except ValueError: continue
    rows.append((loc,line.rstrip()))
for name,center in [
    ('PLAYER_TYPEINFO_NAME_REF',0x3089ab8),
    ('PLAYER_META_NAME_REF',0x313ce78),
    ('PROCESSOR_TYPEINFO_NAME_REF',0x3080760),
    ('TRANSLATOR_TYPEINFO_NAME_REF',0x3080750),
    ('WRITER_TYPEINFO_NAME_REF',0x3080730),
]:
    print(f'{name}_BEGIN center=0x{center:x}')
    for loc,line in rows:
        if center-0x180 <= loc <= center+0x280:
            print(line)
    print(f'{name}_END')
PY
          echo SECTION_MAP_BEGIN
          readelf -SW "$bin" | grep -E '\.(data\.rel\.ro|rodata|data|bss|text)' || true
          echo SECTION_MAP_END
          for range in '3089900:3089d80' '313cd00:313d100' '3080580:3080a00'; do
            a=${range%:*}; b=${range#*:}
            echo "BYTES_${a}_${b}_BEGIN"
            objdump -s --start-address="0x$a" --stop-address="0x$b" "$bin" 2>/dev/null || true
            echo "BYTES_${a}_${b}_END"
          done
          rm -f /tmp/rtti-rela
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
