name: Tibia Player Protocol Vtable

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Locate player protocol handler vtable
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Resolve typeinfo backreferences and candidate vtables
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/player-vtable-rela
          echo PLAYER_TYPEINFO_BACKREFS_BEGIN
          grep -Ei 'R_X86_64_RELATIVE[[:space:]]+3089ab0([[:space:]]|$)|R_X86_64_64.*3089ab0' /tmp/player-vtable-rela | head -n 120 || true
          echo PLAYER_TYPEINFO_BACKREFS_END
          echo PLAYER_META_BACKREFS_BEGIN
          grep -Ei 'R_X86_64_RELATIVE[[:space:]]+313ce60([[:space:]]|$)|R_X86_64_64.*313ce60' /tmp/player-vtable-rela | head -n 120 || true
          echo PLAYER_META_BACKREFS_END
          echo PLAYER_META_FUNCTIONS_BEGIN
          grep -Ei '^000000000313ce(1[0-9a-f]|9[0-9a-f])' /tmp/player-vtable-rela | head -n 120 || true
          echo PLAYER_META_FUNCTIONS_END
          rm -f /tmp/player-vtable-rela
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
