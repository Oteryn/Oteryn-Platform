name: Tibia Send Method Xrefs

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Trace sendGo and sendRotate xrefs
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Locate send-method strings and code references
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          echo SEND_STRINGS_BEGIN
          strings -a -t x "$bin" | grep -E ' send(Go(North|East|South|West|NorthEast|SouthEast|SouthWest|NorthWest|Path)|Rotate(North|East|South|West)|Stop|Cancel|Attack|Follow|UseObject|UseTwoObjects|UseOnCreature|MoveObject|TalkMessage)$' || true
          echo SEND_STRINGS_END
          tmp=/tmp/send-xrefs.$$
          objdump -d -M intel "$bin" >"$tmp"
          for addr in $(strings -a -t x "$bin" | grep -E ' send(Go(North|East|South|West|NorthEast|SouthEast|SouthWest|NorthWest|Path)|Rotate(North|East|South|West)|Stop|Cancel|Attack|Follow|UseObject|UseTwoObjects|UseOnCreature|MoveObject|TalkMessage)$' | awk '{print $1}'); do
            echo "XREF_STRING_VA=0x$addr"
            grep -n -E "# +0*${addr}([ <]|$)" "$tmp" | head -n 40 || true
          done
          rm -f "$tmp"
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
