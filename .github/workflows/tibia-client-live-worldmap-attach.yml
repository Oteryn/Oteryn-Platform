name: Tibia Outbound RTTI Neighborhoods

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-worldmap-attach.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  attach:
    name: Inspect outbound RTTI relocation neighborhoods
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Dump relocation neighborhoods and section bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          readelf -rW "$bin" >/tmp/rtti-rela
          echo PLAYER_TYPEINFO_NEIGHBOR_BEGIN
          grep -Ei '^0000000003089[89a-f][0-9a-f]{2}' /tmp/rtti-rela | head -n 240 || true
          echo PLAYER_TYPEINFO_NEIGHBOR_END
          echo PLAYER_META_NEIGHBOR_BEGIN
          grep -Ei '^000000000313c[e-f][0-9a-f]{2}|^000000000313d0[0-9a-f]{2}' /tmp/rtti-rela | head -n 240 || true
          echo PLAYER_META_NEIGHBOR_END
          echo PROTOCOL_TYPES_NEIGHBOR_BEGIN
          grep -Ei '^0000000003080[5-9][0-9a-f]{2}' /tmp/rtti-rela | head -n 300 || true
          echo PROTOCOL_TYPES_NEIGHBOR_END
          echo SECTION_MAP_BEGIN
          readelf -SW "$bin" | grep -E '\.(data\.rel\.ro|rodata|data|bss|text)' || true
          echo SECTION_MAP_END
          echo PLAYER_TYPEINFO_BYTES_BEGIN
          objdump -s --start-address=0x3089900 --stop-address=0x3089d80 "$bin" 2>/dev/null || true
          echo PLAYER_TYPEINFO_BYTES_END
          echo PLAYER_META_BYTES_BEGIN
          objdump -s --start-address=0x313cd00 --stop-address=0x313d100 "$bin" 2>/dev/null || true
          echo PLAYER_META_BYTES_END
          echo PROTOCOL_TYPES_BYTES_BEGIN
          objdump -s --start-address=0x3080580 --stop-address=0x3080a00 "$bin" 2>/dev/null || true
          echo PROTOCOL_TYPES_BYTES_END
          rm -f /tmp/rtti-rela
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
