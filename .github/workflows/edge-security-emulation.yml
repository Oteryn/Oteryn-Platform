name: Edge Security Emulation

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/agents/PLATFORM_AGENT_BOOTSTRAP.md'
      - 'docs/agents/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: edge-security-emulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.classify.outputs.ci }}
      phase7: ${{ steps.classify.outputs.phase7 }}
      edge: ${{ steps.classify.outputs.edge }}
      db_outage: ${{ steps.classify.outputs.db_outage }}
      game_auth_concurrency: ${{ steps.classify.outputs.game_auth_concurrency }}
      classes: ${{ steps.classify.outputs.classes }}
      reuse_heavy: ${{ steps.reuse.outputs.reuse_heavy }}
      reused_head_sha: ${{ steps.reuse.outputs.reused_head_sha }}
      reused_run_id: ${{ steps.reuse.outputs.reused_run_id }}
      material_tree_digest: ${{ steps.reuse.outputs.material_tree_digest }}
    steps:
      - name: Checkout exact classification range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate change classifier
        run: python tests/ci/test_classify_changes.py

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/ci/classify_changes.py               --base "$BASE_SHA"               --head "$HEAD_SHA"               --github-output "$GITHUB_OUTPUT"               --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/ci/classify_changes.py               --all               --github-output "$GITHUB_OUTPUT"               --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve reusable prior heavy evidence
        id: reuse
        if: ${{ github.event_name == 'pull_request' && steps.classify.outputs.edge == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python scripts/ci/heavy_evidence_reuse.py
          --repository "$GITHUB_REPOSITORY"
          --pr-number "$PR_NUMBER"
          --workflow "edge-security-emulation.yml"
          --job-name "validate"
          --head "$HEAD_SHA"
          --token-env GH_TOKEN
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  validate:
    # This lane ran the Laravel application, which was removed from the repository
    # (owner decision 2026-11-11). The job keeps its check name.
    needs: classify_changes
    if: ${{ always() && (needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.edge == 'true' && needs.classify_changes.outputs.reuse_heavy != 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful change classification
        if: ${{ needs.classify_changes.result != 'success' }}
        run: |
          echo "Change classification failed; this required gate is failing closed."
          exit 1

      - name: Record retired Laravel validation
        run: |
          summary="validate: Laravel validation retired; the Laravel app was removed (owner decision 2026-11-11)."
          echo "$summary"
          echo "### $summary" >> "$GITHUB_STEP_SUMMARY"
