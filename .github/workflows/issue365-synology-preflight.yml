name: Issue 365 Exact Frozen Synology Validation

on:
  push:
    branches:
      - validation/issue365-synology-20260801
    paths:
      - .github/workflows/issue365-synology-preflight.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue365-synology-preflight.yml

permissions:
  contents: read

concurrency:
  group: issue365-exact-frozen-synology
  cancel-in-progress: true

env:
  TARGET_SHA: b6f7b12a43aa72a52dc98c3fa07a7c4607fcb608
  RUNBOOK_REF: fb8a54d849a2f74f92ff429aea3bac06eb6a543c
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble

jobs:
  validate:
    runs-on: oteryn-staging
    timeout-minutes: 120
    steps:
      - name: Checkout exact frozen target
        uses: actions/checkout@v7
        with:
          ref: b6f7b12a43aa72a52dc98c3fa07a7c4607fcb608
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Execute isolated exact-frozen 12-sample matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          prefix="issue365-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="${prefix}-net"
          mariadb_container="${prefix}-mariadb"
          redis_container="${prefix}-redis"
          mailhog_container="${prefix}-mailhog"
          app_container="${prefix}-app"
          work_volume="${prefix}-work"
          evidence_volume="${prefix}-evidence"
          base_image="oteryn-issue365-platform:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          validator_image="oteryn-issue365-validator:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_file="/tmp/${prefix}.env"
          runbook_local="/tmp/${prefix}-runbook.md"

          export_partial() {
            if docker volume inspect "$evidence_volume" >/dev/null 2>&1; then
              docker run --rm -v "$evidence_volume:/evidence:ro" alpine:3.22 \
                sh -ec 'test -d /evidence/issue365-run && tar -C /evidence -czf - issue365-run' \
                > "issue365-synology-partial-${GITHUB_RUN_ID}.tar.gz" || true
            fi
          }
          trap 'status=$?; if [[ $status -ne 0 ]]; then export_partial; fi' EXIT

          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1)"
          docker version
          docker compose version

          python3 - <<'PY' > "$runbook_local"
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['RUNBOOK_REF']
          path = 'docs/agents/evidence/OTERYN-20260731-portal-backend-frontend-audit/ISSUE_365_EXACT_FROZEN_EXECUTION_RUNBOOK.md'
          url = f"https://api.github.com/repos/{repository}/contents/{urllib.parse.quote(path)}?ref={ref}"
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          print(base64.b64decode(payload['content']).decode('utf-8'), end='')
          PY
          test -s "$runbook_local"

          docker volume create "$work_volume" >/dev/null
          docker volume create "$evidence_volume" >/dev/null
          docker network create "$network" >/dev/null

          tar -C "$GITHUB_WORKSPACE" -cf - . \
            | docker run --rm -i -v "$work_volume:/workspace" alpine:3.22 \
                sh -ec 'cd /workspace && tar -xf -'

          docker run --rm -i -v "$evidence_volume:/evidence" alpine:3.22 \
            sh -ec 'mkdir -p /evidence/issue365-run && cat > /evidence/issue365-run/RUNBOOK.md' \
            < "$runbook_local"

          tar --exclude=.git -C "$GITHUB_WORKSPACE" -cf - . \
            | docker build \
                -t "$base_image" \
                -f deploy/synology/docker/platform.Dockerfile \
                -

          cat <<EOF | docker build -t "$validator_image" -
          FROM ${base_image}
          USER root
          RUN apk add --no-cache bash curl git mariadb-client redis python3 nodejs npm socat coreutils tar docker-cli
          WORKDIR /workspace
          EOF

          app_key="base64:$(python3 - <<'PY'
          import base64
          import os
          print(base64.b64encode(os.urandom(32)).decode('ascii'))
          PY
          )"

          cat > "$env_file" <<EOF
          ACCEPTANCE_SHA=${TARGET_SHA}
          VALIDATION_SHA=${TARGET_SHA}
          ACCEPTANCE_ZERO_RETRIES=1
          ACCEPTANCE_PROFILE=critical
          ACCEPTANCE_BASE_URL=http://127.0.0.1:8080
          ACCEPTANCE_MAILHOG_URL=http://127.0.0.1:8025
          APP_NAME=Oteryn Acceptance
          APP_ENV=acceptance
          APP_KEY=${app_key}
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8080
          LOG_CHANNEL=stderr_json
          LOG_LEVEL=info
          SESSION_DRIVER=file
          SESSION_SECURE_COOKIE=false
          SESSION_HTTP_ONLY=true
          SESSION_SAME_SITE=lax
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=smtp
          MAIL_HOST=127.0.0.1
          MAIL_PORT=1025
          MAIL_ENCRYPTION=
          MAIL_FROM_ADDRESS=acceptance@staging.oteryn
          MAIL_FROM_NAME=Oteryn Acceptance
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=oteryn_platform_acceptance_issue365
          DB_USERNAME=root
          DB_PASSWORD=acceptance-ci-root-not-a-secret
          CANARY_DB_HOST=127.0.0.1
          CANARY_DB_PORT=3306
          CANARY_DB_DATABASE=canary_acceptance_issue365
          CANARY_DB_USERNAME=oteryn_acceptance_readonly
          CANARY_DB_PASSWORD=acceptance-ci-readonly-not-a-secret
          CANARY_PROVISIONING_DB_HOST=127.0.0.1
          CANARY_PROVISIONING_DB_PORT=3306
          CANARY_PROVISIONING_DB_DATABASE=canary_acceptance_issue365
          CANARY_PROVISIONING_DB_USERNAME=oteryn_acceptance_provisioning
          CANARY_PROVISIONING_DB_PASSWORD=acceptance-ci-provisioning-not-a-secret
          CANARY_CHARACTER_CREATE_DB_HOST=127.0.0.1
          CANARY_CHARACTER_CREATE_DB_PORT=3306
          CANARY_CHARACTER_CREATE_DB_DATABASE=canary_acceptance_issue365
          CANARY_CHARACTER_CREATE_DB_USERNAME=oteryn_acceptance_character_create
          CANARY_CHARACTER_CREATE_DB_PASSWORD=acceptance-ci-character-not-a-secret
          CANARY_RUNTIME_REDIS_CLIENT=phpredis
          CANARY_RUNTIME_REDIS_SCHEME=tcp
          CANARY_RUNTIME_REDIS_HOST=127.0.0.1
          CANARY_RUNTIME_REDIS_PORT=6379
          CANARY_RUNTIME_REDIS_DB=0
          CANARY_RUNTIME_REDIS_USERNAME=oteryn_acceptance_runtime
          CANARY_RUNTIME_REDIS_PASSWORD=acceptance-ci-runtime-not-a-secret
          MARIADB_ROOT_PASSWORD=acceptance-ci-root-not-a-secret
          RUN_ROOT=/evidence/issue365-run
          ISSUE365_SERVER_TRACE=/evidence/issue365-run/server-trace.jsonl
          COMPOSER_ALLOW_SUPERUSER=1
          CI=1
          EOF

          docker run --rm -i -v "$work_volume:/workspace" alpine:3.22 \
            sh -ec 'cat > /workspace/.issue365.env && chmod 600 /workspace/.issue365.env' \
            < "$env_file"

          docker run -d \
            --name "$mariadb_container" \
            --network "$network" \
            --network-alias mariadb \
            -e MARIADB_ROOT_PASSWORD=acceptance-ci-root-not-a-secret \
            -e MARIADB_ROOT_HOST=% \
            mariadb:11.8 >/dev/null

          docker run -d \
            --name "$redis_container" \
            --network "$network" \
            --network-alias redis \
            redis:7.4-alpine >/dev/null

          docker run -d \
            --name "$mailhog_container" \
            --network "$network" \
            --network-alias mailhog \
            mailhog/mailhog:v1.0.1 >/dev/null

          docker run -d \
            --name "$app_container" \
            --network "$network" \
            --env-file "$env_file" \
            -e APP_CONTAINER_NAME="$app_container" \
            -e WORK_VOLUME="$work_volume" \
            -e EVIDENCE_VOLUME="$evidence_volume" \
            -e PLAYWRIGHT_IMAGE="$PLAYWRIGHT_IMAGE" \
            -v "$work_volume:/workspace" \
            -v "$evidence_volume:/evidence" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            --user 0 \
            "$validator_image" \
            bash -lc '
              set -euo pipefail
              socat TCP-LISTEN:3306,bind=127.0.0.1,reuseaddr,fork TCP:mariadb:3306 &
              socat TCP-LISTEN:6379,bind=127.0.0.1,reuseaddr,fork TCP:redis:6379 &
              socat TCP-LISTEN:1025,bind=127.0.0.1,reuseaddr,fork TCP:mailhog:1025 &
              socat TCP-LISTEN:8025,bind=127.0.0.1,reuseaddr,fork TCP:mailhog:8025 &
              exec sleep infinity
            ' >/dev/null

          docker exec "$app_container" git config --global --add safe.directory /workspace
          docker exec "$app_container" composer install --no-interaction --prefer-dist --no-progress

          docker exec "$app_container" docker run --rm \
            --network "container:${app_container}" \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$work_volume:/workspace" \
            -w /workspace/scripts/acceptance \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc 'npm install --no-audit --no-fund'

          docker exec "$app_container" bash scripts/acceptance/bootstrap-production-like.sh

          docker exec "$app_container" bash -lc '
            set -euo pipefail
            git show --no-patch --format=fuller HEAD > "$RUN_ROOT/target-commit.txt"
            git status --porcelain=v1 > "$RUN_ROOT/git-status-before.txt"
            git hash-object \
              scripts/acceptance/tests/admin-wiki-administration.spec.mjs \
              scripts/acceptance/playwright.config.mjs \
              scripts/acceptance/seed-browser-editorial-media.php \
              routes/modules/wiki.php \
              composer.lock > "$RUN_ROOT/source-blob-hashes.txt"
            php -r '\''
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
            echo json_encode([
                "framework" => Composer\\InstalledVersions::getPrettyVersion("laravel/framework"),
                "framework_reference" => Composer\\InstalledVersions::getReference("laravel/framework"),
                "session_driver" => config("session.driver"),
                "session_connection" => config("session.connection"),
                "session_store" => config("session.store"),
                "cache_default" => config("cache.default"),
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            '\'' > "$RUN_ROOT/runtime-config.json"
            php artisan route:list --name=admin.wiki --json > "$RUN_ROOT/admin-wiki-routes.json"
          '

          docker exec "$app_container" python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/evidence/issue365-run/RUNBOOK.md').read_text(encoding='utf-8')
          blocks = re.findall(r'```bash\n(.*?)\n```', text, flags=re.S)
          selectors = {
              '01-observer-create.sh': 'mkdir -p app/Support',
              '02-observer-patch.sh': 'export START_SESSION=',
              '03-browser-helper.sh': 'issue365-trace-helper.mjs',
              '04-probe-test.sh': 'admin-wiki-issue365-probe.spec.mjs',
              '05-media-snapshot.sh': 'media-snapshot.php',
          }
          target = Path('/evidence/issue365-run/runtime')
          target.mkdir(parents=True, exist_ok=True)
          for name, marker in selectors.items():
              matches = [block for block in blocks if marker in block]
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one runbook block for {marker!r}, found {len(matches)}')
              (target / name).write_text('set -euo pipefail\n' + matches[0] + '\n', encoding='utf-8')
          PY

          for script in \
            01-observer-create.sh \
            02-observer-patch.sh \
            03-browser-helper.sh \
            04-probe-test.sh \
            05-media-snapshot.sh; do
            docker exec "$app_container" bash "/evidence/issue365-run/runtime/$script"
          done

          docker exec -i "$app_container" bash -s <<'MATRIX'
          set -euo pipefail
          cd /workspace

          : > "$ISSUE365_SERVER_TRACE"
          chmod 600 "$ISSUE365_SERVER_TRACE"
          mkdir -p "$RUN_ROOT/samples"

          nohup php artisan serve --host=0.0.0.0 --port=8080 \
            > "$RUN_ROOT/acceptance-server.log" 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$RUN_ROOT/acceptance-server.pid"

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo 'Instrumented acceptance runtime did not become healthy.' >&2
              exit 1
            fi
            sleep 1
          done

          for fixture in clean one-corrupt; do
            for action in immediate prescroll; do
              for iteration in 1 2 3; do
                sample="${fixture}-${action}-${iteration}"
                sample_dir="$RUN_ROOT/samples/$sample"
                mkdir -p "$sample_dir"

                php scripts/acceptance/seed-browser-editorial-media.php reset
                php artisan cache:clear >/dev/null
                php "$RUN_ROOT/media-snapshot.php" > "$sample_dir/media-before.json"

                if [[ "$fixture" == clean ]]; then
                  python3 - "$sample_dir/media-before.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('count') != 0:
              raise SystemExit(f"clean fixture contains {data.get('count')} media rows")
          PY
                else
                  email="issue365-media-${sample}@example.test"
                  php scripts/acceptance/seed-browser-editorial-media.php \
                    seed-identity "$email" 'Issue365-Media-9!Pass' '' unconfirmed '' \
                    > "$sample_dir/media-identity.json"
                  php scripts/acceptance/seed-browser-editorial-media.php \
                    seed-referenced "$email" "Issue 365 ${sample}" \
                    > "$sample_dir/media-seeded.json"
                  media_id="$(python3 - "$sample_dir/media-seeded.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8'))['media_id'])
          PY
                  )"
                  php scripts/acceptance/seed-browser-editorial-media.php corrupt-files "$media_id" \
                    > "$sample_dir/media-corrupted.json"
                  php "$RUN_ROOT/media-snapshot.php" > "$sample_dir/media-before.json"
                  python3 - "$sample_dir/media-before.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          rows = data.get('rows', [])
          valid = data.get('count') == 1 and len(rows) == 1 \
              and rows[0].get('storage_exists') is True \
              and rows[0].get('thumbnail_exists') is True
          if not valid:
              raise SystemExit(f'invalid one-corrupt fixture snapshot: {data}')
          PY
                fi

                set +e
                docker run --rm \
                  --network "container:${APP_CONTAINER_NAME}" \
                  --env-file /workspace/.issue365.env \
                  -e ACCEPTANCE_RUN_ID="$sample" \
                  -e ACCEPTANCE_OUTPUT_DIR="$sample_dir/test-results" \
                  -e ISSUE365_SAMPLE_ID="$sample" \
                  -e ISSUE365_ACTION_MODE="$action" \
                  -e ISSUE365_FIXTURE_MODE="$fixture" \
                  -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
                  -v "$WORK_VOLUME:/workspace" \
                  -v "$EVIDENCE_VOLUME:/evidence" \
                  -w /workspace/scripts/acceptance \
                  "$PLAYWRIGHT_IMAGE" \
                  bash -lc 'npx playwright test tests/admin-wiki-issue365-probe.spec.mjs --project=responsive-mobile --workers=1 --retries=0 --reporter=line' \
                  > >(tee "$sample_dir/playwright.stdout.log") \
                  2> >(tee "$sample_dir/playwright.stderr.log" >&2)
                test_exit=${PIPESTATUS[0]}
                set -e
                printf '%s\n' "$test_exit" > "$sample_dir/playwright.exit-code"

                php "$RUN_ROOT/media-snapshot.php" > "$sample_dir/media-after.json"

                python3 - "$sample" "$ISSUE365_SERVER_TRACE" "$sample_dir/server-trace.jsonl" <<'PY'
          import json, sys
          sample, source, target = sys.argv[1:]
          with open(target, 'w', encoding='utf-8') as out:
              for raw in open(source, encoding='utf-8'):
                  try:
                      item = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if item.get('sample') == sample:
                      out.write(json.dumps(item, separators=(',', ':')) + '\n')
          PY

                python3 - "$sample_dir" "$sample" <<'PY'
          from pathlib import Path
          import json, re, sys

          sample_dir = Path(sys.argv[1])
          sample = sys.argv[2]
          browser = None
          for path in sample_dir.rglob('*'):
              if not path.is_file() or path.stat().st_size > 20_000_000:
                  continue
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if isinstance(data, dict) and data.get('sample') == sample and isinstance(data.get('events'), list):
                  browser = data
                  break
          if browser is not None:
              (sample_dir / 'issue365-browser-trace.json').write_text(
                  json.dumps(browser, indent=2), encoding='utf-8'
              )

          server = []
          trace_path = sample_dir / 'server-trace.jsonl'
          if trace_path.exists():
              for raw in trace_path.read_text(encoding='utf-8').splitlines():
                  try:
                      server.append(json.loads(raw))
                  except json.JSONDecodeError:
                      pass
          server.sort(key=lambda item: int(item.get('monotonic_ns', '0')))

          observation = (browser or {}).get('observation') or {}
          texts = observation.get('role_status_texts') or []
          flash_present = any('Wiki article published.' in str(value) for value in texts)
          durable = bool(observation.get('durable_published_visible')) and bool(observation.get('unpublish_visible'))
          events = (browser or {}).get('events') or []
          old_media_starts = [
              event for event in events
              if event.get('event') == 'browser_request_start'
              and event.get('phase') == 'publish-click'
              and (event.get('path') == '/admin/wiki/media' or re.match(r'^/admin/wiki/media/\d+/thumbnail$', str(event.get('path'))))
              and '/edit' in str(event.get('frame_path'))
          ]

          publish_saved = next((
              item for item in server
              if item.get('route') == 'admin.wiki.articles.publish'
              and item.get('event') == 'session_saved'
              and item.get('status_present') is True
          ), None)
          edit_loaded = next((
              item for item in server
              if item.get('route') == 'admin.wiki.articles.edit'
              and item.get('event') == 'session_loaded'
              and publish_saved is not None
              and int(item.get('monotonic_ns', '0')) > int(publish_saved.get('monotonic_ns', '0'))
          ), None)
          media_loaded = None
          media_saved = None
          if publish_saved is not None and edit_loaded is not None:
              lower = int(publish_saved.get('monotonic_ns', '0'))
              upper = int(edit_loaded.get('monotonic_ns', '0'))
              candidates = [
                  item for item in server
                  if item.get('route') in {'admin.wiki.media.index', 'admin.wiki.media.thumbnail'}
                  and lower < int(item.get('monotonic_ns', '0')) < upper
              ]
              media_loaded = next((item for item in candidates if item.get('event') == 'session_loaded' and item.get('status_present') is True), None)
              media_saved = next((item for item in candidates if item.get('event') == 'session_saved' and item.get('status_present') is False), None)

          causal = bool(old_media_starts and publish_saved and media_loaded and media_saved and edit_loaded and edit_loaded.get('status_present') is False and durable and not flash_present)
          if causal:
              classification = 'PROVEN_CAUSAL_OLD_DOCUMENT_MEDIA_FLASH_CONSUMPTION'
          elif not flash_present and durable and not old_media_starts:
              classification = 'REPRODUCED_WITHOUT_ACTION_WINDOW_OLD_MEDIA_START'
          elif not flash_present and durable:
              classification = 'REPRODUCED_INCONCLUSIVE_ORDER'
          elif flash_present and durable:
              classification = 'FLASH_RETAINED'
          else:
              classification = 'TECHNICAL_OR_DURABLE_STATE_FAILURE'

          exit_code = int((sample_dir / 'playwright.exit-code').read_text().strip())
          verdict = {
              'schema': 1,
              'sample': sample,
              'fixture_mode': sample.split('-')[0] if sample.startswith('clean-') else 'one-corrupt',
              'action_mode': 'prescroll' if '-prescroll-' in sample else 'immediate',
              'playwright_exit_code': exit_code,
              'browser_trace_found': browser is not None,
              'server_event_count': len(server),
              'flash_present': flash_present,
              'durable_published_visible': durable,
              'old_document_media_starts_in_publish_window': len(old_media_starts),
              'causal_chain_complete': causal,
              'classification': classification,
              'observation': observation,
          }
          (sample_dir / 'verdict.json').write_text(json.dumps(verdict, indent=2), encoding='utf-8')
          PY

                php scripts/acceptance/seed-browser-editorial-media.php reset
                php artisan cache:clear >/dev/null
              done
            done
          done

          kill "$server_pid" >/dev/null 2>&1 || true
          wait "$server_pid" 2>/dev/null || true

          cp "$RUN_ROOT/StartSession.php.before" "$START_SESSION"
          rm -f app/Support/Issue365Trace.php
          rm -f scripts/acceptance/tests/issue365-trace-helper.mjs
          rm -f scripts/acceptance/tests/admin-wiki-issue365-probe.spec.mjs
          rm -f /workspace/.issue365.env
          rmdir app/Support 2>/dev/null || true

          sha256sum -c "$RUN_ROOT/StartSession.sha256.before"
          php -l "$START_SESSION" > "$RUN_ROOT/StartSession.restore-lint.txt"
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code
          git diff --cached --exit-code
          git status --porcelain=v1 > "$RUN_ROOT/git-status-after.txt"

          python3 - "$RUN_ROOT" <<'PY'
          from pathlib import Path
          import json, sys

          root = Path(sys.argv[1])
          verdicts = [json.loads(path.read_text(encoding='utf-8')) for path in sorted((root / 'samples').glob('*/verdict.json'))]
          if len(verdicts) != 12:
              raise SystemExit(f'expected 12 sample verdicts, found {len(verdicts)}')
          counts = {}
          for item in verdicts:
              counts[item['classification']] = counts.get(item['classification'], 0) + 1
          technical_valid = all(item['browser_trace_found'] and item['server_event_count'] > 0 and item['durable_published_visible'] for item in verdicts)
          causal = [item['sample'] for item in verdicts if item['causal_chain_complete']]
          summary = {
              'schema': 1,
              'exact_tested_sha': 'b6f7b12a43aa72a52dc98c3fa07a7c4607fcb608',
              'sample_count': len(verdicts),
              'zero_retries': True,
              'technical_evidence_valid': technical_valid,
              'classification_counts': counts,
              'causal_samples': causal,
              'root_cause_classification': 'PROVEN' if causal else 'UNKNOWN',
              'samples': verdicts,
          }
          (root / 'matrix-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          if not technical_valid:
              raise SystemExit('one or more samples lack required browser/server/durable evidence')
          PY

          find "$RUN_ROOT" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$RUN_ROOT/SHA256SUMS"

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C /evidence \
            -czf /evidence/issue365-run.tar.gz issue365-run
          sha256sum /evidence/issue365-run.tar.gz > /evidence/issue365-run.tar.gz.sha256
          MATRIX

          docker run --rm -v "$evidence_volume:/evidence:ro" alpine:3.22 \
            sh -ec 'cat /evidence/issue365-run.tar.gz' \
            > "issue365-synology-evidence-${GITHUB_RUN_ID}.tar.gz"
          docker run --rm -v "$evidence_volume:/evidence:ro" alpine:3.22 \
            sh -ec 'cat /evidence/issue365-run.tar.gz.sha256' \
            > "issue365-synology-evidence-${GITHUB_RUN_ID}.tar.gz.sha256"
          docker run --rm -v "$evidence_volume:/evidence:ro" alpine:3.22 \
            sh -ec 'cat /evidence/issue365-run/matrix-summary.json' \
            > "issue365-synology-matrix-summary-${GITHUB_RUN_ID}.json"

          test -s "issue365-synology-evidence-${GITHUB_RUN_ID}.tar.gz"
          test -s "issue365-synology-evidence-${GITHUB_RUN_ID}.tar.gz.sha256"
          test -s "issue365-synology-matrix-summary-${GITHUB_RUN_ID}.json"
          trap - EXIT

      - name: Upload immutable Issue 365 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue365-exact-frozen-synology-${{ github.run_id }}
          path: |
            issue365-synology-evidence-${{ github.run_id }}.tar.gz
            issue365-synology-evidence-${{ github.run_id }}.tar.gz.sha256
            issue365-synology-matrix-summary-${{ github.run_id }}.json
            issue365-synology-partial-${{ github.run_id }}.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated validation runtime
        if: always()
        shell: bash
        run: |
          set +e
          prefix="issue365-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for container in \
            "${prefix}-app" \
            "${prefix}-mailhog" \
            "${prefix}-redis" \
            "${prefix}-mariadb"; do
            docker rm -f "$container" >/dev/null 2>&1 || true
          done
          docker network rm "${prefix}-net" >/dev/null 2>&1 || true
          docker volume rm -f "${prefix}-work" "${prefix}-evidence" >/dev/null 2>&1 || true
          docker image rm -f \
            "oteryn-issue365-validator:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "oteryn-issue365-platform:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null 2>&1 || true
          rm -f "/tmp/${prefix}.env" "/tmp/${prefix}-runbook.md"
          git reset --hard HEAD >/dev/null 2>&1 || true
          git clean -ffdqx >/dev/null 2>&1 || true
