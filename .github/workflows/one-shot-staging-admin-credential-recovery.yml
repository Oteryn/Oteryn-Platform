name: One-shot Staging Admin Credential Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-staging-admin-credential-recovery.yml
      - ops/staging-admin-credential-recovery/request.enc
      - docs/agents/tasks/active/OTERYN-20260727-staging-admin-credential-recovery.md

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-admin-credential-recovery-248
  cancel-in-progress: false

env:
  RECOVERY_REQUEST_ID: oteryn-20260727-admin-248
  RECOVERY_ISSUE: "248"
  RECOVERY_STATE_ROOT: /var/lib/oteryn-staging-state/credential-recovery

jobs:
  keygen:
    if: contains(github.event.head_commit.message, '[staging-admin-recovery:keygen]')
    runs-on: oteryn-staging
    environment: synology-staging
    timeout-minutes: 10
    outputs:
      public_key_b64: ${{ steps.key.outputs.public_key_b64 }}
      fingerprint: ${{ steps.key.outputs.fingerprint }}
    steps:
      - name: Generate or reuse the ephemeral recovery key
        id: key
        run: |
          set -euo pipefail
          umask 077
          request_dir="${RECOVERY_STATE_ROOT}/${RECOVERY_REQUEST_ID}"
          private_key="${request_dir}/private.pem"
          public_key="${request_dir}/public.pem"
          mkdir -p "$request_dir"

          if [[ ! -f "$private_key" ]]; then
            openssl genpkey \
              -algorithm RSA \
              -pkeyopt rsa_keygen_bits:3072 \
              -out "$private_key" >/dev/null 2>&1
          fi

          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          chmod 600 "$public_key"

          public_key_b64="$(base64 < "$public_key" | tr -d '\n')"
          fingerprint="$(openssl pkey -pubin -in "$public_key" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"

          [[ -n "$public_key_b64" ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]

          echo "public_key_b64=$public_key_b64" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  keygen-report:
    if: always() && needs.keygen.result != 'skipped'
    needs: keygen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post sanitized key-generation evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYGEN_RESULT: ${{ needs.keygen.result }}
          PUBLIC_KEY_B64: ${{ needs.keygen.outputs.public_key_b64 }}
          FINGERPRINT: ${{ needs.keygen.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [[ "$KEYGEN_RESULT" == "success" ]]; then
            body="$(cat <<EOF
Credential recovery key generation: PASS

- request_id: ${RECOVERY_REQUEST_ID}
- commit_sha: ${GITHUB_SHA}
- public_key_fingerprint_sha256: ${FINGERPRINT}
- public_key_pem_base64: ${PUBLIC_KEY_B64}

The corresponding private key remains only on the Synology staging runner and is not uploaded or logged.
EOF
)"
          else
            body="Credential recovery key generation: FAIL\n\n- request_id: ${RECOVERY_REQUEST_ID}\n- commit_sha: ${GITHUB_SHA}\n- no credential material was posted."
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${RECOVERY_ISSUE}/comments" \
            -f body="$body" >/dev/null

  apply:
    if: contains(github.event.head_commit.message, '[staging-admin-recovery:apply]')
    runs-on: oteryn-staging
    environment: synology-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Decrypt and apply the credential reset
        run: |
          set -euo pipefail
          umask 077

          request_dir="${RECOVERY_STATE_ROOT}/${RECOVERY_REQUEST_ID}"
          private_key="${request_dir}/private.pem"
          encrypted_payload="ops/staging-admin-credential-recovery/request.enc"
          cipher_file="$(mktemp /dev/shm/oteryn-recovery-cipher.XXXXXX)"
          payload_file="$(mktemp /dev/shm/oteryn-recovery-payload.XXXXXX)"

          cleanup() {
            rm -f "$cipher_file" "$payload_file"
          }
          trap cleanup EXIT

          [[ -f "$private_key" ]]
          [[ -f "$encrypted_payload" ]]

          base64 -d < "$encrypted_payload" > "$cipher_file"
          openssl pkeyutl \
            -decrypt \
            -inkey "$private_key" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in "$cipher_file" \
            -out "$payload_file"

          platform_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=platform \
            --format '{{.ID}}')"

          if [[ "$(wc -w <<<"$platform_container")" -ne 1 ]]; then
            echo "Expected exactly one running Platform staging container." >&2
            exit 1
          fi

          php_code="$(cat <<'PHP'
require '/var/www/html/vendor/autoload.php';
$app = require '/var/www/html/bootstrap/app.php';
$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

try {
    $payload = json_decode(stream_get_contents(STDIN), true, 4, JSON_THROW_ON_ERROR);
    if (! is_array($payload)) {
        throw new RuntimeException('Invalid recovery payload.');
    }

    $email = $payload['email'] ?? null;
    $password = $payload['password'] ?? null;
    if (! is_string($email) || ! is_string($password) || strlen($password) < 16 || strlen($password) > 128) {
        throw new RuntimeException('Invalid recovery payload.');
    }

    $canonicalEmail = App\Identity\Support\CanonicalEmail::normalize($email);
    $identity = App\Identity\Models\Identity::query()
        ->where('email', $canonicalEmail)
        ->first();

    if (! $identity instanceof App\Identity\Models\Identity || $identity->disabled_at !== null) {
        throw new RuntimeException('Recovery target is unavailable.');
    }

    if (! $identity->hasConfirmedMfa()) {
        throw new RuntimeException('Recovery target is not MFA-confirmed.');
    }

    $platformAdminRoleId = Illuminate\Support\Facades\DB::table('admin_roles')
        ->where('key', App\Admin\AdminRoleManager::PLATFORM_ADMIN)
        ->value('id');

    if (! is_int($platformAdminRoleId) && ! (is_string($platformAdminRoleId) && ctype_digit($platformAdminRoleId))) {
        throw new RuntimeException('Administrator role is unavailable.');
    }

    $hasPlatformAdmin = Illuminate\Support\Facades\DB::table('identity_admin_roles')
        ->where('identity_id', $identity->id)
        ->where('role_id', (int) $platformAdminRoleId)
        ->exists();

    if (! $hasPlatformAdmin) {
        throw new RuntimeException('Recovery target is not the staging platform administrator.');
    }

    $app->make(App\Identity\Credentials\IdentityCredentialUpdater::class)
        ->reset($identity, $password);

    $identity->refresh();
    if (! Illuminate\Support\Facades\Hash::check($password, $identity->password)) {
        throw new RuntimeException('Credential verification failed.');
    }

    echo 'ok';
} catch (Throwable) {
    exit(41);
}
PHP
)"

          if ! reset_result="$(docker exec -i "$platform_container" php -r "$php_code" < "$payload_file" 2>/dev/null)"; then
            unset php_code reset_result platform_container
            echo "Staging administrator credential reset failed closed." >&2
            exit 1
          fi

          if [[ "$reset_result" != "ok" ]]; then
            unset php_code reset_result platform_container
            echo "Staging administrator credential reset returned an invalid result." >&2
            exit 1
          fi

          unset php_code reset_result platform_container
          rm -f "$private_key" "${request_dir}/public.pem"
          rmdir "$request_dir" 2>/dev/null || true
          echo "Staging administrator credential reset completed through the application-owned updater."

  apply-report:
    if: always() && needs.apply.result != 'skipped'
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post sanitized reset evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_RESULT: ${{ needs.apply.result }}
        run: |
          set -euo pipefail
          if [[ "$APPLY_RESULT" == "success" ]]; then
            body="Credential recovery application: PASS\n\n- request_id: ${RECOVERY_REQUEST_ID}\n- commit_sha: ${GITHUB_SHA}\n- the existing enabled MFA-confirmed platform administrator credential was reset through IdentityCredentialUpdater::reset; existing web sessions and game authorizations were revoked; no secret material was posted."
          else
            body="Credential recovery application: FAIL\n\n- request_id: ${RECOVERY_REQUEST_ID}\n- commit_sha: ${GITHUB_SHA}\n- the operation failed closed; no secret material was posted."
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${RECOVERY_ISSUE}/comments" \
            -f body="$body" >/dev/null
