name: Temporary Synology Runtime Start Repair

on:
  push:
    branches:
      - fix/20260907-synology-runtime-start-order
    paths:
      - .github/workflows/temp-fix-synology-start-order.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-runtime-start-order
          fetch-depth: 0

      - name: Apply and validate bounded repair
        run: |
          set -euo pipefail
          python3 .github/scripts/temp_fix_synology_start_order.py
          bash -n deploy/synology/scripts/deploy.sh deploy/synology/scripts/health-check.sh
          python3 tests/ci/test_synology_auto_staging_deploy.py
          python3 tests/ci/test_synology_rollback_contract.py
          python3 tests/ci/test_synology_rollback_recovery_contract.py

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/synology/scripts/deploy.sh deploy/synology/scripts/health-check.sh tests/ci/test_synology_auto_staging_deploy.py .github/scripts/temp_fix_synology_start_order.py
          git commit -m "fix(staging): preserve runtime start order"
          git push origin HEAD:fix/20260907-synology-runtime-start-order
