name: Oracle native bootstrap

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fresh isolated Oracle store only; partial runs require explicit recovery
        required: true
        type: choice
        options:
          - preflight
          - initialize
        default: preflight

permissions:
  contents: read

concurrency:
  group: oracle-native-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'Oteryn/Oteryn-Platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: oracle-preproduction
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify dedicated anchor ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Oteryn/Oteryn-Platform/issues/1641 > "$RUNNER_TEMP/oracle-anchor.json"
          jq -e '.number == 1641 and .title == "Oracle native trust anchor ledger — issue 1639" and .state == "open" and (.pull_request == null)' "$RUNNER_TEMP/oracle-anchor.json" >/dev/null
          if [[ $(jq -r .locked "$RUNNER_TEMP/oracle-anchor.json") != true ]]; then
            gh api -X PUT repos/Oteryn/Oteryn-Platform/issues/1641/lock -f lock_reason=resolved
          fi
          gh api repos/Oteryn/Oteryn-Platform/issues/1641 --jq .locked | grep -qx true
      - name: Run protected Oracle executor
        env:
          GH_TOKEN: ${{ github.token }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ && $GITHUB_RUN_ID =~ ^[1-9][0-9]*$ ]]
          case "$OPERATION" in preflight|initialize) ;; *) exit 2;; esac
          [[ -n $ORACLE_SSH_PRIVATE_KEY && -n $ORACLE_SSH_KNOWN_HOSTS ]]
          work="$(mktemp -d "$RUNNER_TEMP/oteryn-oracle.XXXXXX")"
          trap 'rm -f -- "$work/key" "$work/known_hosts" "$work/source.tar"; rmdir -- "$work"' EXIT
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$work/known_hosts"
          unset ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS
          ssh_options=(-i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o ConnectTimeout=15)
          git archive --format=tar "$GITHUB_SHA" > "$work/source.tar"
          upload="/home/ubuntu/oteryn-native-$GITHUB_SHA-$GITHUB_RUN_ID.tar"
          target="/opt/oteryn-oracle/native-source-$GITHUB_SHA-$GITHUB_RUN_ID"
          scp "${ssh_options[@]}" "$work/source.tar" "ubuntu@158.180.58.90:$upload"
          ssh "${ssh_options[@]}" ubuntu@158.180.58.90 "sudo install -d -m 0700 '$target' && sudo tar --no-same-owner -xf '$upload' -C '$target' && rm -f -- '$upload'"
          # The real short-lived Actions token travels only on stdin, never in
          # an argument, source archive, host environment file or artifact.
          printf '%s\n' "$GH_TOKEN" | ssh "${ssh_options[@]}" ubuntu@158.180.58.90 \
            "sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=Oteryn/Oteryn-Platform GITHUB_REF=refs/heads/main GITHUB_SHA=$GITHUB_SHA GITHUB_RUN_ID=$GITHUB_RUN_ID OTERYN_CUTOVER_ANCHOR_ISSUE=1641 bash '$target/deploy/oracle/bootstrap-native-host.sh' '$OPERATION'"
