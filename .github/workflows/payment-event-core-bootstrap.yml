name: Payment Event Core Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: payment-event-core-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: >-
      github.repository == 'blakinio/Oteryn-Platform' &&
      github.head_ref == 'feat/OTERYN-20260802-payment-event-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect pending generator
        id: generator
        run: |
          if [[ -f scripts/payments/apply_payment_event_core.py ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.generator.outputs.apply == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite, pcntl
          tools: composer:v2

      - name: Apply provider-neutral payment core
        if: steps.generator.outputs.apply == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/payments/apply_payment_event_core.py

      - name: Validate generated paths and syntax
        if: steps.generator.outputs.apply == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.env.example')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path

          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          allowed_exact = {
              '.env.example',
              'app/Operations/ProductionConfigurationVerifier.php',
              'app/Providers/AppServiceProvider.php',
              'docs/agents/tasks/active/OTERYN-20260802-payment-event-core.md',
              'docs/architecture/DATA_OWNERSHIP.md',
              'docs/architecture/MODULE_CATALOG.md',
              'scripts/payments/apply_payment_event_core.py',
              'tests/Feature/Operations/ProductionConfigurationVerifierTest.php',
          }
          unexpected = sorted(path for path in changed if path not in allowed_exact)
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {unexpected}')
          required = {
              'app/Payments/Actions/ProcessPaymentProviderEvent.php',
              'app/Payments/Infrastructure/DeterministicTestPaymentProvider.php',
              'tests/Feature/Payments/PaymentEventCoreTest.php',
              'database/migrations/2026_08_02_124700_create_payment_event_core_tables.php',
              'docs/architecture/adr/0021-provider-neutral-payment-security-core.md',
          }
          missing = sorted(path for path in required if not Path(path).is_file())
          if missing:
              raise SystemExit(f'missing required staged paths: {missing}')
          PY
          find app/Payments config/payments.php \
            database/migrations/2026_08_02_124700_create_payment_event_core_tables.php \
            tests/Unit/Payments tests/Feature/Payments \
            -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Operations/ProductionConfigurationVerifier.php
          php -l app/Providers/AppServiceProvider.php
          php -l tests/Feature/Operations/ProductionConfigurationVerifierTest.php

      - name: Install development dependencies
        if: steps.generator.outputs.apply == 'true'
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress

      - name: Validate formatting and static analysis
        if: steps.generator.outputs.apply == 'true'
        run: |
          vendor/bin/pint --test \
            app/Payments \
            app/Operations/ProductionConfigurationVerifier.php \
            app/Providers/AppServiceProvider.php \
            config/payments.php \
            database/migrations/2026_08_02_124700_create_payment_event_core_tables.php \
            tests/Unit/Payments \
            tests/Feature/Payments \
            tests/Feature/Operations/ProductionConfigurationVerifierTest.php
          vendor/bin/phpstan analyse \
            app/Payments \
            app/Operations/ProductionConfigurationVerifier.php \
            app/Providers/AppServiceProvider.php \
            tests/Unit/Payments \
            tests/Feature/Payments \
            tests/Feature/Operations/ProductionConfigurationVerifierTest.php \
            --memory-limit=1G

      - name: Run focused payment security tests
        if: steps.generator.outputs.apply == 'true'
        run: |
          php artisan config:clear --ansi
          php artisan test tests/Unit/Payments/PaymentOrderStateMachineTest.php
          php artisan test tests/Feature/Payments/PaymentEventCoreTest.php
          php artisan test tests/Feature/Operations/ProductionConfigurationVerifierTest.php

      - name: Validate additive migration and rollback
        if: steps.generator.outputs.apply == 'true'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/oteryn-payment-core.sqlite
        run: |
          rm -f "$DB_DATABASE"
          touch "$DB_DATABASE"
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:rollback \
            --force \
            --no-interaction \
            --path=database/migrations/2026_08_02_124700_create_payment_event_core_tables.php
          php artisan migrate \
            --force \
            --no-interaction \
            --path=database/migrations/2026_08_02_124700_create_payment_event_core_tables.php

      - name: Validate active checkpoint
        if: steps.generator.outputs.apply == 'true'
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/active/OTERYN-20260802-payment-event-core.md
          --require-checkpoint

      - name: Commit validated implementation
        if: steps.generator.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(payments): implement provider-neutral event core"
          git push origin "HEAD:feat/OTERYN-20260802-payment-event-core"
