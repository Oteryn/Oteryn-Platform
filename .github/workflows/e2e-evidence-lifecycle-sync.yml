name: Scheduled E2E Evidence Lifecycle Sync

on:
  push:
    branches:
      - docs/OTERYN-20260805-e2e-scheduled-evidence-lifecycle
    paths:
      - .github/workflows/e2e-evidence-lifecycle-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/OTERYN-20260805-e2e-scheduled-evidence-lifecycle
          fetch-depth: 0
      - name: Release active-work ownership and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/agents/ACTIVE_WORK.md')
          text = path.read_text()
          line = '- `OTERYN-20260805-e2e-scheduled-evidence-closeout` — issue #114; PR #615; persist first scheduled soak/stability evidence, classify the retained zero-retry failure signal and complete lifecycle closeout.\n'
          if text.count(line) != 1:
              raise SystemExit('expected exactly one scheduled-E2E active-work entry')
          text = text.replace(line, 'None recorded by this index. Live active task files and pull requests remain authoritative when newer.\n', 1)
          path.write_text(text)
          Path('.github/workflows/e2e-evidence-lifecycle-sync.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agents/ACTIVE_WORK.md .github/workflows/e2e-evidence-lifecycle-sync.yml
          git diff --cached --check
          git commit -m 'docs(agents): release scheduled E2E ownership'
          git push origin HEAD:docs/OTERYN-20260805-e2e-scheduled-evidence-lifecycle
