name: Portal Exhaustive Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/portal-exhaustive-audit.yml'
      - 'tools/audit/portal_exhaustive_audit.py'
      - 'tools/audit/portal_exhaustive_reconcile.py'
      - 'tools/audit/portal_exhaustive_strictness.py'
      - 'tools/audit/validate_portal_exhaustive_retained_evidence.py'
      - 'tools/audit/test_portal_exhaustive_audit.py'
      - 'tools/audit/test_portal_exhaustive_reconcile.py'
      - 'tools/audit/test_portal_exhaustive_strictness.py'
      - 'tools/audit/test_validate_portal_exhaustive_retained_evidence.py'
      - 'docs/agents/tasks/active/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/**'
      - 'docs/agents/reports/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/testing/**'
      - 'scripts/acceptance/coverage/**'
      - 'scripts/acceptance/tests/**'
      - 'scripts/acceptance/playwright*.config.mjs'
      - 'scripts/acceptance/package.json'
      - 'routes/**'
      - 'app/**'
      - 'resources/views/**'
      - 'resources/navigation/**'
      - 'composer.json'
      - 'composer.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portal-exhaustive-audit.yml'
      - 'tools/audit/portal_exhaustive_audit.py'
      - 'tools/audit/portal_exhaustive_reconcile.py'
      - 'tools/audit/portal_exhaustive_strictness.py'
      - 'tools/audit/validate_portal_exhaustive_retained_evidence.py'
      - 'tools/audit/test_portal_exhaustive_audit.py'
      - 'tools/audit/test_portal_exhaustive_reconcile.py'
      - 'tools/audit/test_portal_exhaustive_strictness.py'
      - 'tools/audit/test_validate_portal_exhaustive_retained_evidence.py'
      - 'docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/**'
      - 'docs/agents/reports/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/testing/**'
      - 'scripts/acceptance/coverage/**'
      - 'scripts/acceptance/tests/**'
      - 'scripts/acceptance/playwright*.config.mjs'
      - 'scripts/acceptance/package.json'
      - 'routes/**'
      - 'app/**'
      - 'resources/views/**'
      - 'resources/navigation/**'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portal-exhaustive-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate fail-closed audit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: acceptance
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact audit SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install exact application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Validate Wiki expected-content inventory
        run: |
          set -euo pipefail
          php artisan wiki:launch-content:validate --json | tee wiki-expected-content-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('wiki-expected-content-validation.json').read_text())
          assert report['status'] == 'PASS'
          assert report['inventory_version']
          assert report['catalog_version']
          assert report['catalog_source_git_blob_sha']
          PY

      - name: Await exact-head strictness execution evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          required = (
              'Wiki Reconciliation Acceptance',
              'Editorial Media Acceptance',
              'Acceptance E2E and Visual UX',
          )
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['AUDIT_SHA']
          token = os.environ['GITHUB_TOKEN']
          deadline = time.monotonic() + (25 * 60)
          api = (
              f"https://api.github.com/repos/{repository}/actions/runs"
              f"?head_sha={urllib.parse.quote(sha)}&per_page=100"
          )

          def read_runs():
              request = urllib.request.Request(
                  api,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response).get('workflow_runs', [])

          while True:
              latest = {}
              for run in read_runs():
                  name = run.get('name')
                  if name in required and name not in latest:
                      latest[name] = {
                          'id': run.get('id'),
                          'html_url': run.get('html_url'),
                          'head_sha': run.get('head_sha'),
                          'status': run.get('status'),
                          'conclusion': run.get('conclusion'),
                      }

              failed = {
                  name: value
                  for name, value in latest.items()
                  if value.get('status') == 'completed' and value.get('conclusion') != 'success'
              }
              if failed:
                  raise SystemExit(
                      'Exact-head strictness workflow failed: '
                      + json.dumps(failed, sort_keys=True)
                  )

              if all(
                  name in latest
                  and latest[name].get('head_sha') == sha
                  and latest[name].get('status') == 'completed'
                  and latest[name].get('conclusion') == 'success'
                  for name in required
              ):
                  evidence = {
                      'exact_sha': sha,
                      'required_workflows': {name: latest[name] for name in required},
                  }
                  Path('portal-strictness-execution-evidence.json').write_text(
                      json.dumps(evidence, indent=2, sort_keys=True) + '\n',
                      encoding='utf-8',
                  )
                  print(json.dumps(evidence, indent=2, sort_keys=True))
                  break

              if time.monotonic() >= deadline:
                  raise SystemExit(
                      'Timed out waiting for exact-head strictness workflows: '
                      + json.dumps(latest, sort_keys=True)
                  )

              time.sleep(15)
          PY

      - name: Run audit unit tests
        run: |
          python -m unittest \
            tools/audit/test_portal_exhaustive_audit.py \
            tools/audit/test_portal_exhaustive_reconcile.py \
            tools/audit/test_portal_exhaustive_strictness.py \
            tools/audit/test_validate_portal_exhaustive_retained_evidence.py

      - name: Validate retained audit provenance
        run: python tools/audit/validate_portal_exhaustive_retained_evidence.py

      - name: Generate exhaustive current-main audit
        run: |
          set -euo pipefail
          rm -rf artifacts/portal-exhaustive-audit
          mkdir -p artifacts/portal-exhaustive-audit
          cp wiki-expected-content-validation.json artifacts/portal-exhaustive-audit/wiki-expected-content-validation.json
          cp portal-strictness-execution-evidence.json artifacts/portal-exhaustive-audit/portal-strictness-execution-evidence.json
          python tools/audit/portal_exhaustive_audit.py \
            --repo-root . \
            --output artifacts/portal-exhaustive-audit \
            --sha "$AUDIT_SHA" \
            | tee artifacts/portal-exhaustive-audit-command.json
          python tools/audit/portal_exhaustive_reconcile.py \
            --repo-root . \
            --output artifacts/portal-exhaustive-audit \
            | tee artifacts/portal-exhaustive-reconcile-command.json
          python tools/audit/portal_exhaustive_strictness.py \
            --output artifacts/portal-exhaustive-audit \
            | tee artifacts/portal-exhaustive-strictness-command.json

      - name: Verify generated identity and audit validity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/portal-exhaustive-audit')
          matrix = json.loads((root / 'portal-exhaustive-audit-matrix.json').read_text())
          strictness = json.loads((root / 'portal-exhaustive-strictness.json').read_text())
          wiki_inventory = json.loads((root / 'wiki-expected-content-validation.json').read_text())
          execution = json.loads((root / 'portal-strictness-execution-evidence.json').read_text())
          assert matrix['exact_sha'] == os.environ['AUDIT_SHA']
          assert strictness['exact_sha'] == os.environ['AUDIT_SHA']
          assert wiki_inventory['status'] == 'PASS'
          assert execution['exact_sha'] == os.environ['AUDIT_SHA']
          assert all(
              value['head_sha'] == os.environ['AUDIT_SHA']
              and value['status'] == 'completed'
              and value['conclusion'] == 'success'
              for value in execution['required_workflows'].values()
          )
          assert matrix['global_verdict'] == 'AUDIT_COMPLETE_WITH_FINDINGS'
          assert matrix['infrastructure_errors'] == []
          assert matrix['counts']['discovered_named_routes'] == 244
          assert matrix['counts']['classified_route_records'] == 232
          assert matrix['counts']['excluded_route_records'] == 12
          assert matrix['counts']['module_records'] == 18
          assert matrix['counts']['findings'] > 75
          assert strictness['finding_count'] == matrix['counts']['findings']
          assert len(matrix['module_summaries']) == 18
          assert len(list((root / 'modules').glob('*.json'))) == 18
          PY

      - name: Record source identities
        if: always()
        run: |
          mkdir -p artifacts/portal-exhaustive-audit
          {
            printf 'tested_sha=%s\n' "$AUDIT_SHA"
            sha256sum \
              tools/audit/portal_exhaustive_audit.py \
              tools/audit/portal_exhaustive_reconcile.py \
              tools/audit/portal_exhaustive_strictness.py \
              tools/audit/validate_portal_exhaustive_retained_evidence.py \
              tools/audit/test_portal_exhaustive_audit.py \
              tools/audit/test_portal_exhaustive_reconcile.py \
              tools/audit/test_portal_exhaustive_strictness.py \
              tools/audit/test_validate_portal_exhaustive_retained_evidence.py \
              docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/manifest.json \
              docs/testing/WIKI_EXPECTED_CONTENT_INVENTORY.json \
              docs/testing/PORTAL_STRICTNESS_EVIDENCE.json \
              docs/testing/ROUTE_VIEW_NAVIGATION_INVENTORY.json \
              docs/testing/ROUTE_VIEW_NAVIGATION_DELEGATED_BINDINGS.json \
              docs/testing/product-completeness-benchmark.json \
              docs/testing/product-backend-frontend-completeness.json \
              docs/testing/PORTAL_CONTENT_SCALE_EVIDENCE.json \
              docs/testing/portal-content-scale-surfaces/homepage-template-selector.json \
              docs/testing/PORTAL_MEDIA_STATE_EVIDENCE.json \
              docs/testing/portal-media-state-surfaces/homepage-template-selector.json \
              scripts/acceptance/coverage/portal-coverage-manifest.json \
              scripts/acceptance/coverage/surfaces/homepage-template-selector.json \
              scripts/acceptance/coverage/portal-evidence-dimensions.json \
              scripts/acceptance/coverage/portal-evidence-dimensions/homepage-template-selector.json \
              scripts/acceptance/coverage/validate-portal-content-scale-evidence.mjs \
              scripts/acceptance/coverage/validate-portal-media-strict-closure.mjs
          } > artifacts/portal-exhaustive-audit/source-identities.txt

      - name: Upload exhaustive audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-exhaustive-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/portal-exhaustive-audit
            artifacts/portal-exhaustive-audit-command.json
            artifacts/portal-exhaustive-reconcile-command.json
            artifacts/portal-exhaustive-strictness-command.json
          if-no-files-found: error
          retention-days: 14
