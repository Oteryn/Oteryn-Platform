name: Portal Exhaustive Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/portal-exhaustive-audit.yml'
      - 'tools/audit/portal_exhaustive_audit.py'
      - 'tools/audit/portal_exhaustive_reconcile.py'
      - 'tools/audit/portal_exhaustive_strictness.py'
      - 'tools/audit/validate_portal_exhaustive_retained_evidence.py'
      - 'tools/audit/test_portal_exhaustive_audit.py'
      - 'tools/audit/test_portal_exhaustive_reconcile.py'
      - 'tools/audit/test_portal_exhaustive_strictness.py'
      - 'tools/audit/test_validate_portal_exhaustive_retained_evidence.py'
      - 'docs/agents/tasks/active/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/**'
      - 'docs/agents/reports/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/testing/**'
      - 'scripts/acceptance/coverage/**'
      - 'scripts/acceptance/package.json'
      - 'routes/**'
      - 'app/**'
      - 'resources/views/**'
      - 'resources/navigation/**'
      - 'composer.json'
      - 'composer.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portal-exhaustive-audit.yml'
      - 'tools/audit/portal_exhaustive_audit.py'
      - 'tools/audit/portal_exhaustive_reconcile.py'
      - 'tools/audit/portal_exhaustive_strictness.py'
      - 'tools/audit/validate_portal_exhaustive_retained_evidence.py'
      - 'tools/audit/test_portal_exhaustive_audit.py'
      - 'tools/audit/test_portal_exhaustive_reconcile.py'
      - 'tools/audit/test_portal_exhaustive_strictness.py'
      - 'tools/audit/test_validate_portal_exhaustive_retained_evidence.py'
      - 'docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/**'
      - 'docs/agents/reports/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/testing/**'
      - 'scripts/acceptance/coverage/**'
      - 'scripts/acceptance/package.json'
      - 'routes/**'
      - 'app/**'
      - 'resources/views/**'
      - 'resources/navigation/**'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-exhaustive-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate fail-closed audit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: acceptance
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact audit SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install exact application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Run audit unit tests
        run: |
          python -m unittest \
            tools/audit/test_portal_exhaustive_audit.py \
            tools/audit/test_portal_exhaustive_reconcile.py \
            tools/audit/test_portal_exhaustive_strictness.py \
            tools/audit/test_validate_portal_exhaustive_retained_evidence.py

      - name: Validate retained audit provenance
        run: python tools/audit/validate_portal_exhaustive_retained_evidence.py

      - name: Generate exhaustive current-main audit
        run: |
          set -euo pipefail
          rm -rf artifacts/portal-exhaustive-audit
          mkdir -p artifacts/portal-exhaustive-audit
          python tools/audit/portal_exhaustive_audit.py \
            --repo-root . \
            --output artifacts/portal-exhaustive-audit \
            --sha "$AUDIT_SHA" \
            | tee artifacts/portal-exhaustive-audit-command.json
          python tools/audit/portal_exhaustive_reconcile.py \
            --repo-root . \
            --output artifacts/portal-exhaustive-audit \
            | tee artifacts/portal-exhaustive-reconcile-command.json
          python tools/audit/portal_exhaustive_strictness.py \
            --output artifacts/portal-exhaustive-audit \
            | tee artifacts/portal-exhaustive-strictness-command.json

      - name: Verify generated identity and audit validity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/portal-exhaustive-audit')
          matrix = json.loads((root / 'portal-exhaustive-audit-matrix.json').read_text())
          strictness = json.loads((root / 'portal-exhaustive-strictness.json').read_text())
          assert matrix['exact_sha'] == os.environ['AUDIT_SHA']
          assert strictness['exact_sha'] == os.environ['AUDIT_SHA']
          assert matrix['global_verdict'] == 'AUDIT_COMPLETE_WITH_FINDINGS'
          assert matrix['infrastructure_errors'] == []
          assert matrix['counts']['discovered_named_routes'] == 244
          assert matrix['counts']['classified_route_records'] == 232
          assert matrix['counts']['excluded_route_records'] == 12
          assert matrix['counts']['module_records'] == 18
          assert matrix['counts']['findings'] > 75
          assert strictness['finding_count'] == matrix['counts']['findings']
          assert len(matrix['module_summaries']) == 18
          assert len(list((root / 'modules').glob('*.json'))) == 18
          PY

      - name: Record source identities
        if: always()
        run: |
          mkdir -p artifacts/portal-exhaustive-audit
          {
            printf 'tested_sha=%s\n' "$AUDIT_SHA"
            sha256sum \
              tools/audit/portal_exhaustive_audit.py \
              tools/audit/portal_exhaustive_reconcile.py \
              tools/audit/portal_exhaustive_strictness.py \
              tools/audit/validate_portal_exhaustive_retained_evidence.py \
              tools/audit/test_portal_exhaustive_audit.py \
              tools/audit/test_portal_exhaustive_reconcile.py \
              tools/audit/test_portal_exhaustive_strictness.py \
              tools/audit/test_validate_portal_exhaustive_retained_evidence.py \
              docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/manifest.json \
              docs/testing/ROUTE_VIEW_NAVIGATION_INVENTORY.json \
              docs/testing/ROUTE_VIEW_NAVIGATION_DELEGATED_BINDINGS.json \
              docs/testing/product-completeness-benchmark.json \
              docs/testing/product-backend-frontend-completeness.json \
              docs/testing/PORTAL_CONTENT_SCALE_EVIDENCE.json \
              docs/testing/portal-content-scale-surfaces/homepage-template-selector.json \
              docs/testing/PORTAL_MEDIA_STATE_EVIDENCE.json \
              docs/testing/portal-media-state-surfaces/homepage-template-selector.json \
              scripts/acceptance/coverage/portal-coverage-manifest.json \
              scripts/acceptance/coverage/surfaces/homepage-template-selector.json \
              scripts/acceptance/coverage/portal-evidence-dimensions.json \
              scripts/acceptance/coverage/portal-evidence-dimensions/homepage-template-selector.json \
              scripts/acceptance/coverage/validate-portal-content-scale-evidence.mjs \
              scripts/acceptance/coverage/validate-portal-media-strict-closure.mjs
          } > artifacts/portal-exhaustive-audit/source-identities.txt

      - name: Upload exhaustive audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-exhaustive-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/portal-exhaustive-audit
            artifacts/portal-exhaustive-audit-command.json
            artifacts/portal-exhaustive-reconcile-command.json
            artifacts/portal-exhaustive-strictness-command.json
          if-no-files-found: error
          retention-days: 14
