name: Portal RS E2E

# Browser qualification of the whole portal (portal-rs/e2e, Playwright) on hosted runners.
# One job builds the portal binary once; one job per Playwright project then starts the
# disposable local stack (portal-rs/e2e/local.mjs) against its own PostgreSQL 18.6 and runs
# the full spec corpus. Ready PRs opt in with heavy-tests; every main push runs the
# full suite alongside the reusable Rust PostgreSQL and browser jobs.
# Review/retirement: review when portal-rs-ci.yml gains an equivalent full-corpus browser job
# or the e2e corpus moves; retire with portal-rs/e2e.

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated Playwright projects; "all" runs every project in playwright.config.mjs
        required: false
        default: all
      shards:
        description: Shards per project (1-4)
        required: false
        default: '1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

concurrency:
  # An unrelated label notification must never cancel a real PR run.
  group: platform-heavy-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'heavy-tests') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - id: scope
        env:
          RUN_HEAVY: >-
            ${{ github.event_name != 'pull_request' ||
                (!github.event.pull_request.draft &&
                 contains(github.event.pull_request.labels.*.name, 'heavy-tests') &&
                 (github.event.action != 'labeled' || github.event.label.name == 'heavy-tests')) }}
        run: printf 'run=%s\n' "$RUN_HEAVY" >> "$GITHUB_OUTPUT"

  rust_heavy:
    if: ${{ needs.scope.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    needs: scope
    uses: ./.github/workflows/portal-rs-ci.yml
    permissions:
      contents: read

  build:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: scope
    # Pinned image: the pinned Playwright release has no Chromium build for ubuntu-latest
    # (26.04), and the binary built here must run on the same glibc as the e2e jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Plan the matrix
        # Every project in playwright.config.mjs runs unless a manual run names a subset; an
        # unknown name fails here instead of silently running nothing.
        id: plan
        working-directory: portal-rs/e2e
        env:
          PROJECTS: ${{ github.event_name == 'workflow_dispatch' && inputs.projects || 'all' }}
          SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '1' }}
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e '
            const {default: config} = await import("./playwright.config.mjs");
            const known = config.projects.map(p => p.name);
            const asked = process.env.PROJECTS.trim() === "all" ? known : process.env.PROJECTS.split(",").map(s => s.trim()).filter(Boolean);
            const unknown = asked.filter(p => !known.includes(p));
            if (!asked.length || unknown.length) { console.error(`unknown or empty projects: ${unknown.join(",")}; known: ${known.join(",")}`); process.exit(1); }
            const shards = Number(process.env.SHARDS);
            if (!Number.isInteger(shards) || shards < 1 || shards > 4) { console.error("shards must be 1-4"); process.exit(1); }
            const include = asked.flatMap(project => Array.from({length: shards}, (_, i) => ({project, shard: `${i + 1}/${shards}`})));
            console.log(`projects=${asked.join(",")} shards=${shards} jobs=${include.length}`);
            (await import("node:fs")).appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\n`);
          '

      - name: Install pinned toolchain
        working-directory: portal-rs
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build the portal
        # Debug build, as local.mjs uses; without debug info to keep the artifact small.
        working-directory: portal-rs
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          started=$SECONDS
          cargo build --locked -p oteryn-portal
          echo "build seconds: $((SECONDS - started))" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/portal-bin"
          cp target/debug/oteryn-portal "$RUNNER_TEMP/portal-bin/"

      - name: Upload the portal binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-binary
          path: ${{ runner.temp }}/portal-bin/oteryn-portal
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      # Disposable CI-only PostgreSQL administrator; local.mjs accepts only a localhost URL and
      # creates and drops its own two task databases.
      PORTAL_E2E_ADMIN_DATABASE_URL: postgres://portal:portal-ci-only@127.0.0.1:5432/postgres
    steps:
      - name: Scratch and binary paths
        run: |
          echo "PORTAL_E2E_SCRATCH=$RUNNER_TEMP/e2e-scratch" >> "$GITHUB_ENV"
          echo "PORTAL_E2E_BINARY=$RUNNER_TEMP/portal-bin/oteryn-portal" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download the portal binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portal-binary
          path: ${{ runner.temp }}/portal-bin

      - name: Start PostgreSQL 18.6
        run: |
          chmod +x "$PORTAL_E2E_BINARY"
          docker run -d --name portal-rs-e2e-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=portal -e POSTGRES_PASSWORD=portal-ci-only -e POSTGRES_DB=portal_test \
            postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 \
            -c max_connections=200
          for i in $(seq 1 60); do
            if docker exec portal-rs-e2e-pg pg_isready -U portal -d portal_test -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs portal-rs-e2e-pg
          exit 1

      - name: Install e2e dependencies and Chromium
        working-directory: portal-rs/e2e
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
          # Chromium from the same pinned @playwright/test release as the specs.
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          chromium="$(node --input-type=module -e 'const {chromium} = await import("@playwright/test"); console.log(chromium.executablePath())')"
          test -x "$chromium"
          echo "CHROMIUM_PATH=$chromium" >> "$GITHUB_ENV"

      - name: Start the local stack
        # local.mjs binds the mail catcher to 465 and 587 on 127.0.0.1.
        working-directory: portal-rs/e2e
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          mkdir -p "$PORTAL_E2E_SCRATCH"
          nohup node local.mjs > "$RUNNER_TEMP/local.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/local.pid"
          for i in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/local.pid")" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/local.log"; exit 1
            fi
            if grep -q 'Services starting' "$RUNNER_TEMP/local.log"; then
              code="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:18443/en || true)"
              if [ "$code" != 000 ] && [ "$code" != 502 ]; then
                echo "stack ready after ${i}s (HTTP $code)"; exit 0
              fi
            fi
            sleep 1
          done
          tail -n 100 "$RUNNER_TEMP/local.log"
          exit 1

      - name: Run Playwright
        working-directory: portal-rs/e2e
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: |
          listed="$(node run.mjs "$PORTAL_E2E_SCRATCH/env.json" test --project="$PROJECT" --shard="$SHARD" --list | grep -oE '^Total: [0-9]+' | grep -oE '[0-9]+' || true)"
          echo "tests listed: $listed"
          test "${listed:-0}" -gt 0
          started=$SECONDS
          status=0
          node run.mjs "$PORTAL_E2E_SCRATCH/env.json" test --project="$PROJECT" --shard="$SHARD" || status=$?
          echo "playwright seconds: $((SECONDS - started))"
          # Every listed test must have run and passed: no skips, nothing missing.
          LISTED="$listed" node --input-type=module -e '
            const fs = await import("node:fs");
            const r = JSON.parse(fs.readFileSync("test-results/results.json", "utf8")).stats;
            const line = `${process.env.PROJECT} ${process.env.SHARD}: listed=${process.env.LISTED} expected=${r.expected} unexpected=${r.unexpected} flaky=${r.flaky} skipped=${r.skipped} seconds=${Math.round(r.duration / 1000)}`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            if (r.skipped !== 0 || r.expected + r.flaky !== Number(process.env.LISTED)) process.exit(1);
          ' || status=1
          exit "$status"

      - name: Service log tails
        # Disposable values only; connection strings are redacted anyway.
        if: ${{ failure() }}
        run: |
          for f in "$RUNNER_TEMP/local.log" "$PORTAL_E2E_SCRATCH/serve.log" "$PORTAL_E2E_SCRATCH/worker.log"; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f")"
            tail -n 200 "$f" | sed -E 's#postgres(ql)?://[^[:space:]"]+#postgres://REDACTED#g'
          done

      - name: Stop the local stack
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/local.pid" ]; then
            kill -INT "$(cat "$RUNNER_TEMP/local.pid")" 2>/dev/null || true
            sleep 5
          fi

      - name: Upload Playwright evidence
        # Traces and screenshots only; the scratch directory (env.json, keys) is never uploaded.
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.project }}-${{ strategy.job-index }}
          path: portal-rs/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  heavy_gate:
    # Unrelated label events still run this job, under a different check name so
    # they cannot supersede the required result (successful, failed, or pending).
    name: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          'Portal Playwright (standalone)' ||
          (github.event.action == 'labeled' && github.event.label.name != 'heavy-tests') &&
          'platform-heavy-gate (unrelated label)' || 'platform-heavy-gate' }}
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    needs: [scope, rust_heavy, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Qualify the selected heavy jobs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'heavy-tests' }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_HEAVY: ${{ needs.scope.outputs.run }}
          RUST_RESULT: ${{ needs.rust_heavy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [[ "$OTHER_LABEL" == true ]]; then
            echo 'Unrelated label event; the qualifying event publishes platform-heavy-gate.'
            exit 0
          fi
          if [[ -n "$PR_NUMBER" && "$RUN_HEAVY" == false ]]; then
            live_heavy="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -r '
              if (.draft | type) != "boolean" or (.labels | type) != "array" then
                error("Invalid pull request response")
              else
                (.draft == false and any(.labels[]; .name == "heavy-tests"))
              end
            ')"
            if [[ "$live_heavy" == true ]]; then
              echo 'The PR is now eligible for heavy tests; the heavy-tests run publishes platform-heavy-gate.'
              exit 1
            fi
            test "$live_heavy" = false
            echo 'Not a heavy-tests PR; platform-gate governs qualification.'
            exit 0
          fi
          test "$RUN_HEAVY" = true
          echo "Heavy results: rust=$RUST_RESULT build=$BUILD_RESULT e2e=$E2E_RESULT"
          test "$RUST_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
