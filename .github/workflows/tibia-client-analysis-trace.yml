name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-client-analysis-trace.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Install and launch Tibia runtime
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv

      - name: Trigger install action in official launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DISPLAY=:99
            [[ -S /tmp/.X11-unix/X99 ]]
            wid=$(xdotool search --onlyvisible --name "^Tibia$" 2>/dev/null | head -n1)
            [[ -n "$wid" ]]
            xdotool windowactivate --sync "$wid" || true
            xdotool mousemove --window "$wid" 700 405 click 1
            echo INSTALL_CLICK_SENT=true
            sleep 3
            echo LAUNCHER_WINDOW_STILL_VISIBLE=$(xdotool search --onlyvisible --name "^Tibia$" >/dev/null 2>&1 && echo true || echo false)
          '

      - name: Wait for complete runtime and launch verified client
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            c=/data/client-15.32.df7b29/bin/client
            mkdir -p /data/runtime
            found=0
            for _ in $(seq 1 48); do
              qt=$(find /data -type f -name libQt6WebEngineQuick.so.6 -print -quit 2>/dev/null || true)
              if [[ -n "$qt" ]]; then found=1; break; fi
              sleep 5
            done
            echo QT_RUNTIME_FOUND=$found
            if (( found == 0 )); then
              echo SANITIZED_LAUNCHER_DIAGNOSTIC_BEGIN
              sed -E "/(token|password|account|session|cookie|authorization|bearer)/Id" /data/runtime/launcher.log | tail -80
              echo SANITIZED_LAUNCHER_DIAGNOSTIC_END
              exit 1
            fi
            libdir=$(dirname "$qt"); base=$(dirname "$libdir")
            plugdir=""; qmldir=""
            for d in "$base/plugins" "$libdir/plugins"; do [[ -d "$d" ]] && { plugdir=$d; break; }; done
            for d in "$base/qml" "$libdir/qml"; do [[ -d "$d" ]] && { qmldir=$d; break; }; done
            : > /data/runtime/client-launch.log
            cd "$(dirname "$c")"
            args=(env DISPLAY=:99 LD_LIBRARY_PATH="$libdir")
            [[ -n "$plugdir" ]] && args+=(QT_PLUGIN_PATH="$plugdir")
            [[ -n "$qmldir" ]] && args+=(QML2_IMPORT_PATH="$qmldir")
            args+=("$c")
            nohup "${args[@]}" >/data/runtime/client-launch.log 2>&1 </dev/null &
            sleep 15
            count=0
            for p in /proc/[0-9]*; do
              [[ -r "$p/exe" ]] || continue
              exe=$(readlink -f "$p/exe" 2>/dev/null || true)
              [[ "$exe" == "$c" ]] && count=$((count+1))
            done
            echo CLIENT_PROCESS_COUNT=$count
            if (( count == 0 )); then
              echo SANITIZED_CLIENT_DIAGNOSTIC_BEGIN
              sed -E "/(token|password|account|session|cookie|authorization|bearer)/Id" /data/runtime/client-launch.log | tail -80
              echo SANITIZED_CLIENT_DIAGNOSTIC_END
              exit 1
            fi
            echo CLIENT_LAUNCH_FAILED=false
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
