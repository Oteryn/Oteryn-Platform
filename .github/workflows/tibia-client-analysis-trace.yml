name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-client-analysis-trace.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Launch Tibia client in owned virtual display
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            c=/data/client-15.32.df7b29/bin/client
            [[ "$(stat -c %s "$c")" == 51965216 ]]
            [[ "$(sha256sum "$c" | awk "{print \$1}")" == e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe ]]
          '

      - name: Prepare virtual display in owned container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v Xvfb >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y --no-install-recommends xvfb >/tmp/oteryn-x11-install.log 2>&1
            fi
            if [[ ! -S /tmp/.X11-unix/X99 ]]; then
              rm -f /tmp/.X99-lock
              nohup Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/oteryn-xvfb.log 2>&1 </dev/null &
              for _ in $(seq 1 30); do
                [[ -S /tmp/.X11-unix/X99 ]] && break
                sleep 0.2
              done
            fi
            [[ -S /tmp/.X11-unix/X99 ]]
            echo VIRTUAL_DISPLAY_READY=true
          '

      - name: Launch verified official client with bundled runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            root=/data/client-15.32.df7b29
            c=$root/bin/client
            mkdir -p /data/runtime
            : > /data/runtime/client-launch.log

            qt=$(find "$root" -type f -name libQt6WebEngineQuick.so.6 -print -quit)
            if [[ -z "$qt" ]]; then
              echo BUNDLED_QT_FOUND=false
              exit 1
            fi
            libdir=$(dirname "$qt")
            plugdir=""
            for d in "$root/plugins" "$root/bin/plugins" "$(dirname "$libdir")/plugins"; do
              [[ -d "$d" ]] && { plugdir=$d; break; }
            done
            qmldir=""
            for d in "$root/qml" "$root/bin/qml" "$(dirname "$libdir")/qml"; do
              [[ -d "$d" ]] && { qmldir=$d; break; }
            done
            echo BUNDLED_QT_FOUND=true
            echo BUNDLED_QT_LIBDIR=$libdir
            echo BUNDLED_QT_PLUGINS_FOUND=$( [[ -n "$plugdir" ]] && echo true || echo false )
            echo BUNDLED_QT_QML_FOUND=$( [[ -n "$qmldir" ]] && echo true || echo false )

            existing=0
            for p in /proc/[0-9]*; do
              [[ -r "$p/exe" ]] || continue
              exe=$(readlink -f "$p/exe" 2>/dev/null || true)
              [[ "$exe" == "$c" ]] && existing=$((existing+1))
            done
            if (( existing == 0 )); then
              cd "$(dirname "$c")"
              args=(env DISPLAY=:99 LD_LIBRARY_PATH="$libdir")
              [[ -n "$plugdir" ]] && args+=(QT_PLUGIN_PATH="$plugdir")
              [[ -n "$qmldir" ]] && args+=(QML2_IMPORT_PATH="$qmldir")
              args+=("$c")
              nohup "${args[@]}" >/data/runtime/client-launch.log 2>&1 </dev/null &
            fi
            sleep 15
            count=0
            for p in /proc/[0-9]*; do
              [[ -r "$p/exe" ]] || continue
              exe=$(readlink -f "$p/exe" 2>/dev/null || true)
              [[ "$exe" == "$c" ]] && count=$((count+1))
            done
            echo CLIENT_PROCESS_COUNT=$count
            echo X11_SOCKET_PRESENT=$( [[ -S /tmp/.X11-unix/X99 ]] && echo true || echo false )
            if (( count == 0 )); then
              echo CLIENT_LAUNCH_FAILED=true
              echo REMAINING_MISSING_DYNAMIC_LIBRARIES_BEGIN
              LD_LIBRARY_PATH="$libdir" ldd "$c" 2>/dev/null | awk "/not found/{print \$1}" | head -40
              echo REMAINING_MISSING_DYNAMIC_LIBRARIES_END
              echo SANITIZED_DIAGNOSTIC_BEGIN
              sed -E "/(token|password|account|session|cookie|authorization|bearer)/Id" /data/runtime/client-launch.log | tail -50
              echo SANITIZED_DIAGNOSTIC_END
              exit 1
            fi
            echo CLIENT_LAUNCH_FAILED=false
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
