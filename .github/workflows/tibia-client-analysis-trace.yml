name: Tibia Client Analysis Trace

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Enter Tibia world and capture proof
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Login account and enter selected character
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/warp-trace
          grep -q '^warp=on$' /tmp/warp-trace
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          pkill -f 'packages/Tibia/bin/client' 2>/dev/null || true
          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          sleep 2
          cd "$pkg"
          nohup proxychains4 -f /tmp/proxychains-tibia.conf "$client" >/data/runtime/client-userspace-warp.log 2>&1 </dev/null &
          for n in $(seq 1 30); do pgrep -f 'packages/Tibia/bin/client' >/dev/null && break; sleep 1; done
          sleep 10
          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p'); height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height)); if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" && "$best_area" -ge 600000 ]]
          xdotool windowactivate --sync "$best" || true
          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 25
          import -display :99 -window "$best" /tmp/character-select.png
          convert /tmp/character-select.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/character-select-ocr.png
          tesseract /tmp/character-select-ocr.png stdout --psm 11 2>/dev/null >/tmp/character-select.txt || true
          grep -qi 'Select Character' /tmp/character-select.txt
          echo CHARACTER_SELECT_PROVEN=true
          # Character selection dialog supports keyboard navigation. Focus the dialog, select
          # the first character, and activate the default action without guessing button geometry.
          xdotool mousemove --window "$best" 500 250 click 1
          xdotool key --window "$best" Home
          sleep 1
          xdotool key --window "$best" Return
          sleep 40
          import -display :99 -window "$best" /tmp/world-entry.png
          convert /tmp/world-entry.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/world-entry-ocr.png
          tesseract /tmp/world-entry-ocr.png stdout --psm 11 2>/dev/null >/tmp/world-entry.txt || true
          python3 - <<'PY'
          text=open('/tmp/world-entry.txt',errors='replace').read().lower()
          login_markers=sum(text.count(x) for x in ('select character','account login','password'))
          game_markers=sum(text.count(x) for x in ('skills','battle','health','mana','inventory','quests','prey','store','logout'))
          print(f'POST_ENTRY_LOGIN_MARKERS={login_markers}')
          print(f'POST_ENTRY_GAME_MARKERS={game_markers}')
          if game_markers < 2 or login_markers >= 2:
              raise SystemExit('World-entry state not proven')
          print('TIBIA_WORLD_ENTRY_PROVEN=true')
          PY
          # Full screenshot is retained only inside the owned runtime. Export a privacy-safe
          # proof with the central game viewport and account/character side regions masked.
          cp /tmp/world-entry.png /tmp/world-entry-safe.png
          convert /tmp/world-entry-safe.png -fill '#202020' \
            -draw 'rectangle 0,0 220,800 rectangle 1030,0 1280,800 rectangle 0,0 1280,80' \
            /tmp/world-entry-safe.png
          INNER
          docker cp "$CONTAINER_NAME:/tmp/world-entry-safe.png" /tmp/world-entry-safe.png

      - name: Upload privacy-safe world screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-world-entry-screenshot-safe
          path: /tmp/world-entry-safe.png
          retention-days: 7
          if-no-files-found: warn

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
