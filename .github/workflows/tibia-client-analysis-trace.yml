name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Launch installed Tibia client
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv

      - name: Launch official installed client
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          [[ -x "$client" ]]
          echo CLIENT_PATH="$client"
          echo LDD_MISSING_BEGIN
          ldd "$client" 2>/dev/null | grep 'not found' || true
          echo LDD_MISSING_END
          before=$(mktemp)
          xdotool search --onlyvisible --name '.*' 2>/dev/null | sort -n > "$before" || true
          pkill -f '^/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client' 2>/dev/null || true
          : > /data/runtime/installed-client-launch.log
          cd "$pkg"
          nohup "$client" >/data/runtime/installed-client-launch.log 2>&1 </dev/null &
          pid=$!
          echo CLIENT_PID=$pid
          alive=0
          for n in $(seq 1 12); do
            sleep 3
            if kill -0 "$pid" 2>/dev/null; then alive=1; else alive=0; break; fi
          done
          echo CLIENT_PROCESS_ALIVE=$alive
          echo VISIBLE_WINDOWS_BEGIN
          for w in $(xdotool search --onlyvisible --name '.*' 2>/dev/null || true); do
            printf 'id=%s name=' "$w"
            xdotool getwindowname "$w" 2>/dev/null || true
          done
          echo VISIBLE_WINDOWS_END
          import -display :99 -window root /tmp/client-screen.png || true
          if (( alive == 0 )); then
            echo SANITIZED_CLIENT_DIAGNOSTIC_BEGIN
            sed -E '/(token|password|account|session|cookie|authorization|bearer)/Id' /data/runtime/installed-client-launch.log | tail -120
            echo SANITIZED_CLIENT_DIAGNOSTIC_END
            exit 1
          fi
          test -s /tmp/client-screen.png
          INNER
          docker cp "$CONTAINER_NAME:/tmp/client-screen.png" /tmp/client-screen.png
          test -s /tmp/client-screen.png
          echo CLIENT_SCREENSHOT_BYTES=$(stat -c %s /tmp/client-screen.png)

      - name: Upload client screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-client-screen
          path: /tmp/client-screen.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
