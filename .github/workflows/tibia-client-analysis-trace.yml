name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tibia-client-analysis-trace.yml

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  EVIDENCE_PATH: docs/agents/reports/OTERYN-20260812-worldmap-dispatch-evidence.md

jobs:
  trace:
    name: Trace Worldmap map-data helper
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            c=/data/client-15.32.df7b29/bin/client
            [[ "$(stat -c %s "$c")" == 51965216 ]]
            [[ "$(sha256sum "$c" | awk "{print \$1}")" == e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe ]]
          '

      - name: Generate bounded deep trace evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" /data/reverse-venv/bin/python - > /tmp/worldmap-deep-trace-evidence.md <<'PY'
          from pathlib import Path
          import re, subprocess

          client=Path('/data/client-15.32.df7b29/bin/client')
          sha=subprocess.check_output(['sha256sum',str(client)],text=True).split()[0]

          def dis(a,b):
              return subprocess.check_output(
                  ['objdump','-d','-C',f'--start-address={a}',f'--stop-address={b}',str(client)],
                  text=True,errors='replace')

          def compact(a,b):
              out=[]
              for ln in dis(a,b).splitlines():
                  m=re.match(r'^\s*([0-9a-f]+):\s+((?:[0-9a-f]{2}\s+)+)\s*(.*)$',ln)
                  if m: out.append(f'0x{int(m.group(1),16):x}: {m.group(3).strip()}')
              return out

          proc_names=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try: name=(p/'comm').read_text().strip()
              except Exception: continue
              if name in {'client','Tibia','tibia'}: proc_names.append(name)
          x11=Path('/tmp/.X11-unix').is_dir() and any(Path('/tmp/.X11-unix').iterdir())
          wayland=False
          run_user=Path('/run/user')
          if run_user.is_dir():
              for p in run_user.glob('*/wayland-*'):
                  if p.exists(): wayland=True; break

          windows=[
              ('COMMON_TAIL',0x19a9170,0x19a9700),
              ('MAP_CONTENT_BUILD',0xceca50,0xcecc70),
              ('PROTO_MESSAGE_SELECT',0x1ab4e50,0x1ab50d0),
              ('FIELD_ITEM_ADVANCE',0x1aab450,0x1aab650),
              ('PROTO_COPY_HELPER',0x1b13c80,0x1b13ec0),
          ]

          print('## Generated bounded deep trace')
          print()
          print(f'- Client SHA-256: `{sha}`')
          print('- Central routine: `0x19a8a80`')
          print(f'- Active Tibia client processes by `/proc/*/comm`: `{len(proc_names)}`')
          print(f'- X11 socket present: `{str(x11).lower()}`')
          print(f'- Wayland socket present: `{str(wayland).lower()}`')
          print('- Session inspection intentionally records no environment values, account data, tokens, process arguments, or client state file contents.')
          print()
          for label,a,b in windows:
              print(f'### {label} `0x{a:x}..0x{b:x}`')
              print('```text')
              for ln in compact(a,b): print(ln)
              print('```')
              print()
          PY
          test -s /tmp/worldmap-deep-trace-evidence.md
          grep -F 'Central routine: `0x19a8a80`' /tmp/worldmap-deep-trace-evidence.md >/dev/null

      - name: Persist bounded deep evidence to task branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ['REPOSITORY']; ref=os.environ['HEAD_REF']; token=os.environ['GH_TOKEN']; path=os.environ['EVIDENCE_PATH']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'oteryn-bounded-evidence-writer'}
          api=f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}'
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers)) as r: cur=json.load(r)
          text=base64.b64decode(cur['content']).decode(); block=pathlib.Path('/tmp/worldmap-deep-trace-evidence.md').read_text()
          begin='<!-- BEGIN GENERATED DEEP TRACE EVIDENCE -->'; end='<!-- END GENERATED DEEP TRACE EVIDENCE -->'; wrapped=begin+'\n'+block.rstrip()+'\n'+end
          if begin in text and end in text:
              left=text.split(begin,1)[0].rstrip(); right=text.split(end,1)[1].lstrip(); new=left+'\n\n'+wrapped+'\n'+(('\n'+right) if right else '')
          else: new=text.rstrip()+'\n\n'+wrapped+'\n'
          payload=json.dumps({'message':'docs: persist bounded worldmap deep trace','content':base64.b64encode(new.encode()).decode(),'sha':cur['sha'],'branch':ref}).encode()
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,headers=headers,method='PUT')
          with urllib.request.urlopen(put) as r: result=json.load(r)
          print('persisted_commit='+result['commit']['sha'])
          PY

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
