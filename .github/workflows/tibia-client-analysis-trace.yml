name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Locate launcher action with multi-pass OCR
    runs-on: oteryn-staging
    timeout-minutes: 8
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv

      - name: Detect and activate Install or Play control
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DISPLAY=:99
            wid=$(xdotool search --onlyvisible --name "^Tibia$" | head -n1)
            [[ -n "$wid" ]]
            import -display :99 -window "$wid" /tmp/launcher.png
            mkdir -p /tmp/ocr
            convert /tmp/launcher.png -resize 300% /tmp/ocr/orig.png
            convert /tmp/launcher.png -resize 300% -colorspace Gray -contrast-stretch 1%x1% /tmp/ocr/gray.png
            convert /tmp/launcher.png -resize 300% -colorspace Gray -threshold 55% /tmp/ocr/th55.png
            convert /tmp/launcher.png -resize 300% -colorspace Gray -negate -threshold 55% /tmp/ocr/inv55.png
            found=0
            for img in /tmp/ocr/*.png; do
              for psm in 6 11 12; do
                out=/tmp/ocr/$(basename "$img").$psm.tsv
                tesseract "$img" stdout --psm "$psm" tsv 2>/dev/null > "$out" || true
                match=$(awk -F "\t" '''NR>1 && NF>=12 {t=tolower($12); if (t ~ /^(install|play|download|update|start)$/) {print $7" "$8" "$9" "$10" "$12; exit}}''' "$out" || true)
                if [[ -n "$match" ]]; then
                  read -r x y w h text <<<"$match"
                  cx=$(( (x + w/2) / 3 )); cy=$(( (y + h/2) / 3 ))
                  echo OCR_ACTION_TEXT=$text OCR_ACTION_X=$cx OCR_ACTION_Y=$cy SOURCE=$(basename "$img") PSM=$psm
                  before=$(du -sb /data/home 2>/dev/null | awk "{print \$1}" || echo 0)
                  xdotool mousemove --window "$wid" "$cx" "$cy" click 1
                  sleep 8
                  after=$(du -sb /data/home 2>/dev/null | awk "{print \$1}" || echo 0)
                  echo HOME_BYTES_BEFORE=$before HOME_BYTES_AFTER=$after
                  found=1
                  break 2
                fi
              done
            done
            echo OCR_ACTION_FOUND=$found
            if (( found == 0 )); then
              echo OCR_CANDIDATES_BEGIN
              tesseract /tmp/ocr/gray.png stdout --psm 11 tsv 2>/dev/null | awk -F "\t" '''NR>1 && NF>=12 && $12!="" {printf "x=%d y=%d w=%d h=%d text=%s\n",$7/3,$8/3,$9/3,$10/3,$12}''' | tail -120
              echo OCR_CANDIDATES_END
              exit 1
            fi
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
