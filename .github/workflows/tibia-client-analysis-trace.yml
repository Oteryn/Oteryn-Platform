name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Trigger and verify Tibia client installation
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv

      - name: Click verified download tile and wait for runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99
          wid=$(xdotool search --onlyvisible --name '^Tibia$' | head -n1)
          [[ -n "$wid" ]]
          before=$(du -sb /data/home 2>/dev/null | awk '{print $1}' || echo 0)
          echo HOME_BYTES_BEFORE=$before
          xdotool mousemove --window "$wid" 400 193 click 1
          echo DOWNLOAD_TILE_CLICK_SENT=true
          installed=0
          for n in $(seq 1 96); do
            sleep 5
            now=$(du -sb /data/home 2>/dev/null | awk '{print $1}' || echo 0)
            qt=$(find /data -type f -name 'libQt6WebEngineQuick.so.6' -print -quit 2>/dev/null || true)
            client=$(find /data/home -type f -name client -perm -111 -print -quit 2>/dev/null || true)
            if (( n % 6 == 0 )); then
              echo WAIT_TICK=$n HOME_BYTES=$now QT_FOUND=$( [[ -n "$qt" ]] && echo true || echo false ) CLIENT_FOUND=$( [[ -n "$client" ]] && echo true || echo false )
              grep -E 'Changing local package status|Downloading|Installing|Installed|Finished downloading file for package.*Tibia' /data/runtime/launcher.log 2>/dev/null | tail -n 8 || true
            fi
            if [[ -n "$qt" ]] || [[ -n "$client" ]]; then
              installed=1
              echo INSTALLED_RUNTIME_HINT=$([[ -n "$client" ]] && echo "$client" || echo "$qt")
              break
            fi
          done
          echo INSTALL_RUNTIME_FOUND=$installed
          after=$(du -sb /data/home 2>/dev/null | awk '{print $1}' || echo 0)
          echo HOME_BYTES_AFTER=$after
          import -display :99 -window "$wid" /tmp/launcher-after.png || true
          (( installed == 1 ))
          INNER
          docker cp "$CONTAINER_NAME:/tmp/launcher-after.png" /tmp/launcher-after.png || true

      - name: Upload post-click launcher screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-launcher-after-install-click
          path: /tmp/launcher-after.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
