name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Install and launch Tibia runtime
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
      - name: Click identified launcher action
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DISPLAY=:99
            wid=$(xdotool search --onlyvisible --name "^Tibia$" | head -n1)
            [[ -n "$wid" ]]
            before=$(du -sb /data/home 2>/dev/null | awk "{print \$1}" || echo 0)
            xdotool mousemove --window "$wid" 510 405 click 1
            echo ACTION_CLICK_SENT=true
            sleep 8
            after=$(du -sb /data/home 2>/dev/null | awk "{print \$1}" || echo 0)
            echo HOME_BYTES_BEFORE=$before HOME_BYTES_AFTER=$after
          '
      - name: Wait for runtime and launch verified client
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DISPLAY=:99
            c=/data/client-15.32.df7b29/bin/client
            qt=""
            for _ in $(seq 1 72); do
              qt=$(find /data -type f -name libQt6WebEngineQuick.so.6 -print -quit 2>/dev/null || true)
              [[ -n "$qt" ]] && break
              sleep 5
            done
            [[ -n "$qt" ]]
            echo QT_RUNTIME_FOUND=true
            libdir=$(dirname "$qt"); base=$(dirname "$libdir")
            plugdir=""; qmldir=""
            for d in "$base/plugins" "$libdir/plugins"; do [[ -d "$d" ]] && { plugdir=$d; break; }; done
            for d in "$base/qml" "$libdir/qml"; do [[ -d "$d" ]] && { qmldir=$d; break; }; done
            : > /data/runtime/client-launch.log
            cd "$(dirname "$c")"
            args=(env DISPLAY=:99 LD_LIBRARY_PATH="$libdir")
            [[ -n "$plugdir" ]] && args+=(QT_PLUGIN_PATH="$plugdir")
            [[ -n "$qmldir" ]] && args+=(QML2_IMPORT_PATH="$qmldir")
            args+=("$c")
            nohup "${args[@]}" >/data/runtime/client-launch.log 2>&1 </dev/null &
            sleep 20
            count=0
            for p in /proc/[0-9]*; do
              [[ -r "$p/exe" ]] || continue
              exe=$(readlink -f "$p/exe" 2>/dev/null || true)
              [[ "$exe" == "$c" ]] && count=$((count+1))
            done
            echo CLIENT_PROCESS_COUNT=$count
            if (( count == 0 )); then
              echo SANITIZED_CLIENT_DIAGNOSTIC_BEGIN
              sed -E "/(token|password|account|session|cookie|authorization|bearer)/Id" /data/runtime/client-launch.log | tail -80
              echo SANITIZED_CLIENT_DIAGNOSTIC_END
              exit 1
            fi
            echo CLIENT_LAUNCH_FAILED=false
          '
      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
