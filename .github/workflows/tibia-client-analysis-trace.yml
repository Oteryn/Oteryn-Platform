name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Verify isolated WARP egress before Tibia auth
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv

      - name: Establish Cloudflare WARP only inside owned analysis container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo BASELINE_TRACE_BEGIN
          curl -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' || true
          echo BASELINE_TRACE_END
          if ! command -v warp-cli >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq curl gnupg lsb-release ca-certificates >/dev/null
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            codename=$(lsb_release -cs)
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $codename main" > /etc/apt/sources.list.d/cloudflare-client.list
            apt-get update -qq
            apt-get install -y -qq cloudflare-warp >/dev/null
          fi
          pkill -f '^/usr/bin/warp-svc' 2>/dev/null || true
          nohup /usr/bin/warp-svc >/data/runtime/warp-svc.log 2>&1 </dev/null &
          for n in $(seq 1 20); do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
          warp-cli --accept-tos registration new >/dev/null 2>&1 || true
          warp-cli --accept-tos mode warp+doh >/dev/null
          warp-cli --accept-tos tunnel protocol set MASQUE >/dev/null
          warp-cli --accept-tos connect >/dev/null
          ok=0
          for n in $(seq 1 30); do
            trace=$(curl -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace || true)
            if printf '%s\n' "$trace" | grep -q '^warp=on$'; then
              ok=1
              echo WARP_TRACE_BEGIN
              printf '%s\n' "$trace" | grep -E '^(ip|loc|warp)='
              echo WARP_TRACE_END
              break
            fi
            sleep 2
          done
          echo WARP_VERIFIED=$ok
          (( ok == 1 ))
          INNER

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
