name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  SNAPSHOT_IMAGE: oteryn-tibia-analysis:warp-cap-20260812
  HOST_DATA_DIR: /volume1/docker/oteryn/tibia-analysis

jobs:
  trace:
    name: Enable isolated WARP and attempt Tibia test login
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Verify exact owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc 'test -s /var/cache/apt/archives/cloudflare-warp_2026.6.880.0_amd64.deb && cp /var/cache/apt/archives/cloudflare-warp_2026.6.880.0_amd64.deb /data/cloudflare-warp.deb'

      - name: Recreate only task-owned analysis container with NET_ADMIN
        shell: bash
        run: |
          set -Eeuo pipefail
          docker commit "$CONTAINER_NAME" "$SNAPSHOT_IMAGE" >/dev/null
          docker stop "$CONTAINER_NAME" >/dev/null
          docker rm "$CONTAINER_NAME" >/dev/null
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --cap-add NET_ADMIN \
            --label com.blakinio.owner=oteryn \
            --label com.blakinio.purpose=tibia-client-analysis \
            --label com.blakinio.task=OTERYN-20260811-tibia-client-analysis \
            -v "$HOST_DATA_DIR:/data" \
            "$SNAPSHOT_IMAGE" sleep infinity >/dev/null
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          docker exec "$CONTAINER_NAME" bash -lc 'mkdir -p /dev/net; test -e /dev/net/tun || mknod /dev/net/tun c 10 200; chmod 666 /dev/net/tun; test -c /dev/net/tun'
          docker inspect --format 'capadd={{json .HostConfig.CapAdd}}' "$CONTAINER_NAME"

      - name: Extract cached WARP package and verify tunneled egress
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          rm -rf /opt/cloudflare-warp
          mkdir -p /opt/cloudflare-warp
          dpkg-deb -x /data/cloudflare-warp.deb /opt/cloudflare-warp
          cli=$(find /opt/cloudflare-warp -type f -name warp-cli -perm -111 -print -quit)
          svc=$(find /opt/cloudflare-warp -type f -name warp-svc -perm -111 -print -quit)
          [[ -n "$cli" && -n "$svc" ]]
          echo WARP_BINARIES_READY=true
          pkill -f 'warp-svc' 2>/dev/null || true
          nohup "$svc" >/data/runtime/warp-svc.log 2>&1 </dev/null &
          ready=0
          for n in $(seq 1 25); do
            if timeout 5 "$cli" --accept-tos status >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          echo WARP_CLI_READY=$ready
          (( ready == 1 ))
          timeout 10 "$cli" --accept-tos registration new >/dev/null 2>&1 || true
          timeout 10 "$cli" --accept-tos mode warp+doh >/dev/null
          timeout 10 "$cli" --accept-tos tunnel protocol set MASQUE >/dev/null || true
          timeout 10 "$cli" --accept-tos connect >/dev/null
          verified=0
          for n in $(seq 1 25); do
            trace=$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace || true)
            if printf '%s\n' "$trace" | grep -q '^warp=on$'; then
              verified=1
              echo WARP_TRACE_BEGIN
              printf '%s\n' "$trace" | grep -E '^(loc|warp)='
              echo WARP_TRACE_END
              break
            fi
            sleep 2
          done
          echo WARP_VERIFIED=$verified
          if (( verified == 0 )); then
            echo WARP_DIAGNOSTIC_BEGIN
            timeout 5 "$cli" --accept-tos status 2>&1 | sed -E '/(token|account|device|license)/Id' || true
            tail -n 80 /data/runtime/warp-svc.log 2>/dev/null | sed -E '/(token|account|device|license)/Id' || true
            echo WARP_DIAGNOSTIC_END
          fi
          (( verified == 1 ))
          INNER

      - name: Relaunch Tibia client through verified tunnel and attempt test login
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          trace=$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace)
          printf '%s\n' "$trace" | grep -q '^warp=on$'
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          [[ -x "$client" ]]
          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          sleep 2
          if ! pgrep -f "^$client" >/dev/null; then
            cd "$pkg"
            nohup "$client" >/data/runtime/installed-client-launch.log 2>&1 </dev/null &
            for n in $(seq 1 20); do pgrep -f "^$client" >/dev/null && break; sleep 1; done
          fi
          pgrep -f "^$client" >/dev/null
          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p'); height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height)); if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" && "$best_area" -ge 600000 ]]
          xdotool mousemove --window "$best" 510 302 click 1 || true
          sleep 2
          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 15
          import -display :99 -window "$best" /tmp/login-result-raw.png
          test -s /tmp/login-result-raw.png
          convert /tmp/login-result-raw.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/login-result-ocr.png
          tesseract /tmp/login-result-ocr.png stdout --psm 11 tsv 2>/dev/null > /tmp/login-result.tsv || true
          echo SAFE_LOGIN_RESULT_BEGIN
          python3 - <<'PY'
          import csv,re
          allowed=re.compile(r'^(login|account|password|email|authenticator|token|character|characters|select|enter|game|error|sorry|incorrect|invalid|connection|connecting|loading|ok|cancel|remember)$',re.I)
          with open('/tmp/login-result.tsv',newline='',errors='replace') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  t=(r.get('text') or '').strip().strip(':,.!?()[]')
                  if t and allowed.fullmatch(t): print(t)
          PY
          echo SAFE_LOGIN_RESULT_END
          cp /tmp/login-result-raw.png /tmp/login-result-safe.png
          convert /tmp/login-result-safe.png -fill '#202020' -draw 'rectangle 350,220 690,455' /tmp/login-result-safe.png
          INNER
          docker cp "$CONTAINER_NAME:/tmp/login-result-safe.png" /tmp/login-result-safe.png
          test -s /tmp/login-result-safe.png

      - name: Upload privacy-safe login result screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-login-result-safe
          path: /tmp/login-result-safe.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }} capadd={{json .HostConfig.CapAdd}}' "$CONTAINER_NAME"
