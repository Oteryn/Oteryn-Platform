name: Tibia Client Analysis Trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-client-analysis-trace.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    name: Verify isolated Tor egress and attempt Tibia test login
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv

      - name: Install and verify Tor SOCKS egress inside owned container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends tor torsocks proxychains4 curl >/dev/null
          pkill -f '^/usr/bin/tor' 2>/dev/null || true
          mkdir -p /data/runtime/tor-data
          chmod 700 /data/runtime/tor-data
          nohup tor --SocksPort 127.0.0.1:9050 --DataDirectory /data/runtime/tor-data --Log 'notice file /data/runtime/tor.log' >/dev/null 2>&1 </dev/null &
          ready=0
          for n in $(seq 1 45); do
            if curl --socks5-hostname 127.0.0.1:9050 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/tor-trace 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          echo TOR_READY=$ready
          (( ready == 1 ))
          baseline=$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          torip=$(curl --socks5-hostname 127.0.0.1:9050 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          [[ -n "$baseline" && -n "$torip" && "$baseline" != "$torip" ]]
          echo TOR_EGRESS_VERIFIED=true
          curl --socks5-hostname 127.0.0.1:9050 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|warp)='
          cat >/tmp/proxychains-tibia.conf <<'EOF'
strict_chain
proxy_dns
quiet_mode
tcp_read_time_out 15000
tcp_connect_time_out 8000
[ProxyList]
socks5 127.0.0.1 9050
EOF
          INNER

      - name: Relaunch Tibia through Tor and attempt test login
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          [[ -x "$client" ]]
          torip=$(curl --socks5-hostname 127.0.0.1:9050 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          baseip=$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          [[ -n "$torip" && "$torip" != "$baseip" ]]
          pkill -f "$client" 2>/dev/null || true
          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          sleep 2
          cd "$pkg"
          nohup proxychains4 -f /tmp/proxychains-tibia.conf "$client" >/data/runtime/client-tor.log 2>&1 </dev/null &
          for n in $(seq 1 30); do pgrep -f 'packages/Tibia/bin/client' >/dev/null && break; sleep 1; done
          pgrep -f 'packages/Tibia/bin/client' >/dev/null
          sleep 8
          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p'); height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height)); if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" && "$best_area" -ge 600000 ]]
          # Open Login on welcome screen, then use the already-proven 1020x650 form geometry.
          xdotool mousemove --window "$best" 510 302 click 1 || true
          sleep 2
          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 20
          import -display :99 -window "$best" /tmp/login-result-raw.png
          test -s /tmp/login-result-raw.png
          convert /tmp/login-result-raw.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/login-result-ocr.png
          tesseract /tmp/login-result-ocr.png stdout --psm 11 tsv 2>/dev/null > /tmp/login-result.tsv || true
          echo SAFE_LOGIN_RESULT_BEGIN
          python3 - <<'PY'
          import csv,re
          allowed=re.compile(r'^(login|account|password|email|authenticator|token|character|characters|select|enter|game|error|sorry|incorrect|invalid|connection|connecting|loading|ok|cancel|remember|offline|online)$',re.I)
          with open('/tmp/login-result.tsv',newline='',errors='replace') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  t=(r.get('text') or '').strip().strip(':,.!?()[]')
                  if t and allowed.fullmatch(t): print(t)
          PY
          echo SAFE_LOGIN_RESULT_END
          cp /tmp/login-result-raw.png /tmp/login-result-safe.png
          convert /tmp/login-result-safe.png -fill '#202020' -draw 'rectangle 330,190 710,480' /tmp/login-result-safe.png
          INNER
          docker cp "$CONTAINER_NAME:/tmp/login-result-safe.png" /tmp/login-result-safe.png
          test -s /tmp/login-result-safe.png

      - name: Upload privacy-safe login result screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-login-result-safe
          path: /tmp/login-result-safe.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
