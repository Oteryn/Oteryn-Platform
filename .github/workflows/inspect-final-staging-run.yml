name: Validate Compact Final Handoff

on:
  pull_request:
    paths:
      - .github/workflows/inspect-final-staging-run.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout merged repository state
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate active checkpoint
        run: |
          set -euo pipefail
          python tools/agents/checkpoint.py \
            docs/agents/tasks/active/OTERYN-20260726-public-web-final-staging-closure.md \
            --require-checkpoint

      - name: Generate compact continuation prompt
        run: |
          set -euo pipefail
          python tools/agents/resume.py \
            --task docs/agents/tasks/active/OTERYN-20260726-public-web-final-staging-closure.md \
            > resume.txt

      - name: Upload compact handoff
        uses: actions/upload-artifact@v4
        with:
          name: compact-final-handoff
          path: resume.txt
          if-no-files-found: error
          retention-days: 1
