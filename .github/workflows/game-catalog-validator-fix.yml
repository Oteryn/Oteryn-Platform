name: Compact Task Handoff

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-validator-fix.yml'
      - 'docs/agents/tasks/active/OTERYN-20260730-game-catalog-schema-1-3-consumer.md'

permissions:
  contents: read

jobs:
  validate-and-resume:
    if: github.repository == 'blakinio/Oteryn-Platform' && github.head_ref == 'feat/OTERYN-20260730-game-catalog-schema-1-3-consumer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate active task checkpoint
        run: python tools/agents/checkpoint.py docs/agents/tasks/active/OTERYN-20260730-game-catalog-schema-1-3-consumer.md --require-checkpoint
      - name: Generate compact resume prompt
        run: python tools/agents/resume.py --task docs/agents/tasks/active/OTERYN-20260730-game-catalog-schema-1-3-consumer.md
