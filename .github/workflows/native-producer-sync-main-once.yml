name: Native Producer Sync Main Once

on:
  push:
    branches:
      - feat/OTERYN-20260804-native-protocol-producer

permissions:
  contents: write

concurrency:
  group: native-producer-sync-main-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260804-native-protocol-producer
          fetch-depth: 0

      - name: Merge current main and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/native-producer-sync-main-once.yml
          git commit -m "ci(task): remove main synchronization workflow"
          git push origin HEAD:feat/OTERYN-20260804-native-protocol-producer
