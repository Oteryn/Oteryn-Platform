name: Update MFA QR Dependency

on:
  push:
    branches:
      - chore/OTERYN-20260726-public-web-programme-final-cleanup
    paths:
      - .github/workflows/update-mfa-qr-dependency.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/OTERYN-20260726-public-web-programme-final-cleanup
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Add locally rendered QR dependency
        run: |
          set -euo pipefail
          composer require endroid/qr-code:^6.0 --no-interaction --no-progress
          composer validate --strict
      - name: Commit lockfile update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            echo 'Composer files already contain the requested dependency.'
            exit 0
          fi
          git commit -m 'build(deps): add local SVG QR generation'
          git push origin HEAD:chore/OTERYN-20260726-public-web-programme-final-cleanup
