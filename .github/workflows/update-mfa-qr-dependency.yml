name: Update MFA QR Dependency

on:
  pull_request:
    paths:
      - .github/workflows/update-mfa-qr-dependency.yml

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Add locally rendered QR dependency
        run: |
          set -euo pipefail
          composer require endroid/qr-code:^6.0 --no-interaction --no-progress
          composer validate --strict
      - name: Upload generated Composer files
        uses: actions/upload-artifact@v4
        with:
          name: mfa-qr-composer-files-${{ github.sha }}
          path: |
            composer.json
            composer.lock
          if-no-files-found: error
          retention-days: 1
