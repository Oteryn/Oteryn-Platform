name: Tibia Client Analysis Diagnostic

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-diagnostic.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  diagnose:
    name: Classify Tibia account warning without private text
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Read only generic warning vocabulary from retained Select Character OCR
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" python3 - <<'PY'
          import csv
          from pathlib import Path

          candidates=[
              Path('/tmp/select.tsv'),
              Path('/tmp/network-delta-select.tsv'),
              Path('/tmp/doubleclick-select.tsv'),
          ]
          source=next((p for p in candidates if p.exists()),None)
          if source is None:
              raise SystemExit('No retained Select Character OCR TSV')

          allowed={
              'you','your','need','needs','to','have','has','must','confirm','confirmed','confirmation',
              'verify','verified','verification','account','email','e-mail','play','playing','login','log','in',
              'this','character','manage','activate','activated','activation','secure','security','authenticator',
              'premium','free','registered','register','registration','before','can','cannot','could','not','yet',
              'please','visit','website','create','change','password','new','old','connect','connected','connection',
              'protect','protected','protection','required','requires','use','using','with','a','an','the','and','or',
              'only','all','regular','features','feature','status','locked','unlock','unlocked','world','game'
          }
          found=[]; unknown_count=0
          with source.open(newline='',errors='replace') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  raw=(r.get('text') or '').strip()
                  token=raw.lower().strip(':,.!?()[]')
                  try:
                      conf=float(r.get('conf') or -1)
                      left=int(r.get('left') or 0)//2
                      top=int(r.get('top') or 0)//2
                      width=max(1,int(r.get('width') or 0)//2)
                      height=max(1,int(r.get('height') or 0)//2)
                  except ValueError:
                      continue
                  if conf < 20:
                      continue
                  x=left+width//2; y=top+height//2
                  # The generic orange account warning is the line above the Character column header.
                  if not (145 <= x <= 870 and 137 <= y <= 158):
                      continue
                  if token in allowed:
                      found.append((left,token))
                  else:
                      unknown_count += 1
          found.sort()
          print('WARNING_ALLOWED_TOKENS=' + ' '.join(t for _,t in found))
          print(f'WARNING_UNKNOWN_TOKEN_COUNT={unknown_count}')
          tokens={t for _,t in found}
          checks={
              'CONFIRMATION_RELATED': bool(tokens & {'confirm','confirmed','confirmation','verify','verified','verification','activate','activated','activation'}),
              'AUTHENTICATOR_RELATED': 'authenticator' in tokens,
              'ACCOUNT_RELATED': 'account' in tokens,
              'CHARACTER_RELATED': 'character' in tokens,
              'MANAGE_ACCOUNT_RELATED': 'manage' in tokens and 'account' in tokens,
              'PLAY_RELATED': bool(tokens & {'play','playing','game','world'}),
              'SECURITY_RELATED': bool(tokens & {'secure','security','protect','protected','protection'}),
              'REQUIRED_RELATED': bool(tokens & {'need','needs','must','required','requires','cannot'}),
          }
          for k,v in checks.items():
              print(f'WARNING_{k}={str(v).lower()}')
          PY

      - name: Verify WARP and canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc "curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|warp)='"
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
