name: Tibia Client Analysis Diagnostic

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-diagnostic.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  diagnose:
    name: Classify failed Tibia world entry without secrets
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Classify client failures and retained UI state
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" python3 - <<'PY'
          import csv,hashlib,re
          from pathlib import Path

          log=Path('/data/runtime/client-userspace-warp.log')
          lines=log.read_text(errors='replace').splitlines()[-200:] if log.exists() else []
          failed=[line for line in lines if 'failed' in line.lower()]
          categories=[
              'audio','alsa','pulse','dbus','xcb','x11','opengl','egl','vulkan','shader','renderer','graphics','font',
              'proxy','socket','network','tcp','tls','ssl','certificate','http','connection','connect','dns','host',
              'qt','filesystem','file','permission','config','resource','locale','gpu','display'
          ]
          print(f'FAILED_LINE_COUNT={len(failed)}')
          for i,line in enumerate(failed,1):
              lo=line.lower()
              found=sorted({c for c in categories if c in lo})
              digest=hashlib.sha256(line.encode(errors='replace')).hexdigest()[:12]
              print(f'FAILED_LINE_{i}_CATEGORIES=' + (','.join(found) if found else 'none'))
              print(f'FAILED_LINE_{i}_SHA256_PREFIX={digest}')

          cfg=Path('/tmp/proxychains-tibia.conf')
          text=cfg.read_text(errors='replace') if cfg.exists() else ''
          enabled=[]
          for directive in ['strict_chain','dynamic_chain','random_chain','proxy_dns','proxy_dns_old','proxy_dns_daemon','quiet_mode']:
              if re.search(rf'(?m)^\s*{re.escape(directive)}\b',text):
                  enabled.append(directive)
          print('PROXYCHAINS_DIRECTIVES=' + ','.join(enabled))
          proxy_lines=[]
          in_list=False
          for raw in text.splitlines():
              s=raw.strip()
              if s.lower()=='[proxylist]':
                  in_list=True
                  continue
              if not in_list or not s or s.startswith('#'):
                  continue
              parts=s.split()
              if len(parts)>=3:
                  typ,host,port=parts[:3]
                  proxy_lines.append((typ,host,port))
          print(f'PROXY_LIST_ENTRY_COUNT={len(proxy_lines)}')
          for i,(typ,host,port) in enumerate(proxy_lines,1):
              print(f'PROXY_LIST_{i}_TYPE={typ}')
              print(f'PROXY_LIST_{i}_LOCAL={str(host in {"127.0.0.1","::1","localhost"}).lower()}')
              print(f'PROXY_LIST_{i}_PORT={port if port.isdigit() else "non_numeric"}')

          # Inspect only allow-listed UI words from the retained Select Character TSV.
          # Never emit arbitrary OCR text, character names, account data, or secrets.
          tsv=Path('/tmp/select.tsv')
          safe_tokens={'select','character','status','ok','cancel','online','offline','account','login','logout','play','enter','game','manage'}
          if tsv.exists():
              with tsv.open(newline='',errors='replace') as f:
                  for r in csv.DictReader(f,delimiter='\t'):
                      token=(r.get('text') or '').strip().lower().strip(':,.!?()[]')
                      if token not in safe_tokens:
                          continue
                      try:
                          conf=float(r.get('conf') or -1)
                          left=int(r.get('left') or 0)//2
                          top=int(r.get('top') or 0)//2
                          width=max(1,int(r.get('width') or 0)//2)
                          height=max(1,int(r.get('height') or 0)//2)
                      except ValueError:
                          continue
                      if conf >= 20:
                          print(f'SAFE_UI_TOKEN={token};x={left+width//2};y={top+height//2};conf={int(conf)}')
          else:
              print('SAFE_UI_TSV_PRESENT=false')

          def classify(label,path):
              p=Path(path)
              if not p.exists():
                  print(f'{label}_OCR_PRESENT=false')
                  return
              raw=p.read_text(errors='replace').lower()
              norm=' '.join(''.join(ch if ch.isalnum() else ' ' for ch in raw).split())
              print(f'{label}_OCR_PRESENT=true')
              checks={
                  'ACCOUNT_LOGIN': ('account' in norm and 'login' in norm),
                  'EMAIL_PASSWORD': ('email' in norm and 'password' in norm),
                  'SELECT_CHARACTER': ('select' in norm and 'character' in norm),
                  'ONLINE': 'online' in norm,
                  'ALREADY': 'already' in norm,
                  'LOGGED': 'logged' in norm,
                  'CONNECTION_FAILED': ('connection' in norm and 'failed' in norm),
                  'QUEUE': 'queue' in norm,
                  'MAINTENANCE': 'maintenance' in norm,
              }
              for key,val in checks.items():
                  print(f'{label}_{key}={str(val).lower()}')
              print(f'{label}_LIKELY_ALREADY_LOGGED_IN={str(checks["ALREADY"] and (checks["LOGGED"] or checks["ONLINE"])).lower()}')
          classify('EARLY','/tmp/post-entry-early.txt')
          classify('FINAL','/tmp/post-entry.txt')
          PY

      - name: Verify live WARP and canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc "curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|warp)='"
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
