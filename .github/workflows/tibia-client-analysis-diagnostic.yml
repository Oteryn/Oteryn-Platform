name: Tibia Client Analysis Diagnostic

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-diagnostic.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  diagnose:
    name: Diagnose failed Tibia world entry without secrets
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Summarize transport and current GUI state safely
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E '^(loc|warp)='
          pid=$(pgrep -f 'packages/Tibia/bin/client' | head -n1)
          [[ -n "$pid" ]]
          echo CLIENT_PROCESS_ALIVE=true
          sockets=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          direct=$(printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          local_socks=$(printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ec '^(127\.0\.0\.1|\[::1\]):25344$' || true)
          echo CLIENT_DIRECT_REMOTE_TCP_COUNT=$direct
          echo CLIENT_LOCAL_SOCKS_TCP_COUNT=$local_socks

          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('/data/runtime/client-userspace-warp.log')
          if not p.exists():
              print('PROXY_LOG_PRESENT=false')
              raise SystemExit(0)
          lines=p.read_text(errors='replace').splitlines()[-600:]
          proxy=[line for line in lines if 'proxychains' in line.lower()]
          cats={k:0 for k in ['ok','timeout','refused','denied','failed','error']}
          ports=set()
          for line in proxy:
              lo=line.lower()
              for k in cats:
                  if k in lo:
                      cats[k]+=1
              for m in re.finditer(r':([0-9]{1,5})(?=\D|$)', line):
                  n=int(m.group(1))
                  if 1 <= n <= 65535:
                      ports.add(n)
          generic={k:0 for k in ['connect','disconnect','timeout','refused','failed','error']}
          for line in lines:
              lo=line.lower()
              for k in generic:
                  if k in lo:
                      generic[k]+=1
          print('PROXY_LOG_PRESENT=true')
          print(f'PROXY_LOG_TAIL_LINES={len(lines)}')
          print(f'PROXYCHAINS_LINES={len(proxy)}')
          print('PROXY_DEST_PORTS=' + ','.join(map(str,sorted(ports))))
          print('PROXY_STATUS_COUNTS=' + ','.join(f'{k}:{v}' for k,v in cats.items()))
          print('CLIENT_LOG_KEYWORD_COUNTS=' + ','.join(f'{k}:{v}' for k,v in generic.items()))
          PY

          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p'); height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height)); if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" ]]
          import -display :99 -window "$best" /tmp/diagnostic-current.png
          convert /tmp/diagnostic-current.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/diagnostic-current-ocr.png
          tesseract /tmp/diagnostic-current-ocr.png stdout --psm 11 2>/dev/null >/tmp/diagnostic-current.txt || true
          python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/diagnostic-current.txt').read_text(errors='replace').lower()
          states={
            'ACCOUNT_LOGIN_VISIBLE': ('account login' in t or ('email' in t and 'password' in t)),
            'SELECT_CHARACTER_VISIBLE': ('select character' in t),
            'CONNECTING_VISIBLE': ('connecting' in t),
            'CONNECTION_ERROR_VISIBLE': ('connection' in t and ('error' in t or 'failed' in t or 'lost' in t)),
          }
          for k,v in states.items():
              print(f'{k}={str(v).lower()}')
          PY
          INNER

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
