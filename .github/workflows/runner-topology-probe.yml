name: Runner Topology Probe

on:
  push:
    branches:
      - audit/issue-1194-runner-topology-evidence
    paths:
      - .github/workflows/runner-topology-probe.yml

permissions:
  contents: read

concurrency:
  group: runner-topology-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'Oteryn/Oteryn-Platform' && github.ref == 'refs/heads/audit/issue-1194-runner-topology-evidence'
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Collect sanitized live runner topology
        shell: bash
        run: |
          set -Eeuo pipefail

          docker version >/dev/null
          docker compose version >/dev/null
          python3 --version >/dev/null

          mapfile -t matches < <(
            docker ps -q \
              --filter 'label=com.docker.compose.project=oteryn-deploy-runner' \
              --filter 'label=com.docker.compose.service=runner'
          )
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "Expected exactly one oteryn-deploy-runner/runner container; found ${#matches[@]}" >&2
            exit 1
          fi
          runner_id="${matches[0]}"

          echo "RUNNER_CONTEXT_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_CONTEXT_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_CONTEXT_ARCH=${RUNNER_ARCH:-unknown}"
          echo "RUNNER_CONTAINER_NAME=$(docker inspect --format '{{.Name}}' "$runner_id" | sed 's#^/##')"
          echo "RUNNER_CONTAINER_USER=$(docker inspect --format '{{.Config.User}}' "$runner_id")"
          echo "RUNNER_CONTAINER_STATE=$(docker inspect --format '{{.State.Status}}' "$runner_id")"
          echo "RUNNER_RESTART_POLICY=$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$runner_id")"
          echo "RUNNER_IMAGE_REF=$(docker inspect --format '{{.Config.Image}}' "$runner_id")"
          echo "RUNNER_IMAGE_ID=$(docker inspect --format '{{.Image}}' "$runner_id")"
          echo "RUNNER_LISTENER_VERSION=$(docker exec "$runner_id" /runner/bin/Runner.Listener --version | tr -d '\r')"
          echo "DOCKER_CLIENT_VERSION=$(docker version --format '{{.Client.Version}}')"
          echo "DOCKER_SERVER_VERSION=$(docker version --format '{{.Server.Version}}')"
          echo "DOCKER_COMPOSE_VERSION=$(docker compose version --short)"

          docker inspect --format '{{range .Mounts}}{{println .Destination "|" .Type "|rw=" .RW}}{{end}}' "$runner_id" \
            | sort \
            | sed 's/^/RUNNER_MOUNT=/'

          docker exec "$runner_id" stat -c 'RUNNER_METADATA_MODE=%a owner=%u:%g' /runner/.runner
          docker exec "$runner_id" cat /runner/.runner | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          allowed = ("agentName", "poolId", "poolName", "gitHubUrl", "workFolder")
          for key in allowed:
              value = data.get(key, "MISSING")
              print(f"RUNNER_METADATA_{key.upper()}={value}")
          '

          test "$(docker inspect --format '{{.State.Running}}' "$runner_id")" = true
          echo 'PROBE_RESULT=PASS'
