name: Build Synology Staging Images

on:
  pull_request:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - resources/**
      - routes/**
      - lang/**
      - storage/**
      - services/game-gateway/**
      - deploy/synology/**
      - scripts/ci/classify_synology_builds.py
      - tests/ci/test_synology_rollback_contract.py
      - tests/ci/test_synology_deploy_release_identity.py
      - tests/ci/test_synology_auto_staging_deploy.py
      - .github/workflows/build-synology-staging-images.yml
      - .github/workflows/deploy-synology-staging.yml
  push:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - resources/**
      - routes/**
      - lang/**
      - storage/**
      - services/game-gateway/**
      - deploy/synology/**
      - scripts/ci/classify_synology_builds.py
      - .github/workflows/build-synology-staging-images.yml
      - .github/workflows/deploy-synology-staging.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: synology-staging-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Synology image inputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      release_relevant: ${{ steps.classify.outputs.release_relevant }}
      platform_changed: ${{ steps.classify.outputs.platform_changed }}
      gateway_changed: ${{ steps.classify.outputs.gateway_changed }}
      runner_changed: ${{ steps.classify.outputs.runner_changed }}
      deployment_changed: ${{ steps.classify.outputs.deployment_changed }}
      control_plane: ${{ steps.classify.outputs.control_plane }}
    steps:
      - name: Checkout exact classification range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate classifier syntax
        run: python3 -m py_compile scripts/ci/classify_synology_builds.py

      - name: Classify component build requirements
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/classify_synology_builds.py \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  validate-deployment:
    name: Validate Synology deployment package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n \
            deploy/synology/scripts/lib.sh \
            deploy/synology/scripts/deploy.sh \
            deploy/synology/scripts/health-check.sh \
            deploy/synology/scripts/recover-schema.sh \
            deploy/synology/scripts/release-state.sh \
            deploy/synology/scripts/repository-ghcr-image.sh \
            deploy/synology/scripts/rollback.sh \
            deploy/synology/runner/entrypoint.sh
          sh -n \
            deploy/synology/tls/init.sh \
            deploy/synology/mariadb/init/10-platform-database.sh

      - name: Validate Synology contracts
        run: |
          set -euo pipefail
          python3 tests/ci/test_synology_rollback_contract.py
          python3 tests/ci/test_synology_deploy_release_identity.py
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Validate Compose manifests and LAN isolation
        run: |
          set -euo pipefail
          env_file=/tmp/oteryn-synology.env
          default_json=/tmp/oteryn-runtime-default.json
          lan_json=/tmp/oteryn-runtime-lan.json
          project="oteryn-boundary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp deploy/synology/.env.example "$env_file"
          sed -E -i 's/=(REQUIRED_[A-Z0-9_]+)$/=localplaceholder/' "$env_file"

          runtime_compose=(
            docker compose
            -p "$project"
            --env-file "$env_file"
            -f deploy/synology/compose.yml
          )
          cleanup() {
            "${runtime_compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f "$env_file" "$default_json" "$lan_json"
          }
          trap cleanup EXIT

          render_compose() {
            local output="$1"
            "${runtime_compose[@]}" config --quiet
            "${runtime_compose[@]}" config --format json > "$output"
          }

          render_compose "$default_json"
          python3 - "$default_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())

          def bindings(service):
              result = {}
              for port in data['services'][service].get('ports', []) or []:
                  result[str(port['target'])] = (
                      str(port.get('host_ip', '')),
                      str(port['published']),
                  )
              return result

          expected = {
              'platform': {'8000': ('127.0.0.1', '8000')},
              'gateway': {'8080': ('127.0.0.1', '8080')},
              'canary': {
                  '7171': ('127.0.0.1', '7171'),
                  '7172': ('127.0.0.1', '7172'),
              },
          }
          for service, service_expected in expected.items():
              actual = bindings(service)
              if actual != service_expected:
                  raise SystemExit(f'default bindings for {service} are {actual}, expected {service_expected}')

          bind_mounts = []
          for service_name, service in data.get('services', {}).items():
              for mount in service.get('volumes', []) or []:
                  if mount.get('type') == 'bind':
                      bind_mounts.append((service_name, mount.get('source'), mount.get('target')))
          if bind_mounts:
              raise SystemExit(f'runtime Compose must not depend on runner checkout bind mounts: {bind_mounts}')
          PY

          sed -i 's/^CANARY_GAME_BIND_ADDRESS=.*/CANARY_GAME_BIND_ADDRESS=192.168.50.10/' "$env_file"
          sed -i 's/^CANARY_SERVER_IP=.*/CANARY_SERVER_IP=192.168.50.10/' "$env_file"
          sed -i 's/^GAME_WORLD_HOST=.*/GAME_WORLD_HOST=192.168.50.10/' "$env_file"
          render_compose "$lan_json"
          python3 - "$lan_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())

          def bindings(service):
              result = {}
              for port in data['services'][service].get('ports', []) or []:
                  result[str(port['target'])] = (
                      str(port.get('host_ip', '')),
                      str(port['published']),
                  )
              return result

          expected = {
              'platform': {'8000': ('127.0.0.1', '8000')},
              'gateway': {'8080': ('127.0.0.1', '8080')},
              'canary': {
                  '7171': ('127.0.0.1', '7171'),
                  '7172': ('192.168.50.10', '7172'),
              },
          }
          for service, service_expected in expected.items():
              actual = bindings(service)
              if actual != service_expected:
                  raise SystemExit(f'LAN bindings for {service} are {actual}, expected {service_expected}')

          canary_environment = data['services']['canary']['environment']
          if str(canary_environment['CANARY_SERVER_IP']) != '192.168.50.10':
              raise SystemExit('Canary advertised server IP does not match the LAN game bind')
          if str(canary_environment['CANARY_GAME_SESSION_ISSUER_WORLD_ID']) != '1':
              raise SystemExit('Canary issuer world ID does not match the staging World Registry ID')
          PY

          "${runtime_compose[@]}" pull tls-init
          "${runtime_compose[@]}" create tls-init
          tls_container="$("${runtime_compose[@]}" ps -a -q tls-init)"
          test -n "$tls_container"
          docker cp deploy/synology/tls/init.sh "$tls_container:/bootstrap/tls-init.sh"
          docker cp deploy/synology/nginx/internal.conf "$tls_container:/bootstrap/internal-nginx.conf"
          bootstrap_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/bootstrap"}}{{.Name}}{{end}}{{end}}' "$tls_container")"
          test -n "$bootstrap_volume"
          docker run --rm \
            -v "$bootstrap_volume:/bootstrap:ro" \
            alpine:3.22 \
            /bin/sh -ec 'test -s /bootstrap/tls-init.sh && test -s /bootstrap/internal-nginx.conf'

          grep -q -- '--network "container:' deploy/synology/scripts/health-check.sh
          grep -q 'assert_binding platform' deploy/synology/scripts/health-check.sh
          grep -q 'assert_binding gateway' deploy/synology/scripts/health-check.sh
          grep -q 'assert_binding canary' deploy/synology/scripts/health-check.sh

          docker compose \
            --env-file deploy/synology/runner/.env.example \
            -f deploy/synology/runner/compose.yml \
            config --quiet

  build:
    name: ${{ matrix.mode == 'noop' && 'No Synology image build required' || format('{0} {1} image', matrix.mode, matrix.name) }}
    needs:
      - classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}

    steps:
      - name: No image build required
        if: ${{ matrix.mode == 'noop' }}
        run: echo "No runtime image inputs changed for this pull request."

      - name: Checkout exact source
        if: ${{ matrix.mode != 'noop' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        if: ${{ matrix.mode != 'noop' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve current repository GHCR image
        if: ${{ matrix.mode != 'noop' }}
        id: image
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          image="$(bash deploy/synology/scripts/repository-ghcr-image.sh "$PACKAGE_NAME")"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Resolve release identity and image tags
        if: ${{ matrix.mode != 'noop' }}
        id: identity
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_SHA: ${{ matrix.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          tags="${IMAGE}:sha-${RELEASE_SHA}"
          if [[ "$EVENT_NAME" != pull_request ]]; then
            tags+=$'\n'"${IMAGE}:source-${SOURCE_SHA}"
          fi
          if [[ "$GIT_REF" == refs/heads/main ]]; then
            tags+=$'\n'"${IMAGE}:main"
          fi

          {
            echo "release_sha=$RELEASE_SHA"
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ matrix.mode != 'noop' && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable reusable component image
        if: ${{ matrix.mode == 'reuse' }}
        id: reuse
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          set -euo pipefail
          source_tag="${IMAGE}:source-${SOURCE_SHA}"
          if ! docker pull "$source_tag" >/dev/null 2>&1; then
            echo "Reusable source tag $source_tag is unavailable; falling back to a full build."
            echo "reusable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_revision="$(docker image inspect --format '{{ index .Config.Labels "io.oteryn.component.source-revision" }}' "$source_tag" 2>/dev/null || true)"
          if [[ -z "$source_revision" || "$source_revision" == '<no value>' ]]; then
            source_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$source_tag" 2>/dev/null || true)"
          fi
          if [[ "$source_revision" != "$SOURCE_SHA" ]]; then
            echo "Reusable component provenance mismatch: expected $SOURCE_SHA, found ${source_revision:-UNKNOWN}." >&2
            exit 1
          fi

          base_ref=""
          while IFS= read -r candidate; do
            [[ "$candidate" == "${IMAGE}@sha256:"* ]] || continue
            digest="${candidate#*@sha256:}"
            if [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              base_ref="$candidate"
              break
            fi
          done < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$source_tag")

          if [[ -z "$base_ref" ]]; then
            echo "Reusable source tag does not resolve to an immutable repository digest." >&2
            exit 1
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "reusable=true" >> "$GITHUB_OUTPUT"
          echo "Reusing immutable component source $base_ref for source SHA $SOURCE_SHA."

      - name: Build and publish metadata-only reused release image
        if: ${{ matrix.mode == 'reuse' && steps.reuse.outputs.reusable == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/synology/docker/reuse-release.Dockerfile
          push: true
          tags: ${{ steps.identity.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.release_sha }}
            io.oteryn.component.source-revision=${{ matrix.source_sha }}
            io.oteryn.component.reused=true
          build-args: |
            BASE_IMAGE=${{ steps.reuse.outputs.base_ref }}
            RELEASE_SHA=${{ steps.identity.outputs.release_sha }}
            COMPONENT_SOURCE_SHA=${{ matrix.source_sha }}

      - name: Build changed component or safe fallback
        if: ${{ matrix.mode == 'full' || (matrix.mode == 'reuse' && steps.reuse.outputs.reusable != 'true') }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.identity.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.release_sha }}
            io.oteryn.component.source-revision=${{ matrix.source_sha }}
            io.oteryn.component.reused=false
          cache-from: type=gha,scope=synology-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=synology-${{ matrix.name }}

      - name: Validate locally loaded pull-request image
        if: ${{ github.event_name == 'pull_request' && matrix.mode != 'noop' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}:sha-${{ steps.identity.outputs.release_sha }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_REF" >/dev/null
          case "$IMAGE_NAME" in
            platform)
              docker run --rm --entrypoint php "$IMAGE_REF" -v
              ;;
            game-gateway)
              docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec 'test -x /usr/local/bin/game-gateway'
              ;;
            deploy-runner)
              docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -ec 'docker --version && docker compose version && test -x /usr/local/bin/oteryn-runner-entrypoint'
              ;;
          esac

  deploy-staging:
    name: Dispatch exact main SHA to Synology staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.release_relevant == 'true' }}
    needs:
      - classify
      - validate-deployment
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch guarded exact-SHA Synology staging deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY_IMAGE_DIGEST: ghcr.io/blakinio/canary@sha256:784e5dbdcc64e311c48c51cd94aa206e2efa1e5eefb2f4ef40170d5aac55031f
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded main deployment: current main is $current_main, build SHA is $GITHUB_SHA."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-synology-staging.yml/dispatches" \
            -f ref=main \
            -f 'inputs[action]=deploy' \
            -f "inputs[release_sha]=${GITHUB_SHA}" \
            -f "inputs[canary_image]=${CANARY_IMAGE_DIGEST}" \
            -f 'inputs[canary_game_bind_address]=192.168.1.2' \
            -f 'inputs[game_world_id]=1' \
            -f 'inputs[game_world_slug]=oteryn-staging' \
            -f 'inputs[game_world_name]=Oteryn Staging' \
            -f 'inputs[game_world_region]=LAN'

          echo "Synology staging deployment accepted for exact main SHA ${GITHUB_SHA}."
          echo "Deployment continues independently in Deploy Synology Staging; image-build completion is not coupled to remote staging duration."
