name: Build Synology Staging Images

on:
  pull_request:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - resources/**
      - routes/**
      - lang/**
      - storage/**
      - docs/testing/WIKI_EXPECTED_CONTENT_INVENTORY.json
      - docs/architecture/adr/0004-authoritative-platform-account-ownership.md
      - docs/architecture/adr/0005-character-creation-product-policy.md
      - docs/contracts/AUTH_GAME_LOGIN_CONTRACT.md
      - docs/contracts/OTCLIENT_GAME_AUTH_CONTRACT.md
      - docs/agents/PROJECT_STATE.md
      - docs/architecture/PUBLIC_WEBSITE_EXPANSION_PLAN.md
      - docs/architecture/SECURITY_ARCHITECTURE.md
      - docs/architecture/adr/0013-wiki-administration.md
      - services/game-gateway/go.mod
      - services/game-gateway/cmd/**
      - services/game-gateway/internal/**
      - deploy/synology/.env.example
      - deploy/synology/compose.yml
      - deploy/synology/compose.marketplace.yml
      - deploy/synology/release-contract.env
      - deploy/synology/docker/platform.Dockerfile
      - deploy/synology/docker/platform.Dockerfile.dockerignore
      - deploy/synology/docker/platform-entrypoint.sh
      - deploy/synology/docker/platform-media.ini
      - deploy/synology/docker/gateway.Dockerfile
      - deploy/synology/docker/gateway.Dockerfile.dockerignore
      - deploy/synology/mariadb/init/**
      - deploy/synology/nginx/**
      - deploy/synology/tls/**
      - deploy/synology/runner/Dockerfile
      - deploy/synology/runner/Dockerfile.dockerignore
      - deploy/synology/runner/entrypoint.sh
      - deploy/synology/runner/test-entrypoint.sh
      - deploy/synology/runner/.env.example
      - deploy/synology/runner/compose.yml
      - deploy/synology/scripts/deploy.sh
      - deploy/synology/scripts/health-check.sh
      - deploy/synology/scripts/lib.sh
      - deploy/synology/scripts/marketplace-staging.sh
      - deploy/synology/scripts/prepare-fresh-schema-baseline.sh
      - deploy/synology/scripts/recover-schema.sh
      - deploy/synology/scripts/release-state.sh
      - deploy/synology/scripts/repository-ghcr-image.sh
      - deploy/synology/scripts/rollback.sh
      - deploy/synology/scripts/upgrade-legacy-release-state.sh
      - deploy/synology/scripts/validate-ipv4.sh
      - deploy/synology/tests/**
      - scripts/ci/classify_synology_builds.py
      - tests/ci/test_synology_rollback_contract.py
      - tests/ci/test_synology_rollback_recovery_contract.py
      - tests/ci/test_synology_deploy_release_identity.py
      - tests/ci/test_synology_auto_staging_deploy.py
      - tests/ci/test_synology_gateway_build_inputs.py
      - tests/ci/test_synology_deployment_package_routing.py
      - .github/workflows/build-synology-staging-images.yml
      - .github/workflows/deploy-synology-staging.yml
  push:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - artisan
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - resources/**
      - routes/**
      - lang/**
      - storage/**
      - docs/testing/WIKI_EXPECTED_CONTENT_INVENTORY.json
      - docs/architecture/adr/0004-authoritative-platform-account-ownership.md
      - docs/architecture/adr/0005-character-creation-product-policy.md
      - docs/contracts/AUTH_GAME_LOGIN_CONTRACT.md
      - docs/contracts/OTCLIENT_GAME_AUTH_CONTRACT.md
      - docs/agents/PROJECT_STATE.md
      - docs/architecture/PUBLIC_WEBSITE_EXPANSION_PLAN.md
      - docs/architecture/SECURITY_ARCHITECTURE.md
      - docs/architecture/adr/0013-wiki-administration.md
      - services/game-gateway/go.mod
      - services/game-gateway/cmd/**
      - services/game-gateway/internal/**
      - deploy/synology/.env.example
      - deploy/synology/compose.yml
      - deploy/synology/compose.marketplace.yml
      - deploy/synology/release-contract.env
      - deploy/synology/docker/platform.Dockerfile
      - deploy/synology/docker/platform.Dockerfile.dockerignore
      - deploy/synology/docker/platform-entrypoint.sh
      - deploy/synology/docker/platform-media.ini
      - deploy/synology/docker/gateway.Dockerfile
      - deploy/synology/docker/gateway.Dockerfile.dockerignore
      - deploy/synology/mariadb/init/**
      - deploy/synology/nginx/**
      - deploy/synology/tls/**
      - deploy/synology/runner/Dockerfile
      - deploy/synology/runner/Dockerfile.dockerignore
      - deploy/synology/runner/entrypoint.sh
      - deploy/synology/runner/test-entrypoint.sh
      - deploy/synology/runner/.env.example
      - deploy/synology/runner/compose.yml
      - deploy/synology/scripts/deploy.sh
      - deploy/synology/scripts/health-check.sh
      - deploy/synology/scripts/lib.sh
      - deploy/synology/scripts/marketplace-staging.sh
      - deploy/synology/scripts/prepare-fresh-schema-baseline.sh
      - deploy/synology/scripts/recover-schema.sh
      - deploy/synology/scripts/release-state.sh
      - deploy/synology/scripts/repository-ghcr-image.sh
      - deploy/synology/scripts/rollback.sh
      - deploy/synology/scripts/upgrade-legacy-release-state.sh
      - deploy/synology/scripts/validate-ipv4.sh
      - deploy/synology/tests/**
      - scripts/ci/classify_synology_builds.py
      - tests/ci/test_synology_rollback_contract.py
      - tests/ci/test_synology_rollback_recovery_contract.py
      - tests/ci/test_synology_deploy_release_identity.py
      - tests/ci/test_synology_auto_staging_deploy.py
      - tests/ci/test_synology_gateway_build_inputs.py
      - tests/ci/test_synology_deployment_package_routing.py
      - .github/workflows/build-synology-staging-images.yml
      - .github/workflows/deploy-synology-staging.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: synology-staging-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Synology image inputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      has_image_builds: ${{ steps.classify.outputs.has_image_builds }}
      release_relevant: ${{ steps.classify.outputs.release_relevant }}
      platform_changed: ${{ steps.classify.outputs.platform_changed }}
      gateway_changed: ${{ steps.classify.outputs.gateway_changed }}
      deploy_runner_changed: ${{ steps.classify.outputs.deploy_runner_changed }}
      deployment_package_changed: ${{ steps.classify.outputs.deployment_package_changed }}
      control_plane_changed: ${{ steps.classify.outputs.control_plane_changed }}
      runtime_deployment_changed: ${{ steps.classify.outputs.runtime_deployment_changed }}
      deployment_validation_changed: ${{ steps.classify.outputs.deployment_validation_changed }}
      build_platform: ${{ steps.classify.outputs.build_platform }}
      build_gateway: ${{ steps.classify.outputs.build_gateway }}
      build_deploy_runner: ${{ steps.classify.outputs.build_deploy_runner }}
    steps:
      - name: Checkout exact classification range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate classifier syntax
        run: python3 -m py_compile scripts/ci/classify_synology_builds.py

      - name: Classify component build requirements
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/classify_synology_builds.py \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  validate-deployment:
    name: Validate Synology deployment package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n \
            deploy/synology/scripts/lib.sh \
            deploy/synology/scripts/deploy.sh \
            deploy/synology/scripts/health-check.sh \
            deploy/synology/scripts/marketplace-staging.sh \
            deploy/synology/scripts/prepare-fresh-schema-baseline.sh \
            deploy/synology/scripts/recover-schema.sh \
            deploy/synology/scripts/release-state.sh \
            deploy/synology/scripts/repository-ghcr-image.sh \
            deploy/synology/scripts/rollback.sh \
            deploy/synology/scripts/upgrade-legacy-release-state.sh \
            deploy/synology/scripts/validate-ipv4.sh \
            deploy/synology/runner/entrypoint.sh
          sh -n \
            deploy/synology/tls/init.sh \
            deploy/synology/mariadb/init/10-platform-database.sh

      - name: Validate Synology contracts
        run: |
          set -euo pipefail
          python3 tests/ci/test_synology_rollback_contract.py
          python3 tests/ci/test_synology_rollback_recovery_contract.py
          python3 tests/ci/test_synology_deploy_release_identity.py
          python3 tests/ci/test_synology_auto_staging_deploy.py
          python3 tests/ci/test_synology_gateway_build_inputs.py
          python3 tests/ci/test_synology_deployment_package_routing.py
          python3 deploy/synology/tests/test_fresh_baseline_contract.py

      - name: Validate Compose manifests and LAN isolation
        run: |
          set -euo pipefail
          env_file=/tmp/oteryn-synology.env
          default_json=/tmp/oteryn-runtime-default.json
          lan_json=/tmp/oteryn-runtime-lan.json
          project="oteryn-boundary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp deploy/synology/.env.example "$env_file"
          sed -E -i 's/=(REQUIRED_[A-Z0-9_]+)$/=localplaceholder/' "$env_file"

          runtime_compose=(
            docker compose
            -p "$project"
            --env-file "$env_file"
            -f deploy/synology/compose.yml
          )
          cleanup() {
            "${runtime_compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f "$env_file" "$default_json" "$lan_json"
          }
          trap cleanup EXIT

          render_compose() {
            local output="$1"
            "${runtime_compose[@]}" config --quiet
            "${runtime_compose[@]}" config --format json > "$output"
          }

          render_compose "$default_json"
          python3 - "$default_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())

          def bindings(service):
              result = {}
              for port in data['services'][service].get('ports', []) or []:
                  result[str(port['target'])] = (
                      str(port.get('host_ip', '')),
                      str(port['published']),
                  )
              return result

          expected = {
              'platform': {'8000': ('127.0.0.1', '8000')},
              'gateway': {'8080': ('127.0.0.1', '8080')},
              'canary': {
                  '7171': ('127.0.0.1', '7171'),
                  '7172': ('127.0.0.1', '7172'),
              },
          }
          for service, service_expected in expected.items():
              actual = bindings(service)
              if actual != service_expected:
                  raise SystemExit(f'default bindings for {service} are {actual}, expected {service_expected}')

          bind_mounts = []
          for service_name, service in data.get('services', {}).items():
              for mount in service.get('volumes', []) or []:
                  if mount.get('type') == 'bind':
                      bind_mounts.append((service_name, mount.get('source'), mount.get('target')))
          if bind_mounts:
              raise SystemExit(f'runtime Compose must not depend on runner checkout bind mounts: {bind_mounts}')
          PY

          sed -i 's/^CANARY_GAME_BIND_ADDRESS=.*/CANARY_GAME_BIND_ADDRESS=192.168.50.10/' "$env_file"
          sed -i 's/^CANARY_SERVER_IP=.*/CANARY_SERVER_IP=192.168.50.10/' "$env_file"
          sed -i 's/^GAME_WORLD_HOST=.*/GAME_WORLD_HOST=192.168.50.10/' "$env_file"
          render_compose "$lan_json"
          python3 - "$lan_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())

          def bindings(service):
              result = {}
              for port in data['services'][service].get('ports', []) or []:
                  result[str(port['target'])] = (
                      str(port.get('host_ip', '')),
                      str(port['published']),
                  )
              return result

          expected = {
              'platform': {'8000': ('127.0.0.1', '8000')},
              'gateway': {'8080': ('127.0.0.1', '8080')},
              'canary': {
                  '7171': ('127.0.0.1', '7171'),
                  '7172': ('192.168.50.10', '7172'),
              },
          }
          for service, service_expected in expected.items():
              actual = bindings(service)
              if actual != service_expected:
                  raise SystemExit(f'LAN bindings for {service} are {actual}, expected {service_expected}')

          canary_environment = data['services']['canary']['environment']
          if str(canary_environment['CANARY_SERVER_IP']) != '192.168.50.10':
              raise SystemExit('Canary advertised server IP does not match the LAN game bind')
          if str(canary_environment['CANARY_GAME_SESSION_ISSUER_WORLD_ID']) != '1':
              raise SystemExit('Canary issuer world ID does not match the staging World Registry ID')
          PY

          "${runtime_compose[@]}" pull tls-init
          "${runtime_compose[@]}" create tls-init
          tls_container="$("${runtime_compose[@]}" ps -a -q tls-init)"
          test -n "$tls_container"
          docker cp deploy/synology/tls/init.sh "$tls_container:/bootstrap/tls-init.sh"
          docker cp deploy/synology/nginx/internal.conf "$tls_container:/bootstrap/internal-nginx.conf"
          bootstrap_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/bootstrap"}}{{.Name}}{{end}}{{end}}' "$tls_container")"
          test -n "$bootstrap_volume"
          docker run --rm \
            -v "$bootstrap_volume:/bootstrap:ro" \
            alpine:3.22 \
            /bin/sh -ec 'test -s /bootstrap/tls-init.sh && test -s /bootstrap/internal-nginx.conf'

          grep -q -- '--network "container:' deploy/synology/scripts/health-check.sh
          grep -q 'assert_binding platform' deploy/synology/scripts/health-check.sh
          grep -q 'assert_binding gateway' deploy/synology/scripts/health-check.sh
          grep -q 'assert_binding canary' deploy/synology/scripts/health-check.sh

          docker compose \
            --env-file deploy/synology/runner/.env.example \
            -f deploy/synology/runner/compose.yml \
            config --quiet

  build:
    name: Build ${{ matrix.name }} component
    if: ${{ needs.classify.outputs.has_image_builds == 'true' }}
    needs:
      - classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve component image identity
        id: image
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          SOURCE_SHA: ${{ matrix.source_sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="$(bash deploy/synology/scripts/repository-ghcr-image.sh "$PACKAGE_NAME")"
          tags="${image}:source-${SOURCE_SHA}"
          if [[ "$GIT_REF" == refs/heads/main ]]; then
            tags+=$'\n'"${image}:main"
          fi
          {
            echo "image=$image"
            echo "source_ref=${image}:source-${SOURCE_SHA}"
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build affected component
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ matrix.source_sha }}
            io.oteryn.component.source-revision=${{ matrix.source_sha }}
          cache-from: type=gha,scope=synology-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=synology-${{ matrix.name }}

      - name: Validate locally loaded pull-request image
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.source_ref }}
          IMAGE_NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          set -euo pipefail
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          [[ "$revision" == "$SOURCE_SHA" ]]
          case "$IMAGE_NAME" in
            platform)
              docker run --rm --entrypoint php "$IMAGE_REF" -v
              ;;
            game-gateway)
              docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec 'test -x /usr/local/bin/game-gateway'
              ;;
            deploy-runner)
              docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -ec 'docker --version && docker compose version && test -x /usr/local/bin/oteryn-runner-entrypoint'
              ;;
          esac

      - name: Record immutable current-run component provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.name != 'deploy-runner' }}
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
          SOURCE_SHA: ${{ matrix.source_sha }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Build did not produce an immutable digest." >&2; exit 1; }
          image_ref="${IMAGE}@${DIGEST}"
          mkdir -p artifacts/synology
          {
            printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
            printf 'IMAGE=%s\n' "$image_ref"
          } > "artifacts/synology/${IMAGE_NAME}.env"
          echo "Published ${IMAGE_NAME} from ${SOURCE_SHA} as ${image_ref}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable current-run provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.name != 'deploy-runner' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synology-runtime-${{ matrix.name }}
          path: artifacts/synology/${{ matrix.name }}.env
          if-no-files-found: error
          retention-days: 1

  deploy-staging:
    name: Dispatch exact component provenance to Synology staging
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.classify.outputs.release_relevant == 'true' &&
        needs.validate-deployment.result == 'success' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    needs:
      - classify
      - validate-deployment
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout exact release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download immutable current-run component provenance
        if: ${{ needs.classify.outputs.has_image_builds == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: synology-runtime-*
          path: artifacts/synology
          merge-multiple: true

      - name: Resolve newly built component inputs
        id: runtime
        env:
          BUILD_PLATFORM: ${{ needs.classify.outputs.build_platform }}
          BUILD_GATEWAY: ${{ needs.classify.outputs.build_gateway }}
        run: |
          set -euo pipefail
          read_component() {
            local name="$1"
            local required="$2"
            local file="artifacts/synology/${name}.env"
            if [[ "$required" != true ]]; then
              printf '%s\n%s\n' '' ''
              return 0
            fi
            [[ -f "$file" ]] || { echo "Missing current-run provenance for $name." >&2; return 1; }
            local source_sha image
            source_sha="$(sed -n 's/^SOURCE_SHA=//p' "$file")"
            image="$(sed -n 's/^IMAGE=//p' "$file")"
            [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "$name source SHA is not the exact protected-main SHA." >&2; return 1; }
            [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] || { echo "$name image is not an immutable GHCR digest." >&2; return 1; }
            printf '%s\n%s\n' "$source_sha" "$image"
          }

          mapfile -t platform < <(read_component platform "$BUILD_PLATFORM")
          mapfile -t gateway < <(read_component game-gateway "$BUILD_GATEWAY")
          {
            echo "platform_source_sha=${platform[0]:-}"
            echo "platform_image=${platform[1]:-}"
            echo "gateway_source_sha=${gateway[0]:-}"
            echo "gateway_image=${gateway[1]:-}"
          } >> "$GITHUB_OUTPUT"

          echo "Overall release: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_PLATFORM" == true ]]; then
            echo "Platform: newly built ${platform[0]} — ${platform[1]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Platform: reuse exact proven component from Synology current-release state" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$BUILD_GATEWAY" == true ]]; then
            echo "Gateway: newly built ${gateway[0]} — ${gateway[1]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gateway: reuse exact proven component from Synology current-release state" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch guarded exact-provenance Synology staging deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_CHANGED: ${{ needs.classify.outputs.build_platform }}
          GATEWAY_CHANGED: ${{ needs.classify.outputs.build_gateway }}
          PLATFORM_SOURCE_SHA: ${{ steps.runtime.outputs.platform_source_sha }}
          PLATFORM_IMAGE: ${{ steps.runtime.outputs.platform_image }}
          GATEWAY_SOURCE_SHA: ${{ steps.runtime.outputs.gateway_source_sha }}
          GATEWAY_IMAGE: ${{ steps.runtime.outputs.gateway_image }}
          CANARY_IMAGE_DIGEST: ghcr.io/blakinio/canary@sha256:784e5dbdcc64e311c48c51cd94aa206e2efa1e5eefb2f4ef40170d5aac55031f
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded main deployment: current main is $current_main, build SHA is $GITHUB_SHA."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-synology-staging.yml/dispatches" \
            -f ref=main \
            -f 'inputs[action]=deploy' \
            -f "inputs[release_sha]=${GITHUB_SHA}" \
