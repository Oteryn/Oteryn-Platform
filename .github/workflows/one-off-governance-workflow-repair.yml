name: One-off Governance Workflow Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-governance-workflow-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/issue-1165-safe-authority
          fetch-depth: 0

      - name: Patch only the remaining case-insensitive fixture migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-off-governance-authority-migration.yml')
          text = path.read_text(encoding='utf-8')
          old = '"tools/agents/test_policy_consistency.py": [(OLD, NEW), (OLD_BOOTSTRAP, BOOTSTRAP)],'
          new = '"tools/agents/test_policy_consistency.py": [(OLD, NEW), ("BLAKINIO/OTERYN-PLATFORM", "OTERYN/OTERYN-PLATFORM"), (OLD_BOOTSTRAP, BOOTSTRAP)],'
          if text.count(old) != 1:
              raise SystemExit('expected exact test migration marker not found once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/one-off-governance-authority-migration.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-off-governance-authority-migration.yml
          git diff --cached --check
          git commit -m "ci(governance): migrate case-insensitive identity fixture"
          git push origin HEAD:governance/issue-1165-safe-authority
