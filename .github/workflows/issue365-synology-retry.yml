name: Issue 365 Exact Frozen Synology Retry

on:
  push:
    branches:
      - validation/issue365-synology-20260801
    paths:
      - .github/workflows/issue365-synology-retry.yml
      - .github/scripts/issue365_prepare_validator.py

permissions:
  contents: read

concurrency:
  group: issue365-exact-frozen-synology
  cancel-in-progress: true

env:
  TARGET_SHA: b6f7b12a43aa72a52dc98c3fa07a7c4607fcb608
  RUNBOOK_REF: fb8a54d849a2f74f92ff429aea3bac06eb6a543c
  HARNESS_REF: "3739e3ccf3c3b750aa4e7f0f096712a04a2d5235^"
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble

jobs:
  validate:
    runs-on: oteryn-staging
    timeout-minutes: 120
    steps:
      - name: Checkout validator control
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Checkout exact frozen target
        uses: actions/checkout@v7
        with:
          ref: b6f7b12a43aa72a52dc98c3fa07a7c4607fcb608
          path: frozen
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Prepare isolated validator
        shell: bash
        run: |
          set -euo pipefail
          git -C control show \
            "${HARNESS_REF}:.github/workflows/issue365-synology-preflight.yml" \
            > /tmp/issue365-harness-source.yml
          python3 \
            control/.github/scripts/issue365_prepare_validator.py \
            /tmp/issue365-harness-source.yml \
            /tmp/issue365-validator.sh
          bash -n /tmp/issue365-validator.sh

      - name: Execute corrected exact-frozen 12-sample matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_WORKSPACE="$PWD/frozen"
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          exec bash /tmp/issue365-validator.sh

      - name: Upload immutable Issue 365 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue365-exact-frozen-synology-${{ github.run_id }}
          path: |
            frozen/issue365-synology-evidence-${{ github.run_id }}.tar.gz
            frozen/issue365-synology-evidence-${{ github.run_id }}.tar.gz.sha256
            frozen/issue365-synology-matrix-summary-${{ github.run_id }}.json
            frozen/issue365-synology-partial-${{ github.run_id }}.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated validation runtime
        if: always()
        shell: bash
        run: |
          set +e
          prefix="issue365-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for container in \
            "${prefix}-app" \
            "${prefix}-mailhog" \
            "${prefix}-redis" \
            "${prefix}-mariadb"; do
            docker rm -f "$container" >/dev/null 2>&1 || true
          done
          docker network rm "${prefix}-net" >/dev/null 2>&1 || true
          docker volume rm -f \
            "${prefix}-work" \
            "${prefix}-evidence" \
            >/dev/null 2>&1 || true
          docker image rm -f \
            "oteryn-issue365-validator:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "oteryn-issue365-platform:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null 2>&1 || true
          rm -f \
            "/tmp/${prefix}.env" \
            "/tmp/${prefix}-runbook.md" \
            /tmp/issue365-harness-source.yml \
            /tmp/issue365-validator.sh
          for checkout in frozen control; do
            if [[ -d "$checkout/.git" ]]; then
              git -C "$checkout" reset --hard HEAD >/dev/null 2>&1 || true
              git -C "$checkout" clean -ffdqx >/dev/null 2>&1 || true
            fi
          done
