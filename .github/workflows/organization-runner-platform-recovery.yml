name: Organization Runner Platform Recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/organization-runner-platform-recovery.yml

permissions:
  contents: read

concurrency:
  group: organization-runner-platform-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover-platform-runner:
    name: Recover Platform organization runner
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'infra/issue-1217-platform-runner-recovery' &&
      github.actor == 'blakinio'
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify legacy control boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ runner.name }}' = 'oteryn-synology-staging'
          test -S /var/run/docker.sock
          echo 'legacy-control-boundary=PASS'

      - name: Inspect and recover only the Platform runner container
        shell: bash
        run: |
          set -Eeuo pipefail
          container=oteryn-organization-runners-platform-1
          docker inspect "$container" >/dev/null
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")" = 'oteryn-organization-runners'
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container")" = 'platform'
          image="$(docker inspect --format '{{.Config.Image}}' "$container")"
          case "$image" in ghcr.io/oteryn/oteryn-deploy-runner@sha256:*) ;; *) echo 'unexpected-runner-image' >&2; exit 1 ;; esac
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = '0:0'
          test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")" = 'always'
          running_before="$(docker inspect --format '{{.State.Running}}' "$container")"
          restart_before="$(docker inspect --format '{{.RestartCount}}' "$container")"
          echo "platform-runner-before running=$running_before restart_count=$restart_before"
          docker restart --time 10 "$container" >/dev/null
          for i in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
          restart_after="$(docker inspect --format '{{.RestartCount}}' "$container")"
          echo "platform-runner-after running=true restart_count=$restart_after"
          echo 'platform-runner-container-recovery=PASS'

      - name: Verify product runtime was not targeted
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d /var/lib/oteryn-staging-state
          echo 'product-runtime-mutation=NONE'

  verify-org-runner-acl:
    name: Verify organization runner ACLs
    needs: recover-platform-runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORG_ADMIN_TOKEN: ${{ secrets.OTERYN_ORG_RUNNER_ADMIN_TOKEN }}
      ORG: Oteryn
    steps:
      - name: Verify exact groups, runners and selected repositories
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORG_ADMIN_TOKEN"
          api() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $ORG_ADMIN_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$@"
          }
          groups="$(api "https://api.github.com/orgs/$ORG/actions/runner-groups?per_page=100")"
          runners="$(api "https://api.github.com/orgs/$ORG/actions/runners?per_page=100")"

          verify_runner() {
            local group="$1" repo="$2" name="$3" label="$4"
            local gid runner in_group selected
            test "$(jq -r --arg name "$name" '[.runners[] | select(.name == $name)] | length' <<< "$runners")" = 1
            gid="$(jq -er --arg group "$group" '.runner_groups[] | select(.name == $group) | .id' <<< "$groups")"
            runner="$(jq -cer --arg name "$name" '.runners[] | select(.name == $name)' <<< "$runners")"
            jq -e --arg label "$label" '.status == "online" and (.labels | length == 1) and (.labels[0].name == $label)' <<< "$runner" >/dev/null
            in_group="$(api "https://api.github.com/orgs/$ORG/actions/runner-groups/$gid/runners?per_page=100" | jq -r --arg name "$name" '[.runners[]? | select(.name == $name)] | length')"
            test "$in_group" = 1
            selected="$(api "https://api.github.com/orgs/$ORG/actions/runner-groups/$gid/repositories?per_page=100")"
            test "$(jq -r '.total_count' <<< "$selected")" = 1
            test "$(jq -er '.repositories[0].full_name' <<< "$selected")" = "$repo"
            echo "runner=$name group=$group label=$label status=online selected_repo=$repo"
          }
          verify_runner platform-runners Oteryn/Oteryn-Platform oteryn-synology-platform oteryn-platform
          verify_runner atlas-runners Oteryn/Oteryn-Atlas oteryn-synology-atlas oteryn-atlas
          verify_runner game-runners Oteryn/Oteryn-Game oteryn-synology-game oteryn-game
          echo 'organization-runner-acl=PASS'
