name: One-off Update Safe Authority From Main

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-update-safe-authority-from-main.yml

permissions:
  contents: write

concurrency:
  group: one-off-update-safe-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-main:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/issue-1165-safe-authority
          fetch-depth: 0

      - name: Merge current protected main without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          before="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main
          after="$(git rev-parse HEAD)"
          test "$after" != "$before"
          test "$(git rev-parse HEAD^2)" = "$main"
          git diff --check "$before..$after"
          git push origin HEAD:governance/issue-1165-safe-authority
          {
            echo "Merged main: \`$main\`"
            echo "Previous branch head: \`$before\`"
            echo "Updated branch head: \`$after\`"
          } >> "$GITHUB_STEP_SUMMARY"
