name: One-shot Game Catalog Main Sync

on:
  push:
    branches:
      - feat/OTERYN-20260728-game-catalog-slice-1
    paths:
      - '.github/workflows/one-shot-game-catalog-sync-main.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-game-catalog-sync-main.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-game-catalog-main-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'push' || github.event.pull_request.number == 272
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge current main with guarded conflict resolution
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ ${merge_status} -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]:-none}"
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != 'bootstrap/providers.php' ]]; then
              echo 'Refusing to resolve an unexpected main-sync conflict.' >&2
              exit 1
            fi

            cat > bootstrap/providers.php <<'PHP'
          <?php

          use App\GameCatalog\GameCatalogServiceProvider;
          use App\Providers\AccountSecurityServiceProvider;
          use App\Providers\AppServiceProvider;

          return [
              AppServiceProvider::class,
              AccountSecurityServiceProvider::class,
              GameCatalogServiceProvider::class,
          ];
          PHP
            git add bootstrap/providers.php
          fi

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo 'Branch is already synchronized with main.'
            exit 0
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --check
          git commit -m 'merge: synchronize main into Game Catalog branch'
          git push origin "HEAD:${HEAD_REF}"
