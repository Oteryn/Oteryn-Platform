name: Audit MFA QR Staging Run

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-mfa-qr-staging-run.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print focused inline health-check failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: 89852009913
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > deploy.log
          grep -nEi 'MFA QR|anonymous MFA|health probe failed|fatal error|undefined method|process completed with exit|expected 302' deploy.log | tail -n 80 || true
          echo '--- final deployment lines ---'
          tail -n 120 deploy.log
