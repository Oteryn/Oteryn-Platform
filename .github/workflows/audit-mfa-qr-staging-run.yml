name: Audit MFA QR Staging Run

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-mfa-qr-staging-run.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print sanitized workflow and runner status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: cb14a5c5209e868b0d99c42f3d1601505d1dd6d7
        run: |
          set -euo pipefail
          echo '--- MFA QR one-shot ---'
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/one-shot-mfa-qr-staging-deploy.yml/runs?branch=main&per_page=20" \
            --jq '.workflow_runs[] | select(.head_sha == env.TARGET_SHA) | {id,status,conclusion,run_attempt,created_at,updated_at}'
          echo '--- exact image build ---'
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-synology-staging-images.yml/runs?branch=main&per_page=20" \
            --jq '.workflow_runs[] | select(.head_sha == env.TARGET_SHA) | {id,status,conclusion,run_attempt,created_at,updated_at}'
          echo '--- deployment candidates ---'
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-synology-staging.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
            --jq '.workflow_runs[0:5] | map({id,status,conclusion,created_at,updated_at})'
          echo '--- self-hosted runners ---'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            --jq '.runners | map({name,status,busy,labels:(.labels | map(.name))})'

  verify-current:
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify exact running images and QR boundary
        env:
          EXPECTED_RELEASE_TAG: sha-cb14a5c5209e868b0d99c42f3d1601505d1dd6d7
        run: |
          set -euo pipefail
          platform_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=platform \
            --format '{{.ID}}')"
          gateway_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=gateway \
            --format '{{.ID}}')"
          [[ "$(wc -w <<<"$platform_container")" -eq 1 ]]
          [[ "$(wc -w <<<"$gateway_container")" -eq 1 ]]
          [[ "$(docker inspect --format '{{.Config.Image}}' "$platform_container")" == "ghcr.io/blakinio/oteryn-platform:${EXPECTED_RELEASE_TAG}" ]]
          [[ "$(docker inspect --format '{{.Config.Image}}' "$gateway_container")" == "ghcr.io/blakinio/oteryn-game-gateway:${EXPECTED_RELEASE_TAG}" ]]

          docker exec -i "$platform_container" php <<'PHP'
          <?php
          require '/var/www/html/vendor/autoload.php';
          $renderer = new App\Identity\Mfa\MfaQrCode();
          $uri = 'otpauth://totp/Oteryn%20Staging:test@example.invalid?secret=JBSWY3DPEHPK3PXP&issuer=Oteryn%20Staging';
          $dataUri = $renderer->dataUri($uri);
          if (! str_starts_with($dataUri, 'data:image/svg+xml;base64,')) {
              exit(31);
          }
          $svg = base64_decode(substr($dataUri, strlen('data:image/svg+xml;base64,')), true);
          if (! is_string($svg) || ! str_contains($svg, '<svg') || str_contains($svg, $uri)) {
              exit(32);
          }
          echo "MFA QR renderer verified.\n";
          PHP

          docker exec "$platform_container" grep -q 'Scan with your authenticator app' /var/www/html/resources/views/identity/mfa/settings.blade.php
          docker exec "$platform_container" grep -q 'mfa-qr' /var/www/html/public/css/mfa.css
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/mfa)"
          [[ "$status" == 302 ]]
