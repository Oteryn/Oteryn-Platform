name: OTS native producer fix fixture

on:
  push:
    branches:
      - feat/OTS-20260804-native-protocol-single-version-producer
    paths:
      - .github/workflows/ots-native-producer-fix-fixture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/OTS-20260804-native-protocol-single-version-producer
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Fix fixture identity
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/Feature/GameAuth/WorldRegistryTest.php')
          text = path.read_text(encoding='utf-8')
          text = text.replace('        string $profile,\n', '        string|int $identity,\n')
          text = text.replace("            'profile' => $profile,\n            'native_protocol_version' => null,", "            'profile' => $family === 'oteryn' ? null : (string) $identity,\n            'native_protocol_version' => $family === 'oteryn' ? (int) $identity : null,")
          text = text.replace("            'schema_revision' => 2,\n            'schema_sha256' => $family === 'oteryn' && $nativeProtocolVersion === 1", "            'schema_revision' => $family === 'oteryn' ? 2 : 1,\n            'schema_sha256' => $family === 'oteryn' && $identity === 1")
          path.write_text(text, encoding='utf-8')
      - name: Format and commit fixture
        shell: bash
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint tests/Feature/GameAuth/WorldRegistryTest.php
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/Feature/GameAuth/WorldRegistryTest.php
          git commit -m 'test(native): model family-specific candidate identity'
          git push origin HEAD:feat/OTS-20260804-native-protocol-single-version-producer
      - name: Validate Platform
        run: php artisan test tests/Feature/GameAuth/GameLoginContextApiTest.php tests/Feature/GameAuth/WorldRegistryTest.php
      - name: Validate Gateway
        working-directory: services/game-gateway
        run: go test ./...
