name: Synology Container Hygiene

on:
  pull_request:
    branches:
      - main
    paths:
      - AGENTS.md
      - docs/agents/DELIVERY_COMPLETENESS_AND_CLOSEOUT.md
      - docs/agents/EXECUTION_RESOURCE_HYGIENE.md
      - deploy/synology/compose.yml
      - deploy/synology/compose.marketplace.yml
      - .github/workflows/synology-container-hygiene.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/synology-container-hygiene.yml
  workflow_dispatch:
    inputs:
      action:
        description: Read-only inventory or remove only verified stopped Oteryn staging orphan containers
        required: true
        type: choice
        options:
          - inventory
          - cleanup-stopped-portal-orphans
        default: inventory
      confirm_cleanup:
        description: For cleanup enter exactly REMOVE_STOPPED_OTERYN_STAGING_ORPHANS
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: synology-staging-deployment
  cancel-in-progress: false

jobs:
  static-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate fail-closed hygiene contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/synology-container-hygiene.yml').read_text()
          forbidden = [
              'docker system ' + 'prune',
              'docker container ' + 'prune',
              'docker volume ' + 'prune',
              'docker network ' + 'prune',
              'docker image ' + 'prune',
              'docker rm ' + '-f',
              'docker volume ' + 'rm',
              'docker network ' + 'rm',
              'docker ' + 'rmi',
          ]
          present = [pattern for pattern in forbidden if pattern in workflow]
          if present:
              raise SystemExit('unsafe cleanup primitive(s): ' + ', '.join(present))

          required = [
              'project=oteryn-staging',
              'cleanup-stopped-portal-orphans',
              'REMOVE_STOPPED_OTERYN_STAGING_ORPHANS',
              'com.docker.compose.project',
              'com.docker.compose.service',
              'docker stop --time 30 "$id"',
              'docker rm "$id"',
              'validate_canonical_runtime',
              'OUTSIDE_SCOPE',
              'mapfile -t expected_services',
              'mapfile -t target_project_ids',
              'remaining_test_ids',
          ]
          missing = [marker for marker in required if marker not in workflow]
          if missing:
              raise SystemExit('missing fail-closed marker(s): ' + ', '.join(missing))

          bootstrap_marker = (
              "startsWith(github.event.head_commit.message, "
              + "'fix(ops): complete Synology portal container cleanup (#974)')"
          )
          if bootstrap_marker not in workflow:
              raise SystemExit('one-time PR #974 live bootstrap guard is missing')

          stale_project_marker = 'stale_test_project=' + 'portal-authentik-local-test'
          if stale_project_marker not in workflow:
              raise SystemExit('exact stale test project marker is missing')

          cleanup_action_marker = 'cleanup-proven-' + 'authentik-local-test'
          if cleanup_action_marker not in workflow:
              raise SystemExit('one-time exact test cleanup action is missing')

          compose_sources_match = re.search(
              r'^\s*compose_sources=\(([^)]*)\)\s*$', workflow, re.MULTILINE
          )
          if not compose_sources_match:
              raise SystemExit('compose_sources declaration is missing')
          live_compose_sources = set(compose_sources_match.group(1).split())
          expected_compose_sources = {
              'deploy/synology/compose.yml',
              'deploy/synology/compose.marketplace.yml',
          }
          if live_compose_sources != expected_compose_sources:
              raise SystemExit(
                  'live compose source drift: '
                  f'workflow={sorted(live_compose_sources)} expected={sorted(expected_compose_sources)}'
              )

          if re.search(r'^\s*expected_services=\(', workflow, re.MULTILINE):
              raise SystemExit('live expected_services must be derived from trusted compose sources')

          runtime_match = re.search(r'^\s*runtime_services=\(([^)]*)\)\s*$', workflow, re.MULTILINE)
          if not runtime_match:
              raise SystemExit('runtime_services declaration is missing')
          runtime_services = set(runtime_match.group(1).split())
          if 'marketplace-scheduler' not in runtime_services:
              raise SystemExit('marketplace-scheduler must be protected as canonical runtime')

          def services_from_compose(path: Path) -> set[str]:
              lines = path.read_text().splitlines()
              services = set()
              in_services = False
              for line in lines:
                  if line == 'services:':
                      in_services = True
                      continue
                  if not in_services:
                      continue
                  if line and not line.startswith(' '):
                      break
                  match = re.fullmatch(r'  ([A-Za-z0-9][A-Za-z0-9_-]*):', line)
                  if match:
                      services.add(match.group(1))
              return services

          canonical_services = set()
          for source in sorted(expected_compose_sources):
              canonical_services |= services_from_compose(Path(source))
          if not canonical_services:
              raise SystemExit('no canonical Compose services were parsed')
          missing_runtime = runtime_services - canonical_services
          if missing_runtime:
              raise SystemExit(
                  'runtime_services drift from canonical Compose sources: '
                  f'missing={sorted(missing_runtime)}'
              )
          PY

  live-hygiene:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'fix(ops): complete Synology portal container cleanup (#974)'))
    runs-on: oteryn-staging
    environment: synology-staging
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate Docker access
        run: |
          set -euo pipefail
          docker version >/dev/null

      - name: Inventory and perform exact bounded cleanup
        id: hygiene
        env:
          HYGIENE_ACTION: ${{ github.event_name == 'push' && 'cleanup-proven-authentik-local-test' || inputs.action }}
          PORTAL_CLEANUP_CONFIRMATION: ${{ inputs.confirm_cleanup }}
          TEST_CLEANUP_CONFIRMATION: ${{ github.event_name == 'push' && 'REMOVE_PORTAL_AUTHENTIK_LOCAL_TEST_CONTAINERS' || '' }}
        run: |
          set -euo pipefail

          project=oteryn-staging
          stale_test_project=portal-authentik-local-test
          compose_sources=(deploy/synology/compose.yml deploy/synology/compose.marketplace.yml)
          runtime_services=(mariadb redis platform canary internal-proxy gateway marketplace-scheduler)
          expected_test_services=(postgresql server worker)
          mapfile -t expected_services < <(
            for compose_source in "${compose_sources[@]}"; do
              sed -n '/^services:$/,/^[^ ]/p' "$compose_source" \
                | sed -n 's/^  \([A-Za-z0-9][A-Za-z0-9_-]*\):$/\1/p'
            done | sort -u
          )
          candidates=()
          unsafe_portal=()
          inventory_file="$RUNNER_TEMP/synology-container-inventory.txt"
          : > "$inventory_file"

          is_in_list() {
            local candidate="$1"
            shift
            local item
            for item in "$@"; do
              [[ "$candidate" == "$item" ]] && return 0
            done
            return 1
          }

          is_expected_service() {
            is_in_list "$1" "${expected_services[@]}"
          }

          is_runtime_service() {
            is_in_list "$1" "${runtime_services[@]}"
          }

          is_expected_test_service() {
            is_in_list "$1" "${expected_test_services[@]}"
          }

          if (( ${#expected_services[@]} == 0 )); then
            echo 'No canonical services parsed from trusted main Compose sources; refusing operation.' >&2
            exit 1
          fi
          for service in "${runtime_services[@]}"; do
            if ! is_expected_service "$service"; then
              echo "Runtime service $service is absent from trusted main Compose sources; refusing operation." >&2
              exit 1
            fi
          done

          label_value() {
            local id="$1"
            local key="$2"
            local value
            value="$(docker inspect --format "{{ index .Config.Labels \"$key\" }}" "$id")"
            [[ "$value" == '<no value>' ]] && value=""
            printf '%s' "$value"
          }

          validate_canonical_runtime() {
            local service canonical id actual_project actual_service running
            for service in "${runtime_services[@]}"; do
              canonical="${project}-${service}-1"
              if ! id="$(docker inspect --format '{{.Id}}' "$canonical" 2>/dev/null)"; then
                echo "Canonical runtime container is missing: $canonical" >&2
                return 1
              fi
              actual_project="$(label_value "$id" 'com.docker.compose.project')"
              actual_service="$(label_value "$id" 'com.docker.compose.service')"
              running="$(docker inspect --format '{{.State.Running}}' "$id")"
              if [[ "$actual_project" != "$project" || "$actual_service" != "$service" || "$running" != 'true' ]]; then
                echo "Canonical runtime identity/health is ambiguous for $canonical; refusing cleanup." >&2
                return 1
              fi
            done
          }

          mapfile -t all_ids < <(docker ps -aq)
          for id in "${all_ids[@]}"; do
            [[ -n "$id" ]] || continue
            name="$(docker inspect --format '{{.Name}}' "$id")"
            name="${name#/}"
            state="$(docker inspect --format '{{.State.Status}}' "$id")"
            image="$(docker inspect --format '{{.Config.Image}}' "$id")"
            actual_project="$(label_value "$id" 'com.docker.compose.project')"
            actual_service="$(label_value "$id" 'com.docker.compose.service')"
            classification=OUTSIDE_SCOPE

            if [[ "$actual_project" == "$project" ]]; then
              if [[ -z "$actual_service" ]]; then
                classification=UNSAFE_PORTAL_UNKNOWN_SERVICE
                unsafe_portal+=("$id")
              elif is_expected_service "$actual_service"; then
                canonical="${project}-${actual_service}-1"
                if [[ "$name" == "$canonical" ]]; then
                  classification=CANONICAL_PORTAL_SERVICE
                elif [[ "$state" == 'running' ]]; then
                  classification=UNSAFE_RUNNING_NONCANONICAL_PORTAL_SERVICE
                  unsafe_portal+=("$id")
                else
                  canonical_ok=false
                  if canonical_id="$(docker inspect --format '{{.Id}}' "$canonical" 2>/dev/null)"; then
                    canonical_project="$(label_value "$canonical_id" 'com.docker.compose.project')"
                    canonical_service="$(label_value "$canonical_id" 'com.docker.compose.service')"
                    if [[ "$canonical_project" == "$project" && "$canonical_service" == "$actual_service" ]]; then
                      if is_runtime_service "$actual_service"; then
                        canonical_running="$(docker inspect --format '{{.State.Running}}' "$canonical_id")"
                        [[ "$canonical_running" == 'true' ]] && canonical_ok=true
                      else
                        canonical_ok=true
                      fi
                    fi
                  fi

                  if [[ "$canonical_ok" == 'true' ]]; then
                    classification=CANDIDATE_STOPPED_DUPLICATE_PORTAL_SERVICE
                    candidates+=("$id")
                  else
                    classification=UNSAFE_NONCANONICAL_WITHOUT_VALID_CANONICAL
                    unsafe_portal+=("$id")
                  fi
                fi
              elif [[ "$state" == 'running' ]]; then
                classification=UNSAFE_RUNNING_OBSOLETE_PORTAL_SERVICE
                unsafe_portal+=("$id")
              else
                classification=CANDIDATE_STOPPED_OBSOLETE_PORTAL_SERVICE
                candidates+=("$id")
              fi
            elif [[ "$actual_project" == "$stale_test_project" ]]; then
              classification=EXACT_AUTHENTIK_LOCAL_TEST_CANDIDATE
            fi

            printf 'name=%s | state=%s | image=%s | compose_project=%s | compose_service=%s | class=%s\n' \
              "$name" "$state" "$image" "${actual_project:-none}" "${actual_service:-none}" "$classification" \
              >> "$inventory_file"
          done

          sort -o "$inventory_file" "$inventory_file"
          cat "$inventory_file"

          mapfile -t target_project_ids < <(
            docker ps -aq --filter "label=com.docker.compose.project=$stale_test_project"
          )

          {
            echo '### Synology container hygiene inventory'
            echo
            echo "- action: \`$HYGIENE_ACTION\`"
            echo "- canonical Compose sources: \`${compose_sources[*]}\`"
            echo "- target Compose project: \`$project\`"
            echo "- verified stopped Oteryn cleanup candidates: \`${#candidates[@]}\`"
            echo "- unsafe/ambiguous Oteryn candidates: \`${#unsafe_portal[@]}\`"
            echo "- exact Authentik local-test project containers: \`${#target_project_ids[@]}\`"
            echo '- volumes/networks/images cleanup: `NOT PERMITTED`'
            echo
            echo '```text'
            cat "$inventory_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$HYGIENE_ACTION" in
            inventory)
              ;;
            cleanup-stopped-portal-orphans)
              if [[ "$PORTAL_CLEANUP_CONFIRMATION" != 'REMOVE_STOPPED_OTERYN_STAGING_ORPHANS' ]]; then
                echo 'Portal cleanup confirmation token is missing or incorrect.' >&2
                exit 1
              fi
              validate_canonical_runtime
              if (( ${#unsafe_portal[@]} > 0 )); then
                echo 'Unsafe or ambiguous Oteryn-owned containers exist; refusing all cleanup.' >&2
                exit 1
              fi

              for id in "${candidates[@]}"; do
                state="$(docker inspect --format '{{.State.Status}}' "$id")"
                actual_project="$(label_value "$id" 'com.docker.compose.project')"
                if [[ "$state" == 'running' || "$actual_project" != "$project" ]]; then
                  echo "Candidate changed state/ownership before removal; refusing cleanup for $id." >&2
                  exit 1
                fi
              done

              removed=0
              for id in "${candidates[@]}"; do
                name="$(docker inspect --format '{{.Name}}' "$id")"
                name="${name#/}"
                echo "Removing verified stopped Oteryn portal orphan: $name"
                docker rm "$id" >/dev/null
                if docker inspect "$id" >/dev/null 2>&1; then
                  echo "Container still exists after removal: $name" >&2
                  exit 1
                fi
                removed=$((removed + 1))
              done

              validate_canonical_runtime
              echo "removed_count=$removed" >> "$GITHUB_OUTPUT"
              echo "Removed verified stopped Oteryn portal orphan containers: $removed" >> "$GITHUB_STEP_SUMMARY"
              ;;
            cleanup-proven-authentik-local-test)
              if [[ "$TEST_CLEANUP_CONFIRMATION" != 'REMOVE_PORTAL_AUTHENTIK_LOCAL_TEST_CONTAINERS' ]]; then
                echo 'Exact test-project cleanup confirmation token is missing or incorrect.' >&2
                exit 1
              fi
              validate_canonical_runtime
              if (( ${#unsafe_portal[@]} > 0 )); then
                echo 'Unsafe or ambiguous Oteryn-owned containers exist; refusing test-project cleanup.' >&2
                exit 1
              fi
              if (( ${#target_project_ids[@]} != 3 )); then
                echo "Expected exactly 3 $stale_test_project containers, found ${#target_project_ids[@]}; refusing cleanup." >&2
                exit 1
              fi

              target_services=()
              for id in "${target_project_ids[@]}"; do
                actual_project="$(label_value "$id" 'com.docker.compose.project')"
                actual_service="$(label_value "$id" 'com.docker.compose.service')"
                name="$(docker inspect --format '{{.Name}}' "$id")"
                name="${name#/}"
                state="$(docker inspect --format '{{.State.Status}}' "$id")"
                created="$(docker inspect --format '{{.Created}}' "$id")"
                expected_name="${stale_test_project}-${actual_service}-1"
                if [[ "$actual_project" != "$stale_test_project" || -z "$actual_service" ]]; then
                  echo "Target ownership changed before cleanup for $id; refusing cleanup." >&2
                  exit 1
                fi
                if ! is_expected_test_service "$actual_service"; then
                  echo "Unexpected service $actual_service in $stale_test_project; refusing cleanup." >&2
                  exit 1
                fi
                if [[ "$name" != "$expected_name" ]]; then
                  echo "Unexpected container name $name for service $actual_service; refusing cleanup." >&2
                  exit 1
                fi
                target_services+=("$actual_service")
                echo "Verified exact test target: name=$name | service=$actual_service | state=$state | created=$created"
              done

              actual_service_set="$(printf '%s\n' "${target_services[@]}" | sort -u | paste -sd, -)"
              expected_service_set="$(printf '%s\n' "${expected_test_services[@]}" | sort -u | paste -sd, -)"
              if [[ "$actual_service_set" != "$expected_service_set" ]]; then
                echo "Exact test service set mismatch: actual=$actual_service_set expected=$expected_service_set; refusing cleanup." >&2
                exit 1
              fi

              for id in "${target_project_ids[@]}"; do
                actual_project="$(label_value "$id" 'com.docker.compose.project')"
                actual_service="$(label_value "$id" 'com.docker.compose.service')"
                state="$(docker inspect --format '{{.State.Status}}' "$id")"
                if [[ "$actual_project" != "$stale_test_project" ]] || ! is_expected_test_service "$actual_service"; then
                  echo "Target identity changed immediately before stop for $id; refusing cleanup." >&2
                  exit 1
                fi
                if [[ "$state" == 'running' ]]; then
                  echo "Stopping verified obsolete test container: ${stale_test_project}-${actual_service}-1"
                  docker stop --time 30 "$id" >/dev/null
                fi
              done

              validate_canonical_runtime

              for id in "${target_project_ids[@]}"; do
                actual_project="$(label_value "$id" 'com.docker.compose.project')"
                actual_service="$(label_value "$id" 'com.docker.compose.service')"
                running="$(docker inspect --format '{{.State.Running}}' "$id")"
                if [[ "$actual_project" != "$stale_test_project" || "$running" != 'false' ]] || ! is_expected_test_service "$actual_service"; then
                  echo "Target identity/state changed before removal for $id; refusing cleanup." >&2
                  exit 1
                fi
              done

              removed=0
              for id in "${target_project_ids[@]}"; do
                name="$(docker inspect --format '{{.Name}}' "$id")"
                name="${name#/}"
                echo "Removing verified obsolete test container: $name"
                docker rm "$id" >/dev/null
                if docker inspect "$id" >/dev/null 2>&1; then
                  echo "Container still exists after removal: $name" >&2
                  exit 1
                fi
                removed=$((removed + 1))
              done

              mapfile -t remaining_test_ids < <(
                docker ps -aq --filter "label=com.docker.compose.project=$stale_test_project"
              )
              if (( ${#remaining_test_ids[@]} != 0 )); then
                echo "$stale_test_project containers remain after cleanup; refusing successful closeout." >&2
                exit 1
              fi

              validate_canonical_runtime
              echo "removed_count=$removed" >> "$GITHUB_OUTPUT"
              echo "Removed exact obsolete $stale_test_project containers: $removed" >> "$GITHUB_STEP_SUMMARY"
              echo 'Named volumes, networks and images were preserved.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Unsupported hygiene action: $HYGIENE_ACTION" >&2
              exit 1
              ;;
          esac

          echo "candidate_count=${#candidates[@]}" >> "$GITHUB_OUTPUT"
          echo "unsafe_count=${#unsafe_portal[@]}" >> "$GITHUB_OUTPUT"
