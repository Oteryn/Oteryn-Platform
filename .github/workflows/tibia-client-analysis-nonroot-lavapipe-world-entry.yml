name: Tibia Nonroot Software Vulkan World Entry

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-nonroot-lavapipe-world-entry.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  login:
    name: Login Tibia as unprivileged UID and leave online on success
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Run isolated package copy as nobody through WARP and lavapipe
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99
          src='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia'
          work=/tmp/tibia-nonroot-runtime
          home=/tmp/tibia-nonroot-home
          pkg=/tmp/tibia-nonroot-package
          [[ -x "$src/bin/client" ]]
          command -v runuser >/dev/null
          id nobody >/dev/null
          uid=$(id -u nobody)
          [[ "$uid" -ne 0 ]]
          echo "NONROOT_UID=$uid"

          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers vulkan-tools >/dev/null
          lvp=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)
          [[ -n "$lvp" && -f "$lvp" ]]
          VK_ICD_FILENAMES="$lvp" VK_DRIVER_FILES="$lvp" LIBGL_ALWAYS_SOFTWARE=1 DISPLAY=:99 \
            vulkaninfo --summary >/tmp/nonroot-rootcheck-vulkan.txt 2>/dev/null
          grep -Eqi 'lavapipe|llvmpipe' /tmp/nonroot-rootcheck-vulkan.txt
          echo SOFTWARE_VULKAN_VERIFIED=true

          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/nonroot-warp.trace
          grep -q '^warp=on$' /tmp/nonroot-warp.trace
          echo WARP_VERIFIED=true

          pkill -x client 2>/dev/null || true
          rm -rf "$work" "$home" "$pkg"
          mkdir -p "$work" "$home"
          cp -a --reflink=auto "$src" "$pkg"
          chown -R nobody:nogroup "$work" "$home" "$pkg"
          chmod 700 "$work" "$home"

          cat >/tmp/proxychains-nonroot.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF
          chmod 644 /tmp/proxychains-nonroot.conf

          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          if runuser -u nobody -- env DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
            echo NONROOT_X_DISPLAY_ACCESS=true
          else
            echo NONROOT_X_DISPLAY_ACCESS=false
            exit 3
          fi
          if runuser -u nobody -- env DISPLAY=:99 HOME="$home" VK_ICD_FILENAMES="$lvp" VK_DRIVER_FILES="$lvp" LIBGL_ALWAYS_SOFTWARE=1 \
              vulkaninfo --summary >"$work/nonroot-vulkan.txt" 2>"$work/nonroot-vulkan.err"; then
            echo NONROOT_VULKANINFO_SUCCESS=true
          else
            echo NONROOT_VULKANINFO_SUCCESS=false
            exit 4
          fi
          grep -Eqi 'lavapipe|llvmpipe' "$work/nonroot-vulkan.txt"
          echo NONROOT_SOFTWARE_VULKAN_VERIFIED=true

          runuser -u nobody -- bash -c 'cd "$1"; nohup env DISPLAY=:99 HOME="$2" VK_ICD_FILENAMES="$3" VK_DRIVER_FILES="$3" LIBGL_ALWAYS_SOFTWARE=1 proxychains4 -f /tmp/proxychains-nonroot.conf "$1/bin/client" >"$4/client.log" 2>&1 </dev/null &' _ "$pkg" "$home" "$lvp" "$work"
          for n in $(seq 1 40); do pgrep -x client >/dev/null && break; sleep 0.5; done
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          client_uid=$(awk '/^Uid:/{print $2}' "/proc/$pid/status")
          echo "CLIENT_EFFECTIVE_UID=$client_uid"
          [[ "$client_uid" == "$uid" ]]
          echo CLIENT_CONFIRMED_NONROOT=true
          sleep 12
          if grep -Fqi 'failed vulkan instance' "$work/client.log"; then
            echo NONROOT_CLIENT_FAILED_VULKAN_INSTANCE=true
            exit 5
          fi
          echo NONROOT_CLIENT_FAILED_VULKAN_INSTANCE=false

          best=''; best_area=0; bw=0; bh=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height))
            if (( area > best_area )); then best=$w; best_area=$area; bw=$width; bh=$height; fi
          done
          [[ -n "$best" && "$bw" == 1020 && "$bh" == 650 ]]

          import -display :99 -window "$best" /tmp/nonroot-login.png
          convert /tmp/nonroot-login.png -crop 900x500+60+80 -resize 150% -colorspace Gray -contrast-stretch 1%x1% /tmp/nonroot-login-ocr.png
          tesseract /tmp/nonroot-login-ocr.png stdout --psm 11 2>/dev/null >/tmp/nonroot-login.txt || true
          grep -qiE 'Account Login|E-?mail|Password' /tmp/nonroot-login.txt
          echo NONROOT_ACCOUNT_LOGIN_READY=true

          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 25

          import -display :99 -window "$best" /tmp/nonroot-select.png
          convert /tmp/nonroot-select.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/nonroot-select-ocr.png
          tesseract /tmp/nonroot-select-ocr.png stdout --psm 11 tsv 2>/dev/null >/tmp/nonroot-select.tsv || true
          python3 - <<'PY' >/tmp/nonroot-target.env
          import csv
          anchors=[]; candidates=[]
          with open('/tmp/nonroot-select.tsv',newline='',errors='replace') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  token=(r.get('text') or '').strip().lower().strip(':,.!?()[]')
                  try:
                      conf=float(r.get('conf') or -1)
                      left=int(r.get('left') or 0)//2; top=int(r.get('top') or 0)//2
                      width=max(1,int(r.get('width') or 0)//2); height=max(1,int(r.get('height') or 0)//2)
                  except ValueError:
                      continue
                  if conf < 20:
                      continue
                  x=left+width//2; y=top+height//2
                  if token in {'select','character','status'}:
                      anchors.append((token,x,y))
                  if 180 <= x <= 390 and 185 <= y <= 200:
                      candidates.append((left,x,y,conf))
          title=any(t=='select' and 100<=y<=130 for t,x,y in anchors)
          header=[(x,y) for t,x,y in anchors if t=='character' and 160<=y<=185]
          status=[(x,y) for t,x,y in anchors if t=='status' and 160<=y<=190]
          if not title or not header or not status or not candidates:
              raise SystemExit('Select Character structure not proven')
          candidates.sort()
          _,x,y,conf=candidates[0]
          if not (188 <= y <= 198 and x < status[0][0]-30):
              raise SystemExit('unsafe exact name target')
          print(f'NAME_X={x}')
          print(f'NAME_Y={y}')
          print(f'NAME_CONF={int(conf)}')
          PY
          source /tmp/nonroot-target.env
          echo NONROOT_EXACT_NAME_TARGET_VERIFIED=true
          echo "NONROOT_CHARACTER_TARGET=$NAME_X,$NAME_Y"
          xdotool mousemove --window "$best" "$NAME_X" "$NAME_Y" click --repeat 2 --delay 180 1

          sleep 2
          import -display :99 -window "$best" /tmp/nonroot-t2.png
          sleep 8
          import -display :99 -window "$best" /tmp/nonroot-t10.png
          sleep 20
          import -display :99 -window "$best" /tmp/nonroot-t30.png
          for n in 2 10 30; do
            convert "/tmp/nonroot-t${n}.png" -crop 900x500+60+80 -resize 150% -colorspace Gray -contrast-stretch 1%x1% "/tmp/nonroot-t${n}-ocr.png"
            tesseract "/tmp/nonroot-t${n}-ocr.png" stdout --psm 11 2>/dev/null >"/tmp/nonroot-t${n}.txt" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          allow={'account','login','email','password','select','character','connecting','connection','failed','error','server','world','game','battle','skills','inventory','health','mana','capacity','experience','store','vip','prey','quest','online','already','logged','session','disconnected','queue','maintenance','battleye','protected','unsupported'}
          final=''
          for n in ('2','10','30'):
              raw=Path(f'/tmp/nonroot-t{n}.txt').read_text(errors='replace').lower()
              if n=='30':
                  final=raw
              safe=[]
              for w in re.findall(r'[a-z]+',raw):
                  if w in allow and w not in safe:
                      safe.append(w)
              print(f'T{n}_SAFE=' + ','.join(safe))
          account=('account login' in final or ('email' in final and 'password' in final))
          select=('select character' in final)
          game=sum(x in final for x in ('battle','skills','inventory','health','mana','capacity','experience'))>=2
          print(f'FINAL_ACCOUNT_LOGIN={str(account).lower()}')
          print(f'FINAL_SELECT_CHARACTER={str(select).lower()}')
          print(f'FINAL_GAME_MARKERS={str(game).lower()}')
          if account or select or not game:
              raise SystemExit(6)
          PY

          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          [[ "$(awk '/^Uid:/{print $2}' "/proc/$pid/status")" == "$uid" ]]
          direct_tcp=$(ss -ntp 2>/dev/null | grep "pid=$pid," | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          udp_count=$(ss -nup 2>/dev/null | grep "pid=$pid," | grep -c . || true)
          echo "FINAL_DIRECT_TCP_COUNT=$direct_tcp"
          echo "FINAL_UDP_COUNT=$udp_count"
          [[ "$direct_tcp" -eq 0 && "$udp_count" -eq 0 ]]

          cp /tmp/nonroot-t30.png /tmp/tibia-nonroot-online-safe.png
          convert /tmp/tibia-nonroot-online-safe.png -fill '#202020' -draw 'rectangle 0,0 1020,70 rectangle 0,70 180,650 rectangle 840,70 1020,650 rectangle 0,520 1020,650' /tmp/tibia-nonroot-online-safe.png
          echo PHYSICAL_TIBIA_WORLD_LOGIN_PROVEN=true
          echo TIBIA_CHARACTER_LEFT_ONLINE_AS_NONROOT=true
          INNER
          docker cp "$CONTAINER_NAME:/tmp/tibia-nonroot-online-safe.png" /tmp/tibia-nonroot-online-safe.png

      - name: Upload privacy-safe in-world proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-nonroot-online-proof
          path: /tmp/tibia-nonroot-online-safe.png
          retention-days: 7
          if-no-files-found: warn

      - name: Verify canonical staging unchanged and client remains running
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
