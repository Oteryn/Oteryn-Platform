name: Deploy Synology Staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy selected immutable component images, roll back to the last compatible runtime release, or run one step of the PostgreSQL cutover (plan P6)
        required: true
        type: choice
        options:
          - deploy
          - rollback
          - cutover
        default: deploy
      release_sha:
        description: Full 40-character protected-main release/tooling SHA; required for deploy
        required: false
        type: string
      platform_changed:
        description: true when this release provides a newly built Platform component; false reuses current proven immutable Platform provenance
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      platform_source_sha:
        description: Full 40-character Platform component source SHA; required only when platform_changed=true
        required: false
        type: string
      platform_image:
        description: Exact immutable Platform image digest; required only when platform_changed=true
        required: false
        type: string
      gateway_changed:
        description: true when this release provides a newly built Gateway component; false reuses current proven immutable Gateway provenance
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      gateway_source_sha:
        description: Full 40-character Gateway component source SHA; required only when gateway_changed=true
        required: false
        type: string
      gateway_image:
        description: Exact immutable Gateway image digest; required only when gateway_changed=true
        required: false
        type: string
      game_world_host:
        description: Exact private Synology IPv4 address advertised for the game world, or 127.0.0.1 for loopback-only
        required: true
        type: string
        default: 127.0.0.1
      game_world_id:
        description: Positive Platform world ID
        required: true
        type: string
        default: "1"
      game_world_slug:
        description: Stable lower-case World Registry slug
        required: true
        type: string
        default: oteryn-staging
      game_world_name:
        description: Player-facing World Registry name
        required: true
        type: string
        default: Oteryn Staging
      game_world_region:
        description: Bounded World Registry region label
        required: true
        type: string
        default: LAN
      cutover_step:
        description: Cutover only (action=cutover) - the single PostgreSQL cutover step to run
        required: false
        type: choice
        options:
          - status
          - preflight
          - freeze
          - bootstrap
          - smoke
          - rollback
          - native-reenable
          - native-smoke
          - declare-done
          - retire-mariadb
          - unfreeze
          - evidence-close-init
          - evidence-observe
          - evidence-retry
          - evidence-rebegin
        default: status
      cutover_dry_run:
        description: Cutover only - true prints the planned commands and changes nothing; false executes the step
        required: false
        type: boolean
        default: true
      task_id:
        description: Cutover only - the task id (OTERYN-YYYYMMDD-slug) that owns this cutover
        required: false
        type: string
      close_run_id:
        description: Cutover only - run id of the Cloudflare maintenance-close run the cutover runs behind
        required: false
        type: string
      audit_run_id:
        description: Cutover only - run id of the Cloudflare audit run for this step (open before the close and after the open, closed otherwise)
        required: false
        type: string
      owner_go_ack:
        description: Cutover preflight only - the owner go decision; must equal task_id
        required: false
        type: string
      owner_delete_confirmation:
        description: Cutover retire-mariadb only - the exact owner confirmation phrase
        required: false
        type: string
      owner_delete_ack:
        description: Cutover retire-mariadb only - must equal task_id
        required: false
        type: string
      native_smoke_waiver:
        description: Cutover native-smoke only - the owner's waiver of the successful native login (no smoke actor); must equal task_id, empty otherwise
        required: false
        type: string
      evidence_run_id:
        description: Cutover evidence-* steps only - the attempt evidence run id (UUID) to close, retry or begin again after; empty for evidence-rebegin when no run of the cutover exists
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: synology-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    environment: synology-staging
    timeout-minutes: 30
    # The job-level set replaces the workflow-level one. issues: write is for the cutover only: its attempt
    # evidence hooks post anchor comments to the locked anchor issue (P6a D3) with this job's token, the only
    # trusted anchor author. GH_TOKEN is set in the cutover steps alone.
    permissions:
      contents: read
      packages: read
      actions: read
      issues: write
    env:
      CANONICAL_PUBLIC_APP_URL: https://oteryn.molehill.cloud
      APP_KEY: ${{ secrets.OTERYN_STAGING_APP_KEY }}
      # PostgreSQL is the Platform database (plan P7; MariaDB retired by the P6 cutover): all five are required.
      # The retired OTERYN_STAGING_MARIADB_ROOT_PASSWORD and OTERYN_STAGING_PLATFORM_DB_PASSWORD are not read.
      PLATFORM_POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_SUPERUSER_PASSWORD }}
      PLATFORM_POSTGRES_OWNER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_OWNER_PASSWORD }}
      PLATFORM_POSTGRES_APP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_APP_PASSWORD }}
      PLATFORM_POSTGRES_BACKUP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_BACKUP_PASSWORD }}
      PLATFORM_POSTGRES_DUMP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_DUMP_PASSWORD }}
      OTERYN_PLATFORM_SERVICE_TOKEN: ${{ secrets.OTERYN_STAGING_PLATFORM_SERVICE_TOKEN }}
      GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256: ${{ secrets.OTERYN_STAGING_PLATFORM_SERVICE_TOKEN_SHA256 }}
      GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256: ${{ secrets.OTERYN_STAGING_PLATFORM_PREVIOUS_SERVICE_TOKEN_SHA256 }}

    steps:
      - name: Checkout exact release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.action == 'deploy' && inputs.release_sha || inputs.action == 'cutover' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Validate runner tools
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker compose version >/dev/null
          curl --version >/dev/null
          sha256sum --version >/dev/null
          timeout --version >/dev/null
          git --version >/dev/null

      - name: Log in to GHCR
        if: ${{ inputs.action != 'cutover' || !inputs.cutover_dry_run }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Validate deployment configuration
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PLATFORM_CHANGED: ${{ inputs.platform_changed }}
          PLATFORM_SOURCE_SHA_INPUT: ${{ inputs.platform_source_sha }}
          PLATFORM_IMAGE_INPUT: ${{ inputs.platform_image }}
          GATEWAY_CHANGED: ${{ inputs.gateway_changed }}
          GATEWAY_SOURCE_SHA_INPUT: ${{ inputs.gateway_source_sha }}
          GATEWAY_IMAGE_INPUT: ${{ inputs.gateway_image }}
          GAME_WORLD_HOST_INPUT: ${{ inputs.game_world_host }}
          GAME_WORLD_ID_INPUT: ${{ inputs.game_world_id }}
          GAME_WORLD_SLUG_INPUT: ${{ inputs.game_world_slug }}
          GAME_WORLD_NAME_INPUT: ${{ inputs.game_world_name }}
          GAME_WORLD_REGION_INPUT: ${{ inputs.game_world_region }}
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -euo pipefail

          is_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }
          is_digest_ref() { [[ "$1" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; }
          is_bool() { [[ "$1" == true || "$1" == false ]]; }

          if [[ "$DEPLOY_ACTION" == deploy ]]; then
            is_sha "$RELEASE_SHA" || { echo "release_sha is required for deploy and must be an exact lower-case 40-character Git SHA." >&2; exit 1; }
            is_bool "$PLATFORM_CHANGED" || { echo "platform_changed must be true or false." >&2; exit 1; }
            is_bool "$GATEWAY_CHANGED" || { echo "gateway_changed must be true or false." >&2; exit 1; }

            if [[ "$PLATFORM_CHANGED" == true ]]; then
              is_sha "$PLATFORM_SOURCE_SHA_INPUT" || { echo "platform_source_sha is required when platform_changed=true." >&2; exit 1; }
              is_digest_ref "$PLATFORM_IMAGE_INPUT" || { echo "platform_image must be an immutable GHCR digest when platform_changed=true." >&2; exit 1; }
            elif [[ -n "$PLATFORM_SOURCE_SHA_INPUT" || -n "$PLATFORM_IMAGE_INPUT" ]]; then
              echo "Platform reuse must not provide competing component inputs." >&2
              exit 1
            fi

            if [[ "$GATEWAY_CHANGED" == true ]]; then
              is_sha "$GATEWAY_SOURCE_SHA_INPUT" || { echo "gateway_source_sha is required when gateway_changed=true." >&2; exit 1; }
              is_digest_ref "$GATEWAY_IMAGE_INPUT" || { echo "gateway_image must be an immutable GHCR digest when gateway_changed=true." >&2; exit 1; }
            elif [[ -n "$GATEWAY_SOURCE_SHA_INPUT" || -n "$GATEWAY_IMAGE_INPUT" ]]; then
              echo "Gateway reuse must not provide competing component inputs." >&2
              exit 1
            fi
          else
            [[ -z "$RELEASE_SHA" ]] || is_sha "$RELEASE_SHA" || { echo "release_sha must be empty or an exact Git SHA." >&2; exit 1; }
          fi

          if ! bash deploy/synology/scripts/validate-ipv4.sh "$GAME_WORLD_HOST_INPUT" private-or-loopback; then
            echo "game_world_host must be loopback or RFC1918 private IPv4" >&2
            exit 1
          fi

          if [[ ! "$GAME_WORLD_ID_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "game_world_id must be a positive integer." >&2
            exit 1
          fi
          if [[ ! "$GAME_WORLD_SLUG_INPUT" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "game_world_slug must be a bounded lower-case slug." >&2
            exit 1
          fi
          if [[ ! "$GAME_WORLD_REGION_INPUT" =~ ^[A-Za-z0-9_-]{1,32}$ ]]; then
            echo "game_world_region must be a simple bounded label." >&2
            exit 1
          fi
          if (( ${#GAME_WORLD_NAME_INPUT} < 1 || ${#GAME_WORLD_NAME_INPUT} > 100 )); then
            echo "game_world_name must contain 1..100 characters." >&2
            exit 1
          fi

          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          if [[ ! "$state_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "OTERYN_STAGING_STATE_DIR must be an absolute simple path." >&2
            exit 1
          fi

          required_names=(
            APP_KEY
            OTERYN_PLATFORM_SERVICE_TOKEN
            GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256
          )
          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required synology-staging secret is missing: $name" >&2
              exit 1
            fi
          done

          safe_names=(
            OTERYN_PLATFORM_SERVICE_TOKEN
          )
          for name in "${safe_names[@]}"; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "$name must use generated hex/alphanumeric staging-safe characters." >&2
              exit 1
            fi
          done
          for name in \
            PLATFORM_POSTGRES_SUPERUSER_PASSWORD PLATFORM_POSTGRES_OWNER_PASSWORD PLATFORM_POSTGRES_APP_PASSWORD \
            PLATFORM_POSTGRES_BACKUP_PASSWORD PLATFORM_POSTGRES_DUMP_PASSWORD; do
            if [[ -n "${!name:-}" && ! "${!name}" =~ ^[A-Za-z0-9_.-]{24,}$ ]]; then
              echo "$name must be empty or at least 24 generated hex/alphanumeric staging-safe characters." >&2
              exit 1
            fi
          done

          # All five PostgreSQL secrets, for every action (rollback included): a missing or partial set must stop
          # the run here, before any stack change, not later in a health check after ingress was stopped.
          postgres_configured=0
          for name in \
            PLATFORM_POSTGRES_SUPERUSER_PASSWORD PLATFORM_POSTGRES_OWNER_PASSWORD PLATFORM_POSTGRES_APP_PASSWORD \
            PLATFORM_POSTGRES_BACKUP_PASSWORD PLATFORM_POSTGRES_DUMP_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then postgres_configured=$((postgres_configured + 1)); fi
          done
          if (( postgres_configured != 5 )); then
            echo "PostgreSQL is the Platform database but only $postgres_configured of its 5 secrets are configured." >&2
            exit 1
          fi

          if [[ ! "$APP_KEY" =~ ^base64:[A-Za-z0-9+/=]+$ ]]; then
            echo "OTERYN_STAGING_APP_KEY must be a Laravel base64 application key." >&2
            exit 1
          fi
          if [[ ! "$GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "Platform service-token hash must be a SHA-256 hex digest." >&2
            exit 1
          fi
          for optional_hash in \
            "$GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256"; do
            if [[ -n "$optional_hash" && ! "$optional_hash" =~ ^[A-Fa-f0-9]{64}$ ]]; then
              echo "Optional previous service-token hashes must be empty or SHA-256 hex digests." >&2
              exit 1
            fi
          done

      - name: Upgrade legacy release provenance state
        if: ${{ inputs.action != 'cutover' || !inputs.cutover_dry_run }}
        env:
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -euo pipefail
          export OTERYN_STATE_DIR="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          bash deploy/synology/scripts/upgrade-legacy-release-state.sh

      - name: Resolve immutable runtime component provenance
        id: release_images
        if: inputs.action == 'deploy'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PLATFORM_CHANGED: ${{ inputs.platform_changed }}
          PLATFORM_SOURCE_SHA_INPUT: ${{ inputs.platform_source_sha }}
          PLATFORM_IMAGE_INPUT: ${{ inputs.platform_image }}
          GATEWAY_CHANGED: ${{ inputs.gateway_changed }}
          GATEWAY_SOURCE_SHA_INPUT: ${{ inputs.gateway_source_sha }}
          GATEWAY_IMAGE_INPUT: ${{ inputs.gateway_image }}
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -euo pipefail
          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          platform_repo="$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-platform)"
          gateway_repo="$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-game-gateway)"

          persisted_release_sha=""
          persisted_platform_source_sha=""
          persisted_platform_image=""
          persisted_gateway_source_sha=""
          persisted_gateway_image=""
          if [[ "$PLATFORM_CHANGED" == false || "$GATEWAY_CHANGED" == false ]]; then
            current_file="$state_dir/current-release.env"
            [[ -f "$current_file" ]] || { echo "Component reuse rejected: current proven release state is missing." >&2; exit 1; }
            bash deploy/synology/scripts/release-state.sh validate "$current_file"
            mapfile -t persisted < <(bash -c '
              set -euo pipefail
              source "$1"
              printf "%s\n" "$RELEASE_SHA" "$PLATFORM_SOURCE_SHA" "$PLATFORM_IMAGE" "$GATEWAY_SOURCE_SHA" "$GATEWAY_IMAGE"
            ' bash "$current_file")
            persisted_release_sha="${persisted[0]:-}"
            persisted_platform_source_sha="${persisted[1]:-}"
            persisted_platform_image="${persisted[2]:-}"
            persisted_gateway_source_sha="${persisted[3]:-}"
            persisted_gateway_image="${persisted[4]:-}"
            [[ "$persisted_release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Persisted release lineage is invalid." >&2; exit 1; }
            git merge-base --is-ancestor "$persisted_release_sha" "$RELEASE_SHA" || {
              echo "Component reuse rejected: persisted release is not in the target protected-main lineage." >&2
              exit 1
            }
          fi

          if [[ "$PLATFORM_CHANGED" == true ]]; then
            platform_source_sha="$PLATFORM_SOURCE_SHA_INPUT"
            platform_image="$PLATFORM_IMAGE_INPUT"
            platform_mode=new
          else
            platform_source_sha="$persisted_platform_source_sha"
            platform_image="$persisted_platform_image"
            platform_mode=reused
          fi
          if [[ "$GATEWAY_CHANGED" == true ]]; then
            gateway_source_sha="$GATEWAY_SOURCE_SHA_INPUT"
            gateway_image="$GATEWAY_IMAGE_INPUT"
            gateway_mode=new
          else
            gateway_source_sha="$persisted_gateway_source_sha"
            gateway_image="$persisted_gateway_image"
            gateway_mode=reused
          fi

          for source_sha in "$platform_source_sha" "$gateway_source_sha"; do
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Resolved component source SHA is invalid." >&2; exit 1; }
            git merge-base --is-ancestor "$source_sha" "$RELEASE_SHA" || {
              echo "Resolved component source SHA is not in the target protected-main lineage." >&2
              exit 1
            }
          done
          [[ "$platform_image" == "${platform_repo}@sha256:"* ]] || { echo "Platform digest is not from the current repository owner/package." >&2; exit 1; }
          [[ "$gateway_image" == "${gateway_repo}@sha256:"* ]] || { echo "Gateway digest is not from the current repository owner/package." >&2; exit 1; }
          [[ "$platform_image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Platform provenance is not immutable." >&2; exit 1; }
          [[ "$gateway_image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Gateway provenance is not immutable." >&2; exit 1; }

          ensure_runtime_image() {
            local image_ref="$1" component="$2"
            if [[ "$image_ref" == *@sha256:* ]] && docker image inspect "$image_ref" >/dev/null 2>&1; then
              echo "Using locally available immutable $component image: $image_ref" >&2
              return 0
            fi
            echo "Pulling $component image: $image_ref" >&2
            docker pull "$image_ref" >/dev/null
          }

          ensure_runtime_image "$platform_image" Platform
          ensure_runtime_image "$gateway_image" Gateway

          platform_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$platform_image")"
          gateway_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$gateway_image")"
          [[ "$platform_revision" == "$platform_source_sha" ]] || { echo "Platform OCI revision does not match resolved Platform source SHA." >&2; exit 1; }
          [[ "$gateway_revision" == "$gateway_source_sha" ]] || { echo "Gateway OCI revision does not match resolved Gateway source SHA." >&2; exit 1; }

          {
            printf 'platform_source_sha=%s\n' "$platform_source_sha"
            printf 'platform_ref=%s\n' "$platform_image"
            printf 'gateway_source_sha=%s\n' "$gateway_source_sha"
            printf 'gateway_ref=%s\n' "$gateway_image"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Immutable staging release identity'
            echo
            echo "- overall release/tooling SHA: \`$RELEASE_SHA\`"
            echo "- Platform ($platform_mode) source SHA: \`$platform_source_sha\`"
            echo "- Platform digest: \`$platform_image\`"
            echo "- Gateway ($gateway_mode) source SHA: \`$gateway_source_sha\`"
            echo "- Gateway digest: \`$gateway_image\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write ephemeral staging environment
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PLATFORM_SOURCE_SHA_RESOLVED: ${{ steps.release_images.outputs.platform_source_sha }}
          GATEWAY_SOURCE_SHA_RESOLVED: ${{ steps.release_images.outputs.gateway_source_sha }}
          PLATFORM_IMAGE_REF: ${{ steps.release_images.outputs.platform_ref }}
          GATEWAY_IMAGE_REF: ${{ steps.release_images.outputs.gateway_ref }}
          GAME_WORLD_HOST_INPUT: ${{ inputs.game_world_host }}
          GAME_WORLD_ID_INPUT: ${{ inputs.game_world_id }}
          NATIVE_WORLD_ID_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_WORLD_ID }}
          NATIVE_ADMISSION_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_ADMISSION_ENABLED }}
          NATIVE_RUNTIME_IDENTITIES_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_RUNTIME_STATUS_IDENTITIES }}
          NATIVE_SCOPE_IDENTITIES_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES }}
          NATIVE_ROUTE_PUBLISH_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_ROUTE_PUBLISH_ENABLED }}
          NATIVE_CHANNEL_KEY_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_CHANNEL_KEY }}
          NATIVE_ROUTE_HOST_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_ROUTE_HOST }}
          NATIVE_ROUTE_PORT_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_ROUTE_PORT }}
          NATIVE_ROUTE_TLS_NAME_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_ROUTE_TLS_SERVER_NAME }}
          NATIVE_ROUTE_LOGIN_INPUT: ${{ vars.OTERYN_STAGING_NATIVE_ROUTE_LOGIN_ENABLED }}
          GAME_WORLD_SLUG_INPUT: ${{ inputs.game_world_slug }}
          GAME_WORLD_NAME_INPUT: ${{ inputs.game_world_name }}
          GAME_WORLD_REGION_INPUT: ${{ inputs.game_world_region }}
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -euo pipefail
          umask 077
          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          source deploy/synology/scripts/lib.sh
          NATIVE_WORLD_ID_INPUT="$(oteryn_native_default OTERYN_STAGING_NATIVE_WORLD_ID "$NATIVE_WORLD_ID_INPUT")"
          NATIVE_ADMISSION_INPUT="$(oteryn_native_default OTERYN_STAGING_NATIVE_ADMISSION_ENABLED "$NATIVE_ADMISSION_INPUT")"
          NATIVE_RUNTIME_IDENTITIES_INPUT="$(oteryn_native_default OTERYN_STAGING_NATIVE_RUNTIME_STATUS_IDENTITIES "$NATIVE_RUNTIME_IDENTITIES_INPUT")"
          NATIVE_SCOPE_IDENTITIES_INPUT="$(oteryn_native_default OTERYN_STAGING_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES "$NATIVE_SCOPE_IDENTITIES_INPUT")"
          app_url="$CANONICAL_PUBLIC_APP_URL"
          release_sha="${RELEASE_SHA:-rollback-placeholder}"
          platform_source_sha="${PLATFORM_SOURCE_SHA_RESOLVED:-rollback-placeholder}"
          gateway_source_sha="${GATEWAY_SOURCE_SHA_RESOLVED:-rollback-placeholder}"
          platform_image="${PLATFORM_IMAGE_REF:-rollback-placeholder}"
          gateway_image="${GATEWAY_IMAGE_REF:-rollback-placeholder}"
          gateway_version="${GATEWAY_SOURCE_SHA_RESOLVED:+sha-$GATEWAY_SOURCE_SHA_RESOLVED}"
          gateway_version="${gateway_version:-rollback}"

          cat > deploy/synology/.env <<EOF
          COMPOSE_PROJECT_NAME=oteryn-staging
          OTERYN_RELEASE_SHA=$release_sha
          PLATFORM_SOURCE_SHA=$platform_source_sha
          GATEWAY_SOURCE_SHA=$gateway_source_sha
          PLATFORM_BIND_ADDRESS=127.0.0.1
          GATEWAY_BIND_ADDRESS=127.0.0.1
          PLATFORM_PORT=8000
          GATEWAY_PORT=8080
          GAME_WORLD_ID=$GAME_WORLD_ID_INPUT
          GAME_WORLD_SLUG=$GAME_WORLD_SLUG_INPUT
          GAME_WORLD_NAME=$GAME_WORLD_NAME_INPUT
          GAME_WORLD_REGION=$GAME_WORLD_REGION_INPUT
          GAME_WORLD_HOST=$GAME_WORLD_HOST_INPUT
          GAME_WORLD_PORT=7172
          PLATFORM_IMAGE=$platform_image
          GATEWAY_IMAGE=$gateway_image
          APP_NAME=Oteryn Platform Staging
          APP_ENV=preproduction
          APP_DEBUG=false
          APP_KEY=$APP_KEY
          APP_URL=$app_url
          LOG_LEVEL=info
          SESSION_SECURE_COOKIE=true
          PLATFORM_DB_NAME=oteryn_platform
          PLATFORM_POSTGRES_SUPERUSER_PASSWORD=$PLATFORM_POSTGRES_SUPERUSER_PASSWORD
          PLATFORM_POSTGRES_OWNER_PASSWORD=$PLATFORM_POSTGRES_OWNER_PASSWORD
          PLATFORM_POSTGRES_APP_PASSWORD=$PLATFORM_POSTGRES_APP_PASSWORD
          PLATFORM_POSTGRES_BACKUP_PASSWORD=$PLATFORM_POSTGRES_BACKUP_PASSWORD
          PLATFORM_POSTGRES_DUMP_PASSWORD=$PLATFORM_POSTGRES_DUMP_PASSWORD
          OTERYN_PLATFORM_SERVICE_TOKEN=$OTERYN_PLATFORM_SERVICE_TOKEN
          GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256=$GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256
          GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256=$GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256
          GATEWAY_VERSION=$gateway_version
          GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_WORLD_ID=$NATIVE_WORLD_ID_INPUT
          OTERYN_NATIVE_ADMISSION_ENABLED=${NATIVE_ADMISSION_INPUT:-false}
          GAME_AUTH_NATIVE_RUNTIME_STATUS_ENABLED=${NATIVE_RUNTIME_IDENTITIES_INPUT:+true}
          GAME_AUTH_NATIVE_RUNTIME_STATUS_IDENTITIES=$NATIVE_RUNTIME_IDENTITIES_INPUT
          GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_ENABLED=${NATIVE_SCOPE_IDENTITIES_INPUT:+true}
          GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES=$NATIVE_SCOPE_IDENTITIES_INPUT
          OTERYN_NATIVE_ROUTE_PUBLISH_ENABLED=${NATIVE_ROUTE_PUBLISH_INPUT:-false}
          OTERYN_NATIVE_CHANNEL_KEY=$NATIVE_CHANNEL_KEY_INPUT
          OTERYN_NATIVE_ROUTE_HOST=$NATIVE_ROUTE_HOST_INPUT
          OTERYN_NATIVE_ROUTE_PORT=$NATIVE_ROUTE_PORT_INPUT
          OTERYN_NATIVE_ROUTE_TLS_SERVER_NAME=$NATIVE_ROUTE_TLS_NAME_INPUT
          OTERYN_NATIVE_ROUTE_LOGIN_ENABLED=${NATIVE_ROUTE_LOGIN_INPUT:-true}
          OTERYN_STATE_DIR=$state_dir
          EOF
          chmod 600 deploy/synology/.env

      - name: Validate cutover inputs
        if: inputs.action == 'cutover'
        env:
          CUTOVER_STEP: ${{ inputs.cutover_step }}
          CUTOVER_TASK_ID: ${{ inputs.task_id }}
          CUTOVER_CLOSE_RUN_ID: ${{ inputs.close_run_id }}
          CUTOVER_AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
          CUTOVER_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          if [[ "$CUTOVER_STEP" != status ]]; then
            [[ "$CUTOVER_TASK_ID" =~ ^OTERYN-[0-9]{8}-[a-z0-9][a-z0-9-]{0,80}$ ]] || { echo "task_id must look like OTERYN-YYYYMMDD-slug." >&2; exit 1; }
          fi
          if [[ "$CUTOVER_STEP" == evidence-* ]]; then
            # evidence-rebegin alone may leave it empty: native-reenable failed before any run of the cutover existed.
            if [[ "$CUTOVER_STEP" != evidence-rebegin || -n "$CUTOVER_EVIDENCE_RUN_ID" ]]; then
              [[ "$CUTOVER_EVIDENCE_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "evidence_run_id must be the attempt evidence run id (UUID)." >&2; exit 1; }
            fi
            [[ "$CUTOVER_CLOSE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]] || { echo "close_run_id is required for an evidence step." >&2; exit 1; }
          else
            [[ -z "$CUTOVER_EVIDENCE_RUN_ID" ]] || { echo "evidence_run_id is only for the evidence steps." >&2; exit 1; }
          fi
          for value in "$CUTOVER_CLOSE_RUN_ID" "$CUTOVER_AUDIT_RUN_ID"; do
            [[ -z "$value" || "$value" =~ ^[1-9][0-9]{0,18}$ ]] || { echo "Run ids must be numeric." >&2; exit 1; }
          done

      # P6a D5 recovery through the provenance hook: close-init closes an unfinished init-intent or resumes a
      # begin, observe writes the late observation of an unclosed attempt, retry writes attempt-intent n+1 after
      # failed-before-witness, rebegin takes a refused or init-late begin again in a new run (without a run id:
      # native-reenable failed before it opened one). Only this job's token is the trusted anchor author, so
      # these never run by hand. A dry run prints the command only.
      - name: Run cutover evidence step
        if: inputs.action == 'cutover' && startsWith(inputs.cutover_step, 'evidence-')
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOVER_STEP: ${{ inputs.cutover_step }}
          CUTOVER_DRY_RUN: ${{ inputs.cutover_dry_run && '1' || '0' }}
          OTERYN_CUTOVER_TASK_ID: ${{ inputs.task_id }}
          OTERYN_CUTOVER_CLOSE_RUN_ID: ${{ inputs.close_run_id }}
          OTERYN_CUTOVER_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          OTERYN_CUTOVER_PROVENANCE_INIT_COMMAND: ${{ vars.OTERYN_STAGING_CUTOVER_PROVENANCE_INIT_COMMAND }}
          OTERYN_CUTOVER_ANCHOR_ISSUE: ${{ vars.OTERYN_STAGING_CUTOVER_ANCHOR_ISSUE }}
          OTERYN_STATE_DIR: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -euo pipefail
          export OTERYN_STATE_DIR="${OTERYN_STATE_DIR:-/var/lib/oteryn-staging-state}"
          hook="$OTERYN_CUTOVER_PROVENANCE_INIT_COMMAND"
          [[ "$hook" == /* && -x "$hook" ]] || { echo "OTERYN_STAGING_CUTOVER_PROVENANCE_INIT_COMMAND must name the executable provenance hook." >&2; exit 1; }
          command="${CUTOVER_STEP#evidence-}"
          args=("$command" "$OTERYN_CUTOVER_TASK_ID" "$OTERYN_CUTOVER_CLOSE_RUN_ID")
          [[ -z "$OTERYN_CUTOVER_EVIDENCE_RUN_ID" ]] || args+=("$OTERYN_CUTOVER_EVIDENCE_RUN_ID")
          if [[ "$CUTOVER_DRY_RUN" == 1 ]]; then
            printf 'DRY RUN: would run %s %s\n' "$hook" "${args[*]}"
            exit 0
          fi
          "$hook" "${args[@]}"

      - name: Run cutover step
        if: inputs.action == 'cutover' && !startsWith(inputs.cutover_step, 'evidence-')
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOVER_STEP: ${{ inputs.cutover_step }}
          OTERYN_CUTOVER_DRY_RUN: ${{ inputs.cutover_dry_run && '1' || '0' }}
          OTERYN_CUTOVER_TASK_ID: ${{ inputs.task_id }}
          OTERYN_CUTOVER_CLOSE_RUN_ID: ${{ inputs.close_run_id }}
          OTERYN_CUTOVER_AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
          OTERYN_CUTOVER_OWNER_GO: ${{ inputs.owner_go_ack }}
          OTERYN_OWNER_DELETE_CONFIRMATION: ${{ inputs.owner_delete_confirmation }}
          OTERYN_OWNER_DELETE_ACK: ${{ inputs.owner_delete_ack }}
          OTERYN_CUTOVER_EVIDENCE_DIR: ${{ runner.temp }}/platform-cutover-gate-evidence
          OTERYN_CUTOVER_PROVENANCE_INIT_COMMAND: ${{ vars.OTERYN_STAGING_CUTOVER_PROVENANCE_INIT_COMMAND }}
          OTERYN_CUTOVER_WEB_SMOKE_COMMAND: ${{ vars.OTERYN_STAGING_CUTOVER_WEB_SMOKE_COMMAND }}
          OTERYN_CUTOVER_NATIVE_SMOKE_COMMAND: ${{ vars.OTERYN_STAGING_CUTOVER_NATIVE_SMOKE_COMMAND }}
          OTERYN_CUTOVER_ANCHOR_ISSUE: ${{ vars.OTERYN_STAGING_CUTOVER_ANCHOR_ISSUE }}
          OTERYN_STATE_DIR: ${{ vars.OTERYN_STAGING_STATE_DIR }}
          # The native smoke actor (native-smoke.sh): an identity without MFA that owns the smoke character.
          # The password reaches only the native-smoke step. Without an actor, native-smoke fails unless the
          # owner waived the successful native login: native_smoke_waiver equal to task_id.
          OTERYN_CUTOVER_NATIVE_SMOKE_EMAIL: ${{ vars.OTERYN_STAGING_CUTOVER_NATIVE_SMOKE_EMAIL }}
          OTERYN_CUTOVER_NATIVE_SMOKE_CHARACTER_ID: ${{ vars.OTERYN_STAGING_CUTOVER_NATIVE_SMOKE_CHARACTER_ID }}
          OTERYN_CUTOVER_NATIVE_SMOKE_PASSWORD: ${{ inputs.cutover_step == 'native-smoke' && secrets.OTERYN_STAGING_CUTOVER_NATIVE_SMOKE_PASSWORD || '' }}
          OTERYN_CUTOVER_NATIVE_SMOKE_WAIVER: ${{ inputs.cutover_step == 'native-smoke' && inputs.native_smoke_waiver || '' }}
        run: |
          set -euo pipefail
          rm -rf -- "$OTERYN_CUTOVER_EVIDENCE_DIR"
          export OTERYN_STATE_DIR="${OTERYN_STATE_DIR:-/var/lib/oteryn-staging-state}"
          # native-reenable records a forward-only marker before its hook runs, so the hook's anchor issue,
          # token and evidence checks run first; they write no evidence.
          if [[ "$CUTOVER_STEP" == native-reenable && "$OTERYN_CUTOVER_DRY_RUN" != 1 ]]; then
            hook="$OTERYN_CUTOVER_PROVENANCE_INIT_COMMAND"
            [[ "$hook" == /* && -x "$hook" ]] || { echo "OTERYN_STAGING_CUTOVER_PROVENANCE_INIT_COMMAND must name the executable provenance hook." >&2; exit 1; }
            "$hook" preflight "$OTERYN_CUTOVER_TASK_ID" "$OTERYN_CUTOVER_CLOSE_RUN_ID"
          fi
          bash deploy/synology/scripts/cutover-postgres.sh "$CUTOVER_STEP"

      - name: Upload cutover gate evidence
        if: inputs.action == 'cutover' && inputs.cutover_dry_run == false && (inputs.cutover_step == 'declare-done' || inputs.cutover_step == 'rollback')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-cutover-gate-evidence
          path: ${{ runner.temp }}/platform-cutover-gate-evidence/gate-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy prebuilt images
        if: inputs.action == 'deploy'
        run: bash deploy/synology/scripts/deploy-impact.sh

      - name: Roll back runtime images
        if: inputs.action == 'rollback'
        run: bash deploy/synology/scripts/rollback.sh

      - name: Remove ephemeral environment file
        if: always()
        run: rm -f deploy/synology/.env

      - name: Log out of GHCR
        if: ${{ always() && (inputs.action != 'cutover' || !inputs.cutover_dry_run) }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true