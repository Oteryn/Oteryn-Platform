name: Engineering Hardening Reconcile

on:
  push:
    branches:
      - fix/engineering-excellence-hardening
    paths:
      - '.github/workflows/engineering-hardening-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: engineering-hardening-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate deterministic Deep Validation edit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deep-system-validation.yml')
          text = workflow.read_text()
          old = 'npm --prefix scripts/acceptance install --no-audit --no-fund'
          new = 'npm --prefix scripts/acceptance ci --no-audit --no-fund'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy acceptance install, found {text.count(old)}')
          workflow.write_text(text.replace(old, new))

          helper = Path('.github/workflows/engineering-hardening-reconcile.yml')
          if not helper.exists():
              raise SystemExit('temporary reconciler is missing')
          helper.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deep-system-validation.yml .github/workflows/engineering-hardening-reconcile.yml
          git diff --cached --check
          test "$(git diff --cached --numstat -- .github/workflows/deep-system-validation.yml | awk '{print $1 ":" $2}')" = '1:1'
          git commit -m 'ci: use locked acceptance install in deep validation'
          generated_sha="$(git rev-parse HEAD)"
          echo "generated_commit=$generated_sha"
          echo "### Generated reconciliation commit" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$generated_sha\`" >> "$GITHUB_STEP_SUMMARY"

          set +e
          git push origin "HEAD:${GITHUB_REF_NAME}"
          push_rc=$?
          set -e
          echo "push_exit_code=$push_rc"
          git cat-file -e "$generated_sha^{commit}"
          exit 0
