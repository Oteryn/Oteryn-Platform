name: Public Domain Deploy Observer

on:
  pull_request:
    paths:
      - '.github/workflows/public-domain-deploy-observer.yml'

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 82abef518f91d72d392db4420bb335773087c3e1
    steps:
      - name: Observe trusted-main image and Synology deployment runs
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 160); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"

            build="$(jq -c '[.workflow_runs[] | select(.event == "push" and .name == "Build Synology Staging Images")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            staging="$(jq -c '[.workflow_runs[] | select(.event == "push" and .name == "Character Bazaar Staging Control")] | sort_by(.created_at) | last // empty' <<<"$runs")"

            if [[ -n "$build" ]]; then
              echo "BUILD $(jq -r '"'"'"id=\(.id) status=\(.status) conclusion=\(.conclusion // "") run_number=\(.run_number)"'"'"' <<<"$build")"
            else
              echo "BUILD not registered yet"
            fi

            if [[ -n "$staging" ]]; then
              echo "STAGING $(jq -r '"'"'"id=\(.id) status=\(.status) conclusion=\(.conclusion // "") run_number=\(.run_number)"'"'"' <<<"$staging")"
            else
              echo "STAGING not registered yet"
            fi

            for item in "$build" "$staging"; do
              if [[ -n "$item" ]]; then
                conclusion="$(jq -r '.conclusion // empty' <<<"$item")"
                case "$conclusion" in
                  failure|cancelled|timed_out|action_required|stale)
                    echo "Observed terminal non-success conclusion: $conclusion" >&2
                    exit 1
                    ;;
                esac
              fi
            done

            if [[ -n "$build" && -n "$staging" \
              && "$(jq -r '.status' <<<"$build")" == completed \
              && "$(jq -r '.conclusion' <<<"$build")" == success \
              && "$(jq -r '.status' <<<"$staging")" == completed \
              && "$(jq -r '.conclusion' <<<"$staging")" == success ]]; then
              build_id="$(jq -r '.id' <<<"$build")"
              staging_id="$(jq -r '.id' <<<"$staging")"
              echo "DEPLOY_OBSERVER_RESULT=PASS"
              echo "BUILD_RUN_ID=$build_id"
              echo "STAGING_RUN_ID=$staging_id"
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${staging_id}/artifacts" \
                --jq '.artifacts[] | "STAGING_ARTIFACT id=\(.id) name=\(.name) expired=\(.expired)"'
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for exact trusted-main image and staging runs." >&2
          exit 1
