name: Playwright PHP 8.5 Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/playwright-runtime-validation.yml'
      - 'deploy/ci/playwright-php.Dockerfile'
      - 'deploy/ci/atlas-playwright-cache-repair.Dockerfile'
      - 'scripts/acceptance/run-playwright-ci.sh'
      - 'scripts/acceptance/package.json'
      - 'scripts/acceptance/tests/helpers.mjs'
      - 'composer.json'
      - 'composer.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/playwright-runtime-validation.yml'
      - 'deploy/ci/playwright-php.Dockerfile'
      - 'deploy/ci/atlas-playwright-cache-repair.Dockerfile'
      - 'scripts/acceptance/run-playwright-ci.sh'
      - 'scripts/acceptance/package.json'
      - 'scripts/acceptance/tests/helpers.mjs'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-php85-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: oteryn-playwright-php85:${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact Laravel checkout and evidence directory
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p \
            artifacts/playwright-runtime \
            bootstrap/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views
          touch database/database.sqlite

      - name: Build retained Playwright PHP runtime
        run: |
          set -euo pipefail
          docker build \
            --progress=plain \
            --file deploy/ci/playwright-php.Dockerfile \
            --tag "$IMAGE_TAG" \
            .
          docker image inspect "$IMAGE_TAG" --format '{{.Id}}' \
            > artifacts/playwright-runtime/image-id.txt

      - name: Verify official-image shell compatibility
        run: |
          set -euo pipefail
          test ! -e scripts/acceptance/node_modules
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$IMAGE_TAG" \
            bash -lc '
              set -euo pipefail
              php -r '\''exit(PHP_VERSION_ID >= 80500 ? 0 : 1);'\''
              cd scripts/acceptance
              npx playwright --version
            ' | tee artifacts/playwright-runtime/shell-passthrough.txt
          test ! -e scripts/acceptance/node_modules

      - name: Install exact repository dependencies through runtime
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env COMPOSER_CACHE_DIR=/tmp/composer-cache \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --entrypoint bash \
            "$IMAGE_TAG" \
            -lc 'composer install --no-interaction --prefer-dist --no-progress'

      - name: Generate application key through runtime
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --entrypoint bash \
            "$IMAGE_TAG" \
            -lc 'php artisan key:generate --force --no-interaction'

      - name: Verify PHP Composer Node and Playwright contract
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env OTERYN_REQUIRE_VENDOR=1 \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$IMAGE_TAG" \
            --verify-only \
            | tee artifacts/playwright-runtime/toolchain.txt

      - name: Launch Chromium Firefox and WebKit
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env OTERYN_REQUIRE_VENDOR=1 \
            --ipc host \
            --shm-size 1g \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$IMAGE_TAG" \
            --runtime-smoke \
            | tee artifacts/playwright-runtime/browser-smoke.txt

      - name: Record exact source identities
        if: always()
        run: |
          set -euo pipefail
          {
            printf 'tested_sha=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
            sha256sum \
              deploy/ci/playwright-php.Dockerfile \
              scripts/acceptance/run-playwright-ci.sh \
              scripts/acceptance/package.json \
              composer.json \
              composer.lock
          } > artifacts/playwright-runtime/source-identities.txt

      - name: Upload Playwright runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-php85-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/playwright-runtime
          if-no-files-found: error
          retention-days: 14

      - name: Remove validation image
        if: always()
        run: docker image rm -f "$IMAGE_TAG" >/dev/null 2>&1 || true

  synology-cache-repair:
    name: Refresh Synology Playwright cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Detect bounded cache-repair helper
        id: helper
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ -f deploy/ci/atlas-playwright-cache-repair.Dockerfile ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'cache_repair=NOT_APPLICABLE helper-absent'
          fi

      - name: Build verify and atomically retag local cache
        if: steps.helper.outputs.active == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_IMAGE='oteryn-playwright-php85'
          TASK_IMAGE="oteryn-atlas-playwright-cache-repair:${GITHUB_SHA}"
          OLD_ID="$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")"
          test -n "$OLD_ID"
          printf 'old_cache_id=%s\n' "$OLD_ID"

          cleanup() {
            docker image rm -f "$TASK_IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            -f deploy/ci/atlas-playwright-cache-repair.Dockerfile \
            -t "$TASK_IMAGE" \
            .

          docker run --rm --ipc host --shm-size 1g \
            -e OTERYN_REQUIRE_VENDOR=0 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TASK_IMAGE" --runtime-smoke

          NEW_ID="$(docker image inspect --format '{{.Id}}' "$TASK_IMAGE")"
          test -n "$NEW_ID"
          docker tag "$TASK_IMAGE" "$BASE_IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")" = "$NEW_ID"
          printf 'new_cache_id=%s\ncache_repair=PASS\n' "$NEW_ID"
