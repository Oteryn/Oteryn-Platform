name: Portal RS E2E Smoke

on:
  pull_request:
    paths:
      - 'portal-rs/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: portal-rs-e2e-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: portal-rs
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the portal with the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked -p oteryn-portal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-e2e-tier-binary
          path: portal-rs/target/debug/oteryn-portal
          retention-days: 1
          if-no-files-found: error

  smoke:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portal-e2e-tier-binary
          path: ${{ runner.temp }}/portal-bin
      - name: Run the smoke manifest
        working-directory: portal-rs/e2e
        env:
          PORTAL_E2E_BINARY: ${{ runner.temp }}/portal-bin/oteryn-portal
        run: |
          chmod +x "$PORTAL_E2E_BINARY"
          bash tiers/ci.sh smoke

  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check the committed coverage baseline
        working-directory: portal-rs/e2e
        run: |
          if [[ ! -f ledger/report.mjs ]]; then
            echo '::notice::E2E coverage ledger is not present on this branch'
            exit 0
          fi
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
          node ledger/report.mjs
