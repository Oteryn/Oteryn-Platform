name: Issue 691 Composer Wave Generator

on:
  pull_request:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - '.github/workflows/issue-691-composer-generate.yml'
      - 'docs/agents/tasks/active/OTERYN-20260811-dependency-refresh.md'

permissions:
  contents: write

concurrency:
  group: issue-691-composer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Composer wave branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup PHP 8.5 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Generate grouped maintenance lockfile
        run: |
          set -euo pipefail
          composer update \
            laravel/framework \
            phpunit/phpunit \
            phpstan/phpstan \
            laravel/pint \
            --with-all-dependencies \
            --no-interaction \
            --no-scripts
          composer validate --strict
          composer audit

      - name: Commit generated lockfile when changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo 'Composer resolution produced no lockfile change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore(deps): generate Issue 691 Composer maintenance wave'
          git push origin "HEAD:${HEAD_REF}"
