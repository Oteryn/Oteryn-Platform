name: Repair Synology Autostart

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-synology-autostart.yml
      - deploy/synology/compose.yml
      - deploy/synology/runner/compose.organization.example.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: synology-staging-deployment
  cancel-in-progress: false

jobs:
  repair:
    name: Enforce Docker restart policies
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    # Environment secrets reach only jobs bound to their environment; without this the PostgreSQL secret
    # count below would always be 0 and the required service would be refused as unconfigured.
    environment: synology-staging
    timeout-minutes: 10
    # Read access only for the checkout of the shared cutover state gate (deploy/synology/scripts/lib.sh).
    permissions:
      contents: read

    steps:
      - name: Checkout the cutover state gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/synology/scripts

      - name: Set persistent services to always restart
        shell: bash
        env:
          # Presence only, never printed: PostgreSQL is the Platform database (plan P7), so all five are required.
          PLATFORM_POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_SUPERUSER_PASSWORD }}
          PLATFORM_POSTGRES_OWNER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_OWNER_PASSWORD }}
          PLATFORM_POSTGRES_APP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_APP_PASSWORD }}
          PLATFORM_POSTGRES_BACKUP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_BACKUP_PASSWORD }}
          PLATFORM_POSTGRES_DUMP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_DUMP_PASSWORD }}
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -Eeuo pipefail

          # PostgreSQL cutover (ADR 0046, plan P6): the stack is deliberately frozen between the
          # freeze and unfreeze steps, so restarting it here would undo the freeze, and after retire-mariadb no
          # mariadb container exists by design. The state is read through the deploy gate's own check
          # (lib.sh oteryn_read_cutover_state): a linked, unsearchable or not owner-only state directory and a
          # state file that is not a regular file, cannot be read or is not a state the cutover script can have
          # written refuse; it is never taken as "no cutover".
          state_root="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          if [[ ! "$state_root" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "OTERYN_STAGING_STATE_DIR must be an absolute simple path." >&2
            exit 1
          fi
          export OTERYN_STATE_DIR="$state_root"
          # shellcheck source=deploy/synology/scripts/lib.sh
          source deploy/synology/scripts/lib.sh
          # lib.sh also wraps docker for deploy.sh; the repair calls the Docker CLI directly.
          unset -f docker
          state_rc=0
          oteryn_read_cutover_state "Autostart repair refused" || state_rc=$?
          case "$state_rc" in
            0) ;;
            3)
              echo "::notice::A PostgreSQL cutover step holds or left ${OTERYN_CUTOVER_STATE_LOCK}; restart policies are left unchanged."
              exit 0
              ;;
            *) exit 1 ;;
          esac
          cutover_state="$OTERYN_CUTOVER_STATE_TEXT"
          cutover_has() { _oteryn_cutover_step_recorded "$cutover_state" "$1"; }
          if cutover_has FREEZE && ! cutover_has UNFROZEN; then
            echo "::notice::The stack is frozen for the PostgreSQL cutover; restart policies are left unchanged until unfreeze."
            exit 0
          fi
          # The freeze writes the bootstrap witness after it stopped the stack and before STEP_FREEZE, and the
          # verified rollback moves the bootstrap state aside, so short of a finished forward cutover
          # (MARIADB_RETIRED, which keeps bootstrap-complete.env) any bootstrap record, in whatever form, or one
          # whose absence cannot be proven, means the cutover owns the stack: an interrupted freeze or rollback is
          # never given restart=always.
          if ! cutover_has MARIADB_RETIRED && bootstrap_record="$(oteryn_cutover_bootstrap_record)"; then
            echo "Autostart repair refused: a PostgreSQL cutover record (${bootstrap_record}) exists (or cannot be ruled out) and no finished cutover (MARIADB_RETIRED) is recorded; the cutover owns the stack until its verified rollback moves the bootstrap state aside. Continue the cutover or finish its rollback first." >&2
            exit 1
          fi
          # MariaDB is retired (plan P7, the cutover retire-mariadb step): compose.yml no longer defines it and
          # no mariadb container is resolved, restarted or given a restart policy here.
          persistent_services=(platform internal-proxy gateway marketplace-scheduler)

          resolve_one() {
            local project="$1"
            local service="$2"
            mapfile -t matches < <(
              docker ps -aq \
                --filter "label=com.docker.compose.project=${project}" \
                --filter "label=com.docker.compose.service=${service}"
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${project}/${service} container, found ${#matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          declare -a containers=()
          containers+=("$(resolve_one oteryn-organization-runners platform)")
          for service in "${persistent_services[@]}"; do
            # One-time rollout: the scheduler is created by the next deployment, so a stack
            # deployed before it became a base service legitimately has none yet.
            if [[ "$service" == marketplace-scheduler ]] && [[ -z "$(docker ps -aq \
                  --filter "label=com.docker.compose.project=oteryn-staging" \
                  --filter "label=com.docker.compose.service=marketplace-scheduler")" ]]; then
              echo "marketplace-scheduler is not created yet; the next deployment creates it."
              continue
            fi
            containers+=("$(resolve_one oteryn-staging "$service")")
          done
          # PostgreSQL is the Platform database since the P6 cutover (plan P7): its five secrets are required, as
          # deploy.sh and health-check.sh require them, and exactly one postgres container must exist.
          configured=0
          for name in PLATFORM_POSTGRES_SUPERUSER_PASSWORD PLATFORM_POSTGRES_OWNER_PASSWORD \
            PLATFORM_POSTGRES_APP_PASSWORD PLATFORM_POSTGRES_BACKUP_PASSWORD PLATFORM_POSTGRES_DUMP_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then configured=$((configured + 1)); fi
          done
          case "$configured" in
            5)
              containers+=("$(resolve_one oteryn-staging postgres)")
              # The backup sidecar (plan P5) belongs to the configured service. One-time rollout: a stack
              # deployed before it existed has none yet, and the next deployment creates it.
              if [[ -z "$(docker ps -aq \
                    --filter "label=com.docker.compose.project=oteryn-staging" \
                    --filter "label=com.docker.compose.service=postgres-backup")" ]]; then
                echo "postgres-backup is not created yet; the next deployment creates it."
              else
                containers+=("$(resolve_one oteryn-staging postgres-backup)")
              fi
              ;;
            *) echo "PostgreSQL is the Platform database but only $configured of its 5 secrets are configured." >&2; exit 1 ;;
          esac

          docker update --restart=always "${containers[@]}" >/dev/null

          for container in "${containers[@]}"; do
            docker start "$container" >/dev/null
          done

          sleep 3
          for container in "${containers[@]}"; do
            policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")"
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            name="$(docker inspect --format '{{.Name}}' "$container")"
            [[ "$policy" == "always" ]]
            case "$state" in
              running|restarting) ;;
              *)
                echo "${name}: unexpected state ${state}" >&2
                exit 1
                ;;
            esac
            printf '%s policy=%s state=%s\n' "$name" "$policy" "$state"
          done
