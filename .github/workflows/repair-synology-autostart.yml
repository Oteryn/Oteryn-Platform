name: Repair Synology Autostart

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-synology-autostart.yml
      - deploy/synology/compose.yml
      - deploy/synology/runner/compose.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: oteryn-synology-autostart-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Enforce Docker restart policies
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Set persistent services to always restart
        shell: bash
        run: |
          set -Eeuo pipefail
          resolve_one() {
            local project="$1"
            local service="$2"
            mapfile -t matches < <(
              docker ps -aq \
                --filter "label=com.docker.compose.project=${project}" \
                --filter "label=com.docker.compose.service=${service}"
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${project}/${service} container, found ${#matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          declare -a containers=()
          containers+=("$(resolve_one oteryn-deploy-runner runner)")
          for service in mariadb redis platform canary internal-proxy gateway; do
            containers+=("$(resolve_one oteryn-staging "$service")")
          done
          docker update --restart=always "${containers[@]}" >/dev/null
          for container in "${containers[@]}"; do docker start "$container" >/dev/null; done
          sleep 3
          for container in "${containers[@]}"; do
            policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")"
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            name="$(docker inspect --format '{{.Name}}' "$container")"
            [[ "$policy" == "always" ]]
            case "$state" in running|restarting) ;; *) echo "${name}: unexpected state ${state}" >&2; exit 1 ;; esac
            printf '%s policy=%s state=%s\n' "$name" "$policy" "$state"
          done

  atlas-current-live-acceptance:
    name: Qualify current Atlas static creatures
    if: github.event_name == 'push'
    needs: repair
    runs-on: oteryn-staging
    timeout-minutes: 35
    env:
      ATLAS_REV: 71e2aca1ac49692751f5d6c59a7126835fe1896a
      PREVIEW_URL: http://192.168.1.2:8097
      CREATURE_SEMANTIC_DIGEST: sha256:01921968a6cb4f6ecea237820a053fc5052aaa1da556851f2c2a60d99890b5e1
    steps:
      - name: Check out exact Platform acceptance runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify current live revision product and exact served bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- atlas-source browser-runtime-context e2e-evidence e2e-targets.json

          git init atlas-source >/dev/null
          git -C atlas-source remote add origin https://github.com/Oteryn/Oteryn-Atlas.git
          git -C atlas-source fetch --depth=1 origin "$ATLAS_REV"
          git -C atlas-source checkout --detach --quiet FETCH_HEAD
          test "$(git -C atlas-source rev-parse HEAD)" = "$ATLAS_REV"

          code="$(curl -fsS -w '%{http_code}' -D /tmp/atlas-current.headers "$PREVIEW_URL/web/fullworld.html" -o /tmp/atlas-current.html)"
          test "$code" = 200
          grep -qi "^X-Oteryn-Atlas-Revision: $ATLAS_REV" /tmp/atlas-current.headers
          cmp atlas-source/web/fullworld.html /tmp/atlas-current.html

          for file in fullworld-creatures.mjs fullworld-search.mjs; do
            curl -fsS "$PREVIEW_URL/web/$file" -o "/tmp/$file"
            cmp "atlas-source/web/$file" "/tmp/$file"
          done

          curl -fsS "$PREVIEW_URL/data/creatures/index.json" -o /tmp/atlas-current-index.json
          curl -fsS "$PREVIEW_URL/data/creatures/search.json" -o /tmp/atlas-current-search.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          index = json.loads(Path('/tmp/atlas-current-index.json').read_text(encoding='utf-8'))
          search_raw = Path('/tmp/atlas-current-search.json').read_bytes()
          search = json.loads(search_raw)
          assert index['counts'] == {'records': 88633, 'chunks': 5746, 'search_records': 1945}
          assert index['source']['contract_id'] == 'oteryn-game-atlas-export-v1'
          assert index['source']['capability'] == 'static-creatures-v1'
          assert index['source']['semantic_digest'] == 'sha256:01921968a6cb4f6ecea237820a053fc5052aaa1da556851f2c2a60d99890b5e1'
          assert index['search_bytes'] == len(search_raw)
          assert index['search_digest'] == 'sha256:' + hashlib.sha256(search_raw).hexdigest()
          records = search['records']
          assert len(records) == 1945
          targets = {}
          for kind in ('npc', 'monster'):
              item = next(record for record in records if record['kind'] == kind)
              targets[kind] = {
                  'kind': kind,
                  'label': item['label'],
                  'record_id': item['record_id'],
                  'position': item['position'],
              }
          Path('e2e-targets.json').write_text(json.dumps(targets, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('current-live-creature-product=PASS')
          PY

          curl -fsS -D /tmp/atlas-range.headers -H 'Range: bytes=100-199' \
            "$PREVIEW_URL/fullworld/publication/semantic/world.json" -o /tmp/atlas-range.bin
          grep -q '^HTTP/1.1 206' /tmp/atlas-range.headers
          grep -qi '^Content-Range: bytes 100-199/' /tmp/atlas-range.headers
          test "$(wc -c < /tmp/atlas-range.bin)" -eq 100
          echo 'live-http-and-bytes=PASS'

      - name: Build bounded prebuilt Chromium runtime
        id: browser
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p browser-runtime-context
          cp deploy/ci/playwright-chromium.Dockerfile browser-runtime-context/Dockerfile
          cp scripts/acceptance/package.json browser-runtime-context/package.json
          image="oteryn-atlas-current-e2e:${GITHUB_RUN_ID}"
          DOCKER_BUILDKIT=0 docker build -t "$image" browser-runtime-context
          docker run --rm --ipc host --shm-size 1g --entrypoint node "$image" -e '
            const { chromium } = require("/opt/oteryn-playwright/node_modules/@playwright/test");
            (async () => { const b = await chromium.launch({headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]}); console.log(`chromium-runtime=${b.version()}`); await b.close(); })().catch(e=>{console.error(e);process.exit(1)});
          '
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Run live desktop and mobile Chromium E2E
        id: e2e
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
        run: |
          set -Eeuo pipefail
          mkdir -p e2e-evidence
          docker run --rm --network host --ipc host --shm-size 1g \
            --entrypoint node \
            -e "PREVIEW_URL=$PREVIEW_URL" \
            -e "ATLAS_REV=$ATLAS_REV" \
            -e "CREATURE_SEMANTIC_DIGEST=$CREATURE_SEMANTIC_DIGEST" \
            -v "$PWD/scripts/acceptance/atlas-creature-preview-e2e.cjs:/e2e.cjs:ro" \
            -v "$PWD/e2e-targets.json:/targets.json:ro" \
            -v "$PWD/e2e-evidence:/evidence" \
            "$BROWSER_IMAGE" /e2e.cjs | tee e2e-evidence/browser.log
          grep -Fx 'desktop=PASS' e2e-evidence/browser.log
          grep -Fx 'mobile=PASS' e2e-evidence/browser.log
          grep -F '"status": "PASS"' e2e-evidence/result.json
          echo 'live-e2e=PASS'

      - name: Publish bounded browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-current-live-e2e-${{ github.run_id }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup task-owned execution resources
        if: always()
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$BROWSER_IMAGE" ]]; then docker image rm -f "$BROWSER_IMAGE" >/dev/null 2>&1 || true; fi
          rm -rf -- atlas-source browser-runtime-context e2e-targets.json
          echo 'cleanup=PASS'

      - name: Report current-live acceptance result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -u
          body="Atlas current-live acceptance run $GITHUB_RUN_ID: **$JOB_STATUS**. Platform SHA: $GITHUB_SHA. Atlas: $ATLAS_REV. E2E: $E2E_OUTCOME. Endpoint: $PREVIEW_URL/web/fullworld.html. No cutover/downgrade is performed by this job."
          payload="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Oteryn/Oteryn-Platform/issues/1191/comments \
            -d "$payload" >/dev/null || echo 'WARNING: acceptance result comment could not be posted'
