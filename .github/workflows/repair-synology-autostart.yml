name: Repair Synology Autostart

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-synology-autostart.yml
      - deploy/synology/compose.yml
      - deploy/synology/runner/compose.organization.example.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: synology-staging-deployment
  cancel-in-progress: false

jobs:
  repair:
    name: Enforce Docker restart policies
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    # Environment secrets reach only jobs bound to their environment; without this the PostgreSQL secret
    # count below would always be 0 and a configured service would be silently ignored.
    environment: synology-staging
    timeout-minutes: 10

    steps:
      - name: Set persistent services to always restart
        shell: bash
        env:
          # Presence only, never printed: the durable desired-state signal for the idle PostgreSQL service.
          PLATFORM_POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_SUPERUSER_PASSWORD }}
          PLATFORM_POSTGRES_OWNER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_OWNER_PASSWORD }}
          PLATFORM_POSTGRES_APP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_APP_PASSWORD }}
          PLATFORM_POSTGRES_BACKUP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_BACKUP_PASSWORD }}
          PLATFORM_POSTGRES_DUMP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_DUMP_PASSWORD }}
        run: |
          set -Eeuo pipefail

          resolve_one() {
            local project="$1"
            local service="$2"
            mapfile -t matches < <(
              docker ps -aq \
                --filter "label=com.docker.compose.project=${project}" \
                --filter "label=com.docker.compose.service=${service}"
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${project}/${service} container, found ${#matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          declare -a containers=()
          containers+=("$(resolve_one oteryn-organization-runners platform)")
          for service in mariadb platform internal-proxy gateway marketplace-scheduler; do
            # One-time rollout: the scheduler is created by the next deployment, so a stack
            # deployed before it became a base service legitimately has none yet.
            if [[ "$service" == marketplace-scheduler ]] && [[ -z "$(docker ps -aq \
                  --filter "label=com.docker.compose.project=oteryn-staging" \
                  --filter "label=com.docker.compose.service=marketplace-scheduler")" ]]; then
              echo "marketplace-scheduler is not created yet; the next deployment creates it."
              continue
            fi
            containers+=("$(resolve_one oteryn-staging "$service")")
          done
          # The idle PostgreSQL service (plan P4) is desired exactly when its five secrets are configured, never
          # because a container exists: after the documented rollback the stopped container is kept for
          # postgres_data and must not be restarted or given restart=always here.
          configured=0
          for name in PLATFORM_POSTGRES_SUPERUSER_PASSWORD PLATFORM_POSTGRES_OWNER_PASSWORD \
            PLATFORM_POSTGRES_APP_PASSWORD PLATFORM_POSTGRES_BACKUP_PASSWORD PLATFORM_POSTGRES_DUMP_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then configured=$((configured + 1)); fi
          done
          case "$configured" in
            0)
              echo "PostgreSQL is not configured; any stopped postgres container is retired and left alone."
              # A RUNNING postgres service without its secrets is drift or a lost configuration, not "disabled".
              # The same holds for its backup sidecar (plan P5).
              for pg_service in postgres postgres-backup; do
                if [[ -n "$(docker ps -q \
                      --filter "label=com.docker.compose.project=oteryn-staging" \
                      --filter "label=com.docker.compose.service=${pg_service}")" ]]; then
                  echo "A ${pg_service} container is running but the PostgreSQL secrets are not configured." >&2
                  exit 1
                fi
              done
              ;;
            5)
              containers+=("$(resolve_one oteryn-staging postgres)")
              # The backup sidecar (plan P5) belongs to the configured service. One-time rollout: a stack
              # deployed before it existed has none yet, and the next deployment creates it.
              if [[ -z "$(docker ps -aq \
                    --filter "label=com.docker.compose.project=oteryn-staging" \
                    --filter "label=com.docker.compose.service=postgres-backup")" ]]; then
                echo "postgres-backup is not created yet; the next deployment creates it."
              else
                containers+=("$(resolve_one oteryn-staging postgres-backup)")
              fi
              ;;
            *) echo "PostgreSQL secrets are partially configured ($configured of 5)." >&2; exit 1 ;;
          esac

          docker update --restart=always "${containers[@]}" >/dev/null

          for container in "${containers[@]}"; do
            docker start "$container" >/dev/null
          done

          sleep 3
          for container in "${containers[@]}"; do
            policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")"
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            name="$(docker inspect --format '{{.Name}}' "$container")"
            [[ "$policy" == "always" ]]
            case "$state" in
              running|restarting) ;;
              *)
                echo "${name}: unexpected state ${state}" >&2
                exit 1
                ;;
            esac
            printf '%s policy=%s state=%s\n' "$name" "$policy" "$state"
          done
