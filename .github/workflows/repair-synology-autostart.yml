name: Repair Synology Autostart

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-synology-autostart.yml
      - deploy/synology/compose.yml
      - deploy/synology/runner/compose.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: oteryn-synology-autostart-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Enforce Docker restart policies
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Set persistent services to always restart
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_one() {
            local project="$1"
            local service="$2"
            mapfile -t matches < <(
              docker ps -aq \
                --filter "label=com.docker.compose.project=${project}" \
                --filter "label=com.docker.compose.service=${service}"
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${project}/${service} container, found ${#matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          declare -a containers=()
          containers+=("$(resolve_one oteryn-deploy-runner runner)")
          for service in mariadb redis platform canary internal-proxy gateway; do
            containers+=("$(resolve_one oteryn-staging "$service")")
          done

          docker update --restart=always "${containers[@]}" >/dev/null

          for container in "${containers[@]}"; do
            docker start "$container" >/dev/null
          done

          sleep 3
          for container in "${containers[@]}"; do
            policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")"
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            name="$(docker inspect --format '{{.Name}}' "$container")"
            [[ "$policy" == "always" ]]
            case "$state" in
              running|restarting) ;;
              *)
                echo "${name}: unexpected state ${state}" >&2
                exit 1
                ;;
            esac
            printf '%s policy=%s state=%s\n' "$name" "$policy" "$state"
          done

  atlas-creature-preview:
    name: Deploy Atlas static creatures once
    if: github.event_name == 'push'
    needs: repair
    runs-on: oteryn-staging
    timeout-minutes: 45
    env:
      ATLAS_REV: ffb09ad6e78487fe6be5fa2f0c3a18a9a3cefc92
      GAME_REV: 1ce7c60714dbd5d87da16d2eb0b8eac0c30c2282
      LEGACY_REV: e417c5e7c22986bf4acef0495eb47f7b72c97cce
      INITIAL_CREATURE_REV: cefbafe518e2d3bea150a88bf9d025bd8a1e474d
      PREVIOUS_MINIMAP_REV: 95c02ded6b8793b68effacb995f206fa462b42f9
      PREVIOUS_FIRSTPAINT_REV: f99605a69981d9a1d2bca523aec3dff67a31e175
      PREVIOUS_G5_REV: eee941de6d8b9b0d2217556a7a87f76ba67b602e
      PREVIOUS_MOBILE_REV: e462396a931652a62f61ca4e32c2402dfad9504a
      PREVIEW_CONTAINER: oteryn-atlas-fullworld-preview
      PREVIEW_URL: http://192.168.1.2:8097
      EXPECTED_IMAGE: ghcr.io/nginx/nginx-unprivileged:1.31.3-alpine3.24-slim@sha256:22f839c5fb4007dc24d203a170a9e03fc185d660bfefc34ac6823a7aef085cbc
      CREATURE_SEMANTIC_DIGEST: sha256:01921968a6cb4f6ecea237820a053fc5052aaa1da556851f2c2a60d99890b5e1
      PUBLICATION_ROOT: sha256:9d0d2f3bb16a5a90f9b51a21366e4ed42963f5cb12366c404a20d9502ec4857f
      SEMANTIC_ROOT: sha256:27d7a83a7d9f498ea614b440ab4216cae5e6d11ea0527482410e40948cade5a9
      PIXEL_ROOT: sha256:8b8228fcc4574903e547cb7d65b96f3d45e5a9e67045091c1bceb6e54d3690ad
      OVERVIEW_ROOT: sha256:17683912d6758796d80a5b1647e2d0031f6849e51c40ae5264da6cfce3f9d6db
      RUNTIME_ROOT: sha256:fa30ae5fc47f0ca8a6d482ed87b5db2cd74f32f7f523df16187ca719b8e04f08
      PIXEL_BUCKET_ROOT: sha256:99cf23b01a0d652ff670a994a2b80cbef8d17036f514522d47f1aa98352d3116
      MINIMAP_ROOT: sha256:23f4d2c3901673fb38980e2600828145a6d0626c0e44d1d9f5ca23bfbce02268

    steps:
      - name: Build exact Game creature export and deterministic Atlas index
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- atlas game legacy creature-export.json creature-index-a creature-index-b e2e-targets.json e2e-evidence platform-runtime

          fetch_exact() {
            local directory="$1"
            local repository="$2"
            local revision="$3"
            git init "$directory" >/dev/null
            git -C "$directory" remote add origin "$repository"
            git -C "$directory" fetch --depth=1 origin "$revision"
            git -C "$directory" checkout --detach --quiet FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          }

          fetch_exact atlas https://github.com/Oteryn/Oteryn-Atlas.git "$ATLAS_REV"
          fetch_exact game https://github.com/Oteryn/Oteryn-Game.git "$GAME_REV"

          git init legacy >/dev/null
          git -C legacy remote add origin https://github.com/blakinio/Otheryn.git
          git -C legacy sparse-checkout init --cone
          git -C legacy fetch --depth=1 --filter=blob:none origin "$LEGACY_REV"
          git -C legacy checkout --detach --quiet FETCH_HEAD
          git -C legacy sparse-checkout set \
            vendor/map-analysis/crystalserver/data-global/world \
            vendor/map-analysis/crystalserver/data-global/npc \
            vendor/map-analysis/crystalserver/data-global/monster
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_REV"

          if find atlas -type f \( -name '*.otbm' -o -name '*.otb' -o -name '*.spr' -o -name '*.dat' \) -print -quit | grep -q .; then
            echo 'Forbidden raw legacy/proprietary runtime input found in Atlas checkout.' >&2
            exit 1
          fi

          DATA_ROOT="legacy/vendor/map-analysis/crystalserver/data-global"
          test -d "$DATA_ROOT/world"
          test -d "$DATA_ROOT/npc"
          test -d "$DATA_ROOT/monster"
          python3 game/tools/game-atlas-creatures/export.py \
            "$DATA_ROOT/world" \
            "$DATA_ROOT/npc" \
            "$DATA_ROOT/monster" \
            creature-export.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('creature-export.json').read_text(encoding='utf-8'))
          assert data['contract_id'] == 'oteryn-game-atlas-export-v1'
          assert data['capability'] == 'static-creatures-v1'
          assert data['coordinate_profile'] == 'oteryn-native-floor-v1'
          assert data['legacy_evidence']['repository'] == 'blakinio/Otheryn'
          assert data['legacy_evidence']['sha'] == 'e417c5e7c22986bf4acef0495eb47f7b72c97cce'
          assert data['semantic_digest'] == 'sha256:01921968a6cb4f6ecea237820a053fc5052aaa1da556851f2c2a60d99890b5e1'
          assert data['statistics']['npcs'] == 1068
          assert data['statistics']['monster_spawns'] == 87565
          assert data['statistics']['unresolved'] == 461
          assert data['statistics']['ambiguous'] == 5
          assert len(data['npcs']) + len(data['monster_spawns']) == 88633
          print('game-creature-export=PASS')
          PY

          # Raw migration evidence is never retained as an Atlas publication/runtime input.
          rm -rf -- legacy

          python3 atlas/tools/build-creature-index.py creature-export.json creature-index-a
          python3 atlas/tools/build-creature-index.py creature-export.json creature-index-b
          diff -qr creature-index-a creature-index-b

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('creature-index-a')
          index = json.loads((root / 'index.json').read_text(encoding='utf-8'))
          search_bytes = (root / 'search.json').read_bytes()
          search = json.loads(search_bytes)
          assert index['counts'] == {'records': 88633, 'chunks': 5746, 'search_records': 1945}
          assert index['source']['contract_id'] == 'oteryn-game-atlas-export-v1'
          assert index['source']['capability'] == 'static-creatures-v1'
          assert index['source']['semantic_digest'] == 'sha256:01921968a6cb4f6ecea237820a053fc5052aaa1da556851f2c2a60d99890b5e1'
          assert index['source']['legacy_evidence']['sha'] == 'e417c5e7c22986bf4acef0495eb47f7b72c97cce'
          assert index['search_bytes'] == len(search_bytes)
          assert index['search_digest'] == 'sha256:' + hashlib.sha256(search_bytes).hexdigest()
          assert len(search['records']) == 1945
          assert sum(record['kind'] == 'npc' for record in search['records']) == 995
          assert sum(record['kind'] == 'monster' for record in search['records']) == 950
          assert all(record.get('record_id', '').startswith(('npc:', 'monster:')) for record in search['records'])

          factual = {}
          for entry in index['chunks']:
              path = root / entry['path']
              raw = path.read_bytes()
              assert len(raw) == entry['bytes']
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == entry['digest']
              payload = json.loads(raw)
              for record in payload['records']:
                  if record.get('origin') == 'base-map' and record.get('resolution_state') == 'RESOLVED':
                      factual[record['record_id']] = record

          targets = {}
          for item in search['records']:
              record = factual.get(item['record_id'])
              if record is None:
                  continue
              kind = item['kind']
              if kind not in targets:
                  targets[kind] = {
                      'kind': kind,
                      'label': item['label'],
                      'record_id': item['record_id'],
                      'position': item['position'],
                  }
              if {'npc', 'monster'} <= set(targets):
                  break
          assert {'npc', 'monster'} <= set(targets)
          Path('e2e-targets.json').write_text(json.dumps(targets, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('atlas-creature-index=PASS targets=' + json.dumps(targets, sort_keys=True))
          PY

          rm -rf -- creature-index-b

      - name: Prepare exact Platform Chromium acceptance runtime
        id: browser
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- platform-runtime
          git init platform-runtime >/dev/null
          git -C platform-runtime remote add origin https://github.com/Oteryn/Oteryn-Platform.git
          git -C platform-runtime fetch --depth=1 origin "$GITHUB_SHA"
          git -C platform-runtime checkout --detach --quiet FETCH_HEAD
          test "$(git -C platform-runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test -s platform-runtime/scripts/acceptance/atlas-creature-preview-e2e.cjs

          rm -rf -- browser-runtime-context
          mkdir -p browser-runtime-context
          cp platform-runtime/deploy/ci/playwright-chromium.Dockerfile browser-runtime-context/Dockerfile
          cp platform-runtime/scripts/acceptance/package.json browser-runtime-context/package.json

          TASK_IMAGE="oteryn-atlas-creature-e2e:${GITHUB_RUN_ID}"
          DOCKER_BUILDKIT=0 docker build \
            -t "$TASK_IMAGE" \
            browser-runtime-context
          docker run --rm --ipc host --shm-size 1g \
            --entrypoint node \
            "$TASK_IMAGE" -e '
              const { chromium } = require("/opt/oteryn-playwright/node_modules/@playwright/test");
              (async () => {
                const browser = await chromium.launch({
                  headless: true,
                  args: ["--no-sandbox", "--disable-dev-shm-usage"],
                });
                console.log(`chromium-runtime=${browser.version()}`);
                await browser.close();
              })().catch((error) => { console.error(error); process.exit(1); });
            '
          printf 'image=%s\nowned=true\n' "$TASK_IMAGE" >> "$GITHUB_OUTPUT"
          echo "playwright-runtime=PASS image=$TASK_IMAGE owned=true chromium-only=true"

      - name: Inspect live preview and stage exact Atlas revision
        id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$PREVIEW_CONTAINER"
          STAGED=0
          REVISIONS=''
          NEW_ROOT=''
          HELPER_IMAGE=''
          cleanup_stage() {
            rc=$?
            set +e
            if [[ "$STAGED" = 1 && -n "$REVISIONS" && -n "$NEW_ROOT" && -n "$HELPER_IMAGE" ]]; then
              name="$(basename "$NEW_ROOT")"
              docker run --rm --user 0:0 --entrypoint sh \
                -e NAME="$name" -v "$REVISIONS:/revisions" "$HELPER_IMAGE" \
                -c 'rm -rf "/revisions/$NAME"' >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap cleanup_stage ERR

          docker version >/dev/null
          curl --version >/dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$C")" = true

          CURRENT_REV="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")"
          OLD_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas"}}{{.Source}}{{end}}{{end}}' "$C")"
          OLD_CONFIG="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}' "$C")"
          EXPLICIT_DATA_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/data"}}{{.Source}}{{end}}{{end}}' "$C")"
          OLD_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$C")"
          HELPER_IMAGE="$(docker inspect --format '{{.Image}}' "$C")"
          OLD_PUB="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.publication-root" }}' "$C")"
          OLD_RUNTIME="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.runtime-index-root" }}' "$C")"
          OLD_DATA_REV="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.data-revision" }}' "$C")"

          case "$CURRENT_REV" in
            "$ATLAS_REV"|"$INITIAL_CREATURE_REV"|"$PREVIOUS_MINIMAP_REV"|"$PREVIOUS_FIRSTPAINT_REV"|"$PREVIOUS_G5_REV"|"$PREVIOUS_MOBILE_REV") ;;
            *) echo "Unexpected live Atlas revision: $CURRENT_REV" >&2; exit 1 ;;
          esac
          test "$OLD_IMAGE" = "$EXPECTED_IMAGE"
          test "$OLD_PUB" = "$PUBLICATION_ROOT"
          test "$OLD_RUNTIME" = "$RUNTIME_ROOT"
          test -n "$OLD_ROOT"
          test -n "$OLD_CONFIG"
          test -n "$HELPER_IMAGE"
          docker port "$C" 8080/tcp | grep -Fx '192.168.1.2:8097' >/dev/null
          curl -fsS -D /tmp/atlas-preflight.headers "$PREVIEW_URL/web/fullworld.html" -o /dev/null
          grep -qi "^X-Oteryn-Atlas-Revision: $CURRENT_REV" /tmp/atlas-preflight.headers

          if [[ -n "$EXPLICIT_DATA_ROOT" ]]; then
            DATA_ROOT="$EXPLICIT_DATA_ROOT"
            OLD_DATA_EXPLICIT=1
          else
            DATA_ROOT="$OLD_ROOT/data"
            OLD_DATA_EXPLICIT=0
          fi
          REVISIONS="$(dirname "$OLD_ROOT")"
          NEW_ROOT="$REVISIONS/$ATLAS_REV"

          docker run --rm --user 0:0 --entrypoint sh \
            -v "$DATA_ROOT:/data:ro" "$HELPER_IMAGE" -c '
              set -eu
              test -s /data/fullworld-publication-v0-final/publication.json
              test -s /data/fullworld-publication-v0-final/semantic/world.json
              test -s /data/fullworld-publication-v0-final/pixels/manifest.json
              test -s /data/fullworld-runtime-index-v2-worldchunk/world.json
              test -s /data/fullworld-layers-v0/overview/world.json
              test -s /data/fullworld-pixel-buckets-v2/manifest.json
            '

          MINIMAP_SOURCE_REV="$(docker run --rm --user 0:0 --entrypoint sh \
            -e CURRENT_REV="$CURRENT_REV" -e PREVIOUS_MINIMAP_REV="$PREVIOUS_MINIMAP_REV" -e MINIMAP_ROOT="$MINIMAP_ROOT" \
            -v "$REVISIONS:/revisions:ro" "$HELPER_IMAGE" -c '
              set -eu
              if test -s "/revisions/$CURRENT_REV/minimap-product/world.json" && grep -F "$MINIMAP_ROOT" "/revisions/$CURRENT_REV/minimap-product/world.json" >/dev/null; then
                printf "%s" "$CURRENT_REV"
              elif test -s "/revisions/$PREVIOUS_MINIMAP_REV/minimap-product/world.json" && grep -F "$MINIMAP_ROOT" "/revisions/$PREVIOUS_MINIMAP_REV/minimap-product/world.json" >/dev/null; then
                printf "%s" "$PREVIOUS_MINIMAP_REV"
              else
                echo "verified minimap product is unavailable" >&2
                exit 1
              fi
            ')"
          test -n "$MINIMAP_SOURCE_REV"

          if [[ "$CURRENT_REV" != "$ATLAS_REV" ]]; then
            users="$(for id in $(docker ps -aq); do docker inspect --format '{{.Name}} {{range .Mounts}}{{.Source}} {{end}}' "$id"; done | grep -F "$NEW_ROOT" || true)"
            test -z "$users"
            STAGED=1

            tar --exclude=.git -C atlas -cf - . | docker run --rm -i --user 0:0 --entrypoint sh \
              -e REV="$ATLAS_REV" -v "$REVISIONS:/revisions" "$HELPER_IMAGE" -c '
                set -eu
                root="/revisions/$REV"
                rm -rf "$root"
                mkdir -p "$root/repo/data/creatures" "$root/data"
                tar -xf - -C "$root/repo"
                printf "%s\n" "$REV" > "$root/ATLAS_REVISION"
              '

            tar -C creature-index-a -cf - . | docker run --rm -i --user 0:0 --entrypoint sh \
              -e REV="$ATLAS_REV" -v "$REVISIONS:/revisions" "$HELPER_IMAGE" -c '
                set -eu
                mkdir -p "/revisions/$REV/repo/data/creatures"
                tar -xf - -C "/revisions/$REV/repo/data/creatures"
              '

            docker run --rm --user 0:0 --entrypoint sh \
              -e REV="$ATLAS_REV" -e SRC="$MINIMAP_SOURCE_REV" \
              -v "$REVISIONS:/revisions" "$HELPER_IMAGE" -c '
                set -eu
                rm -rf "/revisions/$REV/minimap-product"
                cp -a "/revisions/$SRC/minimap-product" "/revisions/$REV/minimap-product"
              '

            cat > atlas-nginx.conf <<EOF
          server {
              listen 8080;
              server_name _;
              root /srv/atlas/repo;
              index fullworld.html;
              gzip off;

              default_type application/octet-stream;
              types {
                  text/html html;
                  text/css css;
                  application/javascript js mjs;
                  application/json json;
                  image/png png;
                  image/svg+xml svg;
                  application/octet-stream rgba jsonl;
              }

              add_header X-Content-Type-Options nosniff always;
              add_header Referrer-Policy no-referrer always;
              add_header X-Frame-Options SAMEORIGIN always;
              add_header Cache-Control no-store always;
              add_header X-Oteryn-Atlas-Revision $ATLAS_REV always;

              location = /healthz { default_type text/plain; return 200 "ok\n"; }
              location = / { return 302 /web/fullworld.html; }

              location /fullworld/publication/ { alias /srv/atlas/data/fullworld-publication-v0-final/; }
              location /fullworld/overview/ { alias /srv/atlas/data/fullworld-layers-v0/overview/; }
              location /fullworld/runtime-index/ { alias /srv/atlas/data/fullworld-runtime-index-v2-worldchunk/; }
              location /fullworld/pixel-buckets/ { alias /srv/atlas/data/fullworld-pixel-buckets-v2/; }
              location /fullworld/minimap/ { alias /srv/atlas/minimap-product/; }

              location / { try_files \$uri \$uri/ =404; }
          }
          EOF
            cat atlas-nginx.conf | docker run --rm -i --user 0:0 --entrypoint sh \
              -e REV="$ATLAS_REV" -v "$REVISIONS:/revisions" "$HELPER_IMAGE" \
              -c 'set -eu; cat > "/revisions/$REV/nginx.conf"; chmod 0644 "/revisions/$REV/nginx.conf"'
          fi

          docker run --rm --user 0:0 --entrypoint sh \
            -e REV="$ATLAS_REV" -e MINIMAP_ROOT="$MINIMAP_ROOT" -e CREATURE_SEMANTIC_DIGEST="$CREATURE_SEMANTIC_DIGEST" \
            -v "$REVISIONS:/revisions:ro" "$HELPER_IMAGE" -c '
              set -eu
              test -s "/revisions/$REV/repo/web/fullworld.html"
              test -s "/revisions/$REV/repo/web/fullworld-creatures.mjs"
              test -s "/revisions/$REV/repo/data/creatures/index.json"
              test -s "/revisions/$REV/repo/data/creatures/search.json"
              test -s "/revisions/$REV/minimap-product/world.json"
              grep -F "$MINIMAP_ROOT" "/revisions/$REV/minimap-product/world.json" >/dev/null
              grep -F "$CREATURE_SEMANTIC_DIGEST" "/revisions/$REV/repo/data/creatures/index.json" >/dev/null
            '

          trap - ERR
          STAGED=0
          {
            echo "current_rev=$CURRENT_REV"
            echo "old_root=$OLD_ROOT"
            echo "old_config=$OLD_CONFIG"
            echo "old_image=$OLD_IMAGE"
            echo "helper_image=$HELPER_IMAGE"
            echo "data_root=$DATA_ROOT"
            echo "old_data_explicit=$OLD_DATA_EXPLICIT"
            echo "old_data_rev=$OLD_DATA_REV"
            echo "revisions=$REVISIONS"
            echo "new_root=$NEW_ROOT"
            echo "minimap_source_rev=$MINIMAP_SOURCE_REV"
          } >> "$GITHUB_OUTPUT"

      - name: Cut over and run live desktop mobile Chromium acceptance with exact rollback
        id: deploy
        shell: bash
        env:
          CURRENT_REV: ${{ steps.stage.outputs.current_rev }}
          OLD_ROOT: ${{ steps.stage.outputs.old_root }}
          OLD_CONFIG: ${{ steps.stage.outputs.old_config }}
          OLD_IMAGE: ${{ steps.stage.outputs.old_image }}
          HELPER_IMAGE: ${{ steps.stage.outputs.helper_image }}
          DATA_ROOT: ${{ steps.stage.outputs.data_root }}
          OLD_DATA_EXPLICIT: ${{ steps.stage.outputs.old_data_explicit }}
          OLD_DATA_REV: ${{ steps.stage.outputs.old_data_rev }}
          REVISIONS: ${{ steps.stage.outputs.revisions }}
          NEW_ROOT: ${{ steps.stage.outputs.new_root }}
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
        run: |
          set -Eeuo pipefail
          C="$PREVIEW_CONTAINER"
          CUTOVER=0
          rollback() {
            rc=$?
            set +e
            if [[ "$CUTOVER" = 1 ]]; then
              docker rm -f "$C" >/dev/null 2>&1 || true
              args=(
                docker run -d
                --name "$C"
                --restart unless-stopped
                --label org.oteryn.preview=fullworld-atlas
                --label "org.oteryn.revision=$CURRENT_REV"
                --label "org.oteryn.publication-root=$PUBLICATION_ROOT"
                --label "org.oteryn.runtime-index-root=$RUNTIME_ROOT"
                -p 192.168.1.2:8097:8080
                -v "$OLD_ROOT:/srv/atlas:ro"
              )
              if [[ -n "$OLD_DATA_REV" ]]; then
                args+=(--label "org.oteryn.data-revision=$OLD_DATA_REV")
              fi
              if [[ "$OLD_DATA_EXPLICIT" = 1 ]]; then
                args+=(-v "$DATA_ROOT:/srv/atlas/data:ro")
              fi
              args+=(
                -v "$OLD_CONFIG:/etc/nginx/conf.d/default.conf:ro"
                "$OLD_IMAGE"
              )
              "${args[@]}" >/dev/null || true
              name="$(basename "$NEW_ROOT")"
              docker run --rm --user 0:0 --entrypoint sh \
                -e NAME="$name" -v "$REVISIONS:/revisions" "$HELPER_IMAGE" \
                -c 'rm -rf "/revisions/$NAME"' >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          if [[ "$CURRENT_REV" != "$ATLAS_REV" ]]; then
            docker rm -f "$C" >/dev/null
            CUTOVER=1
            docker run -d \
              --name "$C" \
              --restart unless-stopped \
              --label org.oteryn.preview=fullworld-atlas \
              --label "org.oteryn.revision=$ATLAS_REV" \
              --label "org.oteryn.data-revision=$CURRENT_REV" \
              --label "org.oteryn.publication-root=$PUBLICATION_ROOT" \
              --label "org.oteryn.semantic-root=$SEMANTIC_ROOT" \
              --label "org.oteryn.pixel-root=$PIXEL_ROOT" \
              --label "org.oteryn.overview-root=$OVERVIEW_ROOT" \
              --label "org.oteryn.runtime-index-root=$RUNTIME_ROOT" \
              --label "org.oteryn.pixel-bucket-root=$PIXEL_BUCKET_ROOT" \
              --label "org.oteryn.minimap-root=$MINIMAP_ROOT" \
              --label "org.oteryn.creature-semantic-digest=$CREATURE_SEMANTIC_DIGEST" \
              -p 192.168.1.2:8097:8080 \
              -v "$NEW_ROOT:/srv/atlas:ro" \
              -v "$DATA_ROOT:/srv/atlas/data:ro" \
              -v "$NEW_ROOT/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              "$OLD_IMAGE" >/dev/null
          fi

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "$PREVIEW_URL/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          test "$(docker inspect --format '{{.State.Running}}' "$C")" = true
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")" = "$ATLAS_REV"
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.publication-root" }}' "$C")" = "$PUBLICATION_ROOT"
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.runtime-index-root" }}' "$C")" = "$RUNTIME_ROOT"
          test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$C")" = unless-stopped
          docker port "$C" 8080/tcp | grep -Fx '192.168.1.2:8097' >/dev/null

          curl -fsS -D /tmp/atlas-html.headers "$PREVIEW_URL/web/fullworld.html" -o /tmp/atlas-live.html
          grep -q 'HTTP/1.1 200' /tmp/atlas-html.headers
          grep -qi "^X-Oteryn-Atlas-Revision: $ATLAS_REV" /tmp/atlas-html.headers
          cmp atlas/web/fullworld.html /tmp/atlas-live.html
          for path in \
            web/fullworld-creatures.mjs \
            web/fullworld-minimap.mjs \
            src/browser/loader.mjs; do
            curl -fsS "$PREVIEW_URL/$path" -o "/tmp/atlas-live-$(basename "$path")"
            cmp "atlas/$path" "/tmp/atlas-live-$(basename "$path")"
          done

          curl -fsS "$PREVIEW_URL/data/creatures/index.json" -o /tmp/atlas-creature-index.json
          curl -fsS "$PREVIEW_URL/data/creatures/search.json" -o /tmp/atlas-creature-search.json
          cmp creature-index-a/index.json /tmp/atlas-creature-index.json
          cmp creature-index-a/search.json /tmp/atlas-creature-search.json
          FIRST_CHUNK="$(python3 -c 'import json; print(json.load(open("creature-index-a/index.json"))["chunks"][0]["path"])')"
          curl -fsS "$PREVIEW_URL/data/creatures/$FIRST_CHUNK" -o /tmp/atlas-creature-chunk.json
          cmp "creature-index-a/$FIRST_CHUNK" /tmp/atlas-creature-chunk.json

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          index = json.loads(Path('/tmp/atlas-creature-index.json').read_text())
          search = Path('/tmp/atlas-creature-search.json').read_bytes()
          assert index['counts'] == {'records': 88633, 'chunks': 5746, 'search_records': 1945}
          assert index['source']['semantic_digest'] == 'sha256:01921968a6cb4f6ecea237820a053fc5052aaa1da556851f2c2a60d99890b5e1'
          assert index['search_bytes'] == len(search)
          assert index['search_digest'] == 'sha256:' + hashlib.sha256(search).hexdigest()
          print('served-creature-product=PASS')
          PY

          curl -fsS -D /tmp/atlas-range.headers \
            -H 'Range: bytes=100-199' \
            "$PREVIEW_URL/fullworld/publication/semantic/chunks/fm000007_rxp000126_ryp000125.jsonl" \
            -o /tmp/atlas-range.bin
          grep -q 'HTTP/1.1 206' /tmp/atlas-range.headers
          grep -qi '^Content-Range: bytes 100-199/72681462' /tmp/atlas-range.headers
          test "$(stat -c '%s' /tmp/atlas-range.bin)" = 100

          curl -fsS "$PREVIEW_URL/fullworld/publication/publication.json" -o /tmp/atlas-publication.json
          curl -fsS "$PREVIEW_URL/fullworld/publication/semantic/world.json" -o /tmp/atlas-semantic-world.json
          curl -fsS "$PREVIEW_URL/fullworld/publication/pixels/manifest.json" -o /tmp/atlas-pixels.json
          curl -fsS "$PREVIEW_URL/fullworld/overview/world.json" -o /tmp/atlas-overview.json
          curl -fsS "$PREVIEW_URL/fullworld/runtime-index/world.json" -o /tmp/atlas-runtime.json
          curl -fsS "$PREVIEW_URL/fullworld/pixel-buckets/manifest.json" -o /tmp/atlas-buckets.json
          curl -fsS "$PREVIEW_URL/fullworld/minimap/world.json" -o /tmp/atlas-minimap.json
          grep -F "$PUBLICATION_ROOT" /tmp/atlas-publication.json >/dev/null
          grep -F "$SEMANTIC_ROOT" /tmp/atlas-semantic-world.json >/dev/null
          grep -F "$PIXEL_ROOT" /tmp/atlas-pixels.json >/dev/null
          grep -F "$OVERVIEW_ROOT" /tmp/atlas-overview.json >/dev/null
          grep -F "$RUNTIME_ROOT" /tmp/atlas-runtime.json >/dev/null
          grep -F "$PIXEL_BUCKET_ROOT" /tmp/atlas-buckets.json >/dev/null
          grep -F "$MINIMAP_ROOT" /tmp/atlas-minimap.json >/dev/null

          rm -rf -- e2e-evidence
          mkdir -p e2e-evidence
          docker run --rm \
            --network host \
            --ipc host \
            --shm-size 1g \
            --entrypoint node \
            -e "PREVIEW_URL=$PREVIEW_URL" \
            -e "ATLAS_REV=$ATLAS_REV" \
            -e "CREATURE_SEMANTIC_DIGEST=$CREATURE_SEMANTIC_DIGEST" \
            -v "$PWD/platform-runtime/scripts/acceptance/atlas-creature-preview-e2e.cjs:/e2e.cjs:ro" \
            -v "$PWD/e2e-targets.json:/targets.json:ro" \
            -v "$PWD/e2e-evidence:/evidence" \
            "$BROWSER_IMAGE" /e2e.cjs | tee e2e-evidence/browser.log
          grep -Fx 'desktop=PASS' e2e-evidence/browser.log >/dev/null
          grep -Fx 'mobile=PASS' e2e-evidence/browser.log >/dev/null
          test -s e2e-evidence/result.json
          test -s e2e-evidence/desktop-initial.png
          test -s e2e-evidence/desktop-npc-only.png
          test -s e2e-evidence/mobile-monster-only.png
          grep -F '"status": "PASS"' e2e-evidence/result.json >/dev/null
          grep -F "$ATLAS_REV" e2e-evidence/result.json >/dev/null
          grep -F "$CREATURE_SEMANTIC_DIGEST" e2e-evidence/result.json >/dev/null

          trap - ERR
          CUTOVER=0
          echo 'status=PASS' >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_PASS revision=$ATLAS_REV game=$GAME_REV endpoint=$PREVIEW_URL/web/fullworld.html"

      - name: Publish bounded browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-creature-preview-e2e-${{ github.run_id }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup task-owned execution resources
        id: cleanup
        if: always()
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
          BROWSER_IMAGE_OWNED: ${{ steps.browser.outputs.owned }}
        run: |
          set -Eeuo pipefail
          if [[ "$BROWSER_IMAGE_OWNED" = true && -n "$BROWSER_IMAGE" ]]; then
            docker image rm -f "$BROWSER_IMAGE" >/dev/null
          fi

          candidate='oteryn-atlas-fullworld-candidate'
          if docker inspect "$candidate" >/dev/null 2>&1; then
            candidate_port="$(docker port "$candidate" 8080/tcp 2>/dev/null || true)"
            candidate_rev="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$candidate" 2>/dev/null || true)"
            candidate_mounts="$(docker inspect --format '{{range .Mounts}}{{.Source}} {{end}}' "$candidate")"
            if [[ "$candidate_port" = '192.168.1.2:8098' && ( "$candidate_rev" = "$INITIAL_CREATURE_REV" || "$candidate_mounts" == *"$INITIAL_CREATURE_REV"* ) ]]; then
              docker rm -f "$candidate" >/dev/null
              echo 'removed-task-owned-candidate=PASS'
            else
              echo 'Unowned candidate container detected; refusing destructive cleanup.' >&2
              exit 1
            fi
          fi

          rm -rf -- \
            atlas game legacy platform-runtime browser-runtime-context \
            creature-export.json creature-index-a creature-index-b \
            e2e-targets.json atlas-nginx.conf
          echo 'cleanup=PASS'

      - name: Report terminal Atlas creature deployment result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -u
          body="Atlas creature preview run $GITHUB_RUN_ID: **$JOB_STATUS**. Platform SHA: $GITHUB_SHA. Atlas: $ATLAS_REV. Game: $GAME_REV. Semantic digest: $CREATURE_SEMANTIC_DIGEST. Deploy/E2E: $DEPLOY_OUTCOME. Cleanup: $CLEANUP_OUTCOME. Endpoint: $PREVIEW_URL/web/fullworld.html. Expected census: 1,068 NPC + 87,565 monster/spawn = 88,633; 5,746 shards; 1,945 search records."
          payload="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Oteryn/Oteryn-Platform/issues/1191/comments \
            -d "$payload" >/dev/null || echo 'WARNING: deployment result comment could not be posted'
