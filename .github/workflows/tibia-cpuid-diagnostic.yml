name: Tibia CPUID Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-cpuid-diagnostic.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  cpuid:
    name: Read-only CPUID diagnostic
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify live client container without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null

      - name: Read uname virtualization and CPUID only
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          uname -a
          systemd-detect-virt || true

          cleanup() { rm -f /tmp/cpuid_diag /tmp/cpuid_diag.c /tmp/cpuid_leaf1.txt /tmp/cpuid_leaf40000000.txt; }
          trap cleanup EXIT

          if command -v cpuid >/dev/null 2>&1; then
            cpuid -1 -r -l 1 > /tmp/cpuid_leaf1.txt
            cpuid -1 -r -l 0x40000000 > /tmp/cpuid_leaf40000000.txt
            python3 - <<'PY'
import re, struct

def regs(path):
    s=open(path,'r',encoding='utf-8',errors='replace').read()
    vals={}
    for k in ('eax','ebx','ecx','edx'):
        m=re.search(rf'\b{k}=0x([0-9a-fA-F]+)', s)
        if not m:
            raise SystemExit(f'missing {k} in {path}')
        vals[k]=int(m.group(1),16)
    return vals
r1=regs('/tmp/cpuid_leaf1.txt')
rh=regs('/tmp/cpuid_leaf40000000.txt')
v=struct.pack('<III', rh['ebx'], rh['ecx'], rh['edx']).split(b'\0',1)[0].decode('ascii','replace')
print(f"cpuid.1.ecx.hypervisor={(r1['ecx'] >> 31) & 1}")
print(f"cpuid.40000000.max=0x{rh['eax']:x}")
print(f"cpuid.40000000.vendor={v}")
PY
          elif command -v gcc >/dev/null 2>&1; then
            cat >/tmp/cpuid_diag.c <<'C'
#include <stdio.h>
#include <cpuid.h>
int main(void) {
  unsigned a,b,c,d;
  char v[13]={0};
  __cpuid(1,a,b,c,d);
  printf("cpuid.1.ecx.hypervisor=%u\n", (c >> 31) & 1);
  __cpuid(0x40000000,a,b,c,d);
  *(unsigned*)&v[0]=b;
  *(unsigned*)&v[4]=c;
  *(unsigned*)&v[8]=d;
  printf("cpuid.40000000.max=0x%x\n", a);
  printf("cpuid.40000000.vendor=%s\n", v);
}
C
            gcc -O2 -o /tmp/cpuid_diag /tmp/cpuid_diag.c
            /tmp/cpuid_diag
          else
            echo CPUID_UNAVAILABLE=true
            exit 2
          fi
          INNER
