name: Audit Security Lock Refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audit-security-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Refresh only the vulnerable Guzzle package
        run: |
          set -euo pipefail
          composer update guzzlehttp/guzzle --with-dependencies --no-interaction --no-scripts --prefer-dist --no-progress
          composer validate --strict
          composer audit --locked --no-interaction
          php -r '$lock=json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "guzzlehttp/guzzle") { fwrite(STDOUT, $package["version"].PHP_EOL); exit(version_compare($package["version"], "7.15.2", ">=") ? 0 : 1); } } exit(2);'

      - name: Upload validated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: audit-security-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
