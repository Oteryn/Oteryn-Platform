name: Downloads Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/Downloads/**'
      - 'app/Http/Controllers/Downloads/**'
      - 'app/Http/Requests/Downloads/**'
      - 'config/downloads.php'
      - 'resources/views/downloads/**'
      - 'resources/views/admin/downloads/**'
      - 'resources/views/admin/translations/form.blade.php'
      - 'routes/modules/downloads.php'
      - 'routes/localization.php'
      - 'scripts/acceptance/package.json'
      - 'scripts/acceptance/playwright.config.mjs'
      - 'scripts/acceptance/seed-downloads-state.php'
      - 'scripts/acceptance/tests/downloads-lifecycle-acceptance.spec.mjs'
      - 'scripts/acceptance/tests/downloads-public-portability.spec.mjs'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'
      - '.github/workflows/downloads-acceptance.yml'
  push:
    branches:
      - main
    paths:
      - 'app/Downloads/**'
      - 'app/Http/Controllers/Downloads/**'
      - 'app/Http/Requests/Downloads/**'
      - 'config/downloads.php'
      - 'resources/views/downloads/**'
      - 'resources/views/admin/downloads/**'
      - 'resources/views/admin/translations/form.blade.php'
      - 'routes/modules/downloads.php'
      - 'routes/localization.php'
      - 'scripts/acceptance/package.json'
      - 'scripts/acceptance/playwright.config.mjs'
      - 'scripts/acceptance/seed-downloads-state.php'
      - 'scripts/acceptance/tests/downloads-lifecycle-acceptance.spec.mjs'
      - 'scripts/acceptance/tests/downloads-public-portability.spec.mjs'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'
      - '.github/workflows/downloads-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downloads-lifecycle:
    name: Complete Downloads lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: acceptance-ci-root-not-a-secret
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-downloads
      ACCEPTANCE_RUN_SUFFIX: downloads
      ACCEPTANCE_ZERO_RETRIES: '1'
      ACCEPTANCE_BASE_URL: http://127.0.0.1:8080
      ACCEPTANCE_MAILHOG_URL: http://127.0.0.1:8025
      ACCEPTANCE_OUTPUT_DIR: /tmp/oteryn-downloads-acceptance
      APP_ENV: acceptance
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8080
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: info
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      SESSION_HTTP_ONLY: 'true'
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: ''
      MAIL_FROM_ADDRESS: acceptance@staging.oteryn
      MAIL_FROM_NAME: Oteryn Acceptance
      DOWNLOADS_ALLOWED_ARTIFACT_HOSTS: downloads.example.test
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_platform_acceptance
      DB_USERNAME: root
      DB_PASSWORD: acceptance-ci-root-not-a-secret
      CANARY_DB_HOST: 127.0.0.1
      CANARY_DB_PORT: 3306
      CANARY_DB_DATABASE: canary_acceptance
      CANARY_DB_USERNAME: oteryn_acceptance_readonly
      CANARY_DB_PASSWORD: acceptance-ci-readonly-not-a-secret
      CANARY_PROVISIONING_DB_HOST: 127.0.0.1
      CANARY_PROVISIONING_DB_PORT: 3306
      CANARY_PROVISIONING_DB_DATABASE: canary_acceptance
      CANARY_PROVISIONING_DB_USERNAME: oteryn_acceptance_provisioning
      CANARY_PROVISIONING_DB_PASSWORD: acceptance-ci-provisioning-not-a-secret
      CANARY_CHARACTER_CREATE_DB_HOST: 127.0.0.1
      CANARY_CHARACTER_CREATE_DB_PORT: 3306
      CANARY_CHARACTER_CREATE_DB_DATABASE: canary_acceptance
      CANARY_CHARACTER_CREATE_DB_USERNAME: oteryn_acceptance_character_create
      CANARY_CHARACTER_CREATE_DB_PASSWORD: acceptance-ci-character-not-a-secret
      CANARY_RUNTIME_REDIS_CLIENT: phpredis
      CANARY_RUNTIME_REDIS_SCHEME: tcp
      CANARY_RUNTIME_REDIS_HOST: 127.0.0.1
      CANARY_RUNTIME_REDIS_PORT: 6379
      CANARY_RUNTIME_REDIS_DB: 0
      CANARY_RUNTIME_REDIS_USERNAME: oteryn_acceptance_runtime
      CANARY_RUNTIME_REDIS_PASSWORD: acceptance-ci-runtime-not-a-secret
      MARIADB_ROOT_PASSWORD: acceptance-ci-root-not-a-secret

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, redis, gd
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install acceptance system clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client redis-tools

      - name: Install application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install pinned browser harnesses
        run: |
          npm --prefix scripts/acceptance install --no-audit --no-fund
          cd scripts/acceptance
          npx playwright install --with-deps chromium firefox webkit

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Provision isolated production-like dependencies
        run: bash scripts/acceptance/bootstrap-production-like.sh

      - name: Start exact-SHA Laravel HTTP runtime
        run: |
          mkdir -p artifacts/acceptance
          php artisan serve --host=127.0.0.1 --port=8080 >/tmp/oteryn-downloads-server.log 2>&1 &
          echo $! >/tmp/oteryn-downloads-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oteryn-downloads-server.log >&2 || true
          exit 1

      - name: Execute complete zero-retry Downloads lifecycle
        run: npm --prefix scripts/acceptance run test:downloads

      - name: Execute bounded read-only Firefox and WebKit portability
        run: npm --prefix scripts/acceptance run test:downloads-portability

      - name: Write non-secret Downloads evidence
        if: always()
        run: |
          mkdir -p artifacts/acceptance
          cat > artifacts/acceptance/downloads-lifecycle-evidence.json <<JSON
          {
            "exact_tested_sha": "$ACCEPTANCE_SHA",
            "profile": "downloads-lifecycle",
            "browsers": ["chromium-primary", "portability-firefox", "portability-webkit"],
            "viewports": ["desktop-1440x1000", "tablet-820x1180", "mobile-390x844"],
            "retries": 0,
            "runtime": "real Laravel HTTP",
            "platform_database": "MariaDB 11.8 isolated acceptance schema",
            "artifact_policy": "direct approved HTTPS metadata only; no upload, fetch or proxy",
            "production_claim": "none"
          }
          JSON

      - name: Upload secret-safe Downloads evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downloads-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance
          if-no-files-found: warn
          retention-days: 7
