name: Format MFA QR

on:
  pull_request:
    paths:
      - .github/workflows/format-mfa-qr.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260726-mfa-qr-enrollment
      - name: Install locked dependencies in an isolated container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            composer:2.8 \
            install --no-interaction --no-progress --ignore-platform-reqs
      - name: Apply repository formatter in an isolated container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            composer:2.8 \
            php vendor/bin/pint
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app tests
          if git diff --cached --quiet; then
            echo 'No formatter changes were required.'
            exit 0
          fi
          git commit -m 'style(identity): apply repository formatting'
          git push origin HEAD:feat/OTERYN-20260726-mfa-qr-enrollment
