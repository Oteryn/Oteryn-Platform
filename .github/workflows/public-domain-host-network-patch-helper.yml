name: Public Domain Host Network Patch Helper

on:
  pull_request:
    paths:
      - '.github/workflows/public-domain-host-network-patch-helper.yml'
      - 'tools/public-domain-host-network-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/OTERYN-20260801-host-network-health-check
      EXPECTED_SHA: b249e5e9cb864ba01376efb273be323b90bcd500
    steps:
      - name: Verify exact target branch
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          [[ "$current" == "$EXPECTED_SHA" ]] || {
            echo "Target branch moved; refusing patch." >&2
            exit 1
          }

      - name: Checkout exact target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch deterministic patch script
        shell: bash
        env:
          HELPER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/contents/tools/public-domain-host-network-patch.py?ref=${HELPER_SHA}" \
            --jq '.content' | tr -d '\n' | base64 -d > /tmp/public-domain-host-network-patch.py

      - name: Apply and validate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/public-domain-host-network-patch.py
          git diff --check
          bash -n deploy/synology/scripts/health-check.sh

      - name: Commit exact repair to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/character-bazaar-staging-control.yml \
            .github/workflows/character-bazaar-staging-validation.yml \
            deploy/synology/scripts/health-check.sh \
            tests/Feature/SynologyStagingNetworkBoundaryTest.php
          git commit -m 'fix(deploy): probe host loopback from host network'
          git push origin "HEAD:${TARGET_BRANCH}"
