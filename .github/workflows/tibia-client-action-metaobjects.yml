name: Tibia Action Metaobjects

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-action-metaobjects.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  meta:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Resolve Qt metaobjects for outbound handlers
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          python3 - "$bin" <<'PY'
import sys, struct, subprocess, re
p=sys.argv[1]
data=open(p,'rb').read()
targets={
 'TPlayerMovementGameActionHandler':0x1cad880,
 'TGenericGameActionHandler':0x1cacf80,
 'TCreaturesGameActionHandler':0x1cacfc0,
 'TUseWithGameActionHandler':0x1cad360,
 'TChatGameActionHandler':0x1cad7c0,
 'TGameActionRouter':0x1c8de40,
 'TInternalGameActionRouter':0x1c8e180,
 'TProtocolClientMessageProcessor':0x1cac3e0,
 'TProtocolWriter':0x1cac340,
}
# Section mapping VA -> file offset
sec=subprocess.check_output(['readelf','-WS',p],text=True,errors='replace')
sections=[]
for line in sec.splitlines():
 m=re.search(r'\[\s*\d+\]\s+(\S+)\s+\S+\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',line)
 if m:
  name,va,off,size=m.group(1),*(int(m.group(i),16) for i in range(2,5))
  sections.append((name,va,off,size))
def va_to_off(va):
 for name,sva,off,size in sections:
  if sva <= va < sva+size:
   return off+(va-sva),name
 return None,None
rel=subprocess.check_output(['readelf','-rW',p],text=True,errors='replace')
for name,va in targets.items():
 print(f'=== {name} STRING_VA=0x{va:x} ===')
 off,secname=va_to_off(va); print(f'STRING_FILE_OFF={off} SECTION={secname}')
 needle=struct.pack('<Q',va)
 occ=[]; start=0
 while True:
  i=data.find(needle,start)
  if i<0: break
  occ.append(i); start=i+1
 print('RAW_PTR_FILE_OFFSETS='+' '.join(hex(x) for x in occ[:40]))
 # relocations that name the exact addend/address
 hits=[ln for ln in rel.splitlines() if re.search(rf'\b{va:x}\b',ln,re.I)]
 print('RELOC_HITS='+str(len(hits)))
 for ln in hits[:40]: print(ln)
 # dump every raw-pointer neighbourhood as qwords and map file offsets to section
 for i in occ[:8]:
  s=max(0,i-64); e=min(len(data),i+96)
  print(f'PTR_NEAR file=0x{i:x}')
  for pos in range(s-(s%8), e, 8):
   q=struct.unpack_from('<Q',data,pos)[0]
   _,sn=va_to_off(q)
   if q or abs(pos-i)<=16: print(f'  file+0x{pos:x}: 0x{q:x} -> {sn or "-"}')
PY
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
