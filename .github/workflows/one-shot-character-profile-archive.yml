name: One-shot Character Profile Task Archive

on:
  pull_request:
    branches:
      - chore/OTERYN-20260729-character-profile-preferences-archive
    paths:
      - '.archive-trigger-character-profile'

permissions:
  contents: write

concurrency:
  group: one-shot-character-profile-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v7
        with:
          ref: chore/OTERYN-20260729-character-profile-preferences-archive
          fetch-depth: 0

      - name: Archive completed task
        run: python tools/agents/archive_character_profile_preferences.py

      - name: Validate checkpoint and governance
        run: |
          python tools/agents/checkpoint.py docs/agents/tasks/archive/OTERYN-20260729-character-profile-preferences.md --require-checkpoint
          python tools/agents/checkpoint.py --tasks docs/agents/tasks/active --require-checkpoint
          python tools/agents/test_checkpoint.py

      - name: Commit archive and remove one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-character-profile-archive.yml
          rm -f tools/agents/archive_character_profile_preferences.py
          rm -rf tools/agents/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/agents .github/workflows/one-shot-character-profile-archive.yml tools/agents/archive_character_profile_preferences.py
          git commit -m 'docs(agents): archive character profile preference task'
          git push origin HEAD:chore/OTERYN-20260729-character-profile-preferences-archive
