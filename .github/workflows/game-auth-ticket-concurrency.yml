name: Game Auth Ticket Concurrency

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/agents/PLATFORM_AGENT_BOOTSTRAP.md'
      - 'docs/agents/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read

concurrency:
  group: game-auth-ticket-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.classify.outputs.ci }}
      phase7: ${{ steps.classify.outputs.phase7 }}
      edge: ${{ steps.classify.outputs.edge }}
      db_outage: ${{ steps.classify.outputs.db_outage }}
      game_auth_concurrency: ${{ steps.classify.outputs.game_auth_concurrency }}
      classes: ${{ steps.classify.outputs.classes }}
      paths_json: ${{ steps.classify.outputs.paths_json }}
    steps:
      - name: Checkout exact classification range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate change classifier
        run: python tests/ci/test_classify_changes.py

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/ci/classify_changes.py               --base "$BASE_SHA"               --head "$HEAD_SHA"               --github-output "$GITHUB_OUTPUT"               --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/ci/classify_changes.py               --all               --github-output "$GITHUB_OUTPUT"               --summary "$GITHUB_STEP_SUMMARY"
          fi

  concurrency-proof:
    needs: classify_changes
    if: ${{ always() && (needs.classify_changes.result != 'success' || needs.classify_changes.outputs.game_auth_concurrency == 'true' || contains(needs.classify_changes.outputs.paths_json, 'app/CharacterProfiles/') || contains(needs.classify_changes.outputs.paths_json, 'tests/Feature/CharacterProfiles/Concurrency/')) }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: oteryn-concurrency-root
          MARIADB_DATABASE: oteryn_concurrency
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_concurrency
      DB_USERNAME: root
      DB_PASSWORD: oteryn-concurrency-root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      GAME_AUTH_CONCURRENCY_TEST: 1
      CHARACTER_PROFILE_CONCURRENCY_TEST: 1
    steps:
      - name: Require successful change classification
        if: ${{ needs.classify_changes.result != 'success' }}
        run: |
          echo "Change classification failed; this required gate is failing closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, pcntl
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run independent-process MariaDB game auth concurrency proof
        run: php artisan test --filter=GameTicketConcurrencyTest

      - name: Run independent-process MariaDB character profile concurrency proof
        run: php artisan test tests/Feature/CharacterProfiles/Concurrency/CharacterProfilePreferenceConcurrencyTest.php
