name: OTS native producer repair runner

on:
  push:
    branches:
      - feat/OTS-20260804-native-protocol-single-version-producer
    paths:
      - .github/workflows/ots-native-producer-repair-runner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/OTS-20260804-native-protocol-single-version-producer
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Extract and execute repair
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/ots-native-producer-repair.yml').read_text(encoding='utf-8')
          block = source.split('        run: |\n', 1)[1].split('      - name: Format sources\n', 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          target = Path('/tmp/ots_native_producer_repair.py')
          target.write_text(script, encoding='utf-8')
          subprocess.run(['python', str(target)], check=True)
      - name: Format sources
        shell: bash
        run: |
          gofmt -w services/game-gateway/internal
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint app/GameAuth/Worlds app/Http/Controllers/GameAuth/GameLoginContextController.php database/migrations/2026_08_05_130000_migrate_native_protocol_identity_to_version.php tests/Feature/GameAuth
      - name: Commit repaired producer for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app database services tests
          git commit -m 'fix(native): preserve Canary profile isolation'
          git push origin HEAD:feat/OTS-20260804-native-protocol-single-version-producer
      - name: Test Platform migration registry and API
        run: php artisan test tests/Feature/GameAuth/GameLoginContextApiTest.php tests/Feature/GameAuth/WorldRegistryTest.php
      - name: Test Game Gateway
        working-directory: services/game-gateway
        run: go test ./...
