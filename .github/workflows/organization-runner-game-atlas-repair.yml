name: Organization Runner Game And Atlas Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/organization-runner-game-atlas-repair.yml

permissions:
  contents: read

concurrency:
  group: organization-runner-game-atlas-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Game registration and seal Atlas token
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'infra/issue-1199-organization-runner-bootstrap' &&
      github.actor == 'blakinio'
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    timeout-minutes: 15
    env:
      ORG_ADMIN_TOKEN: ${{ secrets.OTERYN_ORG_RUNNER_ADMIN_TOKEN }}
      ORG: Oteryn
      COMPOSE_PROJECT: oteryn-organization-runners
      COMPOSE_FILE: deploy/synology/runner/compose.organization.example.yml
      STATE_HOST_ROOT: /volume1/docker/oteryn/state
      STATE_RUNNER_ROOT: /var/lib/oteryn-staging-state

    steps:
      - name: Guard exact Platform control route
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ runner.name }}' = 'oteryn-synology-platform'
          test -S /var/run/docker.sock
          test -d "$STATE_RUNNER_ROOT"
          test -n "$ORG_ADMIN_TOKEN"
          echo 'platform-control-route=PASS'

      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Repair Game and force-recreate Game and Atlas with steady-state token files
        shell: bash
        run: |
          set -Eeuo pipefail
          API=https://api.github.com
          API_VERSION=2026-03-10
          STEADY_RUNNER_DIR="$STATE_RUNNER_ROOT/.organization-runner-tokens"
          STEADY_HOST_DIR="$STATE_HOST_ROOT/.organization-runner-tokens"
          GAME=oteryn-organization-runners-game-1
          ATLAS=oteryn-organization-runners-atlas-1

          api() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $ORG_ADMIN_TOKEN" \
              -H "X-GitHub-Api-Version: $API_VERSION" "$@"
          }

          assert_identity() {
            local container="$1" service="$2"
            docker inspect "$container" >/dev/null
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")" = "$COMPOSE_PROJECT"
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container")" = "$service"
          }

          wait_helper() {
            local helper="$1" i state code
            for i in $(seq 1 90); do
              state="$(docker inspect --format '{{.State.Status}}' "$helper")"
              if [[ "$state" == exited ]]; then
                code="$(docker inspect --format '{{.State.ExitCode}}' "$helper")"
                test "$code" = 0
                return 0
              fi
              [[ "$state" == running || "$state" == created ]] || return 1
              sleep 1
            done
            echo "helper-timeout=$helper" >&2
            return 1
          }

          check_runner_file() {
            local volume="$1" image="$2" tag="$3" helper="oteryn-runner-check-${tag}-${GITHUB_RUN_ID}"
            docker rm -f "$helper" >/dev/null 2>&1 || true
            docker create --name "$helper" --network none --read-only \
              --mount "type=volume,src=$volume,dst=/runner,readonly" \
              --entrypoint /bin/bash "$image" -ec 'test -s /runner/.runner && test -s /runner/.credentials' >/dev/null
            docker start "$helper" >/dev/null
            wait_helper "$helper"
            docker rm "$helper" >/dev/null
          }

          verify_runner() {
            local group="$1" repo="$2" name="$3" label="$4" groups runners gid runner in_group selected
            groups="$(api "$API/orgs/$ORG/actions/runner-groups?per_page=100")"
            runners="$(api "$API/orgs/$ORG/actions/runners?per_page=100")"
            gid="$(jq -er --arg group "$group" '.runner_groups[] | select(.name == $group) | .id' <<< "$groups")"
            runner="$(jq -cer --arg name "$name" '.runners[] | select(.name == $name)' <<< "$runners")"
            jq -e --arg label "$label" '.status == "online" and (.labels | length == 1) and (.labels[0].name == $label)' <<< "$runner" >/dev/null
            in_group="$(api "$API/orgs/$ORG/actions/runner-groups/$gid/runners?per_page=100" | jq -r --arg name "$name" '[.runners[]? | select(.name == $name)] | length')"
            test "$in_group" = 1
            selected="$(api "$API/orgs/$ORG/actions/runner-groups/$gid/repositories?per_page=100")"
            test "$(jq -r '.total_count' <<< "$selected")" = 1
            test "$(jq -er '.repositories[0].full_name' <<< "$selected")" = "$repo"
            echo "runner=$name group=$group label=$label status=online selected_repo=$repo"
          }

          wait_online() {
            local name="$1" i status
            for i in $(seq 1 120); do
              status="$(api "$API/orgs/$ORG/actions/runners?per_page=100" | jq -r --arg name "$name" '.runners[]? | select(.name == $name) | .status' | head -n1)"
              [[ "$status" == online ]] && return 0
              sleep 3
            done
            echo "runner-online-timeout=$name" >&2
            return 1
          }

          cleanup_old_token() {
            local source="$1" service="$2" local_source rel
            [[ "$source" == "$STEADY_HOST_DIR/$service.token" ]] && return 0
            case "$source" in
              "$STATE_HOST_ROOT"/.runner-bootstrap/*/"$service".token) ;;
              *) echo "unexpected-old-token-source service=$service" >&2; return 1 ;;
            esac
            rel="${source#"$STATE_HOST_ROOT"/}"
            local_source="$STATE_RUNNER_ROOT/$rel"
            test -f "$local_source"
            : > "$local_source"
            rm -f "$local_source"
            rmdir "$(dirname "$local_source")" 2>/dev/null || true
          }

          assert_identity "$GAME" game
          assert_identity "$ATLAS" atlas
          test "$(docker inspect --format '{{.Config.User}}' "$GAME")" = '1001:1001'
          test "$(docker inspect --format '{{.Config.User}}' "$ATLAS")" = '0:0'

          IMAGE="$(docker inspect --format '{{.Config.Image}}' "$GAME")"
          case "$IMAGE" in ghcr.io/oteryn/oteryn-deploy-runner@sha256:*) ;; *) exit 1 ;; esac
          test "$(docker inspect --format '{{.Config.Image}}' "$ATLAS")" = "$IMAGE"

          game_config="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/runner"}}{{.Name}}{{end}}{{end}}' "$GAME")"
          game_work="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/work"}}{{.Name}}{{end}}{{end}}' "$GAME")"
          atlas_config="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/runner"}}{{.Name}}{{end}}{{end}}' "$ATLAS")"
          test -n "$game_config" && test -n "$game_work" && test -n "$atlas_config"
          old_game_token="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/runner_token"}}{{.Source}}{{end}}{{end}}' "$GAME")"
          old_atlas_token="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/runner_token"}}{{.Source}}{{end}}{{end}}' "$ATLAS")"

          echo "game-pre-state=$(docker inspect --format '{{.State.Status}}' "$GAME") game-restarts=$(docker inspect --format '{{.RestartCount}}' "$GAME")"
          docker update --restart=no "$GAME" >/dev/null
          docker stop -t 20 "$GAME" >/dev/null 2>&1 || true
          test "$(docker inspect --format '{{.State.Running}}' "$GAME")" = false

          init_helper="oteryn-runner-game-volume-init-${GITHUB_RUN_ID}"
          docker rm -f "$init_helper" >/dev/null 2>&1 || true
          docker create --name "$init_helper" --user 0:0 --network none --read-only \
            --mount "type=volume,src=$game_config,dst=/runner" \
            --mount "type=volume,src=$game_work,dst=/work" \
            --entrypoint /bin/bash "$IMAGE" -ec \
            'chown -R 1001:1001 /runner /work && chmod 0700 /runner /work' >/dev/null
          docker start "$init_helper" >/dev/null
          wait_helper "$init_helper"
          docker rm "$init_helper" >/dev/null
          echo 'game-volume-ownership-init=PASS'

          install -d -m 0700 "$STEADY_RUNNER_DIR"
          : > "$STEADY_RUNNER_DIR/platform.token"
          : > "$STEADY_RUNNER_DIR/atlas.token"
          chmod 0600 "$STEADY_RUNNER_DIR/platform.token" "$STEADY_RUNNER_DIR/atlas.token"
          chown 0:0 "$STEADY_RUNNER_DIR/platform.token" "$STEADY_RUNNER_DIR/atlas.token"

          game_token="$(api -X POST "$API/orgs/$ORG/actions/runners/registration-token" | jq -er '.token')"
          umask 077
          printf '%s' "$game_token" > "$STEADY_RUNNER_DIR/game.token"
          chown 1001:1001 "$STEADY_RUNNER_DIR/game.token"
          chmod 0400 "$STEADY_RUNNER_DIR/game.token"
          unset game_token
          test "$(stat -c '%u:%g:%a' "$STEADY_RUNNER_DIR/game.token")" = '1001:1001:400'
          test -s "$STEADY_RUNNER_DIR/game.token"
          echo 'game-one-time-token-envelope=PASS'

          export RUNNER_IMAGE="$IMAGE"
          export RUNNER_ORG_URL=https://github.com/Oteryn
          export PLATFORM_STATE_HOST_PATH="$STATE_HOST_ROOT"
          export PLATFORM_RUNNER_TOKEN_FILE="$STEADY_HOST_DIR/platform.token"
          export ATLAS_RUNNER_TOKEN_FILE="$STEADY_HOST_DIR/atlas.token"
          export GAME_RUNNER_TOKEN_FILE="$STEADY_HOST_DIR/game.token"

          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" config --quiet
          game_before="$(docker inspect --format '{{.Id}}' "$GAME")"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --no-deps --force-recreate game
          game_after_registration="$(docker inspect --format '{{.Id}}' "$GAME")"
          test "$game_after_registration" != "$game_before"
          wait_online oteryn-synology-game
          check_runner_file "$game_config" "$IMAGE" game-registered
          verify_runner game-runners Oteryn/Oteryn-Game oteryn-synology-game oteryn-game
          echo 'game-first-registration-repair=PASS'

          : > "$STEADY_RUNNER_DIR/game.token"
          test ! -s "$STEADY_RUNNER_DIR/game.token"
          game_before_blank="$(docker inspect --format '{{.Id}}' "$GAME")"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --no-deps --force-recreate game
          game_after_blank="$(docker inspect --format '{{.Id}}' "$GAME")"
          test "$game_after_blank" != "$game_before_blank"
          wait_online oteryn-synology-game
          sleep 15
          verify_runner game-runners Oteryn/Oteryn-Game oteryn-synology-game oteryn-game
          check_runner_file "$game_config" "$IMAGE" game-blank-restart
          test "$(docker inspect --format '{{.State.Running}}' "$GAME")" = true
          test "$(docker inspect --format '{{.Config.User}}' "$GAME")" = '1001:1001'
          game_mounts="$(docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$GAME")"
          ! grep -Fx '/var/run/docker.sock' <<< "$game_mounts" >/dev/null
          ! grep -Fx '/var/lib/oteryn-staging-state' <<< "$game_mounts" >/dev/null
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/runner_token"}}{{.Source}}{{end}}{{end}}' "$GAME")" = "$STEADY_HOST_DIR/game.token"
          echo 'game-blank-token-force-recreate=PASS'

          check_runner_file "$atlas_config" "$IMAGE" atlas-before-recreate
          atlas_before="$(docker inspect --format '{{.Id}}' "$ATLAS")"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --no-deps --force-recreate atlas
          atlas_after="$(docker inspect --format '{{.Id}}' "$ATLAS")"
          test "$atlas_after" != "$atlas_before"
          wait_online oteryn-synology-atlas
          sleep 15
          verify_runner atlas-runners Oteryn/Oteryn-Atlas oteryn-synology-atlas oteryn-atlas
          check_runner_file "$atlas_config" "$IMAGE" atlas-blank-restart
          test "$(docker inspect --format '{{.State.Running}}' "$ATLAS")" = true
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/runner_token"}}{{.Source}}{{end}}{{end}}' "$ATLAS")" = "$STEADY_HOST_DIR/atlas.token"
          echo 'atlas-blank-token-force-recreate=PASS'

          cleanup_old_token "$old_game_token" game
          cleanup_old_token "$old_atlas_token" atlas
          echo 'game-atlas-repair=PASS'
