name: Repair Atlas Playwright Cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/atlas-playwright-cache-repair.yml
      - deploy/ci/atlas-playwright-cache-repair.Dockerfile
      - scripts/acceptance/package.json
      - scripts/acceptance/run-playwright-ci.sh

permissions:
  contents: read

concurrency:
  group: oteryn-atlas-playwright-cache-repair
  cancel-in-progress: false

jobs:
  repair-cache:
    name: Refresh exact local Playwright cache
    runs-on: oteryn-staging
    timeout-minutes: 20
    steps:
      - name: Check out exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted-main execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build verify and atomically retag cache
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_IMAGE='oteryn-playwright-php85'
          TASK_IMAGE="oteryn-atlas-playwright-cache-repair:${GITHUB_SHA}"
          test -n "$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")"
          OLD_ID="$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")"
          printf 'old_cache_id=%s\n' "$OLD_ID"

          cleanup() {
            docker image rm -f "$TASK_IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            -f deploy/ci/atlas-playwright-cache-repair.Dockerfile \
            -t "$TASK_IMAGE" \
            .

          docker run --rm --ipc host --shm-size 1g \
            -e OTERYN_REQUIRE_VENDOR=0 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TASK_IMAGE" --runtime-smoke

          NEW_ID="$(docker image inspect --format '{{.Id}}' "$TASK_IMAGE")"
          test -n "$NEW_ID"
          docker tag "$TASK_IMAGE" "$BASE_IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")" = "$NEW_ID"
          printf 'new_cache_id=%s\ncache_repair=PASS\n' "$NEW_ID"
