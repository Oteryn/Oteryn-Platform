name: Cloudflare Oteryn Edge Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-oteryn-edge-audit.yml
      - scripts/operations/cloudflare-oteryn-edge-audit.py
      - tests/operations/cloudflare-oteryn-edge-audit/**
      - docs/operations/CLOUDFLARE_EDGE_POLICY_AUDIT.md
      - docs/agents/tasks/active/OTERYN-20260801-cloudflare-edge-policy-automation.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-oteryn-edge-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate fixed-scope read-only audit
        run: bash tests/operations/cloudflare-oteryn-edge-audit/run.sh

  audit:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Enforce read-only main dispatch boundary
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Live Cloudflare edge audit may run only from main." >&2
            exit 1
          }

      - name: Audit canonical edge policy without mutation
        run: python3 scripts/operations/cloudflare-oteryn-edge-audit.py

      - name: Upload sanitized edge audit
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-oteryn-edge-audit-${{ github.sha }}
          path: cloudflare-edge-audit/
          if-no-files-found: error
          retention-days: 14
