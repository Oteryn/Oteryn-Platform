name: Announcements Events Full Test Diagnostic

on:
  pull_request:
    branches:
      - feat/OTERYN-20260724-announcements-events

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: oteryn-ci-root-password
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CANARY_PROVISIONING_INTEGRATION_HOST: 127.0.0.1
      CANARY_PROVISIONING_INTEGRATION_PORT: 3306
      CANARY_PROVISIONING_INTEGRATION_ROOT_PASSWORD: oteryn-ci-root-password
      CANARY_CHARACTER_CREATE_INTEGRATION_HOST: 127.0.0.1
      CANARY_CHARACTER_CREATE_INTEGRATION_PORT: 3306
      CANARY_CHARACTER_CREATE_INTEGRATION_ROOT_PASSWORD: oteryn-ci-root-password
    steps:
      - name: Fetch pull-request merge quietly
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pcntl
          tools: composer:v2

      - name: Install dependencies quietly
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: Run full test suite into report
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          php artisan config:clear --no-ansi >/dev/null
          php artisan test --colors=never > phpunit-diagnostic.log 2>&1

      - name: Upload PHPUnit diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: announcements-events-phpunit-diagnostic
          path: phpunit-diagnostic.log
          if-no-files-found: error

      - name: Preserve test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
