name: OTS native producer diagnostics

on:
  push:
    branches:
      - feat/OTS-20260804-native-protocol-single-version-producer
    paths:
      - .github/workflows/ots-native-producer-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/OTS-20260804-native-protocol-single-version-producer
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Capture Gateway first failure
        shell: bash
        run: |
          set +e
          (cd services/game-gateway && go test ./...) > /tmp/native-gateway-test.log 2>&1
          status=$?
          set -e
          mkdir -p docs/agents/evidence/OTS-20260804-native-protocol-selection
          sed -E 's/(Bearer|token|credential)[=: ]+[^ ]+/\1=[REDACTED]/Ig' /tmp/native-gateway-test.log > docs/agents/evidence/OTS-20260804-native-protocol-selection/gateway-producer-first-failure.txt
          printf '\nEXIT_STATUS=%s\n' "$status" >> docs/agents/evidence/OTS-20260804-native-protocol-selection/gateway-producer-first-failure.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/evidence/OTS-20260804-native-protocol-selection/gateway-producer-first-failure.txt
          git commit -m 'test(native): capture Gateway first failure'
          git push origin HEAD:feat/OTS-20260804-native-protocol-single-version-producer
