name: Public Edge Post-Cloudflare Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-edge-post-cloudflare-validation.yml
      - tools/public_edge_post_cloudflare_validate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact observation source
        uses: actions/checkout@v7

      - name: Validate probe syntax
        run: python3 -m py_compile tools/public_edge_post_cloudflare_validate.py

      - name: Observe canonical public edge after Cloudflare apply
        run: python3 tools/public_edge_post_cloudflare_validate.py

      - name: Upload sanitized public observation
        uses: actions/upload-artifact@v4
        with:
          name: public-edge-post-cloudflare-${{ github.sha }}
          path: public-edge-post-cloudflare/
          if-no-files-found: error
          retention-days: 14
