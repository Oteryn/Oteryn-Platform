name: OTS native contract correction

on:
  push:
    branches:
      - agents/ots-native-selection-platform-correction-20260804
    paths:
      - .github/workflows/ots-native-contract-correction.yml

permissions:
  contents: write

jobs:
  correct-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agents/ots-native-selection-platform-correction-20260804
          fetch-depth: 0
      - name: Correct canonical contract and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('.')

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing required fragment [{label}]: {old!r}')
              return text.replace(old, new)

          proto_path = root / 'docs/contracts/oteryn_native_gameplay_v1.proto'
          proto = proto_path.read_text(encoding='utf-8')
          proto = replace_required(proto, 'uint32 schema_revision = 1; // Must be exactly 1.', 'uint32 schema_revision = 1; // Must be exactly 2.', 'wire schema revision')
          proto = replace_required(proto, '  string gameplay_family = 2;               // "oteryn".', '  string family = 2;                        // "oteryn".', 'client family')
          proto = replace_required(proto, '  string gameplay_profile = 3;              // "oteryn.native.v1".', '  reserved 3;\n  reserved "gameplay_profile";', 'client removed profile')
          proto = replace_required(proto, '  string transport_profile = 4;             // "tcp.tls13.protobuf.be32.v1".', '  string transport = 4;                     // "tcp.tls13.protobuf.be32.v1".', 'client transport')
          proto = replace_required(proto, '  uint32 schema_revision = 5;                // Must be 1.', '  uint32 schema_revision = 5;                // Must be 2.', 'client schema revision')
          proto = replace_required(proto, '  string client_platform = 16;               // Canonical lowercase identifier, <=64 bytes.', '  string client_platform = 16;               // Canonical lowercase identifier, <=64 bytes.\n  uint32 native_protocol_version = 17;        // Must be exactly 1.', 'client native version')
          proto = replace_required(proto, '  string gameplay_family = 6;', '  string family = 6;', 'server family')
          proto = replace_required(proto, '  string gameplay_profile = 7;', '  reserved 7;\n  reserved "gameplay_profile";', 'server removed profile')
          proto = replace_required(proto, '  string transport_profile = 8;', '  string transport = 8;', 'server transport')
          proto = replace_required(proto, '  uint64 initial_server_sequence = 15;        // Sequence of this envelope.', '  uint64 initial_server_sequence = 15;        // Sequence of this envelope.\n  uint32 native_protocol_version = 16;         // Must be exactly 1.', 'server native version')
          proto = replace_required(proto, '  PROTOCOL_ERROR_UNSUPPORTED_PROFILE = 5;', '  reserved 5;\n  reserved "PROTOCOL_ERROR_UNSUPPORTED_PROFILE";', 'removed profile error')
          proto = replace_required(proto, '  PROTOCOL_ERROR_INTERNAL_UNAVAILABLE = 16;', '  PROTOCOL_ERROR_INTERNAL_UNAVAILABLE = 16;\n  PROTOCOL_ERROR_UNSUPPORTED_NATIVE_PROTOCOL_VERSION = 17;', 'version error')
          if re.search(r'^\s*(?:string|uint32)\s+(?:gameplay_profile|transport_profile)\s*=', proto, re.M):
              raise SystemExit('active profile field remains in corrected IDL')
          if 'oteryn.native.v1' in proto:
              raise SystemExit('legacy native profile value remains in corrected IDL')
          proto_path.write_text(proto, encoding='utf-8', newline='\n')
          schema_sha = hashlib.sha256(proto_path.read_bytes()).hexdigest()

          contract_path = root / 'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md'
          contract = contract_path.read_text(encoding='utf-8')
          replacements = [
              ('Contract revision: `1`', 'Contract revision: `2`'),
              ('| native gameplay profile | `oteryn.native.v1` | this contract |', '| native protocol version | `1` | this contract |'),
              ('| native transport profile | `tcp.tls13.protobuf.be32.v1` | this contract |', '| native transport identifier | `tcp.tls13.protobuf.be32.v1` | this contract |'),
              ('| schema revision | `1` | this contract/IDL |', '| schema revision | `2` | this contract/IDL |'),
              ('profile-driven Canary-compatible gameplay', 'Canary-compatible gameplay selected through the isolated Canary compatibility-profile mechanism'),
              ('Each candidate contains exactly family, profile, transport, schema revision/hash', 'Each candidate contains exactly family, native protocol version, transport, schema revision/hash'),
              ('exact family/profile/transport/schema tuple', 'exact family/native_protocol_version/transport/schema tuple'),
              ('family\nprofile\ntransport', 'family\nnative_protocol_version\ntransport'),
              ('selected family/profile/transport/schema_revision/schema_sha256', 'selected family/native_protocol_version/transport/schema_revision/schema_sha256'),
              ('another character, world, channel, endpoint, profile, schema', 'another character, world, channel, endpoint, native protocol version, schema'),
              ('exact profile/transport/schema/list/digest', 'exact native protocol version/transport/schema/list/digest'),
              ('no plaintext profile', 'no plaintext or cross-family fallback'),
              ('exact profile/transport/schema/list/digest', 'exact native protocol version/transport/schema/list/digest'),
              ('new transport/profile revision', 'new transport or schema revision'),
              ('cross-character/world/channel/profile/endpoint use', 'cross-character/world/channel/native-protocol-version/endpoint use'),
              ('family/profile/transport/schema/capabilities', 'family/native_protocol_version/transport/schema/capabilities'),
              ('family/profile/transport/schema', 'family/native_protocol_version/transport/schema'),
              ('family/profile tuple', 'family/native_protocol_version tuple'),
              ('profile/transport/schema', 'native_protocol_version/transport/schema'),
              ('selected profile', 'selected native protocol version'),
              ('profile mismatch', 'native protocol version mismatch'),
              ('replacement profile', 'replacement native protocol version'),
              ('schema/list/digest/profile mismatch', 'schema/list/digest/native-protocol-version mismatch'),
              ('profile, schema and capability', 'native protocol version, schema and capability'),
              ('profile, schema, capability', 'native protocol version, schema, capability'),
              ('profile, transport, schema', 'native protocol version, transport, schema'),
              ('profile, transport', 'native protocol version, transport'),
              ('profile, schema', 'native protocol version, schema'),
              ('schema revision 1', 'schema revision 2'),
              ('contract revision 1', 'contract revision 2'),
              ('transport profile', 'transport identifier'),
          ]
          for old, new in replacements:
              contract = contract.replace(old, new)
          contract = re.sub(r'"profile"\s*:\s*"oteryn\.native\.v1"', '"native_protocol_version": 1', contract)
          contract = contract.replace('`oteryn.native.v1`', '`native_protocol_version = 1`')
          contract = contract.replace('"schema_revision": 1', '"schema_revision": 2')
          contract = contract.replace('`profile`', '`native_protocol_version`')
          header = f'Contract revision: `2`  \nSchema revision: `2`  \nCanonical schema SHA-256: `{schema_sha}`  '
          contract = contract.replace('Contract revision: `2`  ', header, 1)
          if re.search(r'"(?:profile|gameplay_profile|transport_profile)"\s*:', contract):
              raise SystemExit('serialized profile key remains in canonical contract')
          if 'oteryn.native.v1' in contract:
              raise SystemExit('legacy native profile value remains in canonical contract')
          contract_path.write_text(contract, encoding='utf-8', newline='\n')

          def update_text(path: str, pairs: list[tuple[str, str]]) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8', newline='\n')

          update_text('docs/architecture/adr/0010-native-gameplay-protocol-selection.md', [
              ('protobuf schema revision 1', 'protobuf schema revision 2'),
              ('9. Contract and disabled producers/consumers', '9. Native identity is exactly `family = oteryn` and `native_protocol_version = 1`; there is no native profile field, placeholder, catalogue, ordering or selector.\n10. Contract and disabled producers/consumers'),
          ])
          update_text('docs/architecture/adr/0011-single-native-protocol-version.md', [
              ('schema_revision: 1', 'schema_revision: 2'),
              ('schema_sha256: <exact canonical IDL digest>', f'schema_sha256: {schema_sha}'),
              ('contract revision 1', 'contract revision 2'),
          ])
          update_text('docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_SINGLE_VERSION_AMENDMENT.md', [
              ('"schema_revision": 1', '"schema_revision": 2'),
              ('Amends:', f'Status note: incorporated into canonical contract revision 2 and retained as migration rationale  \nCanonical schema SHA-256: `{schema_sha}`  \nAmends:'),
          ])
          update_text('docs/architecture/OTERYN_NATIVE_PROTOCOL_THREAT_MODEL.md', [
              ('adapter/profile/transport/schema/capability', 'adapter/native-protocol-version/transport/schema/capability'),
              ('unadvertised profile', 'unadvertised native protocol version'),
              ('family/profile/schema/capability', 'family/native-protocol-version/schema/capability'),
              ('character/world/channel/profile/endpoint', 'character/world/channel/native-protocol-version/endpoint'),
              ('family/profile/transport/schema/capabilities', 'family/native-protocol-version/transport/schema/capabilities'),
              ('\nprofile\ntransport\n', '\nnative_protocol_version\ntransport\n'),
          ])
          update_text('docs/architecture/OTERYN_NATIVE_PROTOCOL_ROLLOUT.md', [
              ('Canary profile regression', 'Canary compatibility-profile regression'),
              ('any profile removal', 'any Canary compatibility-profile removal'),
              ('listener readiness reports exact profile/schema', 'listener readiness reports exact native protocol version/schema'),
              ('gameplay_profile: oteryn.native.v1', 'native_protocol_version: 1'),
              ('transport_profile: tcp.tls13.protobuf.be32.v1', 'transport: tcp.tls13.protobuf.be32.v1'),
              ('schema_revision: 1', 'schema_revision: 2'),
              ('contract/profile/schema/capability', 'contract/native-protocol-version/schema/capability'),
              ('cross-profile admission', 'cross-native-protocol-version admission'),
          ])
          update_text('docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md', [
              ('no fallback to another profile', 'no fallback to another family or native protocol version'),
              ('profile: oteryn.native.v1', 'native_protocol_version: 1'),
              ('schema_revision: 1', 'schema_revision: 2'),
              ('c7665223f09001e3294e9a03ab4784defed66b0ac04450e8679d4778421207f8', schema_sha),
              ('audience, profile, transport', 'audience, native protocol version, transport'),
              ('family/profile/transport/schema/list/digest', 'family/native_protocol_version/transport/schema/list/digest'),
              ('exact world, channel, policy revision, endpoint, audience, profile, transport', 'exact world, channel, policy revision, endpoint, audience, native protocol version, transport'),
          ])

          migration_path = root / 'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_MIGRATION.md'
          migration_path.write_text(f'''# Native Oteryn protocol contract migration\n\nCoordination ID: `OTS-20260804-native-protocol-selection`  \nCanonical contract revision: `2`  \nSchema revision: `2`  \nSchema SHA-256: `{schema_sha}`\n\n## Required migration\n\nThe disabled transitional producer used a native `profile` string. The corrected model uses exactly `family = oteryn` and `native_protocol_version = 1`. No profile column, table, alias, placeholder, registry, factory, order or selector may remain in the final active native model.\n\nThe runtime implementation package must inspect deployed state before migration, add explicit version storage without reinterpreting serialized profile bytes, migrate only proven legacy native-v1 rows to version `1`, fail closed on any other value, validate readiness/session projections, and remove the transitional field within the same bounded migration programme. Native rows stay disabled and no candidate or endpoint is seeded.\n\nRollback must be rehearsed against disposable data. It may restore the pre-correction schema only while no deployed component requires the corrected model; it must never enable native advertisement or infer a profile.\n\n## Protobuf compatibility\n\nRemoved `gameplay_profile` fields retain their numbers and names as `reserved`. New `native_protocol_version` fields use new numbers. The transport field keeps its wire number and semantics but is renamed from `transport_profile` to `transport`.\n''', encoding='utf-8', newline='\n')

          fixture_dir = root / 'docs/contracts/fixtures/oteryn-native-v1'
          fixture_dir.mkdir(parents=True, exist_ok=True)
          capabilities = [
              'actions.command-result.v1', 'chat.semantic.v1', 'combat.server-authoritative.v1',
              'inventory.server-authoritative.v1', 'ordering.server-sequence.v1',
              'reconciliation.movement.v1', 'session.single-admission.v1',
              'state.revision.v1', 'state.snapshot-delta.v1',
          ]
          capability_digest = hashlib.sha256(''.join(f'{item}\n' for item in capabilities).encode()).hexdigest()
          descriptor = {
              'family': 'oteryn', 'native_protocol_version': 1,
              'transport': 'tcp.tls13.protobuf.be32.v1', 'schema_revision': 2,
              'schema_sha256': schema_sha, 'capabilities': capabilities,
          }
          fixtures = {
              'gateway-offer.json': {
                  'protocol_version': 1, 'game_login_ticket': '<synthetic-opaque-ticket>',
                  'gameplay_offer': {'offer_version': 1, 'client_build': 'oteryn-client-fixture',
                                     'client_platform': 'test-x86_64', 'candidates': [descriptor]},
              },
              'gateway-selection.json': {
                  'protocol_version': 1, 'game_session_contract_version': 2,
                  'gameplay_selection': {**descriptor, 'capability_digest_sha256': capability_digest,
                                         'policy_revision': 1, 'host': 'native.invalid', 'port': 7173,
                                         'tls_server_name': 'native.invalid'},
              },
              'manifest.json': {
                  'coordination_id': 'OTS-20260804-native-protocol-selection',
                  'contract_revision': 2, 'schema_revision': 2, 'schema_sha256': schema_sha,
                  'capability_digest_sha256': capability_digest,
                  'native_identity': {'family': 'oteryn', 'native_protocol_version': 1,
                                      'transport': 'tcp.tls13.protobuf.be32.v1'},
                  'fixtures': ['gateway-offer.json', 'gateway-selection.json'],
                  'contains_native_profile_field': False, 'production_enabled': False,
              },
          }
          for name, value in fixtures.items():
              (fixture_dir / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          validator = root / 'scripts/validate_native_protocol_contract.py'
          validator.write_text('''from pathlib import Path\nimport hashlib\nimport json\nimport re\n\nROOT = Path(__file__).resolve().parents[1]\nPROTO = ROOT / "docs/contracts/oteryn_native_gameplay_v1.proto"\nCONTRACT = ROOT / "docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md"\nFIXTURES = ROOT / "docs/contracts/fixtures/oteryn-native-v1"\n\ndef fail(message: str) -> None:\n    raise SystemExit(message)\n\ndef walk(value, path="$"):\n    if isinstance(value, dict):\n        for key, item in value.items():\n            if key in {"profile", "gameplay_profile", "transport_profile"}:\n                fail(f"forbidden serialized profile key at {path}.{key}")\n            walk(item, f"{path}.{key}")\n    elif isinstance(value, list):\n        for index, item in enumerate(value):\n            walk(item, f"{path}[{index}]")\n\nproto = PROTO.read_text(encoding="utf-8")\nif "oteryn.native.v1" in proto:\n    fail("legacy native profile value in IDL")\nif re.search(r"^\\s*(?:string|uint32)\\s+(?:gameplay_profile|transport_profile)\\s*=", proto, re.M):\n    fail("active profile field in IDL")\nfor required in ["reserved 3;", "reserved \\"gameplay_profile\\";", "reserved 7;", "native_protocol_version = 17;", "native_protocol_version = 16;"]:\n    if required not in proto:\n        fail(f"missing IDL compatibility marker: {required}")\nsha = hashlib.sha256(PROTO.read_bytes()).hexdigest()\ncontract = CONTRACT.read_text(encoding="utf-8")\nif f"Canonical schema SHA-256: `{sha}`" not in contract:\n    fail("canonical contract schema digest mismatch")\nif re.search(r"\\\"(?:profile|gameplay_profile|transport_profile)\\\"\\s*:", contract):\n    fail("serialized profile key in canonical contract")\nif "oteryn.native.v1" in contract:\n    fail("legacy native profile value in canonical contract")\nfor filename in ["gateway-offer.json", "gateway-selection.json", "manifest.json"]:\n    data = json.loads((FIXTURES / filename).read_text(encoding="utf-8"))\n    walk(data)\nmanifest = json.loads((FIXTURES / "manifest.json").read_text(encoding="utf-8"))\nidentity = manifest["native_identity"]\nif identity != {"family": "oteryn", "native_protocol_version": 1, "transport": "tcp.tls13.protobuf.be32.v1"}:\n    fail("native identity is not the single authorized tuple")\nif manifest["schema_revision"] != 2 or manifest["schema_sha256"] != sha:\n    fail("fixture manifest schema provenance mismatch")\nif manifest["production_enabled"] is not False:\n    fail("contract fixtures must keep production disabled")\nprint(f"native contract valid: schema_sha256={sha}")\n''', encoding='utf-8', newline='\n')

          workflow = root / '.github/workflows/native-protocol-contract.yml'
          workflow.write_text('''name: Native protocol contract\n\non:\n  pull_request:\n    paths:\n      - docs/contracts/**\n      - docs/architecture/**\n      - docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md\n      - scripts/validate_native_protocol_contract.py\n      - .github/workflows/native-protocol-contract.yml\n  push:\n    branches: [main]\n    paths:\n      - docs/contracts/**\n      - docs/architecture/**\n      - docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md\n      - scripts/validate_native_protocol_contract.py\n\npermissions:\n  contents: read\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v5\n      - run: python3 scripts/validate_native_protocol_contract.py\n''', encoding='utf-8', newline='\n')

          print(f'schema_sha256={schema_sha}')
          print(f'capability_digest_sha256={capability_digest}')
          PY
          python3 scripts/validate_native_protocol_contract.py
          rm .github/workflows/ots-native-contract-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "contract(native): remove profile dimension from v1"
          git push origin HEAD:agents/ots-native-selection-platform-correction-20260804
