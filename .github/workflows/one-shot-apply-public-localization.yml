name: One-shot Apply Public Localization

on:
  push:
    branches:
      - feat/OTERYN-20260725-public-web-localization
    paths:
      - .github/workflows/one-shot-apply-public-localization.yml

permissions:
  contents: write

concurrency:
  group: one-shot-public-localization
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-public-localization]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: feat/OTERYN-20260725-public-web-localization
          fetch-depth: 0

      - name: Apply and validate localization payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/public-localization-payload.part* | base64 -d > /tmp/public-localization.tar.gz
          tar -xzf /tmp/public-localization.tar.gz
          rm -f .github/tmp/public-localization-payload.part*
          rm -f .github/workflows/one-shot-apply-public-localization.yml

          find app bootstrap config database lang routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          node --check scripts/acceptance/tests/public-localization.spec.mjs
          python -m json.tool lang/pl.json >/dev/null
          git diff --check

      - name: Commit complete localization implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(public): add Polish and English localization foundation'
          git push origin HEAD:feat/OTERYN-20260725-public-web-localization
