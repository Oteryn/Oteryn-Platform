name: Issue 720 reconcile

on:
  push:
    branches: [docs/issue-720-game-auth-topology-reconcile]
    paths: [.github/workflows/issue720-doc-reconcile.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/issue-720-game-auth-topology-reconcile
          fetch-depth: 0
      - name: Apply reconciliation
        run: |
          set -euo pipefail
          python3 tools/agents/issue720_reconcile.py
          git diff --check
          git rm .github/workflows/issue720-doc-reconcile.yml tools/agents/issue720_reconcile.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/active/OTERYN-20260806-game-auth-topology-reconciliation.md docs/architecture/MODULE_CATALOG.md docs/architecture/SYSTEM_ARCHITECTURE.md docs/contracts/AUTH_GAME_LOGIN_CONTRACT.md docs/contracts/GAME_GATEWAY_IDENTITY_CONTRACT.md
          git commit -m 'docs(architecture): reconcile delivered game-auth topology'
          git push origin HEAD:docs/issue-720-game-auth-topology-reconcile
