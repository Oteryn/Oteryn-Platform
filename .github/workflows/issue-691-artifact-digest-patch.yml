name: Issue 691 Artifact Digest Patch

on:
  push:
    branches:
      - chore/issue-691-actions-wave
    paths:
      - '.github/workflows/issue-691-artifact-digest-patch.yml'

permissions:
  contents: write

concurrency:
  group: issue-691-artifact-digest-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v7
        with:
          ref: chore/issue-691-actions-wave
          fetch-depth: 0

      - name: Normalize upload-artifact digest provenance
        run: python3 scripts/ci/issue_691_artifact_digest_patch.py

      - name: Validate bounded patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/native-auth-ephemeral-cutover-rehearsal.yml').read_text(encoding='utf-8')
          assert 'test "$(jq -r \'.digest\' <<<"${metadata}")" = "sha256:${digest}"' in text
          assert 'test "$(jq -r \'.digest\' <<<"${metadata}")" = "${digest}"' not in text
          print('Issue #691 digest provenance invariant: PASS')
          PY

      - name: Commit verified patch and remove temporary tools
        run: |
          set -euo pipefail
          rm .github/workflows/issue-691-artifact-digest-patch.yml
          rm scripts/ci/issue_691_artifact_digest_patch.py
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            .github/workflows/issue-691-artifact-digest-patch.yml
            .github/workflows/native-auth-ephemeral-cutover-rehearsal.yml
            scripts/ci/issue_691_artifact_digest_patch.py
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): normalize current-run artifact digest provenance'
          git push origin HEAD:refs/heads/chore/issue-691-actions-wave
