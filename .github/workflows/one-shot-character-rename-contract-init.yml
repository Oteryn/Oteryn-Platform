name: One-shot Character Rename Contract Initialization

on:
  pull_request:
    branches:
      - docs/OTERYN-20260729-character-rename-contract
    paths:
      - '.rename-contract-trigger'

permissions:
  contents: write

concurrency:
  group: one-shot-character-rename-contract-init
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: docs/OTERYN-20260729-character-rename-contract
          fetch-depth: 0

      - name: Initialize active task indexes
        run: python tools/agents/initialize_character_rename_contract.py

      - name: Validate checkpoint and governance
        run: |
          python tools/agents/checkpoint.py docs/agents/tasks/active/OTERYN-20260729-character-rename-contract.md --require-checkpoint
          python tools/agents/checkpoint.py --tasks docs/agents/tasks/active --require-checkpoint
          python tools/agents/test_checkpoint.py

      - name: Commit initialization and remove one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-character-rename-contract-init.yml
          rm -f tools/agents/initialize_character_rename_contract.py
          rm -rf tools/agents/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/agents .github/workflows/one-shot-character-rename-contract-init.yml tools/agents/initialize_character_rename_contract.py
          git commit -m 'docs(agents): initialize character rename contract task'
          git push origin HEAD:docs/OTERYN-20260729-character-rename-contract
