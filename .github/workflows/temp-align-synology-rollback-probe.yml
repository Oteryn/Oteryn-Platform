name: Temporary Synology Rollback Probe Alignment

on:
  push:
    branches:
      - fix/20260907-synology-runtime-start-order
    paths:
      - .github/workflows/temp-align-synology-rollback-probe.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-runtime-start-order
          fetch-depth: 0

      - name: Align and validate rollback probe contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/ci/test_synology_rollback_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '    gateway_ready = health.index(\'probe_url gateway 8080 /ready "Gateway /ready"\')\n'
          new = '    gateway_ready = health.index(\'probe_published_url "$GATEWAY_BIND_ADDRESS" "$GATEWAY_PORT" /ready "Gateway /ready"\')\n'
          if old not in text:
              raise SystemExit('legacy readiness assertion missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tests/ci/test_synology_rollback_contract.py
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Commit aligned contract
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ci/test_synology_rollback_contract.py
          git commit -m "test(staging): align Gateway readiness probe contract"
          git push origin HEAD:fix/20260907-synology-runtime-start-order
