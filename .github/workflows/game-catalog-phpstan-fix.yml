name: Game Catalog PHPStan Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-phpstan-fix.yml'

permissions:
  contents: write

jobs:
  apply-type-narrowing:
    if: github.repository == 'blakinio/Oteryn-Platform' && github.head_ref == 'feat/OTERYN-20260730-game-catalog-schema-1-3-consumer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Apply exact type-boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8', newline='\n')

          replace(
              'app/GameCatalog/Application/Configuration/CatalogConfiguration.php',
              "if (! is_string($path) || $path === '' || ! is_string($sha256) || ! is_bool($activatable)) {",
              'if (! is_bool($activatable)) {',
          )

          import_path = 'app/GameCatalog/Application/Import/CatalogImportService.php'
          replace(
              import_path,
              ' * @phpstan-import-type CatalogRelation from ValidatedCatalogSnapshot\n',
              ' * @phpstan-import-type CatalogRelation from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogItemData from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogCreatureData from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogNpcData from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogLootData from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogShopOfferData from ValidatedCatalogSnapshot\n',
          )
          replace(import_path, '/** @param array<string, mixed> $data */\n    private function persistItem', '/** @param CatalogItemData $data */\n    private function persistItem')
          replace(import_path, '/** @param array<string, mixed> $data */\n    private function persistCreature', '/** @param CatalogCreatureData $data */\n    private function persistCreature')
          replace(import_path, '/** @param array<string, mixed> $data\n     * @param  array<string, int>  $entityIds\n     */\n    private function persistNpc', '/** @param CatalogNpcData $data\n     * @param  array<string, int>  $entityIds\n     */\n    private function persistNpc')
          replace(import_path, '/** @param array<string, mixed> $data */\n    private function persistLoot', '/** @param CatalogLootData $data */\n    private function persistLoot')
          replace(import_path, '/** @param array<string, mixed> $data\n     * @param  array<string, int>  $entityIds\n     */\n    private function persistShopOffer', '/** @param CatalogShopOfferData $data\n     * @param  array<string, int>  $entityIds\n     */\n    private function persistShopOffer')

          semantic_path = 'app/GameCatalog/Application/Import/CatalogSemanticValidator.php'
          replace(
              semantic_path,
              ' * @phpstan-import-type CatalogRelation from ValidatedCatalogSnapshot\n',
              ' * @phpstan-import-type CatalogRelation from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogLootRelation from ValidatedCatalogSnapshot\n'
              ' * @phpstan-import-type CatalogShopRelation from ValidatedCatalogSnapshot\n',
          )
          replace(
              semantic_path,
              "$facts[$key] = ['type' => $type, 'server_id' => $type === 'item' ? $entity['data']['server_id'] : null];",
              "$serverId = null;\n            if ($entity['type'] === 'item') {\n                $serverId = $entity['data']['server_id'];\n            }\n            $facts[$key] = ['type' => $type, 'server_id' => $serverId];",
          )
          replace(semantic_path, "if ($type === 'npc') {", "if ($entity['type'] === 'npc') {")
          replace(semantic_path, '/** @param CatalogRelation $relation\n     * @param  array<string, array{type: string, server_id: int|null}>  $entities\n     * @param  list<CatalogValidationFinding>  $findings\n     */\n    private function validateLootRelation', '/** @param CatalogLootRelation $relation\n     * @param  array<string, array{type: string, server_id: int|null}>  $entities\n     * @param  list<CatalogValidationFinding>  $findings\n     */\n    private function validateLootRelation')
          replace(semantic_path, '/** @param CatalogRelation $relation\n     * @param  array<string, array{type: string, server_id: int|null}>  $entities\n     * @param  list<CatalogValidationFinding>  $findings\n     */\n    private function validateShopRelation', '/** @param CatalogShopRelation $relation\n     * @param  array<string, array{type: string, server_id: int|null}>  $entities\n     * @param  list<CatalogValidationFinding>  $findings\n     */\n    private function validateShopRelation')

          test_path = 'tests/Feature/GameCatalog/CatalogV13ConsumerTest.php'
          replace(
              test_path,
              "        self::assertCount(2, $offers);\n        self::assertSame('buy', $offers[0]->direction);\n        self::assertSame(100, $offers[0]->price_amount);\n        self::assertNull($offers[0]->storage_key);\n        self::assertSame('sell', $offers[1]->direction);\n        self::assertSame(50, $offers[1]->price_amount);\n        self::assertSame(1000, $offers[1]->storage_key);\n        self::assertSame(1, $offers[1]->storage_value);",
              "        self::assertCount(2, $offers);\n        $buy = $offers->firstWhere('direction', 'buy');\n        $sell = $offers->firstWhere('direction', 'sell');\n        self::assertNotNull($buy);\n        self::assertNotNull($sell);\n        self::assertSame(100, $buy->price_amount);\n        self::assertNull($buy->storage_key);\n        self::assertSame(50, $sell->price_amount);\n        self::assertSame(1000, $sell->storage_key);\n        self::assertSame(1, $sell->storage_value);",
          )
          PY
          vendor/bin/pint \
            app/GameCatalog/Application/Configuration/CatalogConfiguration.php \
            app/GameCatalog/Application/Import/CatalogImportService.php \
            app/GameCatalog/Application/Import/CatalogSemanticValidator.php \
            tests/Feature/GameCatalog/CatalogV13ConsumerTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/GameCatalog/Application/Configuration/CatalogConfiguration.php \
            app/GameCatalog/Application/Import/CatalogImportService.php \
            app/GameCatalog/Application/Import/CatalogSemanticValidator.php \
            tests/Feature/GameCatalog/CatalogV13ConsumerTest.php
          git commit -m 'fix(catalog): narrow schema 1.3 typed boundaries'
          git push origin HEAD:feat/OTERYN-20260730-game-catalog-schema-1-3-consumer
