name: Split MFA QR From Final Staging

on:
  pull_request:
    paths:
      - .github/workflows/split-mfa-qr-from-final-staging.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/OTERYN-20260726-public-web-programme-final-cleanup
          fetch-depth: 0
      - name: Restore QR-owned paths to trusted main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            app/Http/Controllers/Identity/Mfa/MfaEnrollmentController.php \
            resources/views/identity/mfa/settings.blade.php \
            composer.json \
            composer.lock
          git rm -f \
            app/Identity/Mfa/MfaQrCode.php \
            tests/Unit/Identity/MfaQrCodeTest.php
      - name: Commit split
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(identity): split MFA QR into bounded PR'
          git push origin HEAD:chore/OTERYN-20260726-public-web-programme-final-cleanup
