name: Temporary Synology Deploy Repair Writer

on:
  push:
    branches:
      - fix/20260907-synology-deploy-resume-readiness
    paths:
      - .github/workflows/temp-synology-deploy-repair.yml

permissions:
  contents: write

jobs:
  write-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-deploy-resume-readiness
          fetch-depth: 0

      - name: Apply bounded repair
        run: |
          set -euo pipefail
          python3 .github/scripts/temp_synology_deploy_repair.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/ci/test_synology_rollback_contract.py')
          text = path.read_text(encoding='utf-8')
          old_count = '    assert health.count("python:3.12-alpine") == 1\n'
          new_count = '    assert health.count("python:3.12-alpine") >= 2\n'
          if old_count not in text:
              raise SystemExit('expected pinned-health helper count assertion not found')
          text = text.replace(old_count, new_count, 1)
          old_order = '    assert deploy.index("snapshot_current_images") < deploy.index("stage_bootstrap_files")\n'
          new_order = (
              '    snapshot_call = deploy.index("\\nsnapshot_current_images\\n")\n'
              '    stage_call = deploy.index("\\nstage_bootstrap_files\\n", snapshot_call)\n'
              '    assert snapshot_call < stage_call\n'
          )
          if old_order not in text:
              raise SystemExit('expected snapshot/stage ordering assertion not found')
          path.write_text(text.replace(old_order, new_order, 1), encoding='utf-8')
          PY
          bash -n deploy/synology/scripts/lib.sh
          bash -n deploy/synology/scripts/prepare-fresh-schema-baseline.sh
          bash -n deploy/synology/scripts/deploy.sh
          bash -n deploy/synology/scripts/health-check.sh
          python3 tests/ci/test_synology_rollback_contract.py
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Commit non-workflow repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/synology/scripts/lib.sh \
            deploy/synology/scripts/prepare-fresh-schema-baseline.sh \
            deploy/synology/scripts/deploy.sh \
            deploy/synology/scripts/health-check.sh \
            tests/ci/test_synology_rollback_contract.py \
            tests/ci/test_synology_auto_staging_deploy.py \
            .github/scripts/temp_synology_deploy_repair.py
          git commit -m "fix(staging): resume failed candidates safely"
          git push origin HEAD:fix/20260907-synology-deploy-resume-readiness
