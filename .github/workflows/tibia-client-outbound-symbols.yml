name: Tibia Outbound Symbols

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-outbound-symbols.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  symbols:
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Resolve exported and local action symbols
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          echo '=== NM ==='
          nm -C "$bin" 2>/dev/null | grep -E 'T(GameActionRouter|InternalGameActionRouter|PlayerMovementGameActionHandler|PlayerMovementIntentHandler|GenericGameActionHandler|CreaturesGameActionHandler|UseWithGameActionHandler|ChatGameActionHandler|ProtocolClientMessageProcessor|ProtocolWriter)' | head -n 300 || true
          echo '=== DYNSYM ==='
          readelf -Ws "$bin" | c++filt | grep -E 'T(GameActionRouter|InternalGameActionRouter|PlayerMovementGameActionHandler|PlayerMovementIntentHandler|GenericGameActionHandler|CreaturesGameActionHandler|UseWithGameActionHandler|ChatGameActionHandler|ProtocolClientMessageProcessor|ProtocolWriter)' | head -n 300 || true
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
