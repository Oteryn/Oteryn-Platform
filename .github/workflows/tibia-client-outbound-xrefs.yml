name: Tibia Outbound Xrefs

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-outbound-xrefs.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  xrefs:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Resolve action/router/protocol string xrefs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          tmp=/tmp/tibia-objdump.$$
          objdump -d -M intel "$bin" >"$tmp"
          for addr in \
            1cd4a60 1cad880 1cacde0 1cacf00 1cad2e0 1cd68a0 \
            1cacfc0 1cad360 1cad7c0 1c8de40 1c8e180 1c8e6cc \
            1cac3e0 1cac340; do
            echo "=== XREF $addr ==="
            grep -n -E "# +0*${addr}([ <]|$)|<[^>]*${addr}[^>]*>" "$tmp" | head -n 40 || true
          done
          echo '=== ROUTER_NEARBY ==='
          grep -n -E '# +0*1c8e(180|6cc)' "$tmp" | head -n 20 | while IFS=: read -r ln rest; do
            start=$((ln>12?ln-12:1)); end=$((ln+28)); sed -n "${start},${end}p" "$tmp"; echo '---';
          done
          echo '=== MOVEMENT_HANDLER_NEARBY ==='
          grep -n -E '# +0*1cd4a60|# +0*1cad880' "$tmp" | head -n 20 | while IFS=: read -r ln rest; do
            start=$((ln>12?ln-12:1)); end=$((ln+32)); sed -n "${start},${end}p" "$tmp"; echo '---';
          done
          rm -f "$tmp"
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
