name: Marketplace Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/Marketplace/**'
      - 'app/Wallet/**'
      - 'app/CanaryIntegration/CanaryCharacterTransfer*'
      - 'config/marketplace.php'
      - 'database/migrations/*character_bazaar*'
      - 'database/migrations/*wallet*'
      - 'database/provisioning/canary-character-transfer.sql.template'
      - 'resources/views/marketplace/**'
      - 'resources/views/admin/marketplace/**'
      - 'routes/modules/marketplace.php'
      - 'scripts/acceptance/seed-marketplace.php'
      - 'scripts/acceptance/tests/marketplace-acceptance.spec.mjs'
      - 'scripts/acceptance/coverage/surfaces/marketplace.json'
      - 'public/css/marketplace.css'
      - 'public/css/public-shell.css'
      - 'tests/**/Marketplace/**'
      - '.github/workflows/marketplace-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: marketplace-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-head full portal acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Dispatch exact-head full acceptance
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          before_ids="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow acceptance-validation.yml \
              --branch "$VALIDATION_REF" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId \
            | jq '[.[].databaseId]'
          )"

          gh workflow run acceptance-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VALIDATION_REF" \
            -f profile=full

          run_id=''
          for attempt in $(seq 1 90); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow acceptance-validation.yml \
                --branch "$VALIDATION_REF" \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,headSha,createdAt \
              | jq -r \
                  --arg sha "$VALIDATION_SHA" \
                  --argjson before "$before_ids" \
                  '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | reverse | .[0].databaseId // empty'
            )"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo 'Could not identify the dispatched exact-head full acceptance run.' >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched acceptance-validation.yml run ${run_id} for ${VALIDATION_SHA}."

      - name: Require exact-head full acceptance success
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.dispatch.outputs.run_id }}'
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 || true

          result="$(
            gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json headSha,status,conclusion,url
          )"
          echo "$result" | jq .

          head_sha="$(echo "$result" | jq -r '.headSha // empty')"
          conclusion="$(echo "$result" | jq -r '.conclusion // empty')"
          if [ "$head_sha" != "$VALIDATION_SHA" ] || [ "$conclusion" != 'success' ]; then
            echo "Exact-head full acceptance failed or returned the wrong SHA: ${result}" >&2
            exit 1
          fi
