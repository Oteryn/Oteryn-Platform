name: One-shot Localization Pint

on:
  push:
    branches:
      - feat/OTERYN-20260725-public-web-localization
    paths:
      - .github/workflows/one-shot-localization-pint.yml

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[localization-pint]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260725-public-web-localization
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply canonical formatting
        run: vendor/bin/pint
      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-localization-pint.yml
          git add -A
          git commit -m 'style(localization): apply canonical formatting'
          git push origin HEAD:feat/OTERYN-20260725-public-web-localization
