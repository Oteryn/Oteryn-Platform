name: Tibia Client P0 Sanitized Disasm

on:
  push:
    branches: [support/p0-sanitized-disasm-20260816]
    paths: [.github/workflows/tibia-client-p0-sanitized-disasm.yml]

permissions:
  contents: read

env:
  VOLUME_NAME: oteryn-tibia-linux-analysis

jobs:
  retained-volume-inspect:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Inspect retained static-analysis volume metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          echo '=== VOLUME ==='
          docker volume inspect "$VOLUME_NAME" --format 'name={{.Name}} driver={{.Driver}} mountpoint={{.Mountpoint}} labels={{json .Labels}}'
          echo '=== CONSUMERS ==='
          docker ps -a --filter "volume=$VOLUME_NAME" --format '{{.Names}}|{{.Status}}|{{.Image}}'
          echo '=== CONSUMER_MOUNTS ==='
          while read -r name; do
            [[ -n "$name" ]] || continue
            echo "--- $name ---"
            docker inspect "$name" --format '{{range .Mounts}}{{.Type}}|{{.Name}}|{{.Source}}|{{.Destination}}|rw={{.RW}}{{println}}{{end}}'
          done < <(docker ps -a --filter "volume=$VOLUME_NAME" --format '{{.Names}}')
          echo '=== STATIC_ONLY ==='
          echo 'CLIENT_EXECUTED=false'
          echo 'PROCESS_MEMORY_ACCESSED=false'
          echo 'NETWORK_ACCESSED=false'
          echo 'CANONICAL_RUNTIME_SESSION_TOUCHED=false'
