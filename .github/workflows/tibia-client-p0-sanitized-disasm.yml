name: Tibia Client P0 Sanitized Disasm

on:
  push:
    branches: [support/p0-sanitized-disasm-20260816]
    paths: [.github/workflows/tibia-client-p0-sanitized-disasm.yml]

permissions:
  contents: read

env:
  WORK_VOLUME: otclient-runner_runner_work
  EXPECTED_SIZE: '51965216'
  EXPECTED_SHA256: e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe

jobs:
  sanitized-static-evidence:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Emit bounded exact-client instruction evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          image=$(docker inspect otclient-tibia-login-analysis --format '{{.Image}}')
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges:true \
            -e EXPECTED_SIZE -e EXPECTED_SHA256 \
            --mount type=volume,src="$WORK_VOLUME",dst=/runner-work,readonly \
            --entrypoint /bin/bash "$image" -lc '
              set -Eeuo pipefail
              client=/runner-work/_otclient_tibia_re_state/cache/current-client/client
              [[ -f "$client" ]]
              size=$(stat -c %s "$client")
              sha=$(sha256sum "$client" | awk "{print \$1}")
              echo "EXACT_CLIENT_SIZE=$size"
              echo "EXACT_CLIENT_SHA256=$sha"
              [[ "$size" == "$EXPECTED_SIZE" ]]
              [[ "$sha" == "$EXPECTED_SHA256" ]]
              if command -v gdb >/dev/null 2>&1; then
                echo DISASM_MODE=gdb
                if gdb -q -nx -batch -ex "set auto-load python-scripts off" -ex "set debuginfod enabled off" -ex "file $client" -ex "set disassembly-flavor intel" -ex "disassemble /r 0x836500,0x836a00"; then
                  exit 0
                fi
                echo GDB_DISASM_FAILED=1
              fi
              echo DISASM_MODE=elf64_hex_fallback
              python3 -c '"'"'import sys,struct,hashlib; r=open(sys.argv[1],"rb").read(); s=int(sys.argv[2],0); e=int(sys.argv[3],0); assert hashlib.sha256(r).hexdigest()=="e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe"; phoff=struct.unpack_from("<Q",r,32)[0]; ents=struct.unpack_from("<H",r,54)[0]; n=struct.unpack_from("<H",r,56)[0]; ph=[struct.unpack_from("<IIQQQQQQ",r,phoff+i*ents) for i in range(n)]; g=[x for x in ph if x[0]==1 and x[3]<=s and e<=x[3]+x[5]][0]; o=g[2]+s-g[3]; print(f"HEX_PLAYERPOSITION VA={s:#x}..{e:#x} FILEOFF={o:#x} LEN={e-s}"); print(r[o:o+e-s].hex())'"'"' "$client" 0x836500 0x836a00
            '
      - name: State static-only boundary
        shell: bash
        run: |
          echo 'STATIC_ONLY=true'
          echo 'CLIENT_EXECUTED=false'
          echo 'PROCESS_MEMORY_ACCESSED=false'
          echo 'NETWORK_ACCESSED=false'
          echo 'CANONICAL_RUNTIME_SESSION_TOUCHED=false'
