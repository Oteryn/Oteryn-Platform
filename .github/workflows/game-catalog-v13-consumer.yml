name: Game Catalog 1.3 Consumer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-v13-consumer.yml'
      - 'app/GameCatalog/**'
      - 'config/game-catalog.php'
      - 'database/migrations/*game_catalog*.php'
      - 'resources/schemas/game-catalog/v1.3/**'
      - 'tests/Fixtures/GameCatalog/v1.3/**'
      - 'tests/Feature/GameCatalog/**'
      - 'docs/agents/tasks/active/OTERYN-20260730-game-catalog-schema-1-3-consumer.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-v13-consumer.yml'
      - 'app/GameCatalog/**'
      - 'config/game-catalog.php'
      - 'database/migrations/*game_catalog*.php'
      - 'resources/schemas/game-catalog/v1.3/**'
      - 'tests/Fixtures/GameCatalog/v1.3/**'
      - 'tests/Feature/GameCatalog/**'
      - 'docs/agents/tasks/active/OTERYN-20260730-game-catalog-schema-1-3-consumer.md'

permissions:
  contents: read

concurrency:
  group: game-catalog-v13-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'jsonschema==4.26.0'
      - name: Validate exact schema and fixture
        run: |
          python3 tools/game-catalog/validate_contract_fixture.py \
            --schema resources/schemas/game-catalog/v1.3/game-catalog-snapshot.schema.json \
            --fixture tests/Fixtures/GameCatalog/v1.3/minimal-snapshot.json \
            --expected-schema-version 1.3.0 \
            --expected-schema-sha256 0282c0ce4b995e4aded440b148dd4eb8a96a441e9924da182a2df2a0f2eef8a8 \
            --expected-fixture-sha256 c4fd9b187e001065f68d90f93dc67f71bb2ff745fc43c3e73110d49b23407ce7

  mariadb-lifecycle:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: catalog-v13-root-not-a-secret
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: oteryn_catalog_v13
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_catalog_v13
      DB_USERNAME: root
      DB_PASSWORD: catalog-v13-root-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, gd
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Check bounded formatting and static analysis
        run: |
          vendor/bin/pint --test \
            database/migrations/2026_07_30_061800_add_game_catalog_npc_shop_snapshots.php \
            tests/Feature/GameCatalog/CatalogV13ConsumerTest.php
          vendor/bin/phpstan analyse \
            database/migrations/2026_07_30_061800_add_game_catalog_npc_shop_snapshots.php \
            tests/Feature/GameCatalog/CatalogV13ConsumerTest.php \
            --memory-limit=1G \
            --no-progress \
            --error-format=raw
      - name: Execute inactive consumer and migration lifecycle
        run: |
          php artisan config:clear --no-interaction
          vendor/bin/phpunit tests/Feature/GameCatalog/CatalogV13ConsumerTest.php --testdox
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction
