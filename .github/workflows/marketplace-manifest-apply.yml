name: Marketplace Manifest Apply

on:
  pull_request:
    paths:
      - '.github/workflows/marketplace-manifest-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Add Marketplace coverage records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/acceptance/coverage/portal-coverage-manifest.json')
          data = json.loads(path.read_text())
          ids = [surface['id'] for surface in data['surfaces']]
          records = [
              {
                  'id': 'marketplace.public-catalogue-detail',
                  'owner': 'Marketplace',
                  'status': 'covered',
                  'route_names': ['legacy.marketplace.index', 'legacy.marketplace.show', 'marketplace.index', 'marketplace.show'],
                  'roles': ['guest', 'authenticated'],
                  'states': ['active-catalogue', 'bounded-filters', 'deterministic-sorting', 'empty', 'not-found', 'immutable-snapshot', 'bounded-bid-history', 'localized-en', 'localized-pl', 'private-saga-states-hidden'],
                  'viewports': ['desktop-1440x1000', 'tablet-820x1180', 'mobile-390x844'],
                  'browsers': ['chromium-primary'],
                  'evidence_layers': ['feature', 'database-integration', 'playwright', 'responsive', 'accessibility', 'security'],
                  'evidence': [
                      {'file': 'tests/Feature/Marketplace/MarketplaceModuleTest.php', 'markers': ['test_public_catalogue_detail_and_localized_routes_render_safe_snapshot_data']},
                      {'file': 'scripts/acceptance/tests/marketplace-acceptance.spec.mjs', 'markers': ['@portal-marketplace-public catalogue detail filters localization responsive layout and accessibility']},
                  ],
                  'gaps': [],
              },
              {
                  'id': 'marketplace.account-auction-wallet-lifecycle',
                  'owner': 'Marketplace / Wallet / Integration',
                  'status': 'covered',
                  'route_names': ['marketplace.account', 'marketplace.listing.create', 'marketplace.listing.store', 'marketplace.listing.cancel', 'marketplace.bids.store', 'marketplace.purchase', 'marketplace.watch.store', 'marketplace.watch.destroy'],
                  'roles': ['guest', 'authenticated-no-binding', 'authenticated-ready-binding', 'seller', 'bidder', 'winner'],
                  'states': ['watch', 'unwatch', 'listing-validation', 'escrow-pending', 'active', 'bid-reserved', 'outbid-release', 'self-bid-denied', 'buy-now', 'settlement-pending', 'completed', 'cancelled', 'expired', 'recovery-required', 'exact-idempotent-replay', 'idempotency-conflict', 'dead-link-free-private-states'],
                  'viewports': ['desktop-1440x1000', 'tablet-820x1180', 'mobile-390x844'],
                  'browsers': ['chromium-primary'],
                  'evidence_layers': ['unit', 'feature', 'database-integration', 'concurrency', 'contract', 'playwright', 'responsive', 'accessibility', 'security'],
                  'evidence': [
                      {'file': 'tests/Feature/Marketplace/MarketplaceModuleTest.php', 'markers': []},
                      {'file': 'tests/Feature/Marketplace/MarketplaceIdempotencyTest.php', 'markers': []},
                      {'file': 'tests/Feature/Marketplace/MarketplaceSettlementRecoveryTest.php', 'markers': []},
                      {'file': 'tests/Feature/Marketplace/CanaryCharacterTransferMariaDbIntegrationTest.php', 'markers': []},
                      {'file': 'tests/Feature/Marketplace/CanaryCharacterTransferConcurrencyMariaDbTest.php', 'markers': []},
                      {'file': 'scripts/acceptance/tests/marketplace-acceptance.spec.mjs', 'markers': ['@portal-marketplace-account authenticated watch bid wallet reservation complete state matrix and authorization journey']},
                  ],
                  'gaps': [],
              },
              {
                  'id': 'marketplace.admin-wallet-recovery',
                  'owner': 'Marketplace / Wallet / Admin / Audit',
                  'status': 'covered',
                  'route_names': ['admin.marketplace.index', 'admin.marketplace.wallet.adjust', 'admin.marketplace.auctions.recover'],
                  'roles': ['guest', 'authenticated-no-mfa', 'mfa-confirmed-no-permission', 'marketplace-manager'],
                  'states': ['permission-denied', 'wallet-search', 'adjustment-validation', 'adjustment-success', 'exact-idempotent-replay', 'idempotency-conflict', 'ledger-visible', 'audit-visible', 'recovery-queue', 'bounded-recovery'],
                  'viewports': ['desktop-1440x1000', 'tablet-820x1180', 'mobile-390x844'],
                  'browsers': ['chromium-primary'],
                  'evidence_layers': ['feature', 'playwright', 'responsive', 'accessibility', 'security', 'audit'],
                  'evidence': [
                      {'file': 'tests/Feature/Marketplace/MarketplaceModuleTest.php', 'markers': ['test_admin_wallet_adjustment_requires_mfa_permission_and_is_audited']},
                      {'file': 'scripts/acceptance/tests/marketplace-acceptance.spec.mjs', 'markers': ['@portal-marketplace-admin MFA permission wallet adjustment ledger and recovery queue surface']},
                  ],
                  'gaps': [],
              },
          ]

          if any(record['id'] in ids for record in records):
              raise SystemExit('Marketplace coverage records already exist.')

          position = ids.index('public.game-data') + 1
          data['surfaces'][position:position] = records
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/acceptance/coverage/portal-coverage-manifest.json
          git commit -m 'test(marketplace): classify delivered portal surfaces'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
