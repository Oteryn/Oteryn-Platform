name: Issue 691 Native Auth Self-contained Repair

on:
  push:
    branches:
      - chore/issue-691-actions-wave
    paths:
      - '.github/workflows/issue-691-native-auth-self-contained.yml'

permissions:
  contents: write

concurrency:
  group: issue-691-native-auth-self-contained-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v7
        with:
          ref: chore/issue-691-actions-wave
          fetch-depth: 0

      - name: Apply bounded native-auth transform
        run: python3 scripts/ci/issue_691_native_auth_repair.py

      - name: Validate repaired workflow invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/native-auth-ephemeral-cutover-rehearsal.yml').read_text(encoding='utf-8')
          assert text.count('actions/download-artifact@v8') == 3
          assert text.count('actions/upload-artifact@v7') >= 4
          assert text.count('id: upload') == 3
          assert 'SOURCE_BUILD_RUN: "30087461815"' not in text
          assert 'GATEWAY_ARTIFACT_ID: "8579664843"' not in text
          assert 'OTCLIENT_ARTIFACT_ID: "8595332324"' not in text
          assert 'needs: [build-gateway, build-canary, build-otclient]' in text
          print('Native-auth rehearsal self-contained workflow invariants: PASS')
          PY

      - name: Commit bounded repair and remove temporary tools
        run: |
          set -euo pipefail
          rm .github/workflows/issue-691-native-auth-self-contained.yml
          rm scripts/ci/issue_691_native_auth_repair.py
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            .github/workflows/issue-691-native-auth-self-contained.yml
            .github/workflows/native-auth-ephemeral-cutover-rehearsal.yml
            scripts/ci/issue_691_native_auth_repair.py
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): make native-auth rehearsal artifacts self-contained'
          git push origin HEAD:refs/heads/chore/issue-691-actions-wave
