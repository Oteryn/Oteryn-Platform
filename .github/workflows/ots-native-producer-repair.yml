name: OTS native producer final repair

on:
  push:
    branches:
      - feat/OTS-20260804-native-protocol-single-version-producer
    paths:
      - .github/workflows/ots-native-producer-repair.yml

permissions:
  contents: write

concurrency:
  group: ots-native-producer-final-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/OTS-20260804-native-protocol-single-version-producer
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Synchronize protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Repair producer implementation and tests
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected repair anchor missing in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The Game Session v2 contract carries an integer protocol version.
          session_client = Path("services/game-gateway/internal/session/client.go")
          text = session_client.read_text(encoding="utf-8")
          count = text.count("NativeProtocolVersion  string")
          if count != 2:
              raise SystemExit(f"expected two string protocol-version fields, found {count}")
          session_client.write_text(
              text.replace("NativeProtocolVersion  string", "NativeProtocolVersion  uint32"),
              encoding="utf-8",
          )

          # Repair mechanically transformed JSON fixture keys while keeping Go identifiers intact.
          for name in (
              "services/game-gateway/internal/e2e/native_producer_test.go",
              "services/game-gateway/internal/httpapi/server_test.go",
              "services/game-gateway/internal/platform/client_test.go",
              "services/game-gateway/internal/session/client_test.go",
          ):
              path = Path(name)
              path.write_text(
                  path.read_text(encoding="utf-8").replace(
                      "nativeProtocolVersion", "native_protocol_version"
                  ),
                  encoding="utf-8",
              )

          e2e = Path("services/game-gateway/internal/e2e/native_producer_test.go")
          text = e2e.read_text(encoding="utf-8")
          text = text.replace(
              '"schema_revision":       1,',
              '"schema_revision":       2,',
              1,
          )
          e2e.write_text(text, encoding="utf-8")

          # Canary remains profile-based and on its existing schema revision.
          server_test = Path("services/game-gateway/internal/httpapi/server_test.go")
          text = server_test.read_text(encoding="utf-8")
          old_canary = '\\"family\\":\\"canary\\",\\"native_protocol_version\\":\\"canary.current\\",\\"transport\\":\\"canary.sequence.v1\\",\\"schema_revision\\":2'
          new_canary = '\\"family\\":\\"canary\\",\\"profile\\":\\"canary.current\\",\\"transport\\":\\"canary.sequence.v1\\",\\"schema_revision\\":1'
          if text.count(old_canary) != 2:
              raise SystemExit(f"expected two Canary JSON fixtures, found {text.count(old_canary)}")
          server_test.write_text(text.replace(old_canary, new_canary), encoding="utf-8")

          # Restore family-specific test helpers instead of treating Canary profiles as integers.
          service_test = Path("services/game-gateway/internal/gateway/service_test.go")
          text = service_test.read_text(encoding="utf-8")
          marker = "func offerCandidate("
          if marker not in text:
              raise SystemExit("service helper anchor missing")
          prefix = text.split(marker, 1)[0]
          helpers = r'''func offerCandidate(family string, identity any, transport string, capabilities []string) GameplayOfferCandidate {
              sorted := append([]string(nil), capabilities...)
              sort.Strings(sorted)
              candidate := GameplayOfferCandidate{
                  Family: family, Transport: transport, Capabilities: sorted,
                  SchemaSHA256: schemaHashForCandidate(family),
              }
              if family == "oteryn" {
                  version, ok := identity.(int)
                  if !ok {
                      panic("native test identity must be an integer")
                  }
                  candidate.NativeProtocolVersion = uint32(version)
                  candidate.SchemaRevision = 2
              } else {
                  profile, ok := identity.(string)
                  if !ok {
                      panic("compatibility test identity must be a profile string")
                  }
                  candidate.Profile = profile
                  candidate.SchemaRevision = 1
              }
              return candidate
          }

          func schemaHashForCandidate(family string) string {
              if family == "oteryn" {
                  return canonicalNativeSchemaSHA256
              }
              return strings.Repeat("a", 64)
          }

          func policyCandidate(family string, identity any, transport, endpoint string, port int, required, optional []string) GameplayPolicyCandidate {
              requiredCopy := append([]string(nil), required...)
              optionalCopy := append([]string(nil), optional...)
              sort.Strings(requiredCopy)
              sort.Strings(optionalCopy)
              candidate := GameplayPolicyCandidate{
                  Family: family, Transport: transport,
                  SchemaSHA256: schemaHashForCandidate(family),
                  RequiredCapabilities: requiredCopy, OptionalCapabilities: optionalCopy,
                  EndpointID: endpoint, Host: "game.example.test", Port: port, TLSServerName: "game.example.test",
              }
              if family == "oteryn" {
                  version, ok := identity.(int)
                  if !ok {
                      panic("native test identity must be an integer")
                  }
                  candidate.NativeProtocolVersion = uint32(version)
                  candidate.SchemaRevision = 2
              } else {
                  profile, ok := identity.(string)
                  if !ok {
                      panic("compatibility test identity must be a profile string")
                  }
                  candidate.Profile = profile
                  candidate.SchemaRevision = 1
              }
              return candidate
          }
          '''
          helpers = re.sub(r"^          ", "", helpers, flags=re.MULTILINE)
          service_test.write_text(prefix + helpers, encoding="utf-8")

          native_test = Path("services/game-gateway/internal/gateway/native_protocol_test.go")
          text = native_test.read_text(encoding="utf-8")
          bad_line = '\t\t\t\tr.GameplayOffer.Candidates[index].NativeProtocolVersion = "nativeProtocolVersion." + string(rune(\'a\'+index))\n'
          if bad_line not in text:
              raise SystemExit("nine-candidate fixture repair anchor missing")
          native_test.write_text(
              text.replace(bad_line, "", 1).replace(
                  "TestSelectGameplayCandidateRejectsNativeNativeProtocolVersionMissingBaseCapability",
                  "TestSelectGameplayCandidateRejectsNativeProtocolVersionMissingBaseCapability",
              ),
              encoding="utf-8",
          )

          # Native v1 requires the canonical base capability set, while negotiated optional
          # capabilities remain supported and are bound by the selection digest.
          replace_once(
              "services/game-gateway/internal/gateway/native_protocol.go",
              "return nativeVersion == 1 && transport == \"tcp.tls13.protobuf.be32.v1\" && schemaRevision == 2 && schemaSHA256 == canonicalNativeSchemaSHA256 && containsEvery(required, nativeV1BaseCapabilities) && containsEvery(nativeV1BaseCapabilities, required) && len(optional) == 0",
              "return nativeVersion == 1 && transport == \"tcp.tls13.protobuf.be32.v1\" && schemaRevision == 2 && schemaSHA256 == canonicalNativeSchemaSHA256 && containsEvery(required, nativeV1BaseCapabilities)",
          )

          # Use two family-specific unique identities. Each family has exactly one non-null
          # identity column, so the corresponding unique constraint enforces its tuple.
          migration = Path("database/migrations/2026_08_05_130000_migrate_native_protocol_identity_to_version.php")
          migration.write_text(r'''<?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Database\Schema\Blueprint;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;

          return new class extends Migration
          {
              private const OLD_PROFILE = 'oteryn.native.v1';

              private const OLD_SCHEMA_SHA256 = 'c7665223f09001e3294e9a03ab4784defed66b0ac04450e8679d4778421207f8';

              private const NEW_SCHEMA_SHA256 = '9c67f19525400fb9890d2a3541ceb6d02eb955061540ad39ca1c1d891c06eba9';

              public function up(): void
              {
                  Schema::table('game_world_protocol_candidates', function (Blueprint $table): void {
                      $table->dropUnique('world_protocol_candidate_tuple_unique');
                      $table->unsignedTinyInteger('native_protocol_version')->nullable()->after('profile');
                      $table->string('profile', 64)->nullable()->change();
                  });

                  DB::table('game_world_protocol_candidates')
                      ->where('family', 'oteryn')
                      ->where('profile', self::OLD_PROFILE)
                      ->whereNull('native_protocol_version')
                      ->update([
                          'profile' => null,
                          'native_protocol_version' => 1,
                          'schema_revision' => 2,
                          'schema_sha256' => self::NEW_SCHEMA_SHA256,
                          'enabled' => false,
                          'updated_at' => now(),
                      ]);

                  Schema::table('game_world_protocol_candidates', function (Blueprint $table): void {
                      $table->unique(
                          ['game_world_id', 'channel_id', 'family', 'native_protocol_version', 'transport', 'schema_revision'],
                          'world_protocol_native_tuple_unique',
                      );
                      $table->unique(
                          ['game_world_id', 'channel_id', 'family', 'profile', 'transport', 'schema_revision'],
                          'world_protocol_compat_tuple_unique',
                      );
                  });
              }

              public function down(): void
              {
                  DB::table('game_world_protocol_candidates')
                      ->where('family', 'oteryn')
                      ->where('native_protocol_version', 1)
                      ->whereNull('profile')
                      ->update([
                          'profile' => self::OLD_PROFILE,
                          'native_protocol_version' => null,
                          'schema_revision' => 1,
                          'schema_sha256' => self::OLD_SCHEMA_SHA256,
                          'enabled' => false,
                          'updated_at' => now(),
                      ]);

                  Schema::table('game_world_protocol_candidates', function (Blueprint $table): void {
                      $table->dropUnique('world_protocol_native_tuple_unique');
                      $table->dropUnique('world_protocol_compat_tuple_unique');
                      $table->string('profile', 64)->nullable(false)->change();
                      $table->dropColumn('native_protocol_version');
                      $table->unique(
                          ['game_world_id', 'channel_id', 'family', 'profile', 'transport', 'schema_revision'],
                          'world_protocol_candidate_tuple_unique',
                      );
                  });
              }
          };
          '''.replace("          ", ""), encoding="utf-8")

          Path("tests/Feature/GameAuth/NativeProtocolIdentityMigrationTest.php").write_text(r'''<?php

          namespace Tests\Feature\GameAuth;

          use App\GameAuth\Worlds\GameWorld;
          use App\GameAuth\Worlds\GameWorldStatus;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Illuminate\Support\Facades\DB;
          use Tests\TestCase;

          final class NativeProtocolIdentityMigrationTest extends TestCase
          {
              use RefreshDatabase;

              private const OLD_PROFILE = 'oteryn.native.v1';

              private const OLD_SCHEMA_SHA256 = 'c7665223f09001e3294e9a03ab4784defed66b0ac04450e8679d4778421207f8';

              private const NEW_SCHEMA_SHA256 = '9c67f19525400fb9890d2a3541ceb6d02eb955061540ad39ca1c1d891c06eba9';

              public function test_migration_and_rollback_preserve_disabled_native_identity(): void
              {
                  $migration = require database_path('migrations/2026_08_05_130000_migrate_native_protocol_identity_to_version.php');
                  $migration->down();

                  $world = GameWorld::query()->create([
                      'slug' => 'migration-test',
                      'name' => 'Migration Test',
                      'region' => 'TEST',
                      'status' => GameWorldStatus::Online,
                      'login_enabled' => true,
                      'game_host' => 'migration.example.test',
                      'game_port' => 7172,
                      'gameplay_policy_revision' => 1,
                  ]);

                  DB::table('game_world_protocol_candidates')->insert([
                      'game_world_id' => $world->id,
                      'channel_id' => 1,
                      'sort_order' => 1,
                      'family' => 'oteryn',
                      'profile' => self::OLD_PROFILE,
                      'transport' => 'tcp.tls13.protobuf.be32.v1',
                      'schema_revision' => 1,
                      'schema_sha256' => self::OLD_SCHEMA_SHA256,
                      'required_capabilities' => json_encode([], JSON_THROW_ON_ERROR),
                      'optional_capabilities' => json_encode([], JSON_THROW_ON_ERROR),
                      'endpoint_id' => 'native-migration-test',
                      'game_host' => 'migration.example.test',
                      'game_port' => 7173,
                      'tls_server_name' => 'migration.example.test',
                      'enabled' => true,
                      'created_at' => now(),
                      'updated_at' => now(),
                  ]);

                  $migration->up();
                  $migrated = DB::table('game_world_protocol_candidates')->first();
                  self::assertNotNull($migrated);
                  self::assertNull($migrated->profile);
                  self::assertSame(1, (int) $migrated->native_protocol_version);
                  self::assertSame(2, (int) $migrated->schema_revision);
                  self::assertSame(self::NEW_SCHEMA_SHA256, $migrated->schema_sha256);
                  self::assertFalse((bool) $migrated->enabled);

                  $migration->down();
                  $rolledBack = DB::table('game_world_protocol_candidates')->first();
                  self::assertNotNull($rolledBack);
                  self::assertSame(self::OLD_PROFILE, $rolledBack->profile);
                  self::assertSame(1, (int) $rolledBack->schema_revision);
                  self::assertSame(self::OLD_SCHEMA_SHA256, $rolledBack->schema_sha256);
                  self::assertFalse((bool) $rolledBack->enabled);

                  $migration->up();
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          # Record a validation checkpoint without claiming audit or merge completion.
          task = Path("docs/agents/tasks/active/OTERYN-20260805-native-protocol-single-version-producer.md")
          text = task.read_text(encoding="utf-8")
          text = re.sub(r"updated: .*", "updated: 2026-08-06T15:03:00+02:00", text, count=1)
          text = text.replace("  - database/migrations/**native_gameplay_protocol**", "  - database/migrations/**native_protocol_identity**")
          text = text.replace("phase: implementation", "phase: validation")
          text = re.sub(r"exact_base: .*", "exact_base: " + subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip(), text, count=1)
          text = text.replace(
              "next_action: migrate producer and run exact-head validation",
              "next_action: complete exact-head CI, independent audits, merge and archive",
          )
          task.write_text(text, encoding="utf-8")

      - name: Remove transient branch-mutating workflows and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/ots-native-producer-diagnostics.yml \
            .github/workflows/ots-native-producer-fix-fixture.yml \
            .github/workflows/ots-native-producer-migrate.yml \
            .github/workflows/ots-native-producer-repair-runner.yml \
            .github/workflows/ots-native-producer-repair.yml \
            docs/agents/evidence/OTS-20260804-native-protocol-selection/gateway-producer-first-failure.txt \
            docs/agents/evidence/OTS-20260804-native-protocol-selection/platform-producer-first-failure.txt

      - name: Format Go sources
        shell: bash
        run: gofmt -w services/game-gateway/internal

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP formatting
        run: vendor/bin/pint --test app/GameAuth/Worlds app/Http/Controllers/GameAuth/GameLoginContextController.php database/migrations/2026_08_05_130000_migrate_native_protocol_identity_to_version.php tests/Feature/GameAuth

      - name: Test Platform producer and migration
        run: php artisan test tests/Feature/GameAuth/GameLoginContextApiTest.php tests/Feature/GameAuth/WorldRegistryTest.php tests/Feature/GameAuth/NativeProtocolIdentityMigrationTest.php

      - name: Test Game Gateway
        working-directory: services/game-gateway
        run: go test ./...

      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only origin/main...HEAD | grep -q '^\.github/workflows/ots-native-producer-'; then
            echo 'Transient workflow remains in final diff' >&2
            exit 1
          fi
          if git grep -n 'nativeProtocolVersion' -- services/game-gateway; then
            echo 'Non-canonical JSON key remains' >&2
            exit 1
          fi

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(native): complete single-version producer migration'
          git push origin HEAD:feat/OTS-20260804-native-protocol-single-version-producer
