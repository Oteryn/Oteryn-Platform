name: Inspect Public Web Final Staging PASS

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-pass.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect-phase7:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print Wiki RBAC test failure range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE7_JOB_ID: 89828002567
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${PHASE7_JOB_ID}/logs" > phase7.log
          sed -n '2410,2465p' phase7.log
