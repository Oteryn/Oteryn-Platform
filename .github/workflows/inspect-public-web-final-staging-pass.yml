name: Inspect Public Web Final Staging PASS

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-pass.yml

permissions:
  contents: read

jobs:
  inspect-role-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Print explicit role-grant migration precedents
        run: |
          set -euo pipefail
          echo 'Files granting media/support/public-module permissions:'
          grep -RIlE "media\.manage|support\.content\.manage|wiki\.publish" database/migrations | sort
          echo 'Relevant migration excerpts:'
          grep -RInE "media\.manage|support\.content\.manage|wiki\.access|wiki\.articles\.manage|wiki\.categories\.manage|wiki\.publish|admin_role_permissions" database/migrations \
            | tail -n 240
