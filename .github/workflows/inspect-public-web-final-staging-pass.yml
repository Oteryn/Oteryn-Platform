name: Inspect Public Web Final Staging PASS

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-pass.yml

permissions:
  contents: read

jobs:
  inspect-role-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List event permission role-grant migrations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/database/migrations?ref=main" \
            --jq '.[] | select(.type == "file") | .path' \
            | while IFS= read -r path; do
                content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .content | base64 -d)"
                if grep -qE 'events\.manage|events\.publish' <<<"$content"; then
                  echo "${path}"
                fi
              done
