name: Inspect Public Web Final Staging PASS

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-pass.yml

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print sanitized Wiki publication failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_SMOKE_JOB_ID: 89826340682
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${LIVE_SMOKE_JOB_ID}/logs" > live-smoke.log
          echo 'Focused Wiki publication failure excerpt:'
          grep -nEi 'eligible|publisher|wiki:launch|permission|mfa|expected exactly|exception|error|failed|failure' live-smoke.log \
            | tail -n 120 \
            || true
          echo 'Live-smoke log tail:'
          tail -n 100 live-smoke.log
