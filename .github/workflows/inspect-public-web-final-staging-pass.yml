name: Inspect Public Web Final Staging PASS

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-pass.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect-phase7:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print Phase 7 terminal test result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE7_JOB_ID: 89828002567
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${PHASE7_JOB_ID}/logs" > phase7.log
          grep -nE 'Tests:|Process completed with exit code|FAILURES!|FAILED  Tests|Tests failed' phase7.log | tail -n 40 || true
