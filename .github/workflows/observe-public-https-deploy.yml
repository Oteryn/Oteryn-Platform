name: Observe Public HTTPS Staging Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/observe-public-https-deploy.yml

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 6bfbc5f351758392d144baf0d2877a290ec69535
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Observe exact trusted-main build and staging control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          target_sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          required = {
              'Build Synology Staging Images',
              'Character Bazaar Staging Control',
          }
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?head_sha={target_sha}&per_page=100'
          )

          def fetch_runs():
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'oteryn-public-https-deploy-observer',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              return [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('event') == 'push' and run.get('name') in required
              ]

          for attempt in range(180):
              runs = fetch_runs()
              latest = {}
              for run in runs:
                  name = run['name']
                  if name not in latest or run['id'] > latest[name]['id']:
                      latest[name] = run

              if set(latest) == required:
                  states = {
                      name: {
                          'id': run['id'],
                          'status': run['status'],
                          'conclusion': run.get('conclusion'),
                          'html_url': run['html_url'],
                      }
                      for name, run in sorted(latest.items())
                  }
                  print(json.dumps(states, sort_keys=True))

                  if all(run['status'] == 'completed' for run in latest.values()):
                      failed = {
                          name: run.get('conclusion')
                          for name, run in latest.items()
                          if run.get('conclusion') != 'success'
                      }
                      if failed:
                          raise SystemExit(
                              f'Exact trusted-main staging workflow failed: {failed}'
                          )
                      print(
                          'PUBLIC_HTTPS_STAGING_DEPLOY_PROVEN '
                          f'target_sha={target_sha}'
                      )
                      raise SystemExit(0)

              time.sleep(10)

          raise SystemExit(
              'Timed out before exact trusted-main build and staging control completed.'
          )
          PY
