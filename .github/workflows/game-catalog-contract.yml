name: Game Catalog Contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-contract.yml'
      - 'app/GameCatalog/**'
      - 'bootstrap/providers.php'
      - 'config/game-catalog.php'
      - 'database/migrations/*game_catalog*.php'
      - 'resources/schemas/game-catalog/**'
      - 'tests/Fixtures/GameCatalog/**'
      - 'tests/Feature/GameCatalog/**'
      - 'tests/Unit/GameCatalog/**'
      - 'tools/game-catalog/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-contract.yml'
      - 'app/GameCatalog/**'
      - 'bootstrap/providers.php'
      - 'config/game-catalog.php'
      - 'database/migrations/*game_catalog*.php'
      - 'resources/schemas/game-catalog/**'
      - 'tests/Fixtures/GameCatalog/**'
      - 'tests/Feature/GameCatalog/**'
      - 'tests/Unit/GameCatalog/**'
      - 'tools/game-catalog/**'

permissions:
  contents: write

concurrency:
  group: game-catalog-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install contract validator dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'jsonschema==4.26.0'

      - name: Compile contract validator
        run: python3 -m py_compile tools/game-catalog/validate_contract_fixture.py

      - name: Validate schema and shared fixture
        run: >-
          python3 tools/game-catalog/validate_contract_fixture.py
          --schema resources/schemas/game-catalog/v1/game-catalog-snapshot.schema.json
          --fixture tests/Fixtures/GameCatalog/v1/minimal-snapshot.json

  autofix-public-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260728-game-catalog-slice-1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pcntl, gd
          tools: composer:v2

      - name: Install dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: Fix exact public-query type boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/GameCatalog/Queries/Public/DatabasePublicCatalogQuery.php')
          text = path.read_text()
          text = text.replace('@param list<object> $rows', '@param array<int, object> $rows')
          path.write_text(text)
          PY

      - name: Apply Pint
        run: >-
          vendor/bin/pint
          app/GameCatalog
          tests/Feature/GameCatalog
          tests/Unit/GameCatalog

      - name: Commit deterministic public-slice fixes
        shell: bash
        run: |
          if git diff --quiet -- app/GameCatalog tests/Feature/GameCatalog tests/Unit/GameCatalog; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/GameCatalog tests/Feature/GameCatalog tests/Unit/GameCatalog
          git commit -m 'style(catalog): finalize public catalog slice'
          git push origin HEAD:feat/OTERYN-20260728-game-catalog-slice-1
