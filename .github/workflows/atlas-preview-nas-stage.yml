name: Atlas Preview NAS Stage

on:
  push:
    branches:
      - ops/OTERYN-20260816-atlas-preview-nas-stage
    paths:
      - .github/workflows/atlas-preview-nas-stage.yml

permissions:
  contents: read

concurrency:
  group: oteryn-atlas-preview-nas-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage Atlas project on Synology
    runs-on: oteryn-staging
    timeout-minutes: 10
    env:
      EXPECT_COMPOSE: 64497eeaef5488a849e3a420ce2c3142d4659007fefec228d6224d14b3086d90
      EXPECT_NGINX: e4ede6aeb53e07cd721578e85edee4038939e5531e5077cf5fff8327ff616ad2
      EXPECT_ENV: f38ac0693f693755d045d3fa3a4573e0d849f5a02ff74e739a4e65b374130bf9
      EXPECT_SOURCE: 81d17743be8788b039b749c59a1c5524f0ce24e70d988bd28eeb94cb2e27a857
    steps:
      - name: Verify exact dedicated runner and snapshot canonical staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker version >/dev/null
          docker info >/dev/null
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' \
            --format '{{.ID}}\t{{.Names}}\t{{.Status}}' | sort > /tmp/atlas-stage-canonical-before.tsv
          test -s /tmp/atlas-stage-canonical-before.tsv
          echo RUNNER_VERIFIED=true

      - name: Materialize exact merged Atlas project payload
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/atlas-project-payload"
          rm -rf "$payload"
          mkdir -p "$payload"
          cat > "$payload/docker-compose.yml" <<'COMPOSE'
          ---
          name: otheryn-atlas-preview

          services:
            atlas:
              image: "ghcr.io/nginx/nginx-unprivileged:1.31.3-alpine3.24-slim@sha256:22f839c5fb4007dc24d203a170a9e03fc185d660bfefc34ac6823a7aef085cbc"
              restart: unless-stopped
              read_only: true
              security_opt:
                - no-new-privileges:true
              cap_drop:
                - ALL
              pids_limit: 100
              ports:
                - "${ATLAS_BIND_ADDRESS:-127.0.0.1}:${ATLAS_HTTP_PORT:-8095}:8080"
              volumes:
                - "${ATLAS_DATA_DIR:-/volume1/docker/otheryn/atlas/current}:/usr/share/nginx/html:ro"
                - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
              tmpfs:
                - /tmp:size=64m,mode=1777
              healthcheck:
                test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/index.html"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
          COMPOSE
          cat > "$payload/nginx.conf" <<'NGINX'
          server {
              listen 8080 default_server;
              listen [::]:8080 default_server;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;
              charset utf-8;
              server_tokens off;
              etag on;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "no-referrer" always;
              add_header X-Frame-Options "DENY" always;
              add_header Cache-Control "private" always;
              add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

              gzip on;
              gzip_vary on;
              gzip_comp_level 5;
              gzip_min_length 1024;
              gzip_types text/css application/javascript application/json;

              location = /healthz {
                  access_log off;
                  expires -1;
                  default_type text/plain;
                  return 200 "ok\n";
              }

              location = /favicon.ico {
                  access_log off;
                  log_not_found off;
                  return 204;
              }

              location = /index.html {
                  expires -1;
                  try_files $uri =404;
              }

              location = /manifest.json {
                  expires -1;
                  try_files $uri =404;
              }

              location ~* \.(?:js|css|json)$ {
                  expires 5m;
                  try_files $uri =404;
              }

              location ~* \.(?:png|webp)$ {
                  expires 1h;
                  try_files $uri =404;
              }

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX
          cat > "$payload/.env.example" <<'ENVFILE'
          # OTBM Atlas Synology preview defaults.
          # RECOMMENDED values only. Change them only if the live NAS requires it.
          ATLAS_DATA_DIR=/volume1/docker/otheryn/atlas/current
          ATLAS_BIND_ADDRESS=127.0.0.1
          ATLAS_HTTP_PORT=8095
          ENVFILE
          cat > "$payload/SOURCE.txt" <<'SOURCE'
          source_repository=blakinio/Otheryn
          source_commit=b9f51b01352abcda4db8df54f3b575ddc7b2532b
          source_pr=415
          purpose=private Synology Atlas browser preview project files
          SOURCE
          echo "$EXPECT_COMPOSE  $payload/docker-compose.yml" | sha256sum -c -
          echo "$EXPECT_NGINX  $payload/nginx.conf" | sha256sum -c -
          echo "$EXPECT_ENV  $payload/.env.example" | sha256sum -c -
          echo "$EXPECT_SOURCE  $payload/SOURCE.txt" | sha256sum -c -

      - name: Fail closed on unexpected existing project content
        shell: bash
        run: |
          set -Eeuo pipefail
          helper="oteryn-atlas-stage-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --name "$helper" \
            -e EXPECT_COMPOSE -e EXPECT_NGINX -e EXPECT_ENV -e EXPECT_SOURCE \
            -v /volume1/docker:/host:ro \
            ubuntu:24.04 bash -lc '
              set -Eeuo pipefail
              target=/host/otheryn/atlas/project
              [[ -e "$target" ]] || { echo EXISTING_PROJECT=false; exit 0; }
              [[ -d "$target" ]]
              echo EXISTING_PROJECT=true
              mapfile -t entries < <(find "$target" -mindepth 1 -maxdepth 1 -printf "%f\n" | sort)
              for name in "${entries[@]}"; do
                case "$name" in
                  docker-compose.yml|nginx.conf|.env.example|SOURCE.txt) ;;
                  *) echo "UNEXPECTED_PROJECT_ENTRY=$name"; exit 1 ;;
                esac
              done
              for spec in \
                "docker-compose.yml:$EXPECT_COMPOSE" \
                "nginx.conf:$EXPECT_NGINX" \
                ".env.example:$EXPECT_ENV" \
                "SOURCE.txt:$EXPECT_SOURCE"; do
                name=${spec%%:*}; expected=${spec#*:}
                [[ -e "$target/$name" ]] || continue
                [[ -f "$target/$name" ]]
                actual=$(sha256sum "$target/$name" | awk "{print \$1}")
                [[ "$actual" == "$expected" ]] || { echo "EXISTING_HASH_MISMATCH=$name"; exit 1; }
              done
            '

      - name: Stage only the Atlas project files on Synology
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/atlas-project-payload"
          helper="oteryn-atlas-stage-write-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C "$payload" -cf - docker-compose.yml nginx.conf .env.example SOURCE.txt | \
            docker run --rm -i --name "$helper" \
              -v /volume1/docker:/host \
              ubuntu:24.04 bash -lc '
                set -Eeuo pipefail
                target=/host/otheryn/atlas/project
                mkdir -p "$target"
                tar -xf - -C "$target"
                chmod 0644 "$target/docker-compose.yml" "$target/nginx.conf" "$target/.env.example" "$target/SOURCE.txt"
              '
          echo ATLAS_PROJECT_STAGED=true

      - name: Verify staged bytes and canonical staging invariance
        shell: bash
        run: |
          set -Eeuo pipefail
          helper="oteryn-atlas-stage-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report="$(docker run --rm --name "$helper" \
            -v /volume1/docker:/host:ro \
            ubuntu:24.04 bash -lc '
              set -Eeuo pipefail
              target=/host/otheryn/atlas/project
              for file in docker-compose.yml nginx.conf .env.example SOURCE.txt; do sha256sum "$target/$file"; done
            ')"
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -F "$EXPECT_COMPOSE  /host/otheryn/atlas/project/docker-compose.yml"
          printf '%s\n' "$report" | grep -F "$EXPECT_NGINX  /host/otheryn/atlas/project/nginx.conf"
          printf '%s\n' "$report" | grep -F "$EXPECT_ENV  /host/otheryn/atlas/project/.env.example"
          printf '%s\n' "$report" | grep -F "$EXPECT_SOURCE  /host/otheryn/atlas/project/SOURCE.txt"
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' \
            --format '{{.ID}}\t{{.Names}}\t{{.Status}}' | sort > /tmp/atlas-stage-canonical-after.tsv
          diff -u /tmp/atlas-stage-canonical-before.tsv /tmp/atlas-stage-canonical-after.tsv
          leftovers="$(docker ps -a --format '{{.Names}}' | grep '^oteryn-atlas-stage-' || true)"
          [[ -z "$leftovers" ]]
          echo CANONICAL_OTERYN_STAGING_UNCHANGED=true
          echo ATLAS_PROJECT_HASH_VERIFICATION=PASS
