name: Tibia Exact Character Name Activation

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-name-activate.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  enter:
    name: Double click exact first character-name token and leave online
    runs-on: oteryn-staging
    timeout-minutes: 8
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Login and activate exact name token
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/name-warp.trace
          grep -q '^warp=on$' /tmp/name-warp.trace
          echo WARP_VERIFIED=true
          cat >/tmp/proxychains-tibia.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF
          pkill -f 'packages/Tibia/bin/client' 2>/dev/null || true
          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          cd "$pkg"
          nohup proxychains4 -f /tmp/proxychains-tibia.conf "$client" >/data/runtime/client-name-activate.log 2>&1 </dev/null &
          for n in $(seq 1 30); do pgrep -x client >/dev/null && break; sleep 1; done
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          sleep 10

          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p'); height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height)); if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" && "$best_area" -ge 600000 ]]

          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 25

          import -display :99 -window "$best" /tmp/name-select.png
          convert /tmp/name-select.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/name-select-ocr.png
          tesseract /tmp/name-select-ocr.png stdout --psm 11 tsv 2>/dev/null >/tmp/name-select.tsv || true
          python3 - <<'PY' >/tmp/name-target.env
          import csv
          anchors=[]; candidates=[]
          with open('/tmp/name-select.tsv',newline='',errors='replace') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  token=(r.get('text') or '').strip().lower().strip(':,.!?()[]')
                  try:
                      conf=float(r.get('conf') or -1)
                      left=int(r.get('left') or 0)//2; top=int(r.get('top') or 0)//2
                      width=max(1,int(r.get('width') or 0)//2); height=max(1,int(r.get('height') or 0)//2)
                  except ValueError: continue
                  if conf < 20: continue
                  x=left+width//2; y=top+height//2
                  if token in {'select','character','status'}: anchors.append((token,x,y))
                  # Character-name tokens are structurally under Character header and left of Status column.
                  # Their text is intentionally never emitted.
                  if 180 <= x <= 390 and 185 <= y <= 200:
                      candidates.append((left,x,y,width,conf))
          title=any(t=='select' and 100<=y<=130 for t,x,y in anchors)
          header=[(x,y) for t,x,y in anchors if t=='character' and 160<=y<=185]
          status=[(x,y) for t,x,y in anchors if t=='status' and 160<=y<=190]
          if not title or not header or not status or not candidates:
              raise SystemExit('Safe Select Character structure not proven')
          candidates.sort()
          left,x,y,width,conf=candidates[0]
          if not (188 <= y <= 198 and x < status[0][0]-30):
              raise SystemExit('Unsafe character-name target geometry')
          print(f'NAME_X={x}')
          print(f'NAME_Y={y}')
          print(f'NAME_TOKEN_WIDTH={width}')
          print(f'NAME_TOKEN_CONF={int(conf)}')
          print(f'ROW_TOKEN_COUNT_LEFT_COLUMN={len(candidates)}')
          PY
          source /tmp/name-target.env
          echo EXACT_CHARACTER_NAME_TOKEN_GEOMETRY_VERIFIED=true
          echo "CHARACTER_NAME_TARGET=$NAME_X,$NAME_Y"

          xdotool mousemove --window "$best" 700 420
          sleep 0.4
          import -display :99 -window "$best" /tmp/name-before.png
          xdotool mousemove --window "$best" "$NAME_X" "$NAME_Y" click 1
          xdotool mousemove --window "$best" 700 420
          sleep 0.5
          import -display :99 -window "$best" /tmp/name-selected.png
          before_hash=$(convert /tmp/name-before.png -crop 500x24+170+$((NAME_Y-12)) +repage png:- | sha256sum | awk '{print $1}')
          selected_hash=$(convert /tmp/name-selected.png -crop 500x24+170+$((NAME_Y-12)) +repage png:- | sha256sum | awk '{print $1}')
          if [[ "$before_hash" != "$selected_hash" ]]; then echo PERSISTENT_ROW_VISUAL_CHANGE=true; else echo PERSISTENT_ROW_VISUAL_CHANGE=false; fi

          xdotool mousemove --window "$best" "$NAME_X" "$NAME_Y" click --repeat 2 --delay 180 1
          sleep 0.15
          import -display :99 -window "$best" /tmp/name-t015.png
          sleep 0.85
          import -display :99 -window "$best" /tmp/name-t1.png
          sleep 4
          import -display :99 -window "$best" /tmp/name-t5.png
          sleep 10
          import -display :99 -window "$best" /tmp/name-t15.png

          for n in 015 1 5 15; do
            convert "/tmp/name-t${n}.png" -crop 900x500+60+80 -resize 150% -colorspace Gray -contrast-stretch 1%x1% "/tmp/name-t${n}-ocr.png"
            tesseract "/tmp/name-t${n}-ocr.png" stdout --psm 11 2>/dev/null >"/tmp/name-t${n}.txt" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          allow={'account','login','email','password','select','character','connecting','connection','failed','error','server','world','game','battle','skills','inventory','health','mana','capacity','experience','online','already','logged','session','disconnected','store','vip','prey','queue','maintenance','could','verified','blocked','battleye'}
          final=''
          for n in ('015','1','5','15'):
              raw=Path(f'/tmp/name-t{n}.txt').read_text(errors='replace').lower()
              if n=='15': final=raw
              words=''.join(c if c.isalnum() else ' ' for c in raw).split(); safe=[]
              for w in words:
                  if w in allow and w not in safe: safe.append(w)
              print(f'T{n}_SAFE=' + ','.join(safe))
          account=('account login' in final or ('email' in final and 'password' in final))
          select=('select character' in final)
          game=sum(x in final for x in ('battle','skills','inventory','health','mana','capacity','experience'))>=2
          print(f'FINAL_ACCOUNT_LOGIN={str(account).lower()}')
          print(f'FINAL_SELECT_CHARACTER={str(select).lower()}')
          print(f'FINAL_GAME_MARKERS={str(game).lower()}')
          if account or select or not game: raise SystemExit(2)
          PY

          direct_tcp=$(ss -ntp 2>/dev/null | grep "pid=$pid," | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          udp_count=$(ss -nup 2>/dev/null | grep "pid=$pid," | grep -c . || true)
          [[ "$direct_tcp" -eq 0 && "$udp_count" -eq 0 ]]
          cp /tmp/name-t15.png /tmp/tibia-name-online-safe.png
          convert /tmp/tibia-name-online-safe.png -fill '#202020' -draw 'rectangle 0,0 1020,70 rectangle 0,70 180,650 rectangle 840,70 1020,650 rectangle 0,520 1020,650' /tmp/tibia-name-online-safe.png
          echo PHYSICAL_TIBIA_WORLD_LOGIN_PROVEN=true
          echo TIBIA_CHARACTER_LEFT_ONLINE=true
          INNER
          docker cp "$CONTAINER_NAME:/tmp/tibia-name-online-safe.png" /tmp/tibia-name-online-safe.png

      - name: Upload privacy-safe in-world proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-exact-name-online-proof
          path: /tmp/tibia-name-online-safe.png
          retention-days: 7
          if-no-files-found: warn

      - name: Verify canonical staging unchanged and client remains running
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
