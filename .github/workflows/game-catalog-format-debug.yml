name: Game Catalog Format Debug

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/game-catalog-format-debug.yml'

permissions:
  contents: write

concurrency:
  group: game-catalog-format-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-formatter:
    if: github.repository == 'blakinio/Oteryn-Platform' && github.head_ref == 'feat/OTERYN-20260730-game-catalog-schema-1-3-consumer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --quiet
      - name: Apply exact Pint formatting
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint \
            app/GameCatalog/Application/Activation/CatalogActivationService.php \
            app/GameCatalog/Application/Import/CatalogImportService.php \
            app/GameCatalog/Application/Import/CatalogSemanticValidator.php \
            tests/Feature/GameCatalog/CatalogV13ConsumerTest.php
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/GameCatalog/Application/Activation/CatalogActivationService.php \
            app/GameCatalog/Application/Import/CatalogImportService.php \
            app/GameCatalog/Application/Import/CatalogSemanticValidator.php \
            tests/Feature/GameCatalog/CatalogV13ConsumerTest.php
          git commit -m 'style(catalog): apply pinned Pint formatting'
          git push origin HEAD:feat/OTERYN-20260730-game-catalog-schema-1-3-consumer
