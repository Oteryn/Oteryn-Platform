name: Issue 365 Retry Run Discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue365-run-discovery.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest retry run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: validation/issue365-synology-20260801
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)

          runs_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              f'issue365-synology-retry.yml/runs?branch={urllib.parse.quote(branch)}&per_page=20'
          )
          runs = get(runs_url).get('workflow_runs', [])
          print('ISSUE365_RETRY_RUNS=' + json.dumps([
              {
                  'id': run['id'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'event': run['event'],
                  'head_sha': run['head_sha'],
                  'run_attempt': run['run_attempt'],
                  'check_suite_id': run.get('check_suite_id'),
                  'path': run.get('path'),
              }
              for run in runs
          ], separators=(',', ':')))

          if not runs:
              raise SystemExit('no retry runs found')
          latest = get(runs[0]['url'])
          print('ISSUE365_LATEST_RUN=' + json.dumps({
              key: latest.get(key)
              for key in (
                  'id', 'name', 'path', 'event', 'status', 'conclusion',
                  'head_sha', 'run_attempt', 'run_started_at', 'created_at',
                  'updated_at', 'check_suite_id', 'display_title'
              )
          }, separators=(',', ':')))
          suite_id = latest.get('check_suite_id')
          if suite_id:
              check_runs = get(
                  f'https://api.github.com/repos/{repository}/check-suites/{suite_id}/check-runs?per_page=100'
              ).get('check_runs', [])
              print('ISSUE365_CHECK_RUNS=' + json.dumps([
                  {
                      'id': item.get('id'),
                      'name': item.get('name'),
                      'status': item.get('status'),
                      'conclusion': item.get('conclusion'),
                      'details_url': item.get('details_url'),
                      'output': item.get('output'),
                  }
                  for item in check_runs
              ], separators=(',', ':')))
          PY
