name: Tibia Client Analysis Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-analysis-dispatch.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  inspect:
    name: Static read-only Tibia CPUID diagnostic
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify owned live runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null

      - name: Build static CPUID probe on runner and execute once in container
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_src=/tmp/cpuid-readonly.c
          runner_bin=/tmp/cpuid-readonly
          cleanup() {
            docker exec "$CONTAINER_NAME" rm -f /tmp/cpuid-readonly 2>/dev/null || true
            rm -f "$runner_src" "$runner_bin"
          }
          trap cleanup EXIT

          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <string.h>' \
            '#include <cpuid.h>' \
            'int main(void) {' \
            '  unsigned a,b,c,d;' \
            '  char v[13]={0};' \
            '  __cpuid(1,a,b,c,d);' \
            '  printf("cpuid.1.ecx.hypervisor=%u\\n", (c >> 31) & 1);' \
            '  __cpuid(0x40000000,a,b,c,d);' \
            '  memcpy(&v[0],&b,4); memcpy(&v[4],&c,4); memcpy(&v[8],&d,4);' \
            '  printf("cpuid.40000000.max=0x%x\\n", a);' \
            '  printf("cpuid.40000000.vendor=%s\\n", v);' \
            '  return 0;' \
            '}' > "$runner_src"

          gcc -static -O2 -s -o "$runner_bin" "$runner_src"
          file "$runner_bin"
          if readelf -l "$runner_bin" | grep -q 'Requesting program interpreter'; then
            echo STATIC_LINK_VERIFY_FAILED=true
            exit 3
          fi
          sha=$(sha256sum "$runner_bin" | awk '{print $1}')
          echo CPUID_READONLY_SHA256="$sha"

          docker cp "$runner_bin" "$CONTAINER_NAME":/tmp/cpuid-readonly
          inside_sha=$(docker exec "$CONTAINER_NAME" sha256sum /tmp/cpuid-readonly | awk '{print $1}')
          echo CPUID_READONLY_CONTAINER_SHA256="$inside_sha"
          [[ "$inside_sha" == "$sha" ]]

          docker exec "$CONTAINER_NAME" bash -lc 'uname -a; systemd-detect-virt || true; /tmp/cpuid-readonly'
          docker exec "$CONTAINER_NAME" rm -f /tmp/cpuid-readonly
          ! docker exec "$CONTAINER_NAME" test -e /tmp/cpuid-readonly
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null
          echo CPUID_READONLY_REMOVED=true
