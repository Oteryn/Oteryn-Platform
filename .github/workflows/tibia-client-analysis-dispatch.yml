name: Tibia Client Analysis Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-analysis-dispatch.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  build:
    name: Build static CPUID probe
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.probe.outputs.sha256 }}
    steps:
      - id: probe
        name: Compile static probe and emit verified hash
        shell: bash
        run: |
          set -Eeuo pipefail
          src=/tmp/cpuid-readonly.c
          bin=/tmp/cpuid-readonly
          gz="$RUNNER_TEMP/cpuid-readonly.gz"
          trap 'rm -f "$src" "$bin"' EXIT
          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <string.h>' \
            '#include <cpuid.h>' \
            'int main(void){unsigned a,b,c,d;char v[13]={0};__cpuid(1,a,b,c,d);printf("cpuid.1.ecx.hypervisor=%u\\n",(c>>31)&1);__cpuid(0x40000000,a,b,c,d);memcpy(&v[0],&b,4);memcpy(&v[4],&c,4);memcpy(&v[8],&d,4);printf("cpuid.40000000.max=0x%x\\n",a);printf("cpuid.40000000.vendor=%s\\n",v);return 0;}' > "$src"
          gcc -static -O2 -s -o "$bin" "$src"
          file "$bin"
          ! readelf -l "$bin" | grep -q 'Requesting program interpreter'
          sha=$(sha256sum "$bin" | awk '{print $1}')
          gzip -9 -c "$bin" > "$gz"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo CPUID_READONLY_SHA256="$sha"
          echo STATIC_LINK_VERIFIED=true

      - name: Upload verified probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpuid-readonly-probe
          path: ${{ runner.temp }}/cpuid-readonly.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove hosted-runner probe payload
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cpuid-readonly.gz"

  inspect:
    name: Execute static read-only Tibia CPUID diagnostic
    needs: build
    runs-on: oteryn-staging
    timeout-minutes: 5
    env:
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Verify owned live runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null

      - name: Download verified probe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cpuid-readonly-probe
          path: ${{ runner.temp }}/cpuid-readonly-artifact

      - name: Verify hash, execute once in container, and remove
        shell: bash
        run: |
          set -Eeuo pipefail
          host_gz="$RUNNER_TEMP/cpuid-readonly-artifact/cpuid-readonly.gz"
          host_bin=/tmp/cpuid-readonly
          cleanup() {
            docker exec "$CONTAINER_NAME" rm -f /tmp/cpuid-readonly 2>/dev/null || true
            rm -f "$host_bin"
            rm -rf "$RUNNER_TEMP/cpuid-readonly-artifact"
          }
          trap cleanup EXIT
          gzip -dc "$host_gz" > "$host_bin"
          chmod 755 "$host_bin"
          sha=$(sha256sum "$host_bin" | awk '{print $1}')
          echo CPUID_READONLY_SHA256="$sha"
          [[ "$sha" == "$EXPECTED_SHA256" ]]
          docker cp "$host_bin" "$CONTAINER_NAME":/tmp/cpuid-readonly
          inside_sha=$(docker exec "$CONTAINER_NAME" sha256sum /tmp/cpuid-readonly | awk '{print $1}')
          echo CPUID_READONLY_CONTAINER_SHA256="$inside_sha"
          [[ "$inside_sha" == "$EXPECTED_SHA256" ]]
          docker exec "$CONTAINER_NAME" bash -lc 'uname -a; systemd-detect-virt || true; /tmp/cpuid-readonly'
          docker exec "$CONTAINER_NAME" rm -f /tmp/cpuid-readonly
          ! docker exec "$CONTAINER_NAME" test -e /tmp/cpuid-readonly
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null
          echo CPUID_READONLY_REMOVED=true
