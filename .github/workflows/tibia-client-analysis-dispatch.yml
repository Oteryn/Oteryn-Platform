name: Tibia Client Analysis Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-analysis-dispatch.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  inspect:
    name: Inspect captured Tibia appearance IDs
    runs-on: oteryn-staging
    timeout-minutes: 6
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Locate appearance catalog and inspect captured IDs
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          pkg='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia'
          echo CATALOG_FILES_BEGIN
          find "$pkg" -type f \( -name '*catalog-content*.json' -o -name 'catalog-content.json' \) -printf '%s\t%p\n' | sort
          echo CATALOG_FILES_END
          catalog=$(find "$pkg" -type f \( -name '*catalog-content*.json' -o -name 'catalog-content.json' \) | head -n1)
          [[ -n "$catalog" ]]
          echo CATALOG_PATH="$catalog"
          python3 - "$catalog" <<'PY'
          import json,sys,os
          p=sys.argv[1]
          data=json.load(open(p,'r',encoding='utf-8'))
          print('CATALOG_ENTRY_COUNT',len(data))
          for obj in data:
              t=obj.get('type')
              if t in ('appearances','sprite'):
                  print('CATALOG_ENTRY',json.dumps(obj,sort_keys=True,separators=(',',':')))
          apps=[o for o in data if o.get('type')=='appearances']
          if len(apps)!=1:
              raise SystemExit(f'expected exactly one appearances entry, got {len(apps)}')
          print('APPEARANCES_RELATIVE_FILE',apps[0].get('file'))
          PY
          rel=$(python3 - "$catalog" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],'r',encoding='utf-8'))
          print([o for o in data if o.get('type')=='appearances'][0]['file'])
          PY
          )
          base=$(dirname "$catalog")
          app="$base/$rel"
          [[ -f "$app" ]]
          echo APPEARANCES_FILE="$app"
          echo APPEARANCES_SIZE=$(stat -c %s "$app")
          echo APPEARANCES_SHA256=$(sha256sum "$app" | awk '{print $1}')

          # Look for an already installed decoder/protobuf schema before adding any dependency.
          echo PROTO_DECODER_CANDIDATES_BEGIN
          find /data "$pkg" -type f \( -name 'appearances.proto' -o -name 'appearances_pb2.py' -o -name 'appearances.pb.h' \) -printf '%p\n' 2>/dev/null | sed -n '1,80p' || true
          echo PROTO_DECODER_CANDIDATES_END

          # The official client binary embeds protobuf descriptors. Record only schema tokens needed for classification.
          client=/data/client-15.32.df7b29/bin/client
          echo APPEARANCE_SCHEMA_TOKENS_BEGIN
          strings -a "$client" | grep -E '^(Appearances|Appearance|AppearanceFlags|bank|fullbank|clip|waypoints|objectID|objectCount|upgradeTier|liquidType)$' | sort -u || true
          echo APPEARANCE_SCHEMA_TOKENS_END

          # Preserve a tiny binary sample metadata only; never print proprietary protobuf bytes.
          echo CAPTURED_IDS=4407,313,6379,19394,6217
          INNER

      - name: Verify authenticated session retained and staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 && direct_count == 0 ))
          echo LIVE_SESSION_RETAINED=true
          INNER
