name: Tibia Client Analysis Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-analysis-dispatch.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  inspect:
    name: Discover Tibia appearance catalogs
    runs-on: oteryn-staging
    timeout-minutes: 6
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Discover appearance metadata without dumping assets
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          pkg='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia'
          echo ROOT_METADATA_BEGIN
          find "$pkg" -maxdepth 1 -type f -printf '%s\t%f\n' | sort -k2
          echo ROOT_METADATA_END

          echo EXACT_CANDIDATE_NAMES_BEGIN
          find "$pkg" -type f -printf '%s\t%p\n' \
            | grep -Ei '/(appearances?|objects?|items?|things?|catalog[^/]*|assets\.json|package\.json)([-_.]|$)' \
            | grep -Ev '/(qml|3rdpartylicences)/' \
            | sed -n '1,300p' || true
          echo EXACT_CANDIDATE_NAMES_END

          for f in "$pkg/assets.json" "$pkg/package.json"; do
            if [[ -f "$f" ]]; then
              echo MANIFEST_FILE="$f" SIZE=$(stat -c %s "$f")
              echo MANIFEST_APPEARANCE_LINES_BEGIN
              grep -niE 'appear|object|item|thing|catalog' "$f" | sed -n '1,220p' || true
              echo MANIFEST_APPEARANCE_LINES_END
            fi
          done

          echo ASSET_BASENAME_CLASSES_BEGIN
          find "$pkg/assets" -maxdepth 1 -type f -printf '%f\n' \
            | sed -E 's/-[0-9a-f]{64}\.[^.]+(\.lzma)?$//' \
            | sed -E 's/-[0-9]{2,}.*$//' \
            | sort | uniq -c | sort -nr | sed -n '1,120p'
          echo ASSET_BASENAME_CLASSES_END
          INNER

      - name: Verify authenticated session retained and staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 && direct_count == 0 ))
          echo LIVE_SESSION_RETAINED=true
          INNER
