name: Tibia Client Analysis Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-analysis-dispatch.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  inspect:
    name: Map Tibia protocol signal IDs to native action names
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Dump bounded player protocol metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          pid=$(pgrep -x client | tail -n1 || true); [[ -n "$pid" ]]
          echo CLIENT_PID=$pid
          echo PLAYER_PROTOCOL_SEND_STRINGS_BEGIN
          strings -a -t x "$bin" | python3 -c 'import sys; 
for line in sys.stdin:
 p=line.strip().split(None,1)
 if len(p)==2:
  try: o=int(p[0],16)
  except: continue
  s=p[1]
  if 0x1ccf000 <= o <= 0x1cd4000 and ("sendGo" in s or "sendRotate" in s or "sendStop" in s or "sendCancel" in s or "sendAttack" in s or "sendFollow" in s or "sendUse" in s or "sendMove" in s or "TPlayerProtocolMessageHandler" in s): print(f"{o:08x} {s}")'
          echo PLAYER_PROTOCOL_SEND_STRINGS_END

          echo METAOBJECT_RELOCS_BEGIN
          readelf -rW "$bin" 2>/dev/null | awk '$1 ~ /^0*308/ || $1 ~ /^0*313ce/ {print}' | sed -n '1,160p' || true
          echo METAOBJECT_RELOCS_END

          echo METAOBJECT_STATIC_REGION_BEGIN
          objdump -s --start-address=0x313ce40 --stop-address=0x313cf20 "$bin" 2>/dev/null || true
          echo METAOBJECT_STATIC_REGION_END

          echo SIGNAL_WRAPPER_IDS_BEGIN
          for a in ee2cd0 ee2d50 ee2dd0 ee2e50 ee2ed0 ee2f50 ee2fd0 ee3050 ee30d0 ee3150 ee31d0 ee3250 ee32d0 ee3350; do
            printf '0x%s ' "$a"
            objdump -d --start-address="0x$a" --stop-address="$((0x$a+8))" "$bin" 2>/dev/null | grep -m1 -E 'mov.*\$0x[0-9a-f]+,%edx' || true
          done
          echo SIGNAL_WRAPPER_IDS_END

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER

      - name: Verify staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
