name: Tibia Client Analysis Dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tibia-client-analysis-dispatch.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  capture:
    name: Trace live Tibia worldmap handlers
    runs-on: oteryn-staging
    timeout-minutes: 6
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Attach to authenticated client and trace worldmap dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export HOME=/data/home DISPLAY=:99
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 && direct_count == 0 ))
          command -v gdb >/dev/null

          base=$(awk '$NF ~ /\/packages\/Tibia\/bin\/client$/ && $3=="00000000" {split($1,a,"-"); print "0x" a[1]; exit}' /proc/$pid/maps)
          [[ -n "$base" ]]
          echo CLIENT_PID=$pid
          echo PIE_BASE=$base

          win=''; best=0
          for w in $(xdotool search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]] || continue
            area=$((width*height))
            if (( area > best )); then win=$w; best=$area; fi
          done
          [[ -n "$win" ]]

          full=$(printf '0x%x' $((base+0xcec8d0)))
          field=$(printf '0x%x' $((base+0xcd3190)))
          create=$(printf '0x%x' $((base+0xcecc70)))
          change=$(printf '0x%x' $((base+0xcecf40)))
          delete=$(printf '0x%x' $((base+0xcd4e20)))
          common=$(printf '0x%x' $((base+0x19a8a80)))

          cat >/tmp/live-map-handlers.gdb <<GDB
          set pagination off
          set confirm off
          set print thread-events off
          set logging file /data/runtime/worldmap-handler-trace.log
          set logging overwrite on
          set logging enabled on
          break *$full
          commands
          silent
          printf "HIT FullMap rdi=%p rsi=%p rdx=%p\\n", \$rdi, \$rsi, \$rdx
          continue
          end
          break *$field
          commands
          silent
          printf "HIT FieldData rdi=%p rsi=%p rdx=%p\\n", \$rdi, \$rsi, \$rdx
          continue
          end
          break *$create
          commands
          silent
          printf "HIT CreateOnMap rdi=%p rsi=%p rdx=%p\\n", \$rdi, \$rsi, \$rdx
          continue
          end
          break *$change
          commands
          silent
          printf "HIT ChangeOnMap rdi=%p rsi=%p rdx=%p\\n", \$rdi, \$rsi, \$rdx
          continue
          end
          break *$delete
          commands
          silent
          printf "HIT DeleteOnMap rdi=%p rsi=%p rdx=%p\\n", \$rdi, \$rsi, \$rdx
          continue
          end
          break *$common
          commands
          silent
          printf "HIT CommonMapData rdi=%p rsi=%p rdx=%p rcx=%p\\n", \$rdi, \$rsi, \$rdx, \$rcx
          continue
          end
          continue
          detach
          quit
          GDB

          rm -f /data/runtime/worldmap-handler-trace.log /data/runtime/worldmap-handler-outer.log
          gdb -q -nx -p "$pid" -x /tmp/live-map-handlers.gdb >/data/runtime/worldmap-handler-outer.log 2>&1 &
          gdbpid=$!
          sleep 3
          kill -0 "$gdbpid"
          xdotool key --window "$win" Right
          sleep 1
          xdotool key --window "$win" Left
          sleep 1
          xdotool key --window "$win" Up
          sleep 1
          xdotool key --window "$win" Down
          sleep 4
          kill -INT "$gdbpid" 2>/dev/null || true
          for n in $(seq 1 10); do
            kill -0 "$gdbpid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$gdbpid" 2>/dev/null; then
            echo GDB_CLEAN_DETACH_TIMEOUT=true
            exit 1
          fi
          wait "$gdbpid" 2>/dev/null || true

          kill -0 "$pid"
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_after=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_after=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_after=$((total_after-local_after))
          echo ACTIVE_LOCAL_SOCKS_COUNT_AFTER_ATTACH=$local_after
          echo ACTIVE_DIRECT_TCP_COUNT_AFTER_ATTACH=$direct_after
          (( local_after > 0 && direct_after == 0 ))
          hits=$(grep -c '^HIT ' /data/runtime/worldmap-handler-trace.log 2>/dev/null || true)
          echo WORLDMAP_HANDLER_HIT_COUNT=$hits
          echo HANDLER_TRACE_BEGIN
          grep '^HIT ' /data/runtime/worldmap-handler-trace.log | head -n 120 || true
          echo HANDLER_TRACE_END
          grep -E 'ptrace|Operation not permitted|Cannot attach|Breakpoint' /data/runtime/worldmap-handler-outer.log | tail -n 30 || true
          (( hits >= 1 ))
          echo LIVE_SESSION_RETAINED=true
          echo LIVE_WORLDMAP_HANDLER_DISPATCH_PROVEN=true
          INNER

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
