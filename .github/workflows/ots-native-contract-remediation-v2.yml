name: OTS native contract remediation v2

on:
  push:
    branches:
      - agents/ots-native-selection-platform-correction-20260804
    paths:
      - .github/workflows/ots-native-contract-remediation-v2.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agents/ots-native-selection-platform-correction-20260804
          fetch-depth: 0
      - name: Apply reviewed remediation with historical ADR exception
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/ots-native-contract-remediation.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = workflow.index(marker) + len(marker)
          shell = textwrap.dedent(workflow[start:])
          shell = shell.replace(
              '    ROOT / "docs/architecture/adr/0011-single-native-protocol-version.md",\n',
              '',
          )
          Path('/tmp/remediate.sh').write_text(shell, encoding='utf-8', newline='\n')
          PY
          bash /tmp/remediate.sh
