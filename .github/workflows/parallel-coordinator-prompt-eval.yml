name: Parallel Coordinator Prompt Eval

on:
  pull_request:
    paths:
      - docs/agents/prompts/OTERYN-PORTAL-COMPLETION-PARALLEL-COORDINATOR-PROMPT.md
      - docs/agents/evals/oteryn-portal-parallel-coordinator-prompt-v1.json
      - .github/workflows/parallel-coordinator-prompt-eval.yml
  push:
    branches:
      - main
    paths:
      - docs/agents/prompts/OTERYN-PORTAL-COMPLETION-PARALLEL-COORDINATOR-PROMPT.md
      - docs/agents/evals/oteryn-portal-parallel-coordinator-prompt-v1.json
      - .github/workflows/parallel-coordinator-prompt-eval.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-coordinator-prompt-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prompt-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run prompt evaluator tests
        run: python tools/validation/test_prompt_eval.py

      - name: Validate parallel coordinator prompt contract
        run: >-
          python tools/validation/prompt_eval.py
          --suite docs/agents/evals/oteryn-portal-parallel-coordinator-prompt-v1.json
