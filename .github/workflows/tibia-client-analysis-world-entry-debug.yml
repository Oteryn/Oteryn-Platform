name: Tibia Client World Entry Debug

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-world-entry-debug.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  debug:
    name: Enter Tibia world through verified character row
    runs-on: oteryn-staging
    timeout-minutes: 8
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Login and enter first verified visible character row
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/warp-trace
          grep -q '^warp=on$' /tmp/warp-trace
          echo WARP_EGRESS_VERIFIED=true

          sed '/^[[:space:]]*quiet_mode[[:space:]]*$/d' /tmp/proxychains-tibia.conf >/tmp/proxychains-tibia-debug.conf
          grep -q '^strict_chain' /tmp/proxychains-tibia-debug.conf
          grep -q '^proxy_dns' /tmp/proxychains-tibia-debug.conf

          pkill -f 'packages/Tibia/bin/client' 2>/dev/null || true
          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          cd "$pkg"
          : >/data/runtime/client-world-entry-debug.log
          nohup proxychains4 -f /tmp/proxychains-tibia-debug.conf "$client" >/data/runtime/client-world-entry-debug.log 2>&1 </dev/null &
          for n in $(seq 1 30); do pgrep -f 'packages/Tibia/bin/client' >/dev/null && break; sleep 1; done
          sleep 10

          best=''; best_area=0; best_width=0; best_height=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p'); height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height))
            if (( area > best_area )); then best=$w; best_area=$area; best_width=$width; best_height=$height; fi
          done
          [[ -n "$best" && "$best_width" == 1020 && "$best_height" == 650 ]]

          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 25

          import -display :99 -window "$best" /tmp/select-fixed.png
          convert /tmp/select-fixed.png -crop 900x500+60+80 -resize 150% -colorspace Gray -contrast-stretch 1%x1% /tmp/select-fixed-ocr.png
          tesseract /tmp/select-fixed-ocr.png stdout --psm 11 2>/dev/null >/tmp/select-fixed.txt || true
          python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/select-fixed.txt').read_text(errors='replace').lower()
          if 'select character' not in t and not ('select' in t and 'character' in t and 'account status' in t):
              raise SystemExit('Select Character dialog not verified')
          print('SELECT_CHARACTER_VERIFIED=true')
          PY

          # Direct screenshot evidence for this exact 1020x650 client geometry places
          # the first visible character row at y≈190..252 and the OK button at 792,511.
          # Click the interior row center, not OCR text whose title/header ambiguity caused prior failures.
          xdotool mousemove --window "$best" 400 214 click 1
          sleep 1
          import -display :99 -window "$best" /tmp/row-selected.png
          xdotool mousemove --window "$best" 792 511 click 1
          echo CHARACTER_ROW_AND_OK_ACTIVATED=true

          sleep 1
          import -display :99 -window "$best" /tmp/entry-fixed-t1.png
          sleep 3
          import -display :99 -window "$best" /tmp/entry-fixed-t4.png
          sleep 6
          import -display :99 -window "$best" /tmp/entry-fixed-t10.png

          pid=$(pgrep -f 'packages/Tibia/bin/client' | head -n1)
          [[ -n "$pid" ]]
          sockets=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          if printf '%s\n' "$sockets" | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -q .; then
            echo CLIENT_DIRECT_TCP_DETECTED=true >&2
            exit 1
          fi
          echo CLIENT_DIRECT_TCP_DETECTED=false

          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('/data/runtime/client-world-entry-debug.log').read_text(errors='replace').splitlines()[-1200:]
          chain=[line for line in lines if 'chain' in line.lower() or 'proxychains' in line.lower() or 'dns-' in line.lower()]
          ports=set(); statuses={k:0 for k in ['ok','timeout','refused','denied','error','failed']}
          for line in chain:
              lo=line.lower()
              for k in statuses:
                  if k in lo: statuses[k]+=1
              for m in re.finditer(r':([0-9]{1,5})(?=\D|$)',line):
                  p=int(m.group(1))
                  if 1 <= p <= 65535 and p != 25344: ports.add(p)
          print(f'PROXY_DEBUG_LINE_COUNT={len(chain)}')
          print('PROXY_TARGET_PORTS=' + ','.join(map(str,sorted(ports))))
          print('PROXY_STATUS_COUNTS=' + ','.join(f'{k}:{v}' for k,v in statuses.items()))
          PY

          for sec in 1 4 10; do
            shot="/tmp/entry-fixed-t${sec}.png"
            convert "$shot" -crop 900x500+60+80 -resize 150% -colorspace Gray -contrast-stretch 1%x1% "/tmp/entry-fixed-t${sec}-ocr.png"
            tesseract "/tmp/entry-fixed-t${sec}-ocr.png" stdout --psm 11 2>/dev/null >"/tmp/entry-fixed-t${sec}.txt" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          allow={'already','logged','connection','failed','error','server','world','queue','maintenance','session','client','account','character','select','login','password','email','online','offline','connecting','please','try','again','could','not','timeout','battle','skills','inventory','health','mana'}
          final=''
          for sec in (1,4,10):
              text=Path(f'/tmp/entry-fixed-t{sec}.txt').read_text(errors='replace').lower()
              if sec==10: final=text
              norm=''.join(ch if ch.isalnum() else ' ' for ch in text)
              safe=[]
              for token in norm.split():
                  if token in allow and token not in safe: safe.append(token)
              print(f'T{sec}_SAFE_TOKENS=' + ','.join(safe))
          account=('account login' in final or ('email' in final and 'password' in final))
          select=('select character' in final)
          game=any(x in final for x in ['battle','skills','inventory','health','mana'])
          print(f'FINAL_ACCOUNT_LOGIN={str(account).lower()}')
          print(f'FINAL_SELECT_CHARACTER={str(select).lower()}')
          print(f'FINAL_GAME_MARKERS={str(game).lower()}')
          if account or select:
              raise SystemExit(2)
          PY

          cp /tmp/entry-fixed-t10.png /tmp/entry-fixed-safe.png
          convert /tmp/entry-fixed-safe.png -fill '#202020' -draw 'rectangle 0,0 1020,70 rectangle 0,70 180,650 rectangle 840,70 1020,650 rectangle 0,520 1020,650' /tmp/entry-fixed-safe.png
          echo WORLD_ENTRY_SCREEN_CAPTURED=true
          INNER

      - name: Export privacy-safe world screenshot
        if: always()
        shell: bash
        run: docker cp "$CONTAINER_NAME:/tmp/entry-fixed-safe.png" /tmp/entry-fixed-safe.png 2>/dev/null || true

      - name: Upload privacy-safe world screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-world-entry-fixed-safe
          path: /tmp/entry-fixed-safe.png
          retention-days: 7
          if-no-files-found: warn

      - name: Verify canonical staging unchanged and client remains running
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker exec "$CONTAINER_NAME" pgrep -f 'packages/Tibia/bin/client' >/dev/null
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
