name: Organization Runner Verify

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'infra/issue-1199-organization-runner-bootstrap' &&
      github.actor == 'blakinio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORG_ADMIN_TOKEN: ${{ secrets.OTERYN_ORG_RUNNER_ADMIN_TOKEN }}
    steps:
      - name: Verify groups and runners
        shell: bash
        run: |
          set -Eeuo pipefail
          api() { curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $ORG_ADMIN_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$@"; }
          groups="$(api https://api.github.com/orgs/Oteryn/actions/runner-groups?per_page=100)"
          runners="$(api https://api.github.com/orgs/Oteryn/actions/runners?per_page=100)"
          for spec in 'platform-runners:oteryn-synology-platform:oteryn-platform' 'atlas-runners:oteryn-synology-atlas:oteryn-atlas' 'game-runners:oteryn-synology-game:oteryn-game'; do
            IFS=: read -r group name label <<< "$spec"
            gid="$(jq -er --arg g "$group" '.runner_groups[] | select(.name==$g) | .id' <<< "$groups")"
            r="$(jq -cer --arg n "$name" '.runners[] | select(.name==$n)' <<< "$runners")"
            status="$(jq -r '.status' <<< "$r")"
            busy="$(jq -r '.busy' <<< "$r")"
            jq -e --arg l "$label" '.labels | map(.name) | index($l) != null' <<< "$r" >/dev/null
            in_group="$(api "https://api.github.com/orgs/Oteryn/actions/runner-groups/$gid/runners?per_page=100" | jq -r --arg n "$name" '[.runners[]? | select(.name==$n)] | length')"
            echo "$name group=$group label=$label status=$status busy=$busy in_group=$in_group"
          done
