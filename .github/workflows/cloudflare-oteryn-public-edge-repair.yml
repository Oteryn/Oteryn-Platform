name: Cloudflare Oteryn Public Edge Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-oteryn-public-edge-repair.yml
      - scripts/operations/cloudflare-oteryn-public-edge-repair.py
      - tests/operations/cloudflare-oteryn-public-edge-repair/**
      - docs/operations/CLOUDFLARE_PUBLIC_EDGE_REPAIR.md
      - docs/agents/tasks/active/OTERYN-20260801-cloudflare-edge-audit.md
      - ops/triggers/cloudflare-oteryn-public-edge-repair.md
  push:
    branches:
      - main
    paths:
      - ops/triggers/cloudflare-oteryn-public-edge-repair.md

permissions:
  contents: read

concurrency:
  group: cloudflare-oteryn-public-edge-repair-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate bounded repair and rollback
        run: bash tests/operations/cloudflare-oteryn-public-edge-repair/run.sh

      - name: Validate sanitized failure classification
        run: bash tests/operations/cloudflare-oteryn-public-edge-repair/failure-result.sh

      - name: Validate exact operational marker boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Fxq 'ops/triggers/cloudflare-oteryn-public-edge-repair.md' <<<"$changed_files"; then
            marker="$(cat ops/triggers/cloudflare-oteryn-public-edge-repair.md)"
            inert=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: inert\nconfirmation:'
            audit=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: audit\nconfirmation:'
            apply=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: apply\nconfirmation: APPLY-OTERYN-PUBLIC-EDGE-REPAIR'
            rollback=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: rollback\nconfirmation: ROLLBACK-OTERYN-PUBLIC-EDGE-REPAIR'
            if [[ "$marker" == "$inert" ]]; then
              echo 'Validated inert repair marker cleanup.'
            elif [[ "$marker" == "$audit" || "$marker" == "$apply" || "$marker" == "$rollback" ]]; then
              [[ "$changed_files" == 'ops/triggers/cloudflare-oteryn-public-edge-repair.md' ]] || {
                echo 'An operational repair PR may change only the repair marker.' >&2
                exit 1
              }
            else
              echo 'Repair marker is not an exact allowed request.' >&2
              exit 1
            fi
          fi

  operate:
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_AUDIT_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_PUBLIC_EDGE_REPAIR_OUT: cloudflare-public-edge-repair
      CLOUDFLARE_EDGE_AUDIT_OUT: cloudflare-edge-audit
      OTERYN_PUBLIC_EDGE_OUT: public-edge-validation

    steps:
      - name: Checkout exact trusted main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run exact trusted-main repair request
        id: operation
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Cloudflare repair operations are restricted to main.' >&2
            exit 1
          }
          marker="$(cat ops/triggers/cloudflare-oteryn-public-edge-repair.md)"
          inert=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: inert\nconfirmation:'
          audit=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: audit\nconfirmation:'
          apply=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: apply\nconfirmation: APPLY-OTERYN-PUBLIC-EDGE-REPAIR'
          rollback=$'# Cloudflare Oteryn public edge repair trigger\n\nmode: rollback\nconfirmation: ROLLBACK-OTERYN-PUBLIC-EDGE-REPAIR'

          if [[ "$marker" == "$inert" ]]; then
            printf '%s\n' \
              'operation_status=noop' \
              'mode=inert' \
              'mutation=none' >repair-result.txt
            echo 'mode=inert' >>"$GITHUB_OUTPUT"
            echo 'exit_code=0' >>"$GITHUB_OUTPUT"
            exit 0
          elif [[ "$marker" == "$audit" ]]; then
            mode='audit'
            confirmation=''
          elif [[ "$marker" == "$apply" ]]; then
            mode='apply'
            confirmation='APPLY-OTERYN-PUBLIC-EDGE-REPAIR'
          elif [[ "$marker" == "$rollback" ]]; then
            mode='rollback'
            confirmation='ROLLBACK-OTERYN-PUBLIC-EDGE-REPAIR'
          else
            echo 'Trusted main contains an invalid repair marker.' >&2
            exit 1
          fi

          raw_output="$(mktemp)"
          set +e
          CLOUDFLARE_EDGE_REPAIR_CONFIRMATION="$confirmation" \
            python3 scripts/operations/cloudflare-oteryn-public-edge-repair.py "$mode" \
            >"$raw_output" 2>&1
          exit_code=$?
          set -e
          {
            if [[ "$exit_code" == '0' ]]; then
              echo 'operation_status=success'
            else
              echo 'operation_status=failed'
            fi
            grep -E '^(mode|candidate_count|repair_rule_count|repair_state|repair_before_candidate|bot_fight_mode|desired_state|mutation)=' "$raw_output" || true
            if [[ "$exit_code" != '0' ]]; then
              python3 scripts/operations/cloudflare-oteryn-public-edge-failure.py "$raw_output"
            fi
          } >repair-result.txt
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >>"$GITHUB_OUTPUT"

      - name: Audit state after operation failure
        id: failure-audit
        if: steps.operation.outputs.exit_code != '0' && (steps.operation.outputs.mode == 'apply' || steps.operation.outputs.mode == 'rollback')
        continue-on-error: true
        run: |
          set -euo pipefail
          raw_audit="$(mktemp)"
          set +e
          CLOUDFLARE_EDGE_REPAIR_CONFIRMATION='' \
            python3 scripts/operations/cloudflare-oteryn-public-edge-repair.py audit \
            >"$raw_audit" 2>&1
          audit_exit=$?
          set -e
          {
            if [[ "$audit_exit" == '0' ]]; then
              echo 'post_failure_audit=success'
            else
              echo 'post_failure_audit=failed'
            fi
            grep -E '^(candidate_count|repair_rule_count|repair_state|repair_before_candidate|bot_fight_mode|desired_state|mutation)=' "$raw_audit" || true
          } >post-failure-audit-result.txt
          exit "$audit_exit"

      - name: Read post-operation Cloudflare edge state
        id: edge
        if: steps.operation.outputs.exit_code == '0' && (steps.operation.outputs.mode == 'apply' || steps.operation.outputs.mode == 'rollback')
        continue-on-error: true
        run: python3 scripts/operations/cloudflare-oteryn-edge-audit.py

      - name: Probe post-operation public DNS TLS and HTTP
        id: public
        if: steps.operation.outputs.exit_code == '0' && (steps.operation.outputs.mode == 'apply' || steps.operation.outputs.mode == 'rollback')
        continue-on-error: true
        run: python3 scripts/operations/oteryn-public-edge-validation.py

      - name: Build bounded public result
        if: always() && steps.operation.outputs.exit_code == '0' && (steps.operation.outputs.mode == 'apply' || steps.operation.outputs.mode == 'rollback')
        env:
          EDGE_OUTCOME: ${{ steps.edge.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EDGE_OUTCOME" == 'success' && "$PUBLIC_OUTCOME" == 'success' \
                && -f cloudflare-edge-audit/evidence.json \
                && -f public-edge-validation/evidence.json ]]; then
            python3 scripts/operations/oteryn-public-edge-result.py \
              cloudflare-edge-audit/evidence.json \
              public-edge-validation/evidence.json >public-edge-result.txt
          else
            printf '%s\n' \
              'operation_status=failed' \
              "edge_collector_outcome=$EDGE_OUTCOME" \
              "public_collector_outcome=$PUBLIC_OUTCOME" \
              'edge_mutation=none' \
              'public_mutation=none' >public-edge-result.txt
          fi

      - name: Upload sanitized repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-oteryn-public-edge-repair-${{ github.run_id }}
          path: |
            cloudflare-public-edge-repair/
            cloudflare-edge-audit/
            public-edge-validation/
            repair-result.txt
            post-failure-audit-result.txt
            public-edge-result.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded result to production issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '91'
        run: |
          set -euo pipefail
          repair="$(cat repair-result.txt 2>/dev/null || printf 'operation_status=failed')"
          post_failure="$(cat post-failure-audit-result.txt 2>/dev/null || printf 'post_failure_audit=not_run')"
          public="$(cat public-edge-result.txt 2>/dev/null || printf 'public_result=not_run')"
          body="$(printf '## Cloudflare Oteryn public-edge repair\n\n```text\nrun_id=%s\ntrusted_sha=%s\n%s\n%s\n%s\n```\n\nOnly bounded repair and public-validation fields are published. Raw API responses, rule expressions, country literals, bodies and credentials are excluded.' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$repair" "$post_failure" "$public")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null

      - name: Propagate operation failure
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1

      - name: Propagate collector execution failure
        if: >-
          steps.operation.outputs.exit_code == '0' &&
          (steps.operation.outputs.mode == 'apply' || steps.operation.outputs.mode == 'rollback') &&
          (steps.edge.outcome != 'success' || steps.public.outcome != 'success')
        run: exit 1
