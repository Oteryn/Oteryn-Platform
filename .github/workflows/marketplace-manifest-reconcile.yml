name: Marketplace Manifest Reconcile

on:
  pull_request:
    paths:
      - '.github/workflows/marketplace-manifest-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Reconcile Marketplace coverage records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/acceptance/coverage/portal-coverage-manifest.json')
          data = json.loads(path.read_text())
          remove_ids = {
              'marketplace.public-catalogue-detail',
              'marketplace.account-auction-wallet-lifecycle',
              'marketplace.admin-wallet-recovery',
          }
          data['surfaces'] = [surface for surface in data['surfaces'] if surface['id'] not in remove_ids]

          expected_surface = None
          for surface in data['surfaces']:
              if surface['id'] == 'marketplace.authenticated-auction-lifecycle':
                  expected_surface = surface
                  break
          if expected_surface is None:
              raise SystemExit('Expected authenticated Marketplace coverage record was not found.')

          marker = '@portal-marketplace-account authenticated watch bid wallet reservation complete state matrix and authorization journey'
          evidence_found = False
          for evidence in expected_surface.get('evidence', []):
              if evidence.get('file') == 'scripts/acceptance/tests/marketplace-acceptance.spec.mjs':
                  evidence['markers'] = [marker]
                  evidence_found = True
          if not evidence_found:
              expected_surface.setdefault('evidence', []).append({
                  'file': 'scripts/acceptance/tests/marketplace-acceptance.spec.mjs',
                  'markers': [marker],
              })

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/acceptance/coverage/portal-coverage-manifest.json
          git commit -m 'test(marketplace): reconcile coverage records'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload reconciled manifest
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-reconciled-manifest-${{ github.sha }}
          path: scripts/acceptance/coverage/portal-coverage-manifest.json
          if-no-files-found: error
          retention-days: 1
