name: Oteryn Terminal Branch Lifecycle Read Reusable

on:
  workflow_call:
    inputs:
      platform_ref:
        description: Immutable Oteryn-Platform commit SHA used for lifecycle tooling
        required: true
        type: string
      policy_path:
        description: Caller-local branch lifecycle policy path
        required: false
        default: docs/agents/BRANCH_LIFECYCLE_POLICY.json
        type: string
      approval_path:
        description: Caller-local reviewed historical deletion approval path
        required: false
        default: docs/agents/TERMINAL_BRANCH_DELETION_APPROVAL.json
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  read:
    name: read-only-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned lifecycle implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: ${{ inputs.platform_ref }}
          path: .oteryn-branch-lifecycle
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate caller lifecycle policy
        shell: bash
        run: |
          python3 .oteryn-branch-lifecycle/tools/agents/branch_lifecycle.py \
            --mode validate-policy \
            --root "$GITHUB_WORKSPACE" \
            --policy "${{ inputs.policy_path }}"

      - name: Build fail-closed live inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .oteryn-branch-lifecycle/tools/agents/terminal_branch_cleanup.py \
            --mode inventory \
            --root "$GITHUB_WORKSPACE" \
            --policy "${{ inputs.policy_path }}" \
            --output terminal-branch-report.json \
            --generate-manifest terminal-branch-deletion-manifest.generated.json

      - name: Validate reviewed historical candidate digest when present
        shell: bash
        run: |
          if [[ -f "${{ inputs.approval_path }}" ]]; then
            python3 .oteryn-branch-lifecycle/tools/agents/terminal_branch_approval.py \
              --approval "${{ inputs.approval_path }}" \
              --manifest terminal-branch-deletion-manifest.generated.json \
              --report terminal-branch-report.json \
              --output terminal-branch-approval-validation.json
          else
            echo "No reviewed historical deletion approval is present; validation is NOT_APPLICABLE."
          fi

      - name: Publish read-only lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-branch-lifecycle-read-${{ github.repository_id }}-${{ github.run_id }}
          path: |
            terminal-branch-report.json
            terminal-branch-deletion-manifest.generated.json
            terminal-branch-approval-validation.json
          if-no-files-found: warn
          retention-days: 30
