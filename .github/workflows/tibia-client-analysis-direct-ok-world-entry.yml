name: Tibia Direct OK World Entry

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-direct-ok-world-entry.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  login:
    name: Click only verified Select Character OK and leave online on success
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Verify owned runtime and snapshot staging
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv

      - name: Authenticate then invoke only verified OK callback
        shell: bash
        env:
          TIBIA_TEST_EMAIL: ${{ secrets.TIBIA_TEST_EMAIL }}
          TIBIA_TEST_PASSWORD: ${{ secrets.TIBIA_TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$TIBIA_TEST_EMAIL" && -n "$TIBIA_TEST_PASSWORD" ]]
          docker exec -e TIBIA_TEST_EMAIL -e TIBIA_TEST_PASSWORD -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pkg="$HOME/.local/share/CipSoft GmbH/Tibia/packages/Tibia"
          client="$pkg/bin/client"
          lvp=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1 || true)
          [[ -n "$lvp" && -f "$lvp" ]]
          VK_ICD_FILENAMES="$lvp" VK_DRIVER_FILES="$lvp" LIBGL_ALWAYS_SOFTWARE=1 vulkaninfo --summary >/tmp/direct-ok-vulkan.txt 2>/dev/null
          grep -Eqi 'lavapipe|llvmpipe' /tmp/direct-ok-vulkan.txt
          echo SOFTWARE_VULKAN_VERIFIED=true

          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace >/tmp/direct-ok-warp.trace
          grep -q '^warp=on$' /tmp/direct-ok-warp.trace
          echo WARP_VERIFIED=true
          cat >/tmp/proxychains-direct-ok.conf <<'EOF'
          strict_chain
          proxy_dns
          quiet_mode
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 25344
          EOF

          pkill -x client 2>/dev/null || true
          pgrep -f '^Xvfb :99' >/dev/null || nohup Xvfb :99 -screen 0 1280x800x24 >/data/runtime/xvfb.log 2>&1 </dev/null &
          : >/data/runtime/client-direct-ok.log
          cd "$pkg"
          nohup env VK_ICD_FILENAMES="$lvp" VK_DRIVER_FILES="$lvp" LIBGL_ALWAYS_SOFTWARE=1 \
            proxychains4 -f /tmp/proxychains-direct-ok.conf "$client" \
            >/data/runtime/client-direct-ok.log 2>&1 </dev/null &
          for n in $(seq 1 40); do pgrep -x client >/dev/null && break; sleep 0.5; done
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          sleep 12
          ! grep -Fqi 'failed vulkan instance' /data/runtime/client-direct-ok.log
          echo CLIENT_SOFTWARE_VULKAN_CLEAN=true

          best=''; best_area=0; bw=0; bh=0
          for w in $(xdotool search --onlyvisible --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ -n "$width" && -n "$height" ]] || continue
            area=$((width*height))
            if (( area > best_area )); then best=$w; best_area=$area; bw=$width; bh=$height; fi
          done
          [[ -n "$best" && "$bw" == 1020 && "$bh" == 650 ]]

          xdotool mousemove --window "$best" 535 275 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_EMAIL"
          xdotool mousemove --window "$best" 535 304 click 1
          xdotool key --window "$best" ctrl+a
          xdotool type --window "$best" --delay 3 -- "$TIBIA_TEST_PASSWORD"
          xdotool mousemove --window "$best" 590 388 click 1
          unset TIBIA_TEST_EMAIL TIBIA_TEST_PASSWORD
          sleep 25

          import -display :99 -window "$best" /tmp/direct-ok-select.png
          convert /tmp/direct-ok-select.png -resize 200% -colorspace Gray -contrast-stretch 1%x1% /tmp/direct-ok-select-ocr.png
          tesseract /tmp/direct-ok-select-ocr.png stdout --psm 11 tsv 2>/dev/null >/tmp/direct-ok-select.tsv || true
          python3 - <<'PY' >/tmp/direct-ok.env
          import csv
          anchors=[]; oks=[]; cancels=[]; row_tokens=[]
          with open('/tmp/direct-ok-select.tsv',newline='',errors='replace') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  token=(r.get('text') or '').strip().lower().strip(':,.!?()[]')
                  try:
                      conf=float(r.get('conf') or -1)
                      left=int(r.get('left') or 0)//2; top=int(r.get('top') or 0)//2
                      width=max(1,int(r.get('width') or 0)//2); height=max(1,int(r.get('height') or 0)//2)
                  except ValueError:
                      continue
                  if conf < 20:
                      continue
                  x=left+width//2; y=top+height//2
                  if token in {'select','character','status'}: anchors.append((token,x,y))
                  if token=='ok': oks.append((conf,x,y))
                  if token=='cancel': cancels.append((conf,x,y))
                  if 180 <= x <= 600 and 185 <= y <= 205: row_tokens.append((x,y))
          title=any(t=='select' and 100<=y<=130 for t,x,y in anchors)
          header=any(t=='character' and 160<=y<=185 for t,x,y in anchors)
          if not title or not header or not row_tokens:
              raise SystemExit('Select Character and populated row not proven')
          if oks:
              _,x,y=max(oks)
          elif cancels:
              _,cx,cy=max(cancels); x=cx-52; y=cy
          else:
              raise SystemExit('OK action not proven')
          if not (775 <= x <= 805 and 500 <= y <= 520):
              raise SystemExit(f'unsafe OK geometry {x},{y}')
          print(f'OK_X={x}')
          print(f'OK_Y={y}')
          print(f'ROW_TOKEN_COUNT={len(row_tokens)}')
          PY
          source /tmp/direct-ok.env
          echo SELECT_CHARACTER_POPULATED=true
          echo "VERIFIED_OK_GEOMETRY=$OK_X,$OK_Y"
          echo "VISIBLE_ROW_TOKEN_COUNT=$ROW_TOKEN_COUNT"

          # Intentionally do not click, focus, or otherwise modify the character row.
          xdotool mousemove --window "$best" "$OK_X" "$OK_Y" click 1
          echo DIRECT_OK_ONLY_CLICKED=true
          sleep 0.25
          import -display :99 -window "$best" /tmp/direct-ok-t025.png
          sleep 0.75
          import -display :99 -window "$best" /tmp/direct-ok-t1.png
          sleep 4
          import -display :99 -window "$best" /tmp/direct-ok-t5.png
          sleep 25
          import -display :99 -window "$best" /tmp/direct-ok-t30.png
          for n in 025 1 5 30; do
            convert "/tmp/direct-ok-t${n}.png" -crop 900x500+60+80 -resize 150% -colorspace Gray -contrast-stretch 1%x1% "/tmp/direct-ok-t${n}-ocr.png"
            tesseract "/tmp/direct-ok-t${n}-ocr.png" stdout --psm 11 2>/dev/null >"/tmp/direct-ok-t${n}.txt" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          allow={'account','login','email','password','select','character','connecting','connection','failed','error','server','world','game','battle','skills','inventory','health','mana','capacity','experience','store','vip','prey','quest','online','already','logged','session','disconnected','queue','maintenance'}
          final=''
          for n in ('025','1','5','30'):
              raw=Path(f'/tmp/direct-ok-t{n}.txt').read_text(errors='replace').lower()
              if n=='30': final=raw
              safe=[]
              for w in re.findall(r'[a-z]+',raw):
                  if w in allow and w not in safe: safe.append(w)
              print(f'T{n}_SAFE=' + ','.join(safe))
          account=('account login' in final or ('email' in final and 'password' in final))
          select=('select character' in final)
          game=sum(x in final for x in ('battle','skills','inventory','health','mana','capacity','experience'))>=2
          print(f'FINAL_ACCOUNT_LOGIN={str(account).lower()}')
          print(f'FINAL_SELECT_CHARACTER={str(select).lower()}')
          print(f'FINAL_GAME_MARKERS={str(game).lower()}')
          if account or select or not game:
              raise SystemExit(6)
          PY

          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          direct_tcp=$(ss -ntp 2>/dev/null | grep "pid=$pid," | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):25344$' | grep -c . || true)
          udp_count=$(ss -nup 2>/dev/null | grep "pid=$pid," | grep -c . || true)
          [[ "$direct_tcp" -eq 0 && "$udp_count" -eq 0 ]]
          cp /tmp/direct-ok-t30.png /tmp/tibia-direct-ok-online-safe.png
          convert /tmp/tibia-direct-ok-online-safe.png -fill '#202020' -draw 'rectangle 0,0 1020,70 rectangle 0,70 180,650 rectangle 840,70 1020,650 rectangle 0,520 1020,650' /tmp/tibia-direct-ok-online-safe.png
          echo PHYSICAL_TIBIA_WORLD_LOGIN_PROVEN=true
          echo TIBIA_CHARACTER_LEFT_ONLINE=true
          INNER
          docker cp "$CONTAINER_NAME:/tmp/tibia-direct-ok-online-safe.png" /tmp/tibia-direct-ok-online-safe.png

      - name: Upload privacy-safe in-world proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tibia-direct-ok-online-proof
          path: /tmp/tibia-direct-ok-online-safe.png
          retention-days: 7
          if-no-files-found: warn

      - name: Verify canonical staging unchanged and client remains running
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker exec "$CONTAINER_NAME" pgrep -x client >/dev/null
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
