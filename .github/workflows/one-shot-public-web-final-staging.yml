name: One-shot Public Web Final Staging Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-public-web-final-staging.yml
      - deploy/synology/scripts/deploy.sh

permissions:
  actions: write
  contents: read
  issues: write
  packages: read

concurrency:
  group: public-web-final-staging-closure
  cancel-in-progress: false

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[public-web-final-staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy_run_id: ${{ steps.monitor.outputs.deploy_run_id }}
      release_tag: ${{ steps.images.outputs.release_tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for exact Platform and Gateway images
        id: images
        run: |
          set -euo pipefail
          release_tag="sha-${GITHUB_SHA}"

          wait_for_image() {
            local image="$1"
            for attempt in $(seq 1 180); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "Resolved exact image: $image"
                return 0
              fi
              echo "Waiting for exact image (attempt $attempt/180)"
              sleep 10
            done
            echo "Timed out waiting for exact image tag." >&2
            return 1
          }

          wait_for_image "ghcr.io/blakinio/oteryn-platform:${release_tag}"
          wait_for_image "ghcr.io/blakinio/oteryn-game-gateway:${release_tag}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch guarded Synology staging deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.images.outputs.release_tag }}
          CANARY_IMAGE_DIGEST: ghcr.io/blakinio/canary@sha256:784e5dbdcc64e311c48c51cd94aa206e2efa1e5eefb2f4ef40170d5aac55031f
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-synology-staging.yml/dispatches" \
            -f ref=main \
            -f 'inputs[action]=deploy' \
            -f "inputs[release_tag]=${RELEASE_TAG}" \
            -f "inputs[canary_image]=${CANARY_IMAGE_DIGEST}" \
            -f 'inputs[canary_game_bind_address]=192.168.1.2' \
            -f 'inputs[game_world_id]=1' \
            -f 'inputs[game_world_slug]=oteryn-staging' \
            -f 'inputs[game_world_name]=Oteryn Staging' \
            -f 'inputs[game_world_region]=LAN'
          echo "DEPLOY_DISPATCHED_AT=$dispatched_at" >> "$GITHUB_ENV"

      - name: Locate and monitor deployment run
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deploy_run_id=""
          for attempt in $(seq 1 60); do
            deploy_run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-synology-staging.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
                --jq ".workflow_runs | map(select(.created_at >= \"${DEPLOY_DISPATCHED_AT}\")) | sort_by(.created_at) | last | .id // empty"
            )"
            if [[ -n "$deploy_run_id" ]]; then
              break
            fi
            echo "Waiting for deployment run registration (attempt $attempt/60)"
            sleep 5
          done

          if [[ -z "$deploy_run_id" ]]; then
            echo "Deployment dispatch was accepted but no matching run appeared." >&2
            exit 1
          fi

          echo "deploy_run_id=$deploy_run_id" >> "$GITHUB_OUTPUT"
          echo "Monitoring Deploy Synology Staging run ${deploy_run_id}."
          gh run watch "$deploy_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  live-smoke:
    needs: dispatch
    runs-on: oteryn-staging
    environment: synology-staging
    timeout-minutes: 30
    env:
      EXPECTED_RELEASE_TAG: ${{ needs.dispatch.outputs.release_tag }}
      DEPLOY_RUN_ID: ${{ needs.dispatch.outputs.deploy_run_id }}
      STAGING_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify exact deployed images
        run: |
          set -euo pipefail
          platform_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=platform \
            --format '{{.ID}}')"
          gateway_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=gateway \
            --format '{{.ID}}')"

          if [[ "$(wc -w <<<"$platform_container")" -ne 1 || "$(wc -w <<<"$gateway_container")" -ne 1 ]]; then
            echo "Expected exactly one running Platform and Gateway staging container." >&2
            exit 1
          fi

          expected_platform="ghcr.io/blakinio/oteryn-platform:${EXPECTED_RELEASE_TAG}"
          expected_gateway="ghcr.io/blakinio/oteryn-game-gateway:${EXPECTED_RELEASE_TAG}"
          actual_platform="$(docker inspect --format '{{.Config.Image}}' "$platform_container")"
          actual_gateway="$(docker inspect --format '{{.Config.Image}}' "$gateway_container")"

          [[ "$actual_platform" == "$expected_platform" ]]
          [[ "$actual_gateway" == "$expected_gateway" ]]
          echo "PLATFORM_CONTAINER=$platform_container" >> "$GITHUB_ENV"
          echo "PLATFORM_IMAGE=$actual_platform" >> "$GITHUB_ENV"
          echo "GATEWAY_IMAGE=$actual_gateway" >> "$GITHUB_ENV"

      - name: Install or verify reviewed Wiki launch content
        run: |
          set -euo pipefail
          publisher="$(docker exec -i "$PLATFORM_CONTAINER" php <<'PHP'
          <?php
          require '/var/www/html/vendor/autoload.php';
          $app = require '/var/www/html/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $authorization = $app->make(App\Wiki\Application\WikiAuthorization::class);
          $eligible = [];
          foreach (App\Identity\Models\Identity::query()->whereNull('disabled_at')->orderBy('id')->cursor() as $identity) {
              if (! $identity->hasConfirmedMfa()) {
                  continue;
              }
              try {
                  $authorization->assertCanAccess($identity);
                  $authorization->assertCanManageCategories($identity);
                  $authorization->assertCanManageArticles($identity);
                  $authorization->assertCanPublish($identity);
              } catch (Throwable) {
                  continue;
              }
              $eligible[] = $identity->email;
          }
          if (count($eligible) !== 1) {
              fwrite(STDERR, 'Expected exactly one eligible staging Wiki publisher; found '.count($eligible).PHP_EOL);
              exit(32);
          }
          echo $eligible[0];
          PHP
          )"

          if [[ -z "$publisher" ]]; then
            echo "Eligible Wiki publisher resolution returned an empty value." >&2
            exit 1
          fi

          docker exec "$PLATFORM_CONTAINER" \
            php artisan wiki:launch-content:install \
            "$publisher" \
            --content-version=2026-07-26.1
          unset publisher

      - name: Execute live Chromium staging smoke
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          cat > "$smoke_dir/smoke.cjs" <<'JS'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const baseUrl = process.env.STAGING_BASE_URL;
          const expectedSha = process.env.EXPECTED_SHA;
          const deployRunId = process.env.DEPLOY_RUN_ID;
          const platformImage = process.env.PLATFORM_IMAGE;
          const gatewayImage = process.env.GATEWAY_IMAGE;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            const checks = [];

            async function checkPage(path, heading) {
              const response = await page.goto(`${baseUrl}${path}`, { waitUntil: 'domcontentloaded' });
              if (!response || response.status() !== 200) {
                throw new Error(`${path} returned ${response ? response.status() : 'no response'}`);
              }
              if (heading) {
                await page.getByRole('heading', { level: 1, name: heading, exact: true }).waitFor();
              }
              checks.push({ path, status: response.status(), heading: heading || null });
            }

            await checkPage('/en', null);
            await checkPage('/en/wiki', 'Wiki');
            await checkPage('/en/wiki/download-and-installation', 'Download and installation');
            await checkPage('/pl/wiki/pobieranie-i-instalacja', 'Pobieranie i instalacja');

            for (const path of ['/sitemap.xml', '/robots.txt']) {
              const response = await context.request.get(`${baseUrl}${path}`);
              if (response.status() !== 200) {
                throw new Error(`${path} returned ${response.status()}`);
              }
              checks.push({ path, status: response.status(), heading: null });
            }

            await browser.close();
            fs.writeFileSync('/work/evidence.json', JSON.stringify({
              classification: 'STAGING_PROVEN',
              commit_sha: expectedSha,
              deploy_run_id: deployRunId,
              platform_image: platformImage,
              gateway_image: gatewayImage,
              checked_at: new Date().toISOString(),
              checks,
            }, null, 2));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          JS

          docker run --rm \
            --network host \
            -e STAGING_BASE_URL="$STAGING_BASE_URL" \
            -e EXPECTED_SHA="$GITHUB_SHA" \
            -e DEPLOY_RUN_ID="$DEPLOY_RUN_ID" \
            -e PLATFORM_IMAGE="$PLATFORM_IMAGE" \
            -e GATEWAY_IMAGE="$GATEWAY_IMAGE" \
            -v "$smoke_dir:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            bash -lc 'npm init -y >/dev/null && npm install playwright@1.60.0 --save-exact --ignore-scripts >/dev/null && node smoke.cjs'

          cp "$smoke_dir/evidence.json" public-web-final-staging-evidence.json

      - name: Upload sanitized staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-web-final-staging-${{ github.sha }}
          path: public-web-final-staging-evidence.json
          if-no-files-found: error
          retention-days: 14

  report:
    if: always()
    needs:
      - dispatch
      - live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISPATCH_RESULT: ${{ needs.dispatch.result }}
      LIVE_SMOKE_RESULT: ${{ needs.live-smoke.result }}
      DEPLOY_RUN_ID: ${{ needs.dispatch.outputs.deploy_run_id }}
      RELEASE_TAG: ${{ needs.dispatch.outputs.release_tag }}
    steps:
      - name: Report sanitized final-staging result to Issue 145
        run: |
          set -euo pipefail
          outcome=FAIL
          if [[ "$DISPATCH_RESULT" == success && "$LIVE_SMOKE_RESULT" == success ]]; then
            outcome=PASS
          fi

          artifact_name="public-web-final-staging-${GITHUB_SHA}"
          body="$(cat <<EOF
          <!-- public-web-final-staging:${GITHUB_SHA}:${GITHUB_RUN_ID} -->
          Final Synology staging closure result: **${outcome}**

          - exact trusted main SHA: \`${GITHUB_SHA}\`
          - release tag: \`${RELEASE_TAG:-unresolved}\`
          - one-shot run: \`${GITHUB_RUN_ID}\`
          - deployment run: \`${DEPLOY_RUN_ID:-unresolved}\`
          - dispatch result: \`${DISPATCH_RESULT}\`
          - live Chromium smoke result: \`${LIVE_SMOKE_RESULT}\`
          - sanitized artifact: \`${artifact_name}\`

          No identity email, secret, private path or image byte was included in this report. A PASS means exact deployed image tags, reviewed Wiki content installation/verification and all six bounded public browser assertions succeeded.
          EOF
          )"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/145/comments" \
            -f body="$body"
