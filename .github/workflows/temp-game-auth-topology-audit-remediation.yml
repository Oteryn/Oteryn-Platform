name: Issue 720 audit remediation

on:
  push:
    branches: [docs/issue-720-game-auth-topology-reconcile]
    paths:
      - .github/workflows/temp-game-auth-topology-audit-remediation.yml
      - tools/agents/issue720_audit_remediation.py

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/issue-720-game-auth-topology-reconcile
          fetch-depth: 0
      - name: Apply audit remediation
        run: |
          set -euo pipefail
          python3 tools/agents/issue720_audit_remediation.py
          git diff --check
          git rm .github/workflows/temp-game-auth-topology-audit-remediation.yml tools/agents/issue720_audit_remediation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/contracts/AUTH_GAME_LOGIN_CONTRACT.md docs/agents/tasks/active/OTERYN-20260806-game-auth-topology-reconciliation.md
          git commit -m 'docs(auth): resolve Gateway authority contradiction'
          git diff --check origin/main...HEAD
          git push origin HEAD:docs/issue-720-game-auth-topology-reconcile
