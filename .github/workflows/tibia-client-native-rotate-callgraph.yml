name: Tibia Native Rotate Callgraph

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-native-rotate-callgraph.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  trace:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Trace stripped native rotate callgraph without touching live process
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          [[ -x "$bin" ]]
          echo CLIENT_SHA256=$(sha256sum "$bin" | awk '{print $1}')
          echo '=== SEND_ROTATE_EAST 0xee3250 ==='
          objdump -d -M intel --start-address=0xee3200 --stop-address=0xee32c0 "$bin"
          echo '=== MOVEMENT_METACALL 0xd1a920 ==='
          objdump -d -M intel --start-address=0xd1a8c0 --stop-address=0xd1aca0 "$bin"
          echo '=== DIRECT_CALL_TARGETS_FROM_MOVEMENT_METACALL ==='
          objdump -d -M intel --start-address=0xd1a920 --stop-address=0xd1b400 "$bin" \
            | awk '/call/{print}' | head -n 300
          echo '=== ROTATE_MESSAGE_STRINGS ==='
          strings -a -t x "$bin" | grep -E 'sendRotate(East|West)|GameclientMessageRotate(East|West)|prepareAndEnqueueGameclientMessage|TProtocolClientMessageProcessor|TProtocolWriter' | head -n 100 || true
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
