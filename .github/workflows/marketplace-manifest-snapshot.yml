name: Marketplace Manifest Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/marketplace-manifest-snapshot.yml'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload manifest snapshot
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-manifest-snapshot-${{ github.sha }}
          path: scripts/acceptance/coverage/portal-coverage-manifest.json
          if-no-files-found: error
          retention-days: 1
