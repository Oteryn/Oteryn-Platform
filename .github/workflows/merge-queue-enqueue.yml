name: Merge Queue Enqueue

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to enqueue
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA already qualified by platform-gate
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: merge-queue-enqueue-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.command.outputs.allowed }}
      pr_number: ${{ steps.command.outputs.pr_number }}
      expected_head_sha: ${{ steps.command.outputs.expected_head_sha }}
    steps:
      - name: Authorize exact invocation
        id: command
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=false
          pr_number=''
          expected_head_sha=''
          if [[ "$EVENT_NAME" == workflow_dispatch && "$WORKFLOW_REF" == refs/heads/main ]]; then
            pr_number="$INPUT_PR_NUMBER"
            expected_head_sha="$INPUT_EXPECTED_HEAD_SHA"
            allowed=true
          elif [[ "$EVENT_NAME" == issue_comment && "$ISSUE_IS_PULL_REQUEST" == true \
            && "$AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ \
            && "$COMMENT_BODY" =~ ^/oteryn-mq-enqueue\ ([0-9a-fA-F]{40})$ ]]; then
            pr_number="$ISSUE_NUMBER"
            expected_head_sha="${BASH_REMATCH[1]}"
            allowed=true
          fi
          {
            echo "allowed=$allowed"
            echo "pr_number=$pr_number"
            echo "expected_head_sha=$expected_head_sha"
          } >> "$GITHUB_OUTPUT"

  enqueue:
    needs: authorize
    if: ${{ needs.authorize.outputs.allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enqueue exact qualified pull request
        env:
          MQ_GITHUB_READ_TOKEN: ${{ github.token }}
          MQ_GITHUB_MUTATION_TOKEN: ${{ secrets.OTERYN_MQ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.expected_head_sha }}
        run: >-
          python scripts/github/merge_queue_enqueue.py
          --repository "$REPOSITORY"
          --pr-number "$PR_NUMBER"
          --expected-head-sha "$EXPECTED_HEAD_SHA"
