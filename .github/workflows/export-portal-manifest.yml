name: Export Portal Manifest

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-portal-manifest.yml'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'
  push:
    branches:
      - test/OTERYN-20260727-exhaustive-portal-acceptance-v2
    paths:
      - '.github/workflows/export-portal-manifest.yml'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
      - name: Upload exact portal manifest
        uses: actions/upload-artifact@v6
        with:
          name: portal-manifest-${{ github.sha }}
          path: scripts/acceptance/coverage/portal-coverage-manifest.json
          if-no-files-found: error
          retention-days: 1
