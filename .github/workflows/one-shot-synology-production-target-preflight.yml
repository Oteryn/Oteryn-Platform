name: One-shot Synology Production Target Preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-synology-production-target-preflight.yml
      - deploy/synology/.production-target-preflight-trigger

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: synology-production-target-preflight-one-shot
  cancel-in-progress: false

env:
  TRACKING_ISSUE: "238"

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[synology-production-target-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Dispatch trusted-main live preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/synology-production-target-preflight.yml/dispatches" \
            -f ref=main \
            -f 'inputs[run_restore_drill]=true'
          echo "PREFLIGHT_DISPATCHED_AT=$dispatched_at" >> "$GITHUB_ENV"

      - name: Locate live preflight run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/synology-production-target-preflight.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
                --jq ".workflow_runs | map(select(.created_at >= \"${PREFLIGHT_DISPATCHED_AT}\")) | sort_by(.created_at) | last | .id // empty"
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "Live Synology preflight dispatch was accepted but no run appeared." >&2
            exit 1
          fi
          echo "PREFLIGHT_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "PREFLIGHT_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_ENV"

      - name: Monitor live preflight
        id: preflight_watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run watch "$PREFLIGHT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10

      - name: Record successful live evidence
        if: steps.preflight_watch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha="$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          artifact_name="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts" \
              --jq '.artifacts | map(select(.name | startswith("synology-production-target-preflight-evidence-"))) | first | .name // empty'
          )"
          artifact_digest="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts" \
              --jq '.artifacts | map(select(.name | startswith("synology-production-target-preflight-evidence-"))) | first | .digest // empty'
          )"
          if [[ -z "$artifact_name" || -z "$artifact_digest" ]]; then
            echo "Successful preflight run did not publish the required sanitized artifact." >&2
            exit 1
          fi
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Local Synology production-target preflight completed successfully.\n\n- workflow source SHA: \`${head_sha}\`\n- live preflight run: ${PREFLIGHT_RUN_URL}\n- evidence artifact: \`${artifact_name}\`\n- artifact digest: \`${artifact_digest}\`\n- restore drill: passed\n- classification: \`STAGING_PROVEN\`\n- production environment proven: \`false\`\n\nNo secrets, database rows, dump bytes or private endpoint inventory were emitted. Issue #91 remains the sole real Production Go-Live tracker."

      - name: Record failed live preflight
        if: steps.preflight_watch.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Local Synology production-target preflight failed.\n\n- run: ${PREFLIGHT_RUN_URL}\n- dispatcher: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nThe issue remains open. Inspect the first failed invariant without copying secrets or database content."
          exit 1