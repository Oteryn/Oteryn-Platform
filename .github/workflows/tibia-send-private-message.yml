name: Tibia Send Private Message

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-send-private-message.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  send:
    name: Send private message on active Tibia session
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify active owned session and send message
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]

          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home

          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]

          # Require a currently active Tibia TCP session, still exclusively through local SOCKS/WARP.
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 ))
          (( direct_count == 0 ))

          # Resolve the largest currently visible Tibia window instead of assuming an old X11 id.
          best=''; best_area=0
          for w in $(xdotool search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]] || continue
            area=$((width*height))
            if (( area > best_area )); then best=$w; best_area=$area; fi
          done
          [[ -n "$best" ]]
          echo ACTIVE_TIBIA_WINDOW_RESOLVED=true

          import -display :99 -window "$best" /tmp/pm-before.png
          xdotool windowactivate --sync "$best" 2>/dev/null || true

          # Tibia default shortcut: Ctrl+O opens the private-channel recipient prompt.
          xdotool key --window "$best" ctrl+o
          sleep 1
          xdotool type --window "$best" --delay 35 -- 'Glera Mars'
          xdotool key --window "$best" Return
          sleep 1

          # Send exactly the user-requested message in the newly opened private channel.
          xdotool type --window "$best" --delay 25 -- 'zajaczek to faja'
          xdotool key --window "$best" Return
          sleep 2
          echo PRIVATE_MESSAGE_INPUT_SENT=true

          # Verify a material UI transition/change without OCR. This proves the UI reacted to the sequence,
          # while the active socket check above proves this is a live world session.
          import -display :99 -window "$best" /tmp/pm-after.png
          ae=$(compare -metric AE /tmp/pm-before.png /tmp/pm-after.png null: 2>&1 || true)
          ae=${ae%%.*}
          [[ "$ae" =~ ^[0-9]+$ ]] || ae=0
          echo PRIVATE_MESSAGE_UI_CHANGED_PIXELS=$ae
          (( ae > 500 ))
          echo PRIVATE_MESSAGE_SEQUENCE_PROVEN=true
          INNER
