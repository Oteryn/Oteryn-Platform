name: Temporary Synology Build Selectivity Writer

on:
  push:
    branches:
      - ci/1328-synology-build-selectivity-phase1
    paths:
      - .github/workflows/tmp-synology-build-selectivity-writer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/1328-synology-build-selectivity-phase1

      - name: Apply Phase 1 routing repair
        run: python3 .github/tmp/apply_synology_build_selectivity_phase1.py

      - name: Validate focused routing contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/classify_synology_images.py
          python3 tests/ci/test_synology_image_build_routing.py
          python3 tests/ci/test_synology_auto_staging_deploy.py
          python3 tests/ci/test_workflow_trigger_economy.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/build-synology-staging-images.yml
          git diff --check

      - name: Remove temporary scaffolding and publish durable repair
        env:
          BRANCH: ci/1328-synology-build-selectivity-phase1
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-synology-build-selectivity-writer.yml .github/tmp/apply_synology_build_selectivity_phase1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .dockerignore \
            .github/workflows/build-synology-staging-images.yml \
            deploy/synology/docker/platform.Dockerfile \
            scripts/ci/classify_synology_images.py \
            tests/ci/test_synology_image_build_routing.py \
            docs/agents/tasks/active/OTERYN-20260907-synology-build-selectivity.md \
            .github/workflows/tmp-synology-build-selectivity-writer.yml \
            .github/tmp/apply_synology_build_selectivity_phase1.py
          git diff --cached --check
          git commit -m 'fix(ci): make Synology image builds proportional'
          git push origin "HEAD:${BRANCH}"
