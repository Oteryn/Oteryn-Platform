name: Portal RS CI

on:
  # Called by the CI workflow for every pull request, push to main and merge group, so the
  # required platform-gate covers the Rust portal; no separate triggers, which would run it twice.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Disposable CI-only service credentials; PostgreSQL-backed tests skip when this is unset.
  PORTAL_TEST_DATABASE_URL: postgres://portal:portal-ci-only@127.0.0.1:5432/portal_test
  # Test shards, balanced on measured test time: `cargo test` runs one test binary at a time, so a
  # shard lasts about as long as the sum of its packages' binaries (merge-group run of 2026-11-22:
  # bazaar ~490 s, portal ~435 s, admin ~285 s, gateway ~250 s, identity ~235 s, playerdata ~175 s,
  # community ~170 s, store ~160 s, gameauth ~105 s). Shard 6 is every other workspace package, so
  # a new crate always runs somewhere.
  PORTAL_SHARD_1: oteryn-bazaar oteryn-wallet
  PORTAL_SHARD_2: oteryn-portal oteryn-content
  PORTAL_SHARD_3: oteryn-admin oteryn-playerdata
  PORTAL_SHARD_4: oteryn-gateway oteryn-identity
  PORTAL_SHARD_5: oteryn-community oteryn-store oteryn-gameauth

concurrency:
  group: portal-rs-ci-${{ github.event.pull_request.number || github.sha }}
  # A new pull request head cancels the old run; runs on main are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portal-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: portal-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start PostgreSQL 18.6
        # The Rust portal's pinned engine (docs/architecture/OTERYN_PORTAL_RUST_PLAN.md). Started as a
        # step, not a service, because tests create a schema each and run every migration in parallel,
        # which needs more lock slots and connections than the defaults.
        working-directory: .
        run: |
          docker run -d --name portal-rs-ci-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=portal -e POSTGRES_PASSWORD=portal-ci-only -e POSTGRES_DB=portal_test \
            postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 \
            -c max_locks_per_transaction=1024 -c max_connections=300
          for i in $(seq 1 60); do
            if docker exec portal-rs-ci-pg pg_isready -U portal -d portal_test -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs portal-rs-ci-pg
          exit 1

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            [1-5])
              list="PORTAL_SHARD_$SHARD"
              read -ra packages <<< "${!list}"; args=(); for p in "${packages[@]}"; do args+=(-p "$p"); done ;;
            6)
              read -ra packages <<< "$PORTAL_SHARD_1 $PORTAL_SHARD_2 $PORTAL_SHARD_3 $PORTAL_SHARD_4 $PORTAL_SHARD_5"
              args=(--workspace); for p in "${packages[@]}"; do args+=(--exclude "$p"); done ;;
            *) echo "unknown shard $SHARD" >&2; exit 1 ;;
          esac
          cargo test --locked "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log"
          test "${PIPESTATUS[0]}" -eq 0
          passed="$(grep -Eo 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test.log" | awk '{s+=$4} END {print s+0}')"
          if [ "$passed" -eq 0 ]; then
            echo "shard $SHARD passed no tests" >&2
            exit 1
          fi
          echo "### test shard $SHARD: $passed passed (${args[*]})" >> "$GITHUB_STEP_SUMMARY"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portal-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start PostgreSQL 18.6
        # The Rust portal's pinned engine (docs/architecture/OTERYN_PORTAL_RUST_PLAN.md). Started as a
        # step, not a service, because tests create a schema each and run every migration in parallel,
        # which needs more lock slots and connections than the defaults.
        working-directory: .
        run: |
          docker run -d --name portal-rs-ci-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=portal -e POSTGRES_PASSWORD=portal-ci-only -e POSTGRES_DB=portal_test \
            postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 \
            -c max_locks_per_transaction=1024 -c max_connections=300
          for i in $(seq 1 60); do
            if docker exec portal-rs-ci-pg pg_isready -U portal -d portal_test -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs portal-rs-ci-pg
          exit 1

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install browser qualification dependencies
        # Pinned Playwright core and axe for the browser tests below; Chromium comes from the same
        # Playwright release so the driver and browser versions match.
        working-directory: .
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/browser" \
            playwright-core@1.63.0 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright-core" install --with-deps chromium
          chromium="$(node -e "console.log(require('$RUNNER_TEMP/browser/node_modules/playwright-core').chromium.executablePath())")"
          test -x "$chromium"
          {
            echo "PORTAL_BROWSER_NODE=$(command -v node)"
            echo "PORTAL_BROWSER_MODULES=$RUNNER_TEMP/browser"
            echo "CHROMIUM_PATH=$chromium"
            echo "PORTAL_ATLAS_BROWSER_NODE=$(command -v node)"
            echo "PORTAL_ATLAS_PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser/node_modules/playwright-core"
            echo "PORTAL_ATLAS_CHROMIUM=$chromium"
          } >> "$GITHUB_ENV"

      - name: Run browser qualification tests
        # These tests drive real pages in Chromium. They are #[ignore]d for local runs without a
        # browser and run here explicitly; the atlas test runs its browser assertions when
        # PORTAL_ATLAS_BROWSER_NODE is set.
        run: |
          # A filter that matches nothing passes, so each run must report the expected count.
          run() {
            expected="$1"; shift
            cargo test --locked "$@" 2>&1 | tee "$RUNNER_TEMP/browser-test.log"
            test "${PIPESTATUS[0]}" -eq 0
            passed="$(grep -Eo 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/browser-test.log" | awk '{s+=$4} END {print s+0}')"
            if [ "$passed" -ne "$expected" ]; then
              echo "expected $expected browser tests to pass, got $passed" >&2
              exit 1
            fi
          }
          run 1 -p oteryn-web postgres_browser_search_keyboard_and_accessibility -- --ignored
          run 1 -p oteryn-store postgres_browser_at_360px -- --ignored
          run 1 -p oteryn-portal --bin oteryn-portal postgres_dummy_checkout_browser_360px -- --ignored
          run 1 -p oteryn-payments db_browser_layout_labels_and_keyboard_at_360px -- --ignored
          run 1 -p oteryn-atlas postgres_spawns_private_markers_and_reports

  check:
    # Aggregate of the jobs above, under the job name this workflow has always reported.
    if: ${{ always() }}
    needs: [lint, test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "lint=$LINT test=$TEST browser=$BROWSER"
          test "$LINT" = success && test "$TEST" = success && test "$BROWSER" = success
