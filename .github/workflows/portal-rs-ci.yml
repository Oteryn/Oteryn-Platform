name: Portal RS CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'portal-rs/**'
      - '.github/workflows/portal-rs-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'portal-rs/**'
      - '.github/workflows/portal-rs-ci.yml'

permissions:
  contents: read

concurrency:
  group: portal-rs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portal-rs
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # Disposable CI-only service credentials; PostgreSQL-backed tests skip when this is unset.
      PORTAL_TEST_DATABASE_URL: postgres://portal:portal-ci-only@127.0.0.1:5432/portal_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start PostgreSQL 18.6
        # The Rust portal's pinned engine (docs/architecture/OTERYN_PORTAL_RUST_PLAN.md). Started as a
        # step, not a service, because tests create a schema each and run every migration in parallel,
        # which needs more lock slots and connections than the defaults.
        working-directory: .
        run: |
          docker run -d --name portal-rs-ci-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=portal -e POSTGRES_PASSWORD=portal-ci-only -e POSTGRES_DB=portal_test \
            postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 \
            -c max_locks_per_transaction=1024 -c max_connections=300
          for i in $(seq 1 60); do
            if docker exec portal-rs-ci-pg pg_isready -U portal -d portal_test -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs portal-rs-ci-pg
          exit 1

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked
