name: Account Security Static Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/account-security-static-diagnostics.yml'

permissions:
  contents: read

jobs:
  static-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Capture PHPStan diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/account-security-static
          set +e
          vendor/bin/phpstan analyse --no-progress --error-format=raw > artifacts/account-security-static/phpstan.txt 2>&1
          status=$?
          echo "$status" > artifacts/account-security-static/exit-code.txt
          exit 0

      - name: Upload PHPStan diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: account-security-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/account-security-static
          if-no-files-found: error
          retention-days: 3
