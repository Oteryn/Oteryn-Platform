name: Recover Synology Staging Schema

on:
  workflow_dispatch:
    inputs:
      mode:
        description: schema-recovery restores the verified pre-migration schema; pitr-drill restores the PostgreSQL backup into a scratch instance and discards it
        required: true
        default: schema-recovery
        type: choice
        options:
          - schema-recovery
          - pitr-drill
      backup_evidence:
        description: schema-recovery only. Managed relative evidence path (<old-sha>|fresh-empty)-before-<candidate-sha>/evidence.env
        required: false
        type: string
      pitr_target_time:
        description: pitr-drill only. Empty for the probe drill, or a UTC time YYYY-MM-DD HH:MM:SS to restore to
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: synology-staging-deployment
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'schema-recovery'
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    environment: synology-staging
    timeout-minutes: 30
    env:
      CANONICAL_PUBLIC_APP_URL: https://oteryn.molehill.cloud
      APP_KEY: ${{ secrets.OTERYN_STAGING_APP_KEY }}
      MARIADB_ROOT_PASSWORD: ${{ secrets.OTERYN_STAGING_MARIADB_ROOT_PASSWORD }}
      PLATFORM_DB_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_DB_PASSWORD }}
      PLATFORM_POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_SUPERUSER_PASSWORD }}
      PLATFORM_POSTGRES_OWNER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_OWNER_PASSWORD }}
      PLATFORM_POSTGRES_APP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_APP_PASSWORD }}
      PLATFORM_POSTGRES_BACKUP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_BACKUP_PASSWORD }}
      PLATFORM_POSTGRES_DUMP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_DUMP_PASSWORD }}
      OTERYN_PLATFORM_SERVICE_TOKEN: ${{ secrets.OTERYN_STAGING_PLATFORM_SERVICE_TOKEN }}
      GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256: ${{ secrets.OTERYN_STAGING_PLATFORM_SERVICE_TOKEN_SHA256 }}
      GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256: ${{ secrets.OTERYN_STAGING_PLATFORM_PREVIOUS_SERVICE_TOKEN_SHA256 }}

    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate recovery request and runner
        env:
          BACKUP_EVIDENCE_INPUT: ${{ inputs.backup_evidence }}
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
          APP_URL_INPUT: ${{ vars.OTERYN_STAGING_APP_URL }}
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker compose version >/dev/null
          sha256sum --version >/dev/null

          if [[ ! "$BACKUP_EVIDENCE_INPUT" =~ ^([0-9a-f]{40}|fresh-empty)-before-[0-9a-f]{40}/evidence\.env$ ]]; then
            echo "backup_evidence must be exactly (<old-40-sha>|fresh-empty)-before-<candidate-40-sha>/evidence.env." >&2
            exit 1
          fi

          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          app_url="${APP_URL_INPUT:-$CANONICAL_PUBLIC_APP_URL}"
          if [[ ! "$state_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "OTERYN_STAGING_STATE_DIR must be an absolute simple path." >&2
            exit 1
          fi
          if [[ "$app_url" != "$CANONICAL_PUBLIC_APP_URL" ]]; then
            echo "OTERYN_STAGING_APP_URL must exactly equal the canonical staging origin." >&2
            exit 1
          fi

          required_names=(
            APP_KEY MARIADB_ROOT_PASSWORD PLATFORM_DB_PASSWORD
            OTERYN_PLATFORM_SERVICE_TOKEN GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256
          )
          for name in "${required_names[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "Required synology-staging secret is missing: $name" >&2; exit 1; }
          done

          # PostgreSQL secrets are optional but all five or none; recover-schema.sh requires all five on the
          # postgres engine, so they must reach the ephemeral .env as in the deploy workflow.
          postgres_configured=0
          for name in \
            PLATFORM_POSTGRES_SUPERUSER_PASSWORD PLATFORM_POSTGRES_OWNER_PASSWORD PLATFORM_POSTGRES_APP_PASSWORD \
            PLATFORM_POSTGRES_BACKUP_PASSWORD PLATFORM_POSTGRES_DUMP_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              postgres_configured=$((postgres_configured + 1))
              if [[ ! "${!name}" =~ ^[A-Za-z0-9_.-]{24,}$ ]]; then
                echo "$name must be empty or at least 24 generated hex/alphanumeric staging-safe characters." >&2
                exit 1
              fi
            fi
          done
          if (( postgres_configured != 0 && postgres_configured != 5 )); then
            echo "PostgreSQL secrets are partially configured ($postgres_configured of 5); set all of them or none." >&2
            exit 1
          fi

      - name: Write ephemeral recovery environment
        env:
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
          APP_URL_INPUT: ${{ vars.OTERYN_STAGING_APP_URL }}
        run: |
          set -euo pipefail
          umask 077
          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          app_url="${APP_URL_INPUT:-$CANONICAL_PUBLIC_APP_URL}"

          cat > deploy/synology/.env <<EOF
          COMPOSE_PROJECT_NAME=oteryn-staging
          PLATFORM_BIND_ADDRESS=127.0.0.1
          GATEWAY_BIND_ADDRESS=127.0.0.1
          PLATFORM_PORT=8000
          GATEWAY_PORT=8080
          GAME_WORLD_ID=1
          GAME_WORLD_SLUG=oteryn-staging
          GAME_WORLD_NAME=Oteryn Staging
          GAME_WORLD_REGION=LAN
          GAME_WORLD_HOST=127.0.0.1
          GAME_WORLD_PORT=7172
          PLATFORM_IMAGE=rollback-placeholder
          GATEWAY_IMAGE=rollback-placeholder
          APP_NAME=Oteryn Platform Staging
          APP_ENV=preproduction
          APP_DEBUG=false
          APP_KEY=$APP_KEY
          APP_URL=$app_url
          LOG_LEVEL=info
          SESSION_SECURE_COOKIE=true
          MARIADB_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD
          PLATFORM_DB_NAME=oteryn_platform
          PLATFORM_DB_USER=oteryn_platform
          PLATFORM_DB_PASSWORD=$PLATFORM_DB_PASSWORD
          PLATFORM_POSTGRES_SUPERUSER_PASSWORD=$PLATFORM_POSTGRES_SUPERUSER_PASSWORD
          PLATFORM_POSTGRES_OWNER_PASSWORD=$PLATFORM_POSTGRES_OWNER_PASSWORD
          PLATFORM_POSTGRES_APP_PASSWORD=$PLATFORM_POSTGRES_APP_PASSWORD
          PLATFORM_POSTGRES_BACKUP_PASSWORD=$PLATFORM_POSTGRES_BACKUP_PASSWORD
          PLATFORM_POSTGRES_DUMP_PASSWORD=$PLATFORM_POSTGRES_DUMP_PASSWORD
          OTERYN_PLATFORM_SERVICE_TOKEN=$OTERYN_PLATFORM_SERVICE_TOKEN
          GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256=$GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256
          GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256=$GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256
          GATEWAY_VERSION=recovery
          OTERYN_STATE_DIR=$state_dir
          EOF
          chmod 600 deploy/synology/.env

      - name: Recover verified pre-migration schema
        env:
          BACKUP_EVIDENCE_INPUT: ${{ inputs.backup_evidence }}
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
        run: |
          set -euo pipefail
          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          OTERYN_ENV_FILE=deploy/synology/.env \
            bash deploy/synology/scripts/recover-schema.sh \
            "$state_dir/backups/$BACKUP_EVIDENCE_INPUT"

      - name: Remove ephemeral recovery environment
        if: always()
        run: rm -f deploy/synology/.env

  # Platform PostgreSQL restore drill (migration plan P5; the backup and PITR runbook in docs/operations): restores
  # the newest suitable base backup plus archived WAL from the NAS spool into a scratch container with no
  # network and an anonymous data volume, verifies it and discards it. It reads no secret: it works through
  # the Docker socket of the runner and the running staging containers.
  pitr-drill:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'pitr-drill'
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    environment: synology-staging
    # Above the drill's own bounds: 2 h for the spool job lock (OTERYN_DRILL_LOCK_WAIT_SECONDS), the 4 h RTO
    # of the restore, and an hour for the probe, the checks after promotion and the cleanup.
    timeout-minutes: 420

    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run the point-in-time restore drill
        env:
          OTERYN_STATE_DIR_INPUT: ${{ vars.OTERYN_STAGING_STATE_DIR }}
          PITR_TARGET_TIME_INPUT: ${{ inputs.pitr_target_time }}
        run: |
          set -euo pipefail
          docker version >/dev/null
          state_dir="${OTERYN_STATE_DIR_INPUT:-/var/lib/oteryn-staging-state}"
          if [[ ! "$state_dir" =~ ^/[A-Za-z0-9._/-]+$ || "$state_dir" == *..* ]]; then
            echo "OTERYN_STAGING_STATE_DIR must be an absolute simple path." >&2
            exit 1
          fi
          drill_args=()
          if [[ -n "$PITR_TARGET_TIME_INPUT" ]]; then
            if [[ ! "$PITR_TARGET_TIME_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{2}:[0-9]{2}:[0-9]{2}$ ]]; then
              echo "pitr_target_time must be empty or exactly YYYY-MM-DD HH:MM:SS (UTC)." >&2
              exit 1
            fi
            drill_args=(--target-time "$PITR_TARGET_TIME_INPUT")
          fi
          COMPOSE_PROJECT_NAME=oteryn-staging OTERYN_STATE_DIR="$state_dir" \
            bash deploy/synology/scripts/restore-postgres-pitr.sh "${drill_args[@]}"
