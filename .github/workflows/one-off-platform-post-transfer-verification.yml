name: One-off Platform Post-Transfer Verification

on:
  push:
    branches:
      - chore/platform-post-transfer-verification-20260818
    paths:
      - .github/workflows/one-off-platform-post-transfer-verification.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-platform-post-transfer-verification.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: one-off-platform-post-transfer-verification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-identity:
    name: Verify transferred repository identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert owner and repository context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Oteryn/Oteryn-Platform"
          test "$GITHUB_REPOSITORY_OWNER" = "Oteryn"
          echo "repository=$GITHUB_REPOSITORY"
          echo "sha=$GITHUB_SHA"

      - name: Checkout exact verification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert owner-neutral GHCR resolution
        shell: bash
        run: |
          set -euo pipefail
          test "$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-platform)" = "ghcr.io/oteryn/oteryn-platform"
          test "$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-game-gateway)" = "ghcr.io/oteryn/oteryn-game-gateway"
          test "$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-deploy-runner)" = "ghcr.io/oteryn/oteryn-deploy-runner"

  ghcr-target-verification:
    name: Verify GHCR target ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            package: oteryn-platform
            dockerfile: deploy/synology/docker/platform.Dockerfile
          - name: game-gateway
            package: oteryn-game-gateway
            dockerfile: deploy/synology/docker/gateway.Dockerfile
          - name: deploy-runner
            package: oteryn-deploy-runner
            dockerfile: deploy/synology/runner/Dockerfile
    steps:
      - name: Checkout exact verification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve target image and bounded verification tag
        id: image
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          image="$(bash deploy/synology/scripts/repository-ghcr-image.sh "$PACKAGE_NAME")"
          test "$image" = "ghcr.io/oteryn/$PACKAGE_NAME"
          tag="transfer-verify-${GITHUB_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to target GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish bounded verification image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Oteryn/Oteryn-Platform
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Read back exact published digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker pull "$IMAGE:$TAG"
          echo "verified=$IMAGE@$DIGEST"

  self-hosted-runner-attachment:
    name: Verify transferred self-hosted runner attachment
    runs-on:
      - self-hosted
      - oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Prove repository-scoped runner accepts a no-side-effect job
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Oteryn/Oteryn-Platform"
          echo "runner_name=${{ runner.name }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          echo "No checkout, deployment, Compose, package mutation or protected staging action executed on this runner."
