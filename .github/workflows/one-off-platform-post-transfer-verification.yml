name: One-off Platform Post-Transfer Verification

on:
  push:
    branches:
      - chore/platform-post-transfer-verification-20260818
    paths:
      - .github/workflows/one-off-platform-post-transfer-verification.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-platform-post-transfer-verification.yml

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: one-off-platform-post-transfer-verification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRANSFERRED_MAIN: 42f6741deacbd3ba9e1c4f609bb1073ebe0cff7b

jobs:
  repository-identity:
    name: Verify transferred repository identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert owner and repository context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Oteryn/Oteryn-Platform"
          test "$GITHUB_REPOSITORY_OWNER" = "Oteryn"
          echo "repository=$GITHUB_REPOSITORY"
          echo "transferred_main=$TRANSFERRED_MAIN"

      - name: Checkout exact transferred main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRANSFERRED_MAIN }}

      - name: Assert owner-neutral GHCR resolution
        shell: bash
        run: |
          set -euo pipefail
          test "$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-platform)" = "ghcr.io/oteryn/oteryn-platform"
          test "$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-game-gateway)" = "ghcr.io/oteryn/oteryn-game-gateway"
          test "$(bash deploy/synology/scripts/repository-ghcr-image.sh oteryn-deploy-runner)" = "ghcr.io/oteryn/oteryn-deploy-runner"

  ghcr-main-cutover:
    name: Publish transferred main ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            package: oteryn-platform
            dockerfile: deploy/synology/docker/platform.Dockerfile
          - name: game-gateway
            package: oteryn-game-gateway
            dockerfile: deploy/synology/docker/gateway.Dockerfile
          - name: deploy-runner
            package: oteryn-deploy-runner
            dockerfile: deploy/synology/runner/Dockerfile
    steps:
      - name: Checkout exact transferred main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRANSFERRED_MAIN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve exact target image
        id: image
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          image="$(bash deploy/synology/scripts/repository-ghcr-image.sh "$PACKAGE_NAME")"
          test "$image" = "ghcr.io/oteryn/$PACKAGE_NAME"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to target GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact transferred main
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}:verify-transfer-${{ env.TRANSFERRED_MAIN }}
          labels: |
            org.opencontainers.image.source=https://github.com/Oteryn/Oteryn-Platform
            org.opencontainers.image.revision=${{ env.TRANSFERRED_MAIN }}

      - name: Read back exact main digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          verification_tag="verify-transfer-$TRANSFERRED_MAIN"
          docker pull "$IMAGE:$verification_tag"
          echo "verification_verified=$IMAGE@$DIGEST"
          echo "verification_tag=$IMAGE:$verification_tag"

  runner-registry-readback:
    name: Verify transferred runner registry state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact repository runner state without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/actions/runners?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oteryn-platform-post-transfer-verification",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          matches = [runner for runner in payload.get("runners", []) if runner.get("name") == "oteryn-synology-staging"]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one oteryn-synology-staging runner, found {len(matches)}")
          runner = matches[0]
          labels = {item.get("name") for item in runner.get("labels", [])}
          if runner.get("status") != "online":
              raise SystemExit(f"runner is not online: status={runner.get('status')!r}")
          if runner.get("busy"):
              raise SystemExit("runner is unexpectedly busy before no-side-effect verification")
          if "oteryn-staging" not in labels:
              raise SystemExit(f"runner lacks required custom label: labels={sorted(labels)}")
          if "self-hosted" in labels:
              raise SystemExit(f"runner unexpectedly exposes generic self-hosted label: labels={sorted(labels)}")
          print(
              "runner_registry_verified="
              f"name={runner.get('name')} status={runner.get('status')} busy={runner.get('busy')} "
              f"labels={','.join(sorted(labels))}"
          )
          PY

  self-hosted-runner-attachment:
    name: Verify transferred self-hosted runner attachment
    # The deployment runner is intentionally registered with --no-default-labels
    # so generic `self-hosted` jobs cannot land on this Docker-socket-capable host.
    # Route by the repository-scoped custom label and assert the exact runner name.
    runs-on:
      - oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Prove repository-scoped runner accepts a no-side-effect job
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Oteryn/Oteryn-Platform"
          test "${{ runner.name }}" = "oteryn-synology-staging"
          echo "runner_name=${{ runner.name }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          echo "No checkout, deployment, Compose, package mutation or protected staging action executed on this runner."
