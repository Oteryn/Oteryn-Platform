name: Wire Public Web Final Staging Repair

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-report.yml

permissions:
  contents: write

jobs:
  patch-trigger:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/OTERYN-20260726-public-web-final-staging-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add deploy-script path to guarded one-shot exactly once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-public-web-final-staging.yml')
          content = path.read_text()
          old = """    paths:
      - .github/workflows/one-shot-public-web-final-staging.yml
"""
          new = """    paths:
      - .github/workflows/one-shot-public-web-final-staging.yml
      - deploy/synology/scripts/deploy.sh
"""
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one guarded path block, found {count}')
          path.write_text(content.replace(old, new, 1))
          PY

          git diff --check
          git diff -- .github/workflows/one-shot-public-web-final-staging.yml

      - name: Commit bounded trigger repair
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-public-web-final-staging.yml
          git commit -m 'ci(deploy): retrigger staging after proxy repair'
          git push origin "HEAD:${HEAD_REF}"
