name: Inspect Public Web Final Staging Report

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-report.yml

permissions:
  contents: write

jobs:
  patch-deploy-script:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/OTERYN-20260726-public-web-final-staging-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace stale-proxy deployment sequence exactly once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/synology/scripts/deploy.sh')
          content = path.read_text()
          old = '"${compose[@]}" up -d internal-proxy gateway\n'
          new = (
              '"${compose[@]}" up -d --no-deps --force-recreate internal-proxy\n'
              '"${compose[@]}" up -d gateway\n'
          )
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one deployment sequence, found {count}')
          path.write_text(content.replace(old, new, 1))
          PY

          git diff --check
          git diff -- deploy/synology/scripts/deploy.sh

      - name: Commit bounded repair to pull-request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/synology/scripts/deploy.sh
          git commit -m 'fix(deploy): recreate internal proxy after platform'
          git push origin "HEAD:${HEAD_REF}"
