name: Inspect Public Web Final Staging Report

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-report.yml

permissions:
  contents: read

jobs:
  inspect-live-gateway:
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Probe Gateway private dependencies without mutation
        run: |
          set -euo pipefail
          gateway_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=gateway \
            --format '{{.ID}}')"
          [[ "$(wc -w <<<"$gateway_container")" -eq 1 ]]

          echo "Gateway image: $(docker inspect --format '{{.Config.Image}}' "$gateway_container")"
          echo 'Gateway dependency environment names:'
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$gateway_container" \
            | grep -E '^(OTERYN_PLATFORM_BASE_URL|GAME_SESSION_SERVICE_BASE_URL|SSL_CERT_FILE)='

          probe() {
            local label="$1"
            local url="$2"
            echo "=== ${label} ==="
            docker exec "$gateway_container" wget \
              --server-response \
              --output-document=- \
              --ca-certificate=/etc/oteryn/tls/ca.crt \
              "$url" \
              2>&1 \
              || true
          }

          probe 'Platform dependency' 'https://platform-internal:8443/health'
          probe 'Canary session dependency' 'https://canary-session-internal:8444/health'
