name: Inspect Public Web Final Staging Report

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-report.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print sanitized deployment failure tail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_JOB_ID: '89821183195'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${DEPLOYMENT_JOB_ID}/logs" > deployment.log
          echo 'Deployment failure tail:'
          tail -n 160 deployment.log
