name: Inspect Public Web Final Staging Report

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-report.yml

permissions:
  contents: read
  issues: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and verify sanitized Issue 145 report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: 62dedb894ffc3af55ba10a0717a6a892b87f1370
        run: |
          set -euo pipefail
          report="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/145/comments?per_page=100" \
              --jq "map(select(.body | contains(\"<!-- public-web-final-staging:${EXPECTED_SHA}:\"))) | last | .body // empty"
          )"

          if [[ -z "$report" ]]; then
            echo "No sanitized final-staging report exists for the expected SHA." >&2
            exit 1
          fi

          echo 'Sanitized final staging report:'
          printf '%s\n' "$report"

          assert_fixed() {
            local label="$1"
            local value="$2"
            if ! grep -Fq "$value" <<<"$report"; then
              echo "Missing expected sanitized field: $label" >&2
              exit 1
            fi
          }

          assert_regex() {
            local label="$1"
            local value="$2"
            if ! grep -Eq "$value" <<<"$report"; then
              echo "Missing expected sanitized pattern: $label" >&2
              exit 1
            fi
          }

          assert_fixed outcome 'Final Synology staging closure result: **PASS**'
          assert_fixed exact_sha "exact trusted main SHA: \`${EXPECTED_SHA}\`"
          assert_fixed dispatch 'dispatch result: `success`'
          assert_fixed live_smoke 'live Chromium smoke result: `success`'
          assert_regex one_shot 'one-shot run: `[0-9]+`'
          assert_regex deployment 'deployment run: `[0-9]+`'
          assert_fixed artifact "sanitized artifact: \`public-web-final-staging-${EXPECTED_SHA}\`"
