name: Inspect Public Web Final Staging Report

on:
  pull_request:
    paths:
      - .github/workflows/inspect-public-web-final-staging-report.yml

permissions:
  contents: read

jobs:
  inspect-live-gateway:
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Inspect Gateway from the Compose network without mutation
        run: |
          set -euo pipefail
          gateway_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=gateway \
            --format '{{.ID}}')"
          platform_container="$(docker ps \
            --filter label=com.docker.compose.project=oteryn-staging \
            --filter label=com.docker.compose.service=platform \
            --format '{{.ID}}')"

          [[ "$(wc -w <<<"$gateway_container")" -eq 1 ]]
          [[ "$(wc -w <<<"$platform_container")" -eq 1 ]]

          echo "Gateway image: $(docker inspect --format '{{.Config.Image}}' "$gateway_container")"
          echo "Platform image: $(docker inspect --format '{{.Config.Image}}' "$platform_container")"
          echo "Gateway state: $(docker inspect --format '{{.State.Status}} restarts={{.RestartCount}}' "$gateway_container")"
          echo "Gateway health metadata: $(docker inspect --format '{{json .State.Health}}' "$gateway_container")"

          docker exec "$platform_container" php -r '
          function probe(string $url): void {
              $context = stream_context_create(["http" => ["ignore_errors" => true, "timeout" => 5]]);
              $body = @file_get_contents($url, false, $context);
              echo "PROBE ".$url.PHP_EOL;
              foreach (($http_response_header ?? []) as $header) {
                  echo $header.PHP_EOL;
              }
              echo "BODY ".($body === false ? "<read-failed>" : $body).PHP_EOL;
          }
          probe("http://127.0.0.1:8000/health");
          probe("http://gateway:8080/health");
          probe("http://gateway:8080/ready");
          '

          echo 'Gateway full startup and readiness log tail:'
          docker logs --tail 300 "$gateway_container" 2>&1
