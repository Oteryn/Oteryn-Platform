name: Organization Runner Bootstrap

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/organization-runner-bootstrap.yml
      - deploy/synology/runner/**

permissions:
  contents: read
  packages: read

concurrency:
  group: organization-runner-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap product-isolated organization runners
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'infra/issue-1199-organization-runner-bootstrap' &&
      github.actor == 'blakinio'
    runs-on: oteryn-staging
    timeout-minutes: 20
    env:
      ORG_ADMIN_TOKEN: ${{ secrets.OTERYN_ORG_RUNNER_ADMIN_TOKEN }}
      GH_JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG: Oteryn
      PLATFORM_REPO_ID: '1305155726'
      ATLAS_REPO_ID: '1337995824'
      GAME_REPO_ID: '1338291140'
      COMPOSE_PROJECT_NAME: oteryn-organization-runners
      RUNNER_IMAGE: ghcr.io/oteryn/oteryn-deploy-runner@sha256:f0c452798a17df09006a12d437e83a72d681dcd338ef22ed01fca329d1bbab8d

    steps:
      - name: Guard trusted bootstrap context
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ runner.name }}' = 'oteryn-synology-staging'
          test -n "$ORG_ADMIN_TOKEN"
          test -n "$GH_JOB_TOKEN"
          test -S /var/run/docker.sock
          test -d /var/lib/oteryn-staging-state
          echo 'trusted-bootstrap-context=PASS'

      - name: Checkout exact owned head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create groups and register isolated runners
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          API=https://api.github.com
          API_VERSION=2026-03-10
          COMPOSE=deploy/synology/runner/compose.organization.example.yml
          TOKEN_REL=".runner-bootstrap/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TOKEN_DIR_CONTAINER="/var/lib/oteryn-staging-state/$TOKEN_REL"
          TOKEN_DIR_HOST="/volume1/docker/oteryn/state/$TOKEN_REL"
          mkdir -p "$TOKEN_DIR_CONTAINER"
          chmod 0700 "$TOKEN_DIR_CONTAINER"

          auth_curl() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $ORG_ADMIN_TOKEN" \
              -H "X-GitHub-Api-Version: $API_VERSION" "$@"
          }

          list_org_runners() { auth_curl "$API/orgs/$ORG/actions/runners?per_page=100"; }

          delete_runner() {
            local name="$1" data id
            data="$(list_org_runners 2>/dev/null || true)"
            id="$(printf '%s' "$data" | jq -r --arg name "$name" '.runners[]? | select(.name == $name) | .id' | head -n1)"
            if [[ -n "$id" && "$id" != null ]]; then
              auth_curl -X DELETE "$API/orgs/$ORG/actions/runners/$id" >/dev/null 2>&1 || true
            fi
          }

          rollback() {
            rc=$?
            set +e
            export PLATFORM_RUNNER_TOKEN_FILE="$TOKEN_DIR_HOST/platform.token"
            export ATLAS_RUNNER_TOKEN_FILE="$TOKEN_DIR_HOST/atlas.token"
            export GAME_RUNNER_TOKEN_FILE="$TOKEN_DIR_HOST/game.token"
            docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" down -v --remove-orphans >/dev/null 2>&1 || true
            delete_runner oteryn-synology-platform
            delete_runner oteryn-synology-atlas
            delete_runner oteryn-synology-game
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf "$TOKEN_DIR_CONTAINER"
            exit "$rc"
          }
          trap rollback ERR

          ensure_group() {
            local name="$1" repo_id="$2" current id payload
            current="$(auth_curl "$API/orgs/$ORG/actions/runner-groups?per_page=100")"
            id="$(printf '%s' "$current" | jq -r --arg name "$name" '.runner_groups[]? | select(.name == $name) | .id' | head -n1)"
            payload="$(jq -cn --arg name "$name" --argjson repo_id "$repo_id" '{name:$name,visibility:"selected",allows_public_repositories:true,restricted_to_workflows:false,selected_repository_ids:[$repo_id]}')"
            if [[ -z "$id" || "$id" == null ]]; then
              id="$(auth_curl -X POST "$API/orgs/$ORG/actions/runner-groups" -d "$payload" | jq -r '.id')"
            else
              auth_curl -X PATCH "$API/orgs/$ORG/actions/runner-groups/$id" -d "$(jq -cn --arg name "$name" '{name:$name,visibility:"selected",allows_public_repositories:true,restricted_to_workflows:false}')" >/dev/null
              auth_curl -X PUT "$API/orgs/$ORG/actions/runner-groups/$id/repositories" -d "$(jq -cn --argjson repo_id "$repo_id" '{selected_repository_ids:[$repo_id]}')" >/dev/null
            fi
            printf '%s\n' "$id"
          }

          PLATFORM_GROUP_ID="$(ensure_group platform-runners "$PLATFORM_REPO_ID")"
          ATLAS_GROUP_ID="$(ensure_group atlas-runners "$ATLAS_REPO_ID")"
          GAME_GROUP_ID="$(ensure_group game-runners "$GAME_REPO_ID")"
          echo "runner-groups=PASS platform=$PLATFORM_GROUP_ID atlas=$ATLAS_GROUP_ID game=$GAME_GROUP_ID"

          registration_token() { auth_curl -X POST "$API/orgs/$ORG/actions/runners/registration-token" | jq -r '.token'; }
          PLATFORM_REG_TOKEN="$(registration_token)"
          ATLAS_REG_TOKEN="$(registration_token)"
          GAME_REG_TOKEN="$(registration_token)"
          echo "::add-mask::$PLATFORM_REG_TOKEN"
          echo "::add-mask::$ATLAS_REG_TOKEN"
          echo "::add-mask::$GAME_REG_TOKEN"
          printf '%s' "$PLATFORM_REG_TOKEN" > "$TOKEN_DIR_CONTAINER/platform.token"
          printf '%s' "$ATLAS_REG_TOKEN" > "$TOKEN_DIR_CONTAINER/atlas.token"
          printf '%s' "$GAME_REG_TOKEN" > "$TOKEN_DIR_CONTAINER/game.token"
          chmod 0600 "$TOKEN_DIR_CONTAINER"/*.token
          unset PLATFORM_REG_TOKEN ATLAS_REG_TOKEN GAME_REG_TOKEN

          export PLATFORM_RUNNER_TOKEN_FILE="$TOKEN_DIR_HOST/platform.token"
          export ATLAS_RUNNER_TOKEN_FILE="$TOKEN_DIR_HOST/atlas.token"
          export GAME_RUNNER_TOKEN_FILE="$TOKEN_DIR_HOST/game.token"
          export PLATFORM_STATE_HOST_PATH=/volume1/docker/oteryn/state
          export RUNNER_ORG_URL=https://github.com/Oteryn

          printf '%s' "$GH_JOB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" config --quiet
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" pull
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" up -d --remove-orphans

          wait_runner() {
            local name="$1" label="$2" group_id="$3" i data runner group_data
            for i in $(seq 1 90); do
              data="$(list_org_runners)"
              runner="$(printf '%s' "$data" | jq -c --arg name "$name" '.runners[]? | select(.name == $name)' | head -n1)"
              if [[ -n "$runner" ]] && printf '%s' "$runner" | jq -e --arg label "$label" '.status == "online" and (.labels | map(.name) | index($label) != null)' >/dev/null; then
                group_data="$(auth_curl "$API/orgs/$ORG/actions/runner-groups/$group_id/runners?per_page=100")"
                if printf '%s' "$group_data" | jq -e --arg name "$name" '.runners[]? | select(.name == $name)' >/dev/null; then return 0; fi
              fi
              sleep 2
            done
            echo "Runner $name did not become online in expected group." >&2
            return 1
          }

          wait_runner oteryn-synology-platform oteryn-platform "$PLATFORM_GROUP_ID"
          wait_runner oteryn-synology-atlas oteryn-atlas "$ATLAS_GROUP_ID"
          wait_runner oteryn-synology-game oteryn-game "$GAME_GROUP_ID"
          echo 'first-registration=PASS'

          : > "$TOKEN_DIR_CONTAINER/platform.token"
          : > "$TOKEN_DIR_CONTAINER/atlas.token"
          : > "$TOKEN_DIR_CONTAINER/game.token"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" up -d --force-recreate --remove-orphans

          wait_runner oteryn-synology-platform oteryn-platform "$PLATFORM_GROUP_ID"
          wait_runner oteryn-synology-atlas oteryn-atlas "$ATLAS_GROUP_ID"
          wait_runner oteryn-synology-game oteryn-game "$GAME_GROUP_ID"

          for service in platform atlas game; do
            cid="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" ps -q "$service")"
            test -n "$cid"
            test "$(docker inspect --format '{{.State.Running}}' "$cid")" = true
            docker exec "$cid" test ! -s /run/secrets/runner_token
          done

          platform_cid="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" ps -q platform)"
          atlas_cid="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" ps -q atlas)"
          game_cid="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE" ps -q game)"
          docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$platform_cid" | grep -Fx '/var/lib/oteryn-staging-state' >/dev/null
          ! docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$atlas_cid" | grep -Fx '/var/lib/oteryn-staging-state' >/dev/null
          ! docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$game_cid" | grep -Fx '/var/lib/oteryn-staging-state' >/dev/null
          ! docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$game_cid" | grep -Fx '/var/run/docker.sock' >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' "$game_cid")" = '1001:1001'

          docker logout ghcr.io >/dev/null 2>&1 || true
          trap - ERR
          echo 'organization-runner-bootstrap=PASS'
          echo 'legacy-runner-preserved=PASS'
