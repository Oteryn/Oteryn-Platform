name: Temporary Synology Recovery Health Writer

on:
  push:
    branches:
      - fix/20260907-synology-recovery-health-profile
    paths:
      - .github/workflows/tmp-recovery-health-writer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-recovery-health-profile

      - name: Apply recovery health profile repair
        run: python3 .github/tmp/apply_recovery_health_profile.py

      - name: Validate focused contracts
        run: |
          set -euo pipefail
          bash -n deploy/synology/scripts/health-check.sh
          bash -n deploy/synology/scripts/deploy.sh
          python3 tests/ci/test_synology_rollback_recovery_contract.py
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Remove temporary scaffolding and publish repair
        env:
          BRANCH: fix/20260907-synology-recovery-health-profile
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-recovery-health-writer.yml .github/tmp/apply_recovery_health_profile.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/synology/scripts/health-check.sh deploy/synology/scripts/deploy.sh tests/ci/test_synology_auto_staging_deploy.py tests/ci/test_synology_rollback_recovery_contract.py .github/workflows/tmp-recovery-health-writer.yml .github/tmp/apply_recovery_health_profile.py
          git diff --cached --check
          git commit -m 'fix(staging): separate recovery from release feature health'
          git push origin "HEAD:${BRANCH}"
