name: One-off Platform Programme Reconcile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-platform-programme-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile current Platform transfer state mechanically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("docs/agents/programs/OTERYN_ECOSYSTEM_REPOSITORY_MIGRATION.md")
          text = path.read_text(encoding="utf-8")

          old_header = """programme_state_version: 1
          updated_at: 2026-08-18T16:27:00Z
          status: blocked
          active_task: null
          issue: null
          branch: null
          pull_request: null
          """
          new_header = """programme_state_version: 1
          updated_at: 2026-08-20T06:28:00Z
          status: active
          active_task: docs/agents/tasks/active/OTERYN-20260818-platform-post-transfer-verification.md
          issue: 7
          branch: chore/platform-post-transfer-verification-20260818
          pull_request: 1164
          """
          if text.count(old_header) != 1:
              raise SystemExit("unexpected programme state header")
          text = text.replace(old_header, new_header, 1)

          topology = """target_topology:
            - Oteryn
            - Oteryn-Game
            - Oteryn-Platform
            - Oteryn-Atlas
          """
          current = topology + """
          platform_post_transfer_verification_evidence:
            transaction_id: OTERYN-PLATFORM-TRANSFER-20260818
            provider_transfer_state: POST_TRANSFER_VERIFIED
            provider_transfer_complete: true
            ecosystem_migration_complete: false
            repository: Oteryn/Oteryn-Platform
            repository_id: 1305155726
            exact_transferred_main: 42f6741deacbd3ba9e1c4f609bb1073ebe0cff7b
            bounded_verification_run: 32309057579
            repository_identity: PASS
            branch_protection: PASS
            target_ghcr_publish_readback: PASS
            self_hosted_runner_attachment: PASS
            protected_staging_or_production_operation_performed: false
            package_repository_link_metadata: UNKNOWN_NON_BLOCKING_FOR_PROVIDER_CUTOVER
            remaining_ecosystem_gates:
              - provider governance and stale-coordinate reconciliation
              - META reconciliation
              - temporary migration-backup terminal disposition
          """
          if text.count(topology) != 1 or "platform_post_transfer_verification_evidence:" in text:
              raise SystemExit("unexpected target topology/current-state marker")
          text = text.replace(topology, current, 1)

          observed_pattern = re.compile(r"  Oteryn-Platform:\n.*?\n\nplatform_preparation_evidence:", re.S)
          observed_replacement = """  Oteryn-Platform:
            repository: Oteryn/Oteryn-Platform
            repository_id: 1305155726
            original_source_repository: blakinio/Oteryn-Platform
            exact_transferred_main: 42f6741deacbd3ba9e1c4f609bb1073ebe0cff7b
            current_repository: Oteryn/Oteryn-Platform
            source_main_protected: true
            source_required_checks:
              - classify-changes
              - test
            transfer_state: POST_TRANSFER_VERIFIED
            bounded_ghcr_cutover: PASS
            repository_runner_attachment: PASS
            migration_backup_repository: Oteryn/Oteryn-Platform-Migration-Backup-20260818
            migration_backup_repository_id: 1338405017
            governance_coordinate_reconciliation: PENDING_SEPARATE_GATE

          platform_preparation_evidence:"""
          text, count = observed_pattern.subn(observed_replacement, text, count=1)
          if count != 1:
              raise SystemExit("unexpected observed Platform block")

          transaction_pattern = re.compile(r"migration_transaction:\n.*?\nproven:", re.S)
          transaction_replacement = """migration_transaction:
            transaction_id: OTERYN-PLATFORM-TRANSFER-20260818
            mutation: transfer
            state: POST_TRANSFER_VERIFIED
            provider_transfer_complete: true
            ecosystem_migration_complete: false
            source_coordinate: blakinio/Oteryn-Platform
            target_coordinate: Oteryn/Oteryn-Platform
            repository_id: 1305155726
            transferred_main: 42f6741deacbd3ba9e1c4f609bb1073ebe0cff7b
            identity_continuity: PASS
            history_pr_continuity: PASS
            connector_admin_write_access: PASS
            branch_protection_required_checks: PASS
            bounded_ghcr_publish_readback:
              run: 32309057579
              result: PASS
              game_gateway_digest: sha256:323fd66336b3de62f82fda69c4c299c78444dfe93481d26420bbc65b1c9b90f7
              platform_digest: sha256:1d1e8f367a2006d117224577cc678a60aee4ed08aae304a49f78b4e7097f07c2
              deploy_runner_digest: sha256:1eb10741adf42262834825e8e2c50dec4edf8e0f2791935727e75a798f83b520
            self_hosted_runner_attachment:
              run: 32309057579
              job: 96248074731
              runner: oteryn-synology-staging
              routing_label: oteryn-staging
              result: PASS
            protected_staging_or_production_operation_performed: false
            material_unknowns:
              - package repository-link metadata unavailable through current token
              - GitHub App user-token installation metadata unavailable through current connector surface
            remaining_ecosystem_gates:
              - provider governance and stale-coordinate reconciliation
              - cross-repository META reconciliation
              - temporary migration-backup terminal disposition

          proven:"""
          text, count = transaction_pattern.subn(transaction_replacement, text, count=1)
          if count != 1:
              raise SystemExit("unexpected migration transaction block")

          stale_proven = "  - blakinio/Oteryn-Platform remains the canonical Platform implementation at repository ID 1305155726."
          fresh_proven = "  - Oteryn/Oteryn-Platform is the canonical Platform implementation at repository ID 1305155726 after the physical owner transfer; blakinio/Oteryn-Platform is historical pre-transfer provenance."
          if text.count(stale_proven) != 1:
              raise SystemExit("unexpected canonical Platform proven statement")
          text = text.replace(stale_proven, fresh_proven, 1)

          derived_pattern = re.compile(r"derived:\n.*?\n\nunknown:", re.S)
          derived_replacement = """derived:
            - Game repository migration is terminal and must not remain in the pending migration queue.
            - Atlas repository creation is terminal; Atlas content/history separation remains independently gated.
            - Platform physical owner transfer is terminally proven at the provider level and must not be re-requested.
            - Platform target GHCR publication/readback and repository-scoped Synology runner attachment are terminally proven for the transfer transaction.
            - Ecosystem MIGRATION_COMPLETE=YES is still forbidden until provider governance/stale-coordinate reconciliation, META reconciliation and temporary migration-backup disposition are terminal.

          unknown:"""
          text, count = derived_pattern.subn(derived_replacement, text, count=1)
          if count != 1:
              raise SystemExit("unexpected derived block")

          unknown_pattern = re.compile(r"unknown:\n.*?\n\nconflicts:", re.S)
          unknown_replacement = """unknown:
            - GitHub package repository-link metadata unavailable through the current token; operational target publication/readback is proven.
            - GitHub App user-token installation metadata unavailable through the current connector surface; connector admin/write access is proven.
            - Final bounded Atlas selective history/content extraction closeout state.

          conflicts:"""
          text, count = unknown_pattern.subn(unknown_replacement, text, count=1)
          if count != 1:
              raise SystemExit("unexpected unknown block")

          blockers_pattern = re.compile(r"blockers:\n.*?\n\nnext_action: [^\n]*", re.S)
          blockers_replacement = """blockers:
            - PROVIDER_GOVERNANCE_RECONCILIATION_PENDING: current instruction/policy coordinates must be reconciled without weakening fail-closed validation.
            - META_TERMINAL_RECONCILIATION_PENDING: META may be updated only after provider closeout is merged and exact residual gates are known.
            - MIGRATION_BACKUP_TERMINAL_DISPOSITION_PENDING: backup repository remains until recovery/evidence obligations are explicitly resolved.

          next_action: Remove temporary verification scaffolding, pass exact clean-head provider gates and merge PR 1164; then continue independently gated governance, META and migration-backup closeout without re-running the completed physical transfer."""
          text, count = blockers_pattern.subn(blockers_replacement, text, count=1)
          if count != 1:
              raise SystemExit("unexpected blockers/next_action block")

          debt_marker = "cleanup_debt:\n"
          debt_line = "  - Provider root/current governance still contains pre-transfer repository-coordinate material; reconcile it through the separately gated fail-closed governance task before ecosystem completion.\n"
          if text.count(debt_marker) != 1:
              raise SystemExit("unexpected cleanup_debt marker")
          if debt_line not in text:
              text = text.replace(debt_marker, debt_marker + debt_line, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          text = Path("docs/agents/programs/OTERYN_ECOSYSTEM_REPOSITORY_MIGRATION.md").read_text(encoding="utf-8")
          required = [
              "provider_transfer_state: POST_TRANSFER_VERIFIED",
              "bounded_verification_run: 32309057579",
              "provider_transfer_complete: true",
              "ecosystem_migration_complete: false",
              "PROVIDER_GOVERNANCE_RECONCILIATION_PENDING",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing expected token: {token}")
          forbidden_current = [
              "blakinio/Oteryn-Platform remains the canonical Platform implementation",
              "SELF_HOSTED_RUNNER_CUTOVER_UNPROVEN",
              "GHCR_LIVE_EVIDENCE_UNAVAILABLE",
              "TRANSFER_OPERATION_UNAVAILABLE",
          ]
          for token in forbidden_current:
              if token in text:
                  raise SystemExit(f"stale current-state token remains: {token}")
          PY

          git diff --check
          git diff -- docs/agents/programs/OTERYN_ECOSYSTEM_REPOSITORY_MIGRATION.md

      - name: Commit programme reconciliation to PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -n "$HEAD_BRANCH"
          if git diff --quiet -- docs/agents/programs/OTERYN_ECOSYSTEM_REPOSITORY_MIGRATION.md; then
            echo "Expected programme reconciliation produced no diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/programs/OTERYN_ECOSYSTEM_REPOSITORY_MIGRATION.md
          git commit -m "docs(migration): reconcile verified Platform transfer state"
          git push origin "HEAD:$HEAD_BRANCH"
