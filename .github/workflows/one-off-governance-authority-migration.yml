name: One-off Safe Governance Workflow Delivery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-governance-authority-migration.yml

permissions:
  contents: read

concurrency:
  group: one-off-governance-workflow-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-verified-workflows:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: governance/issue-1165-safe-authority

      - name: Apply exact workflow bootstrap-path migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "AGENTS.override.md"
          new = "docs/agents/PLATFORM_AGENT_BOOTSTRAP.md"
          expected = {
              ".github/workflows/agent-governance.yml": 2,
              ".github/workflows/edge-security-emulation.yml": 1,
              ".github/workflows/game-auth-ticket-concurrency.yml": 1,
              ".github/workflows/phase7-production-like-validation.yml": 1,
              ".github/workflows/platform-db-outage-validation.yml": 1,
          }
          for path, count in expected.items():
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} old bootstrap references, found {actual}")
              target.write_text(text.replace(old, new), encoding="utf-8")
          PY
          expected_files=$'.github/workflows/agent-governance.yml\n.github/workflows/edge-security-emulation.yml\n.github/workflows/game-auth-ticket-concurrency.yml\n.github/workflows/phase7-production-like-validation.yml\n.github/workflows/platform-db-outage-validation.yml'
          actual_files="$(git diff --name-only | sort)"
          test "$actual_files" = "$(printf '%s\n' "$expected_files" | sort)"
          git diff --check

      - name: Re-run governance and workflow-economy regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/test_policy_consistency.py
          python tools/agents/policy_consistency.py
          python tests/ci/test_workflow_trigger_economy.py
          python tools/agents/test_checkpoint.py
          python tools/agents/test_task_liveness.py
          git diff --check

      - name: Stage verified workflow artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-workflows/.github/workflows"
          cp .github/workflows/agent-governance.yml "$RUNNER_TEMP/verified-workflows/.github/workflows/"
          cp .github/workflows/edge-security-emulation.yml "$RUNNER_TEMP/verified-workflows/.github/workflows/"
          cp .github/workflows/game-auth-ticket-concurrency.yml "$RUNNER_TEMP/verified-workflows/.github/workflows/"
          cp .github/workflows/phase7-production-like-validation.yml "$RUNNER_TEMP/verified-workflows/.github/workflows/"
          cp .github/workflows/platform-db-outage-validation.yml "$RUNNER_TEMP/verified-workflows/.github/workflows/"
          sha256sum "$RUNNER_TEMP"/verified-workflows/.github/workflows/*.yml | sort | tee "$RUNNER_TEMP/verified-workflows/SHA256SUMS"

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-governance-workflow-delivery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/verified-workflows
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
