name: One-off Safe Governance Workflow Delivery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-off-governance-authority-migration.yml

permissions:
  contents: write

concurrency:
  group: one-off-governance-workflow-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-verified-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: governance/issue-1165-safe-authority

      - name: Apply exact workflow bootstrap-path migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "AGENTS.override.md"
          new = "docs/agents/PLATFORM_AGENT_BOOTSTRAP.md"
          expected = {
              ".github/workflows/agent-governance.yml": 2,
              ".github/workflows/edge-security-emulation.yml": 1,
              ".github/workflows/game-auth-ticket-concurrency.yml": 1,
              ".github/workflows/phase7-production-like-validation.yml": 1,
              ".github/workflows/platform-db-outage-validation.yml": 1,
          }
          for path, count in expected.items():
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} old bootstrap references, found {actual}")
              target.write_text(text.replace(old, new), encoding="utf-8")
          PY
          expected_files=$'.github/workflows/agent-governance.yml\n.github/workflows/edge-security-emulation.yml\n.github/workflows/game-auth-ticket-concurrency.yml\n.github/workflows/phase7-production-like-validation.yml\n.github/workflows/platform-db-outage-validation.yml'
          actual_files="$(git diff --name-only | sort)"
          test "$actual_files" = "$(printf '%s\n' "$expected_files" | sort)"
          git diff --check

      - name: Re-run governance and workflow-economy regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/test_policy_consistency.py
          python tools/agents/policy_consistency.py
          python tests/ci/test_workflow_trigger_economy.py
          python tools/agents/test_checkpoint.py
          python tools/agents/test_task_liveness.py
          git diff --check

      - name: Create verified server commit object without moving any ref
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["API_TOKEN"]
          api = f"https://api.github.com/repos/{repository}/git"
          paths = [
              ".github/workflows/agent-governance.yml",
              ".github/workflows/edge-security-emulation.yml",
              ".github/workflows/game-auth-ticket-concurrency.yml",
              ".github/workflows/phase7-production-like-validation.yml",
              ".github/workflows/platform-db-outage-validation.yml",
          ]

          def post(url, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          entries = []
          for path in paths:
              text = Path(path).read_text(encoding="utf-8")
              blob = post(f"{api}/blobs", {"content": text, "encoding": "utf-8"})
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})

          tree = post(f"{api}/trees", {"base_tree": base_tree, "tree": entries})
          commit = post(
              f"{api}/commits",
              {
                  "message": "ci(governance): route workflows to durable bootstrap",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          sha = commit["sha"]
          print(f"SERVER_COMMIT_SHA={sha}")
          print(f"SERVER_COMMIT_PARENT={parent}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Verified workflow-only commit object: `{sha}`\n")
              summary.write(f"Parent branch head: `{parent}`\n")
              summary.write("Ref intentionally not moved by this workflow.\n")
          PY
