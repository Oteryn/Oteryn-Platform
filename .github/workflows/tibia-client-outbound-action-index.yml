name: Tibia Outbound Action Index

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-outbound-action-index.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  index:
    name: Index outbound action symbols and strings
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Inspect exact official client without touching live session
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          [[ -x "$bin" ]]
          echo CLIENT_SHA256=$(sha256sum "$bin" | awk '{print $1}')
          echo '=== ACTION_STRINGS ==='
          strings -a -t x "$bin" \
            | grep -E -i 'publishGameAction|game.?action|walk|move|turn|rotate|attack|follow|use.?with|use.?item|container|say|speak|private.?message|look|browse.?field' \
            | head -n 500 || true
          echo '=== METAOBJECT_NAMES ==='
          strings -a -t x "$bin" \
            | grep -E 'T[A-Za-z0-9_]*(Game|Action|Battle|Inventory|Container|Chat|Player|Protocol|Session)[A-Za-z0-9_]*' \
            | head -n 500 || true
          echo '=== LIVE_SESSION_SANITY ==='
          pid=$(pgrep -x client | head -n1 || true)
          [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 && direct_count == 0 ))
          INNER
