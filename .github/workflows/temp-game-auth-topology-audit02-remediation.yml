name: Issue 720 audit02 remediation

on:
  push:
    branches:
      - docs/issue-720-game-auth-topology-reconcile
    paths:
      - .github/workflows/temp-game-auth-topology-audit02-remediation.yml

permissions:
  contents: write

concurrency:
  group: issue720-audit02-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: docs/issue-720-game-auth-topology-reconcile
          fetch-depth: 0

      - name: Apply audit02 remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agents/issue720_audit02_remediation.py
          git diff --check
          git rm .github/workflows/temp-game-auth-topology-audit02-remediation.yml tools/agents/issue720_audit02_remediation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/SYSTEM_ARCHITECTURE.md docs/contracts/GAME_GATEWAY_IDENTITY_CONTRACT.md docs/agents/tasks/active/OTERYN-20260806-game-auth-topology-reconciliation.md
          git commit -m 'docs(auth): remove transient native-v2 PR liveness wording'

          python3 - <<'PY'
          import subprocess

          expected = sorted([
              "docs/agents/tasks/active/OTERYN-20260806-game-auth-topology-reconciliation.md",
              "docs/architecture/MODULE_CATALOG.md",
              "docs/architecture/SYSTEM_ARCHITECTURE.md",
              "docs/contracts/AUTH_GAME_LOGIN_CONTRACT.md",
              "docs/contracts/GAME_GATEWAY_IDENTITY_CONTRACT.md",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected effective paths: {actual}")
          PY

          git diff --check origin/main...HEAD
          git push origin HEAD:docs/issue-720-game-auth-topology-reconcile
