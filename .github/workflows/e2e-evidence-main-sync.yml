name: Scheduled E2E Evidence Main Sync

on:
  push:
    branches:
      - docs/OTERYN-20260805-e2e-scheduled-evidence-closeout
    paths:
      - .github/workflows/e2e-evidence-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/OTERYN-20260805-e2e-scheduled-evidence-closeout
          fetch-depth: 0
      - name: Merge latest main and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/e2e-evidence-main-sync.yml
          git commit -m 'ci(agents): remove temporary scheduled E2E sync workflow'
          git push origin HEAD:docs/OTERYN-20260805-e2e-scheduled-evidence-closeout
