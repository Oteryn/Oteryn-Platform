name: Tibia Return To 32554-32517-7

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-two-steps-right.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  move:
    runs-on: oteryn-staging
    timeout-minutes: 3
    steps:
      - name: Move live character five steps south
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pid=$(pgrep -x client | head -n1); [[ -n "$pid" ]]

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_before=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_before=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_before=$((total_before-local_before))
          echo ACTIVE_LOCAL_SOCKS_COUNT_BEFORE=$local_before
          echo ACTIVE_DIRECT_TCP_COUNT_BEFORE=$direct_before
          (( local_before > 0 && direct_before == 0 ))

          win=''; best=0
          for w in $(xdotool search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
            geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
            width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
            height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
            [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]] || continue
            area=$((width*height)); if (( area > best )); then win=$w; best=$area; fi
          done
          [[ -n "$win" ]]
          echo TARGET_WINDOW=$win

          for i in $(seq 1 5); do
            xdotool key --clearmodifiers --window "$win" Down
            echo SOUTH_STEP_${i}_SENT=true
            sleep 0.7
          done
          sleep 2

          kill -0 "$pid"
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_after=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_after=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_after=$((total_after-local_after))
          echo ACTIVE_LOCAL_SOCKS_COUNT_AFTER=$local_after
          echo ACTIVE_DIRECT_TCP_COUNT_AFTER=$direct_after
          (( local_after > 0 && direct_after == 0 ))
          echo SOUTH_INPUTS_SENT=5
          echo LIVE_SESSION_RETAINED=true
          INNER
