name: OTS native contract remediation

on:
  push:
    branches:
      - agents/ots-native-selection-platform-correction-20260804
    paths:
      - .github/workflows/ots-native-contract-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agents/ots-native-selection-platform-correction-20260804
          fetch-depth: 0
      - name: Apply review remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected fragment in {path}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace(
              'docs/architecture/adr/0011-single-native-protocol-version.md',
              '- Supersedes: the current native-profile dimension in ADR 0010 and contract revision 2',
              '- Supersedes: the native-profile dimension in ADR 0010 and canonical contract revision 1',
          )
          replace(
              'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md',
              '- Otheryn serves Canary-compatible gameplay selected through the isolated Canary compatibility-profile mechanism through its existing ASIO stack.',
              '- Otheryn serves Canary-compatible gameplay through its existing ASIO stack and isolated Canary compatibility-profile mechanism.',
          )
          replace(
              'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md',
              '4. `candidates` contains `1..8` unique tuples. Array order has no preference meaning.\n5. Each candidate contains exactly family, native protocol version, transport, schema revision/hash and a sorted unique capability list of at most 64 tokens.',
              '4. `candidates` contains `1..8` unique tuples. Array order has no preference meaning. At most one candidate may have `family = oteryn`; when present, its `native_protocol_version` is exactly `1`.\n5. Each native candidate contains exactly family, native protocol version, transport, schema revision/hash and a sorted unique capability list of at most 64 tokens. It contains no `profile` key, alias or placeholder.',
          )
          replace(
              'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md',
              '- exactly one world for initial contract revision 2;',
              '- exactly one world for the initial Gateway/Game Session v2 response;',
          )
          replace(
              'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md',
              'Canary remains a first-class compatibility family unless a later authorized ADR changes it. Native deprecation/removal requires replacement native protocol version, measured population, minimum-supported date, warning period, exact pair evidence and rollback.',
              'Canary remains a first-class compatibility family unless a later authorized ADR changes it. Any additional native version or native deprecation/removal requires a separate later ADR, a new contract/schema revision, coordinated Platform/Gateway/Otheryn/Rust migration, measured population evidence, warning period, exact-pair evidence and rollback. The current contract has no placeholder for that future work.',
          )
          replace(
              'docs/agents/tasks/active/OTERYN-20260805-native-protocol-single-version-completion.md',
              '  - docs/operations/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_ROLLOUT.md',
              '  - docs/architecture/OTERYN_NATIVE_PROTOCOL_ROLLOUT.md',
          )

          manifest_path = root / 'docs/contracts/fixtures/oteryn-native-v1/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.pop('contains_native_profile_field', None)
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          amendment = root / 'docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_SINGLE_VERSION_AMENDMENT.md'
          text = amendment.read_text(encoding='utf-8')
          text = text.replace(
              'Status: `NORMATIVE — SUPERSEDES THE INITIAL NATIVE PROFILE DIMENSION`',
              'Status: `INCORPORATED INTO CANONICAL CONTRACT REVISION 2 — RETAINED AS MIGRATION RATIONALE`',
          )
          amendment.write_text(text, encoding='utf-8', newline='\n')
          PY

          cat > scripts/validate_native_protocol_contract.py <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          ROOT = Path(__file__).resolve().parents[1]
          PROTO = ROOT / "docs/contracts/oteryn_native_gameplay_v1.proto"
          CONTRACT = ROOT / "docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_CONTRACT.md"
          FIXTURES = ROOT / "docs/contracts/fixtures/oteryn-native-v1"
          CURRENT_DOCS = [
              CONTRACT,
              ROOT / "docs/architecture/OTERYN_NATIVE_PROTOCOL_THREAT_MODEL.md",
              ROOT / "docs/architecture/OTERYN_NATIVE_PROTOCOL_ROLLOUT.md",
              ROOT / "docs/architecture/adr/0010-native-gameplay-protocol-selection.md",
              ROOT / "docs/architecture/adr/0011-single-native-protocol-version.md",
              ROOT / "docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md",
          ]

          def fail(message: str) -> None:
              raise SystemExit(message)

          def walk(value, path="$" ) -> None:
              if isinstance(value, dict):
                  for key, item in value.items():
                      if "profile" in key.lower():
                          fail(f"forbidden serialized profile-shaped key at {path}.{key}")
                      walk(item, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f"{path}[{index}]")

          proto = PROTO.read_text(encoding="utf-8")
          if "oteryn.native.v1" in proto:
              fail("legacy native profile value in IDL")
          if re.search(r"^\s*(?:string|uint32)\s+(?:gameplay_profile|transport_profile)\s*=", proto, re.M):
              fail("active profile field in IDL")
          for required in [
              "reserved 3;", 'reserved "gameplay_profile";', "reserved 7;",
              "native_protocol_version = 17;", "native_protocol_version = 16;",
              "string family = 2;", "string family = 6;", "string transport = 4;", "string transport = 8;",
          ]:
              if required not in proto:
                  fail(f"missing IDL compatibility marker: {required}")
          if proto.count("native_protocol_version =") != 2:
              fail("IDL must expose native_protocol_version exactly in ClientHello and ServerHello")

          schema_sha = hashlib.sha256(PROTO.read_bytes()).hexdigest()
          for document in CURRENT_DOCS:
              text = document.read_text(encoding="utf-8")
              if "oteryn.native.v1" in text:
                  fail(f"legacy native profile value in current source: {document}")
          contract = CONTRACT.read_text(encoding="utf-8")
          if f"Canonical schema SHA-256: `{schema_sha}`" not in contract:
              fail("canonical contract schema digest mismatch")
          if re.search(r'"(?:profile|gameplay_profile|transport_profile)"\s*:', contract):
              fail("serialized profile key in canonical contract")
          for required in [
              "At most one candidate may have `family = oteryn`",
              "its `native_protocol_version` is exactly `1`",
              "It contains no `profile` key, alias or placeholder",
              "The current contract has no placeholder for that future work",
          ]:
              if required not in contract:
                  fail(f"missing single-version contract invariant: {required}")

          parsed = {}
          for filename in ["gateway-offer.json", "gateway-selection.json", "manifest.json"]:
              data = json.loads((FIXTURES / filename).read_text(encoding="utf-8"))
              walk(data)
              parsed[filename] = data
          offer = parsed["gateway-offer.json"]["gameplay_offer"]["candidates"]
          native = [item for item in offer if item.get("family") == "oteryn"]
          if len(native) != 1 or native[0].get("native_protocol_version") != 1:
              fail("fixture offer must contain exactly one authorized native descriptor")
          selection = parsed["gateway-selection.json"]["gameplay_selection"]
          if selection.get("family") != "oteryn" or selection.get("native_protocol_version") != 1:
              fail("fixture selection is not the authorized native tuple")
          manifest = parsed["manifest.json"]
          identity = manifest["native_identity"]
          if identity != {"family": "oteryn", "native_protocol_version": 1, "transport": "tcp.tls13.protobuf.be32.v1"}:
              fail("native identity is not the single authorized tuple")
          if manifest["schema_revision"] != 2 or manifest["schema_sha256"] != schema_sha:
              fail("fixture manifest schema provenance mismatch")
          if manifest["production_enabled"] is not False:
              fail("contract fixtures must keep production disabled")
          for provenance in [
              ROOT / "docs/architecture/adr/0011-single-native-protocol-version.md",
              ROOT / "docs/contracts/OTERYN_NATIVE_GAMEPLAY_PROTOCOL_SINGLE_VERSION_AMENDMENT.md",
              ROOT / "docs/operations/OTERYN_NATIVE_PROTOCOL_PRODUCER.md",
          ]:
              if schema_sha not in provenance.read_text(encoding="utf-8"):
                  fail(f"schema digest not pinned in {provenance}")
          print(f"native contract valid: schema_sha256={schema_sha}")
          PY

          python3 scripts/validate_native_protocol_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/validate_native_protocol_contract.py
          git commit -m "contract(native): resolve single-version review findings"
          git push origin HEAD:agents/ots-native-selection-platform-correction-20260804
