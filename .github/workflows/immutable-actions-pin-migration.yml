name: Immutable Actions Pin Migration

on:
  push:
    branches:
      - ci/immutable-actions-pinning-1008
    paths:
      - '.github/workflows/immutable-actions-pin-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/ci/immutable-actions-pinning-1008'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/immutable-actions-pinning-1008
          fetch-depth: 0

      - name: Apply and validate reviewed immutable mappings
        run: |
          python tools/validation/apply_github_actions_pins.py
          python tools/validation/test_github_actions_pinning.py
          python tools/validation/github_actions_pinning.py
          git diff --check

      - name: Materialize detached Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'oteryn-actions-pinning',
          }
          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent_commit = request('GET', f'/git/commits/{parent}')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', '.github/workflows'], text=True
          ).splitlines()
          if not changed:
              raise SystemExit('no workflow changes generated')
          entries = []
          for path in changed:
              content = open(path, encoding='utf-8').read()
              blob = request('POST', '/git/blobs', {'content': content, 'encoding': 'utf-8'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = request('POST', '/git/trees', {'base_tree': parent_commit['tree']['sha'], 'tree': entries})
          commit = request('POST', '/git/commits', {
              'message': 'ci: pin external GitHub Actions to immutable SHAs',
              'tree': tree['sha'],
              'parents': [parent],
          })
          print(f'PARENT={parent}')
          print(f'CHANGED_FILES={len(changed)}')
          print(f'GENERATED_COMMIT={commit["sha"]}')
          PY
