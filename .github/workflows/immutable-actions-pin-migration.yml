name: Immutable Actions Pin Migration

on:
  push:
    branches:
      - ci/immutable-actions-pinning-1008
    paths:
      - '.github/workflows/immutable-actions-pin-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/ci/immutable-actions-pinning-1008'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/immutable-actions-pinning-1008
          fetch-depth: 0

      - name: Apply reviewed immutable mappings
        run: |
          python tools/validation/apply_github_actions_pins.py
          python tools/validation/test_github_actions_pinning.py
          python tools/validation/github_actions_pinning.py

      - name: Commit bounded migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git diff --cached --check
          git commit -m 'ci: pin external GitHub Actions to immutable SHAs'
          git push origin HEAD:ci/immutable-actions-pinning-1008
