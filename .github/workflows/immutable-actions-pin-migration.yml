name: Immutable Actions Pin Migration

on:
  push:
    branches:
      - ci/immutable-actions-pinning-1008
    paths:
      - '.github/workflows/immutable-actions-pin-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/ci/immutable-actions-pinning-1008'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/immutable-actions-pinning-1008
          fetch-depth: 0

      - name: Apply reviewed immutable mappings
        run: |
          python tools/validation/apply_github_actions_pins.py
          python tools/validation/test_github_actions_pinning.py
          python tools/validation/github_actions_pinning.py
          git diff --check
          git diff -- .github/workflows > immutable-actions-pins.patch

      - name: Upload bounded transformed workflows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immutable-actions-workflows-${{ github.sha }}
          path: |
            immutable-actions-pins.patch
            .github/workflows
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
