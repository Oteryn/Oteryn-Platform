name: Tibia Player Protocol Meta

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-player-protocol-meta.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  meta:
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Resolve player protocol handler metaobject and send methods
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          python3 - "$bin" <<'PY'
import subprocess,re,struct,sys
p=sys.argv[1]
data=open(p,'rb').read()
# Locate class string and nearby Qt metadata by scanning printable strings around it.
needle=b'tibia::protocol::TPlayerProtocolMessageHandler\0'
pos=data.find(needle)
print(f'CLASS_FILE_OFF=0x{pos:x}')
# map file offset -> VA and VA -> file offset
out=subprocess.check_output(['readelf','-WS',p],text=True,errors='replace')
secs=[]
for line in out.splitlines():
 m=re.search(r'\[\s*\d+\]\s+(\S+)\s+\S+\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',line)
 if m: secs.append((m.group(1),int(m.group(2),16),int(m.group(3),16),int(m.group(4),16)))
def off2va(off):
 for n,va,fo,sz in secs:
  if fo<=off<fo+sz:return va+(off-fo),n
 return None,None
def va2off(va):
 for n,sva,fo,sz in secs:
  if sva<=va<sva+sz:return fo+(va-sva),n
 return None,None
classva,sec=off2va(pos)
print(f'CLASS_VA=0x{classva:x} SECTION={sec}')
# Search relocations whose addends land within +/- 0x4000 of class VA; static metaobject has stringdata and metadata ptr relocations.
rel=subprocess.check_output(['readelf','-rW',p],text=True,errors='replace')
cands=[]
for ln in rel.splitlines():
 m=re.match(r'([0-9a-fA-F]+)\s+\S+\s+\S+\s+([0-9a-fA-F]+)',ln)
 if not m: continue
 loc=int(m.group(1),16); add=int(m.group(2),16)
 if classva-0x4000 <= add <= classva+0x12000:
  cands.append((loc,add,ln))
print('NEAR_RELOCS')
for loc,add,ln in cands[:300]: print(ln)
# Show printable strings from class through 16KB for direct method inventory.
chunk=data[pos:pos+0x4000]
print('METHOD_STRINGS')
for m in re.finditer(rb'[ -~]{4,}',chunk):
 s=m.group().decode('ascii','replace')
 if re.search(r'^(send|handle|publish)|GameclientMessage|GameAction|TPlayerProtocol',s):
  va,_=off2va(pos+m.start()); print(f'0x{va:x} {s}')
PY
          pid=$(pgrep -x client | head -n1 || true); [[ -n "$pid" ]]
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo CLIENT_PID=$pid
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
