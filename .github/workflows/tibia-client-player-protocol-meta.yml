name: Tibia Creatures Handler Meta Map

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-player-protocol-meta.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  map:
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Locate live creatures handler and decode Qt metaobject
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          pid=$(pgrep -x client | tail -n1 || true); [[ -n "$pid" ]]
          echo CLIENT_PID=$pid
          python3 - "$pid" "$bin" <<'PY'
          import sys,struct
          pid=int(sys.argv[1]); path=sys.argv[2]
          try:
              from elftools.elf.elffile import ELFFile
          except Exception as e:
              print('PYELFTOOLS_UNAVAILABLE',repr(e)); raise

          with open(path,'rb') as f:
              elf=ELFFile(f)
              alloc=[]
              for sec in elf.iter_sections():
                  if sec['sh_flags'] & 2 and sec['sh_size']:
                      alloc.append((sec,sec.data()))
              needles=[b'N5tibia9creatures27TCreaturesGameActionHandlerE',b'tibia::creatures::TCreaturesGameActionHandler']
              names=[]
              for needle in needles:
                  for sec,data in alloc:
                      pos=0
                      while True:
                          i=data.find(needle,pos)
                          if i<0: break
                          va=sec['sh_addr']+i
                          names.append((needle.decode(),va))
                          print(f'NAME_VA {needle.decode()} 0x{va:x}')
                          pos=i+1

              rela=[]
              for sec in elf.iter_sections():
                  if sec['sh_type'] in ('SHT_RELA','SHT_REL'):
                      for r in sec.iter_relocations():
                          add=r['r_addend'] if 'r_addend' in r.entry else None
                          rela.append((r['r_offset'],add,r['r_info_type']))
              for name,va in names:
                  hits=[x for x in rela if x[1]==va]
                  for off,add,typ in hits:
                      print(f'RELOC_TO_NAME name=0x{va:x} offset=0x{off:x} type={typ}')
                      rtti=off-8
                      print(f'RTTI_CANDIDATE=0x{rtti:x}')
                      vhits=[x for x in rela if x[1]==rtti]
                      for voff,vadd,vtyp in vhits:
                          print(f'RELOC_TO_RTTI rtti=0x{rtti:x} offset=0x{voff:x} type={vtyp} OBJECT_VPTR_CANDIDATE=0x{voff+8:x}')

              def va_read(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type']=='PT_LOAD' and seg['p_vaddr']<=va and va+n<=seg['p_vaddr']+seg['p_filesz']:
                          f.seek(seg['p_offset']+(va-seg['p_vaddr']))
                          return f.read(n)
                  raise ValueError(hex(va))

              meta=0x3085160
              raw=va_read(meta,56)
              qs=struct.unpack('<7Q',raw)
              print('CREATURES_STATIC_METAOBJECT=0x3085160')
              print('META_QWORDS='+' '.join(f'{x:016x}' for x in qs))
              string_ptr=qs[1]; data_ptr=qs[2]
              print(f'META_STRING_PTR=0x{string_ptr:x}')
              print(f'META_DATA_PTR=0x{data_ptr:x}')
              if data_ptr:
                  d=va_read(data_ptr,256)
                  us=struct.unpack('<64I',d)
                  print('META_DATA_UINTS='+' '.join(str(x) for x in us))
              if string_ptr:
                  s=va_read(string_ptr,1024)
                  print('META_STRING_HEX='+s[:512].hex())
                  printable=''.join(chr(b) if 32<=b<127 else '.' for b in s[:1024])
                  print('META_STRING_ASCII='+printable)

          maps=[]; base=None
          for line in open(f'/proc/{pid}/maps'):
              p=line.rstrip('\n').split(maxsplit=5); lo,hi=[int(x,16) for x in p[0].split('-')]
              perms=p[1]; off=int(p[2],16); mpath=p[5] if len(p)>5 else ''
              maps.append((lo,hi,perms,off,mpath))
              if mpath==path and base is None: base=lo-off
          print(f'CLIENT_BASE=0x{base:x}')
          # Known candidate object-vptr addresses are recovered above; rescan relocation chain here to avoid parsing stdout.
          with open(path,'rb') as f:
              elf=ELFFile(f); rel=[]
              for sec in elf.iter_sections():
                  if sec['sh_type'] in ('SHT_RELA','SHT_REL'):
                      for r in sec.iter_relocations():
                          rel.append((r['r_offset'],r['r_addend'] if 'r_addend' in r.entry else None))
              target=None
              for sec in elf.iter_sections():
                  if not (sec['sh_flags'] & 2): continue
                  data=sec.data(); needle=b'N5tibia9creatures27TCreaturesGameActionHandlerE'; i=data.find(needle)
                  if i>=0: target=sec['sh_addr']+i; break
              assert target is not None
              name_refs=[o for o,a in rel if a==target]
              candidates=[]
              for nr in name_refs:
                  rtti=nr-8
                  for vo,a in rel:
                      if a==rtti: candidates.append(vo+8)
          print('STATIC_VPTR_CANDIDATES='+' '.join(hex(x) for x in candidates))
          with open(f'/proc/{pid}/mem','rb',buffering=0) as mem:
              for sv in candidates:
                  rv=base+sv; needle=struct.pack('<Q',rv); found=[]
                  for lo,hi,perms,off,mpath in maps:
                      if 'r' not in perms or 'w' not in perms: continue
                      size=hi-lo
                      if size<=0 or size>256*1024*1024: continue
                      try: mem.seek(lo); data=mem.read(size)
                      except OSError: continue
                      pos=0
                      while True:
                          i=data.find(needle,pos)
                          if i<0: break
                          found.append(lo+i); pos=i+8
                  print(f'VPTR_SCAN static=0x{sv:x} runtime=0x{rv:x} count={len(found)} objects='+' '.join(hex(x) for x in found))
          PY

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
