name: Tibia Player Protocol Meta

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-player-protocol-meta.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  meta:
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Map player protocol action names and wrapper ids
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          echo PLAYER_PROTOCOL_METADATA_MAP=true
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          pid=$(pgrep -x client | tail -n1 || true)
          [[ -n "$pid" ]]
          echo CLIENT_PID=$pid
          echo SEND_ACTION_NAMES_BEGIN
          strings -a -t x "$bin" | grep -E 'send(Go|Rotate|Stop|Cancel|Attack|Follow|Use|Move|Talk)' | sed -n '1,240p' || true
          echo SEND_ACTION_NAMES_END
          echo PLAYER_META_NEIGHBORHOOD_BEGIN
          strings -a -t x "$bin" | grep -A180 -B20 'tibia::game::TPlayerProtocolMessageHandler' | sed -n '1,240p' || true
          echo PLAYER_META_NEIGHBORHOOD_END
          echo WRAPPER_IDS_BEGIN
          for a in ee2cd0 ee2d50 ee2dd0 ee2e50 ee2ed0 ee2f50 ee2fd0 ee3050 ee30d0 ee3150 ee31d0 ee3250 ee32d0 ee3350; do
            printf 'FUNC_0x%s ' "$a"
            objdump -d --start-address="0x$a" --stop-address="$((0x$a+8))" "$bin" 2>/dev/null | grep -m1 -E 'mov.*\$0x[0-9a-f]+,%edx' || true
          done
          echo WRAPPER_IDS_END
          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
