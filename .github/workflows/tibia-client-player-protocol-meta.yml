name: Tibia Creatures Signal ABI Map

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-player-protocol-meta.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  map:
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Decode TCreaturesGameActionHandler signal names and ABI
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          pid=$(pgrep -x client | tail -n1 || true); [[ -n "$pid" ]]
          echo CLIENT_PID=$pid

          # The previous RTTI proof placed TCreaturesGameActionHandler's Qt string-data
          # inside the 0x1cb0d50 block, whose QMetaObject is the 0x3085060 group.
          echo CREATURES_META_BYTES_BEGIN
          objdump -s --start-address=0x3085060 --stop-address=0x30850a0 "$bin" 2>/dev/null
          echo CREATURES_META_BYTES_END

          echo CREATURES_STRING_REGION_BEGIN
          strings -a -t x "$bin" | awk '$1 >= "1cb0d20" && $1 <= "1cb1300" {print}'
          echo CREATURES_STRING_REGION_END

          echo CREATURES_META_REFERENCES_BEGIN
          objdump -d "$bin" 2>/dev/null | grep -E -B12 -A30 '3085060' | sed -n '1,1800p' || true
          echo CREATURES_META_REFERENCES_END

          echo CREATURES_METACALL_DISASM_BEGIN
          objdump -d --start-address=0xd16000 --stop-address=0xd16880 "$bin" 2>/dev/null | sed -n '1,2200p'
          echo CREATURES_METACALL_DISASM_END

          python3 - "$pid" "$bin" <<'PY'
          import sys,struct
          pid=int(sys.argv[1]); path=sys.argv[2]
          maps=[]; base=None
          for line in open(f'/proc/{pid}/maps'):
              p=line.rstrip('\n').split(maxsplit=5)
              lo,hi=[int(x,16) for x in p[0].split('-')]
              perms=p[1]; off=int(p[2],16); mpath=p[5] if len(p)>5 else ''
              maps.append((lo,hi,perms,off,mpath))
              if mpath==path and base is None: base=lo-off
          if base is None: raise SystemExit('NO_BASE')
          print(f'CLIENT_BASE=0x{base:x}')
          obj=0x56427e947710
          # Relocate the object address only if the client base changed: rediscover vptr uniquely.
          runtime_vptr=base+0x3087a90
          needle=struct.pack('<Q',runtime_vptr); found=[]
          with open(f'/proc/{pid}/mem','rb',buffering=0) as mem:
              for lo,hi,perms,off,mpath in maps:
                  if 'r' not in perms or 'w' not in perms: continue
                  size=hi-lo
                  if size<=0 or size>256*1024*1024: continue
                  try: mem.seek(lo); data=mem.read(size)
                  except OSError: continue
                  pos=0
                  while True:
                      i=data.find(needle,pos)
                      if i<0: break
                      found.append(lo+i); pos=i+8
              print(f'CREATURES_VPTR_RUNTIME=0x{runtime_vptr:x}')
              print('CREATURES_OBJECTS='+' '.join(hex(x) for x in found))
              if len(found)!=1: raise SystemExit('CREATURES_OBJECT_NOT_UNIQUE')
              obj=found[0]
              meta=base+0x3085060
              mem.seek(meta); q=struct.unpack('<7Q',mem.read(56))
              print(f'CREATURES_META_RUNTIME=0x{meta:x}')
              print('CREATURES_META_QWORDS='+' '.join(f'{x:016x}' for x in q))
              for idx in (1,2,3,5):
                  val=q[idx]
                  if not val: continue
                  for lo,hi,perms,off,mpath in maps:
                      if lo<=val<hi and 'r' in perms:
                          mem.seek(val); b=mem.read(1024)
                          printable=''.join(chr(x) if 32<=x<127 else '.' for x in b)
                          print(f'CREATURES_META_PTR_{idx}=0x{val:x} ASCII={printable}')
                          break
              # dump first 0x100 bytes of live handler to expose linked collaborators/state pointers
              mem.seek(obj); raw=mem.read(0x100)
              print('CREATURES_OBJECT_QWORDS='+' '.join(f'{x:016x}' for x in struct.unpack('<32Q',raw)))
          PY

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
