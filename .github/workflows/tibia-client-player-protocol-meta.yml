name: Tibia Native Action Signature Map

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-player-protocol-meta.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  map:
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Extract player protocol method metadata without GUI
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          pid=$(pgrep -x client | tail -n1 || true); [[ -n "$pid" ]]
          echo CLIENT_PID=$pid

          echo PLAYER_PROTOCOL_STRING_REGION_BEGIN
          strings -a -t x "$bin" | awk '$1 >= "1cb4f44" && $1 <= "1cb5903" {print}'
          echo PLAYER_PROTOCOL_STRING_REGION_END

          echo ACTION_DISASSEMBLY_BEGIN
          for range in 'ee2c00 ee3450' 'ee3500 ee3d00' 'd10000 d14000'; do
            set -- $range
            echo RANGE_0x$1_0x$2
            objdump -d --start-address="0x$1" --stop-address="0x$2" "$bin" 2>/dev/null | grep -E -B3 -A12 'QMetaObject8activate|protobuf|prepare|enqueue' | sed -n '1,500p' || true
          done
          echo ACTION_DISASSEMBLY_END

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$((total_count-local_count))
          (( local_count > 0 && total_count-local_count == 0 ))
          INNER
