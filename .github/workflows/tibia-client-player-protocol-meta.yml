name: Tibia Native Rotate Proof

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-player-protocol-meta.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  prove:
    runs-on: oteryn-staging
    timeout-minutes: 4
    steps:
      - name: Invoke sendRotateEast without GUI
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          bin='/data/home/.local/share/CipSoft GmbH/Tibia/packages/Tibia/bin/client'
          pid=$(pgrep -x client | tail -n1 || true)
          [[ -n "$pid" ]]
          echo CLIENT_PID=$pid

          before=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_before=$(printf '%s\n' "$before" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_before=$(printf '%s\n' "$before" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_BEFORE=$local_before
          echo ACTIVE_DIRECT_TCP_BEFORE=$((total_before-local_before))
          (( local_before > 0 && total_before-local_before == 0 ))

          read base obj < <(python3 - "$pid" "$bin" <<'PY'
          import sys,struct
          pid=int(sys.argv[1]); binpath=sys.argv[2]
          maps=[]; base=None
          for line in open(f'/proc/{pid}/maps'):
              p=line.rstrip('\n').split(maxsplit=5)
              lo,hi=[int(x,16) for x in p[0].split('-')]
              perms=p[1]; off=int(p[2],16); path=p[5] if len(p)>5 else ''
              maps.append((lo,hi,perms,path))
              if path==binpath and base is None: base=lo-off
          if base is None: raise SystemExit(2)
          needle=struct.pack('<Q',base+0x308a008)
          found=[]
          with open(f'/proc/{pid}/mem','rb',buffering=0) as mem:
              for lo,hi,perms,path in maps:
                  if 'r' not in perms or 'w' not in perms: continue
                  size=hi-lo
                  if size<=0 or size>256*1024*1024: continue
                  try: mem.seek(lo); data=mem.read(size)
                  except OSError: continue
                  pos=0
                  while True:
                      i=data.find(needle,pos)
                      if i<0: break
                      found.append(lo+i); pos=i+8
          if len(found)!=1: raise SystemExit(3)
          print(hex(base),hex(found[0]))
          PY
          )
          echo CLIENT_BASE=$base
          echo PLAYER_HANDLER_OBJECT=$obj
          func=$(printf '0x%x' $((base + 0xee3250)))
          echo SEND_ROTATE_EAST_RUNTIME=$func

          command -v gdb >/dev/null
          set +e
          gdb_out=$(gdb -q -nx -batch -p "$pid" \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'thread 1' \
            -ex "call ((void (*)(void *))$func)((void *)$obj)" \
            -ex 'detach' 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$gdb_out" | sed -n '1,120p'
          echo GDB_CALL_RC=$rc
          (( rc == 0 ))
          echo NATIVE_SEND_ROTATE_EAST_CALL_RETURNED=true

          sleep 2
          [[ -d "/proc/$pid" ]]
          after=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          local_after=$(printf '%s\n' "$after" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_after=$(printf '%s\n' "$after" | grep -c . || true)
          echo ACTIVE_LOCAL_SOCKS_AFTER=$local_after
          echo ACTIVE_DIRECT_TCP_AFTER=$((total_after-local_after))
          (( local_after > 0 && total_after-local_after == 0 ))
          echo CLIENT_SURVIVED_NATIVE_ROTATE=true
          INNER
