name: Portal E2E Audit

on:
  push:
    branches:
      - 'test/*-portal-e2e-audit'
    paths:
      - '.github/workflows/portal-e2e-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: portal-e2e-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-browser-matrix:
    name: Zero-retry critical browser matrix
    uses: ./.github/workflows/acceptance-validation.yml
    with:
      profile: critical
      run_suffix: portal-audit-critical
      zero_retries: true
    permissions:
      contents: read

  full-primary-browser:
    name: Zero-retry full primary browser baseline
    uses: ./.github/workflows/acceptance-validation.yml
    with:
      profile: full
      run_suffix: portal-audit-full
      zero_retries: true
    permissions:
      contents: read

  specialized-and-contract-audit:
    name: Exact-head specialized, contract, stability and soak audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_REF: ${{ github.ref_name }}
      AUDIT_SHA: ${{ github.sha }}

    steps:
      - name: Dispatch exact-head audit workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/portal-e2e-audit
          : > artifacts/portal-e2e-audit/dispatched.tsv

          workflows=(
            portal-acceptance-contract.yml
            downloads-acceptance.yml
            events-acceptance.yml
            announcements-acceptance.yml
            support-legal-acceptance.yml
            editorial-media-acceptance.yml
            wiki-reconciliation-acceptance.yml
            acceptance-stability.yml
            acceptance-soak.yml
          )

          for workflow in "${workflows[@]}"; do
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Dispatching ${workflow} for ${AUDIT_REF}@${AUDIT_SHA}"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$AUDIT_REF"

            run_id=''
            for attempt in $(seq 1 90); do
              run_id="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --branch "$AUDIT_REF" \
                  --event workflow_dispatch \
                  --limit 30 \
                  --json databaseId,headSha,createdAt \
                | jq -r \
                    --arg sha "$AUDIT_SHA" \
                    --arg started "$started_at" \
                    '[.[] | select(.headSha == $sha and .createdAt >= $started)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty'
              )"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "Could not identify dispatched run for ${workflow} on ${AUDIT_SHA}." >&2
              exit 1
            fi

            printf '%s\t%s\n' "$workflow" "$run_id" | tee -a artifacts/portal-e2e-audit/dispatched.tsv
          done

      - name: Wait for exact-head audit workflows and collect results
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/portal-e2e-audit/results.jsonl
          failed=0

          while IFS=$'\t' read -r workflow run_id; do
            echo "Waiting for ${workflow} run ${run_id}"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 || true

            result="$(
              gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json databaseId,workflowName,headSha,event,status,conclusion,url,createdAt,updatedAt
            )"
            echo "$result" | jq -c --arg workflow_file "$workflow" '. + {workflow_file: $workflow_file}' \
              | tee -a artifacts/portal-e2e-audit/results.jsonl

            conclusion="$(echo "$result" | jq -r '.conclusion // empty')"
            head_sha="$(echo "$result" | jq -r '.headSha // empty')"
            if [ "$head_sha" != "$AUDIT_SHA" ] || [ "$conclusion" != 'success' ]; then
              failed=1
            fi
          done < artifacts/portal-e2e-audit/dispatched.tsv

          jq -s '.' artifacts/portal-e2e-audit/results.jsonl > artifacts/portal-e2e-audit/results.json
          {
            echo '## Portal E2E audit dispatched workflow results'
            echo
            echo '```json'
            cat artifacts/portal-e2e-audit/results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"

      - name: Upload audit orchestration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-e2e-audit-${{ github.sha }}
          path: artifacts/portal-e2e-audit
          if-no-files-found: warn
          retention-days: 14
