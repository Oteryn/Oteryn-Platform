name: Portal E2E Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/portal-e2e-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: portal-e2e-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-audit:
    name: Exact-head comprehensive portal audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Dispatch exact-head audit workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/portal-e2e-audit
          : > artifacts/portal-e2e-audit/dispatched.tsv

          audit_entries=(
            'acceptance-critical|acceptance-validation.yml|critical'
            'acceptance-full|acceptance-validation.yml|full'
            'portal-contract|portal-acceptance-contract.yml|'
            'downloads|downloads-acceptance.yml|'
            'events|events-acceptance.yml|'
            'announcements|announcements-acceptance.yml|'
            'support-legal|support-legal-acceptance.yml|'
            'editorial-media|editorial-media-acceptance.yml|'
            'wiki|wiki-reconciliation-acceptance.yml|'
            'stability|acceptance-stability.yml|'
            'soak|acceptance-validation.yml|soak'
          )

          for entry in "${audit_entries[@]}"; do
            IFS='|' read -r label workflow profile <<< "$entry"
            before_ids="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$AUDIT_REF" \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId \
              | jq '[.[].databaseId]'
            )"

            echo "Dispatching ${label} (${workflow}) for ${AUDIT_REF}@${AUDIT_SHA}"
            if [ "$label" = 'soak' ]; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$AUDIT_REF" -f profile=soak -f soak_seconds=300
            elif [ -n "$profile" ]; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$AUDIT_REF" -f profile="$profile"
            else
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$AUDIT_REF"
            fi

            run_id=''
            for attempt in $(seq 1 90); do
              run_id="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --branch "$AUDIT_REF" \
                  --event workflow_dispatch \
                  --limit 50 \
                  --json databaseId,headSha,createdAt \
                | jq -r \
                    --arg sha "$AUDIT_SHA" \
                    --argjson before "$before_ids" \
                    '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | reverse | .[0].databaseId // empty'
              )"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "Could not identify dispatched run for ${label} (${workflow}) on ${AUDIT_SHA}." >&2
              exit 1
            fi

            printf '%s\t%s\t%s\n' "$label" "$workflow" "$run_id" | tee -a artifacts/portal-e2e-audit/dispatched.tsv

            # Direct workflow_dispatch runs of acceptance-validation share the
            # same concurrency key. Serialize critical, full and soak so a
            # later profile cannot cancel an earlier exact-head audit run.
            if [ "$workflow" = 'acceptance-validation.yml' ]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 || true
            fi
          done

      - name: Wait for exact-head audit workflows and collect results
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/portal-e2e-audit/results.jsonl
          failed=0

          while IFS=$'\t' read -r label workflow run_id; do
            echo "Collecting ${label} (${workflow}) run ${run_id}"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 || true

            result="$(
              gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json databaseId,workflowName,headSha,event,status,conclusion,url,createdAt,updatedAt
            )"
            echo "$result" | jq -c \
              --arg audit_label "$label" \
              --arg workflow_file "$workflow" \
              '. + {audit_label: $audit_label, workflow_file: $workflow_file}' \
              | tee -a artifacts/portal-e2e-audit/results.jsonl

            conclusion="$(echo "$result" | jq -r '.conclusion // empty')"
            head_sha="$(echo "$result" | jq -r '.headSha // empty')"
            if [ "$head_sha" != "$AUDIT_SHA" ] || [ "$conclusion" != 'success' ]; then
              failed=1
            fi
          done < artifacts/portal-e2e-audit/dispatched.tsv

          jq -s '.' artifacts/portal-e2e-audit/results.jsonl > artifacts/portal-e2e-audit/results.json
          {
            echo '## Portal E2E audit dispatched workflow results'
            echo
            echo '```json'
            cat artifacts/portal-e2e-audit/results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"

      - name: Upload audit orchestration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-e2e-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/portal-e2e-audit
          if-no-files-found: warn
          retention-days: 14
