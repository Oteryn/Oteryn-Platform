name: One-shot Support Documentation Branch Trigger

on:
  pull_request:
    branches:
      - feat/OTERYN-20260728-support-moderation-lifecycle
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'trigger/support-documentation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
    steps:
      - name: Checkout support branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260728-support-moderation-lifecycle
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, gd
          tools: composer:v2

      - name: Install dependencies from lockfile
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: Extract and execute reconciliation script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-shot-support-documentation.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/reconcile_support_docs.py').write_text(script + '\n', encoding='utf-8')
          PY
          python3 /tmp/reconcile_support_docs.py

      - name: Validate checkpoint and product ledgers
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/checkpoint.py docs/agents/tasks/active/OTERYN-20260728-support-moderation-lifecycle.md --require-checkpoint
          python tools/agents/test_checkpoint.py
          npm --prefix scripts/acceptance run test:product-completeness
          npm --prefix scripts/acceptance run test:coverage-contract:strict

      - name: Commit reconciliation and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-support-documentation.yml
          git rm .github/workflows/one-shot-support-documentation-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(support): reconcile lifecycle contracts and benchmark'
          git push origin HEAD:feat/OTERYN-20260728-support-moderation-lifecycle
