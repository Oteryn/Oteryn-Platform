name: Wiki Reconciliation Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/portal-exhaustive-audit.yml'
      - '.github/workflows/wiki-reconciliation-acceptance.yml'
      - '.github/workflows/editorial-media-acceptance.yml'
      - '.github/workflows/portal-exhaustive-acceptance.yml'
      - '.github/workflows/acceptance-validation.yml'
      - 'tools/audit/portal_exhaustive_audit.py'
      - 'tools/audit/portal_exhaustive_reconcile.py'
      - 'tools/audit/portal_exhaustive_strictness.py'
      - 'tools/audit/validate_portal_exhaustive_retained_evidence.py'
      - 'tools/audit/test_portal_exhaustive_audit.py'
      - 'tools/audit/test_portal_exhaustive_reconcile.py'
      - 'tools/audit/test_portal_exhaustive_strictness.py'
      - 'tools/audit/test_validate_portal_exhaustive_retained_evidence.py'
      - 'docs/agents/tasks/active/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/**'
      - 'docs/agents/reports/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/testing/**'
      - 'scripts/acceptance/coverage/**'
      - 'scripts/acceptance/tests/**'
      - 'scripts/acceptance/playwright*.config.mjs'
      - 'scripts/acceptance/package.json'
      - 'routes/**'
      - 'app/**'
      - 'resources/views/**'
      - 'resources/navigation/**'
      - 'composer.json'
      - 'composer.lock'
      - 'app/Wiki/**'
      - 'app/EditorialMedia/**'
      - 'resources/views/wiki/**'
      - 'resources/views/admin/wiki/**'
      - 'public/css/wiki.css'
      - 'public/css/wiki-admin.css'
      - 'public/js/wiki-admin-media.js'
      - 'lang/en/public.php'
      - 'lang/pl/public.php'
      - 'routes/modules/wiki.php'
      - 'routes/localization.php'
      - 'scripts/acceptance/playwright.wiki-reconciliation.config.mjs'
      - 'scripts/acceptance/seed-public-wiki.php'
      - 'scripts/acceptance/seed-browser-wiki-reconciliation.php'
      - 'scripts/acceptance/tests/public-wiki-read-search.spec.mjs'
      - 'scripts/acceptance/tests/admin-wiki-administration.spec.mjs'
      - 'scripts/acceptance/tests/wiki-reconciliation-acceptance.spec.mjs'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portal-exhaustive-audit.yml'
      - '.github/workflows/wiki-reconciliation-acceptance.yml'
      - '.github/workflows/editorial-media-acceptance.yml'
      - '.github/workflows/portal-exhaustive-acceptance.yml'
      - '.github/workflows/acceptance-validation.yml'
      - 'tools/audit/portal_exhaustive_audit.py'
      - 'tools/audit/portal_exhaustive_reconcile.py'
      - 'tools/audit/portal_exhaustive_strictness.py'
      - 'tools/audit/validate_portal_exhaustive_retained_evidence.py'
      - 'tools/audit/test_portal_exhaustive_audit.py'
      - 'tools/audit/test_portal_exhaustive_reconcile.py'
      - 'tools/audit/test_portal_exhaustive_strictness.py'
      - 'tools/audit/test_validate_portal_exhaustive_retained_evidence.py'
      - 'docs/agents/tasks/active/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/agents/evidence/OTERYN-20260803-portal-exhaustive-current-main-audit/**'
      - 'docs/agents/reports/OTERYN-20260803-portal-exhaustive-current-main-audit.md'
      - 'docs/testing/**'
      - 'scripts/acceptance/coverage/**'
      - 'scripts/acceptance/tests/**'
      - 'scripts/acceptance/playwright*.config.mjs'
      - 'scripts/acceptance/package.json'
      - 'routes/**'
      - 'app/**'
      - 'resources/views/**'
      - 'resources/navigation/**'
      - 'composer.json'
      - 'composer.lock'
      - 'app/Wiki/**'
      - 'app/EditorialMedia/**'
      - 'resources/views/wiki/**'
      - 'resources/views/admin/wiki/**'
      - 'public/css/wiki.css'
      - 'public/css/wiki-admin.css'
      - 'public/js/wiki-admin-media.js'
      - 'lang/en/public.php'
      - 'lang/pl/public.php'
      - 'routes/modules/wiki.php'
      - 'routes/localization.php'
      - 'scripts/acceptance/playwright.wiki-reconciliation.config.mjs'
      - 'scripts/acceptance/seed-public-wiki.php'
      - 'scripts/acceptance/seed-browser-wiki-reconciliation.php'
      - 'scripts/acceptance/tests/public-wiki-read-search.spec.mjs'
      - 'scripts/acceptance/tests/admin-wiki-administration.spec.mjs'
      - 'scripts/acceptance/tests/wiki-reconciliation-acceptance.spec.mjs'
      - 'scripts/acceptance/coverage/portal-coverage-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-reconciliation-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki-reconciliation-lifecycle:
    name: Complete Wiki reconciliation lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: acceptance-ci-root-not-a-secret
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-wiki-reconciliation
      ACCEPTANCE_RUN_SUFFIX: wiki-reconciliation
      ACCEPTANCE_ZERO_RETRIES: '1'
      ACCEPTANCE_BASE_URL: http://127.0.0.1:8080
      ACCEPTANCE_MAILHOG_URL: http://127.0.0.1:8025
      ACCEPTANCE_OUTPUT_DIR: /tmp/oteryn-wiki-reconciliation-acceptance
      APP_ENV: acceptance
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8080
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: info
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      SESSION_HTTP_ONLY: 'true'
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: ''
      MAIL_FROM_ADDRESS: acceptance@staging.oteryn
      MAIL_FROM_NAME: Oteryn Acceptance
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_platform_acceptance
      DB_USERNAME: root
      DB_PASSWORD: acceptance-ci-root-not-a-secret
      CANARY_DB_HOST: 127.0.0.1
      CANARY_DB_PORT: 3306
      CANARY_DB_DATABASE: canary_acceptance
      CANARY_DB_USERNAME: oteryn_acceptance_readonly
      CANARY_DB_PASSWORD: acceptance-ci-readonly-not-a-secret
      CANARY_PROVISIONING_DB_HOST: 127.0.0.1
      CANARY_PROVISIONING_DB_PORT: 3306
      CANARY_PROVISIONING_DB_DATABASE: canary_acceptance
      CANARY_PROVISIONING_DB_USERNAME: oteryn_acceptance_provisioning
      CANARY_PROVISIONING_DB_PASSWORD: acceptance-ci-provisioning-not-a-secret
      CANARY_CHARACTER_CREATE_DB_HOST: 127.0.0.1
      CANARY_CHARACTER_CREATE_DB_PORT: 3306
      CANARY_CHARACTER_CREATE_DB_DATABASE: canary_acceptance
      CANARY_CHARACTER_CREATE_DB_USERNAME: oteryn_acceptance_character_create
      CANARY_CHARACTER_CREATE_DB_PASSWORD: acceptance-ci-character-not-a-secret
      CANARY_RUNTIME_REDIS_CLIENT: phpredis
      CANARY_RUNTIME_REDIS_SCHEME: tcp
      CANARY_RUNTIME_REDIS_HOST: 127.0.0.1
      CANARY_RUNTIME_REDIS_PORT: 6379
      CANARY_RUNTIME_REDIS_DB: 0
      CANARY_RUNTIME_REDIS_USERNAME: oteryn_acceptance_runtime
      CANARY_RUNTIME_REDIS_PASSWORD: acceptance-ci-runtime-not-a-secret
      MARIADB_ROOT_PASSWORD: acceptance-ci-root-not-a-secret

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, redis, gd
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install acceptance system clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client redis-tools

      - name: Install application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install pinned browser harnesses
        run: |
          npm --prefix scripts/acceptance install --no-audit --no-fund
          cd scripts/acceptance
          npx playwright install --with-deps chromium firefox webkit

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Provision isolated production-like dependencies
        run: bash scripts/acceptance/bootstrap-production-like.sh

      - name: Start exact-SHA Laravel HTTP runtime
        run: |
          mkdir -p artifacts/acceptance
          php artisan serve --host=127.0.0.1 --port=8080 >/tmp/oteryn-wiki-reconciliation-server.log 2>&1 &
          echo $! >/tmp/oteryn-wiki-reconciliation-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oteryn-wiki-reconciliation-server.log >&2 || true
          exit 1

      - name: Execute complete zero-retry Wiki reconciliation matrix
        run: |
          cd scripts/acceptance
          npx playwright test --config=playwright.wiki-reconciliation.config.mjs

      - name: Write non-secret Wiki reconciliation evidence
        if: always()
        run: |
          mkdir -p artifacts/acceptance
          cat > artifacts/acceptance/wiki-reconciliation-lifecycle-evidence.json <<JSON
          {
            "exact_tested_sha": "$ACCEPTANCE_SHA",
            "profile": "wiki-reconciliation-lifecycle",
            "projects": ["wiki-reconciliation-chromium-desktop", "wiki-reconciliation-chromium-tablet", "wiki-reconciliation-chromium-mobile", "wiki-reconciliation-firefox-desktop", "wiki-reconciliation-webkit-desktop"],
            "viewports": ["desktop-1440x1000", "tablet-820x1180", "mobile-390x844"],
            "retries": 0,
            "runtime": "real Laravel HTTP",
            "platform_database": "MariaDB 11.8 isolated acceptance schema",
            "proof_boundary": "route-complete public read/search/error/recovery/localization plus exact-MFA-RBAC administrator lifecycle, preview, conflict, revision restore and audit",
            "production_claim": "none"
          }
          JSON

      - name: Upload secret-safe Wiki reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-reconciliation-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance
          if-no-files-found: warn
          retention-days: 7
