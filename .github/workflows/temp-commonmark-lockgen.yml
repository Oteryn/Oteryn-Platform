name: Temporary CommonMark Lock Generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.head_ref == 'fix/issue-767-commonmark-2-9-security'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: fix/issue-767-commonmark-2-9-security
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Generate exact CommonMark security lock
        run: composer update league/commonmark --no-interaction --no-progress

      - name: Validate generated lock and security audit
        run: |
          composer validate --strict
          composer audit --no-interaction
          php -r '$lock=json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if (($package["name"] ?? null) === "league/commonmark") { fwrite(STDOUT, $package["version"].PHP_EOL); exit($package["version"] === "2.9.0" ? 0 : 1); } } exit(2);'

      - name: Commit generated lock only
        run: |
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock did not change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'security(deps): update commonmark lock to 2.9.0'
          git push origin HEAD:fix/issue-767-commonmark-2-9-security
