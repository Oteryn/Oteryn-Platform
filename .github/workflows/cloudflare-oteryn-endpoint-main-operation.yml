name: Cloudflare Oteryn Endpoint Main Operation
run-name: Cloudflare Oteryn Endpoint Main Operation [${{ github.event_name }}]

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-oteryn-endpoint-main-operation.yml
      - tests/operations/cloudflare-oteryn-endpoints/check-main-operation-workflow.py
      - ops/triggers/cloudflare-oteryn-endpoints.md
  push:
    branches:
      - main
    paths:
      - ops/triggers/cloudflare-oteryn-endpoints.md

permissions:
  contents: read

concurrency:
  group: cloudflare-oteryn-endpoint-main-operation-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate trusted-main operation workflow
        run: python3 tests/operations/cloudflare-oteryn-endpoints/check-main-operation-workflow.py

      - name: Validate an endpoint marker request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Fxq 'ops/triggers/cloudflare-oteryn-endpoints.md' <<<"$changed_files"; then
            marker="$(cat ops/triggers/cloudflare-oteryn-endpoints.md)"
            inert_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: inert\nconfirmation:'
            audit_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: audit\nconfirmation:'
            apply_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: apply\nconfirmation: APPLY-OTERYN-CLOUDFLARE'

            if [[ "$marker" == "$inert_marker" ]]; then
              echo 'Validated inert endpoint marker cleanup.'
            elif [[ "$marker" == "$audit_marker" || "$marker" == "$apply_marker" ]]; then
              [[ "$changed_files" == 'ops/triggers/cloudflare-oteryn-endpoints.md' ]] || {
                echo 'An operational audit/apply marker PR may change only the marker file.' >&2
                exit 1
              }
            else
              echo 'Marker content is not an exact allowed request.' >&2
              exit 1
            fi
          fi

  classify:
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.operation.outputs.mode }}
    steps:
      - name: Checkout exact trusted main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Classify exact trusted-main endpoint request
        id: operation
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Endpoint operations are restricted to main.' >&2
            exit 1
          }

          marker="$(cat ops/triggers/cloudflare-oteryn-endpoints.md)"
          inert_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: inert\nconfirmation:'
          audit_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: audit\nconfirmation:'
          apply_marker=$'# Cloudflare Oteryn endpoint trigger\n\nmode: apply\nconfirmation: APPLY-OTERYN-CLOUDFLARE'

          if [[ "$marker" == "$inert_marker" ]]; then
            requested_mode='inert'
          elif [[ "$marker" == "$audit_marker" ]]; then
            requested_mode='audit'
          elif [[ "$marker" == "$apply_marker" ]]; then
            requested_mode='apply'
          else
            echo 'Trusted main contains an invalid endpoint marker.' >&2
            exit 1
          fi
          echo "mode=$requested_mode" >>"$GITHUB_OUTPUT"

  noop:
    needs: classify
    if: needs.classify.outputs.mode == 'inert'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish inert operation result to production issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '91'
        run: |
          set -euo pipefail
          result="$(printf '%s\n' 'operation_status=noop' 'mode=inert' 'mutation=none')"
          body="$(printf '## Cloudflare endpoint trusted-main operation\n\n```text\nrun_id=%s\ntrusted_sha=%s\n%s\n```\n\nOnly bounded endpoint status fields are published.' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$result")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null

  audit:
    needs: classify
    if: needs.classify.outputs.mode == 'audit'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cloudflare
    concurrency:
      group: cloudflare-oteryn-edge-audit-${{ github.run_id }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}

    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run trusted audit operation
        id: operation
        run: |
          set -euo pipefail
          export CLOUDFLARE_APPLY_CONFIRMATION=''
          raw_output="$(mktemp)"
          set +e
          bash scripts/operations/cloudflare-oteryn-endpoints.sh audit >"$raw_output" 2>&1
          exit_code=$?
          set -e

          {
            if [[ "$exit_code" == "0" ]]; then
              echo 'operation_status=success'
            else
              echo 'operation_status=failed'
            fi
            grep -E '^(mode|tunnel_status|tunnel_contract|www_dns|gateway_dns|legacy_gateway_dns|gate_state|edge_version|other_origin_routes|closure_match|mutation)=' "$raw_output" || true
          } >endpoint-result.txt
          echo "exit_code=$exit_code" >>"$GITHUB_OUTPUT"

      - name: Publish sanitized endpoint result
        if: always() && steps.operation.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '91'
        run: |
          set -euo pipefail
          result="$(cat endpoint-result.txt 2>/dev/null || printf 'operation_status=failed')"
          body="$(printf '## Cloudflare endpoint trusted-main operation\n\n```text\nrun_id=%s\ntrusted_sha=%s\n%s\n```\n\nOnly bounded endpoint status fields are published.' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$result")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null

      - name: Propagate operation failure
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1

  guard:
    needs: classify
    if: needs.classify.outputs.mode == 'apply'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Refuse while a gate operation is queued or running
        run: bash scripts/operations/cloudflare-oteryn-endpoints.sh gate-guard

  apply:
    needs: [classify, guard]
    if: needs.classify.outputs.mode == 'apply'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cloudflare
    concurrency:
      group: cloudflare-oteryn-edge-write
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}

    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run trusted apply operation
        id: operation
        run: |
          set -euo pipefail
          export CLOUDFLARE_APPLY_CONFIRMATION='APPLY-OTERYN-CLOUDFLARE'
          raw_output="$(mktemp)"
          set +e
          bash scripts/operations/cloudflare-oteryn-endpoints.sh apply >"$raw_output" 2>&1
          exit_code=$?
          set -e

          {
            if [[ "$exit_code" == "0" ]]; then
              echo 'operation_status=success'
            else
              echo 'operation_status=failed'
            fi
            grep -E '^(mode|tunnel_status|tunnel_contract|www_dns|gateway_dns|legacy_gateway_dns|gate_state|edge_version|other_origin_routes|closure_match|mutation)=' "$raw_output" || true
          } >endpoint-result.txt
          echo "exit_code=$exit_code" >>"$GITHUB_OUTPUT"

      - name: Publish sanitized endpoint result
        if: always() && steps.operation.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '91'
        run: |
          set -euo pipefail
          result="$(cat endpoint-result.txt 2>/dev/null || printf 'operation_status=failed')"
          body="$(printf '## Cloudflare endpoint trusted-main operation\n\n```text\nrun_id=%s\ntrusted_sha=%s\n%s\n```\n\nOnly bounded endpoint status fields are published.' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$result")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null

      - name: Propagate operation failure
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1
