name: Inspect PR230 Final Failures

on:
  pull_request:
    paths:
      - .github/workflows/inspect-pr230-final-failures.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print focused CI and Governance failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_JOB_ID: '89924837738'
          GOVERNANCE_JOB_ID: '89924814474'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${CI_JOB_ID}/logs" > ci.log
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${GOVERNANCE_JOB_ID}/logs" > governance.log
          echo '--- CI final errors ---'
          grep -nE '\[ERROR\]|##\[error\]|Found [0-9]+ error|should return|Cannot cast|offset|type' ci.log | tail -n 80 || true
          echo '--- Governance final errors ---'
          grep -nE 'ERROR:|error:|failed|invalid|missing|required|owned_paths|changed_paths|checkpoint|derived:' governance.log | tail -n 120 || true
