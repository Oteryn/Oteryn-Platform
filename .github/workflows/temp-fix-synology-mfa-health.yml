name: Temporary Synology MFA Health Repair

on:
  push:
    branches:
      - fix/20260907-synology-mfa-health-contract
    paths:
      - .github/workflows/temp-fix-synology-mfa-health.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-mfa-health-contract
          fetch-depth: 0

      - name: Apply bounded repair
        run: |
          set -euo pipefail
          python3 .github/scripts/temp_fix_mfa_health.py
          bash -n deploy/synology/scripts/health-check.sh
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/synology/scripts/health-check.sh tests/ci/test_synology_auto_staging_deploy.py .github/scripts/temp_fix_mfa_health.py
          git commit -m "fix(staging): validate MFA assets semantically"
          git push origin HEAD:fix/20260907-synology-mfa-health-contract
