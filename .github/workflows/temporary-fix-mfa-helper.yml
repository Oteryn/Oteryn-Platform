name: Temporary Fix MFA Helper

on:
  push:
    paths:
      - '.github/workflows/temporary-fix-mfa-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch successful and rejected MFA challenge contracts
        run: |
          python3 <<'PY'
          from pathlib import Path

          helpers = Path('scripts/acceptance/tests/helpers.mjs')
          text = helpers.read_text()
          old = '''export async function completeMfaChallenge(page, code) {
            const challengeHeading = page.getByRole('heading', { name: 'Complete your sign in' });
            await expect(challengeHeading).toBeVisible();
            await page.getByLabel('Authenticator or recovery code').fill(code);
            await page.getByRole('button', { name: 'Verify and sign in' }).click();
            await expect(challengeHeading).toBeHidden();
            await page.waitForLoadState('domcontentloaded');
          }'''
          new = '''export async function completeMfaChallenge(page, code, { expectSuccess = true } = {}) {
            const challengeHeading = page.getByRole('heading', { name: 'Complete your sign in' });
            await expect(challengeHeading).toBeVisible();
            await page.getByLabel('Authenticator or recovery code').fill(code);
            await page.getByRole('button', { name: 'Verify and sign in' }).click();
            if (expectSuccess) {
              await expect(challengeHeading).toBeHidden();
              await page.waitForLoadState('domcontentloaded');
            }
          }'''
          if old not in text:
              raise SystemExit('MFA helper source block not found')
          helpers.write_text(text.replace(old, new))

          spec = Path('scripts/acceptance/tests/mfa-security-acceptance.spec.mjs')
          text = spec.read_text()
          text = text.replace("await completeMfaChallenge(page, 'not-a-code');", "await completeMfaChallenge(page, 'not-a-code', { expectSuccess: false });")
          text = text.replace('await completeMfaChallenge(page, lastTotp);\n  await expect(page.getByRole(\'alert\')).toBeVisible();', 'await completeMfaChallenge(page, lastTotp, { expectSuccess: false });\n  await expect(page.getByRole(\'alert\')).toBeVisible();')
          spec.write_text(text)
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'oteryn-acceptance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temporary-fix-mfa-helper.yml
          git add scripts/acceptance/tests/helpers.mjs scripts/acceptance/tests/mfa-security-acceptance.spec.mjs
          git diff --cached --check
          git commit -m 'test(acceptance): distinguish successful MFA navigation'
          git push origin HEAD:${{ github.ref_name }}
