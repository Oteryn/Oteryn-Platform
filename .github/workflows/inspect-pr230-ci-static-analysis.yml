name: Inspect PR230 CI Static Analysis

on:
  pull_request:
    paths:
      - .github/workflows/inspect-pr230-ci-static-analysis.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print focused PHPStan failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: 89922557069
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > ci.log
          echo '--- focused static-analysis lines ---'
          grep -nEi 'phpstan|static analysis|error|offset|parameter|return type|property|method|variable|array|line [0-9]+' ci.log | tail -n 160 || true
          echo '--- final CI lines ---'
          tail -n 220 ci.log
