name: One-shot Community Task Initialization

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  initialize:
    if: github.head_ref == 'feat/OTERYN-20260729-community-data-completeness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260729-community-data-completeness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile active task indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          active_path = Path('docs/agents/ACTIVE_WORK.md')
          active = active_path.read_text(encoding='utf-8')
          active = active.replace('- None.', '- `OTERYN-20260729-community-data-completeness` — Issue #280 highscore categories/filters, rich privacy-aware profiles, deaths/kill statistics, guild directory/workflow policy and responsive read-only acceptance.', 1)
          active_path.write_text(active, encoding='utf-8')

          state_path = Path('docs/agents/PROJECT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          state = state.replace('## Current active task\n\nNone.', '## Current active task\n\n`OTERYN-20260729-community-data-completeness` in the Issue #280 implementation PR is inventorying the authoritative read-only Canary/community-data contract.')
          state_path.write_text(state, encoding='utf-8')
          PY

      - name: Validate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/checkpoint.py docs/agents/tasks/active/OTERYN-20260729-community-data-completeness.md --require-checkpoint
          python tools/agents/test_checkpoint.py

      - name: Commit initialization and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-community-task-init.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(agents): activate community data completeness task'
          git push origin HEAD:feat/OTERYN-20260729-community-data-completeness
