name: One-shot Support Documentation Reconciliation

on:
  pull_request:
    branches:
      - main
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'feat/OTERYN-20260728-support-moderation-lifecycle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout support branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260728-support-moderation-lifecycle
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile durable support documentation and ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + '\n', encoding='utf-8')

          # Machine product-completeness ledger.
          ledger_path = Path('docs/testing/product-completeness-benchmark.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          capabilities = {entry['id']: entry for entry in ledger['capabilities']}

          updates = {
              'support.tickets': {
                  'rationale': 'Oteryn provides authenticated owner-scoped ticket creation, list/detail, replies, explicit close/reopen states and exact-permission moderator replies/status changes with optimistic locking.',
                  'evidence': [
                      {'file': 'scripts/acceptance/coverage/surfaces/support-moderation-lifecycle.json', 'marker': 'support.moderation-lifecycle', 'level': 'repository_contract'},
                      {'file': 'tests/Feature/Support/SupportModerationLifecycleTest.php', 'marker': 'test_ticket_lifecycle_is_idempotent_owner_scoped_and_conflict_safe', 'level': 'feature_test'},
                      {'file': 'scripts/acceptance/tests/support-moderation-acceptance.spec.mjs', 'marker': '@portal-support-moderation complete user, moderator, notification, privacy, localization and responsive lifecycle', 'level': 'browser_acceptance'},
                  ],
              },
              'support.report-history-limits': {
                  'rationale': 'Authenticated users can submit bounded player, content and guild reports with idempotent request keys, pending limits, owner-only history and public-safe processed outcomes; moderator-private notes remain hidden.',
                  'evidence': [
                      {'file': 'scripts/acceptance/coverage/surfaces/support-moderation-lifecycle.json', 'marker': 'player-content-guild-report', 'level': 'repository_contract'},
                      {'file': 'tests/Feature/Support/SupportModerationLifecycleTest.php', 'marker': 'test_reports_are_bounded_idempotent_private_and_moderated_with_public_safe_outcomes', 'level': 'feature_test'},
                  ],
              },
              'support.enforcement-history': {
                  'rationale': 'Platform-owned warning, restriction and suspension records expose only approved account-visible fields and support acknowledgement, appeal request and moderated appeal outcome without mutating Canary bans.',
