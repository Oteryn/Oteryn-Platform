# recovery + bounded reverse trigger: 2026-08-11T23:56+02:00
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  CLIENT_PATH: /data/client-15.32.df7b29/bin/client

jobs:
  continue:
    name: Recover owned analysis runtime and bound decoded map xrefs
    runs-on: oteryn-staging
    timeout-minutes: 20
    steps:
      - name: Diagnose exact owned analysis runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{printf "%q" .State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} restart_count={{.RestartCount}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }} restart_policy={{.HostConfig.RestartPolicy.Name}}' "$CONTAINER_NAME"
          echo '=== owned mounts ==='
          docker inspect --format '{{range .Mounts}}{{printf "%s\t%s\t%s\n" .Type .Source .Destination}}{{end}}' "$CONTAINER_NAME"
          docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' "$CONTAINER_NAME" | grep -Fx '/volume1/docker/oteryn/tibia-analysis'

      - name: Recover only the owned analysis container when stopped
        shell: bash
        run: |
          set -Eeuo pipefail
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" ]]
          if [[ "$state" != "running" ]]; then docker start "$CONTAINER_NAME" >/dev/null; fi
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            test -x /data/client-15.32.df7b29/bin/client
            [[ "$(stat -c %s /data/client-15.32.df7b29/bin/client)" == "51965216" ]]
            [[ "$(sha256sum /data/client-15.32.df7b29/bin/client | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            command -v objdump
            command -v readelf
            test -x /data/reverse-venv/bin/python
          '

      - name: Map target strings to ELF virtual addresses
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cat > /data/map_target_vas.py <<"PY"
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          path = Path("/data/client-15.32.df7b29/bin/client")
          needles = [
              b"tibia::worldmap::TWorldmapProtocolMessageHandler",
              b"handleFullMapMessage", b"handleFieldDataMessage",
              b"handleLeftColumnMessage", b"handleRightColumnMessage",
              b"handleTopRowMessage", b"handleBottomRowMessage",
              b"handleTopFloorMessage", b"handleBottomFloorMessage",
              b"receivedFullMapMessage", b"receivedFieldDataMessage",
              b"GameserverMessageFullMap", b"GameserverMessageFieldData",
              b"MapFieldData", b"MapArea", b"Coordinate", b"AppearanceInstance",
              b"TProtobufServerMessageTranslator", b"TProtocolMessageQueue",
              b"gameserverMessageAvailable", b"onGameserverMessageAvailable",
              b"TWorldMapStorage",
          ]
          with path.open("rb") as fh:
              elf = ELFFile(fh)
              for sec in elf.iter_sections():
                  if not sec["sh_size"] or sec["sh_type"] == "SHT_NOBITS":
                      continue
                  data = sec.data()
                  sec_addr = sec["sh_addr"]
                  sec_offset = sec["sh_offset"]
                  for needle in needles:
                      start = 0
                      while True:
                          off = data.find(needle, start)
                          if off < 0: break
                          print(f"{sec_addr+off:016x}\t{sec.name}\t{sec_offset+off:08x}\t{needle.decode()}")
                          start = off + 1
          PY
            timeout 90s /data/reverse-venv/bin/python /data/map_target_vas.py | sort -u | tee /data/client-15.32.df7b29/map-target-vas.txt
            test -s /data/client-15.32.df7b29/map-target-vas.txt
          '

      - name: Recover direct RIP xrefs with bounded native objdump
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cut -f1 /data/client-15.32.df7b29/map-target-vas.txt | sed "s/^0*//" | grep . | sort -u > /data/client-15.32.df7b29/map-target-va-regex.txt
            regex="$(paste -sd"|" /data/client-15.32.df7b29/map-target-va-regex.txt)"
            set +e
            timeout 180s bash -c "objdump -d -C /data/client-15.32.df7b29/bin/client | grep -Ei '# [[:space:]]*(${regex})([[:space:]]|$)'" > /data/client-15.32.df7b29/map-direct-xrefs.txt
            rc=$?
            set -e
            [[ "$rc" -eq 0 || "$rc" -eq 1 || "$rc" -eq 124 ]]
            echo "objdump_pipeline_exit=$rc"
            echo '=== direct xrefs ==='
            sed -n '1,240p' /data/client-15.32.df7b29/map-direct-xrefs.txt
            echo '=== direct xref count ==='
            wc -l /data/client-15.32.df7b29/map-direct-xrefs.txt
          '

      - name: Inspect protobuf and descriptor clues without full disassembly
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            timeout 90s strings -a -t x -n 3 /data/client-15.32.df7b29/bin/client > /data/client-15.32.df7b29/strings-all.txt
            echo '=== selected target virtual addresses ==='
            grep -E "TWorldmapProtocolMessageHandler|handleFullMapMessage|handleFieldDataMessage|GameserverMessageFullMap|GameserverMessageFieldData|MapFieldData|MapArea|AppearanceInstance|TProtobufServerMessageTranslator|TWorldMapStorage" /data/client-15.32.df7b29/map-target-vas.txt | head -n 500
            echo '=== protobuf/schema clues ==='
            grep -Ei "GameserverMessage(FullMap|FieldData|LeftColumn|RightColumn|TopRow|BottomRow|TopFloor|BottomFloor)|MapFieldData|MapArea|AppearanceInstance|\.proto|field_data|map_area|appearance_instance|appearance_id|object_id|coordinate|contents|stack_position" /data/client-15.32.df7b29/strings-all.txt | head -n 1800 || true
          '

      - name: Verify canonical staging unchanged and owned runtime healthy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
