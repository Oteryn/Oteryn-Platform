# bounded Worldmap Qt dispatch decode
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Decode Worldmap Qt method dispatch
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            client=/data/client-15.32.df7b29/bin/client
            [[ "$(stat -c %s "$client")" == "51965216" ]]
            [[ "$(sha256sum "$client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
          '

      - name: Decode exact Qt method table and jump table
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" /data/reverse-venv/bin/python - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct, subprocess, re

          root=Path('/data/client-15.32.df7b29')
          client=root/'bin/client'
          raw=client.read_bytes()
          with client.open('rb') as f:
              elf=ELFFile(f)
              secs={s.name:(int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()}

          def va_to_off(va):
              for name,(off,size,sva) in secs.items():
                  if sva <= va < sva+size:
                      return off+(va-sva),name
              raise ValueError(f'VA 0x{va:x} not mapped')
          def u32_off(off): return struct.unpack_from('<I',raw,off)[0]
          def i32_off(off): return struct.unpack_from('<i',raw,off)[0]
          def u32_va(va): return u32_off(va_to_off(va)[0])

          qmeta_va=0x3087800
          string_va=0x1cd8a54
          meta_va=0x1cd8820
          static_metacall=0xdf2a60
          jump_va=0x1d8bd10
          expected_class='tibia::worldmap::TWorldmapProtocolMessageHandler'

          soff,_=va_to_off(string_va)
          moff,_=va_to_off(meta_va)
          joff,_=va_to_off(jump_va)
          hdr=[u32_off(moff+i*4) for i in range(14)]
          revision,class_name_idx,classinfo_count,classinfo_data,method_count,method_data,prop_count,prop_data,enum_count,enum_data,ctor_count,ctor_data,flags,signal_count=hdr

          def qstr(idx):
              entry=soff+idx*8
              rel=u32_off(entry)
              size=u32_off(entry+4)
              if size > 4096 or rel > 65536:
                  return f'<invalid idx={idx} rel={rel} size={size}>'
              return raw[soff+rel:soff+rel+size].decode('utf-8','replace')

          lines=[]
          lines.append('WORLDMAP_QT_METHOD_DISPATCH')
          lines.append(f'qmetaobject_va=0x{qmeta_va:x}')
          lines.append(f'stringdata_va=0x{string_va:x}')
          lines.append(f'metadata_va=0x{meta_va:x}')
          lines.append(f'static_metacall=0x{static_metacall:x}')
          lines.append(f'jump_table_va=0x{jump_va:x}')
          lines.append('metadata_header='+' '.join(str(x) for x in hdr))
          lines.append(f'class_name_index={class_name_idx} class_name={qstr(class_name_idx)!r}')
          lines.append(f'method_count={method_count} method_data={method_data} signal_count={signal_count}')
          if qstr(class_name_idx) != expected_class:
              raise SystemExit(f'class mismatch: {qstr(class_name_idx)!r}')
          if method_count != 14 or signal_count != 1:
              raise SystemExit(f'unexpected method/signal count: {method_count}/{signal_count}')

          methods=[]
          method_base=moff+method_data*4
          for idx in range(method_count):
              row=[u32_off(method_base+(idx*6+k)*4) for k in range(6)]
              name_idx,argc,param_off,tag_idx,mflags,meta_types=row
              name=qstr(name_idx)
              tag=qstr(tag_idx)
              methods.append((idx,name,row))
              lines.append(f'METHOD index={idx} name={name!r} argc={argc} parameters={param_off} tag={tag!r} flags=0x{mflags:x} metatype_offset={meta_types} raw={row}')

          names=[m[1] for m in methods]
          required=['publishGameAction','handleFullMapMessage','handleFieldDataMessage']
          for n in required:
              if n not in names:
                  raise SystemExit(f'missing expected method {n}')
          full_idx=names.index('handleFullMapMessage')
          field_idx=names.index('handleFieldDataMessage')
          lines.append(f'PROVEN_METHOD_INDEX handleFullMapMessage={full_idx}')
          lines.append(f'PROVEN_METHOD_INDEX handleFieldDataMessage={field_idx}')

          targets=[]
          for idx in range(method_count):
              rel=i32_off(joff+idx*4)
              target=(jump_va+rel) & 0xffffffffffffffff
              targets.append(target)
              lines.append(f'JUMP index={idx} method={names[idx]!r} rel={rel:+#x} case_target=0x{target:x}')

          def disasm(start,span=0x120):
              return subprocess.check_output(['objdump','-d','-C',f'--start-address={start}',f'--stop-address={start+span}',str(client)],text=True,errors='replace')

          lines.append('FULLMAP_CASE_DISASSEMBLY')
          lines.extend('  '+x for x in disasm(targets[full_idx],0x180).splitlines())
          lines.append('FIELDDATA_CASE_DISASSEMBLY')
          lines.extend('  '+x for x in disasm(targets[field_idx],0x180).splitlines())

          # Extract direct near call/jmp destinations from bounded case disassembly for follow-up.
          for label,idx in [('FullMap',full_idx),('FieldData',field_idx)]:
              text=disasm(targets[idx],0x180)
              dest=[]
              for line in text.splitlines():
                  m=re.search(r'\b(?:call|jmp)\s+([0-9a-f]+)\b',line)
                  if m:
                      v=int(m.group(1),16)
                      if v not in dest: dest.append(v)
              lines.append(f'{label.upper()}_DIRECT_BRANCH_TARGETS=' + ','.join(f'0x{x:x}' for x in dest[:32]))
              for d in dest[:12]:
                  lines.append(f'{label.upper()}_BRANCH_TARGET 0x{d:x}')
                  lines.extend('  '+x for x in disasm(d,0xc0).splitlines()[:80])

          out=root/'worldmap-method-dispatch.txt'
          out.write_text('\n'.join(lines)+'\n')
          print(out.read_text())
          PY

      - name: Persist Worldmap method dispatch evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/worldmap-method-dispatch.txt" /tmp/worldmap-method-dispatch.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['HANDOVER'])
          e=Path('/tmp/worldmap-method-dispatch.txt').read_text(errors='replace')
          begin='<!-- BEGIN WORLDMAP METHOD DISPATCH -->'
          end='<!-- END WORLDMAP METHOD DISPATCH -->'
          block=f'{begin}\n\n## Worldmap Qt method dispatch evidence\n\nSource: GitHub Actions run `{os.environ.get("GITHUB_RUN_ID","unknown")}` on `oteryn-synology-staging`. Bounded sanitized metadata/disassembly only.\n\n```text\n{e.rstrip()}\n```\n\n{end}'
          text=p.read_text()
          if begin in text and end in text:
              text=text.split(begin,1)[0].rstrip()+'\n\n'+block+'\n\n'+text.split(end,1)[1].lstrip()
          else:
              text=text.rstrip()+'\n\n'+block+'\n'
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if ! git diff --cached --quiet; then
            git commit -m "docs(analysis): decode Worldmap Qt method dispatch"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
