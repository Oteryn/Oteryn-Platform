# bounded reverse trigger: 2026-08-11T23:18+02:00
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  CLIENT_PATH: /data/client-15.32.df7b29/bin/client

jobs:
  continue:
    name: Bound decoded Tibia map xrefs
    runs-on: oteryn-staging
    timeout-minutes: 20
    steps:
      - name: Verify exact owned runtime and executable identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" && "$state" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            test -x /data/client-15.32.df7b29/bin/client
            [[ "$(stat -c %s /data/client-15.32.df7b29/bin/client)" == "51965216" ]]
            [[ "$(sha256sum /data/client-15.32.df7b29/bin/client | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            command -v objdump
            command -v readelf
            test -x /data/reverse-venv/bin/python
          '

      - name: Map target strings to ELF virtual addresses
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cat > /data/map_target_vas.py <<"PY"
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          path = Path("/data/client-15.32.df7b29/bin/client")
          needles = [
              b"tibia::worldmap::TWorldmapProtocolMessageHandler",
              b"handleFullMapMessage", b"handleFieldDataMessage",
              b"handleLeftColumnMessage", b"handleRightColumnMessage",
              b"handleTopRowMessage", b"handleBottomRowMessage",
              b"handleTopFloorMessage", b"handleBottomFloorMessage",
              b"receivedFullMapMessage", b"receivedFieldDataMessage",
              b"GameserverMessageFullMap", b"GameserverMessageFieldData",
              b"MapFieldData", b"MapArea", b"Coordinate", b"AppearanceInstance",
              b"TProtobufServerMessageTranslator", b"TProtocolMessageQueue",
              b"gameserverMessageAvailable", b"onGameserverMessageAvailable",
              b"TWorldMapStorage",
          ]
          with path.open("rb") as fh:
              elf = ELFFile(fh)
              for sec in elf.iter_sections():
                  if not sec["sh_size"] or sec["sh_type"] == "SHT_NOBITS":
                      continue
                  data = sec.data()
                  for needle in needles:
                      start = 0
                      while True:
                          off = data.find(needle, start)
                          if off < 0: break
                          print(f"{sec['sh_addr']+off:016x}\t{sec.name}\t{sec['sh_offset']+off:08x}\t{needle.decode()}")
                          start = off + 1
          PY
            /data/reverse-venv/bin/python /data/map_target_vas.py | sort -u | tee /data/client-15.32.df7b29/map-target-vas.txt
          '

      - name: Recover direct RIP xrefs with native objdump
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cut -f1 /data/client-15.32.df7b29/map-target-vas.txt | sed "s/^0*//" | grep . | sort -u > /data/client-15.32.df7b29/map-target-va-regex.txt
            regex="$(paste -sd"|" /data/client-15.32.df7b29/map-target-va-regex.txt)"
            objdump -d -C /data/client-15.32.df7b29/bin/client | grep -Ei "# [[:space:]]*(${regex})([[:space:]]|$)" | tee /data/client-15.32.df7b29/map-direct-xrefs.txt || true
            echo "=== direct xref count ==="
            wc -l /data/client-15.32.df7b29/map-direct-xrefs.txt
          '

      - name: Inspect bounded code neighborhoods for discovered xrefs
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            sed -n "s/^ *\([0-9a-f][0-9a-f]*\):.*/\1/p" /data/client-15.32.df7b29/map-direct-xrefs.txt | sort -u | head -n 160 > /data/client-15.32.df7b29/map-xref-addresses.txt
            : > /data/client-15.32.df7b29/map-xref-disassembly.txt
            while read -r a; do
              [[ -n "$a" ]] || continue
              start=$((16#$a - 160)); stop=$((16#$a + 320))
              printf "\n=== around 0x%s ===\n" "$a" >> /data/client-15.32.df7b29/map-xref-disassembly.txt
              objdump -d -C --start-address="$start" --stop-address="$stop" /data/client-15.32.df7b29/bin/client >> /data/client-15.32.df7b29/map-xref-disassembly.txt
            done < /data/client-15.32.df7b29/map-xref-addresses.txt
            sed -n "1,6000p" /data/client-15.32.df7b29/map-xref-disassembly.txt
          '

      - name: Inspect protobuf schema clues and analysis runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            strings -a -t x -n 3 /data/client-15.32.df7b29/bin/client > /data/client-15.32.df7b29/strings-all.txt
            echo "=== map protobuf/type neighborhoods ==="
            grep -n -E "GameserverMessage(FullMap|FieldData|LeftColumn|RightColumn|TopRow|BottomRow|TopFloor|BottomFloor)|MapFieldData|MapArea|AppearanceInstance|TWorldmapProtocolMessageHandler|TProtobufServerMessageTranslator|TProtocolMessageQueue" /data/client-15.32.df7b29/strings-all.txt | head -n 700
            echo "=== likely protobuf descriptor/source strings ==="
            grep -Ei "\.proto|field_data|map_area|appearance_instance|appearance_id|object_id|coordinate|contents|objects|things|stack_position" /data/client-15.32.df7b29/strings-all.txt | head -n 1800 || true
            echo "=== owned analysis processes ==="
            ps -eo pid,ppid,stat,etime,args | grep -E "(/data/client-15\.32\.df7b29/bin/client|Tibia|client)" | grep -v grep || true
            echo "=== bounded persistent evidence inventory ==="
            find /data/client-15.32.df7b29 -maxdepth 2 -type f -printf "%p\t%s\n" | sort | head -n 400
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
