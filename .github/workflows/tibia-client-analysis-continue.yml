name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

concurrency:
  group: oteryn-tibia-client-analysis-continue
  cancel-in-progress: false

jobs:
  continue:
    name: Probe exact Tibia manifest request semantics
    runs-on: oteryn-staging
    timeout-minutes: 15
    env:
      CONTAINER_NAME: oteryn-tibia-client-analysis
    steps:
      - name: Verify exact owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" && "$state" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv

      - name: Probe official package and asset manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            mkdir -p /data/direct/probes
            cd /data/direct/probes
            pkg="https://static.tibia.com/launcher/tibiaclient-linux-current/package.json"
            ver="https://static.tibia.com/launcher/tibiaclient-linux-current/package.json.version"
            meta="https://static.tibia.com/launcher/tibiametadata.json"
            assets="https://static.tibia.com/launcher/assets-current/assets.json"
            qtua="Mozilla/5.0"
            rm -f success-package.json success-assets.json
            probe() {
              name="$1"; shift
              url="$1"; shift
              out="$name.body"
              hdr="$name.headers"
              rm -f "$out" "$hdr"
              set +e
              code="$(curl --compressed -sS -L --connect-timeout 15 --max-time 60 -D "$hdr" -o "$out" -w "%{http_code}" "$@" "$url")"
              rc=$?
              set -e
              echo "PROBE name=$name rc=$rc http=$code bytes=$(wc -c < "$out" 2>/dev/null || echo 0)"
              head -n 30 "$hdr" || true
              if [[ "$rc" -eq 0 && "$code" == "200" ]]; then
                if [[ "$url" == "$pkg" ]]; then cp "$out" success-package.json; fi
                if [[ "$url" == "$assets" ]]; then cp "$out" success-assets.json; fi
              fi
            }
            probe pkg-self "$pkg" -e "$pkg"
            probe pkg-version-ref "$pkg" -e "$ver"
            probe pkg-meta-ref "$pkg" -e "$meta"
            probe pkg-self-ua "$pkg" -e "$pkg" -A "$qtua"
            probe pkg-version-ref-ua "$pkg" -e "$ver" -A "$qtua"
            probe pkg-meta-ref-ua "$pkg" -e "$meta" -A "$qtua"
            probe assets-self "$assets" -e "$assets"
            probe assets-meta-ref "$assets" -e "$meta"
            probe assets-self-ua "$assets" -e "$assets" -A "$qtua"
            echo "=== SUCCESS PACKAGE ==="
            if [[ -s success-package.json ]]; then file success-package.json; wc -c success-package.json; head -c 16000 success-package.json; echo; fi
            echo "=== SUCCESS ASSETS ==="
            if [[ -s success-assets.json ]]; then file success-assets.json; wc -c success-assets.json; head -c 16000 success-assets.json; echo; fi
            test -s success-package.json
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
