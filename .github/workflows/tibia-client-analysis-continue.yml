name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

concurrency:
  group: oteryn-tibia-client-analysis-continue
  cancel-in-progress: false

jobs:
  continue:
    name: Continue Tibia analysis package materialization
    runs-on: oteryn-staging
    timeout-minutes: 35
    env:
      CONTAINER_NAME: oteryn-tibia-client-analysis
    steps:
      - name: Verify exact owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" && "$state" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv

      - name: Ensure launcher runtime is complete
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            dpkg --configure -a
            apt-get update
            apt-get -f install -y --no-install-recommends
            apt-get install -y --no-install-recommends \
              libegl1 libfontconfig1 libopengl0 \
              libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
              libxcb-xinerama0 libxcb-xinput0 libxcb-render-util0 \
              libxcb-image0 libxcb-randr0 libxkbcommon-x11-0 libxi6
          '

      - name: Reuse verified official launcher archive
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cd /data/bootstrap
            test -s tibia.x64.tar.gz
            printf "%s  %s\n" "04a87c801d3855f4da1b07e201dff1f79acc8528c57c984131c3a2a88cb60ea7" tibia.x64.tar.gz | sha256sum -c -
            rm -rf Tibia
            tar xfz tibia.x64.tar.gz
            test -x Tibia/Tibia
            missing="$(ldd Tibia/Tibia | grep "not found" || true)"
            [[ -z "$missing" ]]
            qxcb="$(find Tibia -type f -name libqxcb.so -print -quit)"
            test -n "$qxcb"
            qxcb_missing="$(ldd "$qxcb" | grep "not found" || true)"
            [[ -z "$qxcb_missing" ]]
          '

      - name: Stop only stale launcher process and clear launcher locks
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            echo "=== before cleanup ==="
            ps -eo pid,etime,stat,args | grep -E "/data/bootstrap/Tibia/Tibia|(^| )Tibia($| )" | grep -v grep || true
            pids="$(pgrep -f "/data/bootstrap/Tibia/Tibia|(^|/)Tibia$" || true)"
            if [[ -n "$pids" ]]; then
              kill -TERM $pids || true
              for _ in $(seq 1 20); do
                pgrep -f "/data/bootstrap/Tibia/Tibia|(^|/)Tibia$" >/dev/null || break
                sleep 1
              done
              pids2="$(pgrep -f "/data/bootstrap/Tibia/Tibia|(^|/)Tibia$" || true)"
              [[ -z "$pids2" ]] || kill -KILL $pids2 || true
            fi
            find /data/home -maxdepth 6 -type f \( -iname "*lock*" -o -iname "*.pid" \) -print -delete 2>/dev/null || true
            find /data/home -maxdepth 6 -type s -print -delete 2>/dev/null || true
            echo "=== after cleanup ==="
            ps -eo pid,etime,stat,args | grep -E "/data/bootstrap/Tibia/Tibia|(^| )Tibia($| )" | grep -v grep || true
          '

      - name: Run launcher headlessly and materialize package
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          docker exec "$CONTAINER_NAME" bash -lc '
            export LANG=C.UTF-8
            export LC_ALL=C.UTF-8
            export HOME=/data/home
            export XDG_CONFIG_HOME=/data/home/.config
            export XDG_DATA_HOME=/data/home/.local/share
            export XDG_CACHE_HOME=/data/home/.cache
            mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
            cd /data/bootstrap/Tibia
            timeout --signal=TERM --kill-after=15s 600s xvfb-run -a ./Tibia
          '
          rc=$?
          set -e
          echo "launcher_exit=$rc"
          [[ "$rc" -eq 0 || "$rc" -eq 124 || "$rc" -eq 137 || "$rc" -eq 143 ]]

      - name: Identify materialized package and binary candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            echo "=== package metadata ==="
            find /data/home -type f \( -name package.json -o -name launchermetadata.json -o -name tibiametadata.json \) -print 2>/dev/null | tee /data/tibia-package-metadata-paths.txt || true
            echo "=== executable candidates ==="
            : > /data/tibia-client-candidates.txt
            while IFS= read -r -d "" f; do
              size="$(stat -c %s "$f")"
              kind="$(file -b "$f")"
              if [[ "$kind" == *"ELF 64-bit"* ]]; then
                printf "%s\t%s\t%s\n" "$size" "$f" "$kind" | tee -a /data/tibia-client-candidates.txt
              fi
            done < <(find /data/home -type f -size +5M -print0 2>/dev/null)
            echo "=== large files ==="
            find /data/home -type f -size +20M -printf "%s %p\n" 2>/dev/null | sort -nr | head -n 100
            candidate_count="$(wc -l < /data/tibia-client-candidates.txt)"
            echo "client_candidate_count=$candidate_count"
            [[ "$candidate_count" -ge 1 ]]
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
