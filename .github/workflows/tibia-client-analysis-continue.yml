# bounded persistence of already-generated protobuf/Qt reverse evidence
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Persist bounded Tibia reverse evidence
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            root=/data/client-15.32.df7b29
            client="$root/bin/client"
            proto="$root/proto-sections/protodesc_cold.bin"
            [[ "$(stat -c %s "$client")" == "51965216" ]]
            [[ "$(sha256sum "$client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            [[ "$(stat -c %s "$proto")" == "40808" ]]
            [[ "$(sha256sum "$proto" | awk "{print \$1}")" == "1106af5ecbecd85a701b800ec4f697edab4288a4aa64b3fa5781222e6f65c324" ]]
            test -s "$root/protodesc-target-contexts.txt"
            test -f "$root/protodesc-decode-raw.txt"
            test -s "$root/worldmap-meta-code-wide.txt"
          '

      - name: Build compact evidence from successful prior artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('/data/client-15.32.df7b29')
          client = root / 'bin/client'
          proto = root / 'proto-sections/protodesc_cold.bin'
          contexts = root / 'protodesc-target-contexts.txt'
          decode = root / 'protodesc-decode-raw.txt'
          worldmap = root / 'worldmap-meta-code-wide.txt'
          out = root / 'bounded-reverse-evidence.txt'

          lines = [
              'CLIENT_IDENTITY',
              'version=15.32.df7b29',
              f'client_size={client.stat().st_size}',
              f'client_sha256={hashlib.sha256(client.read_bytes()).hexdigest()}',
              f'protodesc_cold_size={proto.stat().st_size}',
              f'protodesc_cold_sha256={hashlib.sha256(proto.read_bytes()).hexdigest()}',
              '',
              'PROTO_TARGET_SUMMARY',
          ]

          context_lines = contexts.read_text(errors='replace').splitlines()
          lines.extend(line for line in context_lines if line.startswith('TARGET '))
          lines.extend(['', 'PROTO_TARGET_CONTEXTS_BOUNDED'])

          keep = False
          count = 0
          emitted = 0
          for line in context_lines:
              if line.startswith('TARGET '):
                  lines.append(line)
                  continue
              if line.startswith('BEGIN '):
                  keep = True
                  count = 0
                  lines.append(line)
                  emitted += 1
                  continue
              if line.startswith('END '):
                  if keep:
                      lines.append(line)
                      emitted += 1
                  keep = False
                  continue
              if keep and count < 18 and emitted < 420:
                  lines.append(line)
                  count += 1
                  emitted += 1

          lines.extend(['', 'WHOLE_PROTO_SECTION_DECODE_RAW_HEAD'])
          lines.extend(decode.read_text(errors='replace').splitlines()[:80])

          lines.extend(['', 'WORLDMAP_META_CONTROL_FLOW'])
          control = re.compile(r'^\s*[0-9a-f]+:.*(?:call|jmp|cmp|lea)')
          selected = []
          for line in worldmap.read_text(errors='replace').splitlines():
              if control.search(line):
                  selected.append(line)
                  if len(selected) >= 700:
                      break
          lines.extend(selected)
          out.write_text('\n'.join(lines) + '\n')
          print(out.read_text())
          PY
          docker exec "$CONTAINER_NAME" test -s /data/client-15.32.df7b29/bounded-reverse-evidence.txt

      - name: Persist sanitized evidence into owned handover
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/bounded-reverse-evidence.txt" /tmp/bounded-reverse-evidence.txt
          python3 - <<'PY'
          from pathlib import Path
          import os

          handover = Path(os.environ['HANDOVER'])
          evidence = Path('/tmp/bounded-reverse-evidence.txt').read_text(errors='replace')
          begin = '<!-- BEGIN GENERATED RUNTIME EVIDENCE -->'
          end = '<!-- END GENERATED RUNTIME EVIDENCE -->'
          block = (
              f"{begin}\n\n"
              "## Generated bounded runtime evidence\n\n"
              f"Source: GitHub Actions run `{os.environ.get('GITHUB_RUN_ID', 'unknown')}` on exact runner "
              "`oteryn-synology-staging`. Evidence is bounded text/assembly metadata from the already-owned "
              "analysis runtime; no Tibia binary or extracted proprietary asset is committed.\n\n"
              f"```text\n{evidence.rstrip()}\n```\n\n{end}"
          )
          text = handover.read_text()
          if begin in text and end in text:
              before = text.split(begin, 1)[0].rstrip()
              after = text.split(end, 1)[1].lstrip()
              text = before + '\n\n' + block + '\n\n' + after
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          handover.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if git diff --cached --quiet; then
            echo "No handover evidence change"
          else
            git commit -m "docs(analysis): persist bounded Tibia reverse evidence"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
