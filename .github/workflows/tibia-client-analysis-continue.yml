# protobuf descriptor recovery trigger: 2026-08-12T00:03+02:00
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  CLIENT_PATH: /data/client-15.32.df7b29/bin/client

jobs:
  continue:
    name: Recover Tibia protobuf descriptor structures
    runs-on: oteryn-staging
    timeout-minutes: 20
    steps:
      - name: Verify exact owned runtime and executable identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" && "$state" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            test -x /data/client-15.32.df7b29/bin/client
            [[ "$(stat -c %s /data/client-15.32.df7b29/bin/client)" == "51965216" ]]
            [[ "$(sha256sum /data/client-15.32.df7b29/bin/client | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            test -x /data/reverse-venv/bin/python
          '

      - name: Inventory and dump protobuf-named ELF sections
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cat > /data/dump_proto_sections.py <<"PY"
          import hashlib, re
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          src = Path("/data/client-15.32.df7b29/bin/client")
          outdir = Path("/data/client-15.32.df7b29/proto-sections")
          outdir.mkdir(exist_ok=True)
          with src.open("rb") as fh:
              elf = ELFFile(fh)
              found = 0
              for sec in elf.iter_sections():
                  if "proto" not in sec.name.lower():
                      continue
                  data = sec.data(); found += 1
                  safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", sec.name)
                  out = outdir / (safe + ".bin")
                  out.write_bytes(data)
                  sec_addr = sec["sh_addr"]
                  sec_offset = sec["sh_offset"]
                  print(f"SECTION name={sec.name} addr=0x{sec_addr:x} offset=0x{sec_offset:x} size={len(data)} sha256={hashlib.sha256(data).hexdigest()} file={out}")
              print(f"proto_section_count={found}")
          PY
            /data/reverse-venv/bin/python /data/dump_proto_sections.py | tee /data/client-15.32.df7b29/proto-section-inventory.txt
          '

      - name: Locate map-message names inside protobuf sections
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cat > /data/proto_section_needles.py <<"PY"
          from pathlib import Path
          needles = [b"GameserverMessageFullMap", b"GameserverMessageFieldData", b"MapFieldData", b"MapArea", b"Coordinate", b"AppearanceInstance", b".proto"]
          for path in sorted(Path("/data/client-15.32.df7b29/proto-sections").glob("*.bin")):
              data = path.read_bytes()
              print(f"FILE {path.name} size={len(data)}")
              for needle in needles:
                  start = 0; hits = []
                  while True:
                      i = data.find(needle, start)
                      if i < 0: break
                      hits.append(i); start = i + 1
                  if hits:
                      print(f"  {needle.decode(errors='replace')} hits=" + ",".join(f"0x{x:x}" for x in hits[:64]))
                      for i in hits[:8]:
                          lo=max(0,i-96); hi=min(len(data),i+len(needle)+160)
                          chunk=data[lo:hi]
                          text="".join(chr(b) if 32 <= b < 127 else "." for b in chunk)
                          print(f"    context@0x{i:x} {text}")
          PY
            /data/reverse-venv/bin/python /data/proto_section_needles.py | tee /data/client-15.32.df7b29/proto-section-needles.txt
          '

      - name: Search whole binary for serialized protobuf descriptor neighborhoods
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cat > /data/proto_binary_context.py <<"PY"
          from pathlib import Path
          data=Path("/data/client-15.32.df7b29/bin/client").read_bytes()
          needles=[b"GameserverMessageFullMap",b"GameserverMessageFieldData",b"MapFieldData",b"MapArea",b"Coordinate",b"AppearanceInstance",b".proto"]
          out=Path("/data/client-15.32.df7b29/proto-binary-context.txt")
          with out.open("w") as f:
              for n in needles:
                  pos=[]; s=0
                  while True:
                      i=data.find(n,s)
                      if i<0: break
                      pos.append(i); s=i+1
                  f.write(f"NEEDLE {n.decode(errors='replace')} count={len(pos)}\n")
                  for i in pos[:32]:
                      lo=max(0,i-160); hi=min(len(data),i+len(n)+320)
                      c=data[lo:hi]
                      txt="".join(chr(b) if 32<=b<127 else "." for b in c)
                      f.write(f"  fileoff=0x{i:x} context={txt}\n")
          print(out.read_text(errors="replace")[:80000])
          PY
            /data/reverse-venv/bin/python /data/proto_binary_context.py
          '

      - name: Attempt raw protobuf decoding of descriptor sections
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            : > /data/client-15.32.df7b29/proto-decode-raw.txt
            shopt -s nullglob
            files=(/data/client-15.32.df7b29/proto-sections/*.bin)
            for f in "${files[@]}"; do
              echo "=== $f ===" >> /data/client-15.32.df7b29/proto-decode-raw.txt
              set +e
              timeout 20s protoc --decode_raw < "$f" >> /data/client-15.32.df7b29/proto-decode-raw.txt 2>&1
              rc=$?
              set -e
              echo "decode_exit=$rc" >> /data/client-15.32.df7b29/proto-decode-raw.txt
            done
            sed -n '1,5000p' /data/client-15.32.df7b29/proto-decode-raw.txt
          '

      - name: Inspect TWorldmap Qt metaobject neighborhood
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            objdump -s --start-address=$((0x1cd8b40)) --stop-address=$((0x1cd9000)) /data/client-15.32.df7b29/bin/client > /data/client-15.32.df7b29/worldmap-meta-rodata.txt
            objdump -d -C --start-address=$((0xdff800)) --stop-address=$((0xe00200)) /data/client-15.32.df7b29/bin/client > /data/client-15.32.df7b29/worldmap-meta-code.txt
            echo '=== worldmap rodata ==='
            sed -n '1,1200p' /data/client-15.32.df7b29/worldmap-meta-rodata.txt
            echo '=== worldmap meta code ==='
            sed -n '1,4000p' /data/client-15.32.df7b29/worldmap-meta-code.txt
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
