name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  continue:
    name: Inspect verified Tibia executable
    runs-on: oteryn-staging
    timeout-minutes: 25
    steps:
      - name: Verify runtime and executable identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cd /data/client-15.32.df7b29/bin
            test -x client
            [[ "$(stat -c %s client)" == "51965216" ]]
            [[ "$(sha256sum client | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
          '
      - name: Install binary inspection tools
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            command -v readelf >/dev/null && command -v objdump >/dev/null && command -v strings >/dev/null || { apt-get update; apt-get install -y --no-install-recommends binutils; }
          '
      - name: Inspect imports strings and protocol clues
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cd /data/client-15.32.df7b29/bin
            file client
            readelf -h client | tee /data/client-15.32.df7b29/elf-header.txt
            readelf -d client | grep NEEDED | tee /data/client-15.32.df7b29/needed.txt || true
            readelf -Ws client | grep -Ei "recv|send|socket|connect|ssl|EVP|AES|chacha|zstd|lzma|protobuf|memcpy|poll|epoll|select" | tee /data/client-15.32.df7b29/network-symbols.txt || true
            strings -a -t x -n 6 client | grep -Ei "mapdescription|map description|tile|creature|appearances|protocol|network|socket|ssl|websocket|packet|message|position|floor|minimap|worldmap|deserialize|serialize|game map|map data" | head -n 3000 | tee /data/client-15.32.df7b29/map-protocol-strings.txt || true
            echo "=== interesting string count ==="
            wc -l /data/client-15.32.df7b29/map-protocol-strings.txt /data/client-15.32.df7b29/network-symbols.txt
          '
      - name: Verify staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
