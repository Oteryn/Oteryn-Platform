name: Tibia Client Analysis Continue

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-continue.yml]

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Decode Worldmap Qt jump table
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            root=/data/client-15.32.df7b29
            [[ "$(stat -c %s "$root/bin/client")" == "51965216" ]]
            [[ "$(sha256sum "$root/bin/client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
          '

      - name: Decode 20-entry Worldmap static-metacall jump table
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" /data/reverse-venv/bin/python - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct, subprocess, re

          root=Path('/data/client-15.32.df7b29')
          client=root/'bin/client'
          table_va=0x1d8ba2c
          count=20

          with client.open('rb') as f:
              elf=ELFFile(f)
              table_off=None
              section_name=None
              for sec in elf.iter_sections():
                  lo=sec['sh_addr']; hi=lo+sec['sh_size']
                  if lo <= table_va < hi:
                      table_off=sec['sh_offset']+(table_va-lo)
                      section_name=sec.name
                      break
              if table_off is None:
                  raise SystemExit('jump table VA not mapped to an ELF section')
              f.seek(table_off)
              data=f.read(count*4)
          if len(data)!=count*4:
              raise SystemExit('short jump table read')

          entries=struct.unpack('<20i',data)
          targets=[(table_va+rel)&0xffffffffffffffff for rel in entries]
          lines=[
              'candidate_worldmap_static_metacall=0xde9ca0',
              f'jump_table_va=0x{table_va:x}',
              f'jump_table_file_offset=0x{table_off:x}',
              f'jump_table_section={section_name}',
              f'entry_count={count}',
              '',
              'METHOD_CASE_TARGETS',
          ]
          for idx,(rel,target) in enumerate(zip(entries,targets)):
              lines.append(f'method_index={idx} rel={rel:+d} rel_hex=0x{rel & 0xffffffff:08x} target=0x{target:x}')

          lines += ['', 'CASE_DISASSEMBLY']
          for idx,target in enumerate(targets):
              start=max(0,target-8); stop=target+0x90
              text=subprocess.check_output(['objdump','-d','-C',f'--start-address={start}',f'--stop-address={stop}',str(client)],text=True,errors='replace')
              lines.append(f'CASE method_index={idx} target=0x{target:x}')
              body=[]
              for line in text.splitlines():
                  m=re.match(r'^\s*([0-9a-f]+):',line)
                  if m and int(m.group(1),16)>=target:
                      body.append(line)
                      if len(body)>=30: break
              lines.extend(body)

          # The Qt string table is adjacent to the already-proven class/method strings.
          raw=client.read_bytes()
          lines += ['', 'WORLDMAP_STRING_NEIGHBORHOOD']
          lo=0x1cd8b80; hi=0x1cd91c0
          p=lo
          while p<hi:
              q=raw.find(b'\x00',p,hi)
              if q<0: break
              if q>p:
                  chunk=raw[p:q]
                  if all(32<=b<127 for b in chunk):
                      s=chunk.decode('ascii','replace')
                      if any(k in s for k in ('Worldmap','worldmap','handle','received','GameserverMessage','MapFieldData','MapArea','AppearanceInstance')):
                          lines.append(f'va_or_fileoff=0x{p:x} text={s}')
              p=q+1

          out=root/'worldmap-jump-table.txt'
          out.write_text('\n'.join(lines)+'\n')
          print(out.read_text())
          PY
          docker exec "$CONTAINER_NAME" test -s /data/client-15.32.df7b29/worldmap-jump-table.txt

      - name: Persist sanitized jump-table evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/worldmap-jump-table.txt" /tmp/worldmap-jump-table.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['HANDOVER'])
          e=Path('/tmp/worldmap-jump-table.txt').read_text(errors='replace')
          begin='<!-- BEGIN GENERATED WORLDMAP JUMP TABLE -->'; end='<!-- END GENERATED WORLDMAP JUMP TABLE -->'
          block=f'{begin}\n\n## Generated Worldmap jump-table evidence\n\nSource: GitHub Actions run `{os.environ.get("GITHUB_RUN_ID","unknown")}` on `oteryn-synology-staging`. Sanitized address/disassembly metadata only.\n\n```text\n{e.rstrip()}\n```\n\n{end}'
          text=p.read_text()
          if begin in text and end in text:
              text=text.split(begin,1)[0].rstrip()+'\n\n'+block+'\n\n'+text.split(end,1)[1].lstrip()
          else:
              text=text.rstrip()+'\n\n'+block+'\n'
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if ! git diff --cached --quiet; then
            git commit -m "docs(analysis): decode Worldmap Qt jump table"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
