name: Tibia Client Analysis Continue

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-continue.yml]

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Disassemble Worldmap static metacall
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            root=/data/client-15.32.df7b29
            [[ "$(stat -c %s "$root/bin/client")" == "51965216" ]]
            [[ "$(sha256sum "$root/bin/client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
          '

      - name: Disassemble candidate Worldmap static metacall and direct targets
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('/data/client-15.32.df7b29'); client=str(root/'bin/client')
          start=0xde9ca0; stop=0xdea500
          text=subprocess.check_output(['objdump','-d','-C',f'--start-address={start}',f'--stop-address={stop}',client],text=True,errors='replace')
          lines=text.splitlines()
          calls=[]; jumps=[]
          for line in lines:
              m=re.match(r'^\s*([0-9a-f]+):.*\bcall\s+([0-9a-f]+)',line)
              if m: calls.append((int(m.group(1),16),int(m.group(2),16),line.strip()))
              m2=re.match(r'^\s*([0-9a-f]+):.*\bjmp\s+\*?([^#]+)',line)
              if m2: jumps.append(line.strip())
          out=[]
          out.append('candidate_worldmap_static_metacall=0xde9ca0')
          out.append(f'direct_call_count={len(calls)}')
          for a,t,l in calls: out.append(f'CALL site=0x{a:x} target=0x{t:x} text={l}')
          out.append('')
          out.append('FULL_DISASSEMBLY')
          out.extend(lines)
          p=root/'worldmap-static-metacall.txt'; p.write_text('\n'.join(out)+'\n'); print(p.read_text())
          PY

      - name: Disassemble each non-PLT direct target briefly
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('/data/client-15.32.df7b29'); client=str(root/'bin/client')
          src=(root/'worldmap-static-metacall.txt').read_text(errors='replace')
          targets=[]
          for m in re.finditer(r'target=0x([0-9a-f]+)',src):
              t=int(m.group(1),16)
              if 0x500000 <= t < 0x1c00000 and t not in targets: targets.append(t)
          lines=[f'target_count={len(targets)}']
          for t in targets[:40]:
              lines.append(f'\nTARGET 0x{t:x}')
              try:
                  d=subprocess.check_output(['objdump','-d','-C',f'--start-address={t}',f'--stop-address={t+0x180}',client],text=True,errors='replace')
              except subprocess.CalledProcessError as e:
                  d=e.output or ''
              lines.extend(d.splitlines()[:120])
          p=root/'worldmap-static-targets.txt'; p.write_text('\n'.join(lines)+'\n'); print(p.read_text())
          PY

      - name: Persist sanitized handler evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/worldmap-static-metacall.txt" /tmp/metacall.txt
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/worldmap-static-targets.txt" /tmp/targets.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['HANDOVER']); a=Path('/tmp/metacall.txt').read_text(errors='replace'); b=Path('/tmp/targets.txt').read_text(errors='replace')
          begin='<!-- BEGIN GENERATED WORLDMAP HANDLER EVIDENCE -->'; end='<!-- END GENERATED WORLDMAP HANDLER EVIDENCE -->'
          block=f'{begin}\n\n## Generated Worldmap handler evidence\n\nSource: GitHub Actions run `{os.environ.get("GITHUB_RUN_ID","unknown")}` on `oteryn-synology-staging`. Sanitized disassembly only.\n\n```text\n{a.rstrip()}\n\n{b.rstrip()}\n```\n\n{end}'
          text=p.read_text()
          if begin in text and end in text: text=text.split(begin,1)[0].rstrip()+'\n\n'+block+'\n\n'+text.split(end,1)[1].lstrip()
          else: text=text.rstrip()+'\n\n'+block+'\n'
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if ! git diff --cached --quiet; then
            git commit -m "docs(analysis): record Worldmap handler disassembly"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
