name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

concurrency:
  group: oteryn-tibia-client-analysis-continue
  cancel-in-progress: false

jobs:
  continue:
    name: Directly materialize Tibia client package
    runs-on: oteryn-staging
    timeout-minutes: 35
    env:
      CONTAINER_NAME: oteryn-tibia-client-analysis
    steps:
      - name: Verify exact owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" && "$state" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv

      - name: Fetch current Tibia client manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            mkdir -p /data/direct
            cd /data/direct
            base="https://static.tibia.com/launcher/tibiaclient-linux-current"
            ref="$base/package.json.version"
            curl --compressed -fLC - -e "$ref" "$ref" -o package.json.version
            echo "=== package.json.version ==="
            cat package.json.version
            echo
            for u in \
              "$base/package.json" \
              "$base/package.json.gz" \
              "$base/$(cat package.json.version)/package.json" \
              "$base/package.json?version=$(cat package.json.version)"; do
              echo "TRY=$u"
              rm -f candidate.tmp
              if curl --compressed -fLC - -e "$u" "$u" -o candidate.tmp; then
                echo "OK=$u"
                file candidate.tmp
                wc -c candidate.tmp
                cp candidate.tmp package.json
                break
              fi
            done
            test -s package.json
            echo "=== package.json head ==="
            head -c 12000 package.json
            echo
          '

      - name: Parse manifest and download all declared client files
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v python3 >/dev/null; then apt-get update && apt-get install -y --no-install-recommends python3; fi
            cd /data/direct
            python3 - <<"PY"
import json, os, pathlib, subprocess, sys
p=pathlib.Path("package.json")
try:
    data=json.loads(p.read_text())
except Exception as e:
    print("MANIFEST_JSON_ERROR",repr(e))
    sys.exit(2)
print("TOP_KEYS", sorted(data.keys()) if isinstance(data,dict) else type(data).__name__)
# recursively collect dicts that look like file entries
entries=[]
def walk(x):
    if isinstance(x,dict):
        low={str(k).lower():v for k,v in x.items()}
        path=low.get("path") or low.get("filename") or low.get("file") or low.get("name")
        url=low.get("url") or low.get("downloadurl") or low.get("download_url")
        sha=low.get("sha256") or low.get("checksum") or low.get("hash")
        size=low.get("size") or low.get("filesize")
        if isinstance(path,str) and (url is not None or sha is not None or size is not None):
            entries.append((path,url,sha,size,x))
        for v in x.values(): walk(v)
    elif isinstance(x,list):
        for v in x: walk(v)
walk(data)
print("FILE_ENTRY_COUNT",len(entries))
for row in entries[:50]:
    print("ENTRY",row[0],row[1],row[2],row[3])
pathlib.Path("manifest-entries.txt").write_text("\n".join(str(r[:4]) for r in entries))
if not entries:
    sys.exit(3)
base="https://static.tibia.com/launcher/tibiaclient-linux-current/"
outroot=pathlib.Path("client")
outroot.mkdir(exist_ok=True)
for path,url,sha,size,_ in entries:
    # refuse traversal and only allow official Tibia CDN when manifest has absolute URL
    rel=path.lstrip("/")
    dest=(outroot/rel).resolve()
    if not str(dest).startswith(str(outroot.resolve())+os.sep):
        raise SystemExit(f"unsafe path {path}")
    dest.parent.mkdir(parents=True,exist_ok=True)
    if isinstance(url,str) and url.startswith("https://static.tibia.com/"):
        src=url
    elif isinstance(url,str) and url.startswith("/"):
        src="https://static.tibia.com"+url
    elif isinstance(url,str) and url:
        src=base+url.lstrip("/")
    else:
        src=base+rel
    print("DOWNLOAD",src,"->",dest)
    subprocess.run(["curl","--compressed","-fLC","-","-e",src,src,"-o",str(dest)],check=True)
print("DOWNLOAD_COMPLETE")
PY
          '

      - name: Identify actual Tibia game executable
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            echo "=== ELF candidates ==="
            : > /data/tibia-client-candidates.txt
            while IFS= read -r -d "" f; do
              kind="$(file -b "$f")"
              if [[ "$kind" == *"ELF 64-bit"* ]]; then
                size="$(stat -c %s "$f")"
                sha="$(sha256sum "$f" | awk "{print \$1}")"
                printf "%s\t%s\t%s\t%s\n" "$size" "$sha" "$f" "$kind" | tee -a /data/tibia-client-candidates.txt
              fi
            done < <(find /data/direct/client -type f -size +1M -print0 2>/dev/null)
            count="$(wc -l < /data/tibia-client-candidates.txt)"
            echo "client_candidate_count=$count"
            test "$count" -ge 1
            echo "=== largest files ==="
            find /data/direct/client -type f -printf "%s %p\n" | sort -nr | head -n 50
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
