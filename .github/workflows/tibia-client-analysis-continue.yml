name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  continue:
    name: Inspect current Tibia package envelope
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
      - name: Inspect bytes and search candidate compressed-stream offsets
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cd /data/client-15.32.df7b29/bin
            [[ "$(sha256sum client.lzma | awk "{print \$1}")" == "496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b" ]]
            echo "=== first 256 bytes ==="
            od -Ax -tx1 -N256 client.lzma
            python3 - <<"PY"
import lzma, pathlib, json
src=pathlib.Path("client.lzma").read_bytes()
print("size",len(src),"prefix64",src[:64].hex())
# Search the first 256 offsets for a raw LZMA1 stream that starts with ELF.
found=[]
for off in range(0,257):
    payload=src[off:]
    for pb in range(5):
      for lp in range(5):
        for lc in range(9):
          if lc+lp>4: continue
          f={"id":lzma.FILTER_LZMA1,"dict_size":1<<20,"lc":lc,"lp":lp,"pb":pb}
          try:
            d=lzma.LZMADecompressor(format=lzma.FORMAT_RAW,filters=[f])
            head=d.decompress(payload,max_length=32)
          except lzma.LZMAError:
            continue
          if head.startswith(b"\x7fELF"):
            rec={"offset":off,"lc":lc,"lp":lp,"pb":pb,"head":head[:16].hex()}
            print("RAW_ELF",rec); found.append(rec)
print("raw_candidate_count",len(found))
# Scan for plausible LZMA-alone headers (property + dictionary + size) in first 4096 bytes.
valid_dict=set()
for n in range(12,32):
    valid_dict.add(1<<n); valid_dict.add((1<<n)+(1<<(n-1)))
headers=[]
for off in range(0,min(4096,len(src)-13)):
    prop=src[off]
    if prop>224: continue
    ds=int.from_bytes(src[off+1:off+5],"little")
    sz=int.from_bytes(src[off+5:off+13],"little")
    if ds in valid_dict and (sz==0xffffffffffffffff or sz==51965216):
        headers.append((off,prop,ds,sz,src[off:off+13].hex()))
print("plausible_headers",headers[:100])
PY
          '
      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
