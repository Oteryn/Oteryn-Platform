# bounded protobuf metadata analysis: 2026-08-12T00:09+02:00
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  continue:
    name: Bound Tibia protobuf metadata and Worldmap dispatch
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            client=/data/client-15.32.df7b29/bin/client
            proto=/data/client-15.32.df7b29/proto-sections/protodesc_cold.bin
            [[ "$(stat -c %s "$client")" == "51965216" ]]
            [[ "$(sha256sum "$client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            [[ "$(stat -c %s "$proto")" == "40808" ]]
            [[ "$(sha256sum "$proto" | awk "{print \$1}")" == "1106af5ecbecd85a701b800ec4f697edab4288a4aa64b3fa5781222e6f65c324" ]]
          '

      - name: Extract exact protodesc strings and target contexts
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            proto=/data/client-15.32.df7b29/proto-sections/protodesc_cold.bin
            strings -a -t x -n 1 "$proto" > /data/client-15.32.df7b29/protodesc-cold-strings-all.txt
            echo "=== all protodesc strings ==="
            sed -n "1,6000p" /data/client-15.32.df7b29/protodesc-cold-strings-all.txt
            echo "=== map-related protodesc strings ==="
            grep -Ei "map|field|coordinate|appearance|full|left|right|top|bottom|floor|position|stack|object|thing|id|x|y|z" /data/client-15.32.df7b29/protodesc-cold-strings-all.txt | sed -n "1,4000p" || true
          '

      - name: Hexdump protodesc neighborhoods around target strings
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cat > /data/proto_target_contexts.py <<"PY"
          from pathlib import Path
          data = Path("/data/client-15.32.df7b29/proto-sections/protodesc_cold.bin").read_bytes()
          needles = [b"GameserverMessageFullMap", b"GameserverMessageFieldData", b"MapFieldData", b"MapArea", b"Coordinate", b"AppearanceInstance"]
          for needle in needles:
              label = needle.decode("ascii")
              pos = []
              start = 0
              while True:
                  i = data.find(needle, start)
                  if i < 0:
                      break
                  pos.append(i)
                  start = i + 1
              print(f"TARGET {label} count={len(pos)} offsets=" + ",".join(f"0x{x:x}" for x in pos))
              for i in pos:
                  lo = max(0, i - 128)
                  hi = min(len(data), i + len(needle) + 256)
                  chunk = data[lo:hi]
                  print(f"BEGIN {label} off=0x{i:x} base=0x{lo:x}")
                  for j in range(0, len(chunk), 16):
                      part = chunk[j:j+16]
                      hx = " ".join(f"{b:02x}" for b in part)
                      asc = "".join(chr(b) if 32 <= b < 127 else "." for b in part)
                      print(f"{lo+j:08x}  {hx:<47}  {asc}")
                  print(f"END {label}")
          PY
            /data/reverse-venv/bin/python /data/proto_target_contexts.py | tee /data/client-15.32.df7b29/protodesc-target-contexts.txt
          '

      - name: Test whether protodesc is raw wire protobuf
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            proto=/data/client-15.32.df7b29/proto-sections/protodesc_cold.bin
            set +e
            timeout 15s protoc --decode_raw < "$proto" > /data/client-15.32.df7b29/protodesc-decode-raw.txt 2>&1
            rc=$?
            set -e
            echo "decode_raw_exit=$rc"
            sed -n "1,2500p" /data/client-15.32.df7b29/protodesc-decode-raw.txt
          '

      - name: Recover Worldmap Qt method metadata and dispatch code
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            client=/data/client-15.32.df7b29/bin/client
            echo "=== Worldmap metadata strings ==="
            strings -a -t x "$client" | awk "\$1 >= \"1cd8b00\" && \$1 <= \"1cd9100\"" | sed -n "1,1000p"
            echo "=== qt_metacall neighborhood ==="
            objdump -d -C --start-address=$((0xdff700)) --stop-address=$((0xe01000)) "$client" | tee /data/client-15.32.df7b29/worldmap-meta-code-wide.txt | sed -n "1,9000p"
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
