# exact Worldmap Qt metaobject scan
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Locate exact Worldmap Qt metaobject
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            root=/data/client-15.32.df7b29
            [[ "$(stat -c %s "$root/bin/client")" == "51965216" ]]
            [[ "$(sha256sum "$root/bin/client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
          '

      - name: Scan Qt6 static metaobjects for Worldmap stringdata
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" /data/reverse-venv/bin/python - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct, re, subprocess

          root=Path('/data/client-15.32.df7b29')
          client=root/'bin/client'
          raw=client.read_bytes()
          wanted=b'tibia::worldmap::TWorldmapProtocolMessageHandler'
          handlers=(b'handleFullMapMessage',b'handleFieldDataMessage')
          with client.open('rb') as f:
              elf=ELFFile(f)
              secs={s.name:(int(s['sh_offset']),int(s['sh_size']),int(s['sh_addr'])) for s in elf.iter_sections()}
          dro=secs['.data.rel.ro']
          ro=secs['.rodata']
          textsec=secs['.text']
          def va_to_off(va):
              for name,(off,size,sva) in secs.items():
                  if sva <= va < sva+size:
                      return off+(va-sva),name
              return None,None
          def q(off):
              return struct.unpack_from('<Q',raw,off)[0] if 0<=off<=len(raw)-8 else 0
          def u32(off):
              return struct.unpack_from('<I',raw,off)[0] if 0<=off<=len(raw)-4 else 0
          def is_text(va):
              return textsec[2] <= va < textsec[2]+textsec[1]
          def is_ro(va):
              return ro[2] <= va < ro[2]+ro[1]

          matches=[]
          for base in range(dro[0],dro[0]+dro[1]-56,8):
              vals=[q(base+i*8) for i in range(7)]
              superdata,strings,data,metacall,related,metatypes,extra=vals
              if not (is_ro(strings) and is_ro(data) and is_text(metacall)):
                  continue
              soff,_=va_to_off(strings)
              doff,_=va_to_off(data)
              if soff is None or doff is None:
                  continue
              hdr=[u32(doff+i*4) for i in range(14)]
              if not (1 <= hdr[0] <= 20 and hdr[4] <= 200 and hdr[5] < 10000):
                  continue
              sample=raw[soff:soff+8192]
              score=0
              if wanted in sample: score+=100
              if handlers[0] in sample: score+=40
              if handlers[1] in sample: score+=40
              if score:
                  bva=dro[2]+(base-dro[0])
                  matches.append((score,bva,base,vals,hdr,soff,doff))

          lines=[f'worldmap_metaobject_matches={len(matches)}']
          for idx,(score,bva,base,vals,hdr,soff,doff) in enumerate(sorted(matches,reverse=True)):
              lines.append(f'MATCH index={idx} score={score} qmetaobject_va=0x{bva:x} file_off=0x{base:x}')
              lines.append(f'  superdata=0x{vals[0]:x} stringdata=0x{vals[1]:x} metadata=0x{vals[2]:x} static_metacall=0x{vals[3]:x} related=0x{vals[4]:x} metatypes=0x{vals[5]:x} extra=0x{vals[6]:x}')
              lines.append('  metadata_header='+' '.join(str(x) for x in hdr))
              lines.append('  STRING_RUNS')
              for m in re.finditer(rb'[ -~]{1,180}\x00',raw[soff:soff+8192]):
                  s=m.group()[:-1]
                  if s:
                      lines.append('    +0x%x %s' % (m.start(),s.decode('ascii','replace')))
              d=subprocess.check_output(['objdump','-d','-C',f'--start-address={vals[3]}',f'--stop-address={vals[3]+0x900}',str(client)],text=True,errors='replace')
              lines.append('  STATIC_METACALL_DISASSEMBLY')
              lines.extend('    '+x for x in d.splitlines()[:650])
              if idx>=2:
                  break
          out=root/'worldmap-exact-qmetaobject.txt'
          out.write_text('\n'.join(lines)+'\n')
          print(out.read_text())
          if not matches:
              raise SystemExit('no Worldmap QMetaObject candidate')
          PY

      - name: Persist exact Worldmap metaobject evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/worldmap-exact-qmetaobject.txt" /tmp/worldmap-exact-qmetaobject.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['HANDOVER'])
          e=Path('/tmp/worldmap-exact-qmetaobject.txt').read_text(errors='replace')
          begin='<!-- BEGIN EXACT WORLDMAP QMETAOBJECT -->'
          end='<!-- END EXACT WORLDMAP QMETAOBJECT -->'
          block=f'{begin}\n\n## Exact Worldmap QMetaObject evidence\n\nSource: GitHub Actions run `{os.environ.get("GITHUB_RUN_ID","unknown")}` on `oteryn-synology-staging`. Sanitized metadata/disassembly only.\n\n```text\n{e.rstrip()}\n```\n\n{end}'
          text=p.read_text()
          if begin in text and end in text:
              text=text.split(begin,1)[0].rstrip()+'\n\n'+block+'\n\n'+text.split(end,1)[1].lstrip()
          else:
              text=text.rstrip()+'\n\n'+block+'\n'
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if ! git diff --cached --quiet; then
            git commit -m "docs(analysis): locate exact Worldmap Qt metaobject"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
