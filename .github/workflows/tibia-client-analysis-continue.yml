name: Tibia Client Analysis Continue

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-continue.yml]

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Resolve Worldmap vtable handler slots
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            root=/data/client-15.32.df7b29
            [[ "$(stat -c %s "$root/bin/client")" == "51965216" ]]
            [[ "$(sha256sum "$root/bin/client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
          '

      - name: Locate candidate vtable by qt_metacall pointer and resolve slots
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" /data/reverse-venv/bin/python - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct, subprocess, re

          root=Path('/data/client-15.32.df7b29')
          client=root/'bin/client'
          raw=client.read_bytes()
          qt_metacall=0xe004d0
          needle=struct.pack('<Q',qt_metacall)

          with client.open('rb') as f:
              elf=ELFFile(f)
              sections=[]
              for sec in elf.iter_sections():
                  sections.append((sec.name,sec['sh_offset'],sec['sh_size'],sec['sh_addr']))

          def off_to_va(off):
              for name,so,ss,va in sections:
                  if so <= off < so+ss:
                      return va+(off-so),name
              return None,None

          hits=[]; p=0
          while True:
              p=raw.find(needle,p)
              if p<0: break
              va,sec=off_to_va(p)
              hits.append((p,va,sec)); p+=1

          lines=[f'qt_metacall_candidate=0x{qt_metacall:x}',f'qword_hits={len(hits)}']
          candidates=[]
          for n,(off,va,sec) in enumerate(hits):
              lines.append(f'HIT index={n} file_off=0x{off:x} va={"0x%x"%va if va is not None else "UNKNOWN"} section={sec}')
              if va is None: continue
              # Candidate address-point is expected a few QObject virtuals before qt_metacall.
              for back_qwords in range(2,9):
                  address_point_va=va-back_qwords*8
                  address_point_off=off-back_qwords*8
                  if address_point_off<0: continue
                  vals=[]
                  for slot in range(0,0x170,8):
                      qoff=address_point_off+slot
                      if qoff+8>len(raw): break
                      vals.append(struct.unpack_from('<Q',raw,qoff)[0])
                  # Strong signal: six target vtable slots used by Worldmap static metacall must be executable-looking pointers.
                  wanted=[0x130,0x138,0x140,0x148,0x150,0x158]
                  resolved={s: vals[s//8] if s//8<len(vals) else 0 for s in wanted}
                  executable=sum(1 for v in resolved.values() if 0x500000 <= v < 0x1c00000)
                  if executable>=5:
                      candidates.append((address_point_va,address_point_off,back_qwords,resolved))

          # De-duplicate candidates by address point.
          uniq=[]; seen=set()
          for c in candidates:
              if c[0] not in seen: seen.add(c[0]); uniq.append(c)
          lines += ['',f'candidate_address_points={len(uniq)}']
          for ci,(ap_va,ap_off,back,resolved) in enumerate(uniq):
              lines.append(f'CANDIDATE index={ci} address_point_va=0x{ap_va:x} file_off=0x{ap_off:x} qt_metacall_slot_index={back}')
              for s,v in resolved.items(): lines.append(f'  vtable_offset=0x{s:x} target=0x{v:x}')
              # dump all nearby function-pointer-looking slots for context
              for s in range(0,0x160,8):
                  v=struct.unpack_from('<Q',raw,ap_off+s)[0]
                  if 0x500000 <= v < 0x1c00000:
                      lines.append(f'  slot=0x{s:x} ptr=0x{v:x}')

          # Disassemble unique six-slot targets from all candidates.
          targets=[]
          for _,_,_,resolved in uniq:
              for v in resolved.values():
                  if 0x500000 <= v < 0x1c00000 and v not in targets: targets.append(v)
          lines += ['',f'handler_slot_target_count={len(targets)}','HANDLER_SLOT_TARGET_DISASSEMBLY']
          for t in targets:
              lines.append(f'TARGET 0x{t:x}')
              d=subprocess.check_output(['objdump','-d','-C',f'--start-address={t}',f'--stop-address={t+0x240}',str(client)],text=True,errors='replace')
              body=[]
              for line in d.splitlines():
                  m=re.match(r'^\s*([0-9a-f]+):',line)
                  if m and int(m.group(1),16)>=t:
                      body.append(line)
                      if len(body)>=90: break
              lines.extend(body)

          # Search every occurrence of known handler/signal names to make method-order evidence explicit.
          lines += ['', 'METHOD_NAME_FILE_OFFSETS']
          names=[
              'handleFullMapMessage','handleLeftColumnMessage','handleRightColumnMessage','handleTopRowMessage','handleBottomRowMessage',
              'handleTopFloorMessage','handleBottomFloorMessage','handleFieldDataMessage','handleCreateOnMapMessage','handleChangeOnMapMessage',
              'handleDeleteOnMapMessage','handleAmbientLightMessage','handleTibiaTimeMessage',
              'receivedFullMapMessage','receivedLeftColumnMessage','receivedRightColumnMessage','receivedTopRowMessage','receivedBottomRowMessage',
              'receivedTopFloorMessage','receivedBottomFloorMessage','receivedFieldDataMessage','receivedCreateOnMapMessage','receivedChangeOnMapMessage',
              'receivedDeleteOnMapMessage','receivedAmbientLightMessage','receivedTibiaTimeMessage'
          ]
          for name in names:
              b=name.encode(); offs=[]; q=0
              while True:
                  q=raw.find(b,q)
                  if q<0: break
                  offs.append(q); q+=1
              lines.append(f'{name}=' + ','.join(f'0x{x:x}' for x in offs))

          out=root/'worldmap-vtable-slots.txt'; out.write_text('\n'.join(lines)+'\n'); print(out.read_text())
          PY
          docker exec "$CONTAINER_NAME" test -s /data/client-15.32.df7b29/worldmap-vtable-slots.txt

      - name: Persist sanitized vtable evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/worldmap-vtable-slots.txt" /tmp/worldmap-vtable-slots.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['HANDOVER']); e=Path('/tmp/worldmap-vtable-slots.txt').read_text(errors='replace')
          begin='<!-- BEGIN GENERATED WORLDMAP VTABLE -->'; end='<!-- END GENERATED WORLDMAP VTABLE -->'
          block=f'{begin}\n\n## Generated Worldmap vtable evidence\n\nSource: GitHub Actions run `{os.environ.get("GITHUB_RUN_ID","unknown")}` on `oteryn-synology-staging`. Sanitized address/disassembly metadata only.\n\n```text\n{e.rstrip()}\n```\n\n{end}'
          text=p.read_text()
          if begin in text and end in text: text=text.split(begin,1)[0].rstrip()+'\n\n'+block+'\n\n'+text.split(end,1)[1].lstrip()
          else: text=text.rstrip()+'\n\n'+block+'\n'
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if ! git diff --cached --quiet; then
            git commit -m "docs(analysis): resolve Worldmap vtable slots"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
