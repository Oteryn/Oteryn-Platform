name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: read

concurrency:
  group: oteryn-tibia-client-analysis-continue
  cancel-in-progress: false

jobs:
  continue:
    name: Materialize current Tibia game executable
    runs-on: oteryn-staging
    timeout-minutes: 25
    env:
      CONTAINER_NAME: oteryn-tibia-client-analysis
    steps:
      - name: Verify exact owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          owner="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")"
          purpose="$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")"
          state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")"
          [[ "$owner" == "oteryn" && "$purpose" == "tibia-client-analysis" && "$state" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv

      - name: Reuse verified current package manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            src=/data/direct/probes/success-package.json
            test -s "$src"
            grep -q '"version": "15.32.df7b29"' "$src"
            grep -q '"url": "bin/client.lzma"' "$src"
            grep -q '"unpackedhash": "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe"' "$src"
            grep -q '"packedhash": "496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b"' "$src"
          '

      - name: Download and verify packed game executable
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            mkdir -p /data/client-15.32.df7b29/bin
            cd /data/client-15.32.df7b29/bin
            url="https://static.tibia.com/launcher/tibiaclient-linux-current/bin/client.lzma"
            rm -f client.lzma.part client.lzma
            curl --compressed -fL --connect-timeout 15 --max-time 600 -e "$url" "$url" -o client.lzma.part
            mv client.lzma.part client.lzma
            actual="$(sha256sum client.lzma | awk "{print \$1}")"
            echo "packed_sha256=$actual"
            [[ "$actual" == "496c5b3517c0996a1bbd0e76a7738d450f79d0bf4fef140a807044776042dc9b" ]]
            size="$(stat -c %s client.lzma)"
            echo "packed_size=$size"
            [[ "$size" -eq 10150849 ]]
          '

      - name: Decompress and verify actual game executable
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            command -v xz >/dev/null || { apt-get update; apt-get install -y --no-install-recommends xz-utils; }
            cd /data/client-15.32.df7b29/bin
            rm -f client
            xz --format=lzma -dc client.lzma > client
            chmod 0755 client
            actual="$(sha256sum client | awk "{print \$1}")"
            echo "unpacked_sha256=$actual"
            [[ "$actual" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            size="$(stat -c %s client)"
            echo "unpacked_size=$size"
            [[ "$size" -eq 51965216 ]]
            file client
            readelf -h client | head -n 40
            echo "=== missing shared libraries ==="
            ldd client | tee /data/client-15.32.df7b29/ldd.txt || true
          '

      - name: Reconnaissance for map and protocol interception points
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            cd /data/client-15.32.df7b29/bin
            echo "=== binary identity ==="
            sha256sum client
            stat -c "path=%n size=%s mode=%a" client
            file client
            echo "=== sections ==="
            readelf -S client | head -n 100
            echo "=== dynamic symbols/strings relevant to networking/map ==="
            strings -a -n 6 client | grep -Ei "mapdescription|map description|tile|creature|appearances|protocol|network|socket|ssl|websocket|packet|message|position|floor|minimap|gameworld|worldmap|deserialize|serialize" | head -n 1000 | tee /data/client-15.32.df7b29/map-protocol-strings.txt || true
            echo "=== imported network/runtime APIs ==="
            readelf -Ws client | grep -Ei "recv|send|socket|connect|ssl|EVP|AES|zstd|lzma|protobuf|memcpy|QNetwork|QDataStream" | head -n 500 | tee /data/client-15.32.df7b29/network-symbols.txt || true
          '

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
