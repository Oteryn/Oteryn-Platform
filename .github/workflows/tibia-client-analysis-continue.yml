# bounded deterministic protobuf descriptor extraction
name: Tibia Client Analysis Continue

on:
  push:
    branches:
      - ops/oteryn-tibia-client-analysis-20260811
    paths:
      - .github/workflows/tibia-client-analysis-continue.yml

permissions:
  contents: write

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis
  HANDOVER: docs/agents/reports/OTERYN-20260811-tibia-client-analysis-handover.md

jobs:
  continue:
    name: Extract Tibia map protobuf schemas
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: ops/oteryn-tibia-client-analysis-20260811
          fetch-depth: 1

      - name: Verify owned runtime and staging snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-before.tsv
          test -s /tmp/oteryn-before.tsv
          docker exec "$CONTAINER_NAME" bash -lc '
            set -Eeuo pipefail
            root=/data/client-15.32.df7b29
            client="$root/bin/client"
            proto="$root/proto-sections/protodesc_cold.bin"
            [[ "$(stat -c %s "$client")" == "51965216" ]]
            [[ "$(sha256sum "$client" | awk "{print \$1}")" == "e6c244bd39fe2e0632f6f000efd3147164696efa8e901718668e0442325ff7fe" ]]
            [[ "$(stat -c %s "$proto")" == "40808" ]]
            [[ "$(sha256sum "$proto" | awk "{print \$1}")" == "1106af5ecbecd85a701b800ec4f697edab4288a4aa64b3fa5781222e6f65c324" ]]
          '

      - name: Extract FileDescriptorProto records and target schemas
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER_NAME" /data/reverse-venv/bin/python - <<'PY'
          from pathlib import Path
          from google.protobuf import descriptor_pb2
          from google.protobuf.message import DecodeError
          import re

          root = Path('/data/client-15.32.df7b29')
          raw = (root / 'proto-sections/protodesc_cold.bin').read_bytes()
          out = root / 'map-protobuf-schemas.txt'

          # A FileDescriptorProto starts with field 1 (name), wire type 2: 0x0a <len> <name.proto>.
          candidates = []
          for i in range(len(raw) - 4):
              if raw[i] != 0x0a:
                  continue
              n = raw[i + 1]
              if n == 0 or n >= 0x80 or i + 2 + n > len(raw):
                  continue
              name_b = raw[i + 2:i + 2 + n]
              if name_b.endswith(b'.proto') and re.fullmatch(rb'[A-Za-z0-9_./-]+\.proto', name_b):
                  candidates.append((i, name_b.decode('ascii')))

          lines = [f'candidate_descriptor_starts={len(candidates)}']
          parsed = []
          for idx, (start, hint) in enumerate(candidates):
              upper = candidates[idx + 1][0] if idx + 1 < len(candidates) else len(raw)
              best = None
              # Descriptor records are followed by a small non-protobuf section record header.
              # Trim at most 192 bytes before the next candidate; this is bounded and deterministic.
              low = max(start + 2 + len(hint), upper - 192)
              for end in range(upper, low - 1, -1):
                  msg = descriptor_pb2.FileDescriptorProto()
                  try:
                      consumed = msg.MergeFromString(raw[start:end])
                  except DecodeError:
                      continue
                  if consumed != end - start or msg.name != hint:
                      continue
                  best = (end, msg)
                  break
              if best is None:
                  lines.append(f'UNPARSED start=0x{start:x} hint={hint} next=0x{upper:x}')
                  continue
              end, msg = best
              parsed.append((start, end, msg))
              lines.append(f'DESCRIPTOR start=0x{start:x} end=0x{end:x} name={msg.name} package={msg.package} messages={len(msg.message_type)} enums={len(msg.enum_type)}')

          targets = {
              'GameserverMessageFullMap', 'GameserverMessageFieldData',
              'GameserverMessageLeftColumn', 'GameserverMessageRightColumn',
              'GameserverMessageTopRow', 'GameserverMessageBottomRow',
              'GameserverMessageTopFloor', 'GameserverMessageBottomFloor',
              'MapFieldData', 'MapArea', 'Coordinate', 'AppearanceInstance',
          }

          def type_name(field):
              if field.type_name:
                  return field.type_name
              names = {
                  1:'double',2:'float',3:'int64',4:'uint64',5:'int32',6:'fixed64',7:'fixed32',
                  8:'bool',9:'string',10:'group',11:'message',12:'bytes',13:'uint32',14:'enum',
                  15:'sfixed32',16:'sfixed64',17:'sint32',18:'sint64'
              }
              return names.get(field.type, f'type{field.type}')

          found = set()
          lines.append('')
          lines.append('TARGET_SCHEMAS')
          for start, end, fd in parsed:
              for msg in fd.message_type:
                  if msg.name not in targets:
                      continue
                  found.add(msg.name)
                  lines.append(f'MESSAGE {fd.package}.{msg.name} source={fd.name} descriptor=0x{start:x}-0x{end:x}')
                  for f in msg.field:
                      label = {1:'optional',2:'required',3:'repeated'}.get(f.label, str(f.label))
                      oneof = msg.oneof_decl[f.oneof_index].name if f.HasField('oneof_index') and f.oneof_index < len(msg.oneof_decl) else '-'
                      lines.append(f'  field={f.number} name={f.name} label={label} type={type_name(f)} oneof={oneof}')
                  for nested in msg.nested_type:
                      lines.append(f'  nested={nested.name} fields={len(nested.field)}')
                      for f in nested.field:
                          label = {1:'optional',2:'required',3:'repeated'}.get(f.label, str(f.label))
                          lines.append(f'    field={f.number} name={f.name} label={label} type={type_name(f)}')

          lines.append('')
          lines.append('TARGET_STATUS')
          for name in sorted(targets):
              lines.append(f'{name}={"FOUND" if name in found else "NOT_FOUND"}')

          # Also list map/protocol descriptors and message names to reveal aliases/naming differences.
          lines.append('')
          lines.append('MAP_RELATED_DESCRIPTOR_INVENTORY')
          for start, end, fd in parsed:
              msg_names = [m.name for m in fd.message_type]
              if any(re.search(r'(map|field|appearance|coordinate|gameserver)', n, re.I) for n in msg_names) or re.search(r'(map|protocol|shared)', fd.name, re.I):
                  lines.append(f'{fd.name} package={fd.package} messages=' + ','.join(msg_names))

          out.write_text('\n'.join(lines) + '\n')
          print(out.read_text())
          PY
          docker exec "$CONTAINER_NAME" test -s /data/client-15.32.df7b29/map-protobuf-schemas.txt

      - name: Persist sanitized schema evidence into handover
        shell: bash
        run: |
          set -Eeuo pipefail
          docker cp "$CONTAINER_NAME:/data/client-15.32.df7b29/map-protobuf-schemas.txt" /tmp/map-protobuf-schemas.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          handover = Path(os.environ['HANDOVER'])
          evidence = Path('/tmp/map-protobuf-schemas.txt').read_text(errors='replace')
          begin = '<!-- BEGIN GENERATED SCHEMA EVIDENCE -->'
          end = '<!-- END GENERATED SCHEMA EVIDENCE -->'
          block = (
              f'{begin}\n\n## Generated protobuf schema evidence\n\n'
              f'Source: GitHub Actions run `{os.environ.get("GITHUB_RUN_ID", "unknown")}` on `oteryn-synology-staging`. '
              'This is sanitized descriptor metadata only.\n\n'
              f'```text\n{evidence.rstrip()}\n```\n\n{end}'
          )
          text = handover.read_text()
          if begin in text and end in text:
              before = text.split(begin, 1)[0].rstrip()
              after = text.split(end, 1)[1].lstrip()
              text = before + '\n\n' + block + '\n\n' + after
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          handover.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HANDOVER"
          if ! git diff --cached --quiet; then
            git commit -m "docs(analysis): record Tibia protobuf schemas"
            git push origin HEAD:ops/oteryn-tibia-client-analysis-20260811
          fi

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort > /tmp/oteryn-after.tsv
          if [[ -f /tmp/oteryn-before.tsv ]]; then diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv; fi
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
