name: Synology Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/synology-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synology-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only Platform Synology diagnostics
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    # Environment secrets reach only jobs bound to their environment; without this the PostgreSQL secret
    # count below would always be 0 and the required service would be refused as unconfigured.
    environment: synology-staging
    timeout-minutes: 10
    env:
      EXPECTED_RUNNER_NAME: oteryn-synology-platform
      EXPECTED_COMPOSE_PROJECT: oteryn-staging
      EXPECTED_STATE_DIR: /var/lib/oteryn-staging-state

    steps:
      - name: Validate replacement route and diagnostic access
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          # Presence only, never printed: PostgreSQL is the Platform database (plan P7), so all five are required.
          PLATFORM_POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_SUPERUSER_PASSWORD }}
          PLATFORM_POSTGRES_OWNER_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_OWNER_PASSWORD }}
          PLATFORM_POSTGRES_APP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_APP_PASSWORD }}
          PLATFORM_POSTGRES_BACKUP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_BACKUP_PASSWORD }}
          PLATFORM_POSTGRES_DUMP_PASSWORD: ${{ secrets.OTERYN_STAGING_PLATFORM_POSTGRES_DUMP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$ACTUAL_RUNNER_OS" = "Linux"
          test "$(id -u)" = "0"
          test "$(id -g)" = "0"
          test -d /runner
          test -d /work
          test -S /var/run/docker.sock
          test -d "$EXPECTED_STATE_DIR"
          test -r "$EXPECTED_STATE_DIR"
          docker version >/dev/null
          docker info >/dev/null

          jq -e '
            .agentName == "oteryn-synology-platform" and
            .gitHubUrl == "https://github.com/Oteryn" and
            (.workFolder == "/work" or .workFolder == "_work")
          ' /runner/.runner >/dev/null

          # MariaDB is retired (plan P7, the cutover retire-mariadb step); PostgreSQL is the Platform database.
          expected='platform gateway marketplace-scheduler postgres'
          for service in $expected; do
            ids="$(docker ps -q \
              --filter "label=com.docker.compose.project=$EXPECTED_COMPOSE_PROJECT" \
              --filter "label=com.docker.compose.service=$service")"
            test -n "$ids"
            test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
            test "$(docker inspect "$ids" --format '{{.State.Running}}')" = "true"
          done

          postgres_id="$(docker ps -q \
            --filter "label=com.docker.compose.project=$EXPECTED_COMPOSE_PROJECT" \
            --filter 'label=com.docker.compose.service=postgres')"
          test "$(docker inspect "$postgres_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')" = "healthy"

          scheduler_id="$(docker ps -q \
            --filter "label=com.docker.compose.project=$EXPECTED_COMPOSE_PROJECT" \
            --filter 'label=com.docker.compose.service=marketplace-scheduler')"
          test "$(docker inspect "$scheduler_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')" = "healthy"

          # PostgreSQL is the Platform database since the P6 cutover (plan P7): its five secrets are required (the
          # same rule deploy.sh and health-check.sh apply), and the one postgres container checked above is
          # running and healthy. A missing or partial secret set fails.
          configured=0
          for name in PLATFORM_POSTGRES_SUPERUSER_PASSWORD PLATFORM_POSTGRES_OWNER_PASSWORD \
            PLATFORM_POSTGRES_APP_PASSWORD PLATFORM_POSTGRES_BACKUP_PASSWORD PLATFORM_POSTGRES_DUMP_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -ne 5 ]]; then
            echo "PostgreSQL is the Platform database but only $configured of its 5 secrets are configured." >&2
            exit 1
          fi

      - name: Collect read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail

          command_token="synology-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::stop-commands::${command_token}"

          echo "## Runner container"
          printf 'UTC time: '
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          printf 'Identity: '
          id
          printf 'Kernel: '
          uname -a
          echo

          echo "## Synology Docker engine"
          docker info --format 'Name: {{.Name}}'
          docker info --format 'Server version: {{.ServerVersion}}'
          docker info --format 'Operating system: {{.OperatingSystem}}'
          docker info --format 'OS type: {{.OSType}}'
          docker info --format 'Architecture: {{.Architecture}}'
          docker info --format 'CPUs: {{.NCPU}}'
          docker info --format 'Memory bytes: {{.MemTotal}}'
          docker info --format 'Storage driver: {{.Driver}}'
          docker info --format 'Docker root dir: {{.DockerRootDir}}'
          echo

          echo "## Containers"
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo

          echo "## Docker disk usage"
          if ! timeout 20 docker system df; then
            echo 'Docker disk usage query timed out; continuing bounded diagnostics'
          fi
          echo

          echo "## Networks"
          docker network ls --format 'table {{.Name}}\t{{.Driver}}\t{{.Scope}}'
          echo

          echo "## Volumes"
          docker volume ls --format 'table {{.Name}}\t{{.Driver}}'
          echo

          echo "## Oteryn state mount filesystem"
          df -h "$EXPECTED_STATE_DIR" || true

          echo "::${command_token}::"

      - name: Publish usage note and sanitized acceptance evidence
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Synology diagnostics

          `PLATFORM_RUNNER_ACCEPTANCE=PASS`

          - runner: `oteryn-synology-platform`
          - route: `platform-runners / oteryn-platform`
          - registration scope: organization `https://github.com/Oteryn`
          - Docker host access: read-only proof passed
          - Platform staging-state: readable
          - trusted staging services: observed running
          - PostgreSQL health: healthy
          - runtime mutation: none
          - environment values exposed: none

          This workflow performs read-only Docker Engine and runner-container queries. It does **not** print container environment variables, Docker inspect payloads, file contents, secrets, or application data. It does not create, stop, restart, remove, prune, or modify Docker resources.

          Review the `Collect read-only diagnostics` step log for the bounded diagnostic output.
          EOF
