name: Tibia Live Session Keepalive

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-live-keepalive.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  keepalive:
    name: Start task-owned Tibia keepalive without relogin
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify active session and start bounded keepalive helper
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          [[ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")" == "running" ]]

          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          client_pid=$(pgrep -x client | head -n1)
          [[ -n "$client_pid" ]]

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$client_pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          echo ACTIVE_LOCAL_SOCKS_COUNT=$local_count
          echo ACTIVE_DIRECT_TCP_COUNT=$direct_count
          (( local_count > 0 ))
          (( direct_count == 0 ))

          # Replace only our own previous keepalive helper, never the game client.
          pidfile=/data/runtime/tibia-analysis-keepalive.pid
          logfile=/data/runtime/tibia-analysis-keepalive.log
          if [[ -f "$pidfile" ]]; then
            old=$(cat "$pidfile" 2>/dev/null || true)
            if [[ "$old" =~ ^[0-9]+$ ]] && kill -0 "$old" 2>/dev/null; then
              cmd=$(tr '\0' ' ' </proc/$old/cmdline 2>/dev/null || true)
              if [[ "$cmd" == *tibia-analysis-keepalive-loop* ]]; then kill "$old" 2>/dev/null || true; fi
            fi
          fi

          cat >/tmp/tibia-analysis-keepalive-loop <<'LOOP'
#!/usr/bin/env bash
set -u
export DISPLAY=:99 HOME=/data/home
log=/data/runtime/tibia-analysis-keepalive.log
for n in $(seq 1 180); do
  client_pid=$(pgrep -x client | head -n1 || true)
  [[ -n "$client_pid" ]] || { echo "$(date -Is) client_missing" >>"$log"; exit 0; }
  best=''; best_area=0
  for w in $(xdotool search --onlyvisible --pid "$client_pid" --name '^Tibia$' 2>/dev/null || true); do
    geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
    width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
    height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
    [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]] || continue
    area=$((width*height))
    if (( area > best_area )); then best=$w; best_area=$area; fi
  done
  if [[ -n "$best" ]]; then
    xdotool key --window "$best" ctrl+Right 2>/dev/null || true
    sleep 0.4
    xdotool key --window "$best" ctrl+Left 2>/dev/null || true
    echo "$(date -Is) turn_keepalive_sent" >>"$log"
  else
    echo "$(date -Is) window_missing" >>"$log"
  fi
  sleep 240
done
LOOP
          chmod 700 /tmp/tibia-analysis-keepalive-loop
          nohup /tmp/tibia-analysis-keepalive-loop >/dev/null 2>&1 </dev/null &
          helper=$!
          echo "$helper" >"$pidfile"
          sleep 1
          kill -0 "$helper"
          echo KEEPALIVE_HELPER_PID=$helper
          echo KEEPALIVE_INTERVAL_SECONDS=240
          echo KEEPALIVE_ACTION=ctrl-right-then-ctrl-left
          echo LIVE_SESSION_KEEPALIVE_STARTED=true
          INNER
