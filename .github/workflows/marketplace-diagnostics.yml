name: Marketplace Diagnostics

on:
  pull_request:
    paths:
      - 'app/Marketplace/**'
      - 'app/Wallet/**'
      - 'app/CanaryIntegration/CanaryCharacterTransfer*'
      - 'database/migrations/*marketplace*'
      - 'database/migrations/*character_bazaar*'
      - 'database/migrations/*wallet*'
      - 'resources/views/marketplace/**'
      - 'resources/views/admin/marketplace/**'
      - 'tests/**/Marketplace/**'
      - 'scripts/acceptance/**marketplace**'
      - '.github/workflows/marketplace-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: oteryn-ci-root-password
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Capture formatter patch
        shell: bash
        run: |
          composer format
          git diff --binary > marketplace-format.patch

      - name: Capture static analysis
        shell: bash
        run: |
          set +e
          composer analyse > marketplace-phpstan.txt 2>&1
          echo $? > marketplace-phpstan.exit
          exit 0

      - name: Capture focused tests
        shell: bash
        env:
          CANARY_CHARACTER_CREATE_INTEGRATION_HOST: 127.0.0.1
          CANARY_CHARACTER_CREATE_INTEGRATION_PORT: 3306
          CANARY_CHARACTER_CREATE_INTEGRATION_ROOT_PASSWORD: oteryn-ci-root-password
        run: |
          set +e
          php artisan test tests/Unit/CanaryIntegration/CanaryCharacterTransferDatabasePrivilegeVerifierTest.php tests/Feature/Marketplace > marketplace-tests.txt 2>&1
          echo $? > marketplace-tests.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-diagnostics-${{ github.sha }}
          path: |
            marketplace-format.patch
            marketplace-phpstan.txt
            marketplace-phpstan.exit
            marketplace-tests.txt
            marketplace-tests.exit
          if-no-files-found: error
          retention-days: 3
