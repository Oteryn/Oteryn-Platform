name: Branch Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/branch-lifecycle.yml"
      - "docs/agents/BRANCH_LIFECYCLE_POLICY.json"
      - "docs/agents/BRANCH_DELETION_APPROVAL.json"
      - "docs/agents/tasks/active/OTERYN-20260806-branch-lifecycle-implementation.md"
      - "tools/agents/branch_lifecycle.py"
      - "tools/agents/test_branch_lifecycle.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/branch-lifecycle.yml"
      - "docs/agents/BRANCH_LIFECYCLE_POLICY.json"
      - "docs/agents/BRANCH_DELETION_APPROVAL.json"
      - "tools/agents/branch_lifecycle.py"
      - "tools/agents/test_branch_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: branch-lifecycle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run focused classifier tests
        run: python3 tools/agents/test_branch_lifecycle.py

      - name: Validate retention policy
        run: python3 tools/agents/branch_lifecycle.py --mode validate-policy

  inventory:
    name: live-dry-run
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build fail-closed live inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/agents/branch_lifecycle.py \
            --mode inventory \
            --output branch-lifecycle-report.json \
            --generate-manifest branch-deletion-manifest.generated.json

      - name: Verify protected default branch classification
        run: |
          python3 - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("branch-lifecycle-report.json").read_text())
          if report.get("default_branch") != "main":
              raise SystemExit(f"unexpected default branch: {report.get('default_branch')!r}")
          entries = {item["branch"]: item for item in report.get("branches", [])}
          main = entries.get("main")
          if not main or main.get("classification") != "PROTECTED" or main.get("protected") is not True:
              raise SystemExit(f"default branch is not fail-closed PROTECTED: {main!r}")
          if main.get("deletion_candidate") is not False:
              raise SystemExit("default branch must never be a deletion candidate")
          print("Protected default branch classification verified.")
          PY

      - name: Validate reviewed candidate-set approval
        if: hashFiles('docs/agents/BRANCH_DELETION_APPROVAL.json') != ''
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          def canonical(value):
              return json.dumps(value, indent=2, sort_keys=True, ensure_ascii=False) + "\n"
          approval_path = pathlib.Path("docs/agents/BRANCH_DELETION_APPROVAL.json")
          manifest_path = pathlib.Path("branch-deletion-manifest.generated.json")
          approval_raw = approval_path.read_text(encoding="utf-8")
          approval = json.loads(approval_raw)
          if approval_raw != canonical(approval):
              raise SystemExit("approval JSON is not canonical")
          expected_fields = {
              "schema_version", "issue", "apply_on_main", "confirmation",
              "candidate_count", "entries_sha256", "policy_sha256",
              "source_artifact", "reviewed_at", "reviewed_by", "review_summary",
          }
          if set(approval) != expected_fields:
              raise SystemExit(f"approval schema drift: {sorted(set(approval) ^ expected_fields)}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          entries_hash = hashlib.sha256(canonical(manifest["entries"]).encode()).hexdigest()
          if approval["schema_version"] != 1 or approval["issue"] != 658:
              raise SystemExit("approval identity mismatch")
          if approval["confirmation"] != "DELETE_REVIEWED_TERMINAL_MERGED_BRANCHES_ISSUE_658":
              raise SystemExit("approval confirmation mismatch")
          if approval["candidate_count"] != len(manifest["entries"]):
              raise SystemExit("candidate count drift")
          if approval["entries_sha256"] != entries_hash:
              raise SystemExit("candidate entries drift")
          if approval["policy_sha256"] != manifest["policy_sha256"]:
              raise SystemExit("policy hash drift")
          pathlib.Path("branch-lifecycle-approval-validation.json").write_text(
              canonical({
                  "apply_on_main": approval["apply_on_main"],
                  "candidate_count": len(manifest["entries"]),
                  "entries_sha256": entries_hash,
                  "issue": 658,
                  "result": "PASS",
              }),
              encoding="utf-8",
          )
          print(f"Validated reviewed candidate set: {len(manifest['entries'])} branches")
          PY

      - name: Publish dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-lifecycle-dry-run-${{ github.run_id }}
          path: |
            branch-lifecycle-report.json
            branch-deletion-manifest.generated.json
            branch-lifecycle-approval-validation.json
          if-no-files-found: error
          retention-days: 30

  apply:
    name: apply-reviewed-manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Detect reviewed candidate approval
        id: approval
        shell: bash
        run: |
          if [[ -f docs/agents/BRANCH_DELETION_APPROVAL.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No reviewed candidate approval is present; apply is NOT_APPLICABLE."
          fi

      - name: Rebuild live manifest and materialize apply manifest
        if: steps.approval.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/agents/branch_lifecycle.py \
            --mode inventory \
            --output branch-lifecycle-apply-report.json \
            --generate-manifest branch-deletion-manifest.runtime.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          def canonical(value):
              return json.dumps(value, indent=2, sort_keys=True, ensure_ascii=False) + "\n"
          approval = json.loads(pathlib.Path("docs/agents/BRANCH_DELETION_APPROVAL.json").read_text())
          report = json.loads(pathlib.Path("branch-lifecycle-apply-report.json").read_text())
          entries = {item["branch"]: item for item in report.get("branches", [])}
          main = entries.get("main")
          if report.get("default_branch") != "main" or not main:
              raise SystemExit("default branch is absent from live apply inventory")
          if main.get("classification") != "PROTECTED" or main.get("protected") is not True:
              raise SystemExit(f"default branch is not protected before apply: {main!r}")
          if main.get("deletion_candidate") is not False:
              raise SystemExit("default branch became a deletion candidate")
          manifest_path = pathlib.Path("branch-deletion-manifest.runtime.json")
          manifest = json.loads(manifest_path.read_text())
          entries_hash = hashlib.sha256(canonical(manifest["entries"]).encode()).hexdigest()
          if approval["apply_on_main"] is not True:
              raise SystemExit("reviewed approval is not activated for protected main")
          if approval["candidate_count"] != len(manifest["entries"]):
              raise SystemExit("candidate count drift before apply")
          if approval["entries_sha256"] != entries_hash:
              raise SystemExit("candidate entries drift before apply")
          if approval["policy_sha256"] != manifest["policy_sha256"]:
              raise SystemExit("policy drift before apply")
          manifest["apply_on_main"] = True
          manifest_path.write_text(canonical(manifest), encoding="utf-8")
          PY

      - name: Apply exact reviewed live manifest
        if: steps.approval.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/agents/branch_lifecycle.py \
            --mode apply \
            --event-name push \
            --ref-name main \
            --manifest branch-deletion-manifest.runtime.json \
            --output branch-lifecycle-apply-report.json \
            --evidence branch-deletion-evidence.json \
            --recovery-evidence branch-recovery-test-evidence.json

      - name: Publish apply and recovery evidence
        if: always() && steps.approval.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-lifecycle-apply-${{ github.run_id }}
          path: |
            branch-lifecycle-apply-report.json
            branch-deletion-manifest.runtime.json
            branch-deletion-evidence.json
            branch-recovery-test-evidence.json
          if-no-files-found: warn
          retention-days: 90
