name: Native Producer Test Diagnostic

on:
  push:
    branches:
      - feat/OTERYN-20260804-native-protocol-producer

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite, pcntl, redis
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Stop on first full-suite error
        shell: bash
        run: |
          set +e
          php artisan config:clear --ansi
          vendor/bin/phpunit \
            --colors=never \
            --display-errors \
            --stop-on-error \
            --debug 2>&1 | tee /tmp/native-producer-error.log
          status=${PIPESTATUS[0]}
          tail -n 220 /tmp/native-producer-error.log | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error::$line"
          done
          exit "$status"
