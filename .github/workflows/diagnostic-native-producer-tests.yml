name: Native Producer Test Diagnostic

on:
  push:
    branches:
      - feat/OTERYN-20260804-native-protocol-producer

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite, pcntl, redis
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests and expose failure tail
        shell: bash
        run: |
          set +e
          composer test 2>&1 | tee /tmp/native-producer-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/native-producer-test.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done
          fi
          exit "$status"
