name: Portal Ledger Promotion

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/portal-ledger-promotion.yml'

permissions:
  contents: write

concurrency:
  group: portal-ledger-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote passing portal evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Promote exact accepted records
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('scripts/acceptance/coverage/portal-coverage-manifest.json')
          data = json.loads(manifest_path.read_text())
          records = {surface['id']: surface for surface in data['surfaces']}
          expected = {
              'support-legal.public-admin-localization': 'planned',
              'wiki.public': 'partial',
              'wiki.admin-editorial-lifecycle': 'partial',
              'editorial-media.admin': 'planned',
          }
          for surface_id, status in expected.items():
              if records[surface_id]['status'] != status:
                  raise SystemExit(f'{surface_id}: expected {status}, found {records[surface_id]["status"]}')

          def cover(surface_id, evidence):
              record = records[surface_id]
              record['status'] = 'covered'
              record['evidence'] = evidence
              record['gaps'] = []

          cover('support-legal.public-admin-localization', [
              {'file': 'tests/Feature/Support/EditorialSupportLegalTest.php', 'markers': []},
              {'file': 'scripts/acceptance/tests/support-legal-acceptance.spec.mjs', 'markers': [
                  '@portal-support-legal-public route-complete missing, unpublished, published, legal-version, approved-link and EN/PL isolation states',
                  '@portal-support-legal-admin guest, MFA and exact permission boundaries fail closed',
                  '@portal-support-legal-admin administrator validation, legal publication, Polish translation and bounded audit lifecycle',
              ]},
          ])
          cover('wiki.public', [
              {'file': 'tests/Feature/Wiki/PublicWikiReadTest.php', 'markers': ['final class PublicWikiReadTest']},
              {'file': 'tests/Feature/Wiki/PublicWikiSearchTest.php', 'markers': ['final class PublicWikiSearchTest']},
              {'file': 'scripts/acceptance/tests/wiki-reconciliation-acceptance.spec.mjs', 'markers': [
                  '@portal-wiki-public route-complete empty, read, search, invalid, not-found, unavailable, recovery and EN/PL states',
              ]},
          ])
          cover('wiki.admin-editorial-lifecycle', [
              {'file': 'tests/Feature/Wiki/AdminWikiAdministrationTest.php', 'markers': ['final class AdminWikiAdministrationTest']},
              {'file': 'scripts/acceptance/tests/wiki-reconciliation-acceptance.spec.mjs', 'markers': [
                  '@portal-wiki-admin guest, MFA and exact Wiki permission boundaries fail closed',
                  '@portal-wiki-admin complete validation, draft, signed-preview, conflict, review, publish, unpublish, revision-restore, archive and audit lifecycle',
              ]},
          ])
          cover('editorial-media.admin', [
              {'file': 'tests/Feature/EditorialMedia/AdminEditorialMediaUploadTest.php', 'markers': ['final class AdminEditorialMediaUploadTest']},
              {'file': 'tests/Feature/EditorialMedia/AdminEditorialMediaAuthorizationTest.php', 'markers': ['final class AdminEditorialMediaAuthorizationTest']},
              {'file': 'scripts/acceptance/tests/editorial-media-acceptance.spec.mjs', 'markers': [
                  '@portal-editorial-media guest, MFA and exact permission boundaries fail closed',
                  '@portal-editorial-media manager validates, uploads, privately previews, protects references, deletes and audits',
              ]},
          ])
          for item in records['browser-supporting-media-preview-endpoints']['evidence']:
              if item['file'] == 'scripts/acceptance/tests/admin-wiki-editorial-media.spec.mjs':
                  item['markers'] = ['@wiki-media exact Wiki editor discovers inserts previews and publishes private EditorialMedia responsively']

          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          matrix_path = Path('docs/testing/PORTAL_ACCEPTANCE_COVERAGE_MATRIX.md')
          matrix = matrix_path.read_text()
          matrix = matrix.replace(
              '| Complete Announcements lifecycle | `npx playwright test --config=playwright.announcements.config.mjs` from `scripts/acceptance` | Executes public active-window/localization states and exact MFA/RBAC administrator create, publish, translation, stale recovery, conflict and audit lifecycle on Chromium D/T/M plus public Firefox/WebKit with zero retries | Required by `Announcements Acceptance` |',
              '| Complete Announcements lifecycle | `npx playwright test --config=playwright.announcements.config.mjs` from `scripts/acceptance` | Executes public active-window/localization states and exact MFA/RBAC administrator create, publish, translation, stale recovery, conflict and audit lifecycle on Chromium D/T/M plus public Firefox/WebKit with zero retries | Required by `Announcements Acceptance` |\n'
              '| Complete Support/Legal lifecycle | `npx playwright test --config=playwright.support-legal.config.mjs` from `scripts/acceptance` | Executes all typed public routes, EN/PL isolation, legal versions, approved links and exact MFA/RBAC administrator translation/audit lifecycle with zero retries | Required by `Support Legal Acceptance` |\n'
              '| Complete Editorial Media lifecycle | `npx playwright test --config=playwright.editorial-media.config.mjs` from `scripts/acceptance` | Executes exact MFA/RBAC, malformed and safe upload, private content, integrity display, reference lock, deletion and bounded audit on Chromium D/T/M with zero retries | Required by `Editorial Media Acceptance` |\n'
              '| Complete Wiki reconciliation lifecycle | `npx playwright test --config=playwright.wiki-reconciliation.config.mjs` from `scripts/acceptance` | Executes public route/search/error/recovery/localization and administrator validation, preview, conflict, publish/unpublish, revision restore, archive and audit on the required browser/viewport matrix with zero retries | Required by `Wiki Reconciliation Acceptance` |'
          )
          replacements = {
              '| Support and legal | `planned` | every typed route, published/missing/unpublished, legal version, approved links, admin and PL translation; D/T/M | Add route-complete Playwright lifecycle |': '| Support and legal | `covered` | every typed route, published/missing/unpublished, legal version, approved links, admin and PL translation; D/T/M; bounded public Firefox/WebKit | None in current contract |',
              '| Public Wiki | `partial` | home/category/article/search/error/unavailable/EN/PL; D/T/M; Chromium/Firefox/WebKit | Reconcile every required state and stable evidence marker |': '| Public Wiki | `covered` | home/category/article/search/error/unavailable/recovery/EN/PL; D/T/M; Chromium/Firefox/WebKit | None in current contract |',
              '| Wiki administration | `partial` | draft/review/publish/unpublish/archive/revision restore/conflict/permissions/preview; D/T/M | Reconcile route/role/state completeness and markers |': '| Wiki administration | `covered` | draft/review/publish/unpublish/archive/revision restore/conflict/permissions/preview/audit; D/T/M; Chromium/Firefox/WebKit | None in current contract |',
              '| Editorial Media administration | `planned` | upload validation/integrity, library, content/thumbnail, delete/reference lock, denial; D/T/M | Add secret-safe browser lifecycle |': '| Editorial Media administration | `covered` | upload validation/integrity, private library/content/thumbnail, delete/reference lock, denial and audit; D/T/M | None in current contract |',
              '| Strict delivered-surface closure | `npm --prefix scripts/acceptance run test:coverage-contract:strict` | Fails while any delivered required surface is `partial` or `planned` | Activation only after the programme closes all recorded gaps |': '| Strict delivered-surface closure | `npm --prefix scripts/acceptance run test:coverage-contract:strict` | Fails while any delivered required surface is `partial` or `planned` | Required by `Portal Acceptance Contract` |',
          }
          for old, new in replacements.items():
              if old not in matrix:
                  raise SystemExit(f'Matrix marker missing: {old}')
              matrix = matrix.replace(old, new)
          matrix_path.write_text(matrix)
          PY

      - name: Commit promoted manifest and matrix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/acceptance/coverage/portal-coverage-manifest.json docs/testing/PORTAL_ACCEPTANCE_COVERAGE_MATRIX.md
          git commit -m 'test(acceptance): promote final portal ledger records'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
