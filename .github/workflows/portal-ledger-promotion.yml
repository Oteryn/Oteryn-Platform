name: Portal Ledger Promotion

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/portal-ledger-promotion.yml'

permissions:
  contents: write

concurrency:
  group: portal-ledger-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote passing portal evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Promote exact evidence records and strict gate
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('scripts/acceptance/coverage/portal-coverage-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          records = {record['id']: record for record in manifest['surfaces']}

          expected = {
              'support-legal.public-admin-localization': 'planned',
              'wiki.public': 'partial',
              'wiki.admin-editorial-lifecycle': 'partial',
              'editorial-media.admin': 'planned',
          }
          for record_id, status in expected.items():
              actual = records[record_id]['status']
              if actual != status:
                  raise SystemExit(f'{record_id}: expected {status}, found {actual}')

          support = records['support-legal.public-admin-localization']
          support['status'] = 'covered'
          support['roles'] = ['guest', 'authenticated-no-mfa', 'mfa-confirmed-no-permission', 'support-content-manager']
          support['states'] = [
              'published', 'unpublished', 'missing', 'legal-version', 'approved-links',
              'validation', 'permission-denied', 'localized-en', 'localized-pl', 'audit-visible',
          ]
          support['browsers'] = [
              'support-legal-chromium-desktop',
              'support-legal-chromium-tablet',
              'support-legal-chromium-mobile',
              'support-legal-firefox-desktop',
              'support-legal-webkit-desktop',
          ]
          support['evidence'].append({
              'file': 'scripts/acceptance/tests/support-legal-acceptance.spec.mjs',
              'markers': [
                  '@portal-support-legal-public route-complete missing, unpublished, published, legal-version, approved-link and EN/PL isolation states',
                  '@portal-support-legal-admin guest, MFA and exact permission boundaries fail closed',
                  '@portal-support-legal-admin administrator validation, legal publication, Polish translation and bounded audit lifecycle',
              ],
          })
          support['gaps'] = []

          public_wiki = records['wiki.public']
          public_wiki['status'] = 'covered'
          public_wiki['states'] = [
              'home', 'empty-home', 'category', 'article', 'search-results', 'empty-search',
              'invalid-search', 'not-found', 'unavailable', 'recovery', 'localized-en', 'localized-pl',
          ]
          public_wiki['browsers'] = [
              'wiki-reconciliation-chromium-desktop',
              'wiki-reconciliation-chromium-tablet',
              'wiki-reconciliation-chromium-mobile',
              'wiki-reconciliation-firefox-desktop',
              'wiki-reconciliation-webkit-desktop',
          ]
          public_wiki['evidence'] = [
              {
                  'file': 'scripts/acceptance/tests/public-wiki-read-search.spec.mjs',
                  'markers': [
                      '@wiki published bilingual reads search table of contents and keyboard flow remain portable and responsive',
                  ],
              },
              {
                  'file': 'scripts/acceptance/tests/wiki-reconciliation-acceptance.spec.mjs',
                  'markers': [
                      '@portal-wiki-public route-complete empty, read, search, invalid, not-found, unavailable, recovery and EN/PL states',
                  ],
              },
          ]
          public_wiki['gaps'] = []

          admin_wiki = records['wiki.admin-editorial-lifecycle']
          admin_wiki['status'] = 'covered'
          admin_wiki['states'] = [
              'draft', 'review', 'published', 'unpublished', 'archived', 'revision-restore',
              'stale-conflict', 'validation', 'permission-denied', 'signed-preview', 'audit-visible',
          ]
          admin_wiki['browsers'] = [
              'wiki-reconciliation-chromium-desktop',
              'wiki-reconciliation-chromium-tablet',
              'wiki-reconciliation-chromium-mobile',
              'wiki-reconciliation-firefox-desktop',
              'wiki-reconciliation-webkit-desktop',
          ]
          admin_wiki['evidence'] = [
              {
                  'file': 'scripts/acceptance/tests/admin-wiki-administration.spec.mjs',
                  'markers': [
                      '@wiki trusted editor creates bilingual content previews safely and publishes',
                  ],
              },
              {
                  'file': 'scripts/acceptance/tests/wiki-reconciliation-acceptance.spec.mjs',
                  'markers': [
                      '@portal-wiki-admin guest, MFA and exact Wiki permission boundaries fail closed',
                      '@portal-wiki-admin complete validation, draft, signed-preview, conflict, review, publish, unpublish, revision-restore, archive and audit lifecycle',
                  ],
              },
          ]
          admin_wiki['gaps'] = []

          media = records['editorial-media.admin']
          media['status'] = 'covered'
          media['roles'] = ['guest', 'authenticated-no-mfa', 'mfa-confirmed-no-permission', 'media-manager']
          media['states'] = [
              'empty', 'upload-success', 'validation-rejection', 'integrity-rejection',
              'private-content', 'private-thumbnail', 'delete', 'delete-blocked-by-reference',
              'permission-denied', 'audit-visible',
          ]
          media['browsers'] = [
              'editorial-media-chromium-desktop',
              'editorial-media-chromium-tablet',
              'editorial-media-chromium-mobile',
          ]
          for layer in ['responsive', 'accessibility', 'audit']:
              if layer not in media['evidence_layers']:
                  media['evidence_layers'].append(layer)
          media['evidence'].append({
              'file': 'scripts/acceptance/tests/editorial-media-acceptance.spec.mjs',
              'markers': [
                  '@portal-editorial-media guest, MFA and exact permission boundaries fail closed',
                  '@portal-editorial-media manager validates, uploads, privately previews, protects references, deletes and audits',
              ],
          })
          media['gaps'] = []

          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          matrix_path = Path('docs/testing/PORTAL_ACCEPTANCE_COVERAGE_MATRIX.md')
          matrix = matrix_path.read_text()
          matrix = matrix.replace(
              '| Complete Announcements lifecycle | `npx playwright test --config=playwright.announcements.config.mjs` from `scripts/acceptance` | Executes public active-window/localization states and exact MFA/RBAC administrator create, publish, translation, stale recovery, conflict and audit lifecycle on Chromium D/T/M plus public Firefox/WebKit with zero retries | Required by `Announcements Acceptance` |\n| Strict delivered-surface closure | `npm --prefix scripts/acceptance run test:coverage-contract:strict` | Fails while any delivered required surface is `partial` or `planned` | Activation only after the programme closes all recorded gaps |',
              '| Complete Announcements lifecycle | `npx playwright test --config=playwright.announcements.config.mjs` from `scripts/acceptance` | Executes public active-window/localization states and exact MFA/RBAC administrator create, publish, translation, stale recovery, conflict and audit lifecycle on Chromium D/T/M plus public Firefox/WebKit with zero retries | Required by `Announcements Acceptance` |\n'
              '| Complete Support/Legal lifecycle | `npx playwright test --config=playwright.support-legal.config.mjs` from `scripts/acceptance` | Executes every typed legacy/localized route, publication state, approved link, legal version, exact MFA/RBAC editing, Polish translation and audit on Chromium D/T/M plus public Firefox/WebKit with zero retries | Required by `Support Legal Acceptance` |\n'
              '| Complete Editorial Media lifecycle | `npx playwright test --config=playwright.editorial-media.config.mjs` from `scripts/acceptance` | Executes upload validation/integrity, private content/thumbnail, reference lock, deletion, exact MFA/RBAC and audit on Chromium D/T/M with zero retries | Required by `Editorial Media Acceptance` |\n'
              '| Complete Wiki reconciliation lifecycle | `npx playwright test --config=playwright.wiki-reconciliation.config.mjs` from `scripts/acceptance` | Executes public route/state/error/recovery/localization and administrator validation/preview/conflict/review/publication/revision/archive/audit on Chromium D/T/M plus Firefox/WebKit with zero retries | Required by `Wiki Reconciliation Acceptance` |\n'
              '| Strict delivered-surface closure | `npm --prefix scripts/acceptance run test:coverage-contract:strict` | Fails while any delivered required surface is `partial` or `planned` | Required by `Portal Acceptance Contract` |',
          )
          replacements = {
              '| Support and legal | `planned` | every typed route, published/missing/unpublished, legal version, approved links, admin and PL translation; D/T/M | Add route-complete Playwright lifecycle |':
              '| Support and legal | `covered` | every typed route, published/missing/unpublished, legal version, approved links, admin and PL translation; Chromium D/T/M and public Firefox/WebKit | None in current contract |',
              '| Public Wiki | `partial` | home/category/article/search/error/unavailable/EN/PL; D/T/M; Chromium/Firefox/WebKit | Reconcile every required state and stable evidence marker |':
              '| Public Wiki | `covered` | home/category/article/search/error/unavailable/recovery/EN/PL; Chromium D/T/M and Firefox/WebKit | None in current contract |',
              '| Wiki administration | `partial` | draft/review/publish/unpublish/archive/revision restore/conflict/permissions/preview; D/T/M | Reconcile route/role/state completeness and markers |':
              '| Wiki administration | `covered` | draft/review/publish/unpublish/archive/revision restore/conflict/permissions/preview/audit; Chromium D/T/M and Firefox/WebKit | None in current contract |',
              '| Editorial Media administration | `planned` | upload validation/integrity, library, content/thumbnail, delete/reference lock, denial; D/T/M | Add secret-safe browser lifecycle |':
              '| Editorial Media administration | `covered` | upload validation/integrity, library, private content/thumbnail, delete/reference lock, denial and audit; Chromium D/T/M | None in current contract |',
          }
          for old, new in replacements.items():
              if old not in matrix:
                  raise SystemExit(f'matrix marker missing: {old}')
              matrix = matrix.replace(old, new)
          matrix_path.write_text(matrix)

          workflow_path = Path('.github/workflows/portal-acceptance-contract.yml')
          workflow = workflow_path.read_text()
          old_command = 'npm --prefix scripts/acceptance run test:coverage-contract | tee artifacts/portal-coverage/report.json'
          new_command = 'npm --prefix scripts/acceptance run test:coverage-contract:strict | tee artifacts/portal-coverage/report.json'
          if old_command not in workflow:
              raise SystemExit('portal acceptance command marker missing')
          workflow = workflow.replace(old_command, new_command)
          workflow = workflow.replace('name: Portal coverage classification', 'name: Strict portal coverage closure')
          workflow = workflow.replace('name: Validate machine-enforced portal coverage ledger', 'name: Validate strict machine-enforced portal coverage ledger')
          workflow_path.write_text(workflow)
          PY

      - name: Commit promoted ledger and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/portal-ledger-promotion.yml
          git add scripts/acceptance/coverage/portal-coverage-manifest.json docs/testing/PORTAL_ACCEPTANCE_COVERAGE_MATRIX.md .github/workflows/portal-acceptance-contract.yml
          git commit -m 'test(acceptance): close final portal ledger gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
