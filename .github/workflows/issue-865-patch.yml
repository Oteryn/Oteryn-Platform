name: Issue 865 patch helper

on:
  push:
    branches:
      - docs/issue-865-characterprofiles-module-catalog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-865-characterprofiles-module-catalog
          fetch-depth: 0
      - name: Reconcile CharacterProfiles catalog classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('docs/architecture/MODULE_CATALOG.md')
          text = catalog.read_text()
          old = "| Characters | AVAILABLE | Contract-approved web-triggered character operations; currently create plus Character Bazaar ownership transfer | Direct undocumented Canary writes; uncontracted rename/delete |\n| PublicPortal | AVAILABLE |"
          new = "| Characters | AVAILABLE | Contract-approved web-triggered character operations; currently create plus Character Bazaar ownership transfer | Direct undocumented Canary writes; uncontracted rename/delete |\n| CharacterProfiles | AVAILABLE | Platform-stored character presentation/privacy preferences: public comment, per-character field visibility and optional main-character selection, with server-side owner verification and projection into PublicGameData | Authoritative character identity/current ownership, gameplay state, Canary/Oteryn-v2 mutation authority, or claiming canonical CharacterId migration completion |\n| PublicPortal | AVAILABLE |"
          assert text.count(old) == 1, 'MODULE_CATALOG anchor mismatch'
          catalog.write_text(text.replace(old, new, 1))

          portal = Path('docs/architecture/PORTAL_COMPLETENESS_ARCHITECTURE.md')
          text = portal.read_text()
          old = "- `CharacterProfiles` as an implemented Platform-owned presentation/privacy preference subdomain pending top-level catalog-row reconciliation;"
          new = "- `CharacterProfiles` as an implemented top-level `AVAILABLE` Platform-owned presentation/privacy preference subdomain;"
          assert text.count(old) == 1, 'portal reconciliation bullet mismatch'
          text = text.replace(old, new, 1)

          old = "`CharacterProfiles` remains a small Platform-owned presentation/privacy subdomain; its top-level module-catalog classification should be reconciled without forcing a repository-wide namespace rename."
          new = "`CharacterProfiles` remains a small Platform-owned presentation/privacy subdomain; its top-level module-catalog classification is reconciled without forcing a repository-wide namespace rename. Canonical `CharacterId` preference migration remains separately authorized and pending under ADR 0030."
          assert text.count(old) == 1, 'portal code-organization wording mismatch'
          portal.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/issue-865-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/MODULE_CATALOG.md docs/architecture/PORTAL_COMPLETENESS_ARCHITECTURE.md .github/workflows/issue-865-patch.yml
          git commit -m "docs(architecture): classify CharacterProfiles module"
          git push origin HEAD:docs/issue-865-characterprofiles-module-catalog
