name: Tibia Decoded Map Post-Auth Resume

on:
  push:
    branches: [ops/oteryn-tibia-client-analysis-20260811]
    paths: [.github/workflows/tibia-client-analysis-gdb-postauth-resume.yml]

permissions:
  contents: read

env:
  CONTAINER_NAME: oteryn-tibia-client-analysis

jobs:
  resume:
    name: Rebind post-auth window and capture map
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Resume exact instrumented client without credential reuse
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == "oteryn-synology-staging" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.owner" }}' "$CONTAINER_NAME")" == "oteryn" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME")" == "tibia-client-analysis" ]]
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-before.tsv
          docker exec -i "$CONTAINER_NAME" bash <<'INNER'
          set -Eeuo pipefail
          export DISPLAY=:99 HOME=/data/home
          pgrep -f '/wireproxy .*wireproxy.conf' >/dev/null
          curl --socks5-hostname 127.0.0.1:25344 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'
          grep -q 'DECODED_CONTENT_BREAKPOINT_READY=true' /data/runtime/worldmap-gdb-v2.log
          pgrep -f 'gdb .*packages/Tibia/bin/client' >/dev/null
          pid=$(pgrep -x client | head -n1)
          [[ -n "$pid" ]]
          echo POSTAUTH_INSTRUMENTED_CLIENT_ALIVE=true

          resolve_window() {
            local w geom width height
            for n in $(seq 1 60); do
              for w in $(xdotool search --onlyvisible --pid "$pid" --name '^Tibia$' 2>/dev/null || true); do
                xwininfo -id "$w" >/dev/null 2>&1 || continue
                geom=$(xdotool getwindowgeometry --shell "$w" 2>/dev/null || true)
                width=$(printf '%s\n' "$geom" | sed -n 's/^WIDTH=//p')
                height=$(printf '%s\n' "$geom" | sed -n 's/^HEIGHT=//p')
                if [[ "$width" == 1020 && "$height" == 650 ]]; then printf '%s\n' "$w"; return 0; fi
              done
              sleep 0.4
            done
            return 1
          }

          # Re-resolve after authentication: Qt replaces the login window ID.
          select_window=$(resolve_window)
          [[ -n "$select_window" ]]
          echo POSTAUTH_WINDOW_REBOUND=true
          xdotool windowactivate --sync "$select_window" 2>/dev/null || true
          xdotool mousemove --window "$select_window" 285 193 click 1
          xdotool key --window "$select_window" Return
          sleep 3
          # If the first activation did not enter, re-resolve before the bounded double-click.
          select_window=$(resolve_window)
          xdotool mousemove --window "$select_window" 285 193 click --repeat 2 --delay 160 1
          echo CHARACTER_ENTRY_SENT_WITH_REBOUND_WINDOW=true

          records=0
          for n in $(seq 1 90); do
            sleep 1
            records=$(grep -c '^REC ' /data/runtime/worldmap-live-capture-v2.txt 2>/dev/null || true)
            (( records >= 20 )) && break
          done
          echo DECODED_RECORD_COUNT_AFTER_ENTRY=$records
          (( records >= 20 ))

          # World entry can replace the window again; resolve before movement.
          world_window=$(resolve_window)
          [[ -n "$world_window" ]]
          echo WORLD_WINDOW_REBOUND=true
          xdotool key --window "$world_window" Right
          sleep 2
          world_window=$(resolve_window)
          xdotool key --window "$world_window" Left
          sleep 3
          records=$(grep -c '^REC ' /data/runtime/worldmap-live-capture-v2.txt 2>/dev/null || true)
          echo DECODED_RECORD_COUNT_FINAL=$records

          tcp_rows=$(ss -ntp 2>/dev/null | grep "pid=$pid," || true)
          udp_rows=$(ss -nup 2>/dev/null | grep "pid=$pid," || true)
          local_count=$(printf '%s\n' "$tcp_rows" | awk '$5 ~ /127\.0\.0\.1:25344$/ || $5 ~ /\[::1\]:25344$/ {n++} END{print n+0}')
          total_count=$(printf '%s\n' "$tcp_rows" | grep -c . || true)
          direct_count=$((total_count-local_count))
          udp_count=$(printf '%s\n' "$udp_rows" | grep -c . || true)
          echo FINAL_LOCAL_SOCKS_COUNT=$local_count
          echo FINAL_DIRECT_TCP_COUNT=$direct_count
          echo FINAL_UDP_COUNT=$udp_count
          [[ "$direct_count" -eq 0 && "$udp_count" -eq 0 ]]

          echo WORLDMAP_CAPTURE_BEGIN
          grep '^REC ' /data/runtime/worldmap-live-capture-v2.txt | head -n 80
          echo WORLDMAP_CAPTURE_END
          INNER

      - name: Verify canonical staging unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -a --filter 'label=com.docker.compose.project=oteryn-staging' --format '{{.ID}}\t{{.Names}}' | sort >/tmp/oteryn-after.tsv
          diff -u /tmp/oteryn-before.tsv /tmp/oteryn-after.tsv
          docker inspect --format 'analysis_name={{.Name}} status={{.State.Status}} owner={{ index .Config.Labels "com.blakinio.owner" }} purpose={{ index .Config.Labels "com.blakinio.purpose" }}' "$CONTAINER_NAME"
