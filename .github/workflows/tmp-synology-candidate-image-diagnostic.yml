name: Temporary Synology Candidate Gateway Repair Writer

on:
  push:
    branches:
      - fix/20260907-synology-candidate-image-resolution
    paths:
      - .github/workflows/tmp-synology-candidate-image-diagnostic.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-candidate-image-resolution

      - name: Apply repair
        run: python3 .github/tmp-synology-candidate-gateway-repair.py

      - name: Validate focused contracts
        run: |
          set -euo pipefail
          bash -n deploy/synology/scripts/deploy.sh
          python3 tests/ci/test_synology_rollback_recovery_contract.py
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Remove temporary repair scaffolding and publish
        env:
          BRANCH: fix/20260907-synology-candidate-image-resolution
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-synology-candidate-image-diagnostic.yml
          rm -f .github/tmp-synology-candidate-gateway-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github deploy/synology/scripts/deploy.sh tests/ci/test_synology_rollback_recovery_contract.py
          git diff --cached --check
          git commit -m 'fix(staging): reconstruct drifted candidate gateway safely'
          git push origin "HEAD:${BRANCH}"
