name: Temporary Synology Candidate Image Diagnostic

on:
  push:
    branches:
      - fix/20260907-synology-candidate-image-resolution
    paths:
      - .github/workflows/tmp-synology-candidate-image-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      group: platform-runners
      labels: oteryn-platform
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect candidate and running runtime identities
        run: |
          set -euo pipefail
          state_file=/var/lib/oteryn-staging-state/candidate-release.env
          test -f "$state_file"
          bash deploy/synology/scripts/release-state.sh validate "$state_file"

          mapfile -t candidate < <(bash -c '
            set -euo pipefail
            source "$1"
            printf "%s\n%s\n%s\n%s\n" "$RELEASE_SHA" "$PLATFORM_IMAGE" "$GATEWAY_IMAGE" "$CANARY_IMAGE"
          ' bash "$state_file")

          candidate_sha="${candidate[0]}"
          echo "candidate_sha=$candidate_sha"

          services=(platform gateway canary)
          for index in "${!services[@]}"; do
            service="${services[$index]}"
            expected_ref="${candidate[$((index + 1))]}"
            mapfile -t containers < <(
              docker ps -q \
                --filter label=com.docker.compose.project=oteryn-staging \
                --filter "label=com.docker.compose.service=$service"
            )
            echo "service=$service"
            echo "expected_ref=$expected_ref"
            echo "running_container_count=${#containers[@]}"
            if (( ${#containers[@]} != 1 )); then
              continue
            fi

            container="${containers[0]}"
            running_id="$(docker inspect --format '{{.Image}}' "$container")"
            expected_id="$(docker image inspect --format '{{.Id}}' "$expected_ref" 2>/dev/null || true)"
            running_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$running_id" 2>/dev/null || true)"
            expected_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$expected_ref" 2>/dev/null || true)"

            echo "running_image_id=$running_id"
            echo "expected_image_present=$([[ -n "$expected_id" ]] && echo true || echo false)"
            echo "expected_image_id=${expected_id:-MISSING}"
            echo "running_revision=${running_revision:-EMPTY}"
            echo "expected_revision=${expected_revision:-EMPTY}"
            echo 'running_repo_digests_begin'
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$running_id" || true
            echo 'running_repo_digests_end'
            echo '---'
          done
