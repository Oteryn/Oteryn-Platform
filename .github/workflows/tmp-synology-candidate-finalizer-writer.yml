name: Temporary Synology Candidate Finalizer Writer

on:
  push:
    branches:
      - fix/20260907-synology-candidate-finalizer-env
    paths:
      - .github/workflows/tmp-synology-candidate-finalizer-writer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260907-synology-candidate-finalizer-env

      - name: Apply bounded candidate finalizer repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          deploy_path = Path('deploy/synology/scripts/deploy.sh')
          deploy = deploy_path.read_text()

          deploy = replace_once(
              deploy,
              '    local service container_id image_id resolved_image expected_image\n',
              '    local service container_id image_id expected_image expected_image_id\n',
              'candidate finalizer local variables',
          )

          old_identity = (
              "        image_id=\"$(docker inspect --format '{{.Image}}' \"$container_id\")\" || return 1\n"
              "        resolved_image=\"$(bash \"$SCRIPT_DIR/release-state.sh\" resolve-image \"$image_id\")\" || return 1\n"
              "        [[ \"$resolved_image\" == \"$expected_image\" ]] || {\n"
              "            echo \"Previous candidate finalization rejected: running $service image does not match candidate recovery identity.\" >&2\n"
              "            return 1\n"
              "        }\n"
          )
          new_identity = (
              "        image_id=\"$(docker inspect --format '{{.Image}}' \"$container_id\")\" || return 1\n"
              "        expected_image_id=\"$(docker image inspect --format '{{.Id}}' \"$expected_image\" 2>/dev/null || true)\"\n"
              "        [[ -n \"$expected_image_id\" && \"$image_id\" == \"$expected_image_id\" ]] || {\n"
              "            echo \"Previous candidate finalization rejected: running $service image does not match candidate recovery identity.\" >&2\n"
              "            return 1\n"
              "        }\n"
          )
          deploy = replace_once(deploy, old_identity, new_identity, 'candidate image identity')

          old_compose = '    candidate_compose=(docker compose --env-file "$candidate_env" -f "$COMPOSE_FILE")\n'
          new_compose = (
              '    candidate_compose=(\n'
              '        env\n'
              '        "PLATFORM_IMAGE=${candidate_state[1]}"\n'
              '        "GATEWAY_IMAGE=${candidate_state[2]}"\n'
              '        "CANARY_IMAGE=${candidate_state[3]}"\n'
              '        "GATEWAY_VERSION=sha-${candidate_sha}"\n'
              '        docker compose --env-file "$candidate_env" -f "$COMPOSE_FILE"\n'
              '    )\n'
          )
          deploy = replace_once(deploy, old_compose, new_compose, 'candidate compose environment')
          deploy_path.write_text(deploy)

          test_path = Path('tests/ci/test_synology_rollback_recovery_contract.py')
          tests = test_path.read_text()
          old_assertions = (
              '    assert "running $service image does not match candidate recovery identity" in body\n'
              '    assert \'OTERYN_ENV_FILE="$candidate_env" bash "$SCRIPT_DIR/health-check.sh"\' in body\n'
          )
          new_assertions = (
              '    assert "running $service image does not match candidate recovery identity" in body\n'
              '    assert \'expected_image_id="$(docker image inspect --format\' in body\n'
              '    assert \'release-state.sh" resolve-image "$image_id"\' not in body\n'
              '    assert \'"PLATFORM_IMAGE=${candidate_state[1]}"\' in body\n'
              '    assert \'"GATEWAY_IMAGE=${candidate_state[2]}"\' in body\n'
              '    assert \'"CANARY_IMAGE=${candidate_state[3]}"\' in body\n'
              '    assert \'"GATEWAY_VERSION=sha-${candidate_sha}"\' in body\n'
              '    assert \'OTERYN_ENV_FILE="$candidate_env" bash "$SCRIPT_DIR/health-check.sh"\' in body\n'
          )
          tests = replace_once(tests, old_assertions, new_assertions, 'candidate finalizer contract assertions')
          test_path.write_text(tests)
          PY

      - name: Validate focused repair
        run: |
          set -euo pipefail
          bash -n deploy/synology/scripts/deploy.sh
          python3 tests/ci/test_synology_rollback_recovery_contract.py
          python3 tests/ci/test_synology_auto_staging_deploy.py

      - name: Remove temporary writer and publish repair
        env:
          BRANCH: fix/20260907-synology-candidate-finalizer-env
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-synology-candidate-finalizer-writer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/synology/scripts/deploy.sh tests/ci/test_synology_rollback_recovery_contract.py .github/workflows/tmp-synology-candidate-finalizer-writer.yml
          git diff --cached --check
          git commit -m 'fix(staging): repair candidate finalizer identity'
          git push origin "HEAD:${BRANCH}"
