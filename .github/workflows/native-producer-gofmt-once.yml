name: Native Producer Gofmt Once

on:
  push:
    branches:
      - feat/OTERYN-20260804-native-protocol-producer

permissions:
  contents: write

concurrency:
  group: native-producer-gofmt-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: feat/OTERYN-20260804-native-protocol-producer
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/game-gateway/go.mod
          cache: false

      - name: Apply exact gofmt
        working-directory: services/game-gateway
        run: |
          gofmt -w \
            internal/e2e/native_producer_test.go \
            internal/gateway/native_protocol_test.go \
            internal/gateway/types.go \
            internal/httpapi/server.go \
            internal/session/client_test.go

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/native-producer-gofmt-once.yml
          git add services/game-gateway/internal/e2e/native_producer_test.go
          git add services/game-gateway/internal/gateway/native_protocol_test.go
          git add services/game-gateway/internal/gateway/types.go
          git add services/game-gateway/internal/httpapi/server.go
          git add services/game-gateway/internal/session/client_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(gateway): apply gofmt"
          git push origin HEAD:feat/OTERYN-20260804-native-protocol-producer
