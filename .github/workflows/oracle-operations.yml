name: Oracle Operations
run-name: Oracle ${{ inputs.action }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Observe readiness or deploy exact current protected main
        type: choice
        required: true
        default: status
        options: [status, deploy]
      source_sha:
        description: Full protected-main commit, required for deployment
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: oracle-operations
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on:
      group: platform-runners
      labels: [oteryn-platform, oteryn-oracle, ARM64]
    environment: oracle-staging
    timeout-minutes: 180
    env:
      EXPECTED_RUNNER_NAME: oteryn-oracle-platform
      OPERATION: ${{ inputs.action }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require a successful nightly E2E on main
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          now = datetime.now(timezone.utc)
          window = now.replace(hour=2, minute=17, second=0, microsecond=0)
          if now < window:
              window -= timedelta(days=1)
          since = window.strftime("%Y-%m-%dT%H:%M:%SZ")
          query = urlencode({
              "branch": "main",
              "event": "schedule",
              "created": f">={since}",
              "per_page": 1,
          })
          url = f"{api}/repos/{repo}/actions/workflows/portal-rs-e2e.yml/runs?{query}"
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          })
          with urlopen(request, timeout=20) as response:
              runs = json.load(response)["workflow_runs"]
          # The runs endpoint returns newest first. Keep queued and in-progress
          # runs in the query so an earlier success cannot mask the current run.
          if not runs or runs[0]["display_title"] != "Portal RS E2E Nightly":
              raise SystemExit(f"No scheduled nightly E2E on main for the window starting {since}.")
          latest = runs[0]
          if latest["status"] != "completed" or latest["conclusion"] != "success":
              raise SystemExit(f"Nightly E2E on main for the window starting {since} must complete successfully.")
          PYTHON
      - name: Validate target and bounded operation
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$(uname -m)" = aarch64
          test "$(id -u)" = 1001
          test ! -S /var/run/docker.sock
          if command -v docker >/dev/null 2>&1 && timeout 5 docker info >/dev/null 2>&1; then
            echo 'Runner unexpectedly controls a Docker daemon.' >&2
            exit 1
          fi
          case "$OPERATION" in
            status) test -z "$SOURCE_SHA"; command=status ;;
            deploy) [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; command="deploy-v2 $SOURCE_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" ;;
            *) exit 1 ;;
          esac
          # The key is constrained on the host to one component and two actions.
          # No token, runtime credential, arbitrary path or shell reaches the host.
          ssh -F /dev/null -i /home/runner/.ssh/oracle-deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/home/runner/.ssh/known_hosts \
            -o ConnectTimeout=10 root@oteryn-deploy-host "$command"
