name: CI Routing Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ci-routing-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.repository == 'blakinio/Oteryn-Platform' &&
      github.head_ref == 'ci/OTERYN-20260802-change-routing' &&
      github.actor == 'blakinio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate classifier before workflow mutation
        run: python tests/ci/test_classify_changes.py

      - name: Apply bounded workflow routing patch
        run: python scripts/ci/apply_change_routing.py

      - name: Validate classifier and generated diff
        run: |
          python tests/ci/test_classify_changes.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              '.github/workflows/ci.yml',
              '.github/workflows/phase7-production-like-validation.yml',
              '.github/workflows/edge-security-emulation.yml',
              '.github/workflows/platform-db-outage-validation.yml',
              '.github/workflows/game-auth-ticket-concurrency.yml',
              '.github/workflows/ci-routing-bootstrap.yml',
              'scripts/ci/apply_change_routing.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected generated paths: {sorted(changed)}')

          for workflow in sorted(expected):
              if not workflow.endswith('.yml') or workflow.endswith('ci-routing-bootstrap.yml'):
                  continue
              text = Path(workflow).read_text(encoding='utf-8')
              if text.count('  classify_changes:\n') != 1:
                  raise SystemExit(f'{workflow}: missing unique classifier job')
              if text.count('needs: classify_changes') != 1:
                  raise SystemExit(f'{workflow}: missing unique dependency')
              if text.count('Require successful change classification') != 1:
                  raise SystemExit(f'{workflow}: missing fail-closed step')
              if text.count('Validate change classifier') != 1:
                  raise SystemExit(f'{workflow}: missing classifier tests')
          PY

      - name: Package generated workflows
        run: |
          rm -rf scripts/ci/__pycache__ tests/ci/__pycache__ artifacts/ci-routing
          mkdir -p artifacts/ci-routing/.github/workflows
          for workflow in \
            ci.yml \
            phase7-production-like-validation.yml \
            edge-security-emulation.yml \
            platform-db-outage-validation.yml \
            game-auth-ticket-concurrency.yml
          do
            cp ".github/workflows/$workflow" "artifacts/ci-routing/.github/workflows/$workflow"
          done
          (
            cd artifacts/ci-routing
            sha256sum .github/workflows/*.yml > SHA256SUMS
          )

      - name: Upload generated workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-routing-generated-${{ github.run_id }}
          path: artifacts/ci-routing
          if-no-files-found: error
          retention-days: 3
