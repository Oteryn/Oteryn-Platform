name: Production synthetic monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: prod-synthetic-monitor
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production monitor environments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            for (const name of ['production-monitor-probe', 'production-monitor-alert']) {
              try {
                const options = { ...context.repo, environment_name: name };
                const { data: environment } = await github.request(
                  'GET /repos/{owner}/{repo}/environments/{environment_name}', options);
                if (environment.name !== name || !environment.deployment_branch_policy?.custom_branch_policies ||
                    environment.deployment_branch_policy.protected_branches) throw new Error();
                const { data: rules } = await github.request(
                  'GET /repos/{owner}/{repo}/environments/{environment_name}/deployment-branch-policies', options);
                const [rule] = rules.branch_policies;
                if (rules.total_count !== 1 || rules.branch_policies.length !== 1 || rule?.type !== 'branch' ||
                    rule.name !== context.payload.repository.default_branch) throw new Error();
              } catch {
                core.setFailed(`Repository owner must provision ${name} with a default-branch-only deployment policy.`);
                return;
              }
            }

  monitor:
    needs: preflight
    if: needs.preflight.result == 'success' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    environment: production-monitor-probe
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      probe_sequence: ${{ steps.config.outputs.probe_sequence }}
      failing_step: ${{ steps.probe.outputs.failing_step || (steps.checkout.outcome == 'failure' && 'Checkout') || (steps.node.outcome == 'failure' && 'Set up Node') || (steps.install.outcome == 'failure' && 'Install E2E dependencies and Chromium') || 'Run production monitor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check monitor configuration
        id: config
        env:
          MONITOR_EMAIL: ${{ secrets.MONITOR_EMAIL }}
        run: |
          if [[ -z "$MONITOR_EMAIL" ]]; then
            echo "::notice::Production synthetic monitor is not configured yet."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "probe_sequence=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: steps.config.outputs.enabled == 'true'
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install E2E dependencies and Chromium
        if: steps.config.outputs.enabled == 'true'
        id: install
        working-directory: portal-rs/e2e
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Run production monitor
        if: steps.config.outputs.enabled == 'true'
        id: probe
        working-directory: portal-rs/e2e
        env:
          MONITOR_EMAIL: ${{ secrets.MONITOR_EMAIL }}
          MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
          MONITOR_TOTP_SECRET: ${{ secrets.MONITOR_TOTP_SECRET }}
          MONITOR_OUTPUT_DIR: ${{ runner.temp }}/prod-monitor-results
          MONITOR_ALLOW_AUTH_WRITES: ${{ vars.MONITOR_ALLOW_AUTH_WRITES }}
        run: |
          set +e
          node prod/run.mjs | tee "$RUNNER_TEMP/prod-monitor.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            step="$(sed -nE 's/^(pl-1440|en-390) failed at ([[:alnum:] _-]+)$/\1 \2/p' "$RUNNER_TEMP/prod-monitor.log" | head -n 1)"
            echo "failing_step=${step:-Run production monitor}" >> "$GITHUB_OUTPUT"
          fi
          exit "$result"

  incident:
    needs: [preflight, monitor]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.monitor.outputs.enabled == 'true' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    environment: production-monitor-alert
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update monitor incident
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PROBE_OUTCOME: ${{ needs.monitor.result }}
          PROBE_SEQUENCE: ${{ needs.monitor.outputs.probe_sequence }}
          FAILING_STEP: ${{ needs.monitor.outputs.failing_step }}
        with:
          script: |
            const repo = context.repo;
            const label = 'prod-monitor';
            const title = 'Production synthetic monitor failing';
            const pending = (transition) => `prod-monitor-mail-${transition}-pending`;
            const url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.getLabel({ ...repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repo, name, color });
              }
            }
            const sequence = process.env.PROBE_SEQUENCE;
            const parseSequence = (value) => {
              if (typeof value !== 'string' || !/^[1-9][0-9]*\.[1-9][0-9]*$/.test(value)) {
                throw new Error('Invalid production monitor probe sequence');
              }
              return value.split('.').map(BigInt);
            };
            const [run, attempt] = parseSequence(sequence);
            const failed = process.env.PROBE_OUTCOME !== 'success';
            const stateLabel = 'prod-monitor-state';
            const stateTitle = 'Production synthetic monitor state';
            const states = (await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'all', labels: stateLabel, per_page: 100,
            })).filter(issue => issue.title === stateTitle && !issue.pull_request);
            if (states.length > 1) throw new Error('Multiple production monitor state issues');
            const state = states[0];
            const next = { sequence, failed, pending: {
              url, step: process.env.FAILING_STEP || 'Run production monitor',
            } };
            async function reconcile(record) {
              const incidents = (await github.paginate(github.rest.issues.listForRepo, {
                ...repo, state: 'all', labels: label, per_page: 100,
              })).filter(issue => issue.title === title && !issue.pull_request);
              const incident = incidents.find(issue => issue.state === 'open');
              const marker = `<!-- prod-monitor:${record.sequence} -->`;
              if (record.failed) {
                const body = `Failing step: ${record.pending.step}\n\nRun: ${record.pending.url}\n\n${marker}`;
                if (incidents.some(issue => issue.body?.includes(marker))) return;
                if (!incident) {
                  await ensureLabel(label, 'b60205');
                  await ensureLabel(pending('failing'), 'fbca04');
                  await github.rest.issues.create({ ...repo, title, body, labels: [label, pending('failing')] });
                  return;
                }
                const issue = { ...repo, issue_number: incident.number };
                const comments = await github.paginate(github.rest.issues.listComments, issue);
                if (!comments.some(comment => comment.body?.includes(marker))) {
                  await github.rest.issues.createComment({ ...issue, body });
                }
              } else if (incident) {
                const issue = { ...repo, issue_number: incident.number };
                await ensureLabel(pending('recovered'), 'fbca04');
                const comments = await github.paginate(github.rest.issues.listComments, issue);
                if (!comments.some(comment => comment.body?.includes(marker))) {
                  await github.rest.issues.createComment({
                    ...issue, body: `recovered\n\nRun: ${record.pending.url}\n\n${marker}`,
                  });
                }
                const labels = new Set(incident.labels.map(({ name }) => name));
                labels.add(pending('recovered'));
                await github.rest.issues.update({ ...issue, state: 'closed', labels: [...labels] });
              }
            }

            let stateNumber;
            async function save(record) {
              await github.rest.issues.update({ ...repo, issue_number: stateNumber, body: JSON.stringify(record) });
            }
            async function complete(record) {
              await reconcile(record);
              await save({ sequence: record.sequence, failed: record.failed });
            }

            if (state) {
              stateNumber = state.number;
              const saved = JSON.parse(state.body);
              const [savedRun, savedAttempt] = parseSequence(saved.sequence);
              if (saved.pending) await complete(saved);
              if (run < savedRun || (run === savedRun && attempt < savedAttempt)) {
                core.notice('Ignored stale production monitor probe result.');
                return;
              }
              if (sequence === saved.sequence) {
                if (saved.failed !== failed) throw new Error('Production monitor result changed for the same probe sequence');
                return;
              }
              await save(next);
            } else {
              await ensureLabel(stateLabel, '5319e7');
              const { data: created } = await github.rest.issues.create({
                ...repo, title: stateTitle, body: JSON.stringify(next), labels: [stateLabel],
              });
              stateNumber = created.number;
            }
            await complete(next);

      - name: Deliver pending monitor email
        if: ${{ !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MONITOR_SMTP_HOST: ${{ secrets.MONITOR_SMTP_HOST }}
          MONITOR_SMTP_USER: ${{ secrets.MONITOR_SMTP_USER }}
          MONITOR_SMTP_PASSWORD: ${{ secrets.MONITOR_SMTP_PASSWORD }}
        with:
          script: |
            const { MONITOR_SMTP_HOST: host, MONITOR_SMTP_USER: user,
              MONITOR_SMTP_PASSWORD: password } = process.env;
            if (!host || !user || !password) {
              core.notice('Production monitor SMTP is not configured.');
              return;
            }

            let smtp;
            try {
              smtp = new URL(host.includes('://') ? host : `smtp://${host}`);
              if (!['smtp:', 'smtps:'].includes(smtp.protocol) || !smtp.hostname ||
                  smtp.username || smtp.password || !['', '/'].includes(smtp.pathname) ||
                  smtp.search || smtp.hash || /[:\s\x00-\x1f\x7f]/.test(user)) throw new Error();
              smtp.port ||= smtp.protocol === 'smtp:' ? '587' : '465';
            } catch {
              core.setFailed('Production monitor SMTP configuration is invalid.');
              return;
            }

            const queued = [];
            const repo = context.repo;
            for (const transition of ['failing', 'recovered']) {
              const label = `prod-monitor-mail-${transition}-pending`;
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...repo, state: 'all', labels: `prod-monitor,${label}`, per_page: 100,
              });
              for (const issue of issues) {
                const attempted = `prod-monitor-mail-${transition}-attempted`;
                if (!issue.pull_request && issue.title === 'Production synthetic monitor failing' &&
                    !issue.labels.some(({ name }) => name === attempted)) {
                  queued.push({ issue, transition, label, attempted });
                }
              }
            }
            queued.sort((a, b) => a.issue.number - b.issue.number || a.transition.localeCompare(b.transition));
            for (const entry of queued) {
              const issue = { ...repo, issue_number: entry.issue.number };
              try {
                await github.rest.issues.getLabel({ ...repo, name: entry.attempted });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repo, name: entry.attempted, color: 'c5def5' });
              }
              try {
                const outcome = await send(entry, () =>
                  github.rest.issues.addLabels({ ...issue, labels: [entry.attempted] }));
                if (outcome === 'not-submitted') {
                  await github.rest.issues.removeLabel({ ...issue, name: entry.attempted });
                  core.setFailed('Production monitor SMTP failed before submission. This alert remains queued.');
                  return;
                }
                if (outcome !== 'accepted') {
                  core.setFailed('Production monitor email outcome is uncertain. Check the relay before any manual resend.');
                  continue;
                }
              } catch {
                core.setFailed('Production monitor could not prepare or record the SMTP attempt.');
                continue;
              }
              await github.rest.issues.removeLabel({ ...issue, name: entry.label });
            }

            async function send({ issue, transition }, claim) {
              const { spawn } = require('node:child_process');
              const { once } = require('node:events');
              const { mkdtemp, rm, writeFile } = require('node:fs/promises');
              const { tmpdir } = require('node:os');
              const { join } = require('node:path');

              const to = 'support@oteryn.com';
              const sender = /^[^\s<>@]+@[^\s<>@]+$/.test(user) ? user : to;
              const messageId = `prod-monitor-${repo.owner}.${repo.repo}-${issue.number}-${transition}`;
              const mail = [
                `From: ${sender}`, `To: ${to}`, `Date: ${new Date().toUTCString()}`,
                `Message-ID: <${messageId}@oteryn.com>`,
                `Subject: Production synthetic monitor ${transition}`, '',
                `Incident: ${issue.html_url}`, '',
              ].join('\r\n');
              // Keep credentials out of process arguments and curl diagnostics.
              const quote = (value) => '"' + value.replace(/[\\"\r\n\t]/g, (char) =>
                ({ '\\': '\\\\', '"': '\\"', '\r': '\\r', '\n': '\\n', '\t': '\\t' })[char]) + '"';
              const scratch = await mkdtemp(join(tmpdir(), 'prod-monitor-mail-'));
              try {
                const message = join(scratch, 'message');
                await writeFile(message, mail, { mode: 0o600 });
                await claim();
                const client = spawn('curl', ['--disable', '--silent', '--ssl-reqd', '--max-time', '25',
                  '--config', '-', '--upload-file', message, '--mail-rcpt', to],
                { stdio: ['pipe', 'ignore', 'ignore'], env: { PATH: process.env.PATH } });
                client.stdin.on('error', () => {});
                client.stdin.end(`url = ${quote(smtp.href)}\nuser = ${quote(`${user}:${password}`)}\nmail-from = ${quote(sender)}\n`);
                let code;
                try {
                  [code] = await once(client, 'close');
                } catch {
                  // No child process was started.
                  return 'not-submitted';
                }
                if (code === 0) return 'accepted';
                // curl failed to initialise, resolve, connect, validate TLS, or authenticate.
                const beforeSubmission = [2, 3, 4, 5, 6, 7, 60, 67, 77];
                return beforeSubmission.includes(code) ? 'not-submitted' : 'uncertain';
              } finally {
                await rm(scratch, { recursive: true, force: true });
              }
            }
