name: One-shot Game Catalog First-Scope Closeout

on:
  push:
    branches:
      - chore/OTERYN-20260729-game-catalog-first-scope-closeout
    paths:
      - '.github/workflows/one-shot-game-catalog-closeout.yml'
      - 'tools/agents/fix_game_catalog_closeout_reconciliation.py'
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-shot-game-catalog-closeout.yml'
      - 'tools/agents/fix_game_catalog_closeout_reconciliation.py'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/OTERYN-20260729-game-catalog-first-scope-closeout
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align counts and remaining trackers
        run: python tools/agents/fix_game_catalog_closeout_reconciliation.py

      - name: Validate reconciled ledgers and checkpoint
        run: |
          node scripts/acceptance/coverage/validate-product-completeness.mjs
          python tools/agents/checkpoint.py docs/agents/tasks/active/OTERYN-20260729-game-catalog-first-scope-closeout.md --require-checkpoint
          python tools/agents/test_checkpoint.py
          ! grep -R '"#281"' docs/testing/product-completeness-benchmark.json

      - name: Commit corrected reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/testing/PRODUCT_COMPLETENESS_BENCHMARK.md docs/agents/PROJECT_STATE.md
          git commit -m 'docs(catalog): align closeout counts and trackers'
          git push origin HEAD:chore/OTERYN-20260729-game-catalog-first-scope-closeout
