name: Inspect MFA QR preparator

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-mfa-qr-preparator.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print focused commit-step failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: 89847759288
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > job.log
          grep -nEi 'fatal|error|rejected|non-fast-forward|cannot|failed|conflict|from https|to https' job.log | tail -n 40 || true
          echo '--- final lines ---'
          tail -n 28 job.log
