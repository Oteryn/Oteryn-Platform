name: oteryn-oracle-runners
x-runner: &runner
  image: oteryn-actions-runner:2.338.0-arm64
  restart: unless-stopped
  user: '1001:1001'
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  extra_hosts: ['oteryn-deploy-host:host-gateway']
  # No Docker socket, runtime directories, host credentials or published ports.
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  platform:
    <<: *runner
    volumes: [platform:/home/runner]
  game:
    <<: *runner
    volumes: [game:/home/runner]
  # Separate runner group (staging-runners) for branch-triggered staging
  # deploys. It holds only the staging key; branch code never reaches the
  # production runners or their keys.
  staging:
    <<: *runner
    volumes: [staging:/home/runner]
volumes:
  platform:
    external: true
    name: oteryn-oracle-runners_platform
  game:
    external: true
    name: oteryn-oracle-runners_game
  staging:
    external: true
    name: oteryn-oracle-runners_staging
