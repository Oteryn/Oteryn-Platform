name: oteryn-oracle-tunnel
services:
  cloudflared:
    # Cloudflare Tunnel for oteryn.com: outbound-only connections to Cloudflare,
    # forwarding to the edge at 172.18.0.10:443 (see README "Cloudflare Tunnel").
    image: cloudflare/cloudflared@sha256:89ee50efb1e9cb2ae30281a8a404fed95eb8f02f0a972617526f8c5b417acae2
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    restart: unless-stopped
    read_only: true
    volumes:
      # Host directory (mode 700, owner 65532) with config.yml and the tunnel
      # credentials JSON. Never committed; the account cert.pem stays outside it.
      - /opt/oteryn-oracle/tunnel:/etc/cloudflared:ro
    networks:
      platform_private:
        ipv4_address: 172.18.0.20
networks:
  platform_private:
    external: true
    name: oteryn-oracle_private
