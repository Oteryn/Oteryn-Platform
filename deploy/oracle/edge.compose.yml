name: oteryn-oracle-edge
services:
  edge:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      platform_private:
        ipv4_address: 172.18.0.10
volumes:
  caddy_data:
  caddy_config:
networks:
  platform_private:
    external: true
    name: oteryn-oracle_private
