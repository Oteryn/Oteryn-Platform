name: oteryn-oracle-edge
services:
  edge:
    # Built on the host from edge.Dockerfile (stock Caddy plus caddy-l4).
    image: oteryn-edge:2.11.7-l4-0.1.3
    restart: unless-stopped
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      platform_private:
        ipv4_address: 172.18.0.10
volumes:
  caddy_data:
  caddy_config:
networks:
  platform_private:
    external: true
    name: oteryn-oracle_private
