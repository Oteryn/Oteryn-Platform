name: oteryn-staging
x-confined-process: &confined-process
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  init: true
  logging:
    driver: local
    options: {max-size: 10m, max-file: '2'}
x-confined: &confined
  <<: *confined-process
  networks: [net]
x-app: &app
  <<: *confined
  image: ${STAGING_IMAGE:?}
  pull_policy: never
  env_file: portal.env
  volumes:
    - trust:/trust:ro
  tmpfs:
    - /tmp:size=32m,uid=10001,gid=10001
services:
  postgres:
    <<: *confined
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    user: '999:999'
    cpus: 0.4
    mem_limit: 768m
    env_file: postgres.env
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - data:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:size=16m,uid=999,gid=999
      - /tmp:size=32m,uid=999,gid=999
    healthcheck:
      test: [CMD, pg_isready, -q, -h, '127.0.0.1', -U, portal, -d, portal_e2e_staging]
      interval: 2s
      timeout: 2s
      retries: 30
  mail:
    <<: *confined
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    user: '10001:10001'
    cpus: 0.075
    mem_limit: 192m
    environment:
      MP_SMTP_TLS_CERT: /tls/leaf.pem
      MP_SMTP_TLS_KEY: /tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_SMTP_AUTH_FILE: /tls/auth
      MP_MAX_MESSAGES: '5000'
    volumes:
      - mail_tls:/tls:ro
    tmpfs:
      - /tmp:size=128m,uid=10001,gid=10001
  portal:
    <<: *app
    cpus: 0.2
    mem_limit: 384m
    command: [serve]
  # The tunnel reaches this origin through ingress.
  portal-public:
    <<: *app
    env_file: [portal.env, public.env]
    environment:
      # Only ingress may name the client; it sets one X-Forwarded-For.
      TRUSTED_PROXIES: 172.21.255.250
    cpus: 0.1
    mem_limit: 256m
    command: [serve]
  worker:
    <<: *app
    cpus: 0.125
    mem_limit: 256m
    command: [worker]
  ingress:
    <<: *confined
    image: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    user: '1000:1000'
    cpus: 0.1
    mem_limit: 128m
    networks:
      net:
        ipv4_address: 172.21.255.250
      ingress: {}
    ports: ['127.0.0.1:18080:8080']
    entrypoint: [node, -e]
    command:
      - |
        const http = require('node:http');
        const net = require('node:net');
        // Read-only view of the stack's mail catcher for black-box tests that
        // reach staging through Cloudflare Access: GET /__mailpit/api/v1/...
        // maps to the catcher's API. Only GET; no delete, no UI, no websocket.
        const MAIL = '/__mailpit/api/v1/';
        http.createServer((request, response) => {
          if (request.url.startsWith('/__mailpit/')) {
            if (request.method !== 'GET' || !request.url.startsWith(MAIL)) {
              response.writeHead(405).end();
              return;
            }
            const mail = http.request({
              hostname: 'mail', port: 8025, method: 'GET',
              path: '/api/v1/' + request.url.slice(MAIL.length),
            }, result => {
              response.writeHead(result.statusCode, {
                'content-type': result.headers['content-type'] || 'application/octet-stream',
                'cache-control': 'no-store',
              });
              result.pipe(response);
            });
            mail.on('error', () => response.writeHead(502).end());
            mail.end();
            return;
          }
          // Only the local tunnel reaches this port, so Cloudflare's client
          // address is the one X-Forwarded-For; any client-sent value is dropped.
          const headers = { ...request.headers };
          const client = headers['cf-connecting-ip'];
          delete headers['x-forwarded-for'];
          headers['x-forwarded-for'] = net.isIP(client || '') ? client : request.socket.remoteAddress;
          const upstream = http.request({
            hostname: 'portal-public', port: 8080, method: request.method,
            path: request.url, headers,
          }, result => {
            response.writeHead(result.statusCode, result.headers);
            result.pipe(response);
          });
          upstream.on('error', () => response.writeHead(502).end());
          request.pipe(upstream);
        }).listen(8080, '0.0.0.0');
  tls-install:
    <<: *confined
    profiles: [operations]
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    cpus: 0.1
    mem_limit: 64m
    entrypoint: [tar, -x, --no-same-owner, -C, /]
    volumes:
      - trust:/trust
      - mail_tls:/mail
  browser-postgres:
    <<: *confined
    profiles: [operations]
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    networks: [browser]
    user: '999:999'
    cpus: 0.4
    mem_limit: 768m
    env_file: browser-postgres.env
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, max_connections=200]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    volumes:
      - /var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:size=16m,uid=999,gid=999
      - /tmp:size=32m,uid=999,gid=999
    healthcheck:
      test: [CMD, pg_isready, -q, -h, '127.0.0.1', -U, portal, -d, postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  browser:
    profiles: [operations]
    image: ${STAGING_BROWSER:?}
    pull_policy: never
    network_mode: service:browser-postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    init: true
    logging:
      driver: local
      options: {max-size: 10m, max-file: '2'}
    cpus: 1
    mem_limit: 3g
    shm_size: 256m
    env_file: browser.env
    environment:
      HOME: /tmp
      TMPDIR: /run/portal-e2e
      PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/report.json
      FORCE_COLOR: '0'
    tmpfs:
      - /tmp:size=512m,uid=10001,gid=10001
      - /run/portal-e2e:size=256m,uid=10001,gid=10001,mode=0700,exec,nosuid,nodev
  pg-tests:
    <<: *confined-process
    profiles: [operations]
    network_mode: service:browser-postgres
    image: ${STAGING_BUILDER:?}
    pull_policy: never
    cpus: 1
    mem_limit: 3g
    env_file: pg-tests.env
    tmpfs:
      - /tmp:size=128m,uid=10001,gid=10001
    volumes:
      - pg_target:/target
networks:
  net:
    name: oteryn-staging_net
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: 172.21.0.0/16}]
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  ingress:
    driver: bridge
  browser:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
volumes:
  data:
  trust:
  mail_tls:
  pg_target:
