# Rust application roles. PostgreSQL and edge retain their independently managed
# storage/network; no database volume is created or replaced by application deploy.
name: oteryn-oracle
x-portal: &portal
  image: ${PLATFORM_IMAGE:?set the reviewed Rust image}
  env_file: /opt/oteryn-oracle/platform.env
  environment:
    OTERYN_ENV: production
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  volumes:
    - /opt/oteryn-oracle/platform-secrets:/run/oteryn:ro
services:
  platform:
    <<: *portal
    command: [serve]
    networks:
      private:
        ipv4_address: 172.18.0.12
    environment:
      OTERYN_ENV: production
      OTERYN_BIND: 0.0.0.0:8080
      TRUSTED_PROXIES: 172.18.0.10
      OTERYN_PUBLIC_ORIGIN: https://oteryn.com
      PORTAL_NATIVE_ADMISSION_BIND: 127.0.0.1:8091
      PORTAL_GATEWAY_TOKEN_SHA256_FILE: /run/oteryn/gateway-token.sha256
  worker:
    <<: *portal
    command: [worker]
    networks: [private]
  migrate:
    <<: *portal
    command: [migrate]
    networks: [private]
    restart: 'no'
    profiles: [migration]
    env_file: /opt/oteryn-oracle/platform-migrate.env
  gateway:
    <<: *portal
    image: ${GATEWAY_IMAGE:?set the reviewed Rust image}
    command: [gateway]
    # The Rust issuer deliberately binds loopback. Share the portal's network
    # namespace; keep gateway HTTP on a distinct port, reached by the edge there.
    network_mode: service:platform
    environment:
      GATEWAY_TRUSTED_PROXIES: 172.18.0.10
      GATEWAY_LISTEN_ADDR: 0.0.0.0:8081
      OTERYN_PLATFORM_BASE_URL: http://127.0.0.1:8091
      OTERYN_PLATFORM_SERVICE_TOKEN_FILE: /run/oteryn/gateway-token
      GATEWAY_NATIVE_LOGIN_ENABLED: ${GATEWAY_NATIVE_LOGIN_ENABLED:-false}
      GATEWAY_NATIVE_PROTOCOL3_ENABLED: ${GATEWAY_NATIVE_PROTOCOL3_ENABLED:-false}
networks:
  private:
    external: true
    name: oteryn-oracle_private
