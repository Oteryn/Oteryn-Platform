name: oteryn-oracle-runtime

x-game-mounts: &game-mounts
  - /opt/oteryn-game:/srv/oteryn/game

services:
  game:
    image: oteryn-game:77af046ce14c-arm64
    # Each incarnation needs a new durable ops authorization and assignment.
    # The host supervisor owns restart; Docker must not replay a spent file.
    restart: 'no'
    user: '1001:1001'
    init: true
    labels:
      io.oteryn.launch-cycle: ${OTERYN_GAME_CYCLE:-uninitialized}
      io.oteryn.step-wait-receipts: ${OTERYN_STEP_WAIT_RECEIPTS:-0}
    # The image carries the World bundle, NPC data and gameplay manifest under
    # /opt/oteryn-game and sets OTERYN_NATIVE_GAMEPLAY_MANIFEST itself; nothing
    # is mounted there, and the NPC pin is the one shipped in the image.
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        exec /usr/local/bin/oteryn-game-server serve
        --config /srv/oteryn/game/node/node.toml
        --npc-data-project /opt/oteryn-game/npc-data/content/world
        --npc-data-sha256 "$$(cat /opt/oteryn-game/npc-data/PROJECT_SHA256)"
    environment:
      # Set per incarnation by game-supervisor.py from BASE/run/step-wait-receipts.
      OTERYN_STEP_WAIT_RECEIPTS: ${OTERYN_STEP_WAIT_RECEIPTS:-0}
    volumes: *game-mounts
    networks:
      platform_private:
        ipv4_address: 172.18.0.11
      game_private:
        ipv4_address: 172.30.84.11
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
  ops:
    image: oteryn-game:77af046ce14c-arm64
    profiles: [operations]
    restart: 'no'
    user: '0:0'
    entrypoint:
      - /usr/local/bin/oteryn-game-ops
      - --config
      - /srv/oteryn/game-ops/ops.toml
    volumes:
      - /opt/oteryn-game:/srv/oteryn/game
      - /opt/oteryn-game-ops:/srv/oteryn/game-ops
    networks: [platform_private, game_private]
networks:
  platform_private:
    external: true
    name: oteryn-oracle_private
  game_private:
    external: true
    name: oteryn-oracle-game_game_private
