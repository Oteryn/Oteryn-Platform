services:
  platform:
    environment:
      # Marketplace staging is browser-facing only through the canonical HTTPS
      # Cloudflare Tunnel; keep session cookies secure even if a stale base env
      # file still contains the historical loopback-only value.
      SESSION_SECURE_COOKIE: "true"
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      MARKETPLACE_ESCROW_CANARY_ACCOUNT_ID: ${MARKETPLACE_ESCROW_CANARY_ACCOUNT_ID:-0}
      CANARY_CHARACTER_TRANSFER_DB_HOST: mariadb
      CANARY_CHARACTER_TRANSFER_DB_PORT: 3306
      CANARY_CHARACTER_TRANSFER_DB_DATABASE: ${CANARY_DB_NAME}
      CANARY_CHARACTER_TRANSFER_DB_USERNAME: ${CANARY_CHARACTER_TRANSFER_DB_USER}
      CANARY_CHARACTER_TRANSFER_DB_PASSWORD: ${CANARY_CHARACTER_TRANSFER_DB_PASSWORD}

  marketplace-scheduler:
    image: ${PLATFORM_IMAGE}
    restart: always
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${PLATFORM_DB_NAME}
      DB_USERNAME: ${PLATFORM_DB_USER}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      MARKETPLACE_ESCROW_CANARY_ACCOUNT_ID: ${MARKETPLACE_ESCROW_CANARY_ACCOUNT_ID:-0}
      CANARY_CHARACTER_TRANSFER_DB_HOST: mariadb
      CANARY_CHARACTER_TRANSFER_DB_PORT: 3306
      CANARY_CHARACTER_TRANSFER_DB_DATABASE: ${CANARY_DB_NAME}
      CANARY_CHARACTER_TRANSFER_DB_USERNAME: ${CANARY_CHARACTER_TRANSFER_DB_USER}
      CANARY_CHARACTER_TRANSFER_DB_PASSWORD: ${CANARY_CHARACTER_TRANSFER_DB_PASSWORD}
    volumes:
      - platform_storage:/var/www/html/storage
    networks:
      - private
    depends_on:
      mariadb:
        condition: service_healthy
