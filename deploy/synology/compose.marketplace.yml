services:
  platform:
    environment:
      # Marketplace staging is browser-facing only through the canonical HTTPS
      # Cloudflare Tunnel. Override the historical loopback base environment
      # at the final browser-facing Compose layer.
      APP_URL: https://oteryn.molehill.cloud
      SESSION_SECURE_COOKIE: "true"
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}

  # The scheduler itself (command, image, healthcheck, restart policy, storage) is an always-on base
  # service in compose.yml; this layer only gives it the same public origin and Marketplace switch.
  marketplace-scheduler:
    environment:
      APP_URL: https://oteryn.molehill.cloud
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
