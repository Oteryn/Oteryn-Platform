# Oteryn Platform PostgreSQL on Synology (ADR 0046 §5-§6, docs/operations/PLATFORM_POSTGRES_MIGRATION_PLAN.md P4).
# deploy.sh stages this file into the bootstrap_files volume as /bootstrap/postgres-postgresql.conf and the
# postgres service reads it read-only through `-c config_file=`. initdb's own postgresql.conf in the data
# directory is ignored. Changes reach a running server through pg_reload_conf() on the next full deploy;
# a setting marked "restart" below needs a container restart.

data_directory = '/var/lib/postgresql/data'               # restart
hba_file = '/bootstrap/postgres-pg_hba.conf'               # restart
ident_file = '/var/lib/postgresql/data/pg_ident.conf'      # restart

# Private Compose network only: the service publishes no host port (compose.yml), so the listener is
# reachable only from containers on the `private` network. pg_hba.conf admits TLS logins only.
listen_addresses = '*'                                     # restart
port = 5432                                                # restart
unix_socket_directories = '/var/run/postgresql'            # restart
max_connections = 50                                       # restart
superuser_reserved_connections = 3                         # restart

password_encryption = 'scram-sha-256'

# TLS from the dedicated PostgreSQL CA, issued by tls-init (tls/init.sh). TLS 1.3 only; the server key is owned by the
# postgres user (uid 999) with mode 0600 on the read-only postgres_tls volume.
ssl = on
ssl_cert_file = '/run/oteryn-postgres-tls/server.crt'
ssl_key_file = '/run/oteryn-postgres-tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'

# Logging to the container's stderr. Statements are not logged, so a role password set by
# postgres-roles.sh never reaches the log (that script also disables statement logging per session).
log_destination = 'stderr'
logging_collector = off                                    # restart
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = off
log_statement = 'none'
log_min_error_statement = 'panic'
log_timezone = 'UTC'

timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# Modest NAS footprint; P5 (backup and PITR) owns WAL archiving and replication settings.
shared_buffers = 128MB                                     # restart
wal_level = replica                                        # restart
max_wal_senders = 3                                        # restart

# Continuous WAL archive for point-in-time recovery (plan P5, docs/operations/PLATFORM_POSTGRES_BACKUP_PITR.md).
# archive-wal.sh copies each finished segment into the postgres_backup spool with a SHA-256 checksum and
# fails (the archiver retries, the segment stays in pg_wal) while the spool is missing or nearly full.
# archive_timeout bounds the data-loss window of a healthy archive to one minute; rollback is
# archive_mode = off plus a restart (the configuration digest recreates the container).
archive_mode = on                                          # restart
archive_timeout = 60s
# Success also requires the archived file itself: a script cut short while a deploy replaces it can never
# report a segment archived that is not in the spool.
archive_command = '/bin/bash /bootstrap/postgres-backup/archive-wal.sh "%p" "%f" && test -s "/var/lib/oteryn-postgres-backup/wal/%f.gz"'
# A segment closed early by archive_timeout is still 16 MiB. New zero-filled segments instead of recycled
# ones keep the unused tail compressible, so a nearly idle minute archives a few KiB, not megabytes.
wal_recycle = off
