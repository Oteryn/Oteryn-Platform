name: ${COMPOSE_PROJECT_NAME:-oteryn-staging}

services:
  mariadb:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  platform:
    image: ${PLATFORM_IMAGE}
    restart: always
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${PLATFORM_DB_NAME}
      DB_USERNAME: ${PLATFORM_DB_USER}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256: ${GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256}
      GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256: ${GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256:-}
    ports:
      - ${PLATFORM_BIND_ADDRESS}:${PLATFORM_PORT}:8000
    volumes:
      - platform_storage:/var/www/html/storage
    networks:
      - private
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  tls-init:
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      TLS_DIR: /tls
    command: ["/bin/sh", "-ec", "apk add --no-cache openssl >/dev/null && sh /bootstrap/tls-init.sh"]
    volumes:
      - bootstrap_files:/bootstrap
      - internal_tls:/tls
    networks:
      - private

  internal-proxy:
    image: nginx:1.28-alpine
    restart: always
    command: ["nginx", "-c", "/bootstrap/internal-nginx.conf", "-g", "daemon off;"]
    volumes:
      - bootstrap_files:/bootstrap:ro
      - internal_tls:/etc/nginx/tls:ro
    networks:
      private:
        aliases:
          - platform-internal
    depends_on:
      tls-init:
        condition: service_completed_successfully
      platform:
        condition: service_started

  gateway:
    image: ${GATEWAY_IMAGE}
    restart: always
    environment:
      OTERYN_PLATFORM_BASE_URL: https://platform-internal:8443
      OTERYN_PLATFORM_SERVICE_TOKEN: ${OTERYN_PLATFORM_SERVICE_TOKEN}
      # Legacy session client kept only so the Gateway still starts; the session service is gone, so calls fail closed.
      # Removed together with the client when native admission lands.
      GAME_SESSION_SERVICE_BASE_URL: https://retired-session-service.invalid:8444
      GAME_SESSION_SERVICE_TOKEN: retired-legacy-session-client
      GATEWAY_LISTEN_ADDR: :8080
      GATEWAY_REQUEST_TIMEOUT: 5s
      GATEWAY_VERSION: ${GATEWAY_VERSION:-synology-staging}
      SSL_CERT_FILE: /etc/oteryn/tls/ca.crt
    ports:
      - ${GATEWAY_BIND_ADDRESS}:${GATEWAY_PORT}:8080
    volumes:
      - internal_tls:/etc/oteryn/tls:ro
    networks:
      - private
    depends_on:
      internal-proxy:
        condition: service_started

volumes:
  mariadb_data:
  redis_data:
  platform_storage:
  bootstrap_files:
  internal_tls:

networks:
  private:
    driver: bridge
    internal: false
