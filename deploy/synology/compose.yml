name: ${COMPOSE_PROJECT_NAME:-oteryn-staging}

# One switch for both sides of native login. The Gateway only routes protocol_version 2
# logins when the Platform issuer can admit them, so the Gateway flag is always the
# Platform flag. Synology runs APP_ENV=preproduction, the only deployed environment in which
# the Platform issuer signs. The switch is OFF unless the environment sets
# OTERYN_NATIVE_ADMISSION_ENABLED=true (repository variable OTERYN_STAGING_NATIVE_ADMISSION_ENABLED),
# and deploy.sh then refuses unless the runtime-status and scope-assignment identities, the native
# World, the issuer key volume and the Platform signing self-check are all in place;
# health-check.sh re-proves the self-check (README: Native login). Rollback and previous-candidate
# recovery force it off for a Platform image that cannot export the signing keys
# (lib.sh: oteryn_native_admission_flag_for_image). Production never takes this path.
#
# Account-character projection (LCFA) has no producer on Synology yet, so it is explicitly off and
# the D171 fallback is selected for the one configured native World (deploy.sh requires its UUID).
x-native-admission-enabled: &native_admission_enabled "${OTERYN_NATIVE_ADMISSION_ENABLED:-false}"

services:
  mariadb:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  platform:
    image: ${PLATFORM_IMAGE}
    restart: always
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${PLATFORM_DB_NAME}
      DB_USERNAME: ${PLATFORM_DB_USER}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      # Signing trust registry scope and the native evidence high-water witness, needed by
      # game-auth:native-admission:publish-trust (deploy trusts the issuer PUBLIC key), the signing
      # self-check and every identity security revocation. The witness lives on the retained
      # platform_storage volume, independent of MariaDB, so a restored database below the witness
      # fails closed (README: Native login). compose.marketplace.yml gives marketplace-scheduler the
      # same values; deploy creates the directory on every run.
      GAME_AUTH_NATIVE_EVIDENCE_FRESH_KEY_PURPOSE: fresh_admission
      GAME_AUTH_NATIVE_EVIDENCE_HIGH_WATER_DIRECTORY: /var/www/html/storage/app/native-evidence-witness
      MAIL_MAILER: array
      GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256: ${GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256}
      GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256: ${GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256:-}
      GAME_AUTH_NATIVE_ADMISSION_ENABLED: *native_admission_enabled
      GAME_AUTH_NATIVE_RUNTIME_STATUS_ENABLED: ${GAME_AUTH_NATIVE_RUNTIME_STATUS_ENABLED:-false}
      GAME_AUTH_NATIVE_RUNTIME_STATUS_IDENTITIES: ${GAME_AUTH_NATIVE_RUNTIME_STATUS_IDENTITIES:-null}
      GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_ENABLED: ${GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_ENABLED:-false}
      GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES: ${GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES:-null}
      GAME_AUTH_NATIVE_ACCOUNT_CHARACTERS_ENABLED: "false"
      GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_OWNERSHIP: "true"
      GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_WORLD_ID: ${GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_WORLD_ID:-}
      # ADR 0044: the route publication switch also admits this stack's MariaDB for the native topology
      # and route commands (preproduction-store mode, allowlisted store and configured World only).
      GAME_AUTH_NATIVE_ROUTE_PREPRODUCTION_STORE_ENABLED: ${OTERYN_NATIVE_ROUTE_PUBLISH_ENABLED:-false}
    ports:
      - ${PLATFORM_BIND_ADDRESS}:${PLATFORM_PORT}:8000
    volumes:
      - platform_storage:/var/www/html/storage
      # Issuer signing keys (current/retiring .key and .kid), read-only; the entrypoint exports the
      # key id and file path from here. Created by generate-native-admission-key.sh, never by Compose.
      - native_admission_keys:/run/oteryn-native-admission:ro
    networks:
      - private
    depends_on:
      mariadb:
        condition: service_healthy

  tls-init:
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      TLS_DIR: /tls
    command: ["/bin/sh", "-ec", "apk add --no-cache openssl >/dev/null && sh /bootstrap/tls-init.sh"]
    volumes:
      - bootstrap_files:/bootstrap
      - internal_tls:/tls
    networks:
      - private

  internal-proxy:
    image: nginx:1.28-alpine
    restart: always
    command: ["nginx", "-c", "/bootstrap/internal-nginx.conf", "-g", "daemon off;"]
    volumes:
      - bootstrap_files:/bootstrap:ro
      - internal_tls:/etc/nginx/tls:ro
    networks:
      private:
        aliases:
          - platform-internal
    depends_on:
      tls-init:
        condition: service_completed_successfully
      platform:
        condition: service_started

  gateway:
    image: ${GATEWAY_IMAGE}
    restart: always
    environment:
      OTERYN_PLATFORM_BASE_URL: https://platform-internal:8443
      OTERYN_PLATFORM_SERVICE_TOKEN: ${OTERYN_PLATFORM_SERVICE_TOKEN}
      GATEWAY_NATIVE_LOGIN_ENABLED: *native_admission_enabled
      GATEWAY_LISTEN_ADDR: :8080
      GATEWAY_REQUEST_TIMEOUT: 5s
      GATEWAY_VERSION: ${GATEWAY_VERSION:-synology-staging}
      SSL_CERT_FILE: /etc/oteryn/tls/ca.crt
    ports:
      - ${GATEWAY_BIND_ADDRESS}:${GATEWAY_PORT}:8080
    volumes:
      - internal_tls:/etc/oteryn/tls:ro
    networks:
      - private
    depends_on:
      internal-proxy:
        condition: service_started

  # Always-on Laravel scheduler (D-6): the same image as platform, no published port, started and
  # recreated with the Platform image on every deploy (lib.sh: _oteryn_reconcile_marketplace_scheduler_
  # after_runtime_change). The service name predates the move and is kept because the container hygiene
  # and Character Bazaar workflows address it by name. It shares platform_storage for the native evidence
  # witness; compose.marketplace.yml only layers the public APP_URL and MARKETPLACE_ENABLED onto it.
  marketplace-scheduler:
    image: ${PLATFORM_IMAGE}
    restart: always
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${PLATFORM_DB_NAME}
      DB_USERNAME: ${PLATFORM_DB_USER}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      # Same native evidence witness as the platform service (scheduled identity:finalize-terminations
      # writes through it).
      GAME_AUTH_NATIVE_EVIDENCE_FRESH_KEY_PURPOSE: fresh_admission
      GAME_AUTH_NATIVE_EVIDENCE_HIGH_WATER_DIRECTORY: /var/www/html/storage/app/native-evidence-witness
    volumes:
      - platform_storage:/var/www/html/storage
    networks:
      - private
    healthcheck:
      # PID 1 is the schedule:work process itself (no entrypoint wrapper), so the check proves that
      # the scheduler loop is alive and the application can still reach the database.
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'schedule:work' && php -r 'new PDO(\"mysql:host=mariadb;port=3306;dbname=\".getenv(\"DB_DATABASE\"), getenv(\"DB_USERNAME\"), getenv(\"DB_PASSWORD\"), [PDO::ATTR_TIMEOUT => 3]);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  platform_storage:
  bootstrap_files:
  internal_tls:
  native_admission_keys:
    name: oteryn-native-admission-keys
    external: true

networks:
  private:
    driver: bridge
    internal: false
