name: ${COMPOSE_PROJECT_NAME:-oteryn-staging}

# One switch for both sides of native login. The Gateway only routes protocol_version 2
# logins when the Platform issuer can admit them, so the Gateway flag is always the
# Platform flag. Synology runs APP_ENV=preproduction, the only deployed environment in which
# the Platform issuer signs. The switch is OFF unless the environment sets
# OTERYN_NATIVE_ADMISSION_ENABLED=true (repository variable OTERYN_STAGING_NATIVE_ADMISSION_ENABLED),
# and deploy.sh then refuses unless the runtime-status and scope-assignment identities, the native
# World, the issuer key volume and the Platform signing self-check are all in place;
# health-check.sh re-proves the self-check (README: Native login). Rollback and previous-candidate
# recovery force it off for a Platform image that cannot export the signing keys
# (lib.sh: oteryn_native_admission_flag_for_image). Production never takes this path.
#
# Account-character projection (LCFA) has no producer on Synology yet, so it is explicitly off and
# the D171 fallback is selected for the one configured native World (deploy.sh requires its UUID).
x-native-admission-enabled: &native_admission_enabled "${OTERYN_NATIVE_ADMISSION_ENABLED:-false}"

# Platform internal mTLS listener for the Game node (README: Platform internal mTLS listener). Off
# unless OTERYN_PLATFORM_MTLS_ENABLED=true; lib.sh resolves it and the PLATFORM_MTLS_* paths from the
# environment file or deploy/synology/native-defaults.env. When on, Platform also runs its FastCGI pool
# on the platform_fastcgi socket volume and deploy.sh starts the internal-mtls profile service.
x-internal-mtls-enabled: &internal_mtls_enabled "${OTERYN_PLATFORM_MTLS_ENABLED:-false}"

# Platform database engine (ADR 0046, docs/operations/PLATFORM_POSTGRES_MIGRATION_PLAN.md P4). lib.sh
# oteryn_platform_db_engine_settings resolves PLATFORM_DB_ENGINE from release-contract.env and exports the
# OTERYN_PLATFORM_DB_* values below; the defaults are the MariaDB engine, so a render without lib.sh is the
# MariaDB stack. On the postgres engine the runtime services get driver pgsql, host postgres, the runtime
# role oteryn_platform_app and sslmode verify-full against the stack CA (postgres_client_ca, read-only).
x-platform-db-connection: &platform_db_connection "${OTERYN_PLATFORM_DB_CONNECTION:-mysql}"
x-platform-db-host: &platform_db_host "${OTERYN_PLATFORM_DB_HOST:-mariadb}"
x-platform-db-port: &platform_db_port "${OTERYN_PLATFORM_DB_PORT:-3306}"
x-platform-db-username: &platform_db_username "${OTERYN_PLATFORM_DB_USERNAME:-${PLATFORM_DB_USER}}"
x-platform-db-password: &platform_db_password "${OTERYN_PLATFORM_DB_PASSWORD:-${PLATFORM_DB_PASSWORD}}"
x-platform-db-sslmode: &platform_db_sslmode "${OTERYN_PLATFORM_DB_SSLMODE:-prefer}"

services:
  mariadb:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Platform PostgreSQL (ADR 0046, docs/operations/PLATFORM_POSTGRES_MIGRATION_PLAN.md P4). Beside MariaDB
  # and idle until the engine switch PLATFORM_DB_ENGINE=postgres (P6): it holds only the database and the
  # role split. Profile-only: deploy.sh starts it with --profile postgres once the five PostgreSQL secrets
  # are set (README: PostgreSQL service), never by a plain `up`. No host port; TLS 1.3 and SCRAM only
  # (postgres/pg_hba.conf), with the server certificate from tls-init. The superuser password is used by
  # the image's first-start init only and never reaches a Platform service; the runtime role password is
  # here only for the TLS login probe of the healthcheck.
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    profiles: ["postgres"]
    restart: always
    command: ["postgres", "-c", "config_file=/bootstrap/postgres-postgresql.conf"]
    # Digest of the staged postgresql.conf and pg_hba.conf (lib.sh oteryn_reconcile_postgres). Startup-only
    # settings are read at server start, so a changed digest recreates the container on the next `up`.
    labels:
      oteryn.postgres-config.digest: ${OTERYN_POSTGRES_CONFIG_DIGEST:-}
    environment:
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_SUPERUSER_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256 --data-checksums --encoding=UTF8 --locale-provider=libc --locale=C.UTF-8
      OTERYN_POSTGRES_PROBE_PASSWORD: ${PLATFORM_POSTGRES_APP_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_tls:/run/oteryn-postgres-tls:ro
      - bootstrap_files:/bootstrap:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h /var/run/postgresql -U postgres -d postgres && PGPASSWORD=\"$$OTERYN_POSTGRES_PROBE_PASSWORD\" psql -X -w -q -t -A 'host=postgres port=5432 dbname=oteryn_platform user=oteryn_platform_app sslmode=verify-full sslrootcert=/run/oteryn-postgres-tls/ca.crt connect_timeout=3' -c 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      tls-init:
        condition: service_completed_successfully

  platform:
    image: ${PLATFORM_IMAGE}
    restart: always
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: *platform_db_connection
      DB_HOST: *platform_db_host
      DB_PORT: *platform_db_port
      DB_DATABASE: ${PLATFORM_DB_NAME}
      DB_USERNAME: *platform_db_username
      DB_PASSWORD: *platform_db_password
      DB_SSLMODE: *platform_db_sslmode
      DB_SSLROOTCERT: /run/oteryn-postgres-ca/ca.crt
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      # Signing trust registry scope and the native evidence high-water witness, needed by
      # game-auth:native-admission:publish-trust (deploy trusts the issuer PUBLIC key), the signing
      # self-check and every identity security revocation. The witness lives on the retained
      # platform_storage volume, independent of MariaDB, so a restored database below the witness
      # fails closed (README: Native login). compose.marketplace.yml gives marketplace-scheduler the
      # same values; deploy creates the directory on every run.
      GAME_AUTH_NATIVE_EVIDENCE_FRESH_KEY_PURPOSE: fresh_admission
      GAME_AUTH_NATIVE_EVIDENCE_HIGH_WATER_DIRECTORY: /var/www/html/storage/app/native-evidence-witness
      MAIL_MAILER: array
      GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256: ${GAME_AUTH_GATEWAY_SERVICE_TOKEN_SHA256}
      GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256: ${GAME_AUTH_GATEWAY_PREVIOUS_SERVICE_TOKEN_SHA256:-}
      GAME_AUTH_NATIVE_ADMISSION_ENABLED: *native_admission_enabled
      GAME_AUTH_NATIVE_RUNTIME_STATUS_ENABLED: ${GAME_AUTH_NATIVE_RUNTIME_STATUS_ENABLED:-false}
      GAME_AUTH_NATIVE_RUNTIME_STATUS_IDENTITIES: ${GAME_AUTH_NATIVE_RUNTIME_STATUS_IDENTITIES:-null}
      GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_ENABLED: ${GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_ENABLED:-false}
      GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES: ${GAME_AUTH_NATIVE_SCOPE_ASSIGNMENT_IDENTITIES:-null}
      # Account-character projection is on: the Game node pushes the projection (certificate subject
      # below) and the client directory lists the World from the native route record. The D171
      # fallback is off, so no native World UUID is required (README: Native login).
      GAME_AUTH_NATIVE_ACCOUNT_CHARACTERS_ENABLED: "true"
      GAME_AUTH_NATIVE_ACCOUNT_CHARACTERS_SOURCE_AUTHORITY: oteryn:character-authority:primary
      GAME_AUTH_NATIVE_ACCOUNT_CHARACTERS_IDENTITIES: '["CN=oteryn-preprod-character-projection"]'
      GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_OWNERSHIP: "false"
      GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_WORLD_ID: ${GAME_AUTH_NATIVE_ADMISSION_UNVERIFIED_CHARACTER_WORLD_ID:-}
      # ADR 0044: the route publication switch also admits this stack's MariaDB for the native topology
      # and route commands (preproduction-store mode, allowlisted store and configured World only).
      GAME_AUTH_NATIVE_ROUTE_PREPRODUCTION_STORE_ENABLED: ${OTERYN_NATIVE_ROUTE_PUBLISH_ENABLED:-false}
      OTERYN_PLATFORM_FASTCGI_ENABLED: *internal_mtls_enabled
      # Game-node routes behind internal-mtls (README: Platform internal mTLS listener). lib.sh
      # oteryn_resolve_game_node_route_settings resolves each from the environment file, then
      # native-defaults.env; the fail-closed defaults here (not activated, no client identity, no
      # binding, no TTL) make Platform answer native-evidence and character-bootstrap-intents/read
      # 503. Rate limit and source authority mirror the Platform config defaults, because an empty
      # value would replace them.
      GAME_AUTH_NATIVE_EVIDENCE_ACTIVATED: ${GAME_AUTH_NATIVE_EVIDENCE_ACTIVATED:-false}
      GAME_AUTH_NATIVE_EVIDENCE_MTLS_CLIENT_IDENTITY: ${GAME_AUTH_NATIVE_EVIDENCE_MTLS_CLIENT_IDENTITY:-}
      GAME_AUTH_NATIVE_EVIDENCE_FRESH_ACCOUNT_PURPOSE: ${GAME_AUTH_NATIVE_EVIDENCE_FRESH_ACCOUNT_PURPOSE:-}
      GAME_AUTH_NATIVE_EVIDENCE_FRESH_ACCOUNT_SCOPE: ${GAME_AUTH_NATIVE_EVIDENCE_FRESH_ACCOUNT_SCOPE:-}
      GAME_AUTH_NATIVE_EVIDENCE_CLOCK_UNCERTAINTY_SECONDS: ${GAME_AUTH_NATIVE_EVIDENCE_CLOCK_UNCERTAINTY_SECONDS:-}
      GAME_AUTH_NATIVE_EVIDENCE_SOURCE_AUTHORITY: ${GAME_AUTH_NATIVE_EVIDENCE_SOURCE_AUTHORITY:-platform}
      GAME_AUTH_NATIVE_EVIDENCE_REQUESTS_PER_MINUTE: ${GAME_AUTH_NATIVE_EVIDENCE_REQUESTS_PER_MINUTE:-120}
      GAME_AUTH_CHARACTER_BOOTSTRAP_INTENT_MTLS_CLIENT_IDENTITY: ${GAME_AUTH_CHARACTER_BOOTSTRAP_INTENT_MTLS_CLIENT_IDENTITY:-}
      GAME_AUTH_CHARACTER_BOOTSTRAP_INTENT_TTL_SECONDS: ${GAME_AUTH_CHARACTER_BOOTSTRAP_INTENT_TTL_SECONDS:-}
    ports:
      - ${PLATFORM_BIND_ADDRESS}:${PLATFORM_PORT}:8000
    volumes:
      - platform_storage:/var/www/html/storage
      # FastCGI unix socket shared only with internal-mtls (never a TCP port). nocopy keeps the tmpfs
      # owner and mode from the volume options instead of the image directory's www-data:www-data.
      - type: volume
        source: platform_fastcgi
        target: /run/oteryn-fastcgi
        volume:
          nocopy: true
      # Issuer signing keys (current/retiring .key and .kid), read-only; the entrypoint exports the
      # key id and file path from here. Created by generate-native-admission-key.sh, never by Compose.
      - native_admission_keys:/run/oteryn-native-admission:ro
      # The stack CA certificate only (no key), for sslmode=verify-full on the postgres engine.
      - postgres_client_ca:/run/oteryn-postgres-ca:ro
    networks:
      - private
    depends_on:
      mariadb:
        condition: service_healthy

  tls-init:
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      TLS_DIR: /tls
      POSTGRES_TLS_DIR: /postgres-tls
      POSTGRES_CA_DIR: /postgres-ca
      BOOTSTRAP_DIR: /bootstrap
    command: ["/bin/sh", "-ec", "apk add --no-cache openssl >/dev/null && sh /bootstrap/tls-init.sh"]
    volumes:
      - bootstrap_files:/bootstrap
      - internal_tls:/tls
      - postgres_tls:/postgres-tls
      - postgres_client_ca:/postgres-ca
    networks:
      - private

  internal-proxy:
    image: nginx:1.28-alpine
    restart: always
    command: ["nginx", "-c", "/bootstrap/internal-nginx.conf", "-g", "daemon off;"]
    volumes:
      - bootstrap_files:/bootstrap:ro
      - internal_tls:/etc/nginx/tls:ro
    networks:
      private:
        aliases:
          - platform-internal
    depends_on:
      tls-init:
        condition: service_completed_successfully
      platform:
        condition: service_started

  # TLS 1.3 mTLS terminator for the Game node on the NAS LAN address. Profile-only: nothing starts it
  # except deploy.sh's explicit reconcile while OTERYN_PLATFORM_MTLS_ENABLED=true. It holds no
  # application state and reaches Platform only through the platform_fastcgi socket, so with Platform
  # stopped or removed every request fails closed. The server chain, key and client CA are host files
  # mounted read-only, never created by Compose and never taken from tls-init.
  internal-mtls:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    profiles: ["internal-mtls"]
    restart: always
    labels:
      # Set by lib.sh oteryn_reconcile_platform_mtls; the fast deploy path compares it (deploy.sh).
      oteryn.platform-mtls.fingerprint: ${OTERYN_PLATFORM_MTLS_FINGERPRINT:-unset}
    command: ["nginx", "-c", "/bootstrap/internal-mtls-nginx.conf", "-g", "daemon off;"]
    ports:
      - ${PLATFORM_MTLS_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_MTLS_PORT:-8543}:8543
    volumes:
      - bootstrap_files:/bootstrap:ro
      - type: volume
        source: platform_fastcgi
        target: /run/oteryn-fastcgi
        volume:
          nocopy: true
      - type: bind
        source: ${PLATFORM_MTLS_SERVER_CERT_FILE:-/volume1/oteryn/preprod-platform-tls/platform-internal-preprod.fullchain.pem}
        target: /etc/nginx/internal-mtls/server-fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_MTLS_SERVER_KEY_FILE:-/volume1/oteryn/preprod-platform-tls/platform-internal-preprod.key}
        target: /etc/nginx/internal-mtls/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_MTLS_CLIENT_CA_FILE:-/volume1/oteryn/preprod-platform-tls/oteryn-preprod-ca.crt}
        target: /etc/nginx/internal-mtls/client-ca.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      - mtls_edge
    depends_on:
      platform:
        condition: service_started

  gateway:
    image: ${GATEWAY_IMAGE}
    restart: always
    environment:
      OTERYN_PLATFORM_BASE_URL: https://platform-internal:8443
      OTERYN_PLATFORM_SERVICE_TOKEN: ${OTERYN_PLATFORM_SERVICE_TOKEN}
      GATEWAY_NATIVE_LOGIN_ENABLED: *native_admission_enabled
      GATEWAY_LISTEN_ADDR: :8080
      GATEWAY_REQUEST_TIMEOUT: 5s
      GATEWAY_VERSION: ${GATEWAY_VERSION:-synology-staging}
      SSL_CERT_FILE: /etc/oteryn/tls/ca.crt
    ports:
      - ${GATEWAY_BIND_ADDRESS}:${GATEWAY_PORT}:8080
    volumes:
      - internal_tls:/etc/oteryn/tls:ro
    networks:
      - private
    depends_on:
      internal-proxy:
        condition: service_started

  # Always-on Laravel scheduler (D-6): the same image as platform, no published port, started and
  # recreated with the Platform image on every deploy (lib.sh: _oteryn_reconcile_marketplace_scheduler_
  # after_runtime_change). The service name predates the move and is kept because the container hygiene
  # and Character Bazaar workflows address it by name. It shares platform_storage for the native evidence
  # witness; compose.marketplace.yml only layers the public APP_URL and MARKETPLACE_ENABLED onto it.
  marketplace-scheduler:
    image: ${PLATFORM_IMAGE}
    restart: always
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: *platform_db_connection
      DB_HOST: *platform_db_host
      DB_PORT: *platform_db_port
      DB_DATABASE: ${PLATFORM_DB_NAME}
      DB_USERNAME: *platform_db_username
      DB_PASSWORD: *platform_db_password
      DB_SSLMODE: *platform_db_sslmode
      DB_SSLROOTCERT: /run/oteryn-postgres-ca/ca.crt
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      # Same native evidence witness as the platform service (scheduled identity:finalize-terminations
      # writes through it).
      GAME_AUTH_NATIVE_EVIDENCE_FRESH_KEY_PURPOSE: fresh_admission
      GAME_AUTH_NATIVE_EVIDENCE_HIGH_WATER_DIRECTORY: /var/www/html/storage/app/native-evidence-witness
    volumes:
      - platform_storage:/var/www/html/storage
      - postgres_client_ca:/run/oteryn-postgres-ca:ro
    networks:
      - private
    healthcheck:
      # PID 1 is the schedule:work process itself (no entrypoint wrapper), so the check proves that
      # the scheduler loop is alive and the application can still reach the database of the selected
      # engine (MariaDB, or PostgreSQL over verify-full TLS) with its own runtime credentials.
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'schedule:work' && php -r '$$p = getenv(\"DB_CONNECTION\") === \"pgsql\"; new PDO(($$p ? \"pgsql\" : \"mysql\").\":host=\".getenv(\"DB_HOST\").\";port=\".getenv(\"DB_PORT\").\";dbname=\".getenv(\"DB_DATABASE\").($$p ? \";sslmode=verify-full;sslrootcert=\".getenv(\"DB_SSLROOTCERT\") : \"\"), getenv(\"DB_USERNAME\"), getenv(\"DB_PASSWORD\"), [PDO::ATTR_TIMEOUT => 3]);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  # PostgreSQL data (P4). Never removed by a workflow: hygiene and orphan repair touch containers only
  # (tests/ci/test_synology_postgres_contract.py). Deleting mariadb_data is an explicit P6 operator step.
  postgres_data:
  platform_storage:
  bootstrap_files:
  internal_tls:
  # The postgres server pair and CA certificate (tls-init writes, postgres reads). No other service.
  postgres_tls:
  # The stack CA certificate alone, for Platform clients verifying the postgres server (verify-full).
  postgres_client_ca:
  # Memory-backed and recreated empty with its users: www-data (82) owns it for the Platform pool and
  # the nginx group (101) may enter it to connect to the socket. No other service mounts it.
  platform_fastcgi:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=82,gid=101,mode=0750"
  native_admission_keys:
    name: oteryn-native-admission-keys
    external: true

networks:
  private:
    driver: bridge
    internal: false
  # Only the published :8543 port of internal-mtls; no other service joins it, so the terminator cannot
  # reach MariaDB, Redis, Gateway or the internal proxy.
  mtls_edge:
    driver: bridge
    internal: false
