# Platform internal mTLS listener for the Game node (README: Platform internal mTLS listener).
#
# TLS 1.3 only, a client certificate from the long-lived preprod CA is mandatory, and only the
# Game-node internal routes below exist here. Platform's own middleware still authorizes every request:
# it requires SSL_CLIENT_VERIFY=SUCCESS, SSL_PROTOCOL=TLSv1.3 and an allowlisted SSL_CLIENT_S_DN. Those
# three values reach PHP only as FastCGI parameters set by this file; request headers cannot set them.
# FastCGI goes to a unix socket on a volume shared only by Platform and this terminator, never to TCP.
#
# Mounted read-only (compose.yml internal-mtls): the server certificate chain and key for
# platform-internal.preprod.oteryn.internal and the client CA trust file. None of them come from
# tls-init, so a tls-init rotation cannot break the Game node's trust in this listener.

events {}

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_buffer_size 64k;
    client_max_body_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    server {
        listen 8543 ssl;
        server_name platform-internal.preprod.oteryn.internal;

        ssl_protocols TLSv1.3;
        ssl_certificate /etc/nginx/internal-mtls/server-fullchain.pem;
        ssl_certificate_key /etc/nginx/internal-mtls/server.key;
        ssl_client_certificate /etc/nginx/internal-mtls/client-ca.crt;
        ssl_verify_client on;
        # Game node certificates are issued directly by the preprod root (no intermediate).
        ssl_verify_depth 1;
        ssl_session_tickets off;

        default_type application/octet-stream;

        # Only the Game node's internal routes, matched on the normalized path. Gateway-only routes
        # (native-admissions), the premium and public projection families and everything else are
        # not reachable here. PHP routes on the same normalized path nginx matched. The three
        # character-commands routes answer 503 until Platform enables the commands for a dedicated
        # client subject (runbook CHARACTER_AUTHORITY_COMMANDS_ENABLEMENT.md).
        location ~ ^/internal/v1/game-auth/(native-evidence|native-runtime-status|native-scope-assignments|native-account-characters|native-account-characters/watermark|character-bootstrap-intents/read|character-commands/pending|character-commands/read|character-commands/receipt)$ {
            limit_except POST { deny all; }

            fastcgi_pass unix:/run/oteryn-fastcgi/php-fpm.sock;
            fastcgi_keep_conn off;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 30s;
            fastcgi_read_timeout 30s;
            fastcgi_buffering on;
            fastcgi_request_buffering on;

            # Request headers (including Transfer-Encoding and Content-Encoding) still reach PHP as
            # HTTP_*, so Platform's HTTP bounds middleware keeps refusing them; set explicitly so a
            # global default cannot turn it off.
            fastcgi_pass_request_headers on;

            # Explicit parameter set (no shared include): the front controller is fixed and the
            # client-certificate values come only from this TLS session.
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param DOCUMENT_URI /index.php;
            fastcgi_param REQUEST_URI $uri$is_args$args;
            fastcgi_param QUERY_STRING $args;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REQUEST_SCHEME https;
            fastcgi_param HTTPS on;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param SSL_CLIENT_VERIFY $ssl_client_verify;
            fastcgi_param SSL_PROTOCOL $ssl_protocol;
            fastcgi_param SSL_CLIENT_S_DN $ssl_client_s_dn;
            # No proxy is trusted on this path: forwarding and proxy headers are blanked (httpoxy).
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTP_FORWARDED "";
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_FORWARDED_HOST "";
            fastcgi_param HTTP_X_FORWARDED_PORT "";
            fastcgi_param HTTP_X_FORWARDED_PROTO "";
            fastcgi_param HTTP_X_FORWARDED_PREFIX "";
            fastcgi_param HTTP_X_FORWARDED_AWS_ELB "";
            fastcgi_param HTTP_X_REAL_IP "";
        }

        location / {
            return 404;
        }
    }
}
