events {}

http {
    access_log off;
    error_log /dev/stderr warn;

    # Docker service IPs change whenever Compose recreates a container. Keep
    # Nginx upstream identities bound to Docker DNS rather than to the address
    # that happened to exist when internal-proxy started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream platform_backend {
        zone platform_backend 64k;
        server platform:8000 resolve;
    }

    upstream canary_session_backend {
        zone canary_session_backend 64k;
        server canary:7180 resolve;
    }

    server {
        listen 8443 ssl;
        server_name platform-internal;

        ssl_certificate /etc/nginx/tls/platform-internal.crt;
        ssl_certificate_key /etc/nginx/tls/platform-internal.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8444 ssl;
        server_name canary-session-internal;

        ssl_certificate /etc/nginx/tls/canary-session-internal.crt;
        ssl_certificate_key /etc/nginx/tls/canary-session-internal.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://canary_session_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
