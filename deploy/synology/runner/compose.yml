name: oteryn-deploy-runner

services:
  runner:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE must be set explicitly}
    restart: always
    user: "0:0"
    environment:
      RUNNER_ALLOW_RUNASROOT: "1"
      RUNNER_SCOPE: ${RUNNER_SCOPE:-repository}
      RUNNER_URL: ${RUNNER_URL:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-}
      RUNNER_NAME: ${RUNNER_NAME:-oteryn-synology-staging}
      RUNNER_LABELS: ${RUNNER_LABELS:-oteryn-staging}
      # The deploy's nested Compose mounts the same evidence source into Platform (read-only);
      # check-location refuses unless both sources match.
      OTERYN_ATTEMPT_EVIDENCE_HOST_PATH: ${OTERYN_ATTEMPT_EVIDENCE_HOST_PATH:-/volume1/oteryn-attempt-evidence}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_TOKEN_FILE: ${RUNNER_TOKEN_FILE:-}
      RUNNER_WORKDIR: /work
      RUNNER_CONFIG_DIR: /runner
    volumes:
      - runner_config:/runner
      - runner_work:/work
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OTERYN_STATE_HOST_PATH:-/volume1/docker/oteryn/state}:/var/lib/oteryn-staging-state
      # P6a D3: dedicated attempt-evidence share, written only by attempt_evidence.py. Excluded from every
      # snapshot, replication and Hyper Backup task; owned by root, group 82, mode 2750 (README).
      - ${OTERYN_ATTEMPT_EVIDENCE_HOST_PATH:-/volume1/oteryn-attempt-evidence}:/var/lib/oteryn-attempt-evidence

volumes:
  runner_config:
  runner_work:
