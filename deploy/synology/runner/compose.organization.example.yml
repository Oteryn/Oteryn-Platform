name: oteryn-organization-runners

# Organization-managed product-isolated runner estate. Runner groups must already
# exist and be restricted to the exact selected repository before first registration.
#
# Raw /var/run/docker.sock is host-equivalent privilege. It is retained here only for
# Platform and Atlas because their current proven Synology workloads require host
# Docker control. Game intentionally runs as UID/GID 1001 without Docker or root.
# `game-volume-init` is a bounded one-shot root initializer with no network and no
# host bind mounts; it only fixes ownership of the two Game named volumes, then exits.
#
# One-time registration tokens are mounted as Compose secrets from local files. Since
# Docker Compose file-backed secrets retain host ownership, the Game token file must
# be owned by UID/GID 1001 and readable only by that identity for first registration.
# After registration, blank each host token file and force-recreate the corresponding
# runner so steady state relies only on the persistent `/runner` registration state.

services:
  platform:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE must be an immutable canonical digest}
    restart: always
    user: "0:0"
    environment:
      RUNNER_ALLOW_RUNASROOT: "1"
      RUNNER_SCOPE: organization
      RUNNER_URL: ${RUNNER_ORG_URL:-https://github.com/Oteryn}
      RUNNER_GROUP: platform-runners
      RUNNER_NAME: oteryn-synology-platform
      RUNNER_LABELS: oteryn-platform
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_WORKDIR: /work
      RUNNER_CONFIG_DIR: /runner
    secrets:
      - source: platform_runner_token
        target: runner_token
    volumes:
      - platform_runner_config:/runner
      - platform_runner_work:/work
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PLATFORM_STATE_HOST_PATH:-/volume1/docker/oteryn/state}:/var/lib/oteryn-staging-state

  atlas:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE must be an immutable canonical digest}
    restart: always
    user: "0:0"
    environment:
      RUNNER_ALLOW_RUNASROOT: "1"
      RUNNER_SCOPE: organization
      RUNNER_URL: ${RUNNER_ORG_URL:-https://github.com/Oteryn}
      RUNNER_GROUP: atlas-runners
      RUNNER_NAME: oteryn-synology-atlas
      RUNNER_LABELS: oteryn-atlas
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_WORKDIR: /work
      RUNNER_CONFIG_DIR: /runner
    secrets:
      - source: atlas_runner_token
        target: runner_token
    volumes:
      - atlas_runner_config:/runner
      - atlas_runner_work:/work
      - /var/run/docker.sock:/var/run/docker.sock

  game-volume-init:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE must be an immutable canonical digest}
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        chown -R 1001:1001 /runner /work
        chmod 0700 /runner /work
    volumes:
      - game_runner_config:/runner
      - game_runner_work:/work

  game:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE must be an immutable canonical digest}
    restart: always
    user: "1001:1001"
    depends_on:
      game-volume-init:
        condition: service_completed_successfully
    environment:
      RUNNER_SCOPE: organization
      RUNNER_URL: ${RUNNER_ORG_URL:-https://github.com/Oteryn}
      RUNNER_GROUP: game-runners
      RUNNER_NAME: oteryn-synology-game
      RUNNER_LABELS: oteryn-game
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_WORKDIR: /work
      RUNNER_CONFIG_DIR: /runner
    secrets:
      - source: game_runner_token
        target: runner_token
    volumes:
      - game_runner_config:/runner
      - game_runner_work:/work

secrets:
  platform_runner_token:
    file: ${PLATFORM_RUNNER_TOKEN_FILE:?PLATFORM_RUNNER_TOKEN_FILE must point to a local one-time token file}
  atlas_runner_token:
    file: ${ATLAS_RUNNER_TOKEN_FILE:?ATLAS_RUNNER_TOKEN_FILE must point to a local one-time token file}
  game_runner_token:
    file: ${GAME_RUNNER_TOKEN_FILE:?GAME_RUNNER_TOKEN_FILE must point to a local one-time token file owned by UID/GID 1001}

volumes:
  platform_runner_config:
  platform_runner_work:
  atlas_runner_config:
  atlas_runner_work:
  game_runner_config:
  game_runner_work:
