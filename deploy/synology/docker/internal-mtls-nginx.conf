# Compatibility for a retained nginx ingress: relay TLS bytes unchanged.
# Certificate authentication and route authorization belong to the Rust listener.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
pid /var/run/nginx.pid;
events { worker_connections 128; }
stream {
    server {
        listen 8443;
        proxy_pass platform:8443;
    }
}
