# Oteryn Platform PostgreSQL client authentication (ADR 0046 §6, plan P4). Staged by deploy.sh into the
# bootstrap_files volume as /bootstrap/postgres-pg_hba.conf; reloaded with pg_reload_conf().
#
# Rules are read top to bottom and the first match wins:
# - the postgres superuser has local socket access only (peer: the OS user inside the container), used by
#   the image's first-start init and by deploy.sh's role bootstrap and contract check;
# - each Platform role may log in only over TLS (hostssl), only with SCRAM, only to its own database and
#   only from the Compose private network (samenet);
# - everything else, including any connection without TLS, is rejected.
#
# TYPE   DATABASE         USER                     ADDRESS  METHOD
local    all              postgres                          peer
hostssl  oteryn_platform  oteryn_platform_owner    samenet  scram-sha-256
hostssl  oteryn_platform  oteryn_platform_app      samenet  scram-sha-256
hostssl  oteryn_platform  oteryn_platform_dump     samenet  scram-sha-256
hostssl  replication      oteryn_platform_backup   samenet  scram-sha-256
local    all              all                               reject
host     all              all                      all      reject
host     replication      all                      all      reject
